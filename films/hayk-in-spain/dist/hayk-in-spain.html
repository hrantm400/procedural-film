<script>
// ---- src/scenes/23-burger-drop.js
/*
 * Shot 23 'burger-drop' : "The burger falls"  (global T 100.0 - 104.0, 4 s)
 *
 * 0.0 - 2.0  Slow motion / time-freeze. The half-eaten burger tumbles down in close-up past Hayk,
 *            sesame seeds and lettuce bits float, blue-white focus lines, film-strip frame lines,
 *            a slow heartbeat pulse (T 100, 101). Hayk in the background turns determined, eyes glint.
 * 2.0        (T 102.0) the burger hits the table: impact frame (3 frames), shake, crumbs, "THUD!".
 * 2.0 - 4.0  Hayk stands up (pose "fist", face "determined"), fire aura, hoodie/hair whipped by
 *            wind streaks, red-orange sunburst.
 * 2.5        (T 102.5) shout bubble "I'M COMING HOME, GOOFY!".
 *
 * Layers: background (frozen blue restaurant | hot sunburst) -> focus lines -> aura -> Hayk ->
 *   table -> burger + particles -> film strip overlay -> impact frame -> bubble / SFX.
 */
(function () {
  'use strict';
  const ID = 'burger-drop';
  const FILM = window.FILM;
  const L = FILM.lib;
  const F = FILM.fx;
  const C = F.pal;
  const TAU = Math.PI * 2;
  const clamp = F.clamp, lerp = F.lerp, h01 = F.h01;
  const { rrect, fo, ellipse } = F;
  const FR = 1 / 24;

  const B_BEAT2 = 1.0; //  T 101.0 second heartbeat
  const B_GLINT = 1.5; //  T 101.5 Hayk's eyes glint (determined)
  const B_HIT = 2.0; //    T 102.0 burger hits the table
  const B_SHOUT = 2.5; //  T 102.5 "I'M COMING HOME, GOOFY!"

  const TABLE_Y = 1480;
  const LAND_X = 320;
  const BURGER_S = 1.75;
  const HX = 600;
  const BURGER_REST_Y = TABLE_Y + 24 - 76 * BURGER_S;

  // ---------------------------------------------------------------------------
  // cached backgrounds
  // ---------------------------------------------------------------------------
  function frozenBg() {
    return L.cached(ID + '-frozen', () => {
      const c = FILM.makeCanvas(1080, 1920);
      const g = c.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, 1920);
      gr.addColorStop(0, '#20306e'); gr.addColorStop(0.55, '#4a6fc0'); gr.addColorStop(1, '#8fb4ea');
      g.fillStyle = gr; g.fillRect(0, 0, 1080, 1920);
      // restaurant shapes in duotone
      g.fillStyle = 'rgba(200,225,255,0.18)';
      // arched window
      g.beginPath(); g.moveTo(640, 1150); g.lineTo(640, 620); g.arc(820, 620, 180, Math.PI, 0); g.lineTo(1000, 1150); g.closePath(); g.fill();
      g.fillStyle = 'rgba(20,30,80,0.35)';
      g.fillRect(812, 440, 16, 710); g.fillRect(640, 860, 360, 14);
      // menu board
      g.fillStyle = 'rgba(20,30,80,0.35)'; g.fillRect(60, 560, 300, 260);
      // bunting silhouettes
      g.fillStyle = 'rgba(210,230,255,0.25)';
      for (let i = 0; i < 16; i++) {
        const x = 20 + i * 68, y = 330 + Math.sin((x / 1080) * Math.PI) * 30;
        g.beginPath(); g.moveTo(x - 26, y); g.lineTo(x + 26, y); g.lineTo(x + 26, y + 44); g.lineTo(x, y + 58); g.lineTo(x - 26, y + 44); g.closePath(); g.fill();
      }
      // pendant lamps
      [200, 540, 900].forEach((x) => {
        g.strokeStyle = 'rgba(210,230,255,0.3)'; g.lineWidth = 4;
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 400); g.stroke();
        g.fillStyle = 'rgba(210,230,255,0.3)';
        g.beginPath(); g.moveTo(x - 60, 460); g.quadraticCurveTo(x, 390, x + 60, 460); g.closePath(); g.fill();
      });
      // tiled wainscot
      for (let r = 0; r < 4; r++) for (let k = 0; k < 19; k++) {
        g.fillStyle = (r + k) % 2 ? 'rgba(20,40,110,0.35)' : 'rgba(40,70,150,0.3)';
        g.fillRect(k * 60 + 4, 1180 + r * 60 + 4, 52, 52);
      }
      return c;
    });
  }

  // film strip overlay (left and right edge), sliding slowly
  function filmStrip(ctx, t, alpha) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    const off = (t * 40) % 120;
    [[0, 70], [1010, 70]].forEach(([x, w]) => {
      ctx.fillStyle = '#0b0a14'; ctx.fillRect(x, 0, w, 1920);
      ctx.fillStyle = '#e8f2ff';
      for (let i = -1; i < 18; i++) { rrect(ctx, x + 18, i * 120 + off + 20, 34, 56, 8); ctx.fill(); }
    });
    // frame lines (horizontal), a tall "film frame" boundary drifting
    ctx.fillStyle = 'rgba(11,10,20,0.85)';
    const fo2 = (t * 40) % 960;
    for (let k = -1; k < 3; k++) ctx.fillRect(70, k * 960 + fo2 - 8, 940, 16);
    // scratches
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
    const b = L.boil(L.T);
    for (let i = 0; i < 3; i++) {
      const sx = 90 + h01(ID, 'scr', i, b) * 900;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx + 6, 1920); ctx.stroke();
    }
    ctx.restore();
  }

  // floating slow-motion debris around the falling burger
  function debris(ctx, t, cx, cy, spread, life) {
    const cols = [C.sesame, C.lettuce, C.tomato, C.cheese, C.bun];
    for (let i = 0; i < 26; i++) {
      const a = h01(ID, 'da', i) * TAU;
      const r = 120 + h01(ID, 'dr', i) * spread;
      const drift = t * (20 + h01(ID, 'dv', i) * 30);
      const x = cx + Math.cos(a) * (r + drift);
      const y = cy + Math.sin(a) * (r + drift) * 0.9 - t * 30;
      ctx.save();
      ctx.globalAlpha = life;
      ctx.translate(x, y);
      ctx.rotate(t * (h01(ID, 'dw', i) - 0.5) * 2 + i);
      const kind = i % 5;
      if (kind === 0 || kind === 3) { ellipse(ctx, 0, 0, 11, 6); fo(ctx, C.sesame, 3); }
      else if (kind === 1) { ctx.beginPath(); ctx.moveTo(-16, 0); ctx.quadraticCurveTo(0, -18, 16, 0); ctx.quadraticCurveTo(0, 8, -16, 0); fo(ctx, C.lettuce, 3); }
      else if (kind === 2) { ellipse(ctx, 0, 0, 9, 9); fo(ctx, C.tomato, 3); }
      else { rrect(ctx, -8, -6, 16, 12, 3); fo(ctx, cols[i % cols.length], 3); }
      ctx.restore();
    }
  }

  function table(ctx, hot) {
    ctx.fillStyle = hot ? '#9b5a32' : '#5d6fa8';
    ctx.fillRect(-60, TABLE_Y, 1200, 36);
    ctx.fillStyle = hot ? '#7a4424' : '#46558a';
    ctx.fillRect(-60, TABLE_Y + 36, 1200, 600);
    ctx.strokeStyle = C.line; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-60, TABLE_Y); ctx.lineTo(1140, TABLE_Y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(-60, TABLE_Y + 6, 1200, 8);
    // wood grain
    ctx.strokeStyle = hot ? 'rgba(60,25,10,0.35)' : 'rgba(20,30,70,0.35)'; ctx.lineWidth = 4;
    for (let i = 0; i < 6; i++) {
      const y = TABLE_Y + 80 + i * 70;
      ctx.beginPath(); ctx.moveTo(-60, y); ctx.bezierCurveTo(300, y - 20, 700, y + 20, 1140, y - 6); ctx.stroke();
    }
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const hot = t >= B_HIT - 1e-6;
      const hitAge = t - B_HIT;
      const impactFrames = hot && hitAge < 3 * FR - 1e-6;

      // heartbeat pulse (T 100, T 101)
      const hb = !hot ? Math.max(Math.exp(-Math.max(0, t) / 0.15) * (t >= 0 ? 1 : 0), t >= B_BEAT2 ? Math.exp(-(t - B_BEAT2) / 0.15) : 0) : 0;
      // camera
      const sh = F.shakeMany(t, [[B_HIT, 0.5, 34], [B_SHOUT, 0.4, 16]], 5);
      let z = 1 + hb * 0.025;
      if (hot) z = 1.04 + 0.04 * L.ease.outCubic(clamp(hitAge / 2));
      ctx.save();
      ctx.translate(sh[0], sh[1]);
      ctx.translate(540, 1100); ctx.scale(z, z); ctx.translate(-540, -1100);

      // ---- 1. background
      if (!hot) {
        ctx.drawImage(frozenBg(), 0, 0);
      } else {
        F.sunburst(ctx, HX, 900, { rays: 28, colorA: '#3a0a1c', colorB: '#6e1426', rot: t * 0.25 });
        const g = ctx.createRadialGradient(540, 900, 100, 540, 900, 1300);
        g.addColorStop(0, 'rgba(255,150,60,0.55)'); g.addColorStop(0.5, 'rgba(255,80,40,0)'); g.addColorStop(1, 'rgba(20,0,10,0.7)');
        ctx.fillStyle = g; ctx.fillRect(-100, -100, 1300, 2200);
      }

      // ---- 2. burger fall position
      const u = clamp(t / B_HIT);
      const fallY = (uu) => lerp(250, BURGER_REST_Y, Math.pow(uu, 1.35));
      const fallX = (uu) => lerp(760, LAND_X, uu) + Math.sin(uu * Math.PI) * 60;
      const by = hot ? BURGER_REST_Y : fallY(u);
      const bx = hot ? LAND_X : fallX(u);
      const brot = hot ? 0.08 : -0.6 + u * 3.6 + Math.sin(u * 7) * 0.1;

      // ---- 3. focus lines
      if (!hot) {
        F.focusLines(ctx, bx, by, { inner: 300, count: 100, color: '#eaf4ff', alpha: 0.75, width: 16, seed: 23, frozen: true });
      } else {
        F.focusLines(ctx, HX, 900, { inner: 420, count: 90, color: '#ffb13a', alpha: 0.5, width: 18, seed: 29 });
      }

      // ---- 4. Hayk
      const rise = hot ? L.ease.outBack(clamp(hitAge / 0.35)) : 0;
      const hs = lerp(1.9, 2.0, rise);
      const hy = lerp(1990, 1850, rise) + (hot ? Math.sin(tw * Math.PI * 4) * 4 : 0);
      if (hot) {
        const ag = clamp(hitAge / 0.3);
        F.aura(ctx, HX, hy - 40, 900 * ag, 1300 * ag, t, { alpha: 0.95 });
      }
      // hoodie billow: wind streaks behind him
      if (hot) {
        ctx.save(); ctx.globalAlpha = 0.8;
        F.speedLines(ctx, { angle: Math.PI, count: 26, color: '#fff3c0', t, speed: 2600, len: 380, width: 10, seed: 41, y: 500, h: 1000 });
        ctx.restore();
      }
      const face = t >= B_GLINT - 1e-6 ? 'determined' : 'sad';
      const tilt = hot ? Math.sin(tw * Math.PI * 3) * 0.015 : 0;
      const a = FILM.cast.hayk(ctx, {
        x: HX, y: hy, s: hs, t: tw, pose: hot ? 'fist' : 'stand', face, belly: 0.8, crown: true, tilt,
        look: [0, hot ? 0 : 0.5], alpha: 1,
      });
      // eye glints
      if (t >= B_GLINT - 1e-6) {
        const ga = t - B_GLINT;
        const k = hot ? 1 : F.pop(t, B_GLINT, 0.2);
        const r = (hot ? 22 + Math.sin(t * 12) * 4 : 30) * k;
        F.sparkle(ctx, a.eyeL[0] + 12, a.eyeL[1] - 14, r, { color: '#ffffff', rot: ga * 2 });
        F.sparkle(ctx, a.eyeR[0] + 12, a.eyeR[1] - 14, r * 0.8, { color: '#ffffff', rot: -ga * 2 });
      }
      // ---- 5. table + props
      table(ctx, hot);
      const hop = hot ? Math.max(0, Math.sin(clamp(hitAge / 0.32) * Math.PI)) * 70 : 0;
      rrect(ctx, LAND_X - 240, TABLE_Y + 10, 480, 50, 14); fo(ctx, '#e8413c', 5);
      F.fries(ctx, 820, TABLE_Y + 130 - hop, 1.15, {});
      ctx.save(); ctx.translate(1010, TABLE_Y + 170 - hop * 0.7); ctx.rotate(hot ? clamp(hitAge / 0.3) * 0.25 : 0);
      F.drink(ctx, 0, 0, 1.3, {});
      ctx.restore();
      [[120, TABLE_Y + 160, 36], [640, TABLE_Y + 120, 30], [560, TABLE_Y + 190, 26], [300, TABLE_Y + 240, 32]].forEach(([x, y, r], i) => {
        ctx.save(); ctx.translate(x, y - hop * 0.5 * (i % 2)); ctx.rotate(i * 1.3 + (hot ? hitAge * 2 * (i % 2) : 0));
        ctx.beginPath();
        for (let k = 0; k < 9; k++) { const an = (k / 9) * TAU, rr = r * (0.75 + h01(ID, 'wr', i, k) * 0.4); ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
        ctx.closePath(); fo(ctx, i % 2 ? '#ffe7a8' : '#fff4d6', 4);
        ctx.restore();
      });
      // frozen tint over everything except the falling burger (colour stays on the subject)
      if (!hot) {
        ctx.save(); ctx.globalAlpha = 0.4; ctx.fillStyle = '#3558b0';
        ctx.fillRect(-100, -100, 1300, 2200); ctx.restore();
      }

      // ---- 6. burger + particles
      if (!hot) {
        // motion ghost trail (slow motion afterimages)
        for (let k = 3; k >= 1; k--) {
          const uu = clamp(u - k * 0.035);
          ctx.save(); ctx.globalAlpha = 0.16;
          F.burger(ctx, fallX(uu), fallY(uu), BURGER_S, { bite: 0.38, rot: -0.6 + uu * 3.6 });
          ctx.restore();
        }
        F.burger(ctx, bx, by, BURGER_S, { bite: 0.38, rot: brot });
        debris(ctx, t, bx, by, 360, 1);
        // shine
        F.sparkle(ctx, bx - 110, by - 120, 30 + Math.sin(t * 8) * 6, { color: '#ffffff' });
      } else {
        // squash on landing for 2 frames, then settle
        const sq = hitAge < 2 * FR ? 1 : hitAge < 4 * FR ? 0.4 : 0;
        ctx.save();
        ctx.translate(LAND_X, TABLE_Y);
        ctx.scale(1 + sq * 0.14, 1 - sq * 0.2);
        ctx.translate(-LAND_X, -TABLE_Y);
        F.burger(ctx, LAND_X, BURGER_REST_Y, BURGER_S, { bite: 0.38, rot: 0.04 });
        ctx.restore();
        F.shockRing(ctx, LAND_X, TABLE_Y + 4, hitAge, { r: 520, color: '#fff6c0', life: 0.45, width: 26, squash: 0.25 });
        F.dust(ctx, LAND_X, TABLE_Y, hitAge, { n: 9, size: 60, spread: 420, color: '#fff0d0', seed: 9, life: 0.9 });
        F.crumbs(ctx, LAND_X, BURGER_REST_Y - 40, hitAge, { n: 22, spread: 700, seed: 13, life: 1.2 });
        // plate rattle bits
      }
      ctx.restore(); // camera

      // ---- 7. film strip (only during the time freeze, fades with the hit)
      if (!hot) filmStrip(ctx, t, 0.92);

      // heartbeat vignette + katakana
      if (!hot) {
        F.vignette(ctx, 0.35 + hb * 0.4, '10,20,60');
        ctx.save(); ctx.globalAlpha = 0.25 + hb * 0.6;
        F.text(ctx, 'ドクン', 880, 640, { size: 90, fill: '#eaf4ff', stroke: '#1b2a6a', lw: 8, rot: 0.2, font: 'jp' });
        ctx.restore();
      }

      // ---- 8. impact frame (3 frames on 102.0)
      if (impactFrames) {
        F.impact(ctx, { cx: LAND_X, cy: TABLE_Y - 60, seed: 17 });
        FILM.cast.hayk(ctx, { x: HX, y: 1990, s: 1.9, t: tw, pose: 'fist', face: 'determined', belly: 0.8, crown: false, silhouette: '#0a0a10' });
        ctx.fillStyle = '#0a0a10'; ctx.fillRect(0, TABLE_Y, 1080, 440);
        F.burger(ctx, LAND_X, BURGER_REST_Y, BURGER_S * 1.1, { bite: 0.38, rot: 0.04 });
      }

      // ---- 9. text
      if (hot) {
        F.sfx(ctx, 'THUD!', 300, 1130, t, B_HIT, { size: 150, fill: C.sfxYellow, rot: -0.2, life: 1.2 });
        F.menace(ctx, 930, 1300, t, { size: 70, color: '#ffcc33', n: 3, seed: 7 });
      }
      if (t >= B_SHOUT - 1e-6) {
        const sk = F.shake(t, B_SHOUT, 0.5, 10, 3);
        F.bubble(ctx, "I'M COMING HOME, GOOFY!", 500 + sk[0], 410 + sk[1], {
          size: 70, maxW: 600, shout: true, t, t0: B_SHOUT, tail: [a.head[0] - 250, a.head[1] - 40], fill: '#ffffff', shake: 6,
        });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/24-fly-home.js
/*
 * Shot 24 'fly-home' : "Flying home"  (global T 104.0 - 108.0, 4 s, wipe in from the left)
 *
 * 0.0 - 2.2  The Europe map (reprise of shot 06, reversed): the plane rockets Spain -> Armenia
 *            along the dotted arc, leaving a fire trail, speed lines everywhere. The plane rides
 *            low and heavy: a burger-shaped bag dangles from its open cargo door.
 *            Caption bar "SPAIN -> YEREVAN" (from 0.0) and stamp "MISSION: GOOFY" (slams at 0.5).
 * 2.2 - 2.5  Crash-zoom into Armenia (focus lines).
 * 2.5        (T 106.5) cut to Zvartnots runway at golden hour, Ararat behind: the plane slams down
 *            and skids, huge dust cloud, sparks, "SKRRT!".
 *
 * Layers: map (sea, land, grid, flags) -> fire trail -> dotted arc -> plane + bag -> speed lines
 *   -> captions | runway (sky, Ararat, terminal, runway) -> dust -> plane -> sparks -> SKRRT! -> captions.
 */
(function () {
  'use strict';
  const ID = 'fly-home';
  const FILM = window.FILM;
  const L = FILM.lib;
  const F = FILM.fx;
  const C = F.pal;
  const TAU = Math.PI * 2;
  const clamp = F.clamp, lerp = F.lerp, h01 = F.h01;
  const { rrect, fo, ellipse, poly } = F;
  const FR = 1 / 24;

  const B_FLY0 = 0.0; //   T 104.0 plane leaves Spain
  const B_FLY1 = 2.1; //   T 106.1 plane reaches Armenia
  const B_STAMP = 0.5; //  T 104.5 "MISSION: GOOFY" stamp
  const B_ZOOM = 2.1; //   T 106.1 crash zoom
  const B_LAND = 2.5; //   T 106.5 touchdown, SKRRT!

  // map anchors
  const SPAIN = [190, 1090];
  const ARMENIA = [990, 1004];
  const CTRL = [600, 640];

  const bez = (u) => {
    const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return [a * SPAIN[0] + b * CTRL[0] + c * ARMENIA[0], a * SPAIN[1] + b * CTRL[1] + c * ARMENIA[1]];
  };
  const bezTan = (u) => {
    const dx = 2 * (1 - u) * (CTRL[0] - SPAIN[0]) + 2 * u * (ARMENIA[0] - CTRL[0]);
    const dy = 2 * (1 - u) * (CTRL[1] - SPAIN[1]) + 2 * u * (ARMENIA[1] - CTRL[1]);
    return Math.atan2(dy, dx);
  };

  // ---------------------------------------------------------------------------
  // Map (static, cached)
  // ---------------------------------------------------------------------------
  const EUROPE = [
    [470, 640], [520, 600], [560, 560], [600, 520], [620, 420], [660, 280],
    [1260, 280], [1260, 880], [1050, 890], [1010, 940], [1050, 975], [1260, 990], [1260, 1140],
    [1000, 1135], [900, 1122], [820, 1112], [770, 1090], [752, 1050], [782, 1016],
    [740, 1000], [722, 1058], [700, 1086], [684, 1040], [668, 990], [640, 946], [606, 904],
    [612, 950], [632, 1000], [656, 1050], [672, 1086], [648, 1102], [624, 1076], [600, 1030], [572, 985], [545, 940], [520, 905],
    [465, 930], [405, 950], [352, 1000], [332, 1062], [302, 1130], [252, 1180], [172, 1200], [112, 1180], [72, 1120],
    [62, 1032], [112, 992], [202, 990], [290, 982], [302, 905], [245, 852], [302, 802], [362, 762], [420, 720],
  ];
  const SCANDI = [[560, 280], [520, 380], [540, 460], [600, 500], [640, 430], [680, 360], [720, 280]];
  const UK = [[270, 520], [320, 500], [345, 580], [365, 660], [332, 722], [262, 732], [284, 662], [252, 600]];
  const AFRICA = [[-40, 1400], [100, 1368], [250, 1356], [400, 1388], [520, 1378], [620, 1420], [700, 1446], [800, 1422], [900, 1404], [1000, 1384], [1120, 1372], [1260, 1380], [1260, 1980], [-40, 1980]];
  const IBERIA = [[352, 1000], [332, 1062], [302, 1130], [252, 1180], [172, 1200], [112, 1180], [72, 1120], [62, 1032], [112, 992], [202, 990], [290, 982], [330, 990]];
  const ARM = [[962, 986], [990, 978], [1016, 990], [1022, 1016], [1004, 1032], [976, 1030], [960, 1010]];

  function mapBg() {
    return L.cached(ID + '-map', () => {
      const c = FILM.makeCanvas(1240, 1920);
      const g = c.getContext('2d');
      const sg = g.createLinearGradient(0, 0, 0, 1920);
      sg.addColorStop(0, '#2f7fd0'); sg.addColorStop(0.5, '#3f9be6'); sg.addColorStop(1, '#2a6cc0');
      g.fillStyle = sg; g.fillRect(0, 0, 1240, 1920);
      // wave ticks
      g.strokeStyle = 'rgba(255,255,255,0.22)'; g.lineWidth = 4; g.lineCap = 'round';
      for (let i = 0; i < 40; i++) {
        const x = h01(ID, 'wx', i) * 1240, y = h01(ID, 'wy', i) * 1920;
        g.beginPath(); g.arc(x, y, 14, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
      }
      // grid
      g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = 2;
      for (let x = 0; x <= 1240; x += 135) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1920); g.stroke(); }
      for (let y = 0; y <= 1920; y += 160) { g.beginPath(); g.moveTo(0, y); g.lineTo(1240, y); g.stroke(); }
      const land = (pts, fill) => {
        // shallow-water halo
        g.save();
        g.lineJoin = 'round';
        poly(g, pts); g.lineWidth = 26; g.strokeStyle = 'rgba(160,220,255,0.45)'; g.stroke();
        poly(g, pts); g.fillStyle = fill; g.fill();
        g.lineWidth = 5; g.strokeStyle = C.line; g.stroke();
        g.restore();
      };
      land(AFRICA, '#f0cf8e');
      land(EUROPE, '#b9dc8a');
      land(SCANDI, '#b9dc8a');
      land(UK, '#b9dc8a');
      g.save(); ellipse(g, 205, 640, 38, 54); g.fillStyle = '#b9dc8a'; g.fill(); g.lineWidth = 5; g.strokeStyle = C.line; g.stroke(); g.restore();
      // seas cut out of the land
      [[850, 955, 95, 42, -0.1], [1120, 920, 70, 90, 0], [640, 520, 40, 90, 0.4]].forEach(([x, y, rx, ry, r]) => {
        g.save(); ellipse(g, x, y, rx, ry, r); g.fillStyle = '#3f9be6'; g.fill(); g.lineWidth = 5; g.strokeStyle = C.line; g.stroke(); g.restore();
      });
      // islands
      [[530, 1000, 12, 26], [600, 1135, 26, 13], [760, 1150, 26, 8], [880, 1170, 20, 9], [345, 1100, 16, 9]].forEach(([x, y, rx, ry]) => {
        g.save(); ellipse(g, x, y, rx, ry); g.fillStyle = '#b9dc8a'; g.fill(); g.lineWidth = 4; g.strokeStyle = C.line; g.stroke(); g.restore();
      });
      // country borders (soft dashed)
      g.save();
      g.setLineDash([10, 10]); g.strokeStyle = 'rgba(40,80,40,0.45)'; g.lineWidth = 3;
      [[[330, 990], [360, 900], [440, 820]], [[440, 820], [520, 780], [600, 800], [640, 880]], [[520, 700], [560, 800]], [[700, 640], [720, 800], [760, 900]], [[820, 700], [900, 860]], [[760, 1000], [800, 960]]].forEach((ln) => {
        g.beginPath(); ln.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke();
      });
      g.restore();
      // highlight Spain and Armenia
      g.save(); poly(g, IBERIA); g.fillStyle = '#ffd35a'; g.fill(); g.lineWidth = 5; g.strokeStyle = C.line; g.stroke(); g.restore();
      g.save(); poly(g, ARM); g.fillStyle = '#ff7a4a'; g.fill(); g.lineWidth = 5; g.strokeStyle = C.line; g.stroke(); g.restore();
      // compass rose (Africa)
      g.save(); g.translate(170, 1620);
      g.fillStyle = '#fff6e3'; g.strokeStyle = C.line; g.lineWidth = 4;
      for (let i = 0; i < 4; i++) {
        g.save(); g.rotate(i * Math.PI / 2);
        g.beginPath(); g.moveTo(0, -90); g.lineTo(18, 0); g.lineTo(-18, 0); g.closePath(); g.fillStyle = i === 0 ? '#e8413c' : '#fff6e3'; g.fill(); g.stroke();
        g.restore();
      }
      g.beginPath(); g.arc(0, 0, 14, 0, TAU); g.fillStyle = '#ffcc33'; g.fill(); g.stroke();
      g.restore();
      return c;
    });
  }

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------
  function pin(ctx, x, y, t, color) {
    const b = 1 + 0.12 * F.beatPulse(t);
    ctx.save(); ctx.translate(x, y); ctx.scale(b, b);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-30, -40, -30, -70, 0, -74); ctx.bezierCurveTo(30, -70, 30, -40, 0, 0);
    fo(ctx, color, 5);
    ctx.beginPath(); ctx.arc(0, -50, 10, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.restore();
  }

  // burger bag hanging from the cargo door; drawn in plane-local units (s = plane scale)
  function cargoBag(ctx, s, swing, t) {
    const dx = 30, dy = 34;
    const bx = dx + Math.sin(swing) * 120, by = dy + Math.cos(swing) * 120;
    ctx.save();
    ctx.strokeStyle = C.line; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(dx, dy); ctx.quadraticCurveTo((dx + bx) / 2 + 8, (dy + by) / 2 + 10, bx, by - 30); ctx.stroke();
    // the bag: a burger-shaped sack
    F.burger(ctx, bx, by + 20, 0.7, { rot: swing * 0.6 });
    // tag
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(bx + 50, by - 36, 9, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function cargoDoor(ctx) {
    // open hatch on the fuselage belly
    rrect(ctx, 0, 6, 64, 28, 5); fo(ctx, '#2a2233', 4);
    ctx.beginPath(); ctx.moveTo(0, 34); ctx.lineTo(64, 34); ctx.lineTo(74, 62); ctx.lineTo(8, 62); ctx.closePath(); fo(ctx, '#dde5f2', 4);
  }

  function fireTrail(ctx, u0, u1, t) {
    // thick flame ribbon from u0 to u1 along the arc, hottest near the plane (u1)
    const n = 36;
    const b = L.boil(L.T);
    for (let layer = 0; layer < 3; layer++) {
      const col = ['#ff4a1a', '#ff9a2a', '#fff06a'][layer];
      const wmax = [70, 44, 20][layer];
      ctx.save();
      ctx.globalAlpha = [0.85, 0.9, 1][layer];
      ctx.fillStyle = col;
      ctx.beginPath();
      const left = [], right = [];
      for (let i = 0; i <= n; i++) {
        const u = lerp(u0, u1, i / n);
        const p = bez(u);
        const a = bezTan(u);
        const k = i / n; // 0 tail .. 1 plane
        const flick = 0.75 + h01(ID, 'ft', layer, i, b) * 0.5;
        const w = wmax * Math.pow(k, 0.8) * flick;
        left.push([p[0] - Math.sin(a) * w, p[1] + Math.cos(a) * w]);
        right.push([p[0] + Math.sin(a) * w, p[1] - Math.cos(a) * w]);
      }
      left.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    // embers
    for (let i = 0; i < 16; i++) {
      const u = lerp(u0, u1, h01(ID, 'em', i));
      const p = bez(u);
      const age = (t * 3 + h01(ID, 'ea', i)) % 1;
      ctx.save(); ctx.globalAlpha = 1 - age;
      ctx.fillStyle = i % 2 ? '#ffcc33' : '#ff6a2a';
      ctx.beginPath(); ctx.arc(p[0] + (h01(ID, 'ex', i) - 0.5) * 80, p[1] + (h01(ID, 'ey', i) - 0.5) * 80 - age * 40, 7 * (1 - age) + 2, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  function dottedArc(ctx, u0, u1) {
    ctx.save();
    ctx.setLineDash([22, 18]);
    ctx.lineCap = 'round';
    ctx.strokeStyle = C.line; ctx.lineWidth = 14;
    const path = () => { ctx.beginPath(); for (let i = 0; i <= 40; i++) { const p = bez(lerp(u0, u1, i / 40)); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); } };
    path(); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8;
    path(); ctx.stroke();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Part 1: map flight
  // ---------------------------------------------------------------------------
  function drawMap(ctx, t, tw) {
    const u = L.ease.inOutSine(clamp((t - B_FLY0) / (B_FLY1 - B_FLY0)));
    const pp = bez(u);
    const ang = bezTan(u);
    // camera: gentle follow, then crash-zoom into Armenia
    const zk = L.ease.inQuad(clamp((t - B_ZOOM) / (B_LAND - B_ZOOM)));
    const z0 = 1.3;
    const z = lerp(z0, 4.2, zk);
    const cx0 = clamp(lerp(540, pp[0], 0.7), 540 / z0, 1080 - 540 / z0);
    const cy0 = lerp(1000, pp[1], 0.25) + 20;
    const cxF = lerp(cx0, ARMENIA[0], zk);
    const cyF = lerp(cy0, ARMENIA[1] - 20, zk);
    ctx.save();
    ctx.translate(540, 1000); ctx.scale(z, z); ctx.translate(-cxF, -cyF);
    ctx.drawImage(mapBg(), 0, 0);
    // clouds drifting over the map (parallax)
    ctx.save(); ctx.globalAlpha = 0.85;
    [[150, 420, 170], [760, 330, 200], [420, 1560, 190], [900, 1650, 160]].forEach(([x, y, w], i) => {
      F.cloud(ctx, ((x - t * 60 * (1 + i * 0.3)) % 1300 + 1300) % 1300 - 110, y, w);
    });
    ctx.restore();
    // pins + flags
    F.flag(ctx, SPAIN[0] - 20, SPAIN[1] - 10, 0.55, 'ES', { t });
    F.flag(ctx, ARMENIA[0] - 110, ARMENIA[1] - 20, 0.55, 'AM', { t });
    pin(ctx, SPAIN[0], SPAIN[1], t, '#ffcc33');
    pin(ctx, ARMENIA[0], ARMENIA[1], t, '#e8413c');
    F.tag(ctx, 'SPAIN', SPAIN[0] + 10, SPAIN[1] + 50, { size: 30 });
    F.tag(ctx, 'YEREVAN', ARMENIA[0] - 60, ARMENIA[1] + 50, { size: 30, bg: '#e8413c' });
    // sail boats bobbing on the Mediterranean
    [[420, 1230, 0], [760, 1300, 1], [250, 1330, 2], [930, 1250, 3]].forEach(([x, y, i]) => {
      const bb = Math.sin(t * 5 + i) * 4;
      ctx.save(); ctx.translate(x, y + bb); ctx.rotate(Math.sin(t * 4 + i) * 0.08);
      ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(34, 0); ctx.lineTo(24, 16); ctx.lineTo(-24, 16); ctx.closePath(); fo(ctx, '#ffffff', 4);
      ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(0, -60); ctx.lineTo(30, -8); ctx.closePath(); fo(ctx, i % 2 ? '#ffcc33' : '#e8413c', 4);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-60, 22); ctx.lineTo(-30, 22); ctx.moveTo(40, 24); ctx.lineTo(60, 24); ctx.stroke();
      ctx.restore();
    });
    // the plane's shadow on the map (it flies low)
    ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = '#10142a';
    ellipse(ctx, pp[0] + 40, pp[1] + 190, 150, 26, ang * 0.6); ctx.fill();
    ctx.restore();
    // arc: dotted ahead, fire behind
    dottedArc(ctx, u, 1);
    fireTrail(ctx, Math.max(0, u - 0.55), u, t);
    // the plane: low and heavy, bobbing
    const bob = Math.sin(tw * Math.PI * 6) * 6;
    const s = 0.62;
    ctx.save();
    ctx.translate(pp[0], pp[1] + bob);
    ctx.rotate(ang + 0.1);
    ctx.scale(s, s);
    cargoBag(ctx, s, -0.5 + Math.sin(t * 9) * 0.25, t);
    F.plane(ctx, 0, 0, 1, {});
    cargoDoor(ctx);
    // afterburner flame at the tail
    const fl = 0.8 + h01(ID, 'ab', L.boil(L.T)) * 0.4;
    ctx.beginPath(); ctx.moveTo(-285, -30); ctx.quadraticCurveTo(-420 * fl, -10, -500 * fl, 0); ctx.quadraticCurveTo(-420 * fl, 14, -285, 20); ctx.closePath(); fo(ctx, '#ff7a1a', 4);
    ctx.beginPath(); ctx.moveTo(-285, -18); ctx.quadraticCurveTo(-370 * fl, -6, -410 * fl, 0); ctx.quadraticCurveTo(-370 * fl, 8, -285, 10); ctx.closePath(); fo(ctx, '#ffe066', 0);
    ctx.restore();
    // sweat drop on the struggling plane
    F.sweat(ctx, pp[0] + 80, pp[1] - 100 + bob, 1.0, {});
    ctx.restore();

    // screen-fixed speed lines along the flight direction
    ctx.save();
    F.speedLines(ctx, { angle: ang, count: 34, color: '#ffffff', alpha: 0.55, t, speed: 3600, len: 520, width: 7, seed: 44 });
    ctx.restore();
    if (t >= B_ZOOM) {
      F.focusLines(ctx, 540, 1000, { inner: 300 - zk * 120, count: 110, color: '#ffffff', alpha: 0.5 + zk * 0.4, width: 16, seed: 46 });
    }
  }

  // ---------------------------------------------------------------------------
  // Part 2: the runway landing
  // ---------------------------------------------------------------------------
  function runwayBg() {
    return L.cached(ID + '-runway', () => {
      const c = FILM.makeCanvas(1080, 1920);
      const g = c.getContext('2d');
      const sg = g.createLinearGradient(0, 0, 0, 1150);
      sg.addColorStop(0, '#ff7e5f'); sg.addColorStop(0.55, '#ffb070'); sg.addColorStop(1, '#ffe1a0');
      g.fillStyle = sg; g.fillRect(0, 0, 1080, 1160);
      // sun
      const rg = g.createRadialGradient(820, 820, 30, 820, 820, 320);
      rg.addColorStop(0, 'rgba(255,250,210,1)'); rg.addColorStop(0.3, 'rgba(255,240,170,0.8)'); rg.addColorStop(1, 'rgba(255,220,150,0)');
      g.fillStyle = rg; g.fillRect(400, 400, 900, 900);
      // Ararat
      F.ararat(g, 40, 1110, 1000, 520, { color: '#8a78b8', shade: '#6f5f9f', snow: '#fff2ea' });
      // far hills
      g.fillStyle = '#9c7fa8';
      g.beginPath(); g.moveTo(0, 1110); for (let i = 0; i <= 12; i++) g.lineTo(i * 90, 1080 + Math.sin(i * 1.7) * 18); g.lineTo(1080, 1160); g.lineTo(0, 1160); g.closePath(); g.fill();
      // terminal building + tower (right)
      g.fillStyle = '#e9d9c8'; g.strokeStyle = C.line; g.lineWidth = 4;
      g.beginPath(); g.moveTo(640, 1150); g.lineTo(640, 1040); g.quadraticCurveTo(820, 980, 1080, 1030); g.lineTo(1080, 1150); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#5b86c4';
      for (let i = 0; i < 9; i++) g.fillRect(660 + i * 46, 1070, 34, 40);
      g.fillStyle = '#e9d9c8'; g.fillRect(570, 880, 40, 270); g.strokeRect(570, 880, 40, 270);
      g.beginPath(); g.moveTo(545, 880); g.lineTo(635, 880); g.lineTo(620, 830); g.lineTo(560, 830); g.closePath(); g.fillStyle = '#5b86c4'; g.fill(); g.stroke();
      g.fillStyle = '#e8413c'; g.fillRect(585, 800, 10, 30);
      // ground
      g.fillStyle = '#c9a36a'; g.fillRect(0, 1150, 1080, 770);
      g.fillStyle = '#b48d56';
      for (let i = 0; i < 30; i++) g.fillRect(h01(ID, 'gx', i) * 1080, 1160 + h01(ID, 'gy', i) * 80, 40, 5);
      // runway (perspective band)
      g.fillStyle = '#56535e';
      g.beginPath(); g.moveTo(-200, 1330); g.lineTo(1280, 1250); g.lineTo(1280, 1560); g.lineTo(-200, 1720); g.closePath(); g.fill();
      g.strokeStyle = '#f4f4f4'; g.lineWidth = 8;
      g.beginPath(); g.moveTo(-200, 1340); g.lineTo(1280, 1260); g.stroke();
      g.beginPath(); g.moveTo(-200, 1706); g.lineTo(1280, 1548); g.stroke();
      // skid marks
      g.strokeStyle = 'rgba(20,18,26,0.5)'; g.lineWidth = 10;
      g.beginPath(); g.moveTo(-100, 1520); g.lineTo(560, 1460); g.stroke();
      g.beginPath(); g.moveTo(-100, 1560); g.lineTo(560, 1500); g.stroke();
      // foreground grass tufts
      g.fillStyle = '#8fae5a';
      for (let i = 0; i < 26; i++) {
        const x = h01(ID, 'tx', i) * 1080, y = 1760 + h01(ID, 'ty', i) * 140;
        g.beginPath(); g.moveTo(x - 16, y); g.lineTo(x - 4, y - 30); g.lineTo(x + 2, y); g.lineTo(x + 10, y - 26); g.lineTo(x + 18, y); g.closePath(); g.fill();
      }
      return c;
    });
  }

  function drawRunway(ctx, t, tw) {
    const age = t - B_LAND;
    const sh = F.shakeMany(t, [[B_LAND, 0.7, 30]], 12);
    // plane skid: fast -> stop
    const k = L.ease.outCubic(clamp(age / 1.3));
    const px = lerp(260, 600, k);
    const drop = Math.max(0, 1 - age / (3 * FR)) * 60; // slam down over 3 frames
    const bounce = age < 0.5 ? -Math.abs(Math.sin(age * Math.PI * 4)) * 18 * (1 - age / 0.5) : 0;
    const py = 1290 - drop + bounce;
    const rot = age < 0.12 ? -0.06 : 0.015 * Math.sin(age * 20) * Math.max(0, 1 - age);
    const s = 1.7;
    ctx.save();
    ctx.translate(sh[0], sh[1]);
    ctx.translate(540, 960); ctx.scale(1.05, 1.05); ctx.translate(-540, -960);
    ctx.drawImage(runwayBg(), 0, 0);
    // runway centre dashes streaming left (skid speed)
    const spd = (1 - k);
    ctx.save();
    ctx.fillStyle = '#f4f4f4';
    const off = (age * 1400 * (1 - k * 0.8)) % 220;
    for (let i = -1; i < 8; i++) {
      const x = i * 220 - off;
      const y1 = 1520 - (x + 200) * (1520 - 1405) / 1480;
      ctx.save(); ctx.translate(x, y1); ctx.rotate(-0.078); ctx.fillRect(0, -7, 120, 14); ctx.restore();
    }
    ctx.restore();
    // birds scattering
    for (let i = 0; i < 5; i++) {
      const bx = 180 + i * 90 + age * 200, by = 700 - i * 30 - age * 160;
      const flap = Math.sin(t * 20 + i) * 10;
      ctx.strokeStyle = C.line; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(bx - 16, by - flap); ctx.lineTo(bx, by); ctx.lineTo(bx + 16, by - flap); ctx.stroke();
    }
    // dust cloud behind the wheels (big)
    const wheelY = py + 90 * s;
    const fade = 1 - clamp((age - 0.9) / 0.9) * 0.6;
    for (let i = 0; i < 18; i++) {
      const a = h01(ID, 'dc', i);
      const grow = L.ease.outCubic(clamp(age / 0.5));
      const dx = 60 - i * 55 * (0.4 + grow) - a * 80 - age * 40;
      const dy = -a * 190 * grow - 10 - i * 4 * grow;
      const r = (80 + a * 110) * (0.4 + grow) * (1 - i * 0.015);
      ctx.save(); ctx.globalAlpha = (0.97 - i * 0.025) * fade;
      ellipse(ctx, px - 200 + dx, wheelY + dy, r * 1.25, r); fo(ctx, i % 3 ? '#f3e2c0' : '#e2c99a', 4, 'rgba(27,20,36,0.55)');
      ctx.restore();
    }
    F.dust(ctx, px - 150, wheelY, age, { n: 10, size: 90, spread: 520, color: '#f6e6c6', seed: 21, life: 1.2 });
    F.dust(ctx, px + 250, wheelY, age - 0.05, { n: 7, size: 80, spread: 380, color: '#f6e6c6', seed: 23, life: 1.0 });
    // horizontal speed lines while skidding
    ctx.save(); ctx.globalAlpha = spd;
    F.speedLines(ctx, { angle: 0, count: 26, color: '#ffffff', alpha: 0.7, t, speed: 3000, len: 460, width: 8, seed: 27, y: 700, h: 900 });
    ctx.restore();

    // the plane
    ctx.save();
    ctx.translate(px, py); ctx.rotate(rot); ctx.scale(s, s);
    // landing gear
    ctx.strokeStyle = C.line; ctx.lineWidth = 8;
    [[-60, 32], [190, 32]].forEach(([gx, gy]) => {
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy + 48); ctx.stroke();
      ctx.beginPath(); ctx.arc(gx, gy + 58, 17, 0, TAU); ctx.fillStyle = '#2a2233'; ctx.fill(); ctx.lineWidth = 4; ctx.stroke(); ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(gx, gy + 58, 6, 0, TAU); ctx.fillStyle = '#c9d3e6'; ctx.fill();
    });
    // swinging burger bag (swings forward on the brake)
    const sw = 0.9 * Math.exp(-age * 2.5) * Math.cos(age * 9) + 0.25;
    cargoBag(ctx, s, sw, t);
    F.plane(ctx, 0, 0, 1, {});
    cargoDoor(ctx);
    ctx.restore();
    // sparks from the wheels
    if (age < 1.2) {
      const b = L.boil(L.T);
      ctx.save();
      ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      [-60, 190].forEach((gx, j) => {
        const wx = px + gx * s, wy = py + 90 * s;
        for (let i = 0; i < 6; i++) {
          const a = Math.PI + 0.2 + h01(ID, 'sp', j, i, b) * 0.8;
          const len = (40 + h01(ID, 'sl', j, i, b) * 80) * (1 - age / 1.2);
          ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + Math.cos(a) * len, wy - Math.sin(a) * len * 0.5); ctx.stroke();
        }
      });
      ctx.restore();
    }
    // crumbs flung from the bag
    F.crumbs(ctx, px + 30 * s, py + 160 * s, age, { n: 12, spread: 500, seed: 19, life: 0.9 });
    ctx.restore();
    // impact flash on touchdown
    if (age < 2 * FR) F.flash(ctx, 0.55, '#fff6e0');
    F.sfx(ctx, 'SKRRT!', 540, 760, t, B_LAND, { size: 210, fill: C.sfxYellow, rot: -0.1, shadowColor: '#b3122b' });
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      if (t < B_LAND - 1e-6) drawMap(ctx, t, tw);
      else drawRunway(ctx, t, tw);

      // captions (screen-fixed)
      F.caption(ctx, 'SPAIN -> YEREVAN', 540, 300, { size: 66, align: 'center', bg: C.line, accent: C.gold });
      if (t >= B_STAMP - 1e-6) F.stamp(ctx, 'MISSION: GOOFY', 560, 450, t, B_STAMP, { size: 84, color: '#e3243b', rot: -0.1 });
    },
  });
})();

</script>
<script>
// ---- src/scenes/25-reunion.js
// Shot 25 'reunion' : The reunion. Global T 108..114 (6 s).
// Anime slow-motion reunion run through a golden-hour flower field. Hayk (run, cry, belly 0.8) from
// the left, Goofy (run, happy) from the right. Close-up panels of both faces during the run.
// 2.0 s: they meet, white flash, Goofy leaps into Hayk's arms (hug), hearts burst.
// Grant lies flat in the background (collapse, exhausted); "FINALLY..." bubble at 4.0 s.
//
// Layers (back to front):
//   1 cached background: golden sky, sun glow, faint Ararat, hills, flower field
//   2 god rays + far bokeh
//   3 Grant collapsed in the mid field
//   4 hug sunburst glow (after 2.0)
//   5 Hayk + Goofy (run / leap / hug) with the arms-over trick for the hug
//   6 foreground flowers, petals, near bokeh, hearts, sparkles
//   7 screen-fixed: close-up panels (0.45..1.8), flash, bubble, slow-mo vignette
(function () {
  'use strict';
  const ID = 'reunion';
  const FILM = window.FILM;
  const LIB = FILM.lib;
  const F = FILM.fx;
  const C = F.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const W = 1080, H = 1920;
  const h01 = (...k) => F.h01(ID, ...k);

  // beats (local t; global = 108 + t)
  const T_PANEL_IN = 0.45; // T 108.45
  const T_LEAP = 1.75; //     T 109.75
  const T_MEET = 2.0; //      T 110.0 flash, hug
  const T_FINALLY = 4.0; //   T 112.0 Grant's bubble

  const GROUND = 1590; // hero ground line
  const HORIZON = 1010;
  const HAYK_S = 1.3, GOOFY_S = 1.45;

  // ---------------------------------------------------------------------------
  // 1. static background (constants only)
  // ---------------------------------------------------------------------------
  function flowerHead(g, x, y, r, petal, core, n) {
    g.fillStyle = petal;
    g.beginPath();
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      g.moveTo(x + Math.cos(a) * r * 0.55 + r * 0.5, y + Math.sin(a) * r * 0.55);
      g.ellipse(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55 * 0.8, r * 0.5, r * 0.4, a, 0, TAU);
    }
    g.fill();
    g.fillStyle = core;
    g.beginPath(); g.arc(x, y, r * 0.3, 0, TAU); g.fill();
  }

  // background padded by PAD px on every side (scaled up once) so it can be drawn unscaled with an
  // integer shake offset: a scaled full-frame drawImage costs ~50 ms in the software rasteriser.
  const PAD = 24;
  function buildPaddedBg() {
    const inner = buildBg();
    const c = FILM.makeCanvas(W + PAD * 2, H + PAD * 2);
    c.getContext('2d').drawImage(inner, 0, 0, W + PAD * 2, H + PAD * 2);
    return c;
  }
  function buildBg() {
    const c = FILM.makeCanvas(W, H);
    const g = c.getContext('2d');
    // sky: warm golden hour
    F.sky(g, '#ff9a7a', '#ffe3a0', { h: HORIZON + 40, mid: '#ffb98a', midAt: 0.55 });
    // high wispy pink clouds
    g.save();
    g.globalAlpha = 0.55;
    [[120, 330, 360], [640, 250, 420], [860, 520, 300], [300, 640, 260]].forEach(([x, y, w], i) => {
      F.cloud(g, x, y, w, i % 2 ? '#ffd0c4' : '#ffc8d8', 'rgba(255,140,140,0.35)');
    });
    g.restore();
    // sun glow
    const sg = g.createRadialGradient(560, 900, 20, 560, 900, 620);
    sg.addColorStop(0, 'rgba(255,255,230,1)');
    sg.addColorStop(0.18, 'rgba(255,240,170,0.95)');
    sg.addColorStop(0.5, 'rgba(255,200,120,0.35)');
    sg.addColorStop(1, 'rgba(255,170,120,0)');
    g.fillStyle = sg;
    g.fillRect(0, 200, W, HORIZON);
    g.fillStyle = '#fffbe6';
    g.beginPath(); g.arc(560, 900, 118, 0, TAU); g.fill();
    // faint Ararat far away, hazy
    F.ararat(g, -60, HORIZON - 30, 760, 330, { color: '#d99aa8', shade: '#c78898', snow: '#fff0ec' });
    // far hills
    g.fillStyle = '#e7a28e';
    g.beginPath(); g.moveTo(0, HORIZON - 20);
    for (let x = 0; x <= W; x += 30) g.lineTo(x, HORIZON - 30 - Math.sin(x * 0.006 + 1) * 34 - Math.sin(x * 0.017) * 10);
    g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
    // tiny distant tree line
    g.fillStyle = '#b9837e';
    for (let i = 0; i < 26; i++) {
      const x = 560 + i * 20 + h01('tl', i) * 14, r = 12 + h01('tr', i) * 14;
      g.beginPath(); g.arc(x, HORIZON - 40 - Math.sin(x * 0.006 + 1) * 34 - r * 0.4, r, 0, TAU); g.fill();
    }
    // meadow bands, receding (lighter far, richer near)
    const bands = [
      [HORIZON + 0, '#c9b86a'], [HORIZON + 60, '#b8c066'], [HORIZON + 170, '#9fc25e'], [HORIZON + 330, '#86bb54'], [HORIZON + 520, '#6fae4a'],
    ];
    bands.forEach(([y, col], i) => {
      g.fillStyle = col;
      g.beginPath(); g.moveTo(0, y + 20);
      for (let x = 0; x <= W; x += 40) g.lineTo(x, y + Math.sin(x * 0.004 + i * 1.7) * (12 + i * 8));
      g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
    });
    // golden rim on the field (backlit)
    const rim = g.createLinearGradient(0, HORIZON, 0, HORIZON + 380);
    rim.addColorStop(0, 'rgba(255,220,140,0.55)');
    rim.addColorStop(1, 'rgba(255,220,140,0)');
    g.fillStyle = rim; g.fillRect(0, HORIZON - 40, W, 420);
    // flower dots: tiny far, bigger near (perspective)
    const cols = [['#ff8fb8', '#fff0a0'], ['#ffd3e6', '#ffc93a'], ['#fff6f0', '#ffb030'], ['#ffb347', '#e0602a'], ['#f06aa0', '#fff3b0']];
    for (let i = 0; i < 520; i++) {
      const v = Math.pow(h01('fy', i), 1.5);
      const y = HORIZON + 10 + v * (H - HORIZON);
      const x = h01('fx', i) * W;
      const r = 3 + v * 22;
      const cc = cols[i % cols.length];
      flowerHead(g, x, y, r, cc[0], cc[1], 5);
    }
    // grass tufts
    g.strokeStyle = '#4f9440';
    g.lineCap = 'round';
    for (let i = 0; i < 180; i++) {
      const v = Math.pow(h01('gy', i), 1.3);
      const y = HORIZON + 40 + v * (H - HORIZON);
      const x = h01('gx', i) * W;
      const hh = 8 + v * 40;
      g.lineWidth = 1.5 + v * 3;
      g.beginPath();
      g.moveTo(x - hh * 0.3, y - hh); g.lineTo(x, y); g.lineTo(x + hh * 0.35, y - hh * 0.9);
      g.moveTo(x, y); g.lineTo(x + 2, y - hh * 1.1);
      g.stroke();
    }
    return c;
  }

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------
  function petals(ctx, t, n, seed, near) {
    for (let i = 0; i < n; i++) {
      const sp = (near ? 90 : 45) * (0.6 + h01('ps', seed, i));
      const span = H + 400;
      const y = ((h01('py', seed, i) * span + t * sp) % span) - 200;
      const x = ((h01('px', seed, i) * (W + 300) - t * sp * 0.8 + Math.sin(t * 1.3 + i) * 40) % (W + 300) + (W + 300)) % (W + 300) - 150;
      const r = (near ? 16 : 8) * (0.7 + h01('pr', seed, i) * 0.8);
      const rot = t * (1 + h01('pw', seed, i) * 2) + i;
      const flipk = Math.cos(t * 2.2 + i * 1.3);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.scale(1, 0.35 + 0.65 * Math.abs(flipk));
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.quadraticCurveTo(r * 0.9, -r * 0.2, 0, r);
      ctx.quadraticCurveTo(-r * 0.9, -r * 0.2, 0, -r);
      ctx.fillStyle = i % 3 === 0 ? '#ffffff' : i % 3 === 1 ? '#ffb3cf' : '#ff8fb8';
      ctx.fill();
      if (near) { ctx.strokeStyle = 'rgba(180,60,110,0.6)'; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.restore();
    }
  }

  function fgFlowers(ctx, t) {
    // big blurry-ish foreground flowers swaying at the bottom edge
    for (let i = 0; i < 16; i++) {
      const x = (i / 15) * (W + 120) - 60 + (h01('ffx', i) - 0.5) * 60;
      const y = H - 120 + h01('ffy', i) * 160;
      const r = 34 + h01('ffr', i) * 30;
      const sway = Math.sin(t * 1.4 + i * 1.7) * 10;
      ctx.save();
      ctx.strokeStyle = '#3f7d34'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, H + 40); ctx.quadraticCurveTo(x + sway * 0.3, y + 80, x + sway, y); ctx.stroke();
      ctx.fillStyle = '#56a445';
      ctx.beginPath(); ctx.ellipse(x - 22, y + 90, 26, 10, -0.6, 0, TAU); ctx.fill();
      const cc = i % 3 === 0 ? ['#ff7fae', '#ffe27a'] : i % 3 === 1 ? ['#fff4f8', '#ffb838'] : ['#ffb0cf', '#ff8a3a'];
      ctx.lineWidth = 4; ctx.strokeStyle = C.line;
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * TAU + t * 0.2;
        ctx.moveTo(x + sway + Math.cos(a) * r * 1.05, y + Math.sin(a) * r * 0.55);
        ctx.ellipse(x + sway + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.4, r * 0.5, r * 0.3, a, 0, TAU);
      }
      ctx.fillStyle = cc[0];
      ctx.fill();
      ctx.stroke();
      ctx.beginPath(); ctx.arc(x + sway, y, r * 0.28, 0, TAU);
      F.fo(ctx, cc[1], 4);
      ctx.restore();
    }
  }

  // wedge rays without a background fill (cheaper than a full-frame sunburst)
  function rays(ctx, cx, cy, n, r, rot, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a0 = rot + (i / n) * TAU, a1 = a0 + (TAU / n) * 0.5;
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a0) * r, cy + Math.sin(a0) * r);
      ctx.lineTo(cx + Math.cos(a1) * r, cy + Math.sin(a1) * r);
      ctx.closePath();
    }
    ctx.fill();
  }

  function godRays(ctx, t, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(255,248,210,0.22)';
    ctx.beginPath();
    const n = 14, cx = 560, cy = 900;
    for (let i = 0; i < n; i++) {
      const a0 = Math.PI * 1.05 + (i / n) * Math.PI * 0.9 + Math.sin(t * 0.3 + i) * 0.02;
      const a1 = a0 + 0.05 + h01('gr', i) * 0.05;
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a0) * 1400, cy + Math.sin(a0) * 1400);
      ctx.lineTo(cx + Math.cos(a1) * 1400, cy + Math.sin(a1) * 1400);
      ctx.closePath();
      // rays below the horizon too, fanning over the field
      const b0 = Math.PI * 0.1 + (i / n) * Math.PI * 0.8, b1 = b0 + 0.04 + h01('gb', i) * 0.04;
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(b0) * 1400, cy + Math.sin(b0) * 1400);
      ctx.lineTo(cx + Math.cos(b1) * 1400, cy + Math.sin(b1) * 1400);
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
  }

  // Hayk hugging Goofy: Hayk, then Goofy in front, then Hayk's forearm band redrawn over Goofy
  // (clip to the band where the hug pose crosses the forearms) so the arms wrap the dog.
  function hugGroup(ctx, t, x, y, s, gs, tiltH, o = {}) {
    const hOpts = { x, y, s, t, pose: 'hug', face: o.face || 'cry', belly: 0.8, tilt: tiltH, crown: o.crown, shades: false };
    const a = FILM.cast.hayk(ctx, hOpts);
    if ((o.face || 'cry') === 'cry') FILM.cast.tears(ctx, a, o.tt == null ? t : o.tt, s * 0.8);
    // Goofy: cheek to cheek, head just right of Hayk's face, body slanting down across his chest
    const tl = -0.12 + tiltH;
    const hdx = 106 * gs, hdy = -240 * gs;
    const target = [a.head[0] + 150 * s, a.head[1] + 40 * s];
    const gx = target[0] - (hdx * Math.cos(tl) - hdy * Math.sin(tl));
    const gy = target[1] - (hdx * Math.sin(tl) + hdy * Math.cos(tl));
    const g = FILM.cast.goofy(ctx, { x: gx, y: gy, s: gs, t, pose: 'jump', face: 'happy', tilt: tl });
    // forearm band (local hug pose: forearms horizontal at y ~ -276, hands meet at the chest)
    const hy = (a.handL[1] + a.handR[1]) / 2;
    const hx = (a.handL[0] + a.handR[0]) / 2;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(tiltH);
    ctx.beginPath();
    ctx.rect(-150 * s, -24 * s, 300 * s, 51 * s);
    ctx.restore();
    ctx.save();
    ctx.clip();
    FILM.cast.hayk(ctx, hOpts);
    ctx.restore();
    return { a, g };
  }

  // ---------------------------------------------------------------------------
  function draw(ctx, tIn, info) {
    const t = clamp(tIn, 0, info.dur);
    const tw = LIB.onTwos(t);
    const bg = LIB.cached('reunion-bg', buildPaddedBg);

    // camera: slow push during the run, punch-in at the meet, gentle drift after
    let zoom = lerp(1.0, 1.05, LIB.ease.inOutSine(clamp(t / T_MEET)));
    if (t >= T_MEET) zoom = 1.05 + 0.06 * Math.exp(-(t - T_MEET) * 5) + 0.03 * LIB.ease.inOutSine(clamp((t - T_MEET) / 4));
    const camCx = 540, camCy = 1250;
    const sh = F.shakeMany(t, [[T_MEET, 0.4, 22]], 5);

    // 1. background: screen-fixed, integer shake only (no resampling)
    ctx.drawImage(bg, Math.round(sh[0] * 0.6) - PAD, Math.round(sh[1] * 0.6) - PAD);

    // 2. sun pulse + god rays (screen-fixed like the background)
    // sun pulse
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.2);
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.15 * pulse;
    ctx.fillStyle = '#fffbe6';
    ctx.beginPath(); ctx.arc(560, 900, 150 + pulse * 14, 0, TAU); ctx.fill();
    ctx.restore();

    godRays(ctx, t, 1);

    ctx.save();
    ctx.translate(sh[0], sh[1]);
    ctx.translate(camCx, camCy);
    ctx.scale(zoom, zoom);
    ctx.translate(-camCx, -camCy);

    // 2b. far bokeh + petals
    F.bokeh(ctx, { n: 22, seed: 5, t: t * 0.6, y: 180, h: 1100, rMin: 14, rMax: 46, colors: ['#ffd1e8', '#fff1b8', '#ffc0d8', '#ffe6a0'], alpha: 0.5 });
    petals(ctx, t * 0.7, 26, 1, false);

    // 4. hug glow (after meet)
    if (t >= T_MEET) {
      const u = clamp((t - T_MEET) / 0.5);
      ctx.save();
      ctx.globalAlpha = 0.55 * u;
      rays(ctx, 470, 1120, 28, 1500, t * 0.12, 'rgba(255,245,200,0.55)');
      const hg = ctx.createRadialGradient(470, 1120, 40, 470, 1120, 560);
      hg.addColorStop(0, 'rgba(255,255,240,0.95)');
      hg.addColorStop(0.5, 'rgba(255,200,225,0.45)');
      hg.addColorStop(1, 'rgba(255,200,225,0)');
      ctx.fillStyle = hg;
      ctx.fillRect(470 - 560, 1120 - 560, 1120, 1120);
      ctx.restore();
    }

    // 3. Grant collapsed far behind (always there, a small dust puff when we cut wide)
    const gX = 800, gY = 1175, gS = 0.52;
    ctx.save();
    ctx.fillStyle = 'rgba(40,60,20,0.25)';
    ctx.beginPath(); ctx.ellipse(gX, gY + 6, 190, 18, 0, 0, TAU); ctx.fill();
    ctx.restore();
    const breath = Math.sin(t * 2) * 0.01;
    const ga = FILM.cast.grant(ctx, { x: gX - 150, y: gY, s: gS, t, pose: 'collapse', face: 'exhausted', tilt: breath, flip: false });
    // dizzy swirl + tiny white soul wisp over Grant
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = 0; k <= 24; k++) {
      const u = k / 24, ang = u * TAU * 1.6 + t * 4;
      const px = ga.head[0] + Math.cos(ang) * (8 + u * 24), py = ga.head[1] - 60 + Math.sin(ang) * (5 + u * 12);
      if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
    // 5. heroes
    if (t < T_MEET) {
      const u = clamp(t / T_LEAP);
      const run = LIB.ease.inOutSine(u);
      const slow = 0.1 + tw * 0.5; // slow-motion run cycle
      const hx = lerp(210, 400, run);
      const hy = GROUND + Math.sin(slow * TAU * 1.4) * 4;
      // Hayk dust behind feet
      F.dust(ctx, hx - 60, GROUND, ((t * 0.6) % 0.8), { n: 5, seed: 3, size: 30, spread: 110, color: '#fff1d0' });
      // slow-mo afterimages (two ghosts trailing behind)
      [0.16, 0.08].forEach((d, k) => {
        const hu = LIB.ease.inOutSine(clamp((t - d * 3) / T_LEAP));
        FILM.cast.hayk(ctx, { x: lerp(210, 400, hu), y: hy, s: HAYK_S, t: slow - d, pose: 'run', face: 'cry', belly: 0.8, alpha: 0.18 + k * 0.1, silhouette: '#ffd6e6' });
      });
      const a = FILM.cast.hayk(ctx, { x: hx, y: hy, s: HAYK_S, t: slow, pose: 'run', face: 'cry', belly: 0.8 });
      FILM.cast.tears(ctx, a, t, HAYK_S * 0.8);
      // Goofy: runs in from the right, leaps at 1.75
      let gx, gy, pose = 'run', tilt = 0;
      if (t < T_LEAP) {
        gx = lerp(930, 700, run);
        gy = GROUND - 10;
      } else {
        const v = clamp((t - T_LEAP) / (T_MEET - T_LEAP));
        gx = lerp(700, 520, v);
        gy = GROUND - 10 - Math.sin(v * Math.PI * 0.85) * 330 - v * 120;
        pose = 'jump';
        tilt = 0.25;
      }
      F.dust(ctx, gx + 110, GROUND - 6, ((t * 0.6 + 0.3) % 0.8), { n: 4, seed: 4, size: 26, spread: 90, color: '#fff1d0' });
      if (t < T_LEAP) {
        [0.16, 0.08].forEach((d, k) => {
          const gu = LIB.ease.inOutSine(clamp((t - d * 3) / T_LEAP));
          FILM.cast.goofy(ctx, { x: lerp(930, 700, gu), y: gy, s: GOOFY_S, t: slow - d, pose, face: 'happy', flip: true, alpha: 0.18 + k * 0.1, silhouette: '#fff0c8' });
        });
      } else {
        F.motionSmear(ctx, gx + 40, gy - 330, 360, 240, { angle: Math.PI, color: 'rgba(255,255,255,0.8)', seed: 4 });
      }
      FILM.cast.goofy(ctx, { x: gx, y: gy, s: GOOFY_S, t: slow, pose, face: 'happy', flip: true, tilt: -tilt });
    } else {
      const age = t - T_MEET;
      // spin-sway of joy, hop on beats
      const sway = Math.sin(age * 2.4) * 0.07;
      const hop = F.bounce(tw, 2, 14) * clamp(age / 0.3);
      // squash on the catch
      const sq = age < 2 / 24 ? 1 : 0;
      const x = 440, y = GROUND + hop;
      ctx.save();
      if (sq) { ctx.translate(x, y); ctx.scale(1.06, 0.92); ctx.translate(-x, -y); }
      const { a } = hugGroup(ctx, tw, x, y, HAYK_S, 1.4, sway, { tt: t });
      ctx.restore();
      // hearts burst on the meet, then keep floating up
      const burstU = clamp(age / 0.6);
      if (age < 0.8) {
        for (let i = 0; i < 12; i++) {
          const ang = (i / 12) * TAU + 0.2;
          const r = 60 + LIB.ease.outCubic(burstU) * (260 + h01('hb', i) * 120);
          ctx.save();
          ctx.globalAlpha = 1 - clamp((age - 0.5) / 0.3);
          F.heart(ctx, a.chest[0] + Math.cos(ang) * r, a.chest[1] - 60 + Math.sin(ang) * r * 0.9, 1.6 + h01('hs', i) * 0.9, i % 2 ? '#ff4f86' : '#ff8fb3', 5);
          ctx.restore();
        }
      }
      F.hearts(ctx, a.head[0] + 40, a.head[1] - 60, t, { n: 9, seed: 7, spread: 520, rise: 520, scale: 1.4 });
      F.sparkles(ctx, { x: 150, y: 700, w: 700, h: 700, n: 12, seed: 23, t, size: 40 });
      F.shockRing(ctx, a.chest[0], a.chest[1], age, { r: 700, color: '#ffffff', life: 0.5, width: 30 });
      F.shockRing(ctx, a.chest[0], a.chest[1], age - 0.12, { r: 520, color: '#ffc8dd', life: 0.5, width: 20 });
    }

    // 6. foreground: near petals, near bokeh, flowers
    F.bokeh(ctx, { n: 10, seed: 11, t: t * 0.8, y: 400, h: 1500, rMin: 40, rMax: 95, colors: ['#ffc2dc', '#fff0b0'], alpha: 0.35 });
    petals(ctx, t, 22, 2, true);
    fgFlowers(ctx, tw);
    ctx.restore(); // camera

    // 7. screen-fixed overlays
    // 7a. close-up face panels during the run
    if (t >= T_PANEL_IN - 1e-6 && t < T_LEAP + 0.05) {
      drawPanels(ctx, t, tw);
    }
    // 7b. Grant's bubble
    if (t >= T_FINALLY - 1e-6) {
      const bx = 790, by = 1370;
      const gp = [gX - 150 + 0, gY];
      const scr = (p) => [camCx + (p[0] - camCx) * zoom + sh[0], camCy + (p[1] - camCy) * zoom + sh[1]];
      const gh = scr(ga.head);
      F.bubble(ctx, 'FINALLY...', bx, by, { size: 54, t, t0: T_FINALLY - 1 / 24, tail: [gh[0] - 50, gh[1] + 50], maxW: 420 });
      if (t > T_FINALLY + 0.25) F.sweat(ctx, gh[0] - 70, gh[1] - 40, 0.8);
    }
    // slow-motion soft vignette (pinkish)
    F.vignette(ctx, 0.35, '120,30,70');
    // 7c. impact frame + white flash at the meet (visible ON the beat frame)
    if (t >= T_MEET - 1e-6) {
      const age = t - T_MEET;
      if (age < 2 / 24 - 1e-6) {
        // two drawings of black-and-white impact: silhouettes of the hug on radiating lines
        F.impact(ctx, { cx: 470, cy: 1060, inner: 330, seed: 61 + LIB.boil(LIB.T) % 2 });
        ctx.save();
        ctx.translate(540, 1250); ctx.scale(1.12, 1.12); ctx.translate(-540, -1250);
        const sil = '#1b1424';
        const a = FILM.cast.hayk(ctx, { x: 440, y: GROUND, s: HAYK_S, t: 0, pose: 'hug', belly: 0.8, silhouette: sil });
        FILM.cast.goofy(ctx, { x: a.head[0] + 60, y: a.head[1] + 330, s: 1.4, t: 0, pose: 'jump', tilt: -0.12, silhouette: sil });
        ctx.restore();
        F.heart(ctx, 470, 700, 5, '#ff4f86', 10);
        F.flash(ctx, age < 1 / 24 ? 0.35 : 0, '#ffffff');
      } else {
        F.flash(ctx, 0.9 * (1 - LIB.ease.outCubic(clamp((age - 2 / 24) / 0.35))), '#fffaf0');
      }
    }
  }

  function drawPanels(ctx, t, tw) {
    const inU = LIB.ease.outExpo(clamp((t - T_PANEL_IN) / 0.3));
    const outU = LIB.ease.inCubic ? LIB.ease.inCubic(clamp((t - (T_LEAP - 0.2)) / 0.25)) : clamp((t - (T_LEAP - 0.2)) / 0.25);
    const top = 250, bot = 770, mid = 540;
    const panels = [
      { pts: [[40, top], [mid + 40, top], [mid - 20, bot], [40, bot]], dx: -(1 - inU) * 700 - outU * 700, who: 'hayk' },
      { pts: [[mid + 70, top], [1040, top], [1040, bot], [mid + 10, bot]], dx: (1 - inU) * 700 + outU * 700, who: 'goofy' },
    ];
    panels.forEach((p, i) => {
      ctx.save();
      ctx.translate(p.dx, 0);
      F.poly(ctx, p.pts);
      ctx.save();
      ctx.clip();
      // panel backdrop: pink/gold sunburst + focus lines
      const cx = i ? 800 : 290, cy = 520;
      ctx.fillStyle = i ? '#ffe7a8' : '#ffd0e0';
      ctx.fillRect(i ? 520 : 30, 240, 530, 540);
      rays(ctx, cx, cy, 20, 700, t * 0.25 * (i ? -1 : 1), i ? '#ffd27a' : '#ffb3cf');
      F.focusLines(ctx, cx, cy, { inner: 210, count: 60, color: '#ffffff', alpha: 0.75, width: 12, seed: 40 + i });
      if (p.who === 'hayk') {
        const s = 2.5;
        const a = FILM.cast.hayk(ctx, { x: 300, y: 520 + 462 * s * 1.0 - 20, s, t: tw * 0.4, pose: 'run', face: 'cry', belly: 0.8 });
        FILM.cast.tears(ctx, a, t, s * 0.8);
        F.sparkles(ctx, { x: 60, y: 260, w: 460, h: 480, n: 6, seed: 51, t, size: 30 });
      } else {
        const s = 3.0;
        // head at local (-92, -175) when flipped; centre it in the panel
        FILM.cast.goofy(ctx, { x: 780 + 100 * s, y: 560 + 175 * s, s, t: tw * 0.4, pose: 'run', face: 'happy', flip: true });
        F.sparkles(ctx, { x: 600, y: 260, w: 420, h: 480, n: 6, seed: 52, t, size: 30 });
      }
      ctx.restore();
      F.poly(ctx, p.pts);
      ctx.lineWidth = 10; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      ctx.lineWidth = 5; ctx.strokeStyle = C.line; ctx.stroke();
      ctx.restore();
    });
  }

  FILM.scene({ id: ID, draw });
})();

</script>
<script>
// ---- src/scenes/26-the-end.js
// Shot 26 'the-end' : The end. Global T 114..120 (6 s).
// Final group shot in front of Ararat at sunset. Hayk (hug-hold pose, belly 0.8, happy, crown)
// holds Goofy (happy) who munches a burger; Grant (exhausted, bandaged arm) gives a thumbs up.
// 1.0 s: stats card slides in; lines on the beats 1.5 / 2.0 / 2.5 / 3.0, each with a tick.
// 3.5 s: "THE END?" slams in, big gold, with the small LIQUIDITYSCAN logo under it.
// 5.5..6.0: everything holds (poster still).
//
// Layers (back to front):
//   1 cached background: sunset sky, sun, clouds, Ararat, Yerevan skyline, park terrace
//   2 animated sky: sun glow pulse, birds, city light twinkle, rays (after 3.5)
//   3 cast: Grant (right), Hayk holding Goofy (left), burger + crumbs, bandages
//   4 foreground: bushes, petals/confetti
//   5 screen-fixed: stats card, THE END? title + logo, flash, sparkles
(function () {
  'use strict';
  const ID = 'the-end';
  const FILM = window.FILM;
  const LIB = FILM.lib;
  const F = FILM.fx;
  const C = F.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const W = 1080, H = 1920;
  const h01 = (...k) => F.h01(ID, ...k);

  // beats (local t; global = 114 + t)
  const T_CARD = 1.0; //   T 115.0 stats card slides in
  const T_LINES = [1.5, 2.0, 2.5, 3.0]; // T 115.5 .. 117.0 one line per beat
  const T_END = 3.5; //    T 117.5 THE END? stinger
  const T_HOLD = 5.5; //   T 119.5 freeze
  const CHOMPS = [0.5, 1.5, 2.5, 3.5, 4.5];

  const GROUND = 1740;
  const HORIZON = 1230;
  const LINES = [
    ['INVESTORS FOUND:', '0'],
    ['BURGERS EATEN:', '147'],
    ['KILOS GAINED:', '9'],
    ['GOOFY:', 'HAPPY'],
  ];

  // ---------------------------------------------------------------------------
  // 1. static background
  // ---------------------------------------------------------------------------
  // background padded by PAD px on every side (scaled up once) so it can be drawn unscaled with an
  // integer shake offset: a scaled full-frame drawImage costs ~50 ms in the software rasteriser.
  const PAD = 24;
  function buildPaddedBg() {
    const inner = buildBg();
    const c = FILM.makeCanvas(W + PAD * 2, H + PAD * 2);
    c.getContext('2d').drawImage(inner, 0, 0, W + PAD * 2, H + PAD * 2);
    return c;
  }
  function buildBg() {
    const c = FILM.makeCanvas(W, H);
    const g = c.getContext('2d');
    F.sky(g, '#3b1d6e', '#ffc978', { h: HORIZON + 20, mid: '#ff6f7d', midAt: 0.5 });
    // warm band near the horizon
    const hb = g.createLinearGradient(0, 700, 0, HORIZON);
    hb.addColorStop(0, 'rgba(255,170,90,0)');
    hb.addColorStop(1, 'rgba(255,214,120,0.8)');
    g.fillStyle = hb; g.fillRect(0, 700, W, HORIZON - 700);
    // a few stars in the purple top
    g.fillStyle = '#ffe9f4';
    for (let k = 0; k < 40; k++) {
      g.globalAlpha = 0.35 + 0.65 * h01('sa', k);
      g.beginPath(); g.arc(h01('sx', k) * W, h01('sy', k) * 380, 1 + h01('sr', k) * 2.6, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
    // sun: big disc sinking behind the Greater Ararat's right shoulder
    const sg = g.createRadialGradient(780, 700, 30, 780, 700, 600);
    sg.addColorStop(0, 'rgba(255,250,220,1)');
    sg.addColorStop(0.25, 'rgba(255,220,140,0.85)');
    sg.addColorStop(1, 'rgba(255,140,110,0)');
    g.fillStyle = sg; g.fillRect(0, 100, W, 1200);
    g.fillStyle = '#fff3c4';
    g.beginPath(); g.arc(780, 700, 140, 0, TAU); g.fill();
    // sun stripes (retro sunset cut lines)
    g.fillStyle = '#ffb36b';
    [700, 735, 765, 790].forEach((y, i) => { g.fillRect(630, y, 300, 5 + i * 3); });
    // clouds, lit from below
    g.save();
    [[-60, 470, 380, '#ff9fb0'], [640, 420, 460, '#ffa7a0'], [200, 700, 300, '#ffb49a'], [820, 640, 260, '#ffc08e']].forEach(([x, y, w, col]) => {
      F.cloud(g, x, y, w, col, 'rgba(160,60,120,0.35)');
    });
    g.restore();
    // Ararat, large, dusk colours
    F.ararat(g, -140, HORIZON + 10, 1320, 800, { color: '#7a5fa8', shade: '#5d4690', snow: '#ffd9e0' });
    // sunset rim on the snow
    g.save();
    g.globalAlpha = 0.5;
    g.fillStyle = '#ffb08a';
    g.beginPath(); g.moveTo(-140 + 1320 * 0.4, HORIZON + 10 - 800); g.lineTo(-140 + 1320 * 0.46, HORIZON + 10 - 800 * 0.94); g.lineTo(-140 + 1320 * 0.44, HORIZON + 10 - 800 * 0.86); g.closePath(); g.fill();
    g.restore();
    // haze at the base
    const hz = g.createLinearGradient(0, HORIZON - 260, 0, HORIZON + 20);
    hz.addColorStop(0, 'rgba(255,170,150,0)');
    hz.addColorStop(1, 'rgba(255,170,150,0.7)');
    g.fillStyle = hz; g.fillRect(0, HORIZON - 260, W, 280);
    // Yerevan skyline silhouette
    g.fillStyle = '#4a2f6e';
    g.beginPath(); g.moveTo(0, HORIZON + 80);
    let x = 0;
    let i = 0;
    while (x < W) {
      const bw = 40 + h01('bw', i) * 70, bh = 50 + h01('bh', i) * 130;
      g.lineTo(x, HORIZON + 60 - bh); g.lineTo(x + bw, HORIZON + 60 - bh);
      x += bw; i++;
    }
    g.lineTo(W, HORIZON + 200); g.lineTo(0, HORIZON + 200); g.closePath(); g.fill();
    // TV tower (Yerevan) + cascade steps hint
    g.strokeStyle = '#4a2f6e'; g.lineWidth = 8;
    g.beginPath(); g.moveTo(930, HORIZON - 30); g.lineTo(950, HORIZON - 300); g.lineTo(970, HORIZON - 30); g.stroke();
    g.lineWidth = 4;
    for (let k = 0; k < 6; k++) { g.beginPath(); g.moveTo(935 + k * 2.5, HORIZON - 60 - k * 40); g.lineTo(965 - k * 2.5, HORIZON - 60 - k * 40); g.stroke(); }
    g.fillStyle = '#ff4060'; g.beginPath(); g.arc(950, HORIZON - 304, 6, 0, TAU); g.fill();
    // nearer row of buildings, darker
    g.fillStyle = '#3a2258';
    g.beginPath(); g.moveTo(0, HORIZON + 140);
    x = 0; i = 0;
    while (x < W) {
      const bw = 70 + h01('nw', i) * 90, bh = 30 + h01('nh', i) * 90;
      g.lineTo(x, HORIZON + 130 - bh); g.lineTo(x + bw, HORIZON + 130 - bh);
      x += bw; i++;
    }
    g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
    // park terrace: stone balustrade + lawn
    g.fillStyle = '#e8b8a0';
    g.fillRect(0, HORIZON + 150, W, 60);
    g.fillStyle = '#d49a86';
    g.fillRect(0, HORIZON + 196, W, 14);
    g.strokeStyle = C.line; g.lineWidth = 4;
    g.beginPath(); g.moveTo(0, HORIZON + 150); g.lineTo(W, HORIZON + 150); g.moveTo(0, HORIZON + 210); g.lineTo(W, HORIZON + 210); g.stroke();
    for (let k = 0; k < 18; k++) {
      const bx = 20 + k * 62;
      g.fillStyle = '#f0c8b0';
      g.beginPath(); g.ellipse(bx, HORIZON + 180, 12, 24, 0, 0, TAU); g.fill();
      g.lineWidth = 3; g.stroke();
    }
    const lawn = g.createLinearGradient(0, HORIZON + 210, 0, H);
    lawn.addColorStop(0, '#7c9e4e');
    lawn.addColorStop(1, '#5a8a3c');
    g.fillStyle = lawn; g.fillRect(0, HORIZON + 210, W, H);
    // warm sunset wash on the lawn
    g.fillStyle = 'rgba(255,150,90,0.18)'; g.fillRect(0, HORIZON + 210, W, H);
    // grass tufts
    g.strokeStyle = '#46742f'; g.lineCap = 'round';
    for (let k = 0; k < 90; k++) {
      const v = h01('gy', k);
      const gy = HORIZON + 240 + v * (H - HORIZON - 240), gx = h01('gx', k) * W, hh = 10 + v * 26;
      g.lineWidth = 2 + v * 2;
      g.beginPath(); g.moveTo(gx - hh * 0.3, gy - hh); g.lineTo(gx, gy); g.lineTo(gx + hh * 0.3, gy - hh); g.stroke();
    }
    return c;
  }

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------
  // wedge rays without a background fill (cheaper than a full-frame sunburst)
  function rays(ctx, cx, cy, n, r, rot, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a0 = rot + (i / n) * TAU, a1 = a0 + (TAU / n) * 0.5;
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a0) * r, cy + Math.sin(a0) * r);
      ctx.lineTo(cx + Math.cos(a1) * r, cy + Math.sin(a1) * r);
      ctx.closePath();
    }
    ctx.fill();
  }

  function birds(ctx, t) {
    ctx.save();
    ctx.strokeStyle = '#3b1d4e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const x = ((h01('bx', i) * 1300 + t * (40 + i * 6)) % 1300) - 100;
      const y = 560 + h01('by', i) * 260 + Math.sin(t * 2 + i) * 8;
      const f = Math.sin(t * 10 + i * 2) * 8, r = 12 + h01('br', i) * 8;
      ctx.beginPath();
      ctx.moveTo(x - r, y - f); ctx.quadraticCurveTo(x - r * 0.4, y - r * 0.5, x, y);
      ctx.quadraticCurveTo(x + r * 0.4, y - r * 0.5, x + r, y - f);
      ctx.stroke();
    }
    ctx.restore();
  }

  function cityLights(ctx, t) {
    const b = Math.floor(t * 6);
    ctx.save();
    for (let i = 0; i < 70; i++) {
      const x = h01('lx', i) * W, y = HORIZON + 10 + h01('ly', i) * 100;
      ctx.globalAlpha = 0.45 + 0.55 * h01('lt', i, b);
      ctx.fillStyle = i % 4 ? '#ffd86a' : '#fff3c0';
      ctx.fillRect(x, y, 6, 8);
    }
    ctx.restore();
  }

  function bandage(ctx, p, ang, w, h) {
    ctx.save();
    ctx.translate(p[0], p[1]);
    ctx.rotate(ang);
    F.rrect(ctx, -w / 2, -h / 2, w, h, 4);
    F.fo(ctx, '#fbf6ea', 4);
    ctx.strokeStyle = 'rgba(180,160,130,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let k = 1; k < 4; k++) { ctx.moveTo(-w / 2 + (w * k) / 4, -h / 2 + 3); ctx.lineTo(-w / 2 + (w * k) / 4 - 4, h / 2 - 3); }
    ctx.stroke();
    ctx.restore();
  }

  function plaster(ctx, x, y, s, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    [0.7, -0.7].forEach((a) => {
      ctx.save(); ctx.rotate(a);
      F.rrect(ctx, -22 * s, -7 * s, 44 * s, 14 * s, 6 * s);
      F.fo(ctx, '#f2c9a0', 3);
      ctx.restore();
    });
    ctx.restore();
  }

  function confetti(ctx, t, age) {
    if (age < 0) return;
    const cols = [C.gold, '#ff4f86', '#35e08a', '#27c4f5', '#ffffff', '#ff7a1a'];
    ctx.save();
    for (let i = 0; i < 46; i++) {
      const x0 = h01('cfx', i) * W;
      const v = 120 + h01('cfv', i) * 160;
      const y = -40 + (h01('cfy', i) * 300) - 300 + age * v * 1.6 + 300 * clamp(age * 3);
      if (y > H + 20) continue;
      const x = x0 + Math.sin(age * 3 + i) * 30;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(age * (2 + h01('cfr', i) * 4) + i);
      ctx.scale(1, Math.abs(Math.cos(age * 5 + i)) * 0.8 + 0.2);
      ctx.fillStyle = cols[i % cols.length];
      ctx.fillRect(-9, -5, 18, 10);
      ctx.restore();
    }
    ctx.restore();
  }

  // Hayk holding Goofy: Hayk (hug pose), Goofy seated in his arms in front, then Hayk's forearm band
  // redrawn over Goofy so the arms wrap the dog.
  function holdGroup(ctx, t, x, y, s, gs) {
    const hOpts = { x, y, s, t, pose: 'hug', face: 'happy', belly: 0.8, crown: true };
    const a = FILM.cast.hayk(ctx, hOpts);
    const hy = (a.handL[1] + a.handR[1]) / 2;
    const hx = (a.handL[0] + a.handR[0]) / 2;
    const g = FILM.cast.goofy(ctx, { x: hx + 95 * gs, y: hy + 55 * gs, s: gs, t, pose: 'sit', face: 'happy', tilt: -0.08 });
    ctx.save();
    ctx.beginPath();
    ctx.rect(hx - 150 * s, hy - 24 * s, 300 * s, 51 * s);
    ctx.clip();
    FILM.cast.hayk(ctx, hOpts);
    ctx.restore();
    return { a, g };
  }

  function statsCard(ctx, t) {
    if (t < T_CARD - 1e-6) return;
    const u = clamp((t - T_CARD) / 0.3 + 1 / 7.2);
    const dx = (1 - LIB.ease.outBack(u)) * 1000;
    const x0 = 100, y0 = 560, w = 880, h = 420;
    ctx.save();
    ctx.translate(dx, 0);
    ctx.translate(540, 750); ctx.rotate(-0.025); ctx.translate(-540, -750);
    // drop shadow
    ctx.fillStyle = 'rgba(20,8,30,0.35)';
    F.rrect(ctx, x0 + 14, y0 + 16, w, h, 26); ctx.fill();
    // card body
    F.rrect(ctx, x0, y0, w, h, 26);
    F.fo(ctx, 'rgba(27,20,36,0.9)', 6, C.gold);
    // header band
    ctx.save();
    F.rrect(ctx, x0, y0, w, h, 26); ctx.clip();
    ctx.fillStyle = C.gold; ctx.fillRect(x0, y0, w, 76);
    ctx.fillStyle = C.goldShade; ctx.fillRect(x0, y0 + 64, w, 12);
    // faint diagonal stripes in the body
    ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 18;
    ctx.beginPath();
    for (let k = -4; k < 16; k++) { ctx.moveTo(x0 + k * 70, y0 + h); ctx.lineTo(x0 + k * 70 + 300, y0 + 76); }
    ctx.stroke();
    ctx.restore();
    F.text(ctx, 'MISSION REPORT', x0 + w / 2, y0 + 38, { size: 44, fill: C.line, lw: 0, letter: 4 });
    // lines
    LINES.forEach(([label, val], i) => {
      const t0 = T_LINES[i];
      if (t < t0 - 1e-6) return;
      const ly = y0 + 130 + i * 78;
      const k = F.popIn(t, t0);
      const slide = (1 - clamp((t - t0) * 12 / 2 + 0.5)) * -60;
      ctx.save();
      ctx.translate(slide, 0);
      // tick box
      const bx = x0 + 70;
      ctx.save();
      ctx.translate(bx, ly); ctx.scale(k, k);
      F.rrect(ctx, -26, -26, 52, 52, 10);
      F.fo(ctx, '#ffffff', 5);
      ctx.strokeStyle = '#1fbf6a'; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-3, 13); ctx.lineTo(24, -26); ctx.stroke();
      ctx.restore();
      // label + value
      const tw = F.text(ctx, label, x0 + 124, ly + 2, { size: 50, fill: '#ffffff', lw: 0, align: 'left' }).w;
      const vc = i === 0 ? C.demonRed : i === 3 ? C.up : C.gold;
      F.text(ctx, val, x0 + 124 + tw + 24, ly + 2, { size: 58, fill: vc, lw: 8, stroke: C.line, align: 'left', scale: k });
      // tiny ding sparkle when the line lands
      const age = t - t0;
      if (age < 0.4) F.sparkle(ctx, bx + 30, ly - 30, 34 * Math.sin((age / 0.4) * Math.PI), { color: '#fff7b0' });
      ctx.restore();
    });
    ctx.restore();
  }

  function endTitle(ctx, t, tf) {
    if (t < T_END - 1e-6) return;
    const age = t - T_END;
    const k = F.popIn(t, T_END);
    // gold rays behind the title
    ctx.save();
    ctx.globalAlpha = 0.55 * clamp(age / 0.25 + 0.3);
    ctx.beginPath(); ctx.rect(0, 150, W, 400); ctx.clip();
    rays(ctx, 540, 350, 26, 900, tf * 0.2, 'rgba(255,240,170,0.55)');
    ctx.restore();
    F.burst(ctx, 540, 350, 470 * k, 300 * k, 18, 'rgba(255,90,60,0.9)', { seed: 5, lw: 6, squash: 0.42, jitter: 0.2 });
    // THE END? (the ? wobbles)
    const wob = Math.sin(tf * 5) * 0.12;
    ctx.save();
    ctx.translate(540, 340);
    ctx.scale(k, k);
    ctx.rotate(-0.05);
    const opt = { size: 172, fill: C.gold, stroke: C.line, lw: 26, shadow: 16, shadowColor: '#8a1322', align: 'left', skew: -0.1 };
    const wT = F.measure(ctx, 'THE END', 172) + 20;
    const wQ = F.measure(ctx, '?', 172);
    const x0 = -(wT + wQ) / 2;
    F.text(ctx, 'THE END', x0, 0, opt);
    F.text(ctx, '?', x0 + wT + wQ / 2, -6, Object.assign({}, opt, { align: 'center', rot: wob, fill: '#ffe066' }));
    ctx.restore();
    // glints on the letters
    F.sparkle(ctx, 190, 270, 46 * (0.6 + 0.4 * Math.sin(tf * 6)), { color: '#ffffff' });
    F.sparkle(ctx, 880, 420, 34 * (0.6 + 0.4 * Math.sin(tf * 6 + 2)), { color: '#fff7b0' });
    // LIQUIDITYSCAN logo, small, under the title
    const lk = F.popIn(t, T_END + 0.5);
    if (lk > 0) {
      ctx.save();
      ctx.translate(540, 482);
      ctx.scale(lk, lk);
      F.rrect(ctx, -210, -34, 420, 68, 34);
      F.fo(ctx, 'rgba(27,20,36,0.85)', 0);
      F.lsLogo(ctx, -168, 4, 0.36, { lw: 3 });
      F.text(ctx, 'LIQUIDITYSCAN', 22, 2, { size: 38, fill: '#ffffff', lw: 0, letter: 2 });
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------------------
  function draw(ctx, tIn, info) {
    const t0 = clamp(tIn, 0, info.dur);
    const t = Math.min(t0, T_HOLD); // the last 0.5 s holds
    const tw = LIB.onTwos(t);
    const bg = LIB.cached('the-end-bg', buildPaddedBg);

    const sh = F.shakeMany(t, [[T_END, 0.35, 22], [T_CARD, 0.2, 8]], 3);
    // slow push-in over the whole shot, a punch on THE END
    const zoom = 1.0 + 0.035 * LIB.ease.inOutSine(t / T_HOLD) + (t >= T_END ? 0.03 * Math.exp(-(t - T_END) * 6) : 0);
    const cx = 540, cy = 1300;

    // 1. background: screen-fixed, integer shake only (no resampling)
    ctx.drawImage(bg, Math.round(sh[0] * 0.6) - PAD, Math.round(sh[1] * 0.6) - PAD);

    ctx.save();
    ctx.translate(sh[0], sh[1]);
    ctx.translate(cx, cy); ctx.scale(zoom, zoom); ctx.translate(-cx, -cy);

    // 1. background
    // 2. animated sky
    birds(ctx, t);
    cityLights(ctx, t);
    F.bokeh(ctx, { n: 14, seed: 77, t, y: 900, h: 700, rMin: 10, rMax: 34, colors: ['#ffe39a', '#ffb0c8'], alpha: 0.4 });

    // 3. cast
    // Grant on the right: exhausted thumbs up, bandaged arm, plaster on the cheek
    const gS = 1.05;
    const gx = 820, gy = GROUND - 10 + F.bounce(tw, 1, 4);
    const ga = FILM.cast.grant(ctx, { x: gx, y: gy, s: gS, t: tw, pose: 'thumbsUp', face: 'exhausted', tilt: -0.03 });
    // forearm of the thumbs-up arm: elbow and wrist from the pose (local units x 1.08 * s)
    const k = 1.08 * gS;
    const tilt = -0.03, ct = Math.cos(tilt), st = Math.sin(tilt);
    const Wp = (lx, ly) => [gx + (lx * k) * ct - (ly * k) * st, gy + (lx * k) * st + (ly * k) * ct];
    const el = Wp(96, -268), wr = Wp(152, -335), shd = Wp(64, -356);
    const fa = Math.atan2(wr[1] - el[1], wr[0] - el[0]);
    bandage(ctx, [lerp(el[0], wr[0], 0.35), lerp(el[1], wr[1], 0.35)], fa + Math.PI / 2, 26 * k, 44 * k);
    bandage(ctx, [lerp(el[0], wr[0], 0.72), lerp(el[1], wr[1], 0.72)], fa + Math.PI / 2 + 0.15, 22 * k, 42 * k);
    const ua = Math.atan2(el[1] - shd[1], el[0] - shd[0]);
    bandage(ctx, [lerp(shd[0], el[0], 0.6), lerp(shd[1], el[1], 0.6)], ua + Math.PI / 2, 24 * k, 44 * k);
    plaster(ctx, ga.head[0] - 44 * k, ga.head[1] - 44 * k, 1.1, -0.3);
    // exhausted sweat + a thumbs-up sparkle
    F.sweat(ctx, ga.head[0] - 90, ga.head[1] - 30, 0.9);
    F.sparkle(ctx, ga.handR[0] + 44, ga.handR[1] - 70, 28 * (0.6 + 0.4 * Math.sin(t * 8)), { color: '#ffffff' });

    // Hayk holding Goofy, a happy hop on every other beat
    const hop = F.bounce(tw, 1, 12);
    const { a, g } = holdGroup(ctx, tw, 380, GROUND + hop, 1.2, 1.25);
    // Goofy's burger: chomped on the beats
    let bite = 0, lastChomp = -9;
    CHOMPS.forEach((c) => { if (t >= c - 1e-6) { bite += 0.14; lastChomp = c; } });
    const chompAge = t - lastChomp;
    const squish = chompAge < 2 / 24 ? 0.9 : 1;
    const bx = g.mouth[0] + 78, by = g.mouth[1] + 34;
    ctx.save();
    ctx.translate(bx, by); ctx.rotate(-0.1); ctx.scale(1, squish);
    F.burger(ctx, 0, 0, 0.8, { bite: Math.min(0.55, bite * 0.8) });
    ctx.restore();
    F.crumbs(ctx, bx - 10, by - 20, chompAge, { n: 10, seed: 3 + Math.floor(lastChomp * 2), spread: 260, life: 0.6 });
    // love / happiness marks
    F.hearts(ctx, g.head[0], g.head[1] - 80, t, { n: 4, seed: 9, spread: 160, rise: 220, scale: 0.8 });
    F.sparkle(ctx, a.top[0] - 40, a.top[1] - 60, 30 * (0.6 + 0.4 * Math.sin(t * 7)), { color: '#fff7b0' });

    // 4. foreground: dark bushes at the bottom corners + drifting petals
    ctx.save();
    ctx.fillStyle = '#3d6b2e';
    [[-40, H - 60, 170], [150, H + 10, 140], [980, H - 50, 180], [1110, H - 180, 150]].forEach(([x, y, r]) => {
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    });
    ctx.fillStyle = '#4f8a3a';
    [[-10, H - 110, 110], [990, H - 110, 110]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); });
    ctx.restore();
    ctx.restore(); // camera

    // 5. screen-fixed overlays
    F.sparkles(ctx, { x: 60, y: 240, w: 960, h: 700, n: 8, seed: 31, t: tw, size: 26 });
    confetti(ctx, t, t - T_END);
    statsCard(ctx, t);
    endTitle(ctx, t, tw);
    if (t >= T_END - 1e-6) {
      const age = t - T_END;
      F.flash(ctx, age < 1 / 24 ? 0.85 : 0.6 * (1 - clamp((age - 1 / 24) / 0.25)), '#fff4d0');
    }
    F.vignette(ctx, 0.3, '40,10,50');
  }

  FILM.scene({ id: ID, draw });
})();
