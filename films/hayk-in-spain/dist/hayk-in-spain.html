      rrect(ctx, x + 30, gy + 70, w - 60, 130, 6); fo(ctx, '#3b2a3a', 4, BLINE);
      ctx.fillStyle = '#ffd98a';
      ctx.fillRect(x + 44, gy + 84, (w - 88) * 0.55, 102);
      ctx.fillStyle = '#8a5a3a';
      ctx.fillRect(x + 44 + (w - 88) * 0.62, gy + 84, (w - 88) * 0.38, 116);
      awning(ctx, x + 30, gy - 10, w - 60, b.shop[0], b.shop[1]);
    } else {
      // big wooden door
      ctx.beginPath();
      ctx.moveTo(x + w / 2 - 60, bot); ctx.lineTo(x + w / 2 - 60, gy + 60); ctx.arc(x + w / 2, gy + 60, 60, Math.PI, 0); ctx.lineTo(x + w / 2 + 60, bot); ctx.closePath();
      fo(ctx, '#7a4a2e', 4, BLINE);
      ctx.strokeStyle = BLINE; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x + w / 2, gy + 2); ctx.lineTo(x + w / 2, bot); ctx.stroke();
    }
  }

  const BUILDINGS = [
    { x: -120, w: 400, top: 800, wall: '#f4d6a4', shade: '#e0b97f', roof: '#d9653b', shutter: '#3f8f7a', floors: 3, cols: 2, seed: 1, shop: ['#e8413c', '#ffffff'] },
    { x: 280, w: 380, top: 1000, wall: '#fff4e0', shade: '#ead7b8', roof: '#c9542f', shutter: '#3a6fb0', floors: 1, cols: 3, seed: 2, shop: null },
    { x: 660, w: 460, top: 600, wall: '#f3c38f', shade: '#dea56c', roof: '#d9653b', shutter: '#2f7f6e', floors: 4, cols: 3, seed: 3, shop: ['#2f9e5a', '#fff4e0'] },
    { x: 1120, w: 380, top: 700, wall: '#f6dcae', shade: '#e2bf86', roof: '#c9542f', shutter: '#3a6fb0', floors: 3, cols: 2, seed: 4, shop: ['#ffb000', '#ffffff'] },
  ];

  function midLayer(ctx) {
    BUILDINGS.forEach((b) => building(ctx, b));
  }

  // ---------------------------------------------------------------------------
  // Street
  // ---------------------------------------------------------------------------
  function street(ctx, ox) {
    // sidewalk
    ctx.fillStyle = '#ecd6b2';
    ctx.fillRect(-200, WALL_BASE, 1600, 400);
    ctx.fillStyle = 'rgba(160,110,60,0.18)';
    ctx.fillRect(-200, WALL_BASE, 1600, 26);
    ctx.strokeStyle = 'rgba(150,105,70,0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const rows = [1476, 1530, 1596, 1676, 1770];
    rows.forEach((y) => { ctx.moveTo(-200, y); ctx.lineTo(1500, y); });
    for (let r = 0; r < rows.length - 1; r++) {
      const tw = 90 + r * 30;
      const off = (r % 2) * tw * 0.5 - (ox % tw);
      for (let x = -200 + off; x < 1500; x += tw) { ctx.moveTo(x, rows[r]); ctx.lineTo(x - (x - 540) * 0.08, rows[r + 1]); }
    }
    ctx.stroke();
    // curb and road
    ctx.fillStyle = '#d7c3a2';
    ctx.fillRect(-200, 1810, 1600, 30);
    ctx.strokeStyle = BLINE; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-200, 1810); ctx.lineTo(1500, 1810); ctx.stroke();
    ctx.fillStyle = '#7d7a86';
    ctx.fillRect(-200, 1840, 1600, 100);
    ctx.fillStyle = '#fff4e0';
    for (let x = -200 - (ox % 240); x < 1500; x += 240) ctx.fillRect(x, 1880, 120, 12);
  }

  function lampPost(ctx, x) {
    ctx.save();
    ctx.fillStyle = '#2d2530';
    ctx.strokeStyle = P.line; ctx.lineWidth = 4;
    rrect(ctx, x - 22, 1560, 44, 30, 6); fo(ctx, '#2d2530', 4);
    rrect(ctx, x - 9, 1080, 18, 490, 6); fo(ctx, '#2d2530', 4);
    // arm and lantern
    ctx.lineWidth = 8; ctx.strokeStyle = '#2d2530';
    ctx.beginPath(); ctx.moveTo(x, 1100); ctx.quadraticCurveTo(x + 40, 1040, x + 90, 1060); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 70, 1070); ctx.lineTo(x + 110, 1070); ctx.lineTo(x + 102, 1140); ctx.lineTo(x + 78, 1140); ctx.closePath();
    fo(ctx, '#ffe9a8', 4);
    ctx.beginPath(); ctx.moveTo(x + 62, 1072); ctx.lineTo(x + 90, 1044); ctx.lineTo(x + 118, 1072); ctx.closePath(); fo(ctx, '#2d2530', 4);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Palm tree
  // ---------------------------------------------------------------------------
  function palm(ctx, x, base, h, t, seed, s = 1) {
    ctx.save();
    ctx.translate(x, base);
    ctx.scale(s, s);
    const lean = 0.12 + Math.sin(t * 1.3 + seed) * 0.015;
    // trunk as stacked rings
    const segs = 16;
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const u = i / segs;
      pts.push([Math.sin(u * 1.6) * h * lean * 1.4, -u * h]);
    }
    for (let i = 0; i < segs; i++) {
      const a = pts[i], b = pts[i + 1];
      const wA = 34 - i * 1.1, wB = 34 - (i + 1) * 1.1;
      ctx.beginPath();
      ctx.moveTo(a[0] - wA, a[1]); ctx.lineTo(b[0] - wB - 6, b[1]); ctx.lineTo(b[0] + wB + 6, b[1]); ctx.lineTo(a[0] + wA, a[1]); ctx.closePath();
      fo(ctx, i % 2 ? '#a27449' : '#8c6038', 4);
    }
    const top = pts[segs];
    // coconuts
    ellipse(ctx, top[0] - 14, top[1] + 18, 16, 16); fo(ctx, '#6b4a2a', 4);
    ellipse(ctx, top[0] + 14, top[1] + 22, 16, 16); fo(ctx, '#7d5632', 4);
    // fronds
    const fr = [-2.9, -2.45, -2.0, -1.55, -1.1, -0.65, -0.2, 0.3, 2.6];
    fr.forEach((a0, i) => {
      const sway = Math.sin(t * 2.2 + i * 0.9 + seed) * 0.07;
      const a = a0 + sway;
      const len = 250 + h01('frl', seed, i) * 70;
      const droop = 0.6;
      const tipX = top[0] + Math.cos(a) * len, tipY = top[1] + Math.sin(a) * len * 0.55 + len * droop * 0.35;
      const midX = top[0] + Math.cos(a) * len * 0.5, midY = top[1] + Math.sin(a) * len * 0.5 - 30;
      const nx = -Math.sin(a), ny = Math.cos(a);
      ctx.beginPath();
      ctx.moveTo(top[0], top[1]);
      ctx.quadraticCurveTo(midX + nx * 34, midY + ny * 34, tipX, tipY);
      // serrated lower edge
      for (let k = 8; k >= 1; k--) {
        const u = k / 8;
        const px = lerp(top[0], tipX, u) + (1 - u) * 0, py = lerp(top[1], tipY, u) - Math.sin(u * Math.PI) * 30;
        ctx.lineTo(px - nx * (12 + 26 * Math.sin(u * Math.PI)) + (k % 2 ? 8 : -8), py - ny * (12 + 26 * Math.sin(u * Math.PI)) + 14);
      }
      ctx.closePath();
      fo(ctx, i % 2 ? '#3f9a4a' : '#57b457', 4);
      ctx.strokeStyle = 'rgba(30,80,40,0.6)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.quadraticCurveTo(midX, midY, tipX, tipY); ctx.stroke();
    });
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Sky bits
  // ---------------------------------------------------------------------------
  function sun(ctx, x, y, t) {
    ctx.save();
    const rot = t * 0.25;
    const g = ctx.createRadialGradient(x, y, 60, x, y, 420);
    g.addColorStop(0, 'rgba(255,245,190,0.9)');
    g.addColorStop(1, 'rgba(255,245,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 420, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,170,0.45)';
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const a0 = rot + (i / 16) * TAU, a1 = a0 + 0.12;
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a0) * 900, y + Math.sin(a0) * 900);
      ctx.lineTo(x + Math.cos(a1) * 900, y + Math.sin(a1) * 900);
      ctx.closePath();
    }
    ctx.fill();
    // sun disc with a cel shade
    ellipse(ctx, x, y, 118, 118); fo(ctx, '#ffe066', 5, '#f0a020');
    ctx.fillStyle = '#fff6b8';
    ctx.beginPath(); ctx.arc(x - 30, y - 30, 58, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function pigeons(ctx, t) {
    ctx.save();
    ctx.strokeStyle = '#3d4a6a'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 0; i < 4; i++) {
      const x = -120 + ((t * (160 + i * 25) + i * 320) % 1400);
      const y = 560 + i * 60 + Math.sin(t * 3 + i) * 20;
      const flap = Math.sin(L.onTwos(t) * 22 + i * 2) * 16;
      const s = 1 - i * 0.12;
      ctx.beginPath();
      ctx.moveTo(x - 26 * s, y - flap * s); ctx.quadraticCurveTo(x - 12 * s, y - 14 * s, x, y);
      ctx.quadraticCurveTo(x + 12 * s, y - 14 * s, x + 26 * s, y - flap * s);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Text pieces
  // ---------------------------------------------------------------------------
  function todoCard(ctx, t) {
    const sc = F.popIn(t, T_TODO);
    if (sc <= 0) return;
    const x = 770, y = 470;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.06 + Math.sin(t * 3) * 0.01);
    ctx.scale(sc, sc);
    // shadow
    ctx.fillStyle = 'rgba(27,20,36,0.3)';
    rrect(ctx, -236, -96, 490, 216, 10); ctx.fill();
    // sticky note
    rrect(ctx, -250, -110, 490, 216, 10); fo(ctx, '#fff27a', 6);
    ctx.fillStyle = '#ffe24a';
    ctx.fillRect(-244, 70, 478, 30);
    // tape
    ctx.save(); ctx.rotate(0.05); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(-60, -130, 120, 40); ctx.restore();
    F.text(ctx, 'TODO:', -218, -52, { size: 58, fill: P.line, lw: 0, align: 'left' });
    // checkbox
    rrect(ctx, -222, 6, 50, 50, 8); fo(ctx, '#ffffff', 6);
    F.text(ctx, '1. FIND INVESTORS', -156, 32, { size: 40, fill: '#c0182a', lw: 0, align: 'left' });
    ctx.restore();
  }


  // ---------------------------------------------------------------------------
  // Draw
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const W = 1080, H = 1920;

      // Hayk's path: walk in from the left, stop at the pose
      const walkU = clamp(t / 1.42);
      const hx = lerp(250, 560, L.ease.outSine(walkU));
      const posed = t >= T_POSE - 1e-6;
      // camera follows a little (world shifts left)
      const camX = lerp(0, 70, L.ease.inOutSine(clamp(t / 2.2)));
      const push = 1 + 0.035 * L.ease.inOutSine(clamp((t - T_POSE) / 2.5));
      const sh = F.shake(t, T_POSE, 0.25, 12, 3);

      ctx.save();
      // push-in around Hayk's chest
      ctx.translate(540, 1300);
      ctx.scale(push, push);
      ctx.translate(-540 + sh[0], -1300 + sh[1]);

      // 1 sky
      F.sky(ctx, '#2f9cf0', '#bfe6ff', { x: -100, y: -100, w: W + 200, h: 1400, mid: P.spainSky, midAt: 0.35 });
      sun(ctx, 890 - camX * 0.1, 240, t);
      // 2 clouds and birds
      ctx.save();
      ctx.translate(-camX * 0.15, 0);
      F.cloud(ctx, 120 + t * 18, 470, 260);
      F.cloud(ctx, 620 + t * 12, 780, 200);
      F.cloud(ctx, -60 + t * 22, 880, 170);
      ctx.restore();
      pigeons(ctx, t);
      // 3 far
      ctx.save();
      ctx.translate(-camX * 0.25, 0);
      farLayer(ctx);
      ctx.restore();
      // 4 mid
      ctx.save();
      ctx.translate(-camX * 0.6, 0);
      midLayer(ctx);
      ctx.restore();
      // 5 street
      ctx.save();
      ctx.translate(-camX, 0);
      street(ctx, 0);
      lampPost(ctx, 120);
      ctx.restore();

      // 6 pose rays behind Hayk
      const hxs = hx - camX;
      if (posed) {
        const u = clamp((t - T_POSE) / 0.3);
        ctx.save();
        ctx.globalAlpha = 0.28 * u;
        ctx.fillStyle = '#fff6c0';
        ctx.beginPath();
        const rot = t * 0.4;
        for (let i = 0; i < 20; i++) {
          const a0 = rot + (i / 20) * TAU, a1 = a0 + 0.14;
          ctx.moveTo(hxs, 1180);
          ctx.lineTo(hxs + Math.cos(a0) * 1400, 1180 + Math.sin(a0) * 1400);
          ctx.lineTo(hxs + Math.cos(a1) * 1400, 1180 + Math.sin(a1) * 1400);
          ctx.closePath();
        }
        ctx.fill();
        ctx.restore();
      }

      // Hayk (with hop on beats after the pose and a squash on the pose hit)
      const S = 1.4;
      let hop = 0, sx = 1, sy = 1;
      if (posed) {
        const pf = Math.floor((t - T_POSE) * 12 + 1e-6);
        if (pf < 2) { sx = 1.06; sy = 0.92; }
        if (t > 2.0) hop = F.bounce(tw - 2.0, 2, 14);
      }
      // suitcase: tilted and trailing while walking, standing after the pose
      const ss = 0.78;
      ctx.save();
      ctx.translate(hxs, GROUND);
      ctx.scale(sx, sy);
      ctx.translate(-hxs, -GROUND);
      // draw Hayk into place first to get anchors? anchors need a draw; draw suitcase from a predicted hand spot
      const handGuess = posed ? [hxs - 150, GROUND - 330] : [hxs - 125, GROUND - 300];
      let caseX, caseRot;
      if (!posed) { caseX = hxs - 330; caseRot = 0.42 + Math.sin(tw * 12.566) * 0.03; }
      else { const u = L.ease.outBack(clamp((t - T_POSE) / 0.3)); caseX = lerp(hxs - 330, hxs - 300, u); caseRot = lerp(0.42, 0, u); }
      ctx.save();
      ctx.translate(caseX, GROUND - 8 + (posed ? 0 : Math.abs(Math.sin(tw * 12.566)) * -4));
      ctx.rotate(caseRot);
      F.suitcase(ctx, 0, 0, ss, { color: '#e8413c' });
      ctx.restore();
      // telescopic handle extension from the case handle to the hand
      const htop = [caseX + Math.sin(caseRot) * 390 * ss, GROUND - 8 - Math.cos(caseRot) * 390 * ss];
      const a = FILM.cast.hayk(ctx, {
        x: hxs, y: GROUND + hop, s: S, t: tw, pose: posed ? 'peace' : 'walk', face: 'smile', shades: true,
      });
      const hand = a.handL || handGuess;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = P.line; ctx.lineWidth = 16;
      ctx.beginPath(); ctx.moveTo(htop[0], htop[1]); ctx.lineTo(hand[0], hand[1] + 6); ctx.stroke();
      ctx.strokeStyle = '#9aa3b8'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(htop[0], htop[1]); ctx.lineTo(hand[0], hand[1] + 6); ctx.stroke();
      ctx.restore();
      ctx.restore();

      // walking dust puffs on steps
      if (!posed) {
        for (let k = 0; k < 3; k++) {
          const st = k * 0.5;
          F.dust(ctx, hxs - 40 + k * 10, GROUND, t - st, { n: 4, size: 22, spread: 70, seed: 30 + k, life: 0.45 });
        }
      } else {
        F.dust(ctx, hxs, GROUND, t - T_POSE, { n: 6, size: 40, spread: 200, seed: 41, life: 0.6 });
      }

      // sparkle burst at the pose
      if (posed) {
        const age = t - T_POSE;
        const hr = a.handR;
        const big = age < 0.5 ? L.ease.outBack(clamp(age / 0.15)) * 110 * (1 - age) : 55 + Math.sin(t * 9) * 12;
        F.sparkle(ctx, hr[0] + 45, hr[1] - 115, big, { color: '#fff7c2' });
        for (let i = 0; i < 10; i++) {
          const ang = (i / 10) * TAU + 0.3;
          const d = 60 + L.ease.outCubic(clamp(age / 0.6)) * 260;
          const r = (1 - clamp((age - 0.3) / 0.8)) * (22 + (i % 3) * 10);
          F.sparkle(ctx, hr[0] + Math.cos(ang) * d, hr[1] - 50 + Math.sin(ang) * d, r, { color: i % 2 ? '#ffffff' : '#ffe066', glow: false });
        }
        // shades glint
        const gl = ((t - T_POSE) % 1.0);
        if (gl < 0.35) F.sparkle(ctx, a.eyeR[0] + 26, a.eyeR[1] - 8, 40 * Math.sin((gl / 0.35) * Math.PI), { color: '#ffffff' });
        F.sparkles(ctx, { x: hxs - 380, y: 900, w: 760, h: 700, n: 10, seed: 77, t, size: 26 });
      }

      // 7 foreground palm
      palm(ctx, 1010 - camX * 1.25, 1900, 1180, t, 5, 1.0);
      palm(ctx, -40 - camX * 1.25, 1960, 900, t, 9, 0.9);

      ctx.restore();

      // 8 screen-fixed text
      F.caption(ctx, 'DAY 1', 400, 290, { size: 104, align: 'center', t, t0: T_DAY, from: 'left', bg: '#c0182a', accent: P.gold, border: 6, borderColor: P.line });
      if (t >= T_HOLA) {
        F.bubble(ctx, 'HOLA, ESPANA!', 690, 730, { size: 60, t, t0: T_HOLA, tail: [a.head[0] + 70, a.head[1] - 150], shout: true, maxW: 700 });
      }
      todoCard(ctx, t);
    },
  });
})();

</script>
<script>
// ---- src/scenes/08-burger-scent.js
// Shot 08 'burger-scent' : "The scent"  (global T 30.0 - 34.0, 4 s)
//
// Same Spanish street as shot 07. Hayk mid-walk; at 0.5 s a golden aroma ribbon curls in from the
// right and reaches his nose. He freezes mid-stride (face "shocked"), his sunglasses slide down his
// nose. 1.5 s: black-and-white impact frame, eyes wide. 2.0 s: extreme close-up on his eyes with a
// burger sign reflected in his pupils and focus lines. 2.5 s "WAIT...", 3.0 s shaky shout
// "IS THAT... A BURGER?!". Menace "ゴゴゴ" floats beside him.
//
// Layers (back to front):
//   A street (0 - 1.5 s): sky + sun, clouds, far church, facades, street (scrolling while he walks),
//     aroma ribbon, suitcase, Hayk, sliding sunglasses, sniff / "!" marks, foreground palms
//   B impact frame (1.5 - 1.67 s): white field + black focus lines, Hayk silhouette with white eyes
//   C shock hold (1.67 - 2.0 s): street pushed in, shocked Hayk, glasses falling, menace, shake
//   D extreme close-up (2.0 - 4.0 s): face fills the frame, eye overlays with the burger-sign
//     reflection, aroma wisps, focus lines, menace, text
(function () {
  'use strict';
  const ID = 'burger-scent';
  const REF = 'hola-espana'; // background seeds shared with shot 07 so the street matches
  const L = FILM.lib;
  const F = FILM.fx;
  const P = F.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const h01 = (...k) => F.h01(REF, ...k);
  const hs = (...k) => F.h01(ID, ...k);
  const { ellipse, fo, rrect, curve, poly } = F;

  const GROUND = 1690;
  const WALL_BASE = 1450;
  const BLINE = '#6a4636';
  const T_AROMA = 0.5; // T 30.5
  const T_FREEZE = 1.1; // T 31.1
  const T_IMPACT = 1.5; // T 31.5
  const T_IMPACT_END = 1.5 + 4 / 24;
  const T_XCU = 2.0; // T 32.0
  const T_WAIT = 2.5; // T 32.5
  const T_SHOUT = 3.0; // T 33.0

  // ---------------------------------------------------------------------------
  // Far layer: skyline and spiky church
  // ---------------------------------------------------------------------------
  function church(ctx, cx, base, s) {
    ctx.save();
    ctx.translate(cx, base);
    ctx.scale(s, s);
    const body = '#a9b9e6', shade = '#8fa1d6', light = '#c3cff0';
    // nave block
    ctx.fillStyle = shade;
    ctx.fillRect(-230, -210, 460, 210);
    ctx.fillStyle = body;
    ctx.fillRect(-230, -210, 250, 210);
    // spires: [x, height, width]
    const sp = [[-190, 380, 54], [-120, 470, 62], [-50, 560, 70], [30, 600, 74], [110, 520, 64], [180, 420, 56], [-5, 700, 80], [240, 330, 46]];
    sp.sort((a, b) => a[1] - b[1]);
    sp.forEach(([x, h, w], i) => {
      ctx.beginPath();
      ctx.moveTo(x - w / 2, 0);
      ctx.bezierCurveTo(x - w / 2, -h * 0.55, x - w * 0.18, -h * 0.85, x, -h);
      ctx.bezierCurveTo(x + w * 0.18, -h * 0.85, x + w / 2, -h * 0.55, x + w / 2, 0);
      ctx.closePath();
      ctx.fillStyle = i % 2 ? body : light;
      ctx.fill();
      // shaded right half
      ctx.save();
      ctx.clip();
      ctx.fillStyle = shade;
      ctx.fillRect(x + w * 0.08, -h, w, h);
      // bands and window slits
      ctx.fillStyle = 'rgba(80,95,160,0.35)';
      for (let k = 1; k < 7; k++) ctx.fillRect(x - w / 2, -h * k * 0.12, w, 5);
      for (let k = 1; k < 6; k++) { rrect(ctx, x - 5, -h * (0.1 + k * 0.12), 10, 22, 5); ctx.fill(); }
      ctx.restore();
      // bulb finial
      ctx.fillStyle = i % 3 === 0 ? '#e8b8a0' : light;
      ctx.beginPath(); ctx.arc(x, -h - 10, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = shade;
      ctx.fillRect(x - 2, -h - 36, 4, 20);
    });
    // rose window + portal
    ctx.fillStyle = light;
    ctx.beginPath(); ctx.arc(-40, -130, 40, 0, TAU); ctx.fill();
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.arc(-40, -130, 22, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-80, 0); ctx.lineTo(-80, -60); ctx.quadraticCurveTo(-40, -110, 0, -60); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function farLayer(ctx) {
    // hazy skyline blocks
    ctx.fillStyle = '#c4dcf5';
    for (let i = 0; i < 16; i++) {
      const x = -100 + i * 90, h = 120 + h01('sky', i) * 170, w = 70 + h01('skw', i) * 60;
      ctx.fillRect(x, 1180 - h, w, h + 40);
    }
    ctx.fillStyle = '#b3cdec';
    for (let i = 0; i < 12; i++) {
      const x = -60 + i * 120, h = 60 + h01('sk2', i) * 110;
      ctx.fillRect(x, 1200 - h, 100, h + 40);
    }
    church(ctx, 400, 1170, 1.05);
    // hills of Montjuic-ish green far away
    ctx.fillStyle = '#9fcf9a';
    ctx.beginPath();
    ctx.moveTo(-100, 1210);
    ctx.quadraticCurveTo(150, 1110, 400, 1190);
    ctx.lineTo(400, 1260); ctx.lineTo(-100, 1260); ctx.closePath();
    ctx.fill();
  }

  // ---------------------------------------------------------------------------
  // Mid layer: facades
  // ---------------------------------------------------------------------------
  function flowerPot(ctx, x, y, seed) {
    rrect(ctx, x - 20, y - 26, 40, 26, 5); fo(ctx, '#d9653b', 3, BLINE);
    ctx.fillStyle = '#4f9a4a';
    ctx.beginPath(); ctx.ellipse(x, y - 34, 30, 16, 0, 0, TAU); ctx.fill();
    const cols = ['#ff4f6e', '#ff7ab0', '#ffffff', '#ff5a3c'];
    for (let k = 0; k < 5; k++) {
      const fx = x - 22 + k * 11, fy = y - 38 - h01('fp', seed, k) * 14;
      ctx.fillStyle = cols[(seed + k) % cols.length];
      ctx.beginPath(); ctx.arc(fx, fy, 7, 0, TAU); ctx.fill();
    }
    // trailing leaves
    ctx.strokeStyle = '#3f8a3e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 16, y - 6); ctx.quadraticCurveTo(x - 24, y + 20, x - 14, y + 40); ctx.stroke();
  }

  function windowUnit(ctx, x, y, w, h, o) {
    // arched window with shutters, balcony and pot
    const sh = o.shutter;
    // shutters
    rrect(ctx, x - w * 0.5 - w * 0.34, y, w * 0.34, h, 3); fo(ctx, sh, 3, BLINE);
    rrect(ctx, x + w * 0.5, y, w * 0.34, h, 3); fo(ctx, sh, 3, BLINE);
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let k = 1; k < 7; k++) {
      ctx.moveTo(x - w * 0.82, y + (h * k) / 7); ctx.lineTo(x - w * 0.52, y + (h * k) / 7);
      ctx.moveTo(x + w * 0.52, y + (h * k) / 7); ctx.lineTo(x + w * 0.82, y + (h * k) / 7);
    }
    ctx.stroke();
    // glass with arch
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y + h);
    ctx.lineTo(x - w / 2, y + w / 2);
    ctx.arc(x, y + w / 2, w / 2, Math.PI, 0);
    ctx.lineTo(x + w / 2, y + h);
    ctx.closePath();
    fo(ctx, '#5f8fc4', 4, BLINE);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.moveTo(x - w * 0.35, y + h * 0.9); ctx.lineTo(x - w * 0.1, y + w * 0.3); ctx.lineTo(x + w * 0.05, y + w * 0.3); ctx.lineTo(x - w * 0.2, y + h * 0.9); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = BLINE; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.stroke();
    if (o.balcony) {
      const by = y + h;
      rrect(ctx, x - w * 0.9, by - 6, w * 1.8, 14, 3); fo(ctx, '#e9d2b0', 3, BLINE);
      // iron railing
      ctx.strokeStyle = '#2d2530'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x - w * 0.85, by - 60); ctx.lineTo(x + w * 0.85, by - 60);
      for (let k = 0; k <= 10; k++) { const rx = x - w * 0.85 + (k * w * 1.7) / 10; ctx.moveTo(rx, by - 60); ctx.lineTo(rx, by - 6); }
      ctx.stroke();
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let k = 0; k < 5; k++) { const rx = x - w * 0.68 + (k * w * 1.36) / 4; ctx.moveTo(rx + 12, by - 30); ctx.arc(rx, by - 30, 12, 0, TAU); }
      ctx.stroke();
      if (o.pot) { flowerPot(ctx, x - w * 0.55, by - 8, o.seed); flowerPot(ctx, x + w * 0.55, by - 8, o.seed + 1); }
    } else if (o.pot) {
      rrect(ctx, x - w * 0.6, y + h - 4, w * 1.2, 12, 3); fo(ctx, '#e9d2b0', 3, BLINE);
      flowerPot(ctx, x, y + h - 2, o.seed);
    }
  }

  function awning(ctx, x, y, w, c1, c2) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w + 20, y + 80); ctx.lineTo(x - 20, y + 80); ctx.closePath();
    ctx.fillStyle = c1; ctx.fill();
    ctx.clip();
    ctx.fillStyle = c2;
    for (let k = 0; k < 14; k++) {
      const sx = x - 20 + k * ((w + 40) / 14) * 2;
      ctx.beginPath(); ctx.moveTo(sx + (x - sx) * 0.1, y); ctx.lineTo(sx + ((w + 40) / 14), y); ctx.lineTo(sx + ((w + 40) / 14), y + 90); ctx.lineTo(sx, y + 90); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w + 20, y + 80); ctx.lineTo(x - 20, y + 80); ctx.closePath();
    fo(ctx, null, 4, BLINE);
    // scalloped valance
    ctx.beginPath();
    const n = Math.round((w + 40) / 40);
    ctx.moveTo(x - 20, y + 80);
    for (let k = 0; k < n; k++) { const sx = x - 20 + (k * (w + 40)) / n; ctx.quadraticCurveTo(sx + (w + 40) / n / 2, y + 112, sx + (w + 40) / n, y + 80); }
    ctx.closePath();
    fo(ctx, c1, 4, BLINE);
  }

  function building(ctx, b) {
    const { x, w, top, wall, shade, roof, shutter, seed } = b;
    const bot = WALL_BASE;
    // roof: terracotta tiles, slight overhang
    ctx.beginPath();
    ctx.moveTo(x - 24, top + 20); ctx.lineTo(x + 30, top - 50); ctx.lineTo(x + w - 30, top - 50); ctx.lineTo(x + w + 24, top + 20); ctx.closePath();
    fo(ctx, roof, 4, BLINE);
    ctx.strokeStyle = 'rgba(120,40,20,0.45)'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let k = 0; k < 3; k++) { const yy = top - 34 + k * 18; ctx.moveTo(x + 10 - k * 12, yy); ctx.lineTo(x + w - 10 + k * 12, yy); }
    for (let k = 0; k < w / 28; k++) { const xx = x + 10 + k * 28; ctx.moveTo(xx, top - 48); ctx.lineTo(xx - 4, top + 16); }
    ctx.stroke();
    // wall
    ctx.beginPath(); ctx.rect(x, top + 16, w, bot - top - 16);
    fo(ctx, wall, 4, BLINE);
    ctx.fillStyle = shade;
    ctx.fillRect(x + w - 40, top + 18, 38, bot - top - 20);
    // cornice
    rrect(ctx, x - 12, top + 10, w + 24, 26, 4); fo(ctx, '#fff4e0', 4, BLINE);
    // floor bands
    ctx.fillStyle = 'rgba(160,110,60,0.25)';
    const floors = b.floors;
    const fh = (bot - 200 - (top + 40)) / floors;
    for (let f = 1; f <= floors; f++) ctx.fillRect(x, top + 40 + f * fh - 6, w, 8);
    // windows
    const cols = b.cols;
    for (let f = 0; f < floors; f++) {
      for (let c = 0; c < cols; c++) {
        const wx = x + (w / cols) * (c + 0.5);
        const wy = top + 40 + f * fh + fh * 0.18;
        windowUnit(ctx, wx, wy, Math.min(56, (w / cols) * 0.42), fh * 0.62, {
          shutter, balcony: (f + c + seed) % 2 === 0, pot: (f * 3 + c + seed) % 3 !== 1, seed: seed + f * 5 + c,
        });
      }
    }
    // ground floor shop
    const gy = bot - 200;
    ctx.fillStyle = 'rgba(120,70,40,0.18)';
    ctx.fillRect(x, gy, w, 200);
    if (b.shop) {
      rrect(ctx, x + 30, gy + 70, w - 60, 130, 6); fo(ctx, '#3b2a3a', 4, BLINE);
      ctx.fillStyle = '#ffd98a';
      ctx.fillRect(x + 44, gy + 84, (w - 88) * 0.55, 102);
      ctx.fillStyle = '#8a5a3a';
      ctx.fillRect(x + 44 + (w - 88) * 0.62, gy + 84, (w - 88) * 0.38, 116);
      awning(ctx, x + 30, gy - 10, w - 60, b.shop[0], b.shop[1]);
    } else {
      // big wooden door
      ctx.beginPath();
      ctx.moveTo(x + w / 2 - 60, bot); ctx.lineTo(x + w / 2 - 60, gy + 60); ctx.arc(x + w / 2, gy + 60, 60, Math.PI, 0); ctx.lineTo(x + w / 2 + 60, bot); ctx.closePath();
      fo(ctx, '#7a4a2e', 4, BLINE);
      ctx.strokeStyle = BLINE; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x + w / 2, gy + 2); ctx.lineTo(x + w / 2, bot); ctx.stroke();
    }
  }

  const BUILDINGS = [
    { x: -120, w: 400, top: 800, wall: '#f4d6a4', shade: '#e0b97f', roof: '#d9653b', shutter: '#3f8f7a', floors: 3, cols: 2, seed: 1, shop: ['#e8413c', '#ffffff'] },
    { x: 280, w: 380, top: 1000, wall: '#fff4e0', shade: '#ead7b8', roof: '#c9542f', shutter: '#3a6fb0', floors: 1, cols: 3, seed: 2, shop: null },
    { x: 660, w: 460, top: 600, wall: '#f3c38f', shade: '#dea56c', roof: '#d9653b', shutter: '#2f7f6e', floors: 4, cols: 3, seed: 3, shop: ['#2f9e5a', '#fff4e0'] },
    { x: 1120, w: 380, top: 700, wall: '#f6dcae', shade: '#e2bf86', roof: '#c9542f', shutter: '#3a6fb0', floors: 3, cols: 2, seed: 4, shop: ['#ffb000', '#ffffff'] },
  ];

  function midLayer(ctx) {
    BUILDINGS.forEach((b) => building(ctx, b));
  }

  // ---------------------------------------------------------------------------
  // Street
  // ---------------------------------------------------------------------------
  function street(ctx, ox) {
    // sidewalk
    ctx.fillStyle = '#ecd6b2';
    ctx.fillRect(-200, WALL_BASE, 1600, 400);
    ctx.fillStyle = 'rgba(160,110,60,0.18)';
    ctx.fillRect(-200, WALL_BASE, 1600, 26);
    ctx.strokeStyle = 'rgba(150,105,70,0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const rows = [1476, 1530, 1596, 1676, 1770];
    rows.forEach((y) => { ctx.moveTo(-200, y); ctx.lineTo(1500, y); });
    for (let r = 0; r < rows.length - 1; r++) {
      const tw = 90 + r * 30;
      const off = (r % 2) * tw * 0.5 - (ox % tw);
      for (let x = -200 + off; x < 1500; x += tw) { ctx.moveTo(x, rows[r]); ctx.lineTo(x - (x - 540) * 0.08, rows[r + 1]); }
    }
    ctx.stroke();
    // curb and road
    ctx.fillStyle = '#d7c3a2';
    ctx.fillRect(-200, 1810, 1600, 30);
    ctx.strokeStyle = BLINE; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-200, 1810); ctx.lineTo(1500, 1810); ctx.stroke();
    ctx.fillStyle = '#7d7a86';
    ctx.fillRect(-200, 1840, 1600, 100);
    ctx.fillStyle = '#fff4e0';
    for (let x = -200 - (ox % 240); x < 1500; x += 240) ctx.fillRect(x, 1880, 120, 12);
  }

  function lampPost(ctx, x) {
    ctx.save();
    ctx.fillStyle = '#2d2530';
    ctx.strokeStyle = P.line; ctx.lineWidth = 4;
    rrect(ctx, x - 22, 1560, 44, 30, 6); fo(ctx, '#2d2530', 4);
    rrect(ctx, x - 9, 1080, 18, 490, 6); fo(ctx, '#2d2530', 4);
    // arm and lantern
    ctx.lineWidth = 8; ctx.strokeStyle = '#2d2530';
    ctx.beginPath(); ctx.moveTo(x, 1100); ctx.quadraticCurveTo(x + 40, 1040, x + 90, 1060); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 70, 1070); ctx.lineTo(x + 110, 1070); ctx.lineTo(x + 102, 1140); ctx.lineTo(x + 78, 1140); ctx.closePath();
    fo(ctx, '#ffe9a8', 4);
    ctx.beginPath(); ctx.moveTo(x + 62, 1072); ctx.lineTo(x + 90, 1044); ctx.lineTo(x + 118, 1072); ctx.closePath(); fo(ctx, '#2d2530', 4);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Palm tree
  // ---------------------------------------------------------------------------
  function palm(ctx, x, base, h, t, seed, s = 1) {
    ctx.save();
    ctx.translate(x, base);
    ctx.scale(s, s);
    const lean = 0.12 + Math.sin(t * 1.3 + seed) * 0.015;
    // trunk as stacked rings
    const segs = 16;
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const u = i / segs;
      pts.push([Math.sin(u * 1.6) * h * lean * 1.4, -u * h]);
    }
    for (let i = 0; i < segs; i++) {
      const a = pts[i], b = pts[i + 1];
      const wA = 34 - i * 1.1, wB = 34 - (i + 1) * 1.1;
      ctx.beginPath();
      ctx.moveTo(a[0] - wA, a[1]); ctx.lineTo(b[0] - wB - 6, b[1]); ctx.lineTo(b[0] + wB + 6, b[1]); ctx.lineTo(a[0] + wA, a[1]); ctx.closePath();
      fo(ctx, i % 2 ? '#a27449' : '#8c6038', 4);
    }
    const top = pts[segs];
    // coconuts
    ellipse(ctx, top[0] - 14, top[1] + 18, 16, 16); fo(ctx, '#6b4a2a', 4);
    ellipse(ctx, top[0] + 14, top[1] + 22, 16, 16); fo(ctx, '#7d5632', 4);
    // fronds
    const fr = [-2.9, -2.45, -2.0, -1.55, -1.1, -0.65, -0.2, 0.3, 2.6];
    fr.forEach((a0, i) => {
      const sway = Math.sin(t * 2.2 + i * 0.9 + seed) * 0.07;
      const a = a0 + sway;
      const len = 250 + h01('frl', seed, i) * 70;
      const droop = 0.6;
      const tipX = top[0] + Math.cos(a) * len, tipY = top[1] + Math.sin(a) * len * 0.55 + len * droop * 0.35;
      const midX = top[0] + Math.cos(a) * len * 0.5, midY = top[1] + Math.sin(a) * len * 0.5 - 30;
      const nx = -Math.sin(a), ny = Math.cos(a);
      ctx.beginPath();
      ctx.moveTo(top[0], top[1]);
      ctx.quadraticCurveTo(midX + nx * 34, midY + ny * 34, tipX, tipY);
      // serrated lower edge
      for (let k = 8; k >= 1; k--) {
        const u = k / 8;
        const px = lerp(top[0], tipX, u) + (1 - u) * 0, py = lerp(top[1], tipY, u) - Math.sin(u * Math.PI) * 30;
        ctx.lineTo(px - nx * (12 + 26 * Math.sin(u * Math.PI)) + (k % 2 ? 8 : -8), py - ny * (12 + 26 * Math.sin(u * Math.PI)) + 14);
      }
      ctx.closePath();
      fo(ctx, i % 2 ? '#3f9a4a' : '#57b457', 4);
      ctx.strokeStyle = 'rgba(30,80,40,0.6)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.quadraticCurveTo(midX, midY, tipX, tipY); ctx.stroke();
    });
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Sky bits
  // ---------------------------------------------------------------------------
  function sun(ctx, x, y, t) {
    ctx.save();
    const rot = t * 0.25;
    const g = ctx.createRadialGradient(x, y, 60, x, y, 420);
    g.addColorStop(0, 'rgba(255,245,190,0.9)');
    g.addColorStop(1, 'rgba(255,245,190,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 420, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,170,0.45)';
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const a0 = rot + (i / 16) * TAU, a1 = a0 + 0.12;
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a0) * 900, y + Math.sin(a0) * 900);
      ctx.lineTo(x + Math.cos(a1) * 900, y + Math.sin(a1) * 900);
      ctx.closePath();
    }
    ctx.fill();
    // sun disc with a cel shade
    ellipse(ctx, x, y, 118, 118); fo(ctx, '#ffe066', 5, '#f0a020');
    ctx.fillStyle = '#fff6b8';
    ctx.beginPath(); ctx.arc(x - 30, y - 30, 58, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function pigeons(ctx, t) {
    ctx.save();
    ctx.strokeStyle = '#3d4a6a'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 0; i < 4; i++) {
      const x = -120 + ((t * (160 + i * 25) + i * 320) % 1400);
      const y = 560 + i * 60 + Math.sin(t * 3 + i) * 20;
      const flap = Math.sin(L.onTwos(t) * 22 + i * 2) * 16;
      const s = 1 - i * 0.12;
      ctx.beginPath();
      ctx.moveTo(x - 26 * s, y - flap * s); ctx.quadraticCurveTo(x - 12 * s, y - 14 * s, x, y);
      ctx.quadraticCurveTo(x + 12 * s, y - 14 * s, x + 26 * s, y - flap * s);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Shot pieces
  // ---------------------------------------------------------------------------
  /** Hayk's sunglasses (same shape as cast.js) at head-local offset dy, scale k = s * 1.15. */
  function shades(ctx, head, k, dy, rot, dx = 0) {
    ctx.save();
    ctx.translate(head[0] + dx, head[1]);
    ctx.scale(k, k);
    ctx.rotate(rot);
    ctx.translate(0, dy);
    ctx.fillStyle = '#15121c';
    ctx.strokeStyle = P.line; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-60, -14); ctx.lineTo(60, -14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-54, -16); ctx.lineTo(-6, -16); ctx.lineTo(-10, 12); ctx.quadraticCurveTo(-30, 22, -50, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(54, -16); ctx.lineTo(6, -16); ctx.lineTo(10, 12); ctx.quadraticCurveTo(30, 22, 50, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-44, -8); ctx.lineTo(-34, 4); ctx.moveTo(16, -8); ctx.lineTo(26, 4); ctx.stroke();
    ctx.restore();
  }

  /** a tiny glowing burger-joint sign, centred, ~200 x 130 at s = 1 (drawn in the pupils) */
  function burgerSign(ctx, x, y, s, glow) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    const g = ctx.createRadialGradient(0, 0, 10, 0, 0, 170);
    g.addColorStop(0, `rgba(255,220,90,${0.75 * glow})`);
    g.addColorStop(1, 'rgba(255,220,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 170, 0, TAU); ctx.fill();
    rrect(ctx, -104, -70, 208, 150, 22); fo(ctx, '#e8413c', 7);
    rrect(ctx, -92, -58, 184, 126, 16); fo(ctx, null, 4, P.gold);
    F.burger(ctx, 0, -12, 0.46);
    F.text(ctx, 'BURGER', 0, 46, { size: 34, fill: P.gold, lw: 7, stroke: P.line });
    ctx.restore();
  }

  /** eye overlay for the extreme close-up: big dark iris with the burger sign reflected in it */
  function eyeReflect(ctx, e, k, t, side) {
    const w = 24 * k, h = 30 * k;
    const b = L.boil(L.T);
    const jx = (hs('ej', side, b) - 0.5) * 0.9 * k, jy = (hs('ek', side, b) - 0.5) * 0.9 * k;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(e[0], e[1], w, h, 0, 0, TAU); ctx.clip();
    const cx = e[0] + jx, cy = e[1] + 3 * k + jy;
    const r = 17.5 * k;
    // iris with a gradient ring
    const g = ctx.createRadialGradient(cx, cy - r * 0.2, r * 0.1, cx, cy, r);
    g.addColorStop(0, '#6a2a10');
    g.addColorStop(0.7, '#3b2418');
    g.addColorStop(1, '#170d12');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = P.line; ctx.lineWidth = 0.8 * k;
    ctx.stroke();
    // warm reflected glow from below
    ctx.fillStyle = 'rgba(255,170,40,0.35)';
    ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.55, r * 0.85, r * 0.45, 0, 0, TAU); ctx.fill();
    // the sign (mirrored drawings are unreadable, keep it readable), pulsing glow
    const glow = 0.7 + 0.3 * Math.sin(t * 10);
    burgerSign(ctx, cx, cy + r * 0.12, (r * 1.25) / 208, glow);
    // highlights
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(cx - r * 0.5, cy - r * 0.55, r * 0.3, r * 0.22, -0.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.55, cy + r * 0.55, r * 0.1, 0, TAU); ctx.fill();
    // wobbling tear film at the bottom of the eye (overwhelmed)
    ctx.fillStyle = 'rgba(143,216,255,0.35)';
    ctx.beginPath(); ctx.ellipse(e[0], e[1] + h * 0.85, w, h * 0.3 + Math.sin(t * 12) * 2, 0, 0, TAU); ctx.fill();
    ctx.restore();
    // outline the eye again so the overlay sits inside the lids
    ctx.save();
    ctx.strokeStyle = P.line; ctx.lineWidth = 7 * k * 0.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(e[0], e[1], w + 1, h + 1, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
    ctx.restore();
  }

  /** aroma ribbon with little floating burger ghosts along it */
  function aromaRibbon(ctx, pts, t, reveal, o = {}) {
    F.aroma(ctx, pts, t, { reveal, width: o.width || 34, amp: o.amp || 24, alpha: 0.95, color: '#ffd23a', edge: 'rgba(255,140,20,0.6)' });
    if (reveal <= 0) return;
    // second thinner strand
    F.aroma(ctx, pts.map((p, i) => [p[0] + (i % 2 ? 26 : -18), p[1] + (i % 2 ? -22 : 16)]), t + 0.4, { reveal: reveal * 0.95, width: (o.width || 30) * 0.45, amp: 18, alpha: 0.7, color: '#fff3b0' });
    // ghost burgers riding the ribbon
    for (let i = 0; i < 3; i++) {
      const u = ((t * 0.35 + i / 3) % 1) * reveal;
      const seg = u * (pts.length - 1);
      const k = Math.min(pts.length - 2, Math.floor(seg));
      const f = seg - k;
      const x = lerp(pts[k][0], pts[k + 1][0], f), y = lerp(pts[k][1], pts[k + 1][1], f) + Math.sin(t * 6 + i) * 12;
      ctx.save();
      ctx.globalAlpha = 0.55;
      F.burger(ctx, x, y, (o.ghost || 0.22) * (0.8 + 0.2 * Math.sin(t * 5 + i)), { rot: Math.sin(t * 3 + i) * 0.3 });
      ctx.restore();
      F.sparkle(ctx, x + 30, y - 30, 14 + 8 * Math.sin(t * 9 + i * 2), { color: '#fff7c2', glow: false });
    }
  }

  function streetBackground(ctx, t, camX) {
    const W = 1080;
    F.sky(ctx, '#2f9cf0', '#bfe6ff', { x: -300, y: -300, w: W + 600, h: 1600, mid: P.spainSky, midAt: 0.35 });
    sun(ctx, 890 - camX * 0.1, 240, t + 4);
    ctx.save();
    ctx.translate(-camX * 0.15, 0);
    F.cloud(ctx, 190 + t * 18, 470, 260);
    F.cloud(ctx, 668 + t * 12, 780, 200);
    F.cloud(ctx, 28 + t * 22, 880, 170);
    ctx.restore();
    pigeons(ctx, t + 4);
    ctx.save();
    ctx.translate(-camX * 0.25, 0);
    farLayer(ctx);
    ctx.restore();
    ctx.save();
    ctx.translate(-camX * 0.6, 0);
    midLayer(ctx);
    ctx.restore();
    ctx.save();
    street(ctx, camX);
    ctx.translate(-camX, 0);
    lampPost(ctx, 120);
    lampPost(ctx, 1260);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Phases
  // ---------------------------------------------------------------------------
  const HX = 540;
  const S = 1.4;
  const K = S * 1.15; // head scale
  const HEAD_Y = GROUND - 462 * S;

  function zoomAt(t) {
    // snap push-in on the freeze, harder after the impact frame
    let z = 1;
    if (t >= T_FREEZE) z += 0.2 * L.ease.outCubic(clamp((t - T_FREEZE) / 0.2));
    if (t >= T_IMPACT_END) z += 0.35 * L.ease.outExpo(clamp((t - T_IMPACT_END) / 0.12));
    return z;
  }

  function drawStreet(ctx, t, tw) {
    const tWalk = Math.min(tw, T_FREEZE);
    const camX = 70 + tWalk * 110; // continues the pan from shot 07
    const z = zoomAt(t);
    const shA = F.shake(t, T_FREEZE, 0.3, 10, 4);
    const shC = F.shake(t, T_IMPACT_END, 0.4, 22, 5);
    const zc = [HX, HEAD_Y + 40];

    ctx.save();
    ctx.translate(zc[0] + shA[0] + shC[0], zc[1] + shA[1] + shC[1]);
    ctx.scale(z, z);
    ctx.translate(-zc[0], -zc[1]);

    streetBackground(ctx, t, camX);

    // darkening wash + menace once he is shocked
    if (t >= T_IMPACT_END) {
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#3b1d6e';
      ctx.fillRect(-200, -200, 1500, 2400);
      ctx.restore();
      F.focusLines(ctx, HX, HEAD_Y + 20, { rx: 330, ry: 420, count: 90, color: '#1b1424', alpha: 0.75, seed: 21 });
    }

    // aroma ribbon from off-screen right to the nose
    const nose = [HX + 4 * K, HEAD_Y + 38 * K];
    const rev = L.ease.inOutSine(clamp((t - T_AROMA) / 0.6));
    const pts = [[1400, 1150], [1180, 1060], [1040, 1200], [900, 1260], [760, 1170], [nose[0] + 40, nose[1]]];

    // suitcase trailing
    const ss = 0.78;
    const bob = Math.abs(Math.sin(tWalk * 12.566)) * -4;
    const caseX = HX - 330, caseRot = 0.42 + Math.sin(tWalk * 12.566) * 0.03;
    ctx.save();
    ctx.translate(caseX, GROUND - 8 + bob);
    ctx.rotate(caseRot);
    F.suitcase(ctx, 0, 0, ss, { color: '#e8413c' });
    ctx.restore();

    // Hayk, frozen mid-stride after T_FREEZE (with a tiny jolt)
    const frozen = t >= T_FREEZE;
    let jy = 0, sx = 1, sy = 1;
    if (frozen && t < T_FREEZE + 2 / 12) { sx = 0.94; sy = 1.08; jy = -16; }
    ctx.save();
    ctx.translate(HX, GROUND);
    ctx.scale(sx, sy);
    ctx.translate(-HX, -GROUND);
    const a = FILM.cast.hayk(ctx, {
      x: HX, y: GROUND + jy, s: S, t: frozen ? T_FREEZE : tw, pose: 'walk', face: frozen ? 'shocked' : 'smile',
      shades: !frozen, look: [0.6, 0.2],
    });
    ctx.restore();
    const htop = [caseX + Math.sin(caseRot) * 390 * ss, GROUND - 8 + bob - Math.cos(caseRot) * 390 * ss];
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = P.line; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.moveTo(htop[0], htop[1]); ctx.lineTo(a.handL[0], a.handL[1] + 6); ctx.stroke();
    ctx.strokeStyle = '#9aa3b8'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(htop[0], htop[1]); ctx.lineTo(a.handL[0], a.handL[1] + 6); ctx.stroke();
    ctx.restore();

    if (frozen) {
      if (t < T_IMPACT_END) {
        // glasses slide down the nose
        const u = L.ease.inOutSine(clamp((t - T_FREEZE - 0.08) / 0.3));
        shades(ctx, a.head, K, lerp(0, 24, u), lerp(0, 0.1, u));
      } else {
        // after the impact they drop off his face, tumbling
        const age = t - T_IMPACT_END;
        const fy = 24 + 900 * age * age + 120 * age;
        shades(ctx, a.head, K, fy, 0.1 + age * 5, age * 60);
      }
      // "!" pop and shock ticks
      const pop = F.popIn(t, T_FREEZE);
      F.text(ctx, '!', a.top[0] + 120, a.top[1] - 40, { size: 150, fill: '#ff3b3b', lw: 14, scale: pop, rot: 0.15 });
      ctx.save();
      ctx.strokeStyle = P.line; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const an = -2.4 + i * 0.35;
        const r0 = 170 + (L.boil(L.T) % 2) * 8;
        ctx.moveTo(a.head[0] + Math.cos(an) * r0, a.head[1] + Math.sin(an) * r0);
        ctx.lineTo(a.head[0] + Math.cos(an) * (r0 + 60), a.head[1] + Math.sin(an) * (r0 + 60));
      }
      ctx.stroke();
      ctx.restore();
      F.sweat(ctx, a.head[0] + 105, a.head[1] - 50, 1.1);
    } else {
      // walking: dust puffs on steps
      for (let k = 0; k < 3; k++) F.dust(ctx, HX - 40 + k * 10, GROUND, t - k * 0.5, { n: 4, size: 22, spread: 70, seed: 30 + k, life: 0.45 });
    }
    // sniff
    F.sfx(ctx, 'SNIFF', nose[0] + 230, nose[1] - 170, t, 0.9, { size: 56, life: 0.5, rot: 0.1, fill: '#fff3b0', shadowColor: '#e0961a' });

    // foreground palms (scroll faster)
    palm(ctx, 1010 - (camX - 70) * 1.25 - 88, 1900, 1180, t + 4, 5, 1.0);
    palm(ctx, -40 - (camX - 70) * 1.25 - 88, 1960, 900, t + 4, 9, 0.9);
    aromaRibbon(ctx, pts, t, rev, { amp: 18 });
    ctx.restore();

    // screen-fixed menace once shocked
    if (t >= T_IMPACT_END) {
      F.menace(ctx, 150, 1350, t, { size: 110, n: 4, seed: 3 });
      F.menace(ctx, 940, 1300, t, { size: 90, n: 3, seed: 8 });
    }
    return a;
  }

  function drawImpact(ctx, t) {
    const z = 1.32;
    const zc = [HX, HEAD_Y + 40];
    ctx.save();
    const sh = F.shake(t, T_IMPACT, 0.17, 26, 6);
    ctx.translate(sh[0], sh[1]);
    F.impact(ctx, { cx: HX, cy: HEAD_Y, inner: 380, seed: 12 });
    ctx.translate(zc[0], zc[1]);
    ctx.scale(z, z);
    ctx.translate(-zc[0], -zc[1]);
    const a = FILM.cast.hayk(ctx, { x: HX, y: GROUND, s: S, t: T_FREEZE, pose: 'walk', face: 'shocked', silhouette: '#0a0a10' });
    // wide white eyes on the silhouette
    [a.eyeL, a.eyeR].forEach((e) => {
      ellipse(ctx, e[0], e[1], 30 * K, 36 * K); fo(ctx, '#ffffff', 0);
      ellipse(ctx, e[0], e[1] + 4, 5 * K, 6 * K); fo(ctx, '#0a0a10', 0);
    });
    ctx.restore();
    F.text(ctx, 'ドン', 830, 420, { size: 170, fill: '#0a0a10', stroke: '#ffffff', lw: 18, rot: 0.2, font: 'jp' });
  }

  function drawXCU(ctx, t, tw) {
    const u = t - T_XCU;
    const S2 = 10.5;
    const K2 = S2 * 1.15;
    const HC = [540, 870]; // head centre on screen
    const push = 1 + 0.07 * L.ease.inOutSine(clamp(u / 2));
    const sh = F.shakeMany(t, [[T_XCU, 0.3, 24], [T_SHOUT, 0.5, 20]], 9);
    const tremble = [(hs('tr', L.boil(L.T)) - 0.5) * 6, (hs('tr2', L.boil(L.T)) - 0.5) * 6];

    ctx.save();
    ctx.translate(HC[0] + sh[0] + tremble[0], HC[1] + sh[1] + tremble[1]);
    ctx.scale(push, push);
    ctx.translate(-HC[0], -HC[1]);
    // backdrop (only shows at the edges)
    F.sky(ctx, '#3b1d6e', '#e0961a', { x: -300, y: -300, w: 1700, h: 2500 });
    const a = FILM.cast.hayk(ctx, { x: HC[0], y: HC[1] + 462 * S2, s: S2, t: tw, pose: 'stand', face: 'shocked' });
    eyeReflect(ctx, a.eyeL, K2, t, 0);
    eyeReflect(ctx, a.eyeR, K2, t, 1);
    // sweat and blush of desire
    F.sweat(ctx, HC[0] + 440, HC[1] - 390, 3);
    // aroma wisps drifting into the nose
    const nose = [HC[0] + 4 * K2, HC[1] + 24 * K2];
    aromaRibbon(ctx, [[1300, 1640], [1120, 1520], [980, 1560], [860, 1380], [nose[0] + 60, nose[1] + 30]], t, 1, { width: 50, amp: 24, ghost: 0.35 });
    ctx.restore();

    // manga focus lines leaving the eye band clear (screen-fixed)
    F.focusLines(ctx, 540, 930, { rx: 660, ry: 470, count: 130, color: '#1b1424', alpha: 0.9, seed: 33, width: 20 });
    // cut-in flash
    if (u < 2 / 24) F.flash(ctx, 0.8, '#ffffff');

    // menace beside him
    F.menace(ctx, 78, 1470, t, { size: 88, n: 3, seed: 5 });
    F.menace(ctx, 1002, 1450, t, { size: 80, n: 3, seed: 11 });

    // text
    if (t >= T_WAIT) {
      const pop = F.popIn(t, T_WAIT);
      const b = L.boil(L.T);
      F.text(ctx, 'WAIT...', 540 + (hs('wj', b) - 0.5) * 6, 330, { size: 120, fill: '#ffffff', lw: 20, scale: pop, shadow: 10, shadowColor: '#7a3cff', rot: -0.04 });
    }
    F.bubble(ctx, 'IS THAT...\nA BURGER?!', 540, 1320, { size: 70, shout: true, shake: 12, t, t0: T_SHOUT, fill: '#fff05a' });
  }

  // ---------------------------------------------------------------------------
  // Draw
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      if (t >= T_XCU) drawXCU(ctx, t, tw);
      else if (t >= T_IMPACT && t < T_IMPACT_END) drawImpact(ctx, t);
      else drawStreet(ctx, t, tw);
    },
  });
})();

</script>
<script>
// ---- src/scenes/09-kfg.js
// Shot 09 'kfg' : "KFG: bucket of chicken"  (global T 34.0 - 39.0, 5 s)
//
// Parody fried-chicken joint "KFG" (red/white stripes, a cartoon CHICKEN mascot with glasses and a
// bow tie, "KENTUCKY FRIED GOODNESS"). Hayk (pose "eat", face "ecstatic", belly 0.15) at a table
// with a KFG bucket, holding a drumstick. CRUNCH! bites at 1.0, 2.0, 3.0 s (T 35, 36, 37) with
// crumbs; golden rays burst behind him at 3.0 s. Caption top-left "STOP 1: KFG".
//
// Layers (back to front):
//   1 wall: red/white stripes, wood wainscot, window onto the street, menu board
//   2 KFG sign board with the chicken mascot
//   3 pendant lamps (swinging)
//   4 golden ray burst (from 3.0 s) + glow
//   5 Hayk with drumstick, bite lean, cheek glow, sparkles
//   6 table, tray, bucket, drink, bone plate, crumbs
//   7 CRUNCH! SFX, flash, caption (screen-fixed)
(function () {
  'use strict';
  const ID = 'kfg';
  const L = FILM.lib;
  const F = FILM.fx;
  const P = F.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const h01 = (...k) => F.h01(ID, ...k);
  const { ellipse, fo, rrect } = F;

  const BITES = [1.0, 2.0, 3.0]; // T 35, 36, 37
  const T_RAYS = 3.0; // T 37
  const BLINE = '#5a2a2e';
  const TABLE_Y = 1500;
  const HX = 590, HFEET = 1950, HS = 2.0;

  // ---------------------------------------------------------------------------
  // Background
  // ---------------------------------------------------------------------------
  function wall(ctx) {
    // stripes
    ctx.fillStyle = '#fff4e0';
    ctx.fillRect(-100, -100, 1300, 1400);
    ctx.fillStyle = '#e0453f';
    for (let x = -100; x < 1200; x += 120) ctx.fillRect(x, -100, 60, 1400);
    // soft shade from the top
    const g = ctx.createLinearGradient(0, 0, 0, 500);
    g.addColorStop(0, 'rgba(90,20,30,0.25)');
    g.addColorStop(1, 'rgba(90,20,30,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-100, -100, 1300, 600);
    // wood wainscot
    ctx.fillStyle = '#9a5a36';
    ctx.fillRect(-100, 1150, 1300, 400);
    ctx.fillStyle = '#b36c42';
    for (let x = -100; x < 1200; x += 90) ctx.fillRect(x + 6, 1190, 78, 330);
    rrect(ctx, -100, 1140, 1300, 30, 4); fo(ctx, '#7a4128', 4, BLINE);
    // window onto the Spanish street (right)
    rrect(ctx, 800, 820, 260, 300, 18); fo(ctx, '#7fcfff', 6, BLINE);
    ctx.save();
    rrect(ctx, 800, 820, 260, 300, 18); ctx.clip();
    ctx.fillStyle = '#f3c38f'; ctx.fillRect(800, 960, 260, 160);
    ctx.fillStyle = '#d9653b'; ctx.fillRect(800, 940, 260, 26);
    ctx.fillStyle = '#5f8fc4';
    for (let i = 0; i < 4; i++) ctx.fillRect(820 + i * 62, 990, 30, 50);
    ctx.fillStyle = '#57b457';
    ctx.beginPath(); ctx.ellipse(1010, 900, 70, 26, -0.4, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.moveTo(830, 1120); ctx.lineTo(920, 820); ctx.lineTo(960, 820); ctx.lineTo(870, 1120); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = BLINE; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(930, 820); ctx.lineTo(930, 1120); ctx.moveTo(800, 970); ctx.lineTo(1060, 970); ctx.stroke();
    // menu board (left), picture-only
    rrect(ctx, 30, 820, 230, 290, 12); fo(ctx, '#2d2530', 6, BLINE);
    for (let i = 0; i < 3; i++) {
      const y = 860 + i * 84;
      rrect(ctx, 50, y, 70, 60, 8); fo(ctx, '#fff4e0', 3, '#fff4e0');
      ctx.fillStyle = i === 1 ? P.chicken : P.gold;
      ctx.beginPath(); ctx.arc(85, y + 30, 20, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff4e0';
      ctx.fillRect(135, y + 14, 100, 10);
      ctx.fillStyle = P.gold;
      ctx.fillRect(135, y + 36, 60, 10);
    }
  }

  /** the KFG mascot: a cartoon chicken with glasses, a white goatee tuft and a bow tie */
  function mascot(ctx, x, y, s, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.rotate(Math.sin(t * Math.PI * 2) * 0.04);
    // badge disc
    ellipse(ctx, 0, 0, 150, 150); fo(ctx, '#ffffff', 8);
    ellipse(ctx, 0, 0, 132, 132); fo(ctx, null, 5, '#e0453f');
    // comb
    ctx.beginPath();
    ctx.moveTo(-40, -70);
    ctx.arc(-34, -92, 22, Math.PI * 0.9, Math.PI * 1.9);
    ctx.arc(0, -104, 26, Math.PI * 1.05, Math.PI * 1.95);
    ctx.arc(34, -90, 22, Math.PI * 1.1, Math.PI * 2.1);
    ctx.lineTo(40, -66);
    ctx.closePath();
    fo(ctx, '#e8413c', 6);
    // head
    ellipse(ctx, 0, -6, 80, 86); fo(ctx, '#ffffff', 6);
    ctx.fillStyle = '#e9e4ee';
    ctx.beginPath(); ctx.ellipse(40, 0, 30, 70, 0, 0, TAU); ctx.fill();
    // glasses
    ctx.strokeStyle = P.line; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(-30, -26, 22, 0, TAU); ctx.moveTo(52, -26); ctx.arc(30, -26, 22, 0, TAU); ctx.moveTo(-8, -26); ctx.lineTo(8, -26); ctx.stroke();
    // eyes (happy)
    ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-40, -22); ctx.quadraticCurveTo(-30, -36, -20, -22); ctx.moveTo(20, -22); ctx.quadraticCurveTo(30, -36, 40, -22); ctx.stroke();
    // beak
    ctx.beginPath(); ctx.moveTo(-26, 4); ctx.lineTo(26, 4); ctx.lineTo(0, 34); ctx.closePath(); fo(ctx, '#ffb13a', 5);
    ctx.beginPath(); ctx.moveTo(-18, 18); ctx.lineTo(18, 18); ctx.stroke();
    // wattle
    ellipse(ctx, 8, 44, 12, 16); fo(ctx, '#e8413c', 4);
    // white goatee tuft
    ctx.beginPath(); ctx.moveTo(-18, 58); ctx.quadraticCurveTo(0, 104, 16, 62); ctx.quadraticCurveTo(0, 74, -18, 58); fo(ctx, '#ffffff', 5);
    // cheeks
    ctx.fillStyle = 'rgba(255,120,120,0.6)';
    ctx.beginPath(); ctx.ellipse(-52, 8, 14, 8, 0, 0, TAU); ctx.ellipse(52, 8, 14, 8, 0, 0, TAU); ctx.fill();
    // bow tie
    ctx.beginPath();
    ctx.moveTo(0, 96); ctx.lineTo(-52, 72); ctx.lineTo(-52, 122); ctx.closePath();
    fo(ctx, '#e8413c', 5);
    ctx.beginPath();
    ctx.moveTo(0, 96); ctx.lineTo(52, 72); ctx.lineTo(52, 122); ctx.closePath();
    fo(ctx, '#e8413c', 5);
    ellipse(ctx, 0, 97, 13, 13); fo(ctx, '#c0182a', 5);
    ctx.restore();
  }

  function sign(ctx, t) {
    const y0 = 330, y1 = 670;
    // board with bulbs
    rrect(ctx, 70, y0, 940, y1 - y0, 34); fo(ctx, P.kfgRed, 8);
    rrect(ctx, 90, y0 + 20, 900, y1 - y0 - 40, 24); fo(ctx, null, 5, '#ffffff');
    const on = Math.floor(t * 6) % 2;
    for (let i = 0; i < 18; i++) {
      const bx = 110 + i * 50;
      ctx.fillStyle = (i + on) % 2 ? '#fff6b0' : '#ffd23a';
      ctx.beginPath(); ctx.arc(bx, y0 + 12, 8, 0, TAU); ctx.arc(bx, y1 - 12, 8, 0, TAU); ctx.fill();
    }
    mascot(ctx, 270, 500, 0.98, t);
    // "KFG" letters with a stepped 3D shadow
    F.text(ctx, 'KFG', 690, 462, { size: 190, fill: '#ffffff', stroke: P.line, lw: 20, shadow: 12, shadowColor: '#7a0f16', skew: -0.08 });
    rrect(ctx, 440, 568, 500, 56, 12); fo(ctx, '#ffffff', 5);
    F.text(ctx, 'KENTUCKY FRIED GOODNESS', 690, 598, { size: 34, fill: P.kfgRed, lw: 0 });
  }

  function lamps(ctx, t) {
    [[930, 1.1]].forEach(([x, ph]) => {
      const sw = Math.sin(t * 2.4 + ph) * 0.05;
      ctx.save();
      ctx.translate(x, -20);
      ctx.rotate(sw);
      ctx.strokeStyle = P.line; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 170); ctx.stroke();
      // warm cone
      ctx.fillStyle = 'rgba(255,230,150,0.22)';
      ctx.beginPath(); ctx.moveTo(-40, 240); ctx.lineTo(40, 240); ctx.lineTo(260, 900); ctx.lineTo(-260, 900); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-22, 170); ctx.lineTo(22, 170); ctx.lineTo(60, 232); ctx.lineTo(-60, 232); ctx.closePath();
      fo(ctx, '#c0182a', 5);
      ellipse(ctx, 0, 234, 26, 10); fo(ctx, '#fff6c0', 4);
      ctx.restore();
    });
  }

  // ---------------------------------------------------------------------------
  // Foreground: table and food
  // ---------------------------------------------------------------------------
  function table(ctx) {
    // top
    ctx.beginPath();
    ctx.moveTo(-60, TABLE_Y); ctx.lineTo(1140, TABLE_Y); ctx.lineTo(1140, TABLE_Y + 70); ctx.lineTo(-60, TABLE_Y + 70); ctx.closePath();
    fo(ctx, '#f7efe2', 6);
    ctx.fillStyle = '#e4d6c0';
    ctx.fillRect(-60, TABLE_Y + 44, 1200, 24);
    // front apron in red
    ctx.beginPath(); ctx.rect(-60, TABLE_Y + 70, 1200, 600); fo(ctx, '#c0182a', 6);
    ctx.fillStyle = '#9a0f1f';
    ctx.fillRect(-60, TABLE_Y + 70, 1200, 30);
    // stripes on the apron
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let x = -40; x < 1140; x += 110) ctx.fillRect(x, TABLE_Y + 120, 40, 600);
    // tray
    ctx.save();
    ctx.translate(560, TABLE_Y + 20);
    ctx.beginPath(); ctx.moveTo(-240, -24); ctx.lineTo(240, -24); ctx.lineTo(262, 24); ctx.lineTo(-262, 24); ctx.closePath();
    fo(ctx, '#e0453f', 5);
    ctx.fillStyle = '#fff4e0';
    ctx.beginPath(); ctx.moveTo(-150, -18); ctx.lineTo(130, -18); ctx.lineTo(146, 18); ctx.lineTo(-160, 18); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function bonePlate(ctx, x, y, n) {
    ellipse(ctx, x, y, 110, 26); fo(ctx, '#ffffff', 5);
    ellipse(ctx, x, y - 2, 80, 16); fo(ctx, null, 3, 'rgba(27,20,36,0.3)');
    for (let i = 0; i < n; i++) {
      ctx.save();
      ctx.translate(x - 40 + i * 36, y - 12 - (i % 2) * 8);
      ctx.rotate(-0.4 + i * 0.5);
      rrect(ctx, -34, -7, 68, 14, 7); fo(ctx, '#fff3dc', 4);
      ctx.beginPath(); ctx.arc(-34, -7, 9, 0, TAU); ctx.arc(-34, 7, 9, 0, TAU); ctx.arc(34, -7, 9, 0, TAU); ctx.arc(34, 7, 9, 0, TAU); fo(ctx, '#fff3dc', 4);
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------------------
  // Draw
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);

      // bite state
      let nb = 0;
      BITES.forEach((b) => { if (t >= b - 1e-6) nb++; });
      const lastBite = nb ? BITES[nb - 1] : -9;
      const age = t - lastBite;
      // lunge toward the drumstick: wind up 0.25 s before each bite, snap on the beat
      let lunge = 0;
      BITES.forEach((b) => {
        const d = t - b;
        if (d > -0.25 && d < 0) lunge = Math.max(lunge, L.ease.inQuad((d + 0.25) / 0.25));
        else if (d >= 0 && d < 0.35) lunge = Math.max(lunge, 1 - L.ease.outCubic(d / 0.35));
      });
      const squash = nb && age < 2 / 12 + 1e-6;

      // camera
      const push = 1 + 0.07 * L.ease.inOutSine(clamp(t / info.dur));
      const sh = F.shakeMany(t, BITES.map((b, i) => [b, 0.3, i === 2 ? 26 : 16]), 4);
      ctx.save();
      ctx.translate(540 + sh[0], 1000 + sh[1]);
      ctx.scale(push, push);
      ctx.translate(-540, -1000);

      // 1-3 background
      wall(ctx);
      sign(ctx, t);
      lamps(ctx, t);

      // 4 golden rays from 3.0 s
      const headC = [HX, HFEET - 462 * HS];
      if (t >= T_RAYS - 1e-6) {
        const u = clamp((t - T_RAYS) / 0.25);
        ctx.save();
        ctx.globalAlpha = u;
        ctx.beginPath(); ctx.rect(-100, -100, 1300, TABLE_Y + 120); ctx.clip();
        F.sunburst(ctx, headC[0], headC[1], { rays: 22, colorA: '#ffd35a', colorB: '#ff9d2a', rot: t * 0.5 });
        const g = ctx.createRadialGradient(headC[0], headC[1], 40, headC[0], headC[1], 560);
        g.addColorStop(0, 'rgba(255,255,230,0.95)');
        g.addColorStop(1, 'rgba(255,255,230,0)');
        ctx.fillStyle = g;
        ctx.fillRect(-100, -100, 1300, 2100);
        ctx.restore();
      } else {
        // warm glow behind him before the burst
        const g = ctx.createRadialGradient(headC[0], headC[1], 40, headC[0], headC[1], 460);
        g.addColorStop(0, 'rgba(255,240,180,0.55)');
        g.addColorStop(1, 'rgba(255,240,180,0)');
        ctx.fillStyle = g;
        ctx.fillRect(-100, -100, 1300, 2100);
      }

      // 5 Hayk
      const bob = F.bounce(tw, 2, 8);
      ctx.save();
      ctx.translate(HX, HFEET);
      if (squash) ctx.scale(1.06, 0.92);
      ctx.translate(-HX, -HFEET);
      const a = FILM.cast.hayk(ctx, {
        x: HX, y: HFEET + bob + lunge * 18, s: HS, t: tw, pose: 'eat', face: 'ecstatic', belly: 0.15,
        hold: 'drumstick', bite: [0, 0.35, 0.65, 0.9][nb], headTilt: -0.22 * lunge, tilt: 0.05 * lunge,
      });
      ctx.restore();
      // glowing cheeks and bliss sparkles around the head
      ctx.save();
      const cg = 0.35 + 0.25 * Math.sin(t * 8);
      ctx.fillStyle = `rgba(255,120,150,${cg})`;
      ctx.beginPath(); ctx.ellipse(a.eyeL[0] - 18, a.eyeL[1] + 52, 34, 16, 0, 0, TAU); ctx.ellipse(a.eyeR[0] + 18, a.eyeR[1] + 52, 34, 16, 0, 0, TAU); ctx.fill();
      ctx.restore();
      F.sparkles(ctx, { x: a.head[0] - 300, y: a.head[1] - 260, w: 600, h: 420, n: t >= T_RAYS ? 14 : 8, seed: 19, t, size: 30 });
      if (t >= T_RAYS) F.hearts(ctx, a.head[0] + 170, a.head[1] - 60, t - T_RAYS, { n: 4, seed: 3 });

      // 6 table and food
      table(ctx);
      bonePlate(ctx, 860, TABLE_Y + 12, nb);
      F.drink(ctx, 985, TABLE_Y - 6, 0.8, { color: P.kfgRed });
      F.bucket(ctx, 215, TABLE_Y + 18, 1.2, { label: 'KFG' });
      F.steam(ctx, 215, TABLE_Y - 350, t, { n: 3, h: 130 });
      // crumbs from each bite at the mouth
      BITES.forEach((b, i) => {
        F.crumbs(ctx, a.mouth[0] + 150, a.mouth[1] - 20, t - b, { n: i === 2 ? 22 : 16, seed: 50 + i, spread: 520, colors: [P.chicken, P.chickenShade, '#ffd98a', '#fff3dc'], life: 0.9 });
      });
      ctx.restore();

      // 7 screen-fixed: CRUNCH! on every bite
      const pos = [[330, 770, -0.16, 135], [750, 770, 0.14, 135], [540, 560, -0.08, 180]];
      BITES.forEach((b, i) => {
        const [x, y, rot, size] = pos[i];
        if (t >= b - 1e-6 && t < b + 0.85) {
          if (t - b < 0.2) F.burst(ctx, x, y, size * 2.2, size * 1.3, 16, i === 2 ? '#fff05a' : '#ffffff', { seed: 7 + i, lw: 6, squash: 0.5 });
        }
        F.sfx(ctx, 'CRUNCH!', x, y, t, b, { size, rot, life: 0.85, fill: i === 2 ? '#ff3b3b' : P.sfxYellow, shadowColor: i === 2 ? '#7a0f16' : '#b3122b', shake: 8 });
      });
      // impact flash on the third bite + ray burst
      if (t >= T_RAYS && t < T_RAYS + 2 / 24) F.flash(ctx, 0.7, '#fff6d8');
      F.caption(ctx, 'STOP 1: KFG', 70, 262, { size: 64, t, t0: 0, from: 'left', bg: P.line, accent: P.kfgRed });
    },
  });
})();

</script>
<script>
// ---- src/scenes/10-burger-kong.js
// Shot 10 'burger-kong' : "Burger Kong"  (global T 39.0 - 44.0, local t 0..5)
//
// Beats (local):
//   0.0  Hayk (crown, pose eatBig) behind a table, holding a HUGE triple-stack burger, drooling
//   0.6  wind-up: leans back, jaw opens (determined + shout mouth)
//   1.0  CHOMP: 4-frame black/white impact frame with an unhinged monster jaw, shake, crumbs
//   1.0-2.5  chewing, burger 1/3 gone (still 1/3 at 2.0)
//   2.5  second chomp -> 2/3 gone
//   3.0  GULP: burger gone, he thrusts a second burger up (pose fist), golden rays
//   3.5  bubble "ONE MORE. FOR RESEARCH."
//   caption "STOP 2: BURGER KONG" top-left the whole shot
//
// Layers back to front:
//   1 restaurant interior (cached): wall, pendant lamps, BURGER KONG sign with gorilla, menu boards,
//     back counter, checker floor
//   2 animated background: lamp glow, sign glints, focus lines / golden rays
//   3 Hayk (FILM.cast.hayk)
//   4 mega burger (offscreen composite with bite mask) + fingers over the bun
//   5 table, tray, fries, drink (foreground)
//   6 effects: crumbs, SFX, sparkles
//   7 screen-fixed: caption, bubble
(function () {
  'use strict';
  const ID = 'burger-kong';
  const FILM = window.FILM;
  const F = FILM.fx;
  const P = F.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const W = 1080, H = 1920;
  const FR = 1 / 24;
  // offscreen canvases match the main canvas backing (CPU when the frame is read back, as in the
  // tools), otherwise every drawImage of a cached layer costs a GPU readback
  let WRF = false;
  // full-frame cached layers are drawn with nearest-neighbour sampling: under a camera push a
  // bilinear resample of 2 M pixels costs ~50 ms on a CPU-backed canvas; flat cel art hides the difference
  function drawLayer(ctx, img, x, y, w, h) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, x, y, w, h);
    ctx.restore();
  }
  const wrfOf = (ctx) => !!(ctx.getContextAttributes && ctx.getContextAttributes().willReadFrequently);

  // beat constants (local t)
  const T_WIND = 0.6; // T 39.6
  const T_CHOMP = 1.0; // T 40.0
  const T_BITE2 = 2.5; // T 41.5
  const T_GULP = 3.0; // T 42.0
  const T_LINE = 3.5; // T 42.5

  // Hayk placement
  const HX = 540, HY = 1900, HS = 2.0;
  const TABLE_Y = 1560;

  // ---------------------------------------------------------------------------
  // Static background (cached)
  // ---------------------------------------------------------------------------
  function gorilla(g, x, y, s) {
    g.save();
    g.translate(x, y);
    g.scale(s, s);
    const line = P.line;
    const fur = '#4a3b4f', furShade = '#372b3c', face = '#c9a88a';
    // ears
    F.ellipse(g, -78, -6, 22, 26); F.fo(g, fur, 5, line);
    F.ellipse(g, 78, -6, 22, 26); F.fo(g, fur, 5, line);
    F.ellipse(g, -78, -6, 10, 13); g.fillStyle = face; g.fill();
    F.ellipse(g, 78, -6, 10, 13); g.fillStyle = face; g.fill();
    // head
    F.curve(g, [[-70, -40], [-50, -86], [0, -100], [50, -86], [70, -40], [72, 20], [40, 70], [0, 80], [-40, 70], [-72, 20]]);
    F.fo(g, fur, 6, line);
    g.fillStyle = furShade;
    F.ellipse(g, 40, 30, 26, 44, 0.3); g.fill();
    // face mask (heart-ish)
    F.curve(g, [[-50, -30], [-20, -50], [0, -30], [20, -50], [50, -30], [54, 10], [40, 56], [0, 66], [-40, 56], [-54, 10]]);
    F.fo(g, face, 5, line);
    // brow ridge
    g.beginPath(); g.moveTo(-50, -26); g.quadraticCurveTo(0, -46, 50, -26); g.lineWidth = 8; g.strokeStyle = line; g.lineCap = 'round'; g.stroke();
    // eyes (friendly)
    g.fillStyle = '#ffffff';
    F.ellipse(g, -22, -10, 11, 13); g.fill(); g.lineWidth = 3.5; g.stroke();
    F.ellipse(g, 22, -10, 11, 13); g.fill(); g.stroke();
    g.fillStyle = line;
    F.ellipse(g, -20, -8, 6, 8); g.fill();
    F.ellipse(g, 24, -8, 6, 8); g.fill();
    // nostrils
    F.ellipse(g, -9, 18, 5, 4); g.fill();
    F.ellipse(g, 9, 18, 5, 4); g.fill();
    // big grin
    g.beginPath(); g.moveTo(-30, 34); g.quadraticCurveTo(0, 62, 30, 34); g.closePath();
    F.fo(g, '#ffffff', 4, line);
    // crown
    F.crown(g, 0, -80, 0.62, { rot: 0.12 });
    g.restore();
  }

  function kongSign(g, cx, cy) {
    // burger-bun shaped sign: top bun, blue swoosh band with the name, bottom bun
    const w = 700;
    g.save();
    // glow behind
    const gl = g.createRadialGradient(cx, cy, 80, cx, cy, 460);
    gl.addColorStop(0, 'rgba(255,236,170,0.55)');
    gl.addColorStop(1, 'rgba(255,236,170,0)');
    g.fillStyle = gl;
    g.fillRect(cx - 480, cy - 400, 960, 800);
    // top bun
    g.beginPath();
    g.moveTo(cx - w / 2, cy - 24);
    g.bezierCurveTo(cx - w / 2, cy - 250, cx + w / 2, cy - 250, cx + w / 2, cy - 24);
    g.closePath();
    F.fo(g, P.bun, 6);
    g.fillStyle = P.bunTop;
    F.ellipse(g, cx - 120, cy - 150, 150, 40, -0.12); g.fill();
    g.fillStyle = P.sesame;
    [[-230, -80], [-150, -150], [-60, -175], [40, -178], [140, -160], [230, -110], [-20, -120], [100, -110], [-110, -100], [190, -70]].forEach(([sx, sy], i) => {
      F.ellipse(g, cx + sx, cy + sy, 11, 6, (i % 3) * 0.5 - 0.5); g.fill();
    });
    // bottom bun
    F.rrect(g, cx - w / 2 + 20, cy + 70, w - 40, 90, 44);
    F.fo(g, P.bunShade, 6);
    // blue swoosh band (the name)
    g.beginPath();
    g.moveTo(cx - w / 2 - 50, cy - 10);
    g.quadraticCurveTo(cx, cy - 70, cx + w / 2 + 50, cy - 30);
    g.lineTo(cx + w / 2 + 30, cy + 70);
    g.quadraticCurveTo(cx, cy + 30, cx - w / 2 - 40, cy + 100);
    g.closePath();
    F.fo(g, P.kongBlue, 6);
    // swoosh highlight
    g.beginPath();
    g.moveTo(cx - w / 2 - 30, cy + 6);
    g.quadraticCurveTo(cx, cy - 50, cx + w / 2 + 34, cy - 18);
    g.lineWidth = 7; g.strokeStyle = '#6fa6ff'; g.stroke();
    F.text(g, 'BURGER KONG', cx + 30, cy + 26, { size: 92, fill: '#ffffff', stroke: P.line, lw: 14, rot: -0.03, skew: -0.1, shadow: 7, shadowColor: '#b3122b' });
    g.restore();
    gorilla(g, cx + w / 2 - 40, cy - 190, 0.95);
  }

  function menuBoard(g, x, y, w, h, seed) {
    F.rrect(g, x, y, w, h, 14);
    F.fo(g, '#2b2238', 5);
    F.rrect(g, x + 10, y + 10, w - 20, h - 20, 8);
    g.fillStyle = '#3a2f4c'; g.fill();
    // three items with price strips
    for (let i = 0; i < 3; i++) {
      const iy = y + 40 + i * (h - 60) / 3;
      F.burger(g, x + 60, iy + 20, 0.3);
      g.fillStyle = 'rgba(255,255,255,0.75)';
      g.fillRect(x + 110, iy + 6, w - 190, 10);
      g.fillRect(x + 110, iy + 26, (w - 190) * (0.5 + F.h01(ID, 'mb', seed, i) * 0.4), 8);
      g.fillStyle = P.gold;
      F.rrect(g, x + w - 70, iy + 2, 52, 30, 8); g.fill();
    }
  }

  function lamp(g, x, len) {
    g.strokeStyle = P.line; g.lineWidth = 4;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, len); g.stroke();
    g.beginPath();
    g.moveTo(x - 60, len + 60); g.quadraticCurveTo(x - 50, len, x, len); g.quadraticCurveTo(x + 50, len, x + 60, len + 60); g.closePath();
    F.fo(g, P.kongOrange, 5);
    g.fillStyle = '#fff3c4';
    F.ellipse(g, x, len + 60, 50, 10); g.fill();
  }

  function buildBg() {
    const S = FILM.S || 1;
    const c = FILM.makeCanvas(Math.round(W * S), Math.round(H * S));
    const g = c.getContext('2d', { willReadFrequently: WRF });
    g.setTransform(S, 0, 0, S, 0, 0);
    // wall
    F.sky(g, '#ffe2b8', '#f6b872', { mid: '#ffd49a', midAt: 0.45 });
    // big vertical wall panels (soft stripes)
    g.fillStyle = 'rgba(242,134,43,0.14)';
    for (let i = 0; i < 6; i++) g.fillRect(i * 190 - 20, 0, 90, 1300);
    // ceiling band
    g.fillStyle = '#d9653b';
    g.fillRect(0, 0, W, 60);
    g.fillStyle = 'rgba(0,0,0,0.12)';
    g.fillRect(0, 60, W, 10);
    // menu boards left and right (behind Hayk's shoulders)
    menuBoard(g, 30, 720, 250, 300, 1);
    menuBoard(g, 800, 720, 250, 300, 2);
    // flag bunting
    for (let i = 0; i < 14; i++) {
      const x0 = i * 80, yy = 120 + Math.sin(i * 0.9) * 6;
      g.beginPath(); g.moveTo(x0, yy); g.lineTo(x0 + 70, yy); g.lineTo(x0 + 35, yy + 50); g.closePath();
      g.fillStyle = i % 3 === 0 ? P.kongBlue : i % 3 === 1 ? P.kongOrange : '#fff4e0';
      g.fill();
    }
    g.strokeStyle = 'rgba(27,20,36,0.5)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(0, 120); for (let i = 0; i <= 14; i++) g.lineTo(i * 80, 120 + Math.sin(i * 0.9) * 6); g.stroke();
    // sign
    kongSign(g, 560, 470);
    // wainscot (blue) + chair rail
    g.fillStyle = '#5b8fd8';
    g.fillRect(0, 1140, W, 400);
    g.fillStyle = '#4677bf';
    for (let i = 0; i < 12; i++) g.fillRect(i * 96, 1170, 48, 370);
    g.fillStyle = '#fff4e0';
    g.fillRect(0, 1120, W, 26);
    g.strokeStyle = P.line; g.lineWidth = 4;
    g.beginPath(); g.moveTo(0, 1120); g.lineTo(W, 1120); g.moveTo(0, 1146); g.lineTo(W, 1146); g.stroke();
    // back counter with registers and a soda machine
    F.rrect(g, -20, 1230, 420, 190, 10); F.fo(g, '#e8413c', 5);
    F.rrect(g, 680, 1230, 440, 190, 10); F.fo(g, '#e8413c', 5);
    g.fillStyle = '#fff4e0'; g.fillRect(-20, 1230, 420, 24); g.fillRect(680, 1230, 440, 24);
    // register
    F.rrect(g, 90, 1150, 130, 84, 10); F.fo(g, '#3a3450', 5);
    F.rrect(g, 104, 1162, 102, 40, 6); g.fillStyle = '#7fe0ff'; g.fill();
    // soda machine
    F.rrect(g, 820, 1080, 170, 154, 12); F.fo(g, '#dfe6f2', 5);
    for (let i = 0; i < 3; i++) { F.rrect(g, 840 + i * 50, 1100, 36, 50, 6); F.fo(g, ['#e8413c', '#ffcc33', '#35b4ff'][i], 3); }
    // floor (checker) at the very bottom, mostly hidden by the table
    g.fillStyle = '#fff4e0'; g.fillRect(0, 1420, W, 500);
    g.fillStyle = '#e8b27a';
    for (let j = 0; j < 7; j++) for (let i = 0; i < 12; i++) if ((i + j) % 2 === 0) g.fillRect(i * 96, 1420 + j * 72, 96, 72);
    return c;
  }

  // ---------------------------------------------------------------------------
  // Mega burger: a wide triple stack built from FILM.fx.burger sections, drawn into an offscreen
  // canvas so bites can be cut out (destination-out) with an outlined scalloped edge.
  // ---------------------------------------------------------------------------
  const KX = 3.0, KY = 1.45;
  const MB_W = 820, MB_H = 500, MB_OX = 410, MB_OY = 370; // origin = FILM.fx.burger centre of the bottom layer
  const MB_TOP = -230 * KY; // top of the top bun
  function stack(g) {
    // sections of FILM.fx.burger (local y): top bun -106..-20, lettuce/tomato -22..2, cheese/patty 0..44, bottom bun 34..76
    const sec = (y0, y1, off) => {
      g.save();
      g.scale(KX, KY);
      g.beginPath(); g.rect(-130, y0 + off, 260, y1 - y0); g.clip();
      F.burger(g, 0, off, 1);
      g.restore();
    };
    sec(-24, 90, 0);
    sec(-24, 46, -62);
    sec(-130, 46, -124);
  }
  // bites: ellipses in offscreen px relative to the origin, with teeth scallops on the lower arc
  function bitePath(g, level) {
    const add = (cx, cy, rx, ry, teeth) => {
      g.moveTo(cx + rx, cy); g.ellipse(cx, cy, rx, ry, 0, 0, TAU);
      for (let i = 0; i < teeth; i++) {
        const a = Math.PI * 0.12 + (i / (teeth - 1)) * Math.PI * 0.76;
        const px = cx + Math.cos(a) * rx, py = cy + Math.sin(a) * ry, r = 24;
        g.moveTo(px + r, py); g.arc(px, py, r, 0, TAU);
      }
    };
    if (level >= 1) add(10, MB_TOP - 10, 250, 150, 9);
    if (level >= 2) add(-20, MB_TOP + 120, 330, 170, 11);
  }
  function megaBurger(ctx, x, y, level, info, glow, sil) {
    if (level >= 3) return;
    const S = info.S || FILM.S || 1;
    const c = FILM.lib.cached(ID + '-mb-' + S + (WRF ? 'r' : 'g'), () => FILM.makeCanvas(Math.round(MB_W * S), Math.round(MB_H * S)));
    const g = c.getContext('2d', { willReadFrequently: WRF });
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
    g.clearRect(0, 0, c.width, c.height);
    g.setTransform(S, 0, 0, S, MB_OX * S, MB_OY * S);
    stack(g);
    if (level >= 1) {
      g.globalCompositeOperation = 'destination-out';
      g.fillStyle = '#000';
      g.beginPath(); bitePath(g, level); g.fill();
      g.globalCompositeOperation = 'source-atop';
      g.strokeStyle = P.line; g.lineWidth = 10;
      g.beginPath(); bitePath(g, level); g.stroke();
    }
    if (sil) {
      g.globalCompositeOperation = 'source-in';
      g.fillStyle = sil;
      g.fillRect(-MB_OX, -MB_OY, MB_W, MB_H);
    }
    g.globalCompositeOperation = 'source-over';
    g.setTransform(1, 0, 0, 1, 0, 0);
    ctx.save();
    ctx.translate(x, y);
    if (glow > 0) {
      const gr = ctx.createRadialGradient(0, -110, 60, 0, -110, 480);
      gr.addColorStop(0, `rgba(255,236,140,${0.7 * glow})`);
      gr.addColorStop(1, 'rgba(255,236,140,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(0, -110, 480, 0, TAU); ctx.fill();
    }
    ctx.drawImage(c, -MB_OX, -MB_OY, MB_W, MB_H);
    ctx.restore();
  }

  function fingers(ctx, x, y, s, dir) {
    // finger tips wrapping over the top edge of a held burger (prop-level detail)
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s * dir, s);
    for (let i = 0; i < 4; i++) {
      F.ellipse(ctx, i * 22, -Math.abs(i - 1.5) * 5, 13, 20, 0.15);
      F.fo(ctx, P.skin, 5);
    }
    ctx.restore();
  }

  // monster jaw for the impact frame: white mouth cavity with outlined teeth rows
  const jawTopY = (m, open) => -20 - (1 - (m / 220) * (m / 220)) * (35 + 20 * open);
  const jawBotY = (m, open) => lerp(130 + 150 * open, 20, (m / 220) * (m / 220));
  function jawCavity(ctx, x, y, s, open) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.beginPath();
    for (let i = 0; i <= 20; i++) { const m = -220 + i * 22; ctx.lineTo(m, jawTopY(m, open)); }
    for (let i = 20; i >= 0; i--) { const m = -220 + i * 22; ctx.lineTo(m, jawBotY(m, open)); }
    ctx.closePath();
    F.fo(ctx, '#ffffff', 9, '#0a0a10');
    ctx.restore();
  }
  function jawTeeth(ctx, x, y, s, open, upper) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.beginPath();
    const n = upper ? 9 : 8, span = upper ? 400 : 340, tw = span / n;
    for (let i = 0; i < n; i++) {
      const u0 = -span / 2 + i * tw, m = u0 + tw / 2;
      if (upper) {
        const yy = jawTopY(m, open) - 2;
        ctx.moveTo(u0, yy); ctx.lineTo(u0 + tw, yy); ctx.lineTo(m, yy + 56); ctx.closePath();
      } else {
        const yy = jawBotY(m, open) + 2;
        ctx.moveTo(u0, yy); ctx.lineTo(u0 + tw, yy); ctx.lineTo(m, yy - 52); ctx.closePath();
      }
    }
    F.fo(ctx, '#ffffff', 6, '#0a0a10');
    ctx.restore();
  }
  function silEyes(ctx, a) {
    [[a.eyeL, 1], [a.eyeR, -1]].forEach(([e, d]) => {
      ctx.save();
      ctx.translate(e[0], e[1] - 40);
      ctx.rotate(0.35 * d);
      ctx.fillStyle = '#ffffff';
      F.ellipse(ctx, 0, 0, 34, 14); ctx.fill();
      ctx.restore();
    });
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib;
      const t = clamp(tIn, 0, info.dur);
      WRF = wrfOf(ctx);
      const tw = L.onTwos(t);
      const hitFrames = (a, n) => t >= a - 1e-6 && t < a + n * FR - 1e-6;

      // --- state
      const impactNow = hitFrames(T_CHOMP, 4);
      const level = t < T_CHOMP ? 0 : t < T_BITE2 ? 1 : t < T_GULP ? 2 : 3;
      const second = t >= T_GULP;
      const windUp = clamp((tw - T_WIND) / (T_CHOMP - T_WIND));

      // camera: slow push, punch on hits
      const push = 1 + 0.05 * L.ease.inOutSine(clamp(t / info.dur));
      const punch = (hitFrames(T_CHOMP, 3) ? 0.07 : 0) + (hitFrames(T_BITE2, 2) ? 0.03 : 0) + (hitFrames(T_GULP, 2) ? 0.04 : 0);
      const sh = F.shakeMany(t, [[T_CHOMP, 0.5, 34], [T_BITE2, 0.3, 16], [T_GULP, 0.35, 20]], 7);
      const CY = 1000;

      ctx.save();
      ctx.translate(W / 2 + sh[0], CY + sh[1]);
      ctx.scale(push + punch, push + punch);
      ctx.translate(-W / 2, -CY);

      if (!impactNow) {
        // 1. background
        const bg = L.cached(ID + '-bg-' + (FILM.S || 1) + (WRF ? 'r' : 'g'), buildBg);
        drawLayer(ctx, bg, 0, 0, W, H);
        // 2. animated background: lamp glows + sign twinkles
        [150, 930].forEach((lx, i) => {
          const gg = ctx.createRadialGradient(lx, 260, 10, lx, 260, 170);
          const al = 0.35 + 0.1 * Math.sin(t * 6 + i);
          gg.addColorStop(0, `rgba(255,240,190,${al})`);
          gg.addColorStop(1, 'rgba(255,240,190,0)');
          ctx.fillStyle = gg;
          ctx.fillRect(lx - 170, 90, 340, 340);
        });
        [150, 930].forEach((lx) => lamp(ctx, lx, 180));
        F.sparkles(ctx, { x: 220, y: 300, w: 680, h: 300, n: 7, seed: 31, t, size: 30 });

        if (t < T_CHOMP) {
          // anticipation: dark focus lines tighten
          F.focusLines(ctx, HX, 1010, { inner: 460 - 80 * windUp, count: 90, color: P.line, alpha: 0.12 + 0.3 * windUp, seed: 5, width: 12 });
        } else if (!second) {
          const bp = F.beatPulse(t, 0.5, 0.2);
          F.focusLines(ctx, HX, 1010, { inner: 440, count: 90, color: '#e0701f', alpha: 0.18 + 0.3 * bp, seed: 6, width: 16 });
        } else {
          // golden rays behind the raised second burger
          const age = t - T_GULP;
          const rx = 790, ry = 520;
          ctx.save();
          ctx.globalAlpha = clamp(age / 0.12) * 0.5;
          ctx.fillStyle = '#ffe27a';
          ctx.beginPath();
          const n = 18, rot = age * 0.5;
          for (let i = 0; i < n; i++) {
            const a0 = rot + (i / n) * TAU, a1 = a0 + TAU / n * 0.45;
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx + Math.cos(a0) * 1800, ry + Math.sin(a0) * 1800);
            ctx.lineTo(rx + Math.cos(a1) * 1800, ry + Math.sin(a1) * 1800);
            ctx.closePath();
          }
          ctx.fill();
          ctx.restore();
          const gl = ctx.createRadialGradient(rx, ry, 20, rx, ry, 460);
          gl.addColorStop(0, 'rgba(255,255,230,0.95)');
          gl.addColorStop(1, 'rgba(255,230,140,0)');
          ctx.fillStyle = gl;
          ctx.fillRect(rx - 460, ry - 460, 920, 920);
        }
      } else {
