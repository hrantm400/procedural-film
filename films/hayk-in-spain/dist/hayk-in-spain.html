    const tremble = angry ? (H01('tr', Math.floor(t * 24)) - 0.5) * 6 : 0;
    const grantFace = t >= T_ANGRY + 2 * FR ? 'nervous' : 'calm';
    const sil = impactFrame ? (Math.floor((t - T_ANGRY) * 24 + 1e-6) === 1 ? '#ffffff' : '#0a0a10') : null;
    const ga = C.grant(ctx, { x: 200 + tremble, y: GROUND - 60, s: 1.18, pose: 'stand', face: grantFace, t: tw, tilt: lurch, look: [0.8, 0], silhouette: sil });
    const goofyFace = angry ? 'angry' : 'neutral';
    const gx = 430, gy = GROUND + 20;
    const squash = t >= T_ANGRY && t < T_ANGRY + 2 * FR ? 1 : 0;
    // "stops dead": a tiny skid backwards in the first frames
    const skid = t < 0.25 ? (1 - t / 0.25) * 30 : 0;
    ctx.save();
    if (squash) { ctx.translate(gx, gy); ctx.scale(1.06, 0.92); ctx.translate(-gx, -gy); }
    const da = C.goofy(ctx, { x: gx - skid, y: gy, s: 1.65, pose: 'stand', face: goofyFace, t: angry ? tw : 0, look: [1, 0], silhouette: sil });
    ctx.restore();
    F.leash(ctx, da.collar, ga.handR, { sag: angry ? 0 : 50, taut: angry });
    if (!impactFrame) {
      // skid dust at the stop
      F.dust(ctx, gx - 120, gy, t, { n: 6, seed: 1805, size: 40, spread: 160, life: 0.6 });
      F.dust(ctx, gx + 140, gy, t - 0.04, { n: 5, seed: 1806, size: 36, spread: 120, life: 0.6 });
      if (!angry) bang(ctx, F, da.top[0] + 40, da.top[1] - 70, t, 0.08, 1.1);
      // Grant sweat
      if (angry) {
        const drip = ((t - T_ANGRY) * 0.9) % 1;
        F.sweat(ctx, ga.head[0] + 92, ga.head[1] - 40 + drip * 40, 1.3);
        F.sweat(ctx, ga.head[0] - 96, ga.head[1] - 10, 0.9, { flip: true });
        // shiver lines around Grant
        ctx.save();
        ctx.strokeStyle = 'rgba(200,220,255,0.8)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        const b = L.boil(L.T);
        for (let i = 0; i < 3; i++) {
          const yy = ga.chest[1] - 60 + i * 50 + (H01('sv', i, b) - 0.5) * 6;
          ctx.beginPath(); ctx.moveTo(ga.chest[0] - 170, yy); ctx.lineTo(ga.chest[0] - 140, yy - 10); ctx.stroke();
        }
        ctx.restore();
      }
      // 5. menace glyphs + fur bristle sparks
      if (angry) {
        F.menace(ctx, 990, 880, t, { n: 4, size: 96, color: '#b04cff', seed: 1807 });
        F.menace(ctx, 560, 1180, t + 0.3, { n: 3, size: 88, color: '#ff3b5c', seed: 1808 });
      }
    }
    if (!impactFrame) foregroundLayer(ctx, F, t, CAM_X);
    ctx.restore(); // camera

    // screen-fixed vignette in demon mode
    if (dark > 0) F.vignette(ctx, 0.55 * dark, '26,11,36');
    return ga;
  }

  // ---------------------------------------------------------------------------
  // Extreme close-up (3 - 4 s): letterbox strip on the glowing eyes
  // ---------------------------------------------------------------------------
  function closeUp(ctx, t, F, C) {
    const L = FILM.lib;
    const u = t - T_EYES;
    const bandTop = 620, bandBot = 1300;
    // bars: near-black purple with red focus streaks
    ctx.fillStyle = '#1a0b24';
    ctx.fillRect(-20, -20, 1120, 1960);
    F.focusLines(ctx, 540, 960, { inner: 420, count: 80, color: 'rgba(255,35,64,0.55)', seed: 1810, width: 18 });
    // eye strip
    ctx.save();
    ctx.beginPath();
    ctx.rect(-20, bandTop, 1120, bandBot - bandTop);
    ctx.clip();
    const g = ctx.createLinearGradient(0, bandTop, 0, bandBot);
    g.addColorStop(0, '#5a0d22'); g.addColorStop(0.5, '#b3122b'); g.addColorStop(1, '#3b0718');
    ctx.fillStyle = g;
    ctx.fillRect(-20, bandTop, 1120, bandBot - bandTop);
    // slow push-in + tremble
    const s = 10 + u * 3;
    const [jx, jy] = F.shake(t, T_EYES, 1.2, 8, 1811);
    // centre between the eyes: head local (2,-13), head at (92,-175) in the stand pose
    const ex = 540 + jx, ey = 965 + jy;
    const x0 = ex - 94 * s, y0 = ey + 188 * s;
    C.goofy(ctx, { x: x0, y: y0, s, pose: 'stand', face: 'angry', t: 0, look: [0, 0] });
    // extra eye glow + horizontal lens glints
    const eyes = [[ex + (-22 - 2) * s, ey + (-12 + 13) * s], [ex + (26 - 2) * s, ey + (-14 + 13) * s]];
    const fl = 0.75 + 0.25 * Math.sin(Math.floor(t * 12) * 1.9);
    eyes.forEach(([px, py]) => {
      const gg = ctx.createRadialGradient(px, py, 10, px, py, 330);
      gg.addColorStop(0, `rgba(255,240,200,${0.9 * fl})`);
      gg.addColorStop(0.2, `rgba(255,50,60,${0.7 * fl})`);
      gg.addColorStop(1, 'rgba(255,0,40,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(px - 340, py - 340, 680, 680);
      ctx.fillStyle = `rgba(255,230,220,${0.85 * fl})`;
      ctx.beginPath();
      ctx.moveTo(px - 420, py); ctx.lineTo(px, py - 7); ctx.lineTo(px + 420, py); ctx.lineTo(px, py + 7); ctx.closePath();
      ctx.fill();
    });
    ctx.restore();
    // strip borders
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-20, bandTop - 10, 1120, 10);
    ctx.fillRect(-20, bandBot, 1120, 10);
    // menace in the bars
    F.menace(ctx, 950, 560, u, { n: 4, size: 100, color: '#b04cff', seed: 1812 });
    F.menace(ctx, 170, 1470, u + 0.4, { n: 2, size: 96, color: '#ff3b5c', seed: 1813 });
    F.text(ctx, 'ギン', 850, 1420, { size: 110, fill: '#ffe14a', stroke: F.pal.line, lw: 16, rot: -0.2, font: 'jp', scale: F.popIn(t, T_EYES) });
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const F = FILM.fx, C = FILM.cast;
      let ga = null;
      if (t < T_EYES - 1e-6) ga = wide(ctx, t, F, C);
      else closeUp(ctx, t, F, C);

      // flash on the cut to the eyes
      if (t >= T_EYES - 1e-6 && t < T_EYES + 2 * FR) F.flash(ctx, 0.8 - (t - T_EYES) * 12, '#ff5a6a');

      // bubble "UH-OH." (held through the close-up so it stays readable)
      if (t >= T_UHOH) {
        const inWide = t < T_EYES;
        const tail = inWide && ga ? [ga.head[0] + 30, ga.top[1] - 20] : [140, 640];
        F.bubble(ctx, 'UH-OH.', 330, inWide ? 760 : 420, { size: 72, t, t0: T_UHOH, tail, shake: 5 });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/19-goofy-rampage.js
// Shot 19 'goofy-rampage' : WOOF WOOF WOOF (global T 79.0 - 84.0, local t 0 - 5).
// Pure action in the Yerevan park. Goofy in demon mode barks on every beat (t 0.0 .. 4.5): giant
// alternating "WOOF!" SFX, shock rings from his mouth, screen shake, squash. Grant is dragged
// horizontally behind the leash like a flag in the wind (pose "pulled", face "panic"). The park
// streams past in surges (camera tracking Goofy's lunges), leaves fly, speed lines everywhere.
// The stranger and his poodle flee in the background. t 2.5 (T 81.5): black-and-white impact frame.
//
// Layers, back to front:
//   1 park: sky, clouds, Ararat, city blocks, Cascade stairs, hill (parallax 0.05 - 0.2)
//   2 park: tree row, lamps, benches (parallax 0.55), grass, path (parallax 1.0)
//   3 demon wash: red multiply tint, dark radial glow behind Goofy, focus lines on his mouth
//   4 stranger + poodle running away (far path)
//   5 speed lines (back set), dust at Goofy's feet
//   6 Grant (pulled) + leash, Goofy (bark, angry) with aura
//   7 shock rings, leaves, front speed lines
//   8 SFX: WOOF! x10, Grant's scream
//   9 impact frame (t 2.5 .. 2.5 + 4 frames) replaces 1-8
(function () {
  'use strict';
  const ID = 'goofy-rampage';
  const FILM = window.FILM;
  const F = FILM.fx, CAST = FILM.cast, P = F.pal, LIB = FILM.lib;
  const TAU = Math.PI * 2, FR = 1 / 24;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const h01 = (...k) => F.h01(ID, ...k);

  // ---- beats (local t; global T in comments)
  const BEAT = 0.5;
  const N_BARKS = 10; // t 0.0 (T 79.0) .. t 4.5 (T 83.5)
  const IMPACT = 2.5; // T 81.5
  const IMPACT_FRAMES = 4;
  const GROUND = 1575; // Goofy's feet
  const GOOFY_X = 520;
  const GOOFY_S = 1.9;

  // ---- park colours (scene literals: pastel Yerevan morning)
  const K = {
    skyTop: '#8ccfff', skyMid: '#cdeeff', skyLow: '#ffe3e6',
    stone: '#e8b8a0', stoneShade: '#d09a84', stoneLight: '#f6d6c4', stoneLine: '#a8756a',
    hill: '#9fcf86', hillShade: '#86bb70',
    blockA: '#f1d9cf', blockB: '#e6cfe0', blockC: '#f5e6c8', win: '#b9c8e6',
    grassFar: '#a6d884', grass: P.grass, grassShade: P.grassShade,
    path: '#f0dcb6', pathShade: '#dcc39a', pathLine: '#c9ab80',
    tree: P.tree, treeShade: P.treeShade, treeHi: '#7cc466', trunk: P.trunk,
    bench: '#c0713a', benchShade: '#8f4f26', lamp: '#39314a',
  };

  // Park layer. scroll = camera x travel in px (foreground speed). Everything wraps.
  function wrapX(x0, scroll, f, period, margin) {
    return ((((x0 - scroll * f) % period) + period) % period) - margin;
  }
  function cascade(ctx, cx, baseY, w, h) {
    // the Cascade: terraced pink stone stairs climbing the hill, fountains on the tiers
    const tiers = 6;
    ctx.save();
    for (let i = 0; i < tiers; i++) {
      const u0 = i / tiers, u1 = (i + 1) / tiers;
      const tw = w * (1 - u0 * 0.55), y0 = baseY - h * u0, y1 = baseY - h * u1;
      const x0 = cx - tw / 2;
      // tier block
      ctx.fillStyle = K.stone;
      ctx.fillRect(x0, y1, tw, y0 - y1);
      ctx.fillStyle = K.stoneShade;
      ctx.fillRect(x0, y0 - (y0 - y1) * 0.22, tw, (y0 - y1) * 0.22);
      ctx.fillStyle = K.stoneLight;
      ctx.fillRect(x0, y1, tw, 5);
      // arches
      const na = Math.max(3, Math.round(tw / 70));
      ctx.fillStyle = K.stoneShade;
      for (let a = 0; a < na; a++) {
        const ax = x0 + (a + 0.5) * (tw / na);
        if (Math.abs(ax - cx) < w * 0.09) continue;
        const aw = tw / na * 0.42, ah = (y0 - y1) * 0.45;
        ctx.beginPath();
        ctx.moveTo(ax - aw / 2, y0 - (y0 - y1) * 0.25);
        ctx.lineTo(ax - aw / 2, y0 - (y0 - y1) * 0.25 - ah + aw / 2);
        ctx.arc(ax, y0 - (y0 - y1) * 0.25 - ah + aw / 2, aw / 2, Math.PI, 0);
        ctx.lineTo(ax + aw / 2, y0 - (y0 - y1) * 0.25);
        ctx.closePath();
        ctx.fill();
      }
      // shrubs on the terrace edge
      ctx.fillStyle = K.hillShade;
      for (let b = 0; b < 4; b++) {
        const bx = x0 + 20 + b * (tw - 40) / 3;
        ctx.beginPath(); ctx.arc(bx, y1 + 2, 9, Math.PI, 0); ctx.fill();
      }
      ctx.strokeStyle = K.stoneLine;
      ctx.lineWidth = 2.5;
      ctx.strokeRect(x0, y1, tw, y0 - y1);
    }
    // central staircase
    const sw = w * 0.16;
    ctx.fillStyle = K.stoneLight;
    ctx.beginPath();
    ctx.moveTo(cx - sw / 2, baseY); ctx.lineTo(cx + sw / 2, baseY);
    ctx.lineTo(cx + sw * 0.3, baseY - h); ctx.lineTo(cx - sw * 0.3, baseY - h); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = K.stoneLine;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let k = 1; k < 30; k++) {
      const u = k / 30, y = baseY - h * u, hw = lerp(sw / 2, sw * 0.3, u);
      ctx.moveTo(cx - hw, y); ctx.lineTo(cx + hw, y);
    }
    ctx.stroke();
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - sw / 2, baseY); ctx.lineTo(cx - sw * 0.3, baseY - h);
    ctx.moveTo(cx + sw / 2, baseY); ctx.lineTo(cx + sw * 0.3, baseY - h);
    ctx.stroke();
    // top monument (the unfinished column block)
    ctx.fillStyle = K.stoneShade;
    ctx.fillRect(cx - 16, baseY - h - 70, 32, 70);
    ctx.strokeRect(cx - 16, baseY - h - 70, 32, 70);
    ctx.restore();
  }
  function roundTree(ctx, x, y, r, seed) {
    // trunk
    ctx.fillStyle = K.trunk;
    ctx.beginPath();
    ctx.moveTo(x - r * 0.12, y); ctx.lineTo(x - r * 0.07, y - r * 1.1); ctx.lineTo(x + r * 0.07, y - r * 1.1); ctx.lineTo(x + r * 0.12, y);
    ctx.closePath();
    F.fo(ctx, K.trunk, 4);
    // crown: a cluster of circles, outline then fill
    const cy = y - r * 1.45;
    const blobs = [[0, 0, 1], [-0.55, 0.25, 0.7], [0.55, 0.25, 0.72], [-0.3, -0.45, 0.66], [0.32, -0.42, 0.64]];
    ctx.beginPath();
    blobs.forEach(([bx, by, br]) => { ctx.moveTo(x + bx * r + br * r, cy + by * r); ctx.arc(x + bx * r, cy + by * r, br * r, 0, TAU); });
    ctx.strokeStyle = P.line; ctx.lineWidth = 8; ctx.stroke();
    ctx.fillStyle = K.tree; ctx.fill();
    ctx.fillStyle = K.treeShade;
    ctx.beginPath(); ctx.ellipse(x + r * 0.1, cy + r * 0.45, r * 0.95, r * 0.42, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = K.tree;
    ctx.beginPath(); ctx.arc(x - r * 0.12, cy - r * 0.08, r * 0.78, 0, TAU); ctx.fill();
    ctx.fillStyle = K.treeHi;
    ctx.beginPath(); ctx.ellipse(x - r * 0.35, cy - r * 0.42, r * 0.28, r * 0.17, -0.5, 0, TAU); ctx.fill();
  }
  function bench(ctx, x, y) {
    ctx.save();
    ctx.lineWidth = 4; ctx.strokeStyle = P.line;
    ctx.fillStyle = K.lamp;
    ctx.fillRect(x - 70, y - 40, 8, 40); ctx.fillRect(x + 62, y - 40, 8, 40);
    F.rrect(ctx, x - 84, y - 50, 168, 14, 4); F.fo(ctx, K.bench, 4);
    F.rrect(ctx, x - 84, y - 92, 168, 12, 4); F.fo(ctx, K.bench, 4);
    F.rrect(ctx, x - 84, y - 74, 168, 12, 4); F.fo(ctx, K.benchShade, 4);
    ctx.restore();
  }
  function lamp(ctx, x, y) {
    ctx.save();
    ctx.fillStyle = K.lamp;
    ctx.fillRect(x - 5, y - 250, 10, 250);
    ctx.fillRect(x - 14, y - 16, 28, 16);
    F.ellipse(ctx, x, y - 262, 20, 24); F.fo(ctx, '#fff4c8', 4);
    ctx.fillStyle = K.lamp; ctx.fillRect(x - 16, y - 290, 32, 10);
    ctx.restore();
  }
  function park(ctx, t, scroll) {
    // 1 sky
    F.sky(ctx, K.skyTop, K.skyLow, { mid: K.skyMid, midAt: 0.55, x: -80, y: -80, w: 1240, h: 1060 });
    F.clouds(ctx, { n: 4, seed: 19, t: t + scroll * 0.02, y: 250, h: 320, speed: 30, scale: 0.8 });
    F.ararat(ctx, wrapX(560, scroll, 0.03, 1600, 300), 900, 620, 290, { color: '#b8c0e2', shade: '#a3acd6', snow: '#fbfcff' });
    // city blocks at the horizon
    for (let i = 0; i < 14; i++) {
      const bw = 90 + h01('bw', i) * 90, bh = 90 + h01('bh', i) * 170;
      const x = wrapX(i * 170, scroll, 0.08, 2380, 200);
      const col = [K.blockA, K.blockB, K.blockC][i % 3];
      ctx.fillStyle = col;
      ctx.fillRect(x, 905 - bh, bw, bh + 5);
      ctx.fillStyle = K.win;
      for (let r = 0; r < Math.floor(bh / 34); r++) for (let c = 0; c < Math.floor(bw / 30); c++) ctx.fillRect(x + 10 + c * 30, 905 - bh + 14 + r * 34, 12, 16);
    }
    // hill + Cascade
    const cxs = wrapX(470, scroll, 0.12, 2600, 900);
    ctx.fillStyle = K.hill;
    ctx.beginPath(); ctx.ellipse(cxs, 960, 620, 330, 0, Math.PI, TAU); ctx.fill();
    cascade(ctx, cxs, 950, 600, 380);
    // far grass band
    ctx.fillStyle = K.grassFar;
    ctx.fillRect(-80, 940, 1240, 80);
    // 2 tree row, lamps, benches (parallax 0.55)
    for (let i = 0; i < 9; i++) {
      const x = wrapX(i * 260 + h01('tx', i) * 60, scroll, 0.55, 2340, 200);
      const r = 70 + h01('tr', i) * 40;
      roundTree(ctx, x, 1060 + h01('ty', i) * 30, r, i);
      if (i % 2 === 0) lamp(ctx, x + 130, 1110);
      else bench(ctx, x + 125, 1110);
    }
    // grass
    ctx.fillStyle = K.grass;
    ctx.fillRect(-80, 1080, 1240, 1000);
    ctx.fillStyle = K.grassShade;
    for (let i = 0; i < 22; i++) {
      const x = wrapX(i * 110, scroll, 0.8, 2420, 60);
      ctx.beginPath(); ctx.moveTo(x, 1150 + (i % 3) * 18); ctx.lineTo(x + 8, 1128 + (i % 3) * 18); ctx.lineTo(x + 16, 1150 + (i % 3) * 18); ctx.fill();
    }
    // path (foreground, parallax 1)
    ctx.fillStyle = K.path;
    ctx.fillRect(-80, 1330, 1240, 460);
    ctx.fillStyle = K.pathShade;
    ctx.fillRect(-80, 1330, 1240, 22);
    ctx.strokeStyle = P.line; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-80, 1330); ctx.lineTo(1160, 1330); ctx.stroke();
    ctx.strokeStyle = K.pathLine; ctx.lineWidth = 4;
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const x = wrapX(i * 200, scroll, 1.0, 2400, 100);
      ctx.moveTo(x, 1360); ctx.lineTo(x - 70, 1780);
    }
    ctx.moveTo(-80, 1520); ctx.lineTo(1160, 1520);
    ctx.stroke();
    // pebbles
    ctx.fillStyle = K.pathShade;
    for (let i = 0; i < 16; i++) {
      const x = wrapX(i * 150 + h01('pb', i) * 90, scroll, 1.0, 2400, 60);
      F.ellipse(ctx, x, 1400 + h01('pby', i) * 330, 10, 5); ctx.fill();
    }
    // front grass strip at the bottom
    ctx.fillStyle = K.grass;
    ctx.fillRect(-80, 1790, 1240, 200);
    ctx.strokeStyle = P.line; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-80, 1790); ctx.lineTo(1160, 1790); ctx.stroke();
  }

  // The stranger: a flat silhouette jogger and a white poodle (not cast members: simple shapes).
  function stranger(ctx, x, y, s, t) {
    const ph = t * TAU * 3.2;
    const sw = Math.sin(ph);
    const col = '#4b3d63';
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const limb = (pts, w) => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke(); };
    // legs
    limb([[0, -95], [20 + sw * 30, -50], [10 + sw * 55, 0]], 18);
    limb([[0, -95], [-20 - sw * 30, -55], [-40 - sw * 40, -10]], 18);
    // torso leaning forward (running right)
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(12, -140, 26, 52, 0.35, 0, TAU); ctx.fill();
    // arms flailing up (panic)
    limb([[20, -170], [50, -210 - sw * 10], [40 + sw * 20, -250]], 13);
    limb([[5, -170], [-30, -200 + sw * 10], [-20 - sw * 20, -245]], 13);
    // head
    ctx.beginPath(); ctx.arc(34, -205, 24, 0, TAU); ctx.fill();
    // headband
    ctx.fillStyle = '#ff5e7e'; ctx.fillRect(12, -218, 44, 8);
    ctx.restore();
    // sweat drop, flying off backwards
    F.sweat(ctx, x - 30 * s, y - 250 * s, 0.7 * s, { flip: true });
    // poodle: white puffs, trotting ahead of him
    const px = x + 90 * s, py = y + Math.abs(Math.sin(ph * 1.2)) * -14 * s;
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(s, s);
    ctx.lineWidth = 3; ctx.strokeStyle = P.line;
    const puff = (bx, by, r) => { ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.stroke(); };
    ctx.strokeStyle = P.line; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-18, -24); ctx.lineTo(-24 - sw * 10, -2); ctx.moveTo(18, -24); ctx.lineTo(24 + sw * 10, -2); ctx.stroke();
    ctx.lineWidth = 3;
    puff(-26, -44, 13); // tail pompom
    puff(0, -36, 20);
    puff(26, -58, 17); // head
    puff(24, -76, 11); // topknot
    ctx.fillStyle = P.line; ctx.beginPath(); ctx.arc(34, -60, 3, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function leaf(ctx, x, y, r, rot, col) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.quadraticCurveTo(0, -r * 0.7, r, 0);
    ctx.quadraticCurveTo(0, r * 0.7, -r, 0);
    ctx.closePath();
    F.fo(ctx, col, 3);
    ctx.strokeStyle = 'rgba(27,20,36,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r * 0.8, 0); ctx.lineTo(r * 0.8, 0); ctx.stroke();
    ctx.restore();
  }
  function leaves(ctx, t, o) {
    const cols = ['#6cc04a', '#4f9a4a', '#a8d85a', '#f2c94c'];
    for (let i = 0; i < o.n; i++) {
      const sp = 900 + h01('lv', o.seed, i) * 900;
      const period = 1400 / sp * 1.3;
      const u = ((t / period + h01('lo', o.seed, i)) % 1 + 1) % 1;
      const x = 1180 - u * 1400;
      const y = o.y0 + h01('ly', o.seed, i) * o.h + Math.sin(t * 7 + i) * 40;
      leaf(ctx, x, y, o.r * (0.7 + h01('lr', o.seed, i) * 0.7), t * (6 + i % 5) + i, cols[i % cols.length]);
    }
  }

  // Scroll: the camera surges forward on every bark (Goofy lunges), eased within each beat.
  function scrollAt(t) {
    const k = Math.floor(t / BEAT + 1e-6), u = (t - k * BEAT) / BEAT;
    return 360 * (k + LIB.ease.outCubic(u)) + 180 * t;
  }

  // WOOF placement per bark (alternating left / right, tilted), size escalates.
  const WOOFS = [
    [360, 330, -0.2], [715, 450, 0.16], [355, 360, -0.14], [720, 420, 0.2], [365, 320, -0.22],
    [540, 380, -0.08], [355, 350, -0.16], [715, 460, 0.14], [360, 320, -0.2], [715, 430, 0.18],
  ];
  // Grant, the flag: feet trail off the left edge, hands up at the leash end
  const GRANT = { x: -40, y: 930, s: 0.98, tilt: -0.22 };

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tw = LIB.onTwos(t);
      const k = Math.min(N_BARKS - 1, Math.floor(t / BEAT + 1e-6));
      const age = t - k * BEAT; // time since the latest bark
      const scroll = scrollAt(tw);
      const inImpact = t >= IMPACT - 1e-6 && t < IMPACT + IMPACT_FRAMES * FR - 1e-6;
      const impactFrame = Math.floor((t - IMPACT) * 24 + 1e-6);

      // Goofy placement: small hop between barks, squash on the bark frames
      const hop = -Math.sin(clamp(age / BEAT) * Math.PI) * 26;
      const squash = age < 2 * FR + 1e-6;
      const gx = GOOFY_X + Math.sin(tw * 9) * 6;
      const gy = GROUND + hop;
      // bark pose: its lunge peaks at local phase 0.125 of a 0.5 s cycle, so shift it onto the beat
      const gt = age + 0.125 + k * BEAT;

      // camera: slow push-in + shake on every bark
      const sh = F.shake(t, k * BEAT, 0.32, k === 5 ? 44 : 28, 190 + k);
      const zoom = 1 + 0.05 * (t / info.dur);

      ctx.save();
      ctx.translate(sh[0], sh[1]);
      ctx.translate(560, 1100);
      ctx.scale(zoom, zoom);
      ctx.translate(-560, -1100);

      if (inImpact) {
        // ---- 9 impact frame: 2 white frames, then 2 inverted
        const inv = impactFrame >= 2;
        const mouth = [gx + 250, gy - 300];
        F.impact(ctx, { cx: mouth[0], cy: mouth[1], invert: inv, seed: 1900 + impactFrame, inner: 150 });
        const sil = inv ? '#ffffff' : '#0a0a10';
        const ga = CAST.goofy(ctx, { x: gx, y: gy, s: GOOFY_S * 1.08, pose: 'bark', face: 'angry', t: gt, silhouette: sil });
        const gr = CAST.grant(ctx, { x: GRANT.x, y: GRANT.y, s: GRANT.s, pose: 'pulled', face: 'panic', flip: true, t, tilt: GRANT.tilt, silhouette: sil });
        F.leash(ctx, ga.collar, gr.handR, { taut: true, color: sil, width: 10 });
        F.shockRing(ctx, ga.mouth[0], ga.mouth[1], 0.12, { r: 420, color: inv ? '#fff' : '#000', life: 0.3, width: 30 });
        ctx.restore();
        F.sfx(ctx, 'WOOF!!', 540, 420, t, IMPACT, { size: Math.min(200, 800 / (F.measure(ctx, 'WOOF!!', 100) / 100)), fill: inv ? '#0a0a10' : '#ffffff', stroke: inv ? '#ffffff' : '#0a0a10', shadowColor: inv ? '#ffffff' : '#0a0a10', rot: -0.1, shake: 12 });
        return;
      }

      // ---- 1-2 park
      park(ctx, t, scroll);

      // ---- 3 demon wash: red multiply tint pulsing on the beat, dark glow behind Goofy
      const pulse = F.beatPulse(t, BEAT, 0.16);
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = '#ffd0c8';
      ctx.fillRect(-80, -80, 1240, 2080);
      ctx.globalAlpha = 0.12 + pulse * 0.45;
      ctx.fillStyle = '#ff5a5a';
      ctx.fillRect(-80, -80, 1240, 2080);
      ctx.restore();
      ctx.save();
      const rg = ctx.createRadialGradient(gx + 60, gy - 250, 40, gx + 60, gy - 250, 760);
      rg.addColorStop(0, 'rgba(26,11,36,0.85)');
      rg.addColorStop(0.55, 'rgba(90,10,40,0.45)');
      rg.addColorStop(1, 'rgba(90,10,40,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(-80, 600, 1240, 1400);
      ctx.restore();

      // ---- 4 the stranger and his poodle flee along the far path
      const sx = 720 + t * 95 + Math.sin(tw * 5) * 6;
      if (sx < 1200) {
        stranger(ctx, sx, 1140, 1.15, tw);
        F.dust(ctx, sx - 40, 1135, ((t * 3) % 1) * 0.7, { n: 4, size: 22, spread: 80, seed: 1911, life: 0.7 });
      }

      // mouth focus lines (dark red), behind the characters, pulsing
      F.focusLines(ctx, gx + 250, gy - 300, { inner: 330, count: 80, color: '#3a0714', alpha: 0.35 + pulse * 0.4, seed: 1904, width: 20 });

      // ---- 5 back speed lines + dust kicked up at Goofy's feet
      F.speedLines(ctx, { angle: Math.PI, count: 36, color: '#ffffff', alpha: 0.55, seed: 1905, t, speed: 2600, len: 520, width: 10, y: 200, h: 1500 });
      F.dust(ctx, gx - 150, GROUND + 4, age, { n: 6, size: 46, spread: 230, seed: 1906 + k, life: 0.45, dir: 0 });

      // ---- 6 Grant, dragged horizontally like a flag, then the leash, then Goofy
      const flap = Math.sin(tw * 22) * 0.07 + Math.sin(tw * 7) * 0.04;
      const gr = CAST.grant(ctx, {
        x: GRANT.x + Math.sin(tw * 9) * 12, y: GRANT.y + Math.sin(tw * 13) * 26 + hop * 0.6, s: GRANT.s,
        pose: 'pulled', face: 'panic', flip: true, t: t * 1.6, tilt: GRANT.tilt + flap,
      });
      // sweat flying off Grant
      F.sweat(ctx, gr.head[0] - 30, gr.head[1] - 90, 1.0, { flip: true });
      F.sweat(ctx, gr.head[0] - 120, gr.head[1] - 20 + Math.sin(tw * 9) * 10, 0.7, { flip: true });
      // wind streaks around Grant (he is the flag)
      F.speedLines(ctx, { angle: Math.PI, count: 12, color: '#ffffff', alpha: 0.8, seed: 1907, t, speed: 3200, len: 300, width: 7, x: -40, y: gr.head[1] - 220, w: 1100, h: 420 });

      // aura behind Goofy
      F.aura(ctx, gx + 10, GROUND + 10, 700, 620, t, { color: '#3b1d6e', core: P.demonRed, seed: 1908, alpha: 0.85 });
      ctx.save();
      if (squash) {
        ctx.translate(gx, GROUND);
        ctx.scale(1.07, 0.92);
        ctx.translate(-gx, -GROUND);
      }
      const ga = CAST.goofy(ctx, { x: gx, y: gy, s: GOOFY_S, pose: 'bark', face: 'angry', t: gt });
      ctx.restore();
      F.leash(ctx, ga.collar, gr.handR, { taut: true, width: 10 });
      // menace glyphs rising off his back
      F.menace(ctx, gx - 330, gy - 150, t, { size: 72, n: 3, seed: 1909, color: '#7a3cff' });

      // ---- 7 shock rings from the mouth (two per bark), leaves, front speed lines
      F.shockRing(ctx, ga.mouth[0] + 190, ga.mouth[1] - 30, age, { r: 380, color: '#ffffff', life: 0.42, width: 26, squash: 0.75 });
      F.shockRing(ctx, ga.mouth[0] + 190, ga.mouth[1] - 30, age - 0.08, { r: 280, color: P.sfxYellow, life: 0.36, width: 16, squash: 0.75 });
      // bark breath lines out of the mouth
      if (age < 0.25) {
        ctx.save();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 9; ctx.lineCap = 'round';
        ctx.globalAlpha = 1 - age / 0.25;
        for (let i = -2; i <= 2; i++) {
          const a = -0.35 + i * 0.22, r0 = 70 + age * 300, r1 = 150 + age * 600;
          ctx.beginPath();
          ctx.moveTo(ga.mouth[0] + Math.cos(a) * r0, ga.mouth[1] + Math.sin(a) * r0);
          ctx.lineTo(ga.mouth[0] + Math.cos(a) * r1, ga.mouth[1] + Math.sin(a) * r1);
          ctx.stroke();
        }
        ctx.restore();
      }
      leaves(ctx, t, { n: 22, seed: 1, y0: 250, h: 1350, r: 22 });
      F.speedLines(ctx, { angle: Math.PI, count: 10, color: '#ffffff', alpha: 0.9, seed: 1910, t, speed: 4200, len: 700, width: 14, y: 1200, h: 600 });

      ctx.restore(); // camera

      // ---- 8 SFX, screen-fixed over the shake (they carry their own jitter)
      // Grant's scream trails behind him
      F.sfx(ctx, 'AAAAAH!', 215, 640, t, 0.25, { size: 62, fill: '#bfe9ff', shadowColor: '#27335c', rot: -0.3, shake: 6 });
      for (let i = 0; i < N_BARKS; i++) {
        const t0 = i * BEAT;
        if (t < t0 - 1e-6 || t > t0 + 0.95) continue;
        const [x, y, rot] = WOOFS[i];
        const big = i === 5;
        const red = i % 2 === 0;
        // escalating size, capped so every WOOF stays inside the safe width
        const size = Math.min(big ? 200 : 150 + i * 4, (big ? 720 : 530) / (F.measure(ctx, 'WOOF!', 100) / 100));
        const fade = clamp((t0 + 0.95 - t) / 0.25);
        const older = t - t0 > BEAT - 1e-6; // an older WOOF shrinks back while the new one hits
        ctx.save();
        ctx.globalAlpha = older ? fade * 0.9 : 1;
        // jagged burst behind the fresh WOOF
        if (!older) F.burst(ctx, x, y + 6, size * 1.75, size * 1.15, 14, red ? P.sfxYellow : P.demonRed, { seed: 1920 + i, squash: 0.55, lw: 6, rot: i });
        F.sfx(ctx, 'WOOF!', x, y, t, t0, {
          size: older ? size * 0.82 : size, rot, fill: red ? P.sfxRed : P.sfxYellow, shadowColor: red ? '#5a0a1a' : '#b3122b', shake: 10,
        });
        ctx.restore();
      }
      // beat flash: one white frame on each bark
      if (age < FR - 1e-6) F.flash(ctx, 0.22, '#fff3e0');
      F.vignette(ctx, 0.45, '40,0,20');
    },
  });
})();

</script>
<script>
// ---- src/scenes/20-grant-calms.js
// Shot 20 'grant-calms' : Easy, Goofy... (global T 84.0 - 89.0, local t 0 - 5).
// After the storm: a soft pale-mint calming space (the park dissolved into pastel shapes), soap
// bubbles drifting up, gentle sparkles. Grant (kneel, calm, sweating) kneels beside Goofy (stand)
// and pats him on every beat from t 1.0. Goofy's demon mode deflates: angry until 1.5, a puff of
// dark smoke, red eyes fading back to normal (1.5 - 2.5), then "sad": trembling lip and big tears
// welling up in his eyes, full by t 4.0.
//   t 0.5 (T 84.5)  bubble "EASY, GOOFY... BREATHE..."
//   t 2.0 (T 86.0)  bubble "GOOD BOY. WHAT'S WRONG?"
//
// Layers, back to front:
//   1 mint gradient sky, soft glow, pastel park shapes (Cascade tiers, round trees, lamp posts)
//   2 bokeh + rising soap bubbles (back set), soft ground
//   3 Goofy (stand; angry -> neutral -> sad) with leftover demon smoke, eye glow, welling tears
//   4 Grant (kneel, calm) patting, sweat drops
//   5 front bubbles, sparkles, "pat" marks
//   6 speech bubbles (screen-fixed)
(function () {
  'use strict';
  const ID = 'grant-calms';
  const FILM = window.FILM;
  const F = FILM.fx, CAST = FILM.cast, P = F.pal, LIB = FILM.lib;
  const TAU = Math.PI * 2, FR = 1 / 24;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const h01 = (...k) => F.h01(ID, ...k);
  const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };

  // ---- beats (local t; global T in comments)
  const B_LINE1 = 0.5; // T 84.5  "EASY, GOOFY... BREATHE..."
  const B_PAT0 = 1.0; // T 85.0  first pat, then every beat
  const B_POOF = 1.5; // T 85.5  demon mode deflates (smoke puff)
  const B_LINE2 = 2.0; // T 86.0  "GOOD BOY. WHAT'S WRONG?"
  const B_SAD = 2.5; // T 86.5  face "sad"
  const B_TEARS = 4.0; // T 88.0  tears full
  const GROUND = 1560;
  const GRANT_X = 215, GRANT_Y = 1480, GRANT_S = 1.8; // behind
  const GOOFY_X = 900, GOOFY_Y = 1650, GOOFY_S = 2.25; // in front, head under Grant's hand

  const K = {
    skyTop: '#dff9ee', skyLow: '#c3eedb', glow: 'rgba(255,255,255,0.75)',
    far: '#cdeedf', far2: '#bfe6d3', far3: '#b2dec9', floor: '#a9dcc2', floorShade: '#94cfb2',
    bubble: 'rgba(255,255,255,0.28)', bubbleEdge: 'rgba(90,170,160,0.55)',
  };

  // pastel, outline-free park shapes: the same place, calmed down
  function softPark(ctx) {
    F.sky(ctx, K.skyTop, K.skyLow, { x: -80, y: -80, w: 1240, h: 2080 });
    // far Cascade tiers
    ctx.fillStyle = K.far;
    for (let i = 0; i < 6; i++) {
      const w = 760 * (1 - i * 0.1), y = 1010 - i * 62;
      ctx.fillRect(540 - w / 2, y - 62, w, 64);
    }
    ctx.fillStyle = K.far2;
    ctx.beginPath(); ctx.moveTo(490, 1010); ctx.lineTo(590, 1010); ctx.lineTo(570, 638); ctx.lineTo(510, 638); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 6; i++) {
      const w = 760 * (1 - i * 0.1), y = 1010 - i * 62;
      for (let a = 0; a < 7; a++) {
        const ax = 540 - w / 2 + (a + 0.5) * (w / 7);
        if (Math.abs(ax - 540) < 70) continue;
        F.rrect(ctx, ax - 12, y - 44, 24, 30, 12); ctx.fill();
      }
    }
    // round trees
    const trees = [[80, 1120, 120], [250, 1150, 95], [860, 1130, 115], [1020, 1160, 100], [620, 1170, 80]];
    trees.forEach(([x, y, r], i) => {
      ctx.fillStyle = K.far3;
      ctx.fillRect(x - 10, y - r * 0.6, 20, r * 1.2);
      ctx.fillStyle = i % 2 ? K.far2 : K.far3;
      ctx.beginPath();
      ctx.arc(x, y - r * 1.1, r, 0, TAU);
      ctx.arc(x - r * 0.6, y - r * 0.8, r * 0.7, 0, TAU);
      ctx.arc(x + r * 0.6, y - r * 0.8, r * 0.7, 0, TAU);
      ctx.fill();
    });
    // floor
    ctx.fillStyle = K.floor;
    ctx.fillRect(-80, 1200, 1240, 900);
    ctx.fillStyle = K.floorShade;
    ctx.fillRect(-80, 1200, 1240, 18);
    F.ellipse(ctx, 540, GROUND + 10, 520, 70); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
  }

  // soap bubbles drifting up, wobbling; o.front draws bigger nearer ones
  function bubbles(ctx, t, o) {
    for (let i = 0; i < o.n; i++) {
      const sp = 60 + h01('bs', o.seed, i) * 80;
      const span = 2200;
      const y = 1900 - ((h01('by', o.seed, i) * span + t * sp) % span);
      const x = h01('bx', o.seed, i) * 1080 + Math.sin(t * 1.3 + i * 2.1) * 30;
      const r = o.r0 + h01('br', o.seed, i) * o.r1;
      const wob = 1 + Math.sin(t * 5 + i) * 0.05;
      ctx.save();
      ctx.beginPath(); ctx.ellipse(x, y, r * wob, r / wob, 0, 0, TAU);
      ctx.fillStyle = K.bubble; ctx.fill();
      ctx.strokeStyle = K.bubbleEdge; ctx.lineWidth = 3; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = Math.max(3, r * 0.12); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x, y, r * 0.7, -2.6, -1.8); ctx.stroke();
      ctx.fillStyle = 'rgba(255,190,230,0.35)';
      ctx.beginPath(); ctx.arc(x + r * 0.35, y + r * 0.35, r * 0.25, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  // demon smoke puffs deflating off Goofy (age from B_POOF)
  function smoke(ctx, x, y, age) {
    if (age < 0 || age > 1.1) return;
    const u = age / 1.1;
    ctx.save();
    ctx.globalAlpha = (1 - u) * 0.9;
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI / 2 + (h01('sm', i) - 0.5) * 2.6;
      const d = 60 + LIB.ease.outCubic(u) * (160 + h01('smd', i) * 140);
      const r = (40 + h01('smr', i) * 40) * (0.6 + u * 0.8);
      F.ellipse(ctx, x + Math.cos(a) * d, y + Math.sin(a) * d - u * 120, r, r * 0.85);
      F.fo(ctx, i % 2 ? '#4a3a5e' : '#6a5a80', 4, 'rgba(27,20,36,0.5)');
    }
    ctx.restore();
  }

  // a welling tear bead on the lower lid (grows 0..1, wobbles)
  function tearBead(ctx, x, y, s, g, t, seed) {
    if (g <= 0.01) return;
    const wob = 1 + Math.sin(t * 14 + seed) * 0.06 * g;
    const rx = 17 * s * g * wob, ry = 11 * s * g / wob;
    ctx.save();
    F.ellipse(ctx, x, y + ry * 0.3, rx, ry);
    F.fo(ctx, 'rgba(143,216,255,0.9)', 3.5);
    ctx.fillStyle = '#ffffff';
    F.ellipse(ctx, x - rx * 0.35, y - ry * 0.1, rx * 0.28, ry * 0.3); ctx.fill();
    F.ellipse(ctx, x + rx * 0.3, y + ry * 0.5, rx * 0.12, ry * 0.14); ctx.fill();
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tw = LIB.onTwos(t);

      // camera: slow calm push-in
      const zoom = 1 + 0.05 * LIB.ease.inOutSine(t / info.dur) + 0.07 * LIB.ease.inOutSine(clamp((t - 2.5) / 2.5));
      ctx.save();
      ctx.translate(640, 1250);
      ctx.scale(zoom, zoom);
      ctx.translate(-640, -1250);

      // ---- 1 background
      softPark(ctx);
      // soft light rays fanning down from the top, slowly turning
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      for (let i = 0; i < 9; i++) {
        const a0 = Math.PI * 0.18 + i * (Math.PI * 0.64 / 9) + Math.sin(t * 0.6) * 0.03, a1 = a0 + 0.07;
        ctx.moveTo(540, -200);
        ctx.lineTo(540 + Math.cos(a0) * 2400, -200 + Math.sin(a0) * 2400);
        ctx.lineTo(540 + Math.cos(a1) * 2400, -200 + Math.sin(a1) * 2400);
        ctx.closePath();
      }
      ctx.fill();
      ctx.restore();
      // calm halo rings behind the pair, breathing slowly (in... out...)
      const breath = 1 + Math.sin(t * Math.PI) * 0.04;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      for (let i = 0; i < 4; i++) {
        ctx.lineWidth = 10 - i * 2;
        ctx.globalAlpha = 0.8 - i * 0.17;
        ctx.beginPath(); ctx.arc(600, 1000, (260 + i * 110) * breath, 0, TAU); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(600, 1000, 250 * breath, 0, TAU); ctx.fill();
      ctx.restore();
      const glow = ctx.createRadialGradient(560, 1150, 60, 560, 1150, 760);
      glow.addColorStop(0, K.glow);
      glow.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(-80, 300, 1240, 1700);
      // ---- 2 bokeh + back bubbles
      F.bokeh(ctx, { n: 18, seed: 2001, t, colors: ['#ffffff', '#d8fff0', '#fff0f6'], rMin: 14, rMax: 50, alpha: 0.5 });
      bubbles(ctx, t, { n: 14, seed: 1, r0: 14, r1: 26 });

      // pat timing: a pat lands on every beat from B_PAT0 to 3.5
      let patAge = 99;
      for (let b = B_PAT0; b <= 3.5 + 1e-6; b += 0.5) if (t >= b - 1e-6) patAge = t - b;
      const patDown = patAge < 3 * FR + 1e-6 ? 1 : patAge < 0.25 ? 1 - (patAge - 3 * FR) / (0.25 - 3 * FR) : 0;

      // ---- 3 Grant (behind, kneeling, calm but sweating), leaning into each pat
      const lean = patDown * 0.04 + Math.sin(tw * 2.4) * 0.01;
      const grantO = { x: GRANT_X, y: GRANT_Y, s: GRANT_S, pose: 'kneel', face: 'calm', t, tilt: lean };
      const gr = CAST.grant(ctx, grantO);
      const drip = ((t * 0.7) % 1);
      F.sweat(ctx, gr.head[0] - 120, gr.head[1] - 50 + drip * 70, 1.3, { flip: true });
      F.sweat(ctx, gr.head[0] + 115, gr.head[1] - 90, 0.9);
      if (t < 2.0) F.sweat(ctx, gr.head[0] + 135, gr.head[1] + 10 + ((t * 1.3) % 1) * 60, 0.7);

      // ---- 4 Goofy (in front): angry -> neutral (smoke puff, red glow fading) -> sad
      const faceName = t < B_POOF - 1e-6 ? 'angry' : t < B_SAD - 1e-6 ? 'neutral' : 'sad';
      const shiver = faceName === 'sad' ? (h01('sv', LIB.boil(info.T)) - 0.5) * 4 : 0;
      const gx = GOOFY_X + shiver, gs = GOOFY_S;
      ctx.save();
      const sq = patDown * 0.045; // squish under the pat
      ctx.translate(gx, GOOFY_Y);
      ctx.scale(1 + sq * 0.6, 1 - sq);
      ctx.translate(-gx, -GOOFY_Y);
      const ga = CAST.goofy(ctx, { x: gx, y: GOOFY_Y, s: gs, pose: 'stand', face: faceName, flip: true, t, look: faceName === 'sad' ? [-0.5, -0.5] : [-0.4, 0] });
      ctx.restore();
      // leftover red eye glow fading 1.5 -> 2.5
      const red = faceName === 'neutral' ? 1 - sstep(B_POOF, B_SAD, t) : 0;
      if (red > 0.01) {
        ctx.save();
        ctx.globalAlpha = red * 0.85;
        [ga.eyeL, ga.eyeR].forEach((e) => {
          const g = ctx.createRadialGradient(e[0], e[1], 2, e[0], e[1], 60);
          g.addColorStop(0, 'rgba(255,35,64,0.95)');
          g.addColorStop(0.45, 'rgba(255,35,64,0.5)');
          g.addColorStop(1, 'rgba(255,35,64,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(e[0], e[1], 60, 0, TAU); ctx.fill();
        });
        ctx.restore();
      }
      smoke(ctx, ga.head[0] + 120, ga.head[1] - 60, t - B_POOF);
      // trembling lip + welling tears
      if (faceName === 'sad') {
        const g = sstep(B_SAD, B_TEARS, t);
        const b = LIB.boil(info.T);
        ctx.save();
        ctx.strokeStyle = P.line; ctx.lineWidth = 5; ctx.lineCap = 'round';
        const m = ga.mouth;
        // tremble marks either side of the frown (frown centre = mouth anchor + (12, 4) * s, flipped)
        const fx = m[0] + 12 * gs, fy = m[1] + 4 * gs;
        [-1, 1].forEach((side) => {
          for (let i = 0; i < 2; i++) {
            const jx = (h01('lp', side, i, b) - 0.5) * 6;
            const x = fx + side * (52 + i * 14) + jx;
            ctx.beginPath();
            ctx.moveTo(x, fy - 12);
            ctx.lineTo(x + side * 5, fy - 4);
            ctx.lineTo(x - side * 3, fy + 4);
            ctx.lineTo(x + side * 3, fy + 12);
            ctx.stroke();
          }
        });
        ctx.restore();
        tearBead(ctx, ga.eyeL[0], ga.eyeL[1] + 17 * gs, gs, g, t, 1);
        tearBead(ctx, ga.eyeR[0], ga.eyeR[1] + 17 * gs, gs, g, t, 2);
        if (g > 0.3) {
          F.sparkle(ctx, ga.eyeL[0] - 8, ga.eyeL[1] - 16, 18 * g, { glow: false });
          F.sparkle(ctx, ga.eyeR[0] - 8, ga.eyeR[1] - 16, 18 * g, { glow: false });
        }
        if (t > 3.2) F.gloom(ctx, ga.head[0] + 150, ga.head[1] - 160, 160, 120, { count: 5, color: 'rgba(90,120,190,0.55)', seed: 2004 });
      }
      if (faceName === 'angry') F.vein(ctx, ga.head[0] + 120, ga.top[1] + 40, 1.2);

      // Grant's patting hand redrawn over Goofy's head (clipped to the hand)
      ctx.save();
      ctx.beginPath(); ctx.arc(gr.handR[0], gr.handR[1], 34 * GRANT_S, 0, TAU); ctx.clip();
      CAST.grant(ctx, grantO);
      ctx.restore();
      // "pat" marks next to the hand
      if (patAge < 0.35) {
        const u = patAge / 0.35;
        ctx.save();
        ctx.globalAlpha = 1 - u;
        F.text(ctx, 'pat', gr.handR[0] + 70, gr.handR[1] - 90 - u * 30, { size: 46, fill: '#ffffff', stroke: '#3a8f7a', lw: 8, rot: -0.2 });
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 7; ctx.lineCap = 'round';
        for (let i = -1; i <= 1; i++) {
          const a = -Math.PI / 2 + i * 0.5;
          ctx.beginPath();
          ctx.moveTo(gr.handR[0] + Math.cos(a) * 60, gr.handR[1] + Math.sin(a) * 60);
          ctx.lineTo(gr.handR[0] + Math.cos(a) * (95 + u * 20), gr.handR[1] + Math.sin(a) * (95 + u * 20));
          ctx.stroke();
        }
        ctx.restore();
      }
      // demon mode deflating: a limp little "pshhh..."
      if (t >= B_POOF - 1e-6 && t < B_POOF + 1.2) {
        ctx.save();
        ctx.globalAlpha = 1 - clamp((t - B_POOF - 0.9) / 0.3);
        F.text(ctx, 'pshhh...', ga.head[0] + 170, ga.head[1] - 250 - (t - B_POOF) * 40, { size: 50, fill: '#b9a8d8', stroke: '#4a3a5e', lw: 8, rot: 0.12, scale: F.popIn(t, B_POOF) });
        ctx.restore();
      }

      // ---- 5 front bubbles + sparkles
      bubbles(ctx, t, { n: 6, seed: 2, r0: 26, r1: 34 });
      F.sparkles(ctx, { n: 12, seed: 2005, t, x: 60, y: 300, w: 960, h: 1200, size: 26, color: '#ffffff' });

      ctx.restore(); // camera

      // ---- 6 speech bubbles (screen-fixed)
      const b1a = t < 3.5 ? 1 : 1 - clamp((t - 3.5) / 0.25);
      if (b1a > 0) {
        ctx.save();
        ctx.globalAlpha = b1a;
        F.bubble(ctx, 'EASY, GOOFY... BREATHE...', 420, 320, { size: 56, maxW: 560, tail: [330, 560], t, t0: B_LINE1 });
        ctx.restore();
      }
      F.bubble(ctx, "GOOD BOY. WHAT'S WRONG?", 730, 560, { size: 54, maxW: 520, tail: [520, 780], t, t0: B_LINE2 });
    },
  });
})();

</script>
<script>
// ---- src/scenes/21-miss-hayk.js
// Shot 21 'miss-hayk' : I MISS HAYK (global T 89.0 - 95.0, local t 0 - 6).
// The emotional peak, played for comedy. In the Yerevan park Goofy (howl, cry) throws his head to
// the sky, waterfall tears gushing in two arcs into growing puddles, pale-blue drama rays behind him.
//   t 1.0 (T 90.0)  "I MISS HAAAAYK!!": the biggest text in the film, in a huge jagged double shout
//                   bubble, every letter shaking; impact flash, big shake, then a steady tremble.
//   t 2.0 (T 91.0)  Grant (face "shocked") falls over backwards, legs in the air, THUD.
//   t 3.0 (T 92.0)  small bubble from Grant: "HE CAN TALK?!"
//   t 4.0 (T 93.0)  the camera pulls back fast: the park shrinks into Yerevan (Cascade, TV tower,
//                   Ararat), Yerevan shrinks into a globe showing Armenia and Spain; the howl text
//                   echoes smaller and smaller. Globe holds from t 5.6.
//
// Zoom model: three nested levels, each 6x the previous, all anchored on screen point A.
//   L0 park (native 1080x1920), L1 Yerevan (L0 sits at 1/6 around F1), L2 globe (L1 sits at 1/6
//   around F2 = Armenia). Scales: S0 = Z, S1 = 6 Z, S2 = 36 Z with Z = 36^-e(u).
//   L0 and L1 are rendered into scratch buffers and feathered with an oval mask so each level
//   dissolves into the next instead of showing a hard frame edge.
//
// Layers (L0), back to front:
//   1 park: sky, clouds, Ararat, city, Cascade, trees, lamps, benches, grass, path
//   2 drama rays + sparkles behind Goofy, tear puddles
//   3 Grant (kneel -> falls over, legs up), dust
//   4 Goofy (howl, cry) with his tear streams, howl rings
//   5 shout bubble "I MISS HAAAAYK!!", "HE CAN TALK?!", THUD
(function () {
  'use strict';
  const ID = 'miss-hayk';
  const FILM = window.FILM;
  const F = FILM.fx, CAST = FILM.cast, P = F.pal, LIB = FILM.lib;
  const TAU = Math.PI * 2, FR = 1 / 24, DEG = Math.PI / 180;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const h01 = (...k) => F.h01(ID, ...k);

  // ---- beats (local t; global T in comments)
  const B_SHOUT = 1.0; // T 90.0
  const B_FALL = 2.0; // T 91.0
  const B_TALK = 3.0; // T 92.0
  const B_ZOOM = 4.0; // T 93.0
  const ZOOM_DUR = 1.6; // globe settles at t 5.6 and holds
  const ECHOES = [[4.55, 88, 400], [5.0, 64, 290], [5.4, 52, 420]]; // [t0, size, y]

  // ---- L0 geometry
  const GROUND = 1540;
  const GOOFY = { x: 690, y: 1545, s: 2.45 };
  const GRANT = { x: 250, y: 1470, s: 1.12 };
  const HIP_END = [330, 1225]; // Grant's hip after the fall (head on the ground, legs up)
  const A = [720, 1000]; // screen anchor of the zoom (near Goofy's head)
  const F1 = [560, 1150]; // where the park sits inside the Yerevan view
  const F2 = A; // Armenia on the globe at the end (L2 is at scale 1 when the zoom ends)
  const RATIO = 6;

  // ---- park colours (same Yerevan park as shots 17-20)
  const K = {
    skyTop: '#8ccfff', skyMid: '#cdeeff', skyLow: '#ffe3e6',
    stone: '#e8b8a0', stoneShade: '#d09a84', stoneLight: '#f6d6c4', stoneLine: '#a8756a',
    hill: '#9fcf86', hillShade: '#86bb70',
    blockA: '#f1d9cf', blockB: '#e6cfe0', blockC: '#f5e6c8', win: '#b9c8e6',
    grassFar: '#a6d884', grass: P.grass, grassShade: P.grassShade,
    path: '#f0dcb6', pathShade: '#dcc39a', pathLine: '#c9ab80',
    tree: P.tree, treeShade: P.treeShade, treeHi: '#7cc466', trunk: P.trunk,
    bench: '#c0713a', benchShade: '#8f4f26', lamp: '#39314a',
    space: '#0d0f2e', space2: '#1f1a4a', ocean: '#3f8fe0', oceanDeep: '#2b6cc0', land: '#8fd06a', landLine: '#2f6a3a', desert: '#e6d08e',
  };

  // ===========================================================================
  // L0: the park
  // ===========================================================================
  function cascade(ctx, cx, baseY, w, h, lw = 2.5) {
    const tiers = 6;
    for (let i = 0; i < tiers; i++) {
      const u0 = i / tiers, u1 = (i + 1) / tiers;
      const tw = w * (1 - u0 * 0.55), y0 = baseY - h * u0, y1 = baseY - h * u1;
      const x0 = cx - tw / 2, th = y0 - y1;
      ctx.fillStyle = K.stone; ctx.fillRect(x0, y1, tw, th);
      ctx.fillStyle = K.stoneShade; ctx.fillRect(x0, y0 - th * 0.22, tw, th * 0.22);
      ctx.fillStyle = K.stoneLight; ctx.fillRect(x0, y1, tw, Math.max(2, th * 0.08));
      const na = Math.max(3, Math.round(tw / 70));
      ctx.fillStyle = K.stoneShade;
      for (let a = 0; a < na; a++) {
        const ax = x0 + (a + 0.5) * (tw / na);
        if (Math.abs(ax - cx) < w * 0.09) continue;
        const aw = (tw / na) * 0.42, ah = th * 0.45, by = y0 - th * 0.25;
        ctx.beginPath();
        ctx.moveTo(ax - aw / 2, by); ctx.lineTo(ax - aw / 2, by - ah + aw / 2);
        ctx.arc(ax, by - ah + aw / 2, aw / 2, Math.PI, 0);
        ctx.lineTo(ax + aw / 2, by); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = K.hillShade;
      for (let b = 0; b < 4; b++) { const bx = x0 + 20 + (b * (tw - 40)) / 3; ctx.beginPath(); ctx.arc(bx, y1 + 2, th * 0.14, Math.PI, 0); ctx.fill(); }
      ctx.strokeStyle = K.stoneLine; ctx.lineWidth = lw; ctx.strokeRect(x0, y1, tw, th);
    }
    const sw = w * 0.16;
    ctx.fillStyle = K.stoneLight;
    ctx.beginPath(); ctx.moveTo(cx - sw / 2, baseY); ctx.lineTo(cx + sw / 2, baseY); ctx.lineTo(cx + sw * 0.3, baseY - h); ctx.lineTo(cx - sw * 0.3, baseY - h); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = K.stoneLine; ctx.lineWidth = lw * 0.6;
    ctx.beginPath();
    for (let k = 1; k < 30; k++) { const u = k / 30, y = baseY - h * u, hw = lerp(sw / 2, sw * 0.3, u); ctx.moveTo(cx - hw, y); ctx.lineTo(cx + hw, y); }
    ctx.stroke();
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(cx - sw / 2, baseY); ctx.lineTo(cx - sw * 0.3, baseY - h); ctx.moveTo(cx + sw / 2, baseY); ctx.lineTo(cx + sw * 0.3, baseY - h); ctx.stroke();
    ctx.fillStyle = K.stoneShade;
    ctx.fillRect(cx - w * 0.027, baseY - h - h * 0.18, w * 0.054, h * 0.18);
    ctx.strokeRect(cx - w * 0.027, baseY - h - h * 0.18, w * 0.054, h * 0.18);
  }
  function roundTree(ctx, x, y, r, lw = 8) {
    ctx.beginPath();
    ctx.moveTo(x - r * 0.12, y); ctx.lineTo(x - r * 0.07, y - r * 1.1); ctx.lineTo(x + r * 0.07, y - r * 1.1); ctx.lineTo(x + r * 0.12, y); ctx.closePath();
    F.fo(ctx, K.trunk, lw * 0.5);
    const cy = y - r * 1.45;
    const blobs = [[0, 0, 1], [-0.55, 0.25, 0.7], [0.55, 0.25, 0.72], [-0.3, -0.45, 0.66], [0.32, -0.42, 0.64]];
    ctx.beginPath();
    blobs.forEach(([bx, by, br]) => { ctx.moveTo(x + bx * r + br * r, cy + by * r); ctx.arc(x + bx * r, cy + by * r, br * r, 0, TAU); });

    ctx.fillStyle = K.tree; ctx.fill();
    ctx.fillStyle = K.treeShade;
    ctx.beginPath(); ctx.ellipse(x + r * 0.1, cy + r * 0.45, r * 0.95, r * 0.42, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = K.tree;
    ctx.beginPath(); ctx.arc(x - r * 0.12, cy - r * 0.08, r * 0.78, 0, TAU); ctx.fill();
    ctx.fillStyle = K.treeHi;
    ctx.beginPath(); ctx.ellipse(x - r * 0.35, cy - r * 0.42, r * 0.28, r * 0.17, -0.5, 0, TAU); ctx.fill();
  }
  function bench(ctx, x, y) {
    ctx.fillStyle = K.lamp;
    ctx.fillRect(x - 70, y - 40, 8, 40); ctx.fillRect(x + 62, y - 40, 8, 40);
    F.rrect(ctx, x - 84, y - 50, 168, 14, 4); F.fo(ctx, K.bench, 4);
    F.rrect(ctx, x - 84, y - 92, 168, 12, 4); F.fo(ctx, K.bench, 4);
    F.rrect(ctx, x - 84, y - 74, 168, 12, 4); F.fo(ctx, K.benchShade, 4);
  }
  function lamp(ctx, x, y) {
    ctx.fillStyle = K.lamp;
    ctx.fillRect(x - 5, y - 250, 10, 250);
    ctx.fillRect(x - 14, y - 16, 28, 16);
    F.ellipse(ctx, x, y - 262, 20, 24); F.fo(ctx, '#fff4c8', 4);
    ctx.fillStyle = K.lamp; ctx.fillRect(x - 16, y - 290, 32, 10);
  }
  function park(ctx, t) {
    F.sky(ctx, K.skyTop, K.skyLow, { mid: K.skyMid, midAt: 0.55, x: -80, y: -80, w: 1240, h: 1060 });
    F.clouds(ctx, { n: 4, seed: 21, t, y: 250, h: 320, speed: 14, scale: 0.8 });
    F.ararat(ctx, 520, 900, 620, 290, { color: '#b8c0e2', shade: '#a3acd6', snow: '#fbfcff' });
    for (let i = 0; i < 9; i++) {
      const bw = 90 + h01('bw', i) * 90, bh = 90 + h01('bh', i) * 170;
      const x = -60 + i * 150;
      ctx.fillStyle = [K.blockA, K.blockB, K.blockC][i % 3];
      ctx.fillRect(x, 905 - bh, bw, bh + 5);
      ctx.fillStyle = K.win;
      for (let r = 0; r < Math.floor(bh / 34); r++) for (let c = 0; c < Math.floor(bw / 30); c++) ctx.fillRect(x + 10 + c * 30, 905 - bh + 14 + r * 34, 12, 16);

    ctx.beginPath(); ctx.ellipse(430, 960, 620, 330, 0, Math.PI, TAU); ctx.fill();
    cascade(ctx, 430, 950, 600, 380);
    ctx.fillStyle = K.grassFar; ctx.fillRect(-80, 940, 1240, 80);
    for (let i = 0; i < 5; i++) {

    for (let i = 0; i < 11; i++) { const x = i * 110 - 30, y = 1150 + (i % 3) * 18; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 8, y - 22); ctx.lineTo(x + 16, y); ctx.fill(); }
    ctx.fillStyle = K.path; ctx.fillRect(-80, 1330, 1240, 460);
    ctx.fillStyle = K.pathShade; ctx.fillRect(-80, 1330, 1240, 22);
    ctx.strokeStyle = P.line; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-80, 1330); ctx.lineTo(1160, 1330); ctx.stroke();
    ctx.strokeStyle = K.pathLine; ctx.lineWidth = 4;
    ctx.beginPath();
    for (let i = 0; i < 7; i++) { const x = i * 200 - 20; ctx.moveTo(x, 1360); ctx.lineTo(x - 70, 1780); }
    ctx.moveTo(-80, 1520); ctx.lineTo(1160, 1520);
    ctx.stroke();
    ctx.fillStyle = K.grass; ctx.fillRect(-80, 1790, 1240, 200);
    ctx.strokeStyle = P.line; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-80, 1790); ctx.lineTo(1160, 1790); ctx.stroke();
  }

  // translucent drama rays fanning out from a point
  function rays(ctx, cx, cy, rot, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#e8f6ff';
    ctx.beginPath();
    const n = 16;
    for (let i = 0; i < n; i++) {
      const a0 = rot + (i / n) * TAU, a1 = a0 + (TAU / n) * 0.45;
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a0) * 2600, cy + Math.sin(a0) * 2600);
      ctx.lineTo(cx + Math.cos(a1) * 2600, cy + Math.sin(a1) * 2600);
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
  }

  // Grant's fall: kneeling until B_FALL, then topples over backwards (legs up) around his hip.
  function grantFall(ctx, t, o = {}) {
    const face = t < B_SHOUT - 1e-6 ? 'nervous' : 'shocked';
    const u = clamp((t - B_FALL) / 0.3);
    const x = GRANT.x, y = GRANT.y, s = GRANT.s;
    if (t < B_FALL - 1e-6) {
      const jump = t >= B_SHOUT - 1e-6 && t < B_SHOUT + 0.25 ? -Math.sin(((t - B_SHOUT) / 0.25) * Math.PI) * 40 : 0;
      return CAST.grant(ctx, { x, y: y + jump, s, pose: 'kneel', face, t, silhouette: o.sil });
    }
    // rotate around the hip; the hip also drops to the ground
    const ang = -2.5 * LIB.ease.outBack(u);
    const pivot = [x, y - 250 * s];
    const dx = LIB.ease.outCubic(u) * (HIP_END[0] - pivot[0]);
    const drop = LIB.ease.outBounce(u) * (HIP_END[1] - pivot[1]);
    ctx.save();
    ctx.translate(pivot[0] + dx, pivot[1] + drop);
    ctx.rotate(ang);
    ctx.translate(-pivot[0], -pivot[1]);
    const a = CAST.grant(ctx, { x, y, s, pose: 'cheer', face, t, silhouette: o.sil });
    ctx.restore();
    // anchors come back in the unrotated frame: map the ones we use
    const c = Math.cos(ang), sn = Math.sin(ang);
    const map = (p) => {
      const qx = p[0] - pivot[0], qy = p[1] - pivot[1];
      return [pivot[0] + dx + qx * c - qy * sn, pivot[1] + drop + qx * sn + qy * c];
    };
    return { head: map(a.head), mouth: map(a.mouth), top: map(a.top), hip: map(a.hip) };
  }

  // the biggest text in the film: double jagged shout bubble, every letter shaking
  function howlBubble(ctx, t, mouth) {
    const sc = F.popIn(t, B_SHOUT);
    if (sc <= 0) return;
    const b = LIB.boil(LIB.T);
    const cx = 540, cy = 485;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(sc, sc);
    ctx.translate(-cx, -cy);
    const spikes = (rx, ry, n, amp, seed, fill, lw, line) => {
      ctx.beginPath();
      for (let i = 0; i < n * 2; i++) {
        const a = (i / (n * 2)) * TAU;
        const k = i % 2 ? 1 : 1 + amp * (0.7 + h01('hb', seed, i, b) * 0.6);
        const px = cx + Math.cos(a) * rx * k, py = cy + Math.sin(a) * ry * k;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      F.fo(ctx, fill, lw, line);
    };
    // tail: a jagged wedge down to Goofy's mouth
    // (from the bubble's lower right, so it never crosses his eyes)
    const tx = mouth[0] + 20, ty = mouth[1] - 50;
    ctx.beginPath();
    ctx.moveTo(cx + 300, cy + 170); ctx.lineTo(tx, ty); ctx.lineTo(cx + 420, cy + 100); ctx.closePath();
    F.fo(ctx, P.sfxRed, 9);
    spikes(470, 250, 26, 0.2, 1, P.sfxRed, 9);
    ctx.beginPath();
    ctx.moveTo(cx + 320, cy + 140); ctx.lineTo(tx - 4, ty - 36); ctx.lineTo(cx + 395, cy + 95); ctx.closePath();
    F.fo(ctx, '#ffffff', 0);
    spikes(430, 222, 24, 0.14, 2, '#ffffff', 7);
    // text
    const l1 = 'I MISS', l2 = 'HAAAAYK!!';
    const size1 = 118;
    const w2at100 = F.measure(ctx, l2, 100);
    const size2 = Math.min(190, (800 / w2at100) * 100);
    const jig = (i, amp) => [(h01('lx', i, b) - 0.5) * amp, (h01('ly', i, b) - 0.5) * amp];
    const j1 = jig(99, 8);
    F.text(ctx, l1, cx + j1[0], cy - 105 + j1[1], { size: size1, fill: P.line, lw: 0, shadow: 7, shadowColor: P.sfxRed, rot: -0.03 });
    // line 2 letter by letter
    const total = F.measure(ctx, l2, size2);
    let x = cx - total / 2;
    for (let i = 0; i < l2.length; i++) {
      const ch = l2[i];
      const w = F.measure(ctx, ch, size2);
      const isA = ch === 'A';
      const j = jig(i, 14);
      const wave = isA ? Math.sin(t * 14 - i * 0.9) * 12 : 0;
      const grow = isA ? 1 + 0.08 * Math.sin(t * 9 - i) : 1;
      F.text(ctx, ch, x + w / 2 + j[0], cy + 75 + j[1] + wave, { size: size2 * grow, fill: '#ffe14a', stroke: P.line, lw: size2 * 0.16, shadow: 9, shadowColor: '#b3122b', rot: (h01('lr', i, b) - 0.5) * 0.18 });
      x += w;
    }
    ctx.restore();
  }

  // Level 0: the whole park moment (also what shrinks during the pull-back)
  function drawL0(ctx, t, info) {
    const tw = LIB.onTwos(t);
    park(ctx, t);
    // drama rays + sparkles behind Goofy, stronger once he talks
    const howl = clamp((t - B_SHOUT) / 0.15);
    rays(ctx, 800, 900, t * 0.15, 0.22 + 0.25 * howl);
    F.sparkles(ctx, { n: 10, seed: 2101, t, x: 420, y: 700, w: 640, h: 500, size: 30, color: '#e6f7ff' });

    // howl sound rings from the mouth

      const age = ((t - B_SHOUT + i * 0.2) % 0.6 + 0.6) % 0.6;

    }

    for (let i = 0; i < 8; i++) {
      const u = ((t * 1.8 + i / 8) % 1 + 1) % 1;
      const side = i % 2 ? 1 : -1;
      const bx = side > 0 ? GOOFY.x + 480 : GOOFY.x - 290;
      const px = bx + (h01('sp', i) - 0.5) * 200 * u, py = 1570 - Math.sin(u * Math.PI) * 90;
      F.ellipse(ctx, px, py, 9 * (1 - u * 0.5), 12 * (1 - u * 0.5));

    }

    // ---- text

    }

      F.sweat(ctx, gr.head[0] + 70, gr.head[1] - 120, 0.9);
    }
    return ga;
  }

  // ===========================================================================
  // L1: Yerevan from high above (Ararat, the Cascade, the TV tower, pink tuff blocks)
  // ===========================================================================
  const TUFF = ['#e8b8a0', '#f1c9b0', '#d9a28c', '#f5dcc8', '#e9c4c8'];
  function tvTower(ctx, x, base, h) {
    ctx.save();
    ctx.lineWidth = 3; ctx.strokeStyle = '#8a3040';
    const segs = 8;
    for (let i = 0; i < segs; i++) {
      const y0 = base - (h * i) / segs, y1 = base - (h * (i + 1)) / segs;
      const w0 = lerp(46, 8, i / segs), w1 = lerp(46, 8, (i + 1) / segs);
      ctx.fillStyle = i % 2 ? '#ffffff' : '#e8413c';
      ctx.beginPath(); ctx.moveTo(x - w0 / 2, y0); ctx.lineTo(x + w0 / 2, y0); ctx.lineTo(x + w1 / 2, y1); ctx.lineTo(x - w1 / 2, y1); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#e8413c'; ctx.fillRect(x - 16, base - h * 0.62, 32, 16);
    ctx.beginPath(); ctx.moveTo(x, base - h); ctx.lineTo(x, base - h - 40); ctx.stroke();
    ctx.restore();
  }
  // Yerevan blocks: layout memoised once (seeded, t-independent), drawn row by row with the
  // windows of a row batched into one path.
  let CITY = null;
  function city() {
    if (CITY) return CITY;
    const park = [415, 950, 670, 1340]; // x0, y0, x1, y1 kept clear for the park + Cascade
    CITY = [];
    for (let r = 0; r < 16; r++) {
      const y = 740 + r * r * 4.2 + r * 40;
      if (y > 2300) break;
      const sc = 0.5 + r * 0.14;
      const row = { y, sc, blocks: [], trees: [], wins: [] };
      let x = -380 + h01('rx', r) * 60;
      let i = 0;
      while (x < 1460) {
        const w = (50 + h01('bw', r, i) * 70) * sc, h = (40 + h01('bh', r, i) * 90) * sc, d = 16 * sc;
        const inPark = x + w > park[0] && x < park[2] && y > park[1] - 20 && y - h < park[3];
        if (!inPark) {
          if (h01('tr', r, i) < 0.2) row.trees.push([x + w / 2, y - 14 * sc, 16 * sc]);
          else {
            row.blocks.push({ x, w, h, d, col: TUFF[(r + i) % TUFF.length] });
            const cw = Math.max(6, w / 6), rh = Math.max(6, h / 5);
            for (let q = 0; q < 4; q++) for (let c = 0; c < 5; c++) if (h01('w', r, i, q, c) > 0.25) row.wins.push([x + cw * 0.6 + c * cw, y - h + rh * 0.6 + q * rh, cw * 0.5, rh * 0.45]);
          }
        }
        x += w + (8 + h01('gap', r, i) * 16) * sc;
        i++;
      }
      CITY.push(row);
    }
    return CITY;
  }
  function drawCity(ctx) {
    city().forEach((row) => {
      const y = row.y;
      ctx.fillStyle = '#c9c2c8'; ctx.fillRect(-400, y + 2, 1880, 10 * row.sc);
      ctx.fillStyle = K.tree;
      ctx.beginPath();
      row.trees.forEach(([x, ty, r]) => { ctx.moveTo(x + r, ty); ctx.arc(x, ty, r, 0, TAU); });
      ctx.fill();
      row.blocks.forEach(({ x, w, h, d, col }) => {
        ctx.fillStyle = col; ctx.fillRect(x, y - h, w, h);
      });
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      row.blocks.forEach(({ x, w, h, d }) => { ctx.moveTo(x, y - h); ctx.lineTo(x + d * 0.6, y - h - d); ctx.lineTo(x + w + d * 0.6, y - h - d); ctx.lineTo(x + w, y - h); ctx.closePath(); });
      ctx.fill();
      ctx.fillStyle = 'rgba(120,70,70,0.25)';
      ctx.beginPath();
      row.blocks.forEach(({ x, w, h, d }) => { ctx.moveTo(x + w, y); ctx.lineTo(x + w, y - h); ctx.lineTo(x + w + d * 0.6, y - h - d); ctx.lineTo(x + w + d * 0.6, y - d); ctx.closePath(); });
      ctx.fill();
      ctx.fillStyle = 'rgba(80,90,150,0.45)';
      ctx.beginPath();
      row.wins.forEach(([x, wy, w, h]) => ctx.rect(x, wy, w, h));
      ctx.fill();
      ctx.strokeStyle = 'rgba(90,50,60,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath();
      row.blocks.forEach(({ x, w, h }) => ctx.rect(x, y - h, w, h));
      ctx.stroke();
    });
  }
  function drawL1(ctx, t, zoomInfo) {
    F.sky(ctx, '#7cc6ff', '#ffe6ea', { mid: '#cdeeff', midAt: 0.6, x: -400, y: -400, w: 1880, h: 1060 });
    F.clouds(ctx, { n: 3, seed: 2111, t, y: 120, h: 260, speed: 10, scale: 0.9 });
    F.ararat(ctx, 30, 700, 1000, 480, {});
    // haze band + plain
    ctx.fillStyle = '#e9d9d0'; ctx.fillRect(-400, 640, 1880, 90);
    ctx.fillStyle = '#d9e8c8'; ctx.fillRect(-400, 700, 1880, 1600);
    tvTower(ctx, 930, 760, 300);
    drawCity(ctx);
    // the Cascade and the park at the focus
    ctx.fillStyle = K.hill;
    ctx.beginPath(); ctx.ellipse(540, 1000, 200, 110, 0, Math.PI, TAU); ctx.fill();
    cascade(ctx, 540, 990, 200, 150, 1.5);
    ctx.fillStyle = K.grass;
    F.rrect(ctx, 420, 985, 250, 345, 40); ctx.fill();
    ctx.strokeStyle = '#4f8a3a'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = K.path; F.rrect(ctx, 425, 1205, 240, 60, 20); ctx.fill();
    [[440, 1010, 20], [480, 1020, 16], [650, 1015, 22], [610, 1005, 15], [445, 1300, 18], [650, 1300, 20], [520, 1310, 14]].forEach(([x, y, r]) => roundTree(ctx, x, y + r * 1.4, r, 0));
    // tiny Goofy + Grant where they are in the park (L0 mapped at 1/6)
    const m = (p) => [F1[0] + (p[0] - A[0]) / RATIO, F1[1] + (p[1] - A[1]) / RATIO];
    const gp = m([GOOFY.x, GOOFY.y]);
    ctx.save();
    ctx.translate(0, 0);
    CAST.goofy(ctx, { x: gp[0], y: gp[1], s: GOOFY.s / RATIO, pose: 'howl', face: 'cry', t });
    ctx.restore();
    // howl rings spreading over the city
    for (let i = 0; i < 3; i++) {
      const age = ((t * 0.9 + i / 3) % 1 + 1) % 1;
      F.shockRing(ctx, gp[0] + 15, gp[1] - 70, age, { r: 260, life: 1, color: '#ffffff', width: 6, squash: 0.6 });
    }
  }

  const LON0 = 20, LAT0 = 42, R = 480;
  const ARM = [44.5, 40.2], ESP = [-3.7, 40.4];
