      ctx.beginPath(); ctx.moveTo(hand[0] + 30, hand[1]); ctx.lineTo(tp[0], tp[1]); ctx.stroke();
      ctx.fillStyle = '#ff4d5e';
      ctx.beginPath(); ctx.arc(tp[0], tp[1], 13, 0, TAU); F.fo(ctx, '#ff4d5e', 4);
      ctx.restore();
      // shades glint
      const gl = (t % 1.25) / 1.25;
      if (gl < 0.3) F.sparkle(ctx, a.eyeL[0] - 10, a.eyeL[1] - 16, 30 * Math.sin((gl / 0.3) * Math.PI), { color: '#ffffff' });

      // INVESTORS label (over the pointer so it stays readable) + a tiny sweat drop
      if (t >= T_INV - 1e-6) {
        const ls = F.popIn(t, T_INV);
        ctx.save();
        ctx.translate(770, 1180);
        ctx.scale(ls, ls);
        F.rrect(ctx, -130, -30, 260, 60, 12); F.fo(ctx, '#2a0c14', 4, P.down);
        F.text(ctx, 'INVESTORS', 0, 2, { size: 38, fill: P.down, lw: 0 });
        ctx.restore();
        if (t > T_INV + 0.4) F.sweat(ctx, a.head[0] + 120, a.head[1] - 90 + Math.min(40, (t - T_INV - 0.4) * 30), 1.3);
      }

      // bubble
      F.bubble(ctx, 'BULLISH ON BURGERS.', 302, 900, {
        size: 54, maxW: 420, t, t0: T_BUBBLE, tail: [a.top[0] + 10, a.top[1] + 20],
      });
      ctx.restore(); // camera

      // 6. ATH flash (screen-fixed)
      if (ath && athAge < 3 * FR) F.flash(ctx, athAge < FR ? 0.8 : 0.35, '#eaffef');
    },
  });

  function drawArrow(ctx, F, x0, y0, x1, y1, a) {
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
    if (len < 20) return;
    const ang = Math.atan2(dy, dx);
    const hw = 34, head = 110, hh = 84;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(x0, y0);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(0, -hw); ctx.lineTo(len - head, -hw); ctx.lineTo(len - head, -hh); ctx.lineTo(len, 0);
    ctx.lineTo(len - head, hh); ctx.lineTo(len - head, hw); ctx.lineTo(0, hw); ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, len, 0);
    g.addColorStop(0, 'rgba(47,224,138,0.15)'); g.addColorStop(0.5, 'rgba(47,224,138,0.55)'); g.addColorStop(1, 'rgba(90,255,170,0.95)');
    F.fo(ctx, g, 5, '#0f5e3a');
    ctx.restore();
  }

  function drawCandle(ctx, F, i, grow, t) {
    const [o, cl, hi, lo] = CANDLES[i];
    const up = cl >= o;
    const x = CX0 + i * CDX;
    const P = F.pal;
    const c = lerp(o, cl, grow);
    const top = vy(Math.max(o, c)), bot = vy(Math.min(o, c));
    // wick
    ctx.save();
    ctx.strokeStyle = up ? P.up : P.down; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x, vy(lerp(o, hi, grow))); ctx.lineTo(x, vy(lerp(o, lo, grow))); ctx.stroke();
    ctx.restore();
    // body: stack of tiny burgers
    const spr = burgerSprite(F, !up);
    const bw = CW, bh = CW * (200 / 240);
    const step = bh * 0.62;
    const h = Math.max(0, bot - top);
    const n = Math.max(1, Math.round(h / step));
    const jig = i === N - 1 ? Math.sin(t * 30) * 2 : 0;
    for (let k = 0; k < n; k++) {
      const yy = bot - bh * 0.62 - k * (n > 1 ? (h - bh * 0.3) / (n - 0.6) : 0);
      const wob = ((i * 7 + k * 3) % 5 - 2) * 1.2;
      ctx.drawImage(spr, x - bw / 2 + wob + jig, yy - bh / 2 + 8, bw, bh);
    }
  }

  function drawFlame(ctx, x, y, t) {
    const f = Math.floor(t * 12);
    const fl = 1 + ((f * 7) % 5) * 0.06;
    ctx.save();
    ctx.translate(x, y);
    [[46, 150, '#ff7a1a'], [32, 110, '#ffcc33'], [16, 70, '#fff6d8']].forEach(([w, h, col]) => {
      ctx.beginPath();
      ctx.moveTo(-w, 0);
      ctx.quadraticCurveTo(-w * 0.8, h * 0.6 * fl, 0, h * fl);
      ctx.quadraticCurveTo(w * 0.8, h * 0.6 * fl, w, 0);
      ctx.closePath();
      ctx.fillStyle = col; ctx.fill();
    });
    ctx.restore();
  }
})();

</script>
<script>
// ---- src/scenes/15-investor-call.js
/*
 * Shot 15 'investor-call' : "An investor calls" (T 64.0 - 68.0, 4 s).
 * Close-up in a Spanish burger joint. Hayk's big face (chewing, cheeks stuffed like a hamster)
 * fills the upper frame; in the foreground his hand holds a buzzing phone (FILM.fx.phone) with
 * shake lines: "INVESTOR CALLING..." and a green and a red button. At 1.5 his thumb swipes the
 * red button: "DECLINED" stamp. At 2.0 a muffled bubble: "MMF... LATER. BURGER FIRST."
 * At 3.0 he takes another bite from the burger in his other hand: CHOMP, crumbs.
 *
 * Foreground hands are FILM.cast.hayk arms at a larger scale, clipped to the forearm and hand
 * (a close-up cheat: the main figure is drawn without its arms).
 *
 * Layers, back to front:
 *   1. restaurant wall (cached): menu board, neon sign, window, pendant lamps
 *   2. bokeh, buzz focus lines
 *   3. Hayk (head + torso only), hamster cheek puffs, sweat/sparkles
 *   4. table (cached) with tray, fries, drink
 *   5. phone + swiping hand, burger hand
 *   6. stamp, bubble, SFX, flashes
 */
(function () {
  'use strict';

  const ID = 'investor-call';
  const FR = 1 / 24;
  const TAU = Math.PI * 2;

  const T_SWIPE = 1.5; // T 65.5 decline swipe
  const T_BUBBLE = 2.0; // T 66.0
  const T_BITE = 3.0; // T 67.0

  // main figure
  const HX = 380, HS = 2.6, HY = 612 + 462 * HS; // head centre at (380, 612)
  // phone
  const PH = { x: 684, y: 1196, s: 1.58, rot: 0.1 };
  // helper arms
  const ARM_S = 3.0;

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const lerp2 = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];

  // phone-local point -> world
  function phoneW(lx, ly, jig) {
    const r = PH.rot + (jig ? jig[2] : 0);
    const x = lx * PH.s, y = ly * PH.s;
    return [PH.x + (jig ? jig[0] : 0) + x * Math.cos(r) - y * Math.sin(r), PH.y + (jig ? jig[1] : 0) + x * Math.sin(r) + y * Math.cos(r)];
  }
  // button centres in phone-local coords (origin = phone centre)
  const RED = [-50, 118], GREEN = [50, 118];

  // ---------------------------------------------------------------------------
  // cached backgrounds
  // ---------------------------------------------------------------------------
  function wall(F) {
    return FILM.lib.cached(ID + '-wall', () => {
      const c = FILM.makeCanvas(1080, 1920);
      const g = c.getContext('2d', { willReadFrequently: true });
      const P = F.pal;
      F.sky(g, '#ffd9b0', '#ffb98a');
      // tiled lower wall (azulejo pattern)
      g.fillStyle = '#f7efe0'; g.fillRect(0, 980, 1080, 440);
      for (let y = 990; y < 1420; y += 70) {
        for (let x = 0; x < 1080; x += 70) {
          g.fillStyle = ((x + y) / 70) % 2 ? '#dfe9f5' : '#f7efe0';
          g.fillRect(x + 2, y + 2, 66, 66);
          g.fillStyle = 'rgba(40,90,170,0.35)';
          g.beginPath(); g.moveTo(x + 35, y + 12); g.lineTo(x + 58, y + 35); g.lineTo(x + 35, y + 58); g.lineTo(x + 12, y + 35); g.closePath(); g.fill();
        }
      }
      g.fillStyle = '#d9653b'; g.fillRect(0, 966, 1080, 22);
      // window on the right with a soft street
      F.rrect(g, 700, 250, 420, 640, 30); F.fo(g, '#8fd0ff', 5, 'rgba(27,20,36,0.5)');
      const sg = g.createLinearGradient(0, 250, 0, 890);
      sg.addColorStop(0, '#6fc0ff'); sg.addColorStop(1, '#d6f0ff');
      g.fillStyle = sg; F.rrect(g, 712, 262, 396, 616, 24); g.fill();
      [[730, 520, 120, 360, '#fff0da'], [860, 460, 140, 420, '#f6dcb6'], [1000, 560, 120, 320, '#ffe7c7']].forEach(([x, y, w, h, col]) => {
        g.fillStyle = col; g.fillRect(x, y, w, h);
        g.fillStyle = '#d9653b'; g.beginPath(); g.moveTo(x - 10, y); g.lineTo(x + w / 2, y - 40); g.lineTo(x + w + 10, y); g.closePath(); g.fill();
        g.fillStyle = 'rgba(80,130,190,0.5)';
        for (let yy = y + 40; yy < y + h - 40; yy += 80) for (let xx = x + 18; xx < x + w - 30; xx += 44) g.fillRect(xx, yy, 24, 40);
      });
      g.fillStyle = 'rgba(255,255,255,0.35)';
      g.beginPath(); g.moveTo(740, 870); g.lineTo(860, 270); g.lineTo(920, 270); g.lineTo(800, 870); g.closePath(); g.fill();
      g.strokeStyle = '#fff6e3'; g.lineWidth = 16;
      g.beginPath(); g.moveTo(910, 256); g.lineTo(910, 884); g.stroke();
      // menu board on the left (soft, low contrast)
      F.rrect(g, -40, 200, 380, 520, 24); F.fo(g, '#3a2a3e', 5, 'rgba(27,20,36,0.6)');
      for (let i = 0; i < 4; i++) {
        const y = 290 + i * 110;
        g.save(); g.globalAlpha = 0.85;
        F.burger(g, 60, y, 0.34);
        g.restore();
        g.fillStyle = 'rgba(255,230,180,0.5)';
        g.fillRect(130, y - 16, 150, 12);
        g.fillStyle = 'rgba(255,210,90,0.6)';
        g.fillRect(130, y + 8, 70, 12);
      }
      // pendant lamps
      [[200, 0], [560, 0]].forEach(([x]) => {
        g.strokeStyle = '#3a2a3e'; g.lineWidth = 5;
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 120); g.stroke();
        const lg = g.createRadialGradient(x, 170, 10, x, 170, 260);
        lg.addColorStop(0, 'rgba(255,240,190,0.75)'); lg.addColorStop(1, 'rgba(255,240,190,0)');
        g.fillStyle = lg; g.beginPath(); g.arc(x, 170, 260, 0, TAU); g.fill();
        g.beginPath(); g.moveTo(x - 70, 170); g.quadraticCurveTo(x, 70, x + 70, 170); g.closePath();
        F.fo(g, '#e8413c', 5);
      });
      return c;
    });
  }

  function table(F) {
    return FILM.lib.cached(ID + '-table', () => {
      const c = FILM.makeCanvas(1080, 1920);
      const g = c.getContext('2d', { willReadFrequently: true });
      const P = F.pal;
      // table top (perspective)
      g.beginPath(); g.moveTo(-40, 1420); g.lineTo(1120, 1420); g.lineTo(1120, 1920); g.lineTo(-40, 1920); g.closePath();
      F.fo(g, '#c98a54', 5);
      g.fillStyle = '#b07440';
      for (let i = 0; i < 6; i++) { g.fillRect(-40, 1460 + i * 80, 1160, 6); }
      g.fillStyle = 'rgba(255,230,190,0.25)';
      g.beginPath(); g.ellipse(560, 1520, 460, 60, 0, 0, TAU); g.fill();
      // red tray at left with fries + drink
      g.save();
      g.translate(150, 1600);
      g.rotate(-0.08);
      F.rrect(g, -200, -40, 380, 250, 20); F.fo(g, '#e5323a', 5);
      F.rrect(g, -180, -24, 340, 218, 14); g.fillStyle = '#fff2d6'; g.fill();
      g.strokeStyle = 'rgba(229,50,58,0.5)'; g.lineWidth = 6;
      for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(-170 + i * 70, -20); g.lineTo(-130 + i * 70, 190); g.stroke(); }
      g.restore();
      F.fries(g, 70, 1640, 0.75, {});
      F.drink(g, 250, 1700, 0.62, {});
      // crumpled wrapper
      g.beginPath(); g.arc(-10, 1720, 40, 0, TAU); F.fo(g, '#ffe4b0', 4);
      return c;
    });
  }

  // ---------------------------------------------------------------------------
  // helper: a Hayk forearm + hand from the cast, clipped to a capsule
  // ---------------------------------------------------------------------------
  const ARM_POSES = {
    // [a0, a1] of the posed arm (right arm, unflipped), from cast.js humanPose
    give: [1.2, 0.25],
    point: [1.62, -0.1],
  };
  function armVecAngle(pose) {
    const [a0, a1] = ARM_POSES[pose];
    const x = 94 * Math.sin(a0) + 102 * Math.sin(a0 + a1), y = 94 * Math.cos(a0) + 102 * Math.cos(a0 + a1);
    return Math.atan2(y, x);
  }
  /**
   * castArm(ctx, o{ hand:[x,y], dir:[dx,dy] unit vector hand -> shoulder, pose, flip, s, t, front, width })
   * draws Hayk (cast) posed so the chosen arm runs along `dir` and its hand lands on `hand`, clipped
   * to a capsule around that forearm. `front` extends the capsule past the hand (for a finger).
   */
  function castArm(ctx, C, o) {
    const s = o.s;
    const want = Math.atan2(-o.dir[1], -o.dir[0]); // shoulder -> hand
    let base = armVecAngle(o.pose);
    if (o.flip) base = Math.PI - base;
    const tilt = want - base;
    const key = o.flip ? 'handL' : 'handR';
    const spec = { x: 0, y: 0, s, pose: o.pose, flip: !!o.flip, tilt, t: o.t, belly: 0.8, face: 'neutral' };
    const probe = C.hayk(ctx, Object.assign({}, spec, { alpha: 0 }));
    const hp = probe[key];
    spec.x = o.hand[0] - hp[0];
    spec.y = o.hand[1] - hp[1];
    const w = o.width || 86 * s / 3;
    const [dx, dy] = o.dir;
    const nx = -dy, ny = dx;
    const hx = o.hand[0] - dx * (o.front || 0), hy = o.hand[1] - dy * (o.front || 0);
    const L = 1400;
    ctx.save();
    ctx.beginPath();
    const ang = Math.atan2(ny, nx);
    ctx.moveTo(hx + nx * w, hy + ny * w);
    ctx.arc(hx, hy, w, ang, ang + Math.PI, false);
    ctx.lineTo(hx - nx * w + dx * L, hy - ny * w + dy * L);
    ctx.lineTo(hx + nx * w + dx * L, hy + ny * w + dy * L);
    ctx.closePath();
    ctx.clip();
    const a = C.hayk(ctx, spec);
    ctx.restore();
    return a[key];
  }

  // ---------------------------------------------------------------------------
  // phone screen
  // ---------------------------------------------------------------------------
  function screen(F, t) {
    return (g, w, h) => {
      const declined = t >= T_SWIPE - 1e-6;
      const P = F.pal;
      if (!declined) {
        const sg = g.createLinearGradient(0, 0, 0, h);
        sg.addColorStop(0, '#1d3a6e'); sg.addColorStop(1, '#0d1630');
        g.fillStyle = sg; g.fillRect(0, 0, w, h);
      } else {
        const sg = g.createLinearGradient(0, 0, 0, h);
        sg.addColorStop(0, '#6e1020'); sg.addColorStop(1, '#2a0610');
        g.fillStyle = sg; g.fillRect(0, 0, w, h);
      }
      // status bar
      g.fillStyle = 'rgba(255,255,255,0.7)';
      g.fillRect(16, 30, 30, 8); g.fillRect(w - 50, 30, 34, 10);
      // caller avatar: a suit with a money-bag head
      const ax = w / 2, ay = 118;
      if (!declined) {
        const pr = 60 + (t * 2 % 1) * 40;
        g.strokeStyle = `rgba(143,216,255,${1 - (t * 2 % 1)})`; g.lineWidth = 4;
        g.beginPath(); g.arc(ax, ay, pr, 0, TAU); g.stroke();
      }
      g.beginPath(); g.arc(ax, ay, 52, 0, TAU); F.fo(g, '#e9eef8', 4);
      g.save();
      g.beginPath(); g.arc(ax, ay, 50, 0, TAU); g.clip();
      g.fillStyle = '#2a2f45'; g.beginPath(); g.moveTo(ax - 44, ay + 60); g.lineTo(ax - 30, ay + 22); g.lineTo(ax + 30, ay + 22); g.lineTo(ax + 44, ay + 60); g.closePath(); g.fill();
      g.fillStyle = '#ffffff'; g.beginPath(); g.moveTo(ax - 10, ay + 22); g.lineTo(ax, ay + 44); g.lineTo(ax + 10, ay + 22); g.closePath(); g.fill();
      g.fillStyle = '#c9a15a'; g.beginPath(); g.arc(ax, ay - 6, 22, 0, TAU); g.fill();
      g.fillStyle = '#2a2f45'; g.fillRect(ax - 7, ay - 34, 14, 10);
      F.text(g, '$', ax, ay - 4, { size: 26, fill: '#2a2f45', lw: 0 });
      g.restore();
      if (!declined) {
        F.text(g, 'INVESTOR', w / 2, 212, { size: 32, fill: '#ffffff', lw: 0 });
        F.text(g, 'CALLING...', w / 2, 250, { size: 30, fill: '#8fd8ff', lw: 0 });
        // buttons; the red one slides with the thumb
        const slide = clamp((t - (T_SWIPE - 0.1)) / 0.1);
        const bp = 1 + 0.08 * Math.sin(t * 16);
        const gx = GREEN[0] + 106, gy = GREEN[1] + 222;
        g.beginPath(); g.arc(gx, gy, 32 * bp, 0, TAU); F.fo(g, P.up, 4);
        phoneIcon(g, gx, gy, 0, '#ffffff');
        const rx = RED[0] + 106 - slide * 40, ry = RED[1] + 222;
        g.beginPath(); g.arc(rx, ry, 32, 0, TAU); F.fo(g, P.down, 4);
        phoneIcon(g, rx, ry, 2.36, '#ffffff');
        F.text(g, 'DECLINE', RED[0] + 106, ry + 46, { size: 14, fill: '#ffb3bb', lw: 0 });
        F.text(g, 'ACCEPT', gx, gy + 46, { size: 14, fill: '#b3ffd6', lw: 0 });
      } else {
        F.text(g, 'CALL', w / 2, 262, { size: 30, fill: '#ffd0d6', lw: 0 });
        F.text(g, 'ENDED', w / 2, 298, { size: 30, fill: '#ffd0d6', lw: 0 });
        g.beginPath(); g.arc(w / 2, RED[1] + 222, 32, 0, TAU); F.fo(g, '#5a1420', 4);
        phoneIcon(g, w / 2, RED[1] + 222, 2.36, '#ff8a96');
      }
    };
  }
  function phoneIcon(g, x, y, rot, col) {
    g.save();
    g.translate(x, y); g.rotate(rot);
    g.strokeStyle = col; g.lineWidth = 9; g.lineCap = 'round';
    g.beginPath(); g.arc(0, 0, 13, Math.PI * 0.7, Math.PI * 1.3); g.stroke();
    g.restore();
  }

  // ---------------------------------------------------------------------------
  // hamster cheeks (a gag overlay on the cast head: puffed cheeks bulge past the jaw)
  // ---------------------------------------------------------------------------
  function cheeks(ctx, F, a, t, puff) {
    const P = F.pal;
    const k = 1.15 * HS; // head scale
    const chew = Math.abs(Math.sin(t * 14));
    const r = (1 + 0.06 * chew) * puff;
    ctx.save();
    ctx.translate(a.head[0], a.head[1]);
    ctx.scale(k, k);
    [-1, 1].forEach((sd) => {
      const cx = sd * 58, cy = 34;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 27 * r, 23 * r, sd * 0.3, 0, TAU);
      ctx.fillStyle = sd > 0 ? '#f0bb93' : P.skin;
      ctx.fill();
      ctx.strokeStyle = P.line; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 27 * r, 23 * r, sd * 0.3, sd > 0 ? -1.3 : Math.PI - 1.5, sd > 0 ? 1.5 : Math.PI + 1.3);
      ctx.stroke();
      // blush + shine
      ctx.fillStyle = 'rgba(255,120,120,0.55)';
      ctx.beginPath(); ctx.ellipse(cx - sd * 4, cy + 6, 16, 8, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.ellipse(cx + sd * 8, cy - 10, 6, 4, 0, 0, TAU); ctx.fill();
    });
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // draw
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const F = FILM.fx, C = FILM.cast, P = F.pal, L = info.lib;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const declined = t >= T_SWIPE - 1e-6;
      const buzzing = !declined;
      const fi = Math.floor(t * 24 + 1e-6);

      // camera: slow push towards the phone, shake on the swipe and the bite
      const push = 1 + 0.03 * L.ease.inOutCubic(t / info.dur);
      const sh = F.shakeMany(t, [[T_SWIPE, 0.35, 22], [T_BITE, 0.3, 14]], 1501);
      ctx.save();
      ctx.translate(560 + sh[0], 1000 + sh[1]);
      ctx.scale(push, push);
      ctx.translate(-560, -1000);

      // 1. wall
      ctx.save(); ctx.imageSmoothingQuality = 'low'; ctx.drawImage(wall(F), 0, 0); ctx.restore(); // cheap resample under the camera push
      // 2. bokeh + buzz focus lines
      F.bokeh(ctx, { n: 16, seed: 1502, t, colors: ['#fff1b8', '#ffd1a8', '#ffffff'], alpha: 0.35, rMin: 20, rMax: 70, y: 0, h: 1000 });
      if (buzzing) {
        F.focusLines(ctx, PH.x, PH.y, { inner: 420, count: 70, color: '#8a3a2a', alpha: 0.22, seed: 1503, width: 12 });
      } else if (t < T_SWIPE + 0.5) {
        F.focusLines(ctx, PH.x, PH.y, { inner: 360, count: 90, color: '#ff3b3b', alpha: 0.45 * (1 - (t - T_SWIPE) / 0.5), seed: 1504, width: 18 });
      }

      // 3. Hayk: head + torso only (arms are clipped away: close-up cheat)
      const bob = Math.sin(tw * Math.PI * 4) * 4;
      const biteLean = t >= T_BITE - 0.2 && t < T_BITE + 0.4 ? Math.sin(clamp((t - T_BITE + 0.2) / 0.6) * Math.PI) * 18 : 0;
      const hy = HY + bob + biteLean;
      const s = HS;
      const shW = 66 + 8;
      const shoulderY = hy - 378 * s;
      const hipY = hy - 206 * s;
      ctx.save();
      ctx.beginPath();
      ctx.rect(HX - 140 * s, 0, 280 * s, shoulderY - 4 * s);
      ctx.rect(HX - (shW + 8) * s, shoulderY - 5 * s, (shW + 8) * 2 * s, hipY - shoulderY + 60 * s);
      ctx.clip();
      const a = C.hayk(ctx, { x: HX, y: hy, s, t, pose: 'float', face: 'chewing', belly: 1, headTilt: 0.1 + Math.sin(tw * 3) * 0.03 });
      ctx.restore();
      const puff = t >= T_BITE ? 1.12 : 1;
      cheeks(ctx, F, a, t, puff);
      // chewing lines at the jaw
      if (Math.floor(t * 6) % 2 === 0) {
        ctx.save();
        ctx.strokeStyle = P.line; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(a.head[0] - 270, a.head[1] + 40); ctx.lineTo(a.head[0] - 300, a.head[1] + 30);
        ctx.moveTo(a.head[0] - 262, a.head[1] + 80); ctx.lineTo(a.head[0] - 296, a.head[1] + 86);
        ctx.stroke();
        ctx.restore();
      }
      // a sweat drop appears while the phone buzzes
      if (buzzing && t > 0.5) F.sweat(ctx, a.head[0] + 190, a.head[1] - 150 + Math.min(30, (t - 0.5) * 40), 1.6);
      // content sparkles once the call is gone
      if (t > T_SWIPE + 0.3) F.sparkles(ctx, { x: 120, y: 280, w: 560, h: 500, n: 6, seed: 1505, t, size: 30 });

      // 4. table
      ctx.save(); ctx.imageSmoothingQuality = 'low'; ctx.drawImage(table(F), 0, 0); ctx.restore(); // cheap resample under the camera push

      // 5a. burger hand (screen-left, from the bottom-left), bite at T_BITE
      const restB = [214, 1400];
      const mouthB = [a.mouth[0] - 150, a.mouth[1] + 130];
      let bu = 0;
      if (t >= 2.35 && t < T_BITE) bu = L.ease.inOutCubic((t - 2.35) / (T_BITE - 2.35));
      else if (t >= T_BITE && t < T_BITE + 0.25) bu = 1;
      else if (t >= T_BITE + 0.25) bu = 1 - 0.55 * L.ease.outCubic((t - T_BITE - 0.25) / 0.5);
      const bHand = lerp2(restB, mouthB, bu);
      bHand[1] += Math.sin(tw * Math.PI * 2) * 4;
      const bDir = [-0.6, 0.8];
      castArm(ctx, C, { hand: bHand, dir: bDir, pose: 'give', flip: false, s: ARM_S, t, front: 30 });
      const bite = t >= T_BITE - 1e-6 ? 0.42 : 0.2;
      F.burger(ctx, bHand[0] + 34, bHand[1] - 120, 1.35, { bite, rot: -0.12 + bu * 0.05 });

      // 5b. phone (buzzing) + swiping thumb hand from the bottom-right
      const jig = buzzing ? [(F.h01(ID, 'jx', fi) - 0.5) * 16, (F.h01(ID, 'jy', fi) - 0.5) * 10, (F.h01(ID, 'jr', fi) - 0.5) * 0.05] : [0, 0, 0];
      // shake lines around the phone
      if (buzzing) {
        ctx.save();
        ctx.strokeStyle = P.line; ctx.lineWidth = 8; ctx.lineCap = 'round';
        const on = fi % 4 < 2;
        [[1, 0]].forEach(([sd]) => {
          for (let k = 0; k < 3; k++) {
            const r = 60 + k * 34 + (on ? 8 : 0);
            const cx = PH.x + sd * 120 * PH.s, cy = PH.y - 150 * PH.s;
            ctx.beginPath();
            ctx.arc(cx, cy, r, sd > 0 ? -0.6 : Math.PI - 0.6, sd > 0 ? 0.6 : Math.PI + 0.6);
            ctx.stroke();
          }
        });
        ctx.restore();
      }
      F.phone(ctx, PH.x + jig[0], PH.y + jig[1], PH.s, { rot: PH.rot + jig[2], screen: screen(F, t), color: '#26212e' });

      // thumb path (fingertip), in world coords
      const rb = phoneW(RED[0], RED[1], jig);
      const d = [0.552, 0.834]; // hand -> shoulder
      const reach = 44 * ARM_S; // palm centre -> fingertip
      let tip;
      if (t < 1.15) tip = [rb[0] + 40 + Math.sin(tw * 5) * 6, rb[1] + 150];
      else if (t < T_SWIPE - 0.1) tip = lerp2([rb[0] + 40, rb[1] + 150], [rb[0] + 6, rb[1] + 2], L.ease.inOutCubic((t - 1.15) / (T_SWIPE - 0.1 - 1.15)));
      else if (t < T_SWIPE + 0.12) tip = lerp2([rb[0] + 6, rb[1] + 2], [rb[0] - 170, rb[1] - 26], L.ease.outCubic((t - (T_SWIPE - 0.1)) / 0.22));
      else tip = lerp2([rb[0] - 170, rb[1] - 26], [rb[0] + 60, rb[1] + 150], L.ease.inOutCubic(clamp((t - 2.3) / 0.6)));
      const palm = [tip[0] + d[0] * reach, tip[1] + d[1] * reach];
      // swipe smear
      if (t >= T_SWIPE - 0.1 && t < T_SWIPE + 0.3) {
        const u = 1 - (t - (T_SWIPE - 0.1)) / 0.4;
        F.speedLines(ctx, { angle: Math.PI + 0.12, count: 12, color: '#ffffff', alpha: 0.9 * u, seed: 1506, t, speed: 2600, len: 260, width: 12, x: rb[0] - 260, y: rb[1] - 110, w: 420, h: 200 });
      }
      castArm(ctx, C, { hand: palm, dir: d, pose: 'point', flip: true, s: ARM_S, t, front: 170 });

      // 6. DECLINED stamp on the phone
      if (declined) {
        F.stamp(ctx, 'DECLINED', PH.x - 10, PH.y - 40, t + FR, T_SWIPE, { size: 88, color: '#ff2f45', rot: -0.28 });
        F.shockRing(ctx, rb[0], rb[1], t - T_SWIPE + FR, { r: 320, color: '#ff4d5e', life: 0.4, width: 20 });
      }
      ctx.restore(); // camera

      // screen-fixed text
      if (buzzing) {
        for (let b = 0; b < 3; b++) F.sfx(ctx, 'BZZT!', 870, 700 + (b % 2) * 30, t, b * 0.5, { size: 78, fill: '#ffffff', shadowColor: '#3a8dde', rot: 0.2 + (b % 2) * -0.3, life: 0.42 });
      }
      if (t >= T_SWIPE - 1e-6) F.sfx(ctx, 'SWIPE!', 290, 990, t, T_SWIPE, { size: 96, fill: '#ff3b3b', shadowColor: '#5a0a14', rot: -0.18, life: 0.75 });
      F.bubble(ctx, 'MMF... LATER. BURGER FIRST.', 776, 330, {
        size: 50, maxW: 420, t, t0: T_BUBBLE, tail: [a.mouth[0] + 205, a.mouth[1] - 70], shake: 6,
      });
      if (t >= T_BITE - 1e-6) {
        F.crumbs(ctx, a.mouth[0] - 40, a.mouth[1] + 20, t - T_BITE + FR, { n: 16, seed: 1507, spread: 460, life: 0.9 });
        F.sfx(ctx, 'CHOMP!', 250, 470, t, T_BITE, { size: 110, fill: P.sfxYellow, rot: -0.2, life: 0.9 });
      }
      // impact flash on the swipe (2 frames)
      if (t >= T_SWIPE - 1e-6 && t < T_SWIPE + FR * 1.5) F.flash(ctx, 0.5, '#ffffff');
    },
  });
})();

</script>
<script>
// ---- src/scenes/16-meanwhile.js
/*
 * 16 'meanwhile' : "Meanwhile in Yerevan" eyecatch card. Global T 68.0 - 71.0 (3 s).
 *
 * Layers, back to front:
 *   1. diagonal split: deep-blue night half (top-left) with halftone + twinkles,
 *      warm scrolling stripes (bottom-right), white/ink seam band
 *   2. Ararat silhouette across the bottom, the pink-stone Cascade stairs in front of it, tree tufts
 *   3. slam focus burst behind the titles (0.5 s and 1.5 s)
 *   4. "MEANWHILE..." slams in at 0.5 s, "IN YEREVAN" at 1.5 s (Armenian tricolour underline)
 *   5. Goofy head badge with an anger vein pops in the upper-right corner at 2.0 s
 *   6. katakana decoration, white flashes on each slam
 */
(function () {
  'use strict';
  const ID = 'meanwhile';
  const FR = 1 / 24;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;

  const T_MEAN = 0.5; // T 68.5
  const T_YER = 1.5; // T 69.5
  const T_GOOFY = 2.0; // T 70.0

  // diagonal seam: from (0, SEAM_L) to (1080, SEAM_R)
  const SEAM_L = 1600, SEAM_R = 150;
  const seamY = (x) => lerp(SEAM_L, SEAM_R, x / 1080);

  // slam scale: 2.6 -> 0.9 -> 1.04 -> 1 over drawings, visible ON the beat frame
  function slam(t, t0) {
    if (t < t0 - 1e-6) return 0;
    const k = Math.floor((t - t0) * 24 + 1e-6);
    return [2.4, 1.5, 0.92, 1.06, 1.02, 1][Math.min(5, k)];
  }

  function drawHalves(ctx, t, F) {
    const W = 1080, H = 1920;
    // warm stripes (full frame first)
    ctx.save();
    ctx.fillStyle = '#ffb347';
    ctx.fillRect(-60, -60, W + 120, H + 120);
    ctx.fillStyle = '#ff8a3d';
    const off = (t * 140) % 120;
    ctx.beginPath();
    for (let i = -24; i < 30; i++) {
      const x0 = i * 120 + off;
      ctx.moveTo(x0, -60);
      ctx.lineTo(x0 + 60, -60);
      ctx.lineTo(x0 + 60 - 1400, H + 60);
      ctx.lineTo(x0 - 1400, H + 60);
      ctx.closePath();
    }
    ctx.fill();
    // soft warm glow toward the corner
    const g = ctx.createRadialGradient(W, H * 0.62, 50, W, H * 0.62, 900);
    g.addColorStop(0, 'rgba(255,240,170,0.55)');
    g.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // deep blue half (top-left of the seam)
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-60, -60);
    ctx.lineTo(W + 60, -60);
    ctx.lineTo(W + 60, seamY(W + 60));
    ctx.lineTo(-60, seamY(-60));
    ctx.closePath();
    ctx.clip();
    F.sky(ctx, '#0d1747', '#2a48b8', { x: -60, y: -60, w: W + 120, h: H * 0.85, mid: '#1a2c7c', midAt: 0.5 });
    F.halftone(ctx, { x: 0, y: 700, w: W, h: 900, color: 'rgba(120,160,255,0.35)', step: 30, dir: 'down' });
    F.stars(ctx, { n: 60, seed: 161, x: 20, y: 90, w: 1040, h: 900 });
    F.sparkles(ctx, { x: 60, y: 120, w: 900, h: 700, n: 8, seed: 162, t, size: 30 });
    ctx.restore();

    // seam band: ink - white - ink
    ctx.save();
    ctx.lineCap = 'butt';
    const seamLine = (w, c, dy) => {
      ctx.beginPath();
      ctx.moveTo(-60, seamY(-60) + dy);
      ctx.lineTo(W + 60, seamY(W + 60) + dy);
      ctx.strokeStyle = c;
      ctx.lineWidth = w;
      ctx.stroke();
    };
    seamLine(46, F.pal.line, 0);
    seamLine(26, '#ffffff', 0);
    seamLine(6, '#ffd84a', 0);
    ctx.restore();
  }

  function drawCascade(ctx, t, F) {
    const P = F.pal;
    const W = 1080;
    // Ararat: big pale silhouette behind everything low
    F.ararat(ctx, -120, 1560, 1320, 560, { color: '#5d6bb0', shade: '#4a5796', snow: '#eef2ff' });

    // the Cascade: stepped pink-stone terraces climbing a green hill to an obelisk
    const cx = 560;
    ctx.fillStyle = '#4f8f52';
    ctx.beginPath();
    ctx.moveTo(-60, 1500);
    ctx.bezierCurveTo(200, 1260, 380, 1150, cx, 1150);
    ctx.bezierCurveTo(760, 1150, 900, 1250, W + 60, 1440);
    ctx.lineTo(W + 60, 1700); ctx.lineTo(-60, 1700); ctx.closePath();
    F.fo(ctx, '#4f8f52', 4);
    ctx.fillStyle = '#6aa85e';
    for (let k = 0; k < 9; k++) {
      const bx2 = 40 + k * 125, by2 = 1440 - Math.sin((k / 8) * Math.PI) * 230;
      ctx.beginPath(); ctx.arc(bx2, by2, 34 + (k % 3) * 10, 0, Math.PI * 2); ctx.fill();
    }
    const tiers = [
      { y: 1560, w: 900, h: 90 },
      { y: 1470, w: 760, h: 86 },
      { y: 1384, w: 630, h: 80 },
      { y: 1304, w: 510, h: 74 },
      { y: 1230, w: 400, h: 68 },
    ];
    // obelisk / monument on top
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx - 34, 1164);
    ctx.lineTo(cx - 14, 900);
    ctx.lineTo(cx, 870);
    ctx.lineTo(cx + 14, 900);
    ctx.lineTo(cx + 34, 1164);
    ctx.closePath();
    F.fo(ctx, '#f3d2c0', 5);
    ctx.fillStyle = '#d99b85';
    ctx.beginPath(); ctx.moveTo(cx, 872); ctx.lineTo(cx + 14, 900); ctx.lineTo(cx + 34, 1164); ctx.lineTo(cx + 4, 1164); ctx.closePath(); ctx.fill();
    ctx.restore();
    tiers.slice().reverse().forEach((tr, ri) => {
      const i = tiers.length - 1 - ri;
      const x0 = cx - tr.w / 2;
      // block
      ctx.beginPath();
      ctx.rect(x0, tr.y - tr.h, tr.w, tr.h);
      F.fo(ctx, '#e8b8a0', 5);
      // top ledge
      ctx.fillStyle = '#f6d4c2';
      ctx.fillRect(x0 + 3, tr.y - tr.h + 3, tr.w - 6, 12);
      // arches along the face
      const n = Math.max(3, Math.floor(tr.w / 70));
      ctx.fillStyle = '#b97763';
      for (let k = 0; k < n; k++) {
        const ax = x0 + (k + 0.5) * (tr.w / n);
        if (Math.abs(ax - cx) < 60) continue;
        const aw = 18, ah = tr.h * 0.5;
        ctx.beginPath();
        ctx.moveTo(ax - aw, tr.y - 8);
        ctx.lineTo(ax - aw, tr.y - ah);
        ctx.arc(ax, tr.y - ah, aw, Math.PI, 0);
        ctx.lineTo(ax + aw, tr.y - 8);
        ctx.closePath();
        ctx.fill();
      }
      // flower beds on the ledge
      ctx.fillStyle = i % 2 ? '#ff7fa8' : '#ffd24a';
      for (let k = 0; k < 6; k++) {
        const fx = x0 + 20 + k * ((tr.w - 40) / 5);
        if (Math.abs(fx - cx) < 60) continue;
        ctx.beginPath(); ctx.arc(fx, tr.y - tr.h + 2, 7, 0, Math.PI * 2); ctx.fill();
      }
      // central staircase + water
      ctx.beginPath();
      ctx.rect(cx - 44, tr.y - tr.h, 88, tr.h);
      F.fo(ctx, '#f7dccd', 4);
      ctx.strokeStyle = '#c98f7a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let s = 1; s < 6; s++) {
        const sy = tr.y - tr.h + (tr.h / 6) * s;
        ctx.moveTo(cx - 42, sy); ctx.lineTo(cx + 42, sy);
      }
      ctx.stroke();
      // fountain spark on each tier
      const ph = (t * 2 + i * 0.3) % 1;
      ctx.fillStyle = 'rgba(190,235,255,0.9)';
      ctx.beginPath();
      ctx.ellipse(cx - 70, tr.y - tr.h - 6 - ph * 10, 10, 6 + ph * 6, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 70, tr.y - tr.h - 6 - ((ph + 0.5) % 1) * 10, 10, 6 + ((ph + 0.5) % 1) * 6, 0, 0, Math.PI * 2);
      ctx.fill();
    });
    // flanking round trees (flat, soft)
    const tree = (x, y, r, c, c2) => {
      ctx.fillStyle = P.trunk;
      ctx.fillRect(x - 8, y - r * 0.2, 16, r * 0.9);
      ctx.beginPath();
      ctx.arc(x, y - r * 0.6, r, 0, Math.PI * 2);
      F.fo(ctx, c, 4);
      ctx.fillStyle = c2;
      ctx.beginPath(); ctx.arc(x + r * 0.3, y - r * 0.4, r * 0.62, 0, Math.PI * 2); ctx.fill();
    };
    tree(70, 1620, 120, P.tree, P.treeShade);
    tree(200, 1660, 90, '#63b05a', P.tree);
    tree(W - 60, 1610, 130, P.tree, P.treeShade);
    tree(W - 210, 1670, 92, '#63b05a', P.tree);
    // ground strip at the very bottom
    ctx.fillStyle = P.grass;
    ctx.fillRect(-60, 1640, W + 120, 400);
    ctx.fillStyle = P.grassShade;
    ctx.fillRect(-60, 1640, W + 120, 14);
    ctx.fillStyle = '#f1d9c6';
    ctx.beginPath();
    ctx.moveTo(cx - 60, 1640); ctx.lineTo(cx + 60, 1640); ctx.lineTo(cx + 180, 1920); ctx.lineTo(cx - 180, 1920); ctx.closePath();
    F.fo(ctx, '#f1d9c6', 4);
  }

  function goofyBadge(ctx, t, F, C) {
    const sc = F.popIn(t, T_GOOFY);
    if (sc <= 0) return;
    const bx = 790, by = 390, R = 165;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(0.12 + Math.sin(t * 9) * 0.03);
    ctx.scale(sc, sc);
    // spiky red backing
    F.burst(ctx, 0, 0, R * 1.32, R * 1.08, 16, '#ff3b3b', { lw: 6 });
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    F.fo(ctx, '#fff6e3', 7);
    // clip the dog so only the head shows inside the circle
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R - 4, 0, Math.PI * 2);
    ctx.clip();
    // speed lines inside
    F.focusLines(ctx, 0, 0, { inner: 90, count: 40, color: 'rgba(255,90,60,0.5)', seed: 163, width: 10 });
    // goofy sit pose: head centre sits at local (40, -190) * s
    const s = 1.55;
    C.goofy(ctx, { x: -40 * s - 10, y: 190 * s + 10, s, pose: 'sit', face: 'angry', t, look: [0.4, 0] });
    ctx.restore();
    // vein on the badge edge
    const vp = 1 + 0.18 * F.beatPulse(t, 0.25, 0.08);
    F.vein(ctx, 92, -92, 1.6 * vp);
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const F = FILM.fx, C = FILM.cast, P = F.pal;
      const W = 1080;

      // camera shake on slams
      const [sx, sy] = F.shakeMany(t, [[T_MEAN, 0.3, 26], [T_YER, 0.3, 20], [T_GOOFY, 0.2, 10]], 1601);
      // slow push-in over the whole card
      const zoom = 1 + 0.035 * (t / info.dur);
      ctx.save();
      ctx.translate(540 + sx, 960 + sy);
      ctx.scale(zoom, zoom);
      ctx.translate(-540, -960);

      // 1. halves
      drawHalves(ctx, t, F);
      // 2. Ararat + Cascade
      drawCascade(ctx, t, F);

      // katakana decoration on the blue side (vertical)
      ctx.save();
      const kata = ['イ', 'ェ', 'レ', 'バ', 'ン'];
      kata.forEach((k, i) => {
        F.text(ctx, k, 96, 300 + i * 78, { size: 62, fill: 'rgba(255,255,255,0.85)', lw: 0, font: 'jp' });
      });
      ctx.restore();

      // 3. slam bursts behind the titles
      const burstAge = t >= T_YER ? t - T_YER : t - T_MEAN;
      if (t >= T_MEAN) {
        const fade = clamp(1 - burstAge / 0.6);
        if (fade > 0) {
          F.focusLines(ctx, 540, 820, { inner: 330, count: 90, color: '#ffffff', alpha: 0.85 * fade, seed: 164, width: 18 });
        }
        F.shockRing(ctx, 540, 760, t - T_MEAN, { r: 700, life: 0.4, width: 30 });
        F.shockRing(ctx, 540, 940, t - T_YER, { r: 600, life: 0.4, width: 26, color: '#ffe14a' });
      }
      ctx.restore(); // camera

      // 4. titles (screen fixed, shaken)
      ctx.save();
      ctx.translate(sx * 0.6, sy * 0.6);
      const s1 = slam(t, T_MEAN);
      if (s1 > 0) {
        const bob = Math.sin(Math.floor(t * 12) * 0.9) * 2;
        F.text(ctx, 'MEANWHILE...', 540, 760 + bob, {
          size: 124, fill: '#ffffff', stroke: P.line, lw: 22, rot: -0.1, scale: s1, skew: -0.14,
          shadow: 14, shadowColor: '#e5323a',
        });
        if (t - T_MEAN < 0.35) F.text(ctx, 'ドン', 330, 600, { size: 90, fill: '#ffe14a', stroke: P.line, lw: 14, rot: -0.3, font: 'jp', scale: F.popIn(t, T_MEAN) });
      }
      const s2 = slam(t, T_YER);
      if (s2 > 0) {
        ctx.save();
        ctx.translate(540, 950);
        ctx.rotate(-0.1);
        ctx.scale(s2, s2);
        // Armenian tricolour underline bar
        const bw = 640;
        [['#d90012', -22], ['#0033a0', 0], ['#f2a800', 22]].forEach(([c, dy]) => {
          ctx.fillStyle = c;
          ctx.fillRect(-bw / 2, 66 + dy, bw, 22);
        });
        ctx.strokeStyle = P.line;
        ctx.lineWidth = 6;
        ctx.strokeRect(-bw / 2, 44, bw, 66);
        F.text(ctx, 'IN YEREVAN', 0, 0, { size: 96, fill: '#ffe14a', stroke: P.line, lw: 18, skew: -0.14, shadow: 10, shadowColor: '#b3122b' });
        ctx.restore();
        if (t - T_YER < 0.35) F.text(ctx, 'ドン', 880, 1090, { size: 80, fill: '#ffffff', stroke: P.line, lw: 12, rot: 0.25, font: 'jp', scale: F.popIn(t, T_YER) });
      }
      ctx.restore();

      // 5. Goofy badge
      goofyBadge(ctx, t, F, C);
      if (t >= T_GOOFY) {
        F.sfx(ctx, 'GRRR', 640, 600, t, T_GOOFY + 0.1, { size: 70, rot: 0.15, fill: '#ff5a4a', shadowColor: '#3b1d6e' });
      }

      // 6. white flash frames on the slams
      const fl = (a) => (t >= a && t < a + 3 * FR ? 0.7 - (t - a) * 8 : 0);
      F.flash(ctx, Math.max(fl(T_MEAN), fl(T_YER) * 0.8));
      F.vignette(ctx, 0.25, '10,10,40');
    },
  });
})();

</script>
<script>
// ---- src/scenes/17-grant-walk.js
/*
 * 17 'grant-walk' : Grant walks Goofy through a Yerevan park. Global T 71.0 - 75.0 (4 s).
 *
 * The camera tracks the pair left to right; every layer scrolls at its own parallax factor.
 * Layers, back to front:
 *   1. pastel morning sky, sun glow, clouds                     (factor 0.03)
 *   2. Ararat, hazy lavender in the far distance               (factor 0.05)
 *   3. the Cascade: pink-stone terraces up the hill + obelisk  (factor 0.14)
 *   4. pink tuff city blocks flanking it                        (factor 0.20)
 *   5. round tree line + lamp posts                             (factor 0.45)
 *   6. lawn with mowing stripes, flower beds, benches           (factor 0.75)
 *   7. paved path (tiles) the characters walk on                (factor 1.00)
 *   8. Grant (walk, calm, whistling) + leash + Goofy (walk) trotting ahead, pigeons
 *   9. foreground bushes and flowers                            (factor 1.35)
 *  10. screen overlays: light rays, caption "DAY 1 OF DOG SITTING" (0.5 s), bubble "SEE? PEACEFUL." (2.0 s)
 */
(function () {
  'use strict';
  const ID = 'grant-walk';
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const H01 = (...k) => FILM.fx.h01(ID, ...k);

  const T_CAPTION = 0.5; // T 71.5
  const T_BUBBLE = 2.0; // T 73.0
  const CAM_SPEED = 170; // px/s of path scroll
  const GROUND = 1690; // feet line on the path

  // ---------------------------------------------------------------------------
  // Park background (shared layout with 18-goofy-senses; camX = path scroll in px)
  // ---------------------------------------------------------------------------
  const PINK = '#e8b8a0', PINK_HI = '#f6d6c6', PINK_SH = '#c9917b', PINK_DK = '#a8705e';

  function wrapX(x, period) { return ((x % period) + period) % period; }

  function skyLayer(ctx, F, t, camX) {
    F.sky(ctx, '#8fcfff', '#ffe4dc', { h: 1300, mid: '#cdeeff', midAt: 0.55 });
    // morning sun glow top-left
    const g = ctx.createRadialGradient(170, 330, 20, 170, 330, 620);
    g.addColorStop(0, 'rgba(255,250,215,0.95)');
    g.addColorStop(0.25, 'rgba(255,236,190,0.55)');
    g.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1080, 1300);
    ctx.fillStyle = '#fffbe6';
    ctx.beginPath(); ctx.arc(170, 330, 62, 0, TAU); ctx.fill();
    ctx.save();
    ctx.translate(-camX * 0.03, 0);
    F.clouds(ctx, { n: 5, seed: 1701, t, y: 180, h: 420, speed: 10, scale: 0.8, shade: 'rgba(255,200,210,0.45)' });
    ctx.restore();
  }

  function araratLayer(ctx, F, camX) {
    const x = -170 - camX * 0.05;
    F.ararat(ctx, x, 1060, 940, 360, { color: '#b3b8e6', shade: '#a2a8da', snow: '#ffffff' });
    // haze band at its foot
    const g = ctx.createLinearGradient(0, 940, 0, 1070);
    g.addColorStop(0, 'rgba(255,228,220,0)');
    g.addColorStop(1, 'rgba(255,228,220,0.8)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 940, 1080, 130);
  }

  function cascadeLayer(ctx, F, t, camX) {
    const cx = 660 - camX * 0.14;
    ctx.save();
    ctx.lineJoin = 'round';
    // green hillside the stairs climb
    ctx.beginPath();
    ctx.moveTo(cx - 760, 1180);
    ctx.bezierCurveTo(cx - 420, 960, cx - 220, 830, cx, 815);
    ctx.bezierCurveTo(cx + 240, 830, cx + 440, 960, cx + 780, 1180);
    ctx.closePath();
    ctx.fillStyle = '#86bf78';
    ctx.fill();
    ctx.strokeStyle = 'rgba(27,20,36,0.45)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#76b06a';
    for (let k = 0; k < 11; k++) {
      const u = k / 10;
      const bx = cx - 640 + u * 1280, by = 1150 - Math.sin(u * Math.PI) * 270;
      ctx.beginPath(); ctx.arc(bx, by, 30 + (k % 3) * 10, 0, TAU); ctx.fill();
    }
    // obelisk monument at the top
    ctx.beginPath();
    ctx.moveTo(cx - 20, 880); ctx.lineTo(cx - 7, 700); ctx.lineTo(cx, 682); ctx.lineTo(cx + 7, 700); ctx.lineTo(cx + 20, 880); ctx.closePath();
    ctx.fillStyle = PINK_HI; ctx.fill();
    ctx.strokeStyle = 'rgba(27,20,36,0.6)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = PINK_SH;
    ctx.beginPath(); ctx.moveTo(cx, 684); ctx.lineTo(cx + 7, 700); ctx.lineTo(cx + 20, 880); ctx.lineTo(cx + 3, 880); ctx.closePath(); ctx.fill();
    // stepped terraces, top to bottom
    const tiers = 6;
    for (let i = 0; i < tiers; i++) {
      const u = i / (tiers - 1);
      const w = lerp(260, 820, u), h = lerp(42, 62, u);
      const yb = lerp(910, 1180, u);
      const x0 = cx - w / 2;
      ctx.beginPath(); ctx.rect(x0, yb - h, w, h);
      ctx.fillStyle = PINK; ctx.fill();
      ctx.strokeStyle = 'rgba(27,20,36,0.55)'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = PINK_HI; ctx.fillRect(x0 + 2, yb - h + 2, w - 4, 9);
      // arched niches
      const n = Math.max(3, Math.floor(w / 62));
      ctx.fillStyle = PINK_SH;
      for (let k = 0; k < n; k++) {
        const ax = x0 + (k + 0.5) * (w / n);
        if (Math.abs(ax - cx) < 50) continue;
        const aw = 11, ah = h * 0.42;
        ctx.beginPath();
        ctx.moveTo(ax - aw, yb - 6); ctx.lineTo(ax - aw, yb - ah); ctx.arc(ax, yb - ah, aw, Math.PI, 0); ctx.lineTo(ax + aw, yb - 6); ctx.closePath();
        ctx.fill();
      }
      // flower bed dots on the ledge
      ctx.fillStyle = i % 2 ? '#ff8fb3' : '#ffd45c';
      for (let k = 0; k < 8; k++) {
        const fx = x0 + 14 + k * ((w - 28) / 7);
        if (Math.abs(fx - cx) < 50) continue;
        ctx.beginPath(); ctx.arc(fx, yb - h + 1, 5, 0, TAU); ctx.fill();
      }
      // central stair run
      ctx.fillStyle = '#fbe4d7';
      ctx.fillRect(cx - 34, yb - h, 68, h);
      ctx.strokeStyle = PINK_SH; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let s = 1; s < 5; s++) { const sy = yb - h + (h / 5) * s; ctx.moveTo(cx - 34, sy); ctx.lineTo(cx + 34, sy); }
      ctx.stroke();
      // tiny fountain spray on each ledge, bobbing
      const ph = ((t * 1.6 + i * 0.37) % 1 + 1) % 1;
      ctx.fillStyle = 'rgba(200,240,255,0.9)';
      ctx.beginPath();
      ctx.ellipse(cx - 58, yb - h - 4 - ph * 8, 7, 5 + ph * 5, 0, 0, TAU);
      ctx.ellipse(cx + 58, yb - h - 4 - ((ph + 0.5) % 1) * 8, 7, 5 + ((ph + 0.5) % 1) * 5, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function cityLayer(ctx, F, camX) {
    const off = -camX * 0.2;
    const blocks = [
      [-620, 250, 170], [-420, 200, 230], [-230, 150, 190], [700, 220, 210], [900, 180, 250], [1100, 240, 190], [1330, 200, 220], [1560, 220, 180],
    ];
    ctx.save();
    blocks.forEach(([bx, bw, bh], i) => {
      const x = bx + off;
      if (x > 1120 || x + bw < -40) return;
      const y = 1190 - bh;
      ctx.fillStyle = i % 2 ? '#eec3ad' : '#e2ac96';
      ctx.fillRect(x, y, bw, bh);
      ctx.strokeStyle = 'rgba(27,20,36,0.4)'; ctx.lineWidth = 3; ctx.strokeRect(x, y, bw, bh);
      // cornice + windows with balconies
      ctx.fillStyle = PINK_HI; ctx.fillRect(x - 6, y - 8, bw + 12, 12);
      ctx.fillStyle = '#9fb6d8';
      for (let r = 0; r < Math.floor((bh - 30) / 44); r++) {
        for (let c = 0; c < Math.floor(bw / 44); c++) {
          const wx = x + 14 + c * 44, wy = y + 22 + r * 44;
          ctx.fillRect(wx, wy, 20, 26);
        }
      }
      ctx.fillStyle = PINK_DK;
      for (let r = 0; r < Math.floor((bh - 30) / 44); r++) ctx.fillRect(x + 8, y + 48 + r * 44, bw - 16, 4);
    });
    ctx.restore();
  }

  function roundTree(ctx, F, x, y, r, seed) {
    const P = F.pal;
    // trunk
    ctx.beginPath();
    ctx.moveTo(x - 10, y); ctx.lineTo(x - 7, y - r * 0.9); ctx.lineTo(x + 7, y - r * 0.9); ctx.lineTo(x + 10, y); ctx.closePath();
    F.fo(ctx, P.trunk, 4);
    // canopy: a few overlapping balls
    const cy = y - r * 1.25;
    ctx.beginPath();
    ctx.arc(x - r * 0.45, cy + r * 0.15, r * 0.62, 0, TAU);
    ctx.arc(x + r * 0.45, cy + r * 0.12, r * 0.66, 0, TAU);
    ctx.arc(x, cy - r * 0.3, r * 0.72, 0, TAU);
    ctx.fillStyle = P.tree; ctx.fill();
    // outline via a single silhouette stroke underneath trick: stroke each arc lightly
    ctx.strokeStyle = 'rgba(27,20,36,0.75)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x - r * 0.45, cy + r * 0.15, r * 0.62, Math.PI * 0.45, Math.PI * 1.35); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + r * 0.45, cy + r * 0.12, r * 0.66, -Math.PI * 0.4, Math.PI * 0.55); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, cy - r * 0.3, r * 0.72, Math.PI * 1.1, Math.PI * 1.95); ctx.stroke();
    // shade + highlight
    ctx.fillStyle = P.treeShade;
    ctx.beginPath(); ctx.ellipse(x + r * 0.3, cy + r * 0.38, r * 0.55, r * 0.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7cc56a';
    ctx.beginPath(); ctx.ellipse(x - r * 0.25, cy - r * 0.55, r * 0.28, r * 0.16, -0.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.ellipse(x - r * 0.35, cy - r * 0.62, r * 0.12, r * 0.07, -0.4, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function treeLayer(ctx, F, t, camX) {
    const P = F.pal;
    const off = camX * 0.45;
    const period = 1500;
    // back hedge band
    ctx.fillStyle = '#6aa860';
    ctx.fillRect(-20, 1170, 1120, 50);
    const trees = [[20, 100], [330, 84], [590, 76], [860, 104], [1110, 88], [1340, 96]];
    trees.forEach(([tx, r], i) => {
      const x = wrapX(tx - off + 200, period) - 200;
      if (x < -250 || x > 1330) return;
      roundTree(ctx, F, x, 1225, r, i);
    });
    // lamp posts between trees
    const lamps = [170, 680, 1190];
    lamps.forEach((lx) => {
      const x = wrapX(lx - off + 200, period) - 200;
      if (x < -60 || x > 1140) return;
      ctx.fillStyle = '#3b3550';
      ctx.fillRect(x - 5, 1010, 10, 220);
      ctx.beginPath(); ctx.moveTo(x - 20, 1010); ctx.lineTo(x + 20, 1010); ctx.lineTo(x + 12, 972); ctx.lineTo(x - 12, 972); ctx.closePath();
      F.fo(ctx, '#fff3c4', 3);
      ctx.fillStyle = '#3b3550';
      ctx.fillRect(x - 16, 964, 32, 9);
    });
  }

  function lawnLayer(ctx, F, t, camX) {
    const P = F.pal;
    // lawn
    ctx.fillStyle = P.grass;
    ctx.fillRect(-20, 1220, 1120, 260);
    // mowing stripes
    const off = camX * 0.75;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    for (let i = -2; i < 14; i++) {
      const x = i * 160 - wrapX(off, 320);
      ctx.moveTo(x, 1220); ctx.lineTo(x + 80, 1220); ctx.lineTo(x + 20, 1480); ctx.lineTo(x - 60, 1480); ctx.closePath();
    }
    ctx.fill();
    // flower beds
    const period = 1400;
    [[120, '#ff8fb3'], [760, '#ffd45c'], [1100, '#b99cff']].forEach(([fx, c], i) => {
      const x = wrapX(fx - off + 200, period) - 200;
      if (x < -200 || x > 1280) return;
      ctx.beginPath(); ctx.ellipse(x, 1262, 110, 22, 0, 0, TAU); F.fo(ctx, '#5a9e40', 3);
      ctx.fillStyle = c;
      for (let k = 0; k < 9; k++) { ctx.beginPath(); ctx.arc(x - 88 + k * 22, 1256 + (k % 2) * 8, 7, 0, TAU); ctx.fill(); }
    });
    // benches
    [[420], [1120]].forEach(([bx], i) => {
      const x = wrapX(bx - off + 300, period) - 300;
      if (x < -260 || x > 1340) return;
      bench(ctx, F, x, 1420);
    });
    // path edge curb (top)
    ctx.fillStyle = '#d7b3a0';
    ctx.fillRect(-20, 1466, 1120, 16);
    ctx.strokeStyle = 'rgba(27,20,36,0.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-20, 1466); ctx.lineTo(1100, 1466); ctx.stroke();
  }

  function bench(ctx, F, x, y) {
    const wood = '#c9824a', woodSh = '#9c5e30', iron = '#3b3550';
    ctx.save();
    ctx.lineJoin = 'round';
    // legs
    ctx.fillStyle = iron;
    ctx.fillRect(x - 100, y - 50, 10, 50); ctx.fillRect(x + 90, y - 50, 10, 50);
    // back slats
    for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.rect(x - 110, y - 128 + k * 22, 220, 14); F.fo(ctx, k ? wood : woodSh, 3);
    }
    ctx.fillStyle = iron;
    ctx.fillRect(x - 104, y - 132, 8, 90); ctx.fillRect(x + 96, y - 132, 8, 90);
    // seat
    ctx.beginPath(); ctx.rect(x - 116, y - 58, 232, 16); F.fo(ctx, wood, 3);
    ctx.restore();
  }

  function pathLayer(ctx, F, camX) {
    // paved path in warm pink stone, tile joints scroll at factor 1
    const y0 = 1482, y1 = 1760;
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, '#f0d2c0'); g.addColorStop(1, '#e4b9a3');
    ctx.fillStyle = g;
    ctx.fillRect(-20, y0, 1120, y1 - y0);
    ctx.strokeStyle = 'rgba(160,100,80,0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const rows = [1482, 1540, 1606, 1680, 1760];
    for (let r = 0; r < rows.length - 1; r++) {
      ctx.moveTo(-20, rows[r]); ctx.lineTo(1100, rows[r]);
      const tw = 90 + r * 22;
      const shift = r % 2 ? tw / 2 : 0;
      for (let x = -wrapX(camX * (0.9 + r * 0.08) + shift, tw); x < 1100; x += tw) {
        ctx.moveTo(x, rows[r]); ctx.lineTo(x - (r - 1.5) * 6, rows[r + 1]);
      }
    }
    ctx.stroke();
    // bottom curb + grass verge
    ctx.fillStyle = '#d7b3a0';
    ctx.fillRect(-20, y1, 1120, 18);
    ctx.fillStyle = F.pal.grassShade;
    ctx.fillRect(-20, y1 + 18, 1120, 200);
    ctx.strokeStyle = 'rgba(27,20,36,0.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-20, y1); ctx.lineTo(1100, y1); ctx.stroke();
  }

  function foregroundLayer(ctx, F, t, camX) {
    const off = camX * 1.35;
    const period = 1300;
    const items = [[80, 120], [520, 90], [900, 130]];
    items.forEach(([bx, r], i) => {
      const x = wrapX(bx - off + 200, period) - 200;
      if (x < -200 || x > 1280) return;
      const y = 1920 + 20;
      ctx.beginPath();
      ctx.arc(x - r * 0.6, y - r * 0.5, r * 0.7, 0, TAU);
      ctx.arc(x + r * 0.5, y - r * 0.55, r * 0.75, 0, TAU);
      ctx.arc(x, y - r * 0.95, r * 0.7, 0, TAU);
      ctx.fillStyle = '#3f8a3e'; ctx.fill();
      ctx.fillStyle = '#ff7fa8';
      for (let k = 0; k < 5; k++) {
        const fx = x - r * 0.8 + k * r * 0.4, fy = y - r * (0.7 + 0.5 * H01('ff', i, k));
        ctx.beginPath(); ctx.arc(fx, fy, 10, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff3a0'; ctx.beginPath(); ctx.arc(fx, fy, 4, 0, TAU); ctx.fill(); ctx.fillStyle = k % 2 ? '#ff7fa8' : '#ffffff';
      }
    });
  }

  function pigeon(ctx, F, x, y, s, t, seed, flee) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    const peck = flee > 0 ? 0 : (Math.floor(t * 6 + seed) % 3 === 0 ? 1 : 0);
    ctx.lineJoin = 'round';
    if (flee > 0) {
      // flapping up and away
      const f = Math.floor(t * 12) % 2;
      ctx.beginPath(); ctx.ellipse(0, -22, 26, 16, -0.3, 0, TAU); F.fo(ctx, '#b8bfd6', 4);
      ctx.beginPath(); ctx.moveTo(-6, -30); ctx.lineTo(-30, f ? -70 : -10); ctx.lineTo(10, -30); ctx.closePath(); F.fo(ctx, '#9aa3c2', 4);
      ctx.beginPath(); ctx.arc(22, -36, 11, 0, TAU); F.fo(ctx, '#8d96b8', 4);
    } else {
      ctx.beginPath(); ctx.ellipse(0, -20, 26, 17, 0, 0, TAU); F.fo(ctx, '#b8bfd6', 4);
      ctx.beginPath(); ctx.ellipse(-6, -22, 16, 9, 0.2, 0, TAU); ctx.fillStyle = '#9aa3c2'; ctx.fill();
      ctx.beginPath(); ctx.arc(20, -34 + peck * 16, 11, 0, TAU); F.fo(ctx, '#8d96b8', 4);
      ctx.fillStyle = '#e8a33a'; ctx.beginPath(); ctx.moveTo(30, -36 + peck * 16); ctx.lineTo(38, -32 + peck * 16); ctx.lineTo(30, -30 + peck * 16); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#e07a5a'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(-4, 0); ctx.moveTo(6, -4); ctx.lineTo(6, 0); ctx.stroke();
    }
    ctx.restore();
  }

  function butterflies(ctx, F, t) {
    for (let i = 0; i < 3; i++) {
      const u = t * 0.4 + i * 0.33;
      const x = 120 + ((i * 310 + t * 60) % 900);
      const y = 1060 + i * 90 + Math.sin(u * 7) * 40;
      const f = Math.abs(Math.sin(t * 18 + i));
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = i % 2 ? '#fff3a0' : '#ffc4dc';
      ctx.strokeStyle = 'rgba(27,20,36,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(-8 * f, -4, 9 * f + 1, 7, -0.4, 0, TAU); ctx.ellipse(8 * f, -4, 9 * f + 1, 7, 0.4, 0, TAU);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  function birds(ctx, t) {
    ctx.save();
    ctx.strokeStyle = 'rgba(60,50,90,0.75)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < 4; i++) {
      const x = 380 + i * 90 + t * (70 + i * 8);
      const y = 560 + (i % 2) * 50 - t * 18 + Math.sin(t * 3 + i) * 8;
      const f = Math.floor(t * 8 + i) % 2 ? 10 : -4;
      const w = 16 - i * 1.5;
      ctx.beginPath();
      ctx.moveTo(x - w, y - f); ctx.quadraticCurveTo(x - w * 0.4, y - f * 0.2, x, y + 3); ctx.quadraticCurveTo(x + w * 0.4, y - f * 0.2, x + w, y - f);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const F = FILM.fx, C = FILM.cast, P = F.pal;
      const L = FILM.lib;
      const camX = t * CAM_SPEED;

      // 1-7 background
      skyLayer(ctx, F, t, camX);
      araratLayer(ctx, F, camX);
      cityLayer(ctx, F, camX);
      cascadeLayer(ctx, F, t, camX);
      treeLayer(ctx, F, t, camX);
      lawnLayer(ctx, F, t, camX);
      pathLayer(ctx, F, camX);
      butterflies(ctx, F, t);
      birds(ctx, t);

      // pigeons on the path (world positions, flee when Goofy gets near)
      const goofyX = 730 + t * 12;
      [[1150, 1560, 0.9, 1], [1320, 1600, 1.0, 2], [1500, 1545, 0.85, 3]].forEach(([wx, wy, s, sd]) => {
        const sx = wx - camX;
        const dist = sx - goofyX;
        const flee = dist < 260 ? clamp((260 - dist) / 260) : 0;
        const fy = wy - flee * 520, fx = sx + flee * 260;
        if (fx < -80 || fx > 1160) return;
        pigeon(ctx, F, fx, fy, s, t, sd, flee);
      });

      // 8. characters: Grant strolls behind, Goofy trots ahead on the leash
      const tw = L.onTwos(t);
      const grantX = 250 + t * 12;
      const ga = C.grant(ctx, { x: grantX, y: GROUND, s: 1.3, pose: 'walk', face: 'calm', t: tw });
      const gy = GROUND + 18;
      const da = C.goofy(ctx, { x: goofyX, y: gy, s: 1.5, pose: 'walk', face: 'neutral', t: tw, look: [0.6, 0] });
      F.leash(ctx, da.collar, ga.handR, { sag: 70 });
      // happy trot sparkles near Goofy
      F.sparkles(ctx, { x: goofyX - 60, y: gy - 480, w: 380, h: 220, n: 4, seed: 1702, t, size: 22 });

      // whistle notes from Grant's mouth
      F.notes(ctx, ga.mouth[0] + 80, ga.mouth[1] - 30, t, { n: 4, seed: 1703, color: '#ffe14a', size: 86, rise: 300 });

      // 9. foreground
      foregroundLayer(ctx, F, t, camX);

      // 10. morning light rays + soft warm wash
      ctx.save();
      ctx.globalAlpha = 0.14 + 0.03 * Math.sin(t * 2);
      ctx.fillStyle = '#fff4c8';
      ctx.beginPath();
      [[0.1, 0.05], [0.3, 0.04], [0.55, 0.06]].forEach(([a, w]) => {
        const a0 = 0.35 + a, a1 = a0 + w;
        ctx.moveTo(170, 330);
        ctx.lineTo(170 + Math.cos(a0) * 2400, 330 + Math.sin(a0) * 2400);
        ctx.lineTo(170 + Math.cos(a1) * 2400, 330 + Math.sin(a1) * 2400);
        ctx.closePath();
      });
      ctx.fill();
      ctx.restore();

      // caption and bubble (screen fixed)
      F.caption(ctx, 'DAY 1 OF DOG SITTING', 90, 300, { size: 58, t, t0: T_CAPTION, from: 'left', accent: '#ff8fb3' });
      if (t >= T_BUBBLE) {
        const bx = 470, by = 640;
        F.bubble(ctx, 'SEE? PEACEFUL.', bx, by, { size: 58, t, t0: T_BUBBLE, tail: [ga.head[0] + 20, ga.top[1] - 10] });
      }
      F.sparkles(ctx, { x: 80, y: 420, w: 900, h: 500, n: 5, seed: 1704, t, size: 20 });
    },
  });
})();

</script>
<script>
// ---- src/scenes/18-goofy-senses.js
/*
 * 18 'goofy-senses' : Goofy senses a stranger. Global T 75.0 - 79.0 (4 s).
 *
 * Same Yerevan park as 17-grant-walk (the park helpers below are a copy of that file's layout,
 * held at the camera position where 17 ends). Static camera with a slow push-in.
 * Layers, back to front:
 *   1. park background: sky, Ararat, city, Cascade, tree line, lawn + benches, path
 *   2. demon mode (from 1.0 s): dark purple wash, red backlight behind Goofy, purple aura
 *   3. the stranger: a flat silhouette jogger with a small white poodle, entering from the right
 *   4. Grant (stand; calm -> nervous at 1.0 s, sweat, tremble) behind, leash, Goofy (stand;
 *      neutral -> angry at 1.0 s: glowing eyes, bristling fur), "!" mark on the stop
 *   5. menace glyphs ゴゴゴゴ rising around Goofy, foreground bushes
 *   6. 1.0 s impact frame (2 frames), bubble "UH-OH." from Grant at 2.5 s
 *   7. 3.0 s cut: extreme close-up letterbox strip on Goofy's glowing eyes (the bubble holds)
 */
(function () {
  'use strict';
  const ID = 'goofy-senses';
  const TAU = Math.PI * 2;
  const FR = 1 / 24;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const H01 = (...k) => FILM.fx.h01(ID, ...k);

  const T_STOP = 0.0; // T 75.0 Goofy stops dead
  const T_ANGRY = 1.0; // T 76.0 demon mode
  const T_UHOH = 2.5; // T 77.5 Grant's bubble
  const T_EYES = 3.0; // T 78.0 extreme close-up
  const CAM_X = 680; // where 17-grant-walk's camera ends (4 s * 170 px/s)
  const GROUND = 1700;

  // ---------------------------------------------------------------------------
  // Park background (shared layout with 18-goofy-senses; camX = path scroll in px)
  // ---------------------------------------------------------------------------
  const PINK = '#e8b8a0', PINK_HI = '#f6d6c6', PINK_SH = '#c9917b', PINK_DK = '#a8705e';

  function wrapX(x, period) { return ((x % period) + period) % period; }

  function skyLayer(ctx, F, t, camX) {
    F.sky(ctx, '#8fcfff', '#ffe4dc', { h: 1300, mid: '#cdeeff', midAt: 0.55 });
    // morning sun glow top-left
    const g = ctx.createRadialGradient(170, 330, 20, 170, 330, 620);
    g.addColorStop(0, 'rgba(255,250,215,0.95)');
    g.addColorStop(0.25, 'rgba(255,236,190,0.55)');
    g.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1080, 1300);
    ctx.fillStyle = '#fffbe6';
    ctx.beginPath(); ctx.arc(170, 330, 62, 0, TAU); ctx.fill();
    ctx.save();
    ctx.translate(-camX * 0.03, 0);
    F.clouds(ctx, { n: 5, seed: 1701, t, y: 180, h: 420, speed: 10, scale: 0.8, shade: 'rgba(255,200,210,0.45)' });
    ctx.restore();
  }

  function araratLayer(ctx, F, camX) {
    const x = -170 - camX * 0.05;
    F.ararat(ctx, x, 1060, 940, 360, { color: '#b3b8e6', shade: '#a2a8da', snow: '#ffffff' });
    // haze band at its foot
    const g = ctx.createLinearGradient(0, 940, 0, 1070);
    g.addColorStop(0, 'rgba(255,228,220,0)');
    g.addColorStop(1, 'rgba(255,228,220,0.8)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 940, 1080, 130);
  }

  function cascadeLayer(ctx, F, t, camX) {
    const cx = 660 - camX * 0.14;
    ctx.save();
    ctx.lineJoin = 'round';
    // green hillside the stairs climb
    ctx.beginPath();
    ctx.moveTo(cx - 760, 1180);
    ctx.bezierCurveTo(cx - 420, 960, cx - 220, 830, cx, 815);
    ctx.bezierCurveTo(cx + 240, 830, cx + 440, 960, cx + 780, 1180);
    ctx.closePath();
    ctx.fillStyle = '#86bf78';
    ctx.fill();
    ctx.strokeStyle = 'rgba(27,20,36,0.45)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#76b06a';
    for (let k = 0; k < 11; k++) {
      const u = k / 10;
      const bx = cx - 640 + u * 1280, by = 1150 - Math.sin(u * Math.PI) * 270;
      ctx.beginPath(); ctx.arc(bx, by, 30 + (k % 3) * 10, 0, TAU); ctx.fill();
    }
    // obelisk monument at the top
    ctx.beginPath();
    ctx.moveTo(cx - 20, 880); ctx.lineTo(cx - 7, 700); ctx.lineTo(cx, 682); ctx.lineTo(cx + 7, 700); ctx.lineTo(cx + 20, 880); ctx.closePath();
    ctx.fillStyle = PINK_HI; ctx.fill();
    ctx.strokeStyle = 'rgba(27,20,36,0.6)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = PINK_SH;
    ctx.beginPath(); ctx.moveTo(cx, 684); ctx.lineTo(cx + 7, 700); ctx.lineTo(cx + 20, 880); ctx.lineTo(cx + 3, 880); ctx.closePath(); ctx.fill();
    // stepped terraces, top to bottom
    const tiers = 6;
    for (let i = 0; i < tiers; i++) {
      const u = i / (tiers - 1);
      const w = lerp(260, 820, u), h = lerp(42, 62, u);
      const yb = lerp(910, 1180, u);
      const x0 = cx - w / 2;
      ctx.beginPath(); ctx.rect(x0, yb - h, w, h);
      ctx.fillStyle = PINK; ctx.fill();
      ctx.strokeStyle = 'rgba(27,20,36,0.55)'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = PINK_HI; ctx.fillRect(x0 + 2, yb - h + 2, w - 4, 9);
      // arched niches
      const n = Math.max(3, Math.floor(w / 62));
      ctx.fillStyle = PINK_SH;
      for (let k = 0; k < n; k++) {
        const ax = x0 + (k + 0.5) * (w / n);
        if (Math.abs(ax - cx) < 50) continue;
        const aw = 11, ah = h * 0.42;
        ctx.beginPath();
        ctx.moveTo(ax - aw, yb - 6); ctx.lineTo(ax - aw, yb - ah); ctx.arc(ax, yb - ah, aw, Math.PI, 0); ctx.lineTo(ax + aw, yb - 6); ctx.closePath();
        ctx.fill();
      }
      // flower bed dots on the ledge
      ctx.fillStyle = i % 2 ? '#ff8fb3' : '#ffd45c';
      for (let k = 0; k < 8; k++) {
        const fx = x0 + 14 + k * ((w - 28) / 7);
        if (Math.abs(fx - cx) < 50) continue;
        ctx.beginPath(); ctx.arc(fx, yb - h + 1, 5, 0, TAU); ctx.fill();
      }
      // central stair run
      ctx.fillStyle = '#fbe4d7';
      ctx.fillRect(cx - 34, yb - h, 68, h);
      ctx.strokeStyle = PINK_SH; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let s = 1; s < 5; s++) { const sy = yb - h + (h / 5) * s; ctx.moveTo(cx - 34, sy); ctx.lineTo(cx + 34, sy); }
      ctx.stroke();
      // tiny fountain spray on each ledge, bobbing
      const ph = ((t * 1.6 + i * 0.37) % 1 + 1) % 1;
      ctx.fillStyle = 'rgba(200,240,255,0.9)';
      ctx.beginPath();
      ctx.ellipse(cx - 58, yb - h - 4 - ph * 8, 7, 5 + ph * 5, 0, 0, TAU);
      ctx.ellipse(cx + 58, yb - h - 4 - ((ph + 0.5) % 1) * 8, 7, 5 + ((ph + 0.5) % 1) * 5, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function cityLayer(ctx, F, camX) {
    const off = -camX * 0.2;
    const blocks = [
      [-620, 250, 170], [-420, 200, 230], [-230, 150, 190], [700, 220, 210], [900, 180, 250], [1100, 240, 190], [1330, 200, 220], [1560, 220, 180],
    ];
    ctx.save();
    blocks.forEach(([bx, bw, bh], i) => {
      const x = bx + off;
      if (x > 1120 || x + bw < -40) return;
      const y = 1190 - bh;
      ctx.fillStyle = i % 2 ? '#eec3ad' : '#e2ac96';
      ctx.fillRect(x, y, bw, bh);
      ctx.strokeStyle = 'rgba(27,20,36,0.4)'; ctx.lineWidth = 3; ctx.strokeRect(x, y, bw, bh);
      // cornice + windows with balconies
      ctx.fillStyle = PINK_HI; ctx.fillRect(x - 6, y - 8, bw + 12, 12);
      ctx.fillStyle = '#9fb6d8';
      for (let r = 0; r < Math.floor((bh - 30) / 44); r++) {
        for (let c = 0; c < Math.floor(bw / 44); c++) {
          const wx = x + 14 + c * 44, wy = y + 22 + r * 44;
          ctx.fillRect(wx, wy, 20, 26);
        }
      }
      ctx.fillStyle = PINK_DK;
      for (let r = 0; r < Math.floor((bh - 30) / 44); r++) ctx.fillRect(x + 8, y + 48 + r * 44, bw - 16, 4);
    });
    ctx.restore();
  }

  function roundTree(ctx, F, x, y, r, seed) {
    const P = F.pal;
    // trunk
    ctx.beginPath();
    ctx.moveTo(x - 10, y); ctx.lineTo(x - 7, y - r * 0.9); ctx.lineTo(x + 7, y - r * 0.9); ctx.lineTo(x + 10, y); ctx.closePath();
    F.fo(ctx, P.trunk, 4);
    // canopy: a few overlapping balls
    const cy = y - r * 1.25;
    ctx.beginPath();
    ctx.arc(x - r * 0.45, cy + r * 0.15, r * 0.62, 0, TAU);
    ctx.arc(x + r * 0.45, cy + r * 0.12, r * 0.66, 0, TAU);
    ctx.arc(x, cy - r * 0.3, r * 0.72, 0, TAU);
    ctx.fillStyle = P.tree; ctx.fill();
    // outline via a single silhouette stroke underneath trick: stroke each arc lightly
    ctx.strokeStyle = 'rgba(27,20,36,0.75)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(x - r * 0.45, cy + r * 0.15, r * 0.62, Math.PI * 0.45, Math.PI * 1.35); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + r * 0.45, cy + r * 0.12, r * 0.66, -Math.PI * 0.4, Math.PI * 0.55); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, cy - r * 0.3, r * 0.72, Math.PI * 1.1, Math.PI * 1.95); ctx.stroke();
    // shade + highlight
    ctx.fillStyle = P.treeShade;
    ctx.beginPath(); ctx.ellipse(x + r * 0.3, cy + r * 0.38, r * 0.55, r * 0.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#7cc56a';
    ctx.beginPath(); ctx.ellipse(x - r * 0.25, cy - r * 0.55, r * 0.28, r * 0.16, -0.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.25;
    ctx.beginPath(); ctx.ellipse(x - r * 0.35, cy - r * 0.62, r * 0.12, r * 0.07, -0.4, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function treeLayer(ctx, F, t, camX) {
    const P = F.pal;
    const off = camX * 0.45;
    const period = 1500;
    // back hedge band
    ctx.fillStyle = '#6aa860';
    ctx.fillRect(-20, 1170, 1120, 50);
    const trees = [[20, 100], [330, 84], [590, 76], [860, 104], [1110, 88], [1340, 96]];
    trees.forEach(([tx, r], i) => {
      const x = wrapX(tx - off + 200, period) - 200;
      if (x < -250 || x > 1330) return;
      roundTree(ctx, F, x, 1225, r, i);
    });
    // lamp posts between trees
    const lamps = [170, 680, 1190];
    lamps.forEach((lx) => {
      const x = wrapX(lx - off + 200, period) - 200;
      if (x < -60 || x > 1140) return;
      ctx.fillStyle = '#3b3550';
      ctx.fillRect(x - 5, 1010, 10, 220);
      ctx.beginPath(); ctx.moveTo(x - 20, 1010); ctx.lineTo(x + 20, 1010); ctx.lineTo(x + 12, 972); ctx.lineTo(x - 12, 972); ctx.closePath();
      F.fo(ctx, '#fff3c4', 3);
      ctx.fillStyle = '#3b3550';
      ctx.fillRect(x - 16, 964, 32, 9);
    });
  }

  function lawnLayer(ctx, F, t, camX) {
    const P = F.pal;
    // lawn
    ctx.fillStyle = P.grass;
    ctx.fillRect(-20, 1220, 1120, 260);
    // mowing stripes
    const off = camX * 0.75;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    for (let i = -2; i < 14; i++) {
      const x = i * 160 - wrapX(off, 320);
      ctx.moveTo(x, 1220); ctx.lineTo(x + 80, 1220); ctx.lineTo(x + 20, 1480); ctx.lineTo(x - 60, 1480); ctx.closePath();
    }
    ctx.fill();
    // flower beds
    const period = 1400;
    [[120, '#ff8fb3'], [760, '#ffd45c'], [1100, '#b99cff']].forEach(([fx, c], i) => {
      const x = wrapX(fx - off + 200, period) - 200;
      if (x < -200 || x > 1280) return;
      ctx.beginPath(); ctx.ellipse(x, 1262, 110, 22, 0, 0, TAU); F.fo(ctx, '#5a9e40', 3);
      ctx.fillStyle = c;
      for (let k = 0; k < 9; k++) { ctx.beginPath(); ctx.arc(x - 88 + k * 22, 1256 + (k % 2) * 8, 7, 0, TAU); ctx.fill(); }
    });
    // benches
    [[420], [1120]].forEach(([bx], i) => {
      const x = wrapX(bx - off + 300, period) - 300;
      if (x < -260 || x > 1340) return;
      bench(ctx, F, x, 1420);
    });
    // path edge curb (top)
    ctx.fillStyle = '#d7b3a0';
    ctx.fillRect(-20, 1466, 1120, 16);
    ctx.strokeStyle = 'rgba(27,20,36,0.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-20, 1466); ctx.lineTo(1100, 1466); ctx.stroke();
  }

  function bench(ctx, F, x, y) {
    const wood = '#c9824a', woodSh = '#9c5e30', iron = '#3b3550';
    ctx.save();
    ctx.lineJoin = 'round';
    // legs
    ctx.fillStyle = iron;
    ctx.fillRect(x - 100, y - 50, 10, 50); ctx.fillRect(x + 90, y - 50, 10, 50);
    // back slats
    for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.rect(x - 110, y - 128 + k * 22, 220, 14); F.fo(ctx, k ? wood : woodSh, 3);
    }
    ctx.fillStyle = iron;
    ctx.fillRect(x - 104, y - 132, 8, 90); ctx.fillRect(x + 96, y - 132, 8, 90);
    // seat
    ctx.beginPath(); ctx.rect(x - 116, y - 58, 232, 16); F.fo(ctx, wood, 3);
    ctx.restore();
  }

  function pathLayer(ctx, F, camX) {
    // paved path in warm pink stone, tile joints scroll at factor 1
    const y0 = 1482, y1 = 1760;
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, '#f0d2c0'); g.addColorStop(1, '#e4b9a3');
    ctx.fillStyle = g;
    ctx.fillRect(-20, y0, 1120, y1 - y0);
    ctx.strokeStyle = 'rgba(160,100,80,0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const rows = [1482, 1540, 1606, 1680, 1760];
    for (let r = 0; r < rows.length - 1; r++) {
      ctx.moveTo(-20, rows[r]); ctx.lineTo(1100, rows[r]);
      const tw = 90 + r * 22;
      const shift = r % 2 ? tw / 2 : 0;
      for (let x = -wrapX(camX * (0.9 + r * 0.08) + shift, tw); x < 1100; x += tw) {
        ctx.moveTo(x, rows[r]); ctx.lineTo(x - (r - 1.5) * 6, rows[r + 1]);
      }
    }
    ctx.stroke();
    // bottom curb + grass verge
    ctx.fillStyle = '#d7b3a0';
    ctx.fillRect(-20, y1, 1120, 18);
    ctx.fillStyle = F.pal.grassShade;
    ctx.fillRect(-20, y1 + 18, 1120, 200);
    ctx.strokeStyle = 'rgba(27,20,36,0.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-20, y1); ctx.lineTo(1100, y1); ctx.stroke();
  }

  function foregroundLayer(ctx, F, t, camX) {
    const off = camX * 1.35;
    const period = 1300;
    const items = [[80, 120], [520, 90], [900, 130]];
    items.forEach(([bx, r], i) => {
      const x = wrapX(bx - off + 200, period) - 200;
      if (x < -200 || x > 1280) return;
      const y = 1920 + 20;
      ctx.beginPath();
      ctx.arc(x - r * 0.6, y - r * 0.5, r * 0.7, 0, TAU);
      ctx.arc(x + r * 0.5, y - r * 0.55, r * 0.75, 0, TAU);
      ctx.arc(x, y - r * 0.95, r * 0.7, 0, TAU);
      ctx.fillStyle = '#3f8a3e'; ctx.fill();
      ctx.fillStyle = '#ff7fa8';
      for (let k = 0; k < 5; k++) {
        const fx = x - r * 0.8 + k * r * 0.4, fy = y - r * (0.7 + 0.5 * H01('ff', i, k));
        ctx.beginPath(); ctx.arc(fx, fy, 10, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff3a0'; ctx.beginPath(); ctx.arc(fx, fy, 4, 0, TAU); ctx.fill(); ctx.fillStyle = k % 2 ? '#ff7fa8' : '#ffffff';
      }
    });
  }

  function butterflies(ctx, F, t) {
    for (let i = 0; i < 3; i++) {
      const u = t * 0.4 + i * 0.33;
      const x = 120 + ((i * 310 + t * 60) % 900);
      const y = 1060 + i * 90 + Math.sin(u * 7) * 40;
      const f = Math.abs(Math.sin(t * 18 + i));
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = i % 2 ? '#fff3a0' : '#ffc4dc';
      ctx.strokeStyle = 'rgba(27,20,36,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(-8 * f, -4, 9 * f + 1, 7, -0.4, 0, TAU); ctx.ellipse(8 * f, -4, 9 * f + 1, 7, 0.4, 0, TAU);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  function birds(ctx, t) {
    ctx.save();
    ctx.strokeStyle = 'rgba(60,50,90,0.75)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < 4; i++) {
      const x = 380 + i * 90 + t * (70 + i * 8);
      const y = 560 + (i % 2) * 50 - t * 18 + Math.sin(t * 3 + i) * 8;
      const f = Math.floor(t * 8 + i) % 2 ? 10 : -4;
      const w = 16 - i * 1.5;
      ctx.beginPath();
      ctx.moveTo(x - w, y - f); ctx.quadraticCurveTo(x - w * 0.4, y - f * 0.2, x, y + 3); ctx.quadraticCurveTo(x + w * 0.4, y - f * 0.2, x + w, y - f);
      ctx.stroke();
    }
    ctx.restore();
  }


  // ---------------------------------------------------------------------------
  // The stranger: flat silhouette jogger (not a cast member) + small white poodle
  // ---------------------------------------------------------------------------
  function jogger(ctx, x, y, s, t, rim, scared) {
    const ph = t * TAU * 2.4;
    const sw = scared ? 0.5 : Math.sin(ph);
    const bob = scared ? 0 : -Math.abs(Math.cos(ph)) * 14;
    const col = rim ? '#ffb3c4' : '#4b3a66';
    const ex = rim ? 12 : 0;
    const shiver = scared ? (H01('js', Math.floor(t * 24)) - 0.5) * 8 : 0;
    ctx.save();
    ctx.translate(x + shiver, y);
    ctx.scale(-s, s); // local +x = forward = screen left (towards Goofy)
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
    const limb = (pts, w) => {
      ctx.lineWidth = w + ex;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
    };
    const dir = (p, a, l) => [p[0] + Math.sin(a) * l, p[1] + Math.cos(a) * l];
    const hip = [0, -250 + bob];
    const leg = (p) => {
      const th = scared ? p * 0.5 : 0.6 * p;
      const kb = scared ? 0.15 : 0.25 + 1.1 * Math.max(0, -p);
      const knee = dir(hip, th, 125);
      const foot = dir(knee, th - kb, 125);
      limb([hip, knee, foot], 34);
      ctx.beginPath(); ctx.ellipse(foot[0] + 16, foot[1] + 2, 26 + ex / 2, 12 + ex / 2, 0, 0, TAU); ctx.fill();
    };
    const lean = scared ? -46 : 26;
    const sh = [lean, -430 + bob];
    const arm = (p) => {
      const ua = scared ? 2.5 + p * 0.3 : -0.8 * p;
      const el = dir(sh, ua, 88);
      const hd = dir(el, scared ? ua + 0.5 : ua + 1.7, 76);
      limb([sh, el, hd], 26);
      ctx.beginPath(); ctx.arc(hd[0], hd[1], 16 + ex / 2, 0, TAU); ctx.fill();
    };
    leg(-sw);
    arm(sw);
    // torso
    ctx.beginPath();
    ctx.moveTo(hip[0] - 36, hip[1] + 10); ctx.lineTo(hip[0] + 36, hip[1] + 10);
    ctx.lineTo(sh[0] + 40, sh[1] + 6); ctx.lineTo(sh[0] - 40, sh[1] - 4); ctx.closePath();
    ctx.fill();
    ctx.lineWidth = 12 + ex; ctx.stroke();
    leg(sw);
    arm(-sw);
    // head + cap
    const hd = [sh[0] + (scared ? -10 : 16), sh[1] - 62];
    ctx.beginPath(); ctx.arc(hd[0], hd[1], 46 + ex / 2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hd[0] - 40, hd[1] - 22); ctx.lineTo(hd[0] + 74, hd[1] - 20); ctx.lineTo(hd[0] + 50, hd[1] - 6); ctx.lineTo(hd[0] - 40, hd[1] - 4); ctx.closePath(); ctx.fill();
    if (!rim) {
      // white eye glint so the silhouette reads as a face
      ctx.fillStyle = '#ffffff';
      if (scared) { ctx.beginPath(); ctx.arc(hd[0] + 20, hd[1] + 6, 10, 0, TAU); ctx.fill(); }
      else { ctx.beginPath(); ctx.ellipse(hd[0] + 26, hd[1] + 4, 7, 5, 0, 0, TAU); ctx.fill(); }
    }
    ctx.restore();
  }

  function poodle(ctx, x, y, s, t, scared) {
    const ph = t * TAU * 5;
    const hop = scared ? -Math.abs(Math.sin(t * TAU * 6)) * 10 : -Math.abs(Math.sin(ph / 2)) * 8;
    ctx.save();
    ctx.translate(x, y + hop * s);
    ctx.scale(-s, s); // faces left
    const P = FILM.fx.pal;
    const puff = (px, py, r) => { ctx.beginPath(); ctx.arc(px, py, r, 0, TAU); FILM.fx.fo(ctx, '#ffffff', 4); };
    // legs with pompoms
    ctx.strokeStyle = P.line; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-26, -40); ctx.lineTo(-30 + Math.sin(ph) * 6, -8); ctx.moveTo(26, -40); ctx.lineTo(30 - Math.sin(ph) * 6, -8); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-26, -40); ctx.lineTo(-30 + Math.sin(ph) * 6, -8); ctx.moveTo(26, -40); ctx.lineTo(30 - Math.sin(ph) * 6, -8); ctx.stroke();
    puff(-30 + Math.sin(ph) * 6, -6, 9);
    puff(30 - Math.sin(ph) * 6, -6, 9);
    // body + tail pompom
    ctx.beginPath(); ctx.ellipse(0, -50, 36, 20, 0, 0, TAU); FILM.fx.fo(ctx, '#ffffff', 4);
    puff(-44, -76 + Math.sin(ph) * 3, 12);
    puff(-14, -62, 20);
    // head: fluffy top knot, long snout
    puff(36, -78, 18);
    puff(40, -104, 16);
    ctx.beginPath(); ctx.ellipse(58, -76, 16, 9, 0.1, 0, TAU); FILM.fx.fo(ctx, '#ffffff', 4);
    ctx.fillStyle = P.line;
    ctx.beginPath(); ctx.arc(72, -77, 4.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(40, -82, 3.5, 0, TAU); ctx.fill();
    // pink bow
    ctx.beginPath(); ctx.moveTo(40, -118); ctx.lineTo(28, -128); ctx.lineTo(28, -110); ctx.closePath(); ctx.moveTo(40, -118); ctx.lineTo(52, -128); ctx.lineTo(52, -110); ctx.closePath();
    FILM.fx.fo(ctx, '#ff8fb3', 3);
    ctx.restore();
  }

  // "!" surprise mark
  function bang(ctx, F, x, y, t, t0, s = 1) {
    const k = F.popIn(t, t0);
    if (k <= 0) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(k * s, k * s);
    ctx.rotate(0.12);
    ctx.beginPath();
    ctx.moveTo(-18, -80); ctx.lineTo(18, -80); ctx.lineTo(8, 10); ctx.lineTo(-8, 10); ctx.closePath();
    F.fo(ctx, '#ff3b3b', 6);
    ctx.beginPath(); ctx.arc(0, 36, 13, 0, TAU); F.fo(ctx, '#ff3b3b', 6);
    // side ticks
    ctx.strokeStyle = F.pal.line; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-40, -60); ctx.lineTo(-58, -76); ctx.moveTo(40, -60); ctx.lineTo(58, -76); ctx.moveTo(-46, -22); ctx.lineTo(-66, -22); ctx.moveTo(46, -22); ctx.lineTo(66, -22); ctx.stroke();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Wide shot (0 - 3 s)
  // ---------------------------------------------------------------------------
  function wide(ctx, t, F, C) {
    const L = FILM.lib;
    const tw = L.onTwos(t);
    const angry = t >= T_ANGRY;
    const dark = angry ? clamp((t - T_ANGRY) / (3 * FR) + 1 / 3) : 0;
    const impactFrame = t >= T_ANGRY - 1e-6 && t < T_ANGRY + 2 * FR;

    // camera: slow push-in toward Goofy, harder after the turn, shake on the impact
    const push = 1 + 0.03 * clamp(t / T_ANGRY) + 0.06 * L.ease.outCubic(clamp((t - T_ANGRY) / 1.6));
    const [sx, sy] = F.shakeMany(t, [[T_ANGRY, 0.5, 26], [T_STOP, 0.15, 8]], 1801);
    ctx.save();
    ctx.translate(540 + sx, 1400 + sy);
    ctx.scale(push, push);
    ctx.translate(-540, -1400);

    if (impactFrame) {
      F.impact(ctx, { cx: 600, cy: 1330, invert: Math.floor((t - T_ANGRY) * 24 + 1e-6) === 1, seed: 1802 });
    } else {
      // 1. park
      skyLayer(ctx, F, t, CAM_X);
      araratLayer(ctx, F, CAM_X);
      cityLayer(ctx, F, CAM_X);
      cascadeLayer(ctx, F, t, CAM_X);
      treeLayer(ctx, F, t, CAM_X);
      lawnLayer(ctx, F, t, CAM_X);
      pathLayer(ctx, F, CAM_X);
      if (!angry) {
        butterflies(ctx, F, t);
        birds(ctx, t);
      }
      // 2. demon mode wash + red backlight + aura
      if (dark > 0) {
        ctx.save();
        ctx.globalAlpha = 0.72 * dark;
        ctx.fillStyle = '#1a0b24';
        ctx.fillRect(-100, -100, 1280, 2120);
        ctx.restore();
        const pulse = 0.85 + 0.15 * F.beatPulse(t, 0.5, 0.2);
        const g = ctx.createRadialGradient(560, 1420, 40, 560, 1420, 760);
        g.addColorStop(0, `rgba(255,35,64,${0.8 * dark * pulse})`);
        g.addColorStop(0.45, `rgba(255,70,40,${0.35 * dark * pulse})`);
        g.addColorStop(1, 'rgba(120,0,40,0)');
        ctx.fillStyle = g;
        ctx.fillRect(-100, 400, 1280, 1700);
        F.focusLines(ctx, 600, 1360, { inner: 520, count: 70, color: 'rgba(255,60,80,0.35)', seed: 1803, width: 14 });
        F.aura(ctx, 540, GROUND + 10, 580, 480, t, { color: '#3b1d6e', core: '#7a3cff', alpha: 0.9 * dark, seed: 1804 });
      }
    }

    // 3. stranger + poodle (entering from the right, slowing as they notice)
    const enter = L.ease.outCubic(clamp(t / 0.9));
    const jx = lerp(1240, 905, enter) - Math.max(0, Math.min(t, T_ANGRY + 0.2) - 0.9) * 12;
    const jy = 1530;
    const silAlpha = impactFrame ? 0 : 1;
    if (silAlpha > 0) {
      const scared = t >= T_ANGRY + 0.2;
      if (angry) jogger(ctx, jx, jy, 0.76, t, true, scared);
      jogger(ctx, jx, jy, 0.76, t, false, scared);
      poodle(ctx, jx - 120, jy + 8, 1.25, t, angry);
      if (angry) { F.sweat(ctx, jx - 170, jy - 150, 0.7); bang(ctx, F, jx - 130, jy - 230, t, T_ANGRY + 0.25, 0.6); F.sweat(ctx, jx + 60, jy - 470, 0.8); }
    }

    // 4. Grant behind, frozen; leash; Goofy in front
    const lurch = t < 0.4 ? Math.sin(clamp(t / 0.4) * Math.PI) * 0.1 : 0;
