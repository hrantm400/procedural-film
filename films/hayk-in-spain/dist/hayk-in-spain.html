        chairArms(ctx, cx, seatY + 10, 1.0);
        ctx.restore();
        // vertical speed lines behind Hayk
        FX.speedLines(ctx, { x: 200, y: 400, w: 680, h: 1400, angle: -Math.PI / 2, count: 26, color: '#ffffff', alpha: 0.75 * (1 - u * 0.5), t, speed: 2600, len: 380, width: 10, seed: 17 });
        // Hayk: stretched launch -> landing squash
        const d = Math.floor(t * 12 + 1e-6); // drawings on twos
        const lift = [150, 90, 30, 0, 0, 0][Math.min(5, d)];
        const sq = [[0.9, 1.14], [0.94, 1.08], [1.0, 1.0], [1.08, 0.9], [1.04, 0.96], [1, 1]][Math.min(5, d)];
        ctx.save();
        ctx.translate(HX, HY);
        ctx.scale(sq[0], sq[1]);
        ctx.translate(-HX, -HY);
        const a = FILM.cast.hayk(ctx, { x: HX, y: HY - lift, s: HS, t, pose: 'fist', face: 'determined', belly: 0 });
        ctx.restore();
        if (d >= 3) FX.dust(ctx, HX, HY, t - 0.25, { n: 8, seed: 5, size: 60, spread: 260 });
        FX.sparkle(ctx, a.eyeR[0], a.eyeR[1] - 8, 30 + 10 * Math.sin(t * 20), {});
        ctx.restore();
        FX.sfx(ctx, 'WHOOSH!', 780, 1330, t, 0, { size: 110, fill: '#ffffff', shadowColor: '#2a6bd6', rot: -0.2 });
        return;
      }

      // ------------------------------------------------------------------ hero phase
      const ht = t - B_HERO;
      const [sx, sy] = FX.shakeMany(t, [[B_HERO, 0.45, 30], [B_SECOND, 0.45, 26]], 4);
      const z = 1.0 + 0.05 * LIB.ease.outCubic(clamp(ht / 3.5)) + (ht < 0.1 ? 0.04 : 0);
      ctx.save();
      ctx.translate(540 + sx, 1300 + sy);
      ctx.rotate(-0.035);
      ctx.scale(z, z);
      ctx.translate(-540, -1300);

      if (impactFrame) {
        FX.impact(ctx, { cx: GX, cy: 900, invert: false, seed: 21 });
        FILM.cast.hayk(ctx, { x: GX, y: GY, s: GS, t, pose: 'fist', face: 'determined', silhouette: '#0a0a10' });
        ctx.restore();
      } else {
        ctx.drawImage(heroBg(), -60, -60, W + 120, H + 120);
        // big faint katakana DON behind
        FX.text(ctx, 'ドン', 235, 830, { size: 200, fill: '#ff5a1a', stroke: '#1c0410', lw: 10, alpha: 0.28, font: 'jp', rot: -0.15 });
        // sunburst + focus lines converging above his fist
        ctx.save();
        ctx.fillStyle = 'rgba(255,90,26,0.28)';
        ctx.beginPath();
        for (let i = 0; i < 22; i++) {
          const a0 = ht * 0.3 + (i / 22) * TAU, a1 = a0 + TAU / 44;
          ctx.moveTo(GX, 900);
          ctx.lineTo(GX + Math.cos(a0) * 2400, 900 + Math.sin(a0) * 2400);
          ctx.lineTo(GX + Math.cos(a1) * 2400, 900 + Math.sin(a1) * 2400);
          ctx.closePath();
        }
        ctx.fill();
        ctx.restore();
        FX.focusLines(ctx, GX, 920, { inner: 470 + 30 * FX.beatPulse(t, 0.5, 0.15), rx: 520, ry: 640, count: 110, color: '#ff4a1a', alpha: 0.85, seed: 33, width: 22 });
        FX.focusLines(ctx, GX, 920, { inner: 560, rx: 600, ry: 720, count: 60, color: '#1c0410', alpha: 0.6, seed: 34, width: 16 });
        // aura
        FX.aura(ctx, GX, GY + 10, 860, 1450, t, { color: '#ffa51a', core: '#fff0a0', alpha: 0.9 });
        // wind streaks (right -> left)
        FX.speedLines(ctx, { x: 0, y: 300, w: W, h: 1500, angle: Math.PI, count: 22, color: '#ffe3b0', alpha: 0.45, t, speed: 2400, len: 360, width: 7, seed: 44 });
        // embers
        for (let i = 0; i < 26; i++) {
          const per = 1.2 + h01(ID, 'ep', i) * 1.2;
          const ph = ((ht / per + h01(ID, 'eo', i)) % 1 + 1) % 1;
          const ex = GX - 500 + h01(ID, 'ex', i) * 1000 - ph * 300;
          const ey = 1880 - ph * 1500 - h01(ID, 'ey', i) * 200;
          const r = (3 + h01(ID, 'er', i) * 7) * (1 - ph * 0.6);
          ctx.fillStyle = i % 3 ? '#ffd23a' : '#ffffff';
          ctx.globalAlpha = 1 - ph;
          ctx.beginPath(); ctx.arc(ex, ey, r, 0, TAU); ctx.fill();
        }
        ctx.globalAlpha = 1;
        // Hayk: landing squash on the cut, hop on each shake beat
        const d = Math.floor(ht * 12 + 1e-6);
        const d2 = Math.floor((t - B_SECOND) * 12 + 1e-6);
        let sq = [[1.06, 0.92], [1.06, 0.92], [1, 1]][Math.min(2, d)];
        if (t >= B_SECOND) sq = [[1.05, 0.94], [1.02, 0.98], [1, 1]][Math.min(2, d2)];
        const breathe = 1 + 0.012 * Math.sin(ht * 5);
        // power burst behind the raised fist (fist sits near (GX + 150, GY - 1010) in this pose)
        FX.burst(ctx, GX + 150, GY - 1010, 150 + 30 * FX.beatPulse(t, 0.5, 0.2), 80, 12, 'rgba(255,236,140,0.9)', { seed: 8, lw: 0 });
        ctx.save();
        ctx.translate(GX, GY);
        ctx.scale(sq[0], sq[1] * breathe);
        ctx.translate(-GX, -GY);
        const hoodieWind = Math.sin(tw * 9) * 0.015;
        // t offset keeps the auto-blink out of the hero window (it falls on 0.40-0.49, before the cut)
        const a = FILM.cast.hayk(ctx, { x: GX, y: GY, s: GS, t: t + 2.18, pose: 'fist', face: 'determined', belly: 0, tilt: hoodieWind, look: [0, -0.2] });
        ctx.restore();
        // power crackle near the fist
        const fist = a.handR;
        FX.sparkle(ctx, fist[0] + 40, fist[1] - 40, 46 * (0.7 + 0.3 * FX.beatPulse(t, 0.5, 0.2)), { rot: ht });
        // eye glints (pulse on the beats)
        const gl = 0.6 + 0.4 * FX.beatPulse(t, 0.5, 0.2);
        FX.sparkle(ctx, a.eyeL[0] - 8, a.eyeL[1] - 14, 30 * gl, { rot: ht * 2 });
        FX.sparkle(ctx, a.eyeR[0] - 8, a.eyeR[1] - 14, 40 * gl, { rot: -ht * 2, color: '#fff3a0' });
        // dust from the stomp
        FX.dust(ctx, GX, GY, ht + 0.12, { n: 10, seed: 12, size: 70, spread: 480, color: '#ffd9b0', line: 'rgba(120,20,30,0.5)' });
        if (ht < 0.6) FX.shockRing(ctx, GX, GY - 20, ht, { r: 700, color: '#ffe066', life: 0.6, width: 18, squash: 0.25 });
        if (t >= B_SECOND && t < B_SECOND + 0.6) FX.shockRing(ctx, a.head[0], a.head[1], t - B_SECOND, { r: 500, color: '#ffffff', life: 0.6, width: 14 });
        ctx.restore();
      }

      // screen-fixed: bubbles and map
      const mouth = [GX - 10, 1080];
      FX.bubble(ctx, "I'M GOING TO SPAIN!", 540, 455, { size: 74, maxW: 500, shout: true, t, t0: B_HERO - FR, tail: [mouth[0] - 40, 860], fill: '#ffffff', shake: 6 });
      FX.bubble(ctx, '...TO FIND INVESTORS!', 250, 1130, { size: 46, maxW: 330, t, t0: B_SECOND - FR, tail: [mouth[0] - 120, 1070] });
      if (!impactFrame) worldMap(ctx, t);
      if (impactFrame) FX.flash(ctx, 0.15, '#ffffff');
      if (t >= B_SECOND && t < B_SECOND + 2 * FR) FX.flash(ctx, 0.35, '#fff1c0');
    },
  });
})();

</script>
<script>
// ---- src/scenes/04-goofy-knows.js
/*
 * Shot 04 'goofy-knows' : Goofy sees the suitcase. T 13.0 - 17.0 (local 0 - 4 s).
 *
 * Beats (local t):
 *   0.0  hallway, daylight; packed suitcase with an airplane tag by the front door; Goofy sits and
 *        stares at it (curious head tilt, "?" mark)
 *   1.0  face -> "sad": trembling tear-filled eyes, ears droop; camera starts pushing in on Goofy
 *   2.0  soft pink sparkle backdrop fades in (shoujo mode), light blue gloom lines above his head,
 *        thought bubble "...you're leaving me?"
 *   3.0  Hayk's giant legs step in at the right edge (cropped, feet visible), stomp dust, big sweat drop
 *
 * Layers (back to front):
 *   1. ceiling + wall + wainscot + door + wall props (picture of Ararat, hooks with the red leash, lamp)
 *   2. sunbeam washes, floor planks, rug, doormat, bowl
 *   3. suitcase with airplane tag
 *   4. pink sparkle backdrop (from 2.0)
 *   5. Goofy + eye overlays, gloom lines, sweat
 *   6. dust motes (camera space)
 *   7. screen-space: Hayk's legs (from 3.0), sweat drop, thought bubble, vignette
 */
(function () {
  'use strict';
  const ID = 'goofy-knows';
  const FILM = window.FILM;
  const LIB = FILM.lib;
  const F = FILM.fx;
  const P = F.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, v) => { const u = clamp((v - a) / (b - a)); return u * u * (3 - 2 * u); };
  const h01 = (...k) => F.h01(ID, ...k);

  // beats (local)
  const B_SAD = 1.0; // T 14.0
  const B_PINK = 2.0; // T 15.0
  const B_STEP = 3.0; // T 16.0 footsteps

  // world layout
  const FLOOR_Y = 1240;
  const DOOR = { x: 96, y: 520, w: 350, h: FLOOR_Y - 520 };
  const SUIT = { x: 300, y: 1440, s: 1.3 };
  const GOOFY = { x: 735, y: 1520, s: 1.7 };

  // colours local to this hallway
  const COL = {
    ceil: '#f3dfc2', wall: '#fbeedb', wallShade: '#efd9ba', wains: '#e7cfa8', wainsShade: '#d7b98c', trim: '#fff7ea',
    door: '#c3773f', doorShade: '#a35e2d', doorFrame: '#8a5230', floor: '#d49a62', floorShade: '#bf844f', floorLine: '#a86f3e',
    rug: '#8cc3e6', rugStripe: '#5f9fd0', mat: '#9b6b3e', brass: '#f2c14e',
  };

  function wallLayer(ctx, t) {
    // ceiling band and crown molding
    ctx.fillStyle = COL.ceil;
    ctx.fillRect(-200, -200, 1480, 330);
    ctx.fillStyle = COL.wall;
    ctx.fillRect(-200, 130, 1480, FLOOR_Y - 130);
    // soft vertical shading on the wall
    const g = ctx.createLinearGradient(0, 130, 0, FLOOR_Y);
    g.addColorStop(0, 'rgba(230,200,160,0.35)');
    g.addColorStop(1, 'rgba(230,200,160,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-200, 130, 1480, 400);
    F.rrect(ctx, -200, 112, 1480, 30, 4); F.fo(ctx, COL.trim, 4);
    ctx.fillStyle = COL.wallShade; ctx.fillRect(-200, 142, 1480, 10);
    // wallpaper: faint vertical pinstripes with tiny diamonds
    ctx.fillStyle = 'rgba(214,176,128,0.28)';
    for (let x = -180; x < 1280; x += 64) ctx.fillRect(x, 152, 5, 820);
    ctx.fillStyle = 'rgba(214,176,128,0.35)';
    ctx.beginPath();
    for (let x = -148; x < 1280; x += 64) for (let y = 200; y < 960; y += 96) { ctx.moveTo(x, y - 8); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 8); ctx.lineTo(x - 6, y); ctx.closePath(); }
    ctx.fill();
    // wainscot panels below the chair rail
    ctx.fillStyle = COL.wains;
    ctx.fillRect(-200, 975, 1480, FLOOR_Y - 975);
    for (let i = 0; i < 6; i++) {
      const px = 470 + i * 200;
      F.rrect(ctx, px, 1015, 160, 170, 8); F.fo(ctx, COL.wainsShade, 3, 'rgba(27,20,36,0.35)');
      ctx.fillStyle = COL.wains; ctx.fillRect(px + 8, 1023, 144, 154);
    }
    F.rrect(ctx, -200, 962, 1480, 22, 4); F.fo(ctx, COL.trim, 4);
    // baseboard
    F.rrect(ctx, -200, FLOOR_Y - 36, 1480, 40, 2); F.fo(ctx, COL.trim, 4);

    // --- front door with frame
    const d = DOOR;
    F.rrect(ctx, d.x - 34, d.y - 34, d.w + 68, d.h + 40, 6); F.fo(ctx, COL.trim, 5);
    F.rrect(ctx, d.x - 12, d.y - 12, d.w + 24, d.h + 12, 4); F.fo(ctx, COL.doorFrame, 4);
    F.rrect(ctx, d.x, d.y, d.w, d.h, 4); F.fo(ctx, COL.door, 5);
    // panels
    [[d.x + 40, d.y + 50, 110, 250], [d.x + 200, d.y + 50, 110, 250], [d.x + 40, d.y + 360, 110, 300], [d.x + 200, d.y + 360, 110, 300]].forEach(([x, y, w, h]) => {
      F.rrect(ctx, x, y, w, h, 6); F.fo(ctx, COL.doorShade, 3.5);
      ctx.fillStyle = COL.door; ctx.fillRect(x + 10, y + 10, w - 20, h - 20);
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x + 10, y + 10, 10, h - 20);
    });
    // peephole, handle, deadbolt
    F.ellipse(ctx, d.x + d.w / 2, d.y + 330, 11, 11); F.fo(ctx, COL.brass, 3.5);
    F.ellipse(ctx, d.x + d.w - 42, d.y + 380, 20, 20); F.fo(ctx, COL.brass, 4);
    F.rrect(ctx, d.x + d.w - 50, d.y + 376, 44, 12, 5); F.fo(ctx, COL.brass, 3);
    F.ellipse(ctx, d.x + d.w - 42, d.y + 450, 12, 12); F.fo(ctx, COL.brass, 3.5);
    // door number plate
    F.rrect(ctx, d.x + d.w / 2 - 40, d.y + 16, 80, 26, 6); F.fo(ctx, COL.brass, 3);

    // --- framed picture of Ararat
    const px = 560, py = 360, pw = 300, ph = 210;
    F.rrect(ctx, px - 16, py - 16, pw + 32, ph + 32, 6); F.fo(ctx, '#6b4a2e', 5);
    ctx.save();
    ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
    F.sky(ctx, '#ffb27a', '#ffe3b0', { x: px, y: py, w: pw, h: ph });
    ctx.fillStyle = '#fff1c8'; ctx.beginPath(); ctx.arc(px + 230, py + 70, 26, 0, TAU); ctx.fill();
    F.ararat(ctx, px - 10, py + ph - 20, pw + 20, 150, {});
    ctx.fillStyle = '#7fae6a'; ctx.fillRect(px, py + ph - 26, pw, 26);
    ctx.restore();
    ctx.strokeStyle = P.line; ctx.lineWidth = 4; ctx.strokeRect(px, py, pw, ph);
    // tiny photo of Hayk + Goofy (heart frame) next to it
    F.rrect(ctx, 905, 420, 120, 150, 8); F.fo(ctx, '#ff9ab8', 4);
    F.rrect(ctx, 917, 432, 96, 126, 6); F.fo(ctx, '#fff5e8', 3);
    F.heart(ctx, 965, 500, 1.2, '#ff6f96', 3);

    // --- coat hooks with the red leash and Hayk's cap
    F.rrect(ctx, 600, 720, 420, 30, 8); F.fo(ctx, '#8a5a3a', 4);
    for (let i = 0; i < 4; i++) { F.ellipse(ctx, 650 + i * 110, 735, 11, 11); F.fo(ctx, COL.brass, 3); }
    // leash loops hanging from the second hook (sways a little)
    const sw = Math.sin(t * 2.2) * 6;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(760, 740); ctx.bezierCurveTo(720 + sw, 860, 800 + sw, 900, 770 + sw, 960);
    ctx.moveTo(760, 740); ctx.bezierCurveTo(800 + sw, 830, 740 + sw, 900, 770 + sw, 960);
    ctx.strokeStyle = P.line; ctx.lineWidth = 13; ctx.stroke();
    ctx.strokeStyle = P.leash; ctx.lineWidth = 7; ctx.stroke();
    ctx.restore();
    F.ellipse(ctx, 770 + sw, 966, 12, 12); F.fo(ctx, '#c9ccd6', 3.5);
    // cap on the fourth hook
    ctx.beginPath(); ctx.moveTo(930, 745); ctx.bezierCurveTo(930, 680, 1030, 680, 1030, 745); ctx.closePath(); F.fo(ctx, P.hoodie, 4);
    F.rrect(ctx, 900, 738, 70, 16, 8); F.fo(ctx, P.hoodieShade, 3.5);
    F.ellipse(ctx, 980, 712, 12, 12); F.fo(ctx, P.lsBlue, 3);

    // --- wall lamp above the picture, glowing
    const lg = ctx.createRadialGradient(710, 270, 10, 710, 270, 190);
    lg.addColorStop(0, 'rgba(255,236,170,0.65)');
    lg.addColorStop(1, 'rgba(255,236,170,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(710, 270, 190, 0, TAU); ctx.fill();
    F.rrect(ctx, 698, 240, 24, 40, 6); F.fo(ctx, '#8a5a3a', 3.5);
    ctx.beginPath(); ctx.moveTo(660, 290); ctx.lineTo(760, 290); ctx.lineTo(735, 230); ctx.lineTo(685, 230); ctx.closePath(); F.fo(ctx, '#fff2c8', 4);

    // --- ceiling light fixture
    ctx.strokeStyle = P.line; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(330, -60); ctx.lineTo(330, 60); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(270, 60); ctx.quadraticCurveTo(330, 20, 390, 60); ctx.lineTo(370, 90); ctx.lineTo(290, 90); ctx.closePath(); F.fo(ctx, '#ffffff', 4);
  }

  function floorLayer(ctx, t) {
    ctx.fillStyle = COL.floor;
    ctx.fillRect(-200, FLOOR_Y, 1480, 1000);
    // planks converge to a vanishing point above the floor line
    const vx = 540, vy = 420;
    ctx.strokeStyle = COL.floorLine; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = -14; i <= 14; i++) {
      const xTop = vx + i * 95 * ((FLOOR_Y - vy) / (FLOOR_Y + 400 - vy));
      const k = (2300 - vy) / (FLOOR_Y - vy);
      ctx.moveTo(xTop, FLOOR_Y);
      ctx.lineTo(vx + (xTop - vx) * k, 2300);
    }
    ctx.stroke();
    // plank ends (staggered short cross lines)
    ctx.beginPath();
    for (let r = 0; r < 7; r++) {
      const y = FLOOR_Y + 30 + r * r * 16 + r * 36;
      for (let i = -12; i <= 12; i++) {
        if (h01('pl', r, i) < 0.55) continue;
        const u = (y - vy) / (FLOOR_Y - vy);
        const x0 = vx + i * 95 * ((FLOOR_Y - vy) / (FLOOR_Y + 400 - vy)) * u;
        const x1 = vx + (i + 1) * 95 * ((FLOOR_Y - vy) / (FLOOR_Y + 400 - vy)) * u;
        ctx.moveTo(x0, y); ctx.lineTo(x1, y);
      }
    }
    ctx.stroke();
    // floor shading toward the camera
    const g = ctx.createLinearGradient(0, FLOOR_Y, 0, 1920);
    g.addColorStop(0, 'rgba(120,70,30,0.25)');
    g.addColorStop(0.3, 'rgba(120,70,30,0)');
    g.addColorStop(1, 'rgba(90,50,20,0.25)');
    ctx.fillStyle = g;
    ctx.fillRect(-200, FLOOR_Y, 1480, 1000);
    // doormat in front of the door
    ctx.beginPath(); ctx.moveTo(150, 1262); ctx.lineTo(450, 1262); ctx.lineTo(480, 1330); ctx.lineTo(120, 1330); ctx.closePath(); F.fo(ctx, COL.mat, 4);
    ctx.strokeStyle = 'rgba(60,35,15,0.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); for (let i = 0; i < 12; i++) { const x = 160 + i * 26; ctx.moveTo(x, 1270); ctx.lineTo(x - 8 + i * 0.5, 1322); } ctx.stroke();
    // round rug under Goofy
    F.ellipse(ctx, GOOFY.x - 10, GOOFY.y + 10, 330, 78); F.fo(ctx, COL.rug, 4);
    ctx.save();
    F.ellipse(ctx, GOOFY.x - 10, GOOFY.y + 10, 330, 78); ctx.clip();
    ctx.strokeStyle = COL.rugStripe; ctx.lineWidth = 10;
    for (let k = 1; k <= 3; k++) { F.ellipse(ctx, GOOFY.x - 10, GOOFY.y + 10, 330 - k * 60, 78 - k * 15); ctx.stroke(); }
    ctx.restore();
    // shoes by the door (a pair of Hayk's sneakers)
    [[480, 1300, -0.08], [560, 1318, 0.1]].forEach(([x, y, r]) => {
      ctx.save(); ctx.translate(x, y); ctx.rotate(r);
      ctx.beginPath(); ctx.moveTo(-50, 10); ctx.quadraticCurveTo(-50, -26, -10, -28); ctx.quadraticCurveTo(30, -20, 55, 0); ctx.quadraticCurveTo(58, 14, 40, 16); ctx.lineTo(-44, 16); ctx.closePath(); F.fo(ctx, P.shoe, 4);
      ctx.fillStyle = P.shoeAccent; ctx.fillRect(-40, 4, 84, 8);
      ctx.restore();
    });
    // dog bowl with a bone icon
    F.ellipse(ctx, 1000, 1395, 70, 20); F.fo(ctx, '#e5323a', 4);
    ctx.beginPath(); ctx.moveTo(930, 1395); ctx.lineTo(945, 1440); ctx.quadraticCurveTo(1000, 1456, 1055, 1440); ctx.lineTo(1070, 1395); F.fo(ctx, '#e5323a', 4);
    F.ellipse(ctx, 1000, 1395, 56, 13); F.fo(ctx, '#7a3a1a', 3);
    ctx.fillStyle = '#ffffff';
    F.rrect(ctx, 982, 1418, 36, 9, 4); ctx.fill();
    [[982, 1418], [982, 1427], [1018, 1418], [1018, 1427]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.fill(); });
  }

  // sunbeam washes from a window off-screen top-left, plus dust motes
  function sunbeams(ctx, t, a) {
    ctx.save();
    ctx.globalAlpha = 0.22 * a;
    ctx.fillStyle = '#fff6c8';
    [[-120, 150], [120, 90], [300, 60]].forEach(([x0, w]) => {
      ctx.beginPath();
      ctx.moveTo(x0, 0); ctx.lineTo(x0 + w, 0); ctx.lineTo(x0 + w + 900, 1920); ctx.lineTo(x0 + 900, 1920); ctx.closePath();
      ctx.fill();
    });
    ctx.restore();
  }
  function motes(ctx, t, a) {
    ctx.save();
    ctx.fillStyle = '#fffbe6';
    for (let i = 0; i < 26; i++) {
      const bx = h01('mx', i) * 1000 + 40, by = h01('my', i) * 1300 + 200;
      const x = bx + Math.sin(t * 0.9 + i) * 20 + t * 14, y = by - t * (10 + 16 * h01('ms', i));
      ctx.globalAlpha = a * (0.35 + 0.5 * h01('ma', i)) * (0.6 + 0.4 * Math.sin(t * 3 + i * 1.7));
      ctx.beginPath(); ctx.arc(x, y, 2.5 + 3 * h01('mr', i), 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // shoujo pink sparkle backdrop (screen-covering in world coords around Goofy)
  function pinkBackdrop(ctx, t, a) {
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha = a;
    const cx = GOOFY.x - 20, cy = GOOFY.y - 260;
    const g = ctx.createRadialGradient(cx, cy, 60, cx, cy, 1100);
    g.addColorStop(0, '#fff0f6');
    g.addColorStop(0.45, '#ffc9de');
    g.addColorStop(1, '#f39ac0');
    ctx.fillStyle = g;
    ctx.fillRect(-300, -300, 1700, 2600);
    // soft rotating rays
    ctx.globalAlpha = a * 0.25;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    const rot = t * 0.15;
    for (let i = 0; i < 16; i++) {
      const a0 = rot + (i / 16) * TAU, a1 = a0 + TAU / 40;
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a0) * 2000, cy + Math.sin(a0) * 2000);
      ctx.lineTo(cx + Math.cos(a1) * 2000, cy + Math.sin(a1) * 2000);
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = a;
    F.bokeh(ctx, { n: 22, t, seed: 404, x: -100, y: 200, w: 1300, h: 1500, rMin: 20, rMax: 80, colors: ['#ffffff', '#ffe3ef', '#ffd6f0'], alpha: 0.55 });
    F.sparkles(ctx, { x: 0, y: 300, w: 1080, h: 1200, n: 18, seed: 405, t, size: 34, color: '#ffffff' });
    // floating petals / tiny hearts
    for (let i = 0; i < 8; i++) {
      const u = ((t * 0.25 + h01('pt', i)) % 1 + 1) % 1;
      const x = h01('px', i) * 1100 - 20 + Math.sin(u * 8 + i) * 30;
      const y = 300 + u * 1200;
      ctx.save();
      ctx.translate(x, y); ctx.rotate(u * 6 + i);
      ctx.fillStyle = i % 2 ? '#ff8fb8' : '#ffffff';
      F.ellipse(ctx, 0, 0, 12, 6); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // big wobbling tear pools and highlights over Goofy's open sad eyes
  function tearyEyes(ctx, a, t, s, k) {
    if (k <= 0) return;
    const bi = Math.floor(t * 12 + 1e-6);
    [a.eyeL, a.eyeR].forEach((e, i) => {
      const wob = Math.sin(bi * 2.3 + i) * 1.5 * s;
      ctx.save();
      ctx.globalAlpha = k;
      // welling tear pool inside the lower half of the eye, with a wavy surface
      ctx.fillStyle = 'rgba(120,200,255,0.7)';
      ctx.beginPath();
      ctx.moveTo(e[0] - 15 * s, e[1] + 4 * s);
      ctx.quadraticCurveTo(e[0] - 7 * s, e[1] + (1 + wob * 0.4) * s, e[0], e[1] + 4 * s);
      ctx.quadraticCurveTo(e[0] + 7 * s, e[1] + (7 - wob * 0.4) * s, e[0] + 15 * s, e[1] + 4 * s);
      ctx.quadraticCurveTo(e[0] + 14 * s, e[1] + 20 * s, e[0], e[1] + 21 * s);
      ctx.quadraticCurveTo(e[0] - 14 * s, e[1] + 20 * s, e[0] - 15 * s, e[1] + 4 * s);
      ctx.fill();
      // shimmering highlights (the "huge wobbling eyes")
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(e[0] - 6 * s + wob, e[1] - 8 * s, 7 * s, 9 * s, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(e[0] + 7 * s - wob, e[1] + 4 * s, 3.5 * s, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(e[0] + 2 * s, e[1] - 12 * s + wob, 2.2 * s, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(e[0] - 4 * s, e[1] + 12 * s, 5 * s, 2.5 * s, 0, 0, TAU); ctx.fill();
      // a tear bead at the outer corner that grows
      const grow = clamp((t - B_SAD - 0.4) / 1.2) * k;
      if (grow > 0) {
        const dx = i === 0 ? 17 : -17;
        const r = (4 + 6 * grow) * s;
        ctx.beginPath();
        ctx.moveTo(e[0] + dx * s, e[1] + 10 * s);
        ctx.quadraticCurveTo(e[0] + dx * s + r, e[1] + 16 * s + r, e[0] + dx * s, e[1] + 16 * s + r * 1.8);
        ctx.quadraticCurveTo(e[0] + dx * s - r, e[1] + 16 * s + r, e[0] + dx * s, e[1] + 10 * s);
        F.fo(ctx, P.tear, 2.5);
      }
      ctx.restore();
    });
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tw = LIB.onTwos(t);
      const W = 1080, H = 1920;
      const sad = t >= B_SAD;
      const pinkA = sstep(B_PINK - 0.05, B_PINK + 0.3, t);

      // --- camera: gentle drift, then push-in on Goofy from 1.0, jolt on the footstep
      const push = LIB.ease.inOutCubic(clamp((t - B_SAD) / 2.2));
      const z = lerp(1.14 + 0.03 * clamp(t), 1.8, push);
      const fx = lerp(560, GOOFY.x - 30, push), fy = lerp(1090, GOOFY.y - 280, push);
      const sx = lerp(540, 468, push), sy = lerp(960, 1027, push);
      const [kx, ky] = F.shake(t, B_STEP, 0.35, 16, 7);

      // ---------- world
      ctx.save();
      ctx.translate(sx + kx, sy + ky);
      ctx.scale(z, z);
      ctx.translate(-fx, -fy);

      wallLayer(ctx, t);
      floorLayer(ctx, t);
      sunbeams(ctx, t, 1 - pinkA * 0.8);

      // suitcase with a big airline tag (airplane icon) swinging on the handle
      F.suitcase(ctx, SUIT.x, SUIT.y, SUIT.s, { color: '#e8413c' });
      const sw = Math.sin(tw * 2.6) * 0.12;
      ctx.save();
      ctx.translate(SUIT.x + 58 * SUIT.s, SUIT.y - 390 * SUIT.s);
      ctx.rotate(0.25 + sw);
      ctx.strokeStyle = P.line; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 60); ctx.stroke();
      F.rrect(ctx, -46, 58, 92, 120, 10); F.fo(ctx, '#ffffff', 4);
      ctx.fillStyle = '#2f7de0'; ctx.fillRect(-44, 60, 88, 26);
      F.ellipse(ctx, 0, 70, 7, 7); F.fo(ctx, '#ffffff', 3);
      F.plane(ctx, 0, 130, 0.14, { rot: -0.4 });
      ctx.restore();
      // gleam on the suitcase that catches the light
      F.sparkle(ctx, SUIT.x - 90, SUIT.y - 350, 30 + 10 * Math.sin(t * 5), { rot: t });

      // pink sparkle backdrop covers the hallway from 2.0
      pinkBackdrop(ctx, t, pinkA * 0.94);

      // --- Goofy
      const look = t < B_SAD ? [1, 0.1] : t < B_STEP + 0.1 ? [0.6, -0.1] : [-0.9, -0.8];
      const tiltHead = t < B_SAD ? 0.04 * Math.sin(t * 3) : 0;
      // squash on the face switch and a flinch on the footstep
      const sq = (t >= B_SAD && t < B_SAD + 2 / 12) || (t >= B_STEP && t < B_STEP + 2 / 12) ? 1 : 0;
      const bob = sad ? Math.sin(tw * Math.PI * 2) * 2 : Math.sin(tw * Math.PI) * 4;
      ctx.save();
      ctx.translate(GOOFY.x, GOOFY.y);
      ctx.scale(1 + 0.06 * sq, 1 - 0.08 * sq);
      ctx.translate(-GOOFY.x, -GOOFY.y);
      const ga = FILM.cast.goofy(ctx, {
        x: GOOFY.x, y: GOOFY.y + bob, s: GOOFY.s, flip: true, pose: 'sit', t: tw,
        face: sad ? 'sad' : 'neutral', look, tilt: tiltHead - (sad ? 0.03 : 0),
        blink: t >= B_STEP && t < B_STEP + 0.08,
      });
      ctx.restore();
      tearyEyes(ctx, ga, t, GOOFY.s, sad ? clamp((t - B_SAD) * 6) : 0);

      // curious "?" before he gets it, then "!" snap at the face switch
      if (t < B_SAD) {
        const qy = ga.top[1] - 70 + Math.sin(tw * 6) * 6;
        F.text(ctx, '?', ga.top[0] + 70, qy, { size: 90, fill: '#ffffff', lw: 12, rot: 0.2 });
      } else if (t < B_SAD + 0.6) {
        const k = F.popIn(t, B_SAD);
        F.text(ctx, '!', ga.top[0] + 80, ga.top[1] - 60, { size: 110, fill: P.shout, lw: 14, rot: 0.15, scale: k });
        // shock lines around the head
        ctx.save();
        ctx.strokeStyle = P.line; ctx.lineWidth = 6; ctx.lineCap = 'round';
        for (let i = 0; i < 3; i++) {
          const a = -2.3 + i * 0.35;
          const r0 = 150, r1 = 200;
          ctx.beginPath(); ctx.moveTo(ga.head[0] + Math.cos(a) * r0, ga.head[1] + Math.sin(a) * r0); ctx.lineTo(ga.head[0] + Math.cos(a) * r1, ga.head[1] + Math.sin(a) * r1); ctx.stroke();
        }
        ctx.restore();
      }

      // gloom (anime depression) lines hanging above his head from 2.0
      if (t >= B_PINK) {
        const ga2 = sstep(B_PINK, B_PINK + 0.4, t);
        const top = ga.top[1] - 120;
        ctx.save();
        ctx.beginPath(); ctx.rect(ga.head[0] - 260, top, 520, 150 * ga2 + 10); ctx.clip();
        F.gloom(ctx, ga.head[0] - 190, top, 380, 140, { color: 'rgba(110,170,235,0.9)', count: 11, seed: 44, width: 6 });
        ctx.restore();
        // a dark blue shade dropping over the forehead
        ctx.save();
        ctx.globalAlpha = 0.35 * ga2;
        const sg = ctx.createLinearGradient(0, ga.top[1] - 10, 0, ga.eyeL[1]);
        sg.addColorStop(0, '#3b4c9a'); sg.addColorStop(1, 'rgba(59,76,154,0)');
        ctx.fillStyle = sg;
        F.ellipse(ctx, ga.head[0], ga.head[1] - 30 * GOOFY.s, 80 * GOOFY.s, 55 * GOOFY.s); ctx.fill();
        ctx.restore();
      }
      // sweat drop on Goofy's head when the legs arrive
      if (t >= B_STEP) {
        const k = F.popIn(t, B_STEP + 1 / 12);
        const slide = clamp((t - B_STEP) / 0.9) * 30;
        F.sweat(ctx, ga.top[0] - 120, ga.top[1] + 10 + slide, 1.9 * k, { flip: true });
      }

      motes(ctx, t, 1 - pinkA);
      ctx.restore(); // world camera

      // ---------- screen space: Hayk's legs step in from the right edge at 3.0
      if (t >= B_STEP - 0.2) {
        const u = LIB.ease.outCubic(clamp((t - (B_STEP - 0.2)) / 0.3));
        const hx = lerp(1650, 1230, u) + kx * 0.5;
        // a little hop: lands exactly on the footstep beat
        const hop = t < B_STEP ? -Math.sin(clamp((t - (B_STEP - 0.2)) / 0.2) * Math.PI) * 60 : 0;
        const land = t >= B_STEP && t < B_STEP + 2 / 12;
        // his shadow falls over Goofy
        ctx.save();
        ctx.globalAlpha = 0.28 * u;
        const shg = ctx.createLinearGradient(1080, 0, 250, 0);
        shg.addColorStop(0, '#2a1840'); shg.addColorStop(1, 'rgba(42,24,64,0)');
        ctx.fillStyle = shg;
        ctx.fillRect(0, 0, 1080, 1920);
        ctx.restore();
        F.dust(ctx, hx - 260, 1865, t - B_STEP, { n: 7, size: 60, spread: 260, seed: 71 });
        // legs only: he is cheering (arms up, out of frame) while Goofy sobs
        ctx.save();
        ctx.translate(hx, 1900);
        ctx.scale(land ? 1.05 : 1, land ? 0.94 : 1);
        ctx.translate(-hx, -1900);
        FILM.cast.hayk(ctx, { x: hx, y: 1870 + hop + ky * 0.5, s: 7.5, pose: 'cheer', t: tw, face: 'happy' });
        ctx.restore();
        F.sfx(ctx, 'TMP!', 850, 1330, t, B_STEP, { size: 110, rot: -0.2, fill: '#ffffff', shadowColor: '#6a86c9' });
      }

      // the thought bubble (screen fixed, stays readable during the push-in)
      if (t >= B_PINK) {
        F.bubble(ctx, "...you're leaving me?", 450, 400, {
          think: true, size: 60, maxW: 600, t, t0: B_PINK, tail: [420, 620], fill: '#ffffff', color: '#3b4c9a',
        });
      }

      // big sweat drop on screen next to the bubble when the feet land
      if (t >= B_STEP) {
        const k = F.popIn(t, B_STEP);
        F.sweat(ctx, 700, 700 + clamp((t - B_STEP) / 1) * 40, 2.4 * k);
      }

      // soft vignette, pinker in shoujo mode
      F.vignette(ctx, 0.28, pinkA > 0.5 ? '120,40,90' : '60,30,10');
    },
  });
})();

</script>
<script>
// ---- src/scenes/05-leash-handoff.js
/*
 * Shot 05 'leash-handoff' : Grant takes the leash. T 17.0 - 21.0 (local 0 - 4 s).
 *
 * Beats (local t):
 *   0.0  outside Hayk's Yerevan apartment building, bright day. Hayk (left, "give", "smile") holds
 *        the red leash out; Goofy sits between them looking up at Hayk, "sad"; Grant on the right.
 *   0.5  Hayk: "GRANT, TAKE CARE OF GOOFY. ONE MONTH."
 *   1.0  Grant reaches; the leash handle changes hands at 1.25 (pop + sparkle)
 *   1.5  Grant "thumbsUp", face "confident", leash in his other hand
 *   2.0  Grant: "EASY. WHAT COULD GO WRONG?"
 *   2.5  sparkle "ting" on Grant's glasses and teeth
 *   3.0  ominous: the world dims, camera creeps onto Goofy, who turns to camera with a dark shadow
 *        over his eyes and a small "..." bubble (foreshadowing)
 *
 * Layers (back to front):
 *   1. sky + clouds, far rooftops, Ararat hint
 *   2. apartment building facade (pink tuff): windows, balconies, laundry, AC units, entrance, canopy
 *   3. tree, street lamp, parked taxi, sidewalk tiles, curb
 *   4. suitcase, Hayk, Goofy, Grant, leash
 *   5. ominous dim + Goofy shadow eyes (from 3.0)
 *   6. screen-space bubbles
 */
(function () {
  'use strict';
  const ID = 'leash-handoff';
  const FILM = window.FILM;
  const LIB = FILM.lib;
  const F = FILM.fx;
  const P = F.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const sstep = (a, b, v) => { const u = clamp((v - a) / (b - a)); return u * u * (3 - 2 * u); };
  const h01 = (...k) => F.h01(ID, ...k);

  const B_HAYK = 0.5; // T 17.5
  const B_REACH = 1.0; // T 18.0
  const B_SWAP = 1.25;
  const B_THUMB = 1.5; // T 18.5
  const B_GRANT = 2.0; // T 19.0
  const B_TING = 2.5; // T 19.5
  const B_OMEN = 3.0; // T 20.0

  const GROUND = 1690;
  const HAYK = { x: 255, s: 1.5 };
  const GRANT = { x: 840, s: 1.36 };
  const GOOFY = { x: 548, s: 1.55 };

  const COL = {
    tuff: '#e9b39a', tuffShade: '#d49a82', tuffDark: '#c48670', tuffLine: '#b87a66',
    win: '#9fd4f2', winShade: '#7bb6de', frame: '#fff4e6', rail: '#6f6a7e', walk: '#e6dccb', walkLine: '#cbbfa8',
    curb: '#bdb3a4', road: '#8d8a95',
  };

  // ---------- background pieces (all t-independent except clouds/laundry/leaves)
  function sky(ctx, t) {
    F.sky(ctx, '#58b6ff', P.daySkyLow, { h: 900 });
    // big soft sun glow top-right
    const g = ctx.createRadialGradient(930, 120, 20, 930, 120, 420);
    g.addColorStop(0, 'rgba(255,250,215,0.95)');
    g.addColorStop(0.25, 'rgba(255,245,200,0.45)');
    g.addColorStop(1, 'rgba(255,245,200,0)');
    ctx.fillStyle = g;
    ctx.fillRect(400, -200, 900, 800);
    F.clouds(ctx, { n: 4, seed: 505, t, y: 70, h: 180, speed: 22, scale: 0.8 });
    // Ararat far away, between buildings
    F.ararat(ctx, -120, 470, 620, 300, { color: '#a9b8e0', shade: '#94a4d2', snow: '#f7faff' });
    // far rooftops (flat, soft)
    ctx.fillStyle = '#cfb3c4';
    ctx.fillRect(-20, 390, 220, 200);
    ctx.fillRect(820, 360, 300, 240);
    ctx.fillStyle = '#bfa3b6';
    for (let i = 0; i < 4; i++) ctx.fillRect(850 + i * 60, 400, 26, 34);
    for (let i = 0; i < 3; i++) ctx.fillRect(20 + i * 60, 430, 24, 32);
  }

  function building(ctx, t) {
    const x0 = 60, x1 = 1020, top = 420, base = 1450;
    // roof parapet, antenna, dish
    ctx.strokeStyle = P.line; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(760, top - 10); ctx.lineTo(760, top - 150); ctx.moveTo(730, top - 120); ctx.lineTo(790, top - 120); ctx.moveTo(740, top - 90); ctx.lineTo(780, top - 90); ctx.stroke();
    F.ellipse(ctx, 300, top - 40, 36, 30, -0.5); F.fo(ctx, '#f2f2f2', 4);
    // facade
    F.rrect(ctx, x0, top, x1 - x0, base - top + 60, 4); F.fo(ctx, COL.tuff, 5);
    // stone block texture (tuff blocks)
    ctx.strokeStyle = 'rgba(184,122,102,0.35)'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let r = 0; r * 60 + top < base; r++) {
      const y = top + r * 60;
      ctx.moveTo(x0, y); ctx.lineTo(x1, y);
      for (let c = 0; c < 9; c++) { const x = x0 + ((c * 120 + (r % 2) * 60) % (x1 - x0)); ctx.moveTo(x, y); ctx.lineTo(x, y + 60); }
    }
    ctx.stroke();
    ctx.fillStyle = COL.tuffShade;
    ctx.fillRect(x0, top, x1 - x0, 26);
    F.rrect(ctx, x0 - 16, top - 20, x1 - x0 + 32, 30, 4); F.fo(ctx, COL.tuffDark, 4);

    // windows: two rows, with balconies on the upper row
    const cols = [150, 390, 690, 930];
    cols.forEach((cx, i) => {
      [560, 820].forEach((wy, r) => {
        if (r === 1 && (i === 1 || i === 2)) return; // entrance canopy area
        const ww = 150, wh = 180;
        F.rrect(ctx, cx - ww / 2 - 12, wy - 12, ww + 24, wh + 24, 6); F.fo(ctx, COL.frame, 4);
        F.rrect(ctx, cx - ww / 2, wy, ww, wh, 3); F.fo(ctx, COL.win, 3.5);
        // reflection band + mullion
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath(); ctx.moveTo(cx - ww / 2 + 20, wy); ctx.lineTo(cx - ww / 2 + 60, wy); ctx.lineTo(cx - ww / 2 + 10, wy + wh); ctx.lineTo(cx - ww / 2, wy + wh); ctx.lineTo(cx - ww / 2, wy + 30); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = P.line; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.moveTo(cx, wy); ctx.lineTo(cx, wy + wh); ctx.moveTo(cx - ww / 2, wy + 70); ctx.lineTo(cx + ww / 2, wy + 70); ctx.stroke();
        // curtain in some windows
        if ((i + r) % 2 === 0) {
          ctx.fillStyle = i % 3 ? '#ffd6a8' : '#ffb3c6';
          ctx.beginPath(); ctx.moveTo(cx + 4, wy + 3); ctx.lineTo(cx + ww / 2 - 3, wy + 3); ctx.lineTo(cx + ww / 2 - 3, wy + wh - 3); ctx.quadraticCurveTo(cx + 40, wy + 90, cx + 4, wy + 3); ctx.fill();
        }
        if (r === 0) {
          // balcony slab + railing + flower pots
          F.rrect(ctx, cx - 110, wy + wh + 10, 220, 20, 4); F.fo(ctx, COL.tuffDark, 4);
          ctx.strokeStyle = COL.rail; ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(cx - 104, wy + wh - 70); ctx.lineTo(cx + 104, wy + wh - 70);
          for (let k = 0; k <= 10; k++) { const x = cx - 104 + k * 20.8; ctx.moveTo(x, wy + wh - 70); ctx.lineTo(x, wy + wh + 10); }
          ctx.stroke();
          ctx.strokeStyle = P.line; ctx.lineWidth = 3;
          ctx.strokeRect(cx - 106, wy + wh - 72, 212, 4);
          [[-70, '#ff5f7a'], [-10, '#ffc933'], [55, '#ff8a3d']].forEach(([dx, c], k) => {
            if ((i + k) % 2) return;
            F.rrect(ctx, cx + dx - 18, wy + wh - 104, 36, 32, 5); F.fo(ctx, '#c46a3e', 3);
            ctx.fillStyle = P.tree; ctx.beginPath(); ctx.arc(cx + dx, wy + wh - 112, 20, 0, TAU); ctx.fill();
            ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx + dx - 8, wy + wh - 120, 7, 0, TAU); ctx.arc(cx + dx + 9, wy + wh - 114, 6, 0, TAU); ctx.fill();
          });
        }
      });
    });
    // laundry line between balconies 1 and 2, swaying
    const sway = Math.sin(t * 2.4) * 6;
    ctx.strokeStyle = P.line; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(500, 690); ctx.quadraticCurveTo(540, 730, 580, 690); ctx.stroke();
    [['#ff6b6b', 515], ['#6fc3ff', 548], ['#ffe066', 570]].forEach(([c, x], k) => {
      ctx.save(); ctx.translate(x, 705 + (k === 1 ? 6 : 0)); ctx.rotate((sway + k * 3) * 0.02);
      F.rrect(ctx, -12, 0, 24, 34 + k * 4, 3); F.fo(ctx, c, 3); ctx.restore();
    });
    // AC units
    [[250, 800], [840, 790]].forEach(([x, y]) => {
      F.rrect(ctx, x - 50, y, 100, 64, 6); F.fo(ctx, '#f0f0f0', 4);
      ctx.strokeStyle = 'rgba(27,20,36,0.5)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); for (let k = 0; k < 5; k++) { ctx.moveTo(x - 40, y + 12 + k * 10); ctx.lineTo(x + 40, y + 12 + k * 10); } ctx.stroke();
    });

    // entrance: steps, metal door, canopy, number plate, lamp
    const ex = 540;
    F.rrect(ctx, ex - 180, 1050, 360, 400, 6); F.fo(ctx, COL.tuffDark, 5);
    F.rrect(ctx, ex - 130, 1100, 260, 350, 4); F.fo(ctx, '#4a5b78', 5);
    ctx.strokeStyle = P.line; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(ex, 1100); ctx.lineTo(ex, 1450); ctx.stroke();
    F.rrect(ctx, ex - 110, 1125, 90, 110, 6); F.fo(ctx, '#8fc4e8', 3.5);
    F.rrect(ctx, ex + 20, 1125, 90, 110, 6); F.fo(ctx, '#8fc4e8', 3.5);
    F.rrect(ctx, ex - 40, 1270, 18, 60, 6); F.fo(ctx, '#c9ccd6', 3);
    F.rrect(ctx, ex + 22, 1270, 18, 60, 6); F.fo(ctx, '#c9ccd6', 3);
    // intercom
    F.rrect(ctx, ex + 150, 1210, 40, 70, 6); F.fo(ctx, '#d9d9e0', 3.5);
    // canopy
    ctx.beginPath(); ctx.moveTo(ex - 230, 1050); ctx.lineTo(ex + 230, 1050); ctx.lineTo(ex + 200, 1000); ctx.lineTo(ex - 200, 1000); ctx.closePath(); F.fo(ctx, '#5d6f8f', 5);
    // number plate (decorative, no must-read text)
    F.ellipse(ctx, ex, 960, 42, 28); F.fo(ctx, '#2f5aa8', 4);
    F.ellipse(ctx, ex, 960, 30, 18); F.fo(ctx, '#ffffff', 0);
    ctx.fillStyle = '#2f5aa8'; ctx.fillRect(ex - 14, 952, 28, 6); ctx.fillRect(ex - 14, 964, 28, 6);
    // steps
    F.rrect(ctx, ex - 220, 1450, 440, 40, 4); F.fo(ctx, '#d9cdbd', 4);
    F.rrect(ctx, ex - 260, 1488, 520, 40, 4); F.fo(ctx, '#e6dccb', 4);
  }

  function street(ctx, t) {
    // sidewalk
    ctx.fillStyle = COL.walk;
    ctx.fillRect(-100, 1500, 1300, 500);
    ctx.strokeStyle = COL.walkLine; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let r = 0; r < 6; r++) { const y = 1528 + r * r * 14 + r * 30; ctx.moveTo(-100, y); ctx.lineTo(1200, y); }
    for (let i = -8; i <= 8; i++) { ctx.moveTo(540 + i * 120, 1528); ctx.lineTo(540 + i * 220, 1950); }
    ctx.stroke();
    // shading toward bottom
    const g = ctx.createLinearGradient(0, 1500, 0, 1920);
    g.addColorStop(0, 'rgba(120,90,70,0.18)'); g.addColorStop(0.3, 'rgba(120,90,70,0)'); g.addColorStop(1, 'rgba(90,60,50,0.18)');
    ctx.fillStyle = g; ctx.fillRect(-100, 1500, 1300, 500);
    // building base shadow line
    ctx.fillStyle = 'rgba(80,50,50,0.22)';
    ctx.fillRect(-100, 1500, 1300, 18);
  }

  function tree(ctx, t, x, y, s, seed) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-12, -260); ctx.lineTo(12, -260); ctx.lineTo(20, 0); ctx.closePath(); F.fo(ctx, P.trunk, 4);
    const sw = Math.sin(t * 1.6 + seed) * 4;
    const blobs = [[0, -330, 110], [-90, -290, 80], [90, -290, 85], [-50, -400, 80], [60, -400, 80], [0, -460, 70]];
    ctx.beginPath();
    blobs.forEach(([bx, by, r]) => { ctx.moveTo(bx + sw + r, by); ctx.arc(bx + sw, by, r, 0, TAU); });
    ctx.fillStyle = P.treeShade; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = P.line; ctx.stroke();
    ctx.beginPath();
    blobs.forEach(([bx, by, r]) => { ctx.moveTo(bx + sw - 10 + r * 0.8, by - 12); ctx.arc(bx + sw - 10, by - 12, r * 0.8, 0, TAU); });
    ctx.fillStyle = P.tree; ctx.fill();
    ctx.restore();
  }

  function lamp(ctx, x, y) {
    ctx.strokeStyle = P.line; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 700); ctx.quadraticCurveTo(x, y - 760, x - 60, y - 760); ctx.stroke();
    ctx.strokeStyle = '#4a4f63'; ctx.lineWidth = 9; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 100, y - 740); ctx.lineTo(x - 30, y - 740); ctx.lineTo(x - 45, y - 710); ctx.lineTo(x - 85, y - 710); ctx.closePath(); F.fo(ctx, '#4a4f63', 4);
    F.ellipse(ctx, x - 65, y - 705, 16, 8); F.fo(ctx, '#fff3b0', 3);
  }

  // falling leaves drifting across (moving element)
  function leaves(ctx, t) {
    for (let i = 0; i < 7; i++) {
      const per = 3.2 + h01('lp', i) * 1.5;
      const u = ((t / per + h01('lo', i)) % 1 + 1) % 1;
      const x = -60 + u * 1200 + Math.sin(u * 9 + i) * 40;
      const y = 300 + h01('ly', i) * 900 + u * 260 + Math.sin(u * 12 + i) * 30;
      ctx.save(); ctx.translate(x, y); ctx.rotate(u * 9 + i);
      F.ellipse(ctx, 0, 0, 14, 7); F.fo(ctx, i % 2 ? '#8fd16a' : '#ffc94d', 2.5);
      ctx.restore();
    }
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tw = LIB.onTwos(t);
      const omen = sstep(B_OMEN - 0.05, B_OMEN + 0.35, t);

      // camera: slow push from the whole group, then creep onto Goofy from 3.0
      const zc = lerp(1.0, 1.05, LIB.ease.inOutSine(clamp(t / 3))) + 0.95 * LIB.ease.outCubic(clamp((t - B_OMEN) / 0.5));
      const fx = lerp(540, GOOFY.x - 50, omen), fy = lerp(1150, 1430, omen);
      const [kx, ky] = F.shake(t, B_OMEN, 0.3, 8, 5);
      const toScreen = (p) => [540 + kx + (p[0] - fx) * zc, 1150 + ky + (p[1] - fy) * zc];

      ctx.save();
      ctx.translate(540 + kx, 1150 + ky);
      ctx.scale(zc, zc);
      ctx.translate(-fx, -fy);

      // parallax: sky/far layer drifts less
      ctx.save();
      ctx.translate((fx - 540) * 0.4, (fy - 1150) * 0.3);
      sky(ctx, t);
      ctx.restore();
      building(ctx, t);
      tree(ctx, t, -10, 1520, 1.25, 1);
      lamp(ctx, 1020, 1540);
      street(ctx, t);
      // parked taxi peeking at the right edge (off to the airport soon)
      ctx.save();
      ctx.translate(1010, 1560);
      F.rrect(ctx, 0, -150, 300, 120, 30); F.fo(ctx, '#ffd23f', 5);
      F.rrect(ctx, 30, -210, 190, 80, 24); F.fo(ctx, '#ffd23f', 5);
      F.rrect(ctx, 50, -196, 70, 56, 10); F.fo(ctx, '#9fd4f2', 3.5);
      F.ellipse(ctx, 70, -30, 40, 40); F.fo(ctx, '#2a2a33', 5);
      F.ellipse(ctx, 70, -30, 16, 16); F.fo(ctx, '#c9ccd6', 3);
      F.rrect(ctx, 90, -236, 70, 26, 6); F.fo(ctx, '#ffffff', 4);
      ctx.restore();

      // ---------- characters
      // suitcase behind Hayk
      F.suitcase(ctx, 90, GROUND - 6, 0.95, { color: '#e8413c' });

      // Hayk: holds the leash out (hand bobs as he speaks)
      const talk = t >= B_HAYK && t < B_HAYK + 1.6;
      const hBob = Math.sin(tw * Math.PI * 2) * 5;
      const ha = FILM.cast.hayk(ctx, {
        x: HAYK.x, y: GROUND, s: HAYK.s, pose: t < B_OMEN ? 'give' : 'stand', face: t < B_OMEN ? 'smile' : 'happy', t: tw,
        tilt: talk ? Math.sin(tw * 9) * 0.015 : 0,
      });
      void hBob;

      // Grant: reaches (flip give) until 1.5, then thumbs up (squash on the switch)
      const thumb = t >= B_THUMB;
      const gsq = thumb && t < B_THUMB + 2 / 12;
      ctx.save();
      ctx.translate(GRANT.x, GROUND);
      ctx.scale(gsq ? 1.05 : 1, gsq ? 0.93 : 1);
      ctx.translate(-GRANT.x, -GROUND);
      const reachU = LIB.ease.outBack(clamp((t - B_REACH + 0.1) / 0.25));
      const ga = FILM.cast.grant(ctx, {
        x: GRANT.x - (thumb ? 0 : 20 * reachU), y: GROUND, s: GRANT.s,
        pose: thumb ? 'thumbsUp' : t >= B_REACH - 0.1 ? 'give' : 'stand', flip: !thumb,
        face: 'confident', t: tw + 0.7,
      });
      ctx.restore();

      // Goofy between them: looks up at Hayk (sad), then turns to camera at 3.0
      const turned = t >= B_OMEN;
      const gy = GROUND + 10;
      const gsq2 = turned && t < B_OMEN + 2 / 12;
      ctx.save();
      ctx.translate(GOOFY.x, gy);
      ctx.scale(gsq2 ? 1.04 : 1, gsq2 ? 0.95 : 1);
      ctx.translate(-GOOFY.x, -gy);
      const go = FILM.cast.goofy(ctx, {
        x: GOOFY.x, y: gy, s: GOOFY.s, flip: true, pose: 'sit', t: tw,
        face: turned ? 'neutral' : 'sad', look: turned ? [-0.2, 0.1] : [0.7, -1], blink: false,
      });
      ctx.restore();

      // leash: Hayk's hand until the swap, then Grant's hand
      const holder = t < B_SWAP ? ha.handR : thumb ? ga.handL : ga.handL;
      F.leash(ctx, go.collar, holder, { sag: t < B_SWAP ? 90 : 120 });
      // leash handle loop at the hand
      F.ellipse(ctx, holder[0], holder[1] + 10, 16, 20); ctx.lineWidth = 11; ctx.strokeStyle = P.line; ctx.stroke(); ctx.lineWidth = 6; ctx.strokeStyle = P.leash; ctx.stroke();
      if (t >= B_SWAP && t < B_SWAP + 0.5) {
        const k = F.popIn(t, B_SWAP);
        F.burst(ctx, holder[0], holder[1], 70 * k, 40 * k, 10, '#fff3a0', { lw: 4, seed: 51 });
        F.sparkle(ctx, holder[0] + 30, holder[1] - 40, 40 * k, { rot: t * 2 });
      }

      // Goofy sad tear glints before the omen
      if (!turned) {
        F.sparkle(ctx, go.eyeL[0] - 6, go.eyeL[1] - 8, 12 + 5 * Math.sin(t * 9), { glow: false });
        F.sweat(ctx, go.top[0] + 70, go.top[1] + 20, 0.9);
      }

      // teeth + glasses ting at 2.5
      if (t >= B_TING - 1 / 12) {
        const age = t - B_TING;
        const r = age < 0 ? 20 : 70 * Math.max(0, 1 - Math.abs(age - 0.15) / 0.5) + 18;
        F.sparkle(ctx, ga.eyeR[0] + 18, ga.eyeR[1] - 14, r, { rot: age * 3 });
        F.sparkle(ctx, ga.mouth[0] + 16, ga.mouth[1] + 2, r * 0.75, { rot: -age * 3, color: '#fffbd0' });
      }

      // ---------- ominous beat: world dims, Goofy's eyes go dark
      if (omen > 0) {
        ctx.save();
        ctx.globalAlpha = 0.5 * omen;
        const g = ctx.createRadialGradient(go.head[0], go.head[1], 120, go.head[0], go.head[1], 900);
        g.addColorStop(0, 'rgba(40,20,70,0.1)');
        g.addColorStop(1, 'rgba(30,10,50,1)');
        ctx.fillStyle = g;
        ctx.fillRect(-400, -400, 1900, 2800);
        ctx.restore();
        // shadow band over the upper face
        ctx.save();
        const hs = GOOFY.s;
        F.ellipse(ctx, go.head[0], go.head[1] - 8 * hs, 70 * hs, 66 * hs);
        ctx.clip();
        ctx.globalAlpha = 0.85 * omen;
        const sg = ctx.createLinearGradient(0, go.head[1] - 80 * hs, 0, go.head[1] + 12 * hs);
        sg.addColorStop(0, '#1a0b24'); sg.addColorStop(0.75, '#2a1440'); sg.addColorStop(1, 'rgba(42,20,64,0)');
        ctx.fillStyle = sg;
        ctx.fillRect(go.head[0] - 100 * hs, go.head[1] - 100 * hs, 200 * hs, 115 * hs);
        ctx.restore();
        // eye glints in the shadow
        ctx.save();
        ctx.globalAlpha = omen;
        [go.eyeL, go.eyeR].forEach((e) => {
          ctx.fillStyle = 'rgba(255,40,70,0.35)';
          ctx.beginPath(); ctx.arc(e[0], e[1], 16, 0, TAU); ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.ellipse(e[0], e[1], 7, 4, 0, 0, TAU); ctx.fill();
        });
        ctx.restore();
      }

      leaves(ctx, t);
      ctx.restore(); // camera

      // ---------- screen space: bubbles (outside the camera so they stay put)
      const hHead = toScreen(ha.head), gHead = toScreen(ga.head), dHead = toScreen(go.top);
      if (t >= B_HAYK && t < B_OMEN) {
        F.bubble(ctx, 'GRANT, TAKE CARE OF GOOFY. ONE MONTH.', 400, 300, {
          size: 54, maxW: 640, t, t0: B_HAYK, tail: [hHead[0] + 20, hHead[1] - 150],
        });
      }
      if (t >= B_GRANT) {
        F.bubble(ctx, 'EASY. WHAT COULD GO WRONG?', 690, 560, {
          size: 56, maxW: 470, t, t0: B_GRANT, tail: [Math.min(gHead[0], 900), gHead[1] - 140 * (t < B_OMEN ? 1 : 1.3)],
        });
      }
      if (t >= B_OMEN) {
        F.bubble(ctx, '...', 850, 900, { size: 90, t, t0: B_OMEN + 0.15, tail: [dHead[0] + 190, dHead[1] + 60], fill: '#ffffff', color: '#2a1440', pad: 30 });
      }
      F.vignette(ctx, 0.18 + 0.35 * omen, omen > 0.5 ? '30,10,50' : '40,30,60');
    },
  });
})();

</script>
<script>
// ---- src/scenes/06-takeoff.js
/*
 * Shot 06 'takeoff' : Takeoff to Spain. T 21.0 - 26.0 (local 0 - 5 s).
 *
 * Beats (local t):
 *   0.0  Zvartnots runway at sunset, Ararat huge behind. The white plane rolls left to right,
 *        accelerating, speed lines growing. Porthole inset: Hayk in the window, sunglasses, grinning.
 *   1.0  (T 22.0) TAKEOFF: wheels leave the runway, flash, dust, "WHOOSH!" and the nose pitches up
 *   2.5  (T 23.5) whip-pan up: vertical speed-line wipe carries us to a stylised map of Europe
 *   2.75 caption "YEREVAN -> SPAIN"; 3.25 caption "1 MONTH. MISSION: INVESTORS."
 *   3.0 - 4.5 (T 24.0 - 25.5) the plane icon flies the dotted arc Armenia -> Spain; arrival pop at 4.5
 *
 * Layers (back to front), runway part:
 *   1. sunset sky, sun, pink clouds   2. Ararat   3. foothills + Zvartnots terminal, tower, hangars
 *   4. grass, runway, edge lights     5. plane (gear, tiny face in window)   6. speed lines, dust
 *   7. porthole inset with Hayk (screen space)   8. SFX
 * Map part: dark sky + stars, map panel (sea, land, seas, highlighted Spain + Armenia, grid, Ararat
 *   icon, burger icon), dotted arc, plane icon, flags, captions.
 */
(function () {
  'use strict';
  const ID = 'takeoff';
  const FILM = window.FILM;
  const LIB = FILM.lib;
  const F = FILM.fx;
  const P = F.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const h01 = (...k) => F.h01(ID, ...k);

  const B_LIFT = 1.0; // T 22.0
  const B_WHIP = 2.5; // T 23.5
  const B_CAP1 = 2.75;
  const B_FLY0 = 3.0; // T 24.0
  const B_CAP2 = 3.25;
  const B_FLY1 = 4.5; // T 25.5
  const WHIP_DUR = 0.4;

  // ------------------------------------------------------------------ runway world
  const RUNWAY_Y = 1400; // plane wheels touch here (screen y before the tilt)
  // distance the camera has travelled (px) with the plane: accelerating
  const travel = (t) => 380 * t + 520 * t * t;

  function sunsetSky(ctx, t, camY) {
    ctx.fillStyle = '#ffc36b';
    ctx.fillRect(-50, -50, 1180, 2020);
    F.sky(ctx, '#4a2f7a', '#ffc36b', { h: 1450 + camY * 0.2, y: -300, mid: '#ff7a86', midAt: 0.55 });
    // sun + glow, setting between the two peaks
    const sx = 740, sy = 900 + camY * 0.2;
    const g = ctx.createRadialGradient(sx, sy, 60, sx, sy, 520);
    g.addColorStop(0, 'rgba(255,240,190,0.95)');
    g.addColorStop(0.3, 'rgba(255,200,140,0.5)');
    g.addColorStop(1, 'rgba(255,160,120,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, sy - 600, 1080, 1200);
    ctx.fillStyle = '#fff1c4';
    ctx.beginPath(); ctx.arc(sx, sy, 130, 0, TAU); ctx.fill();
    // stripes over the sun (retro anime sunset)
    ctx.fillStyle = 'rgba(255,150,120,0.55)';
    for (let i = 0; i < 4; i++) ctx.fillRect(sx - 140, sy + 30 + i * 26, 280, 6 + i * 3);
    // long pink cloud streaks drifting
    ctx.save();
    ctx.fillStyle = 'rgba(255,190,200,0.75)';
    for (let i = 0; i < 6; i++) {
      const w = 260 + h01('cw', i) * 320;
      const x = ((h01('cx', i) * 1500 - t * (20 + 30 * h01('cs', i)) - travel(t) * 0.03) % 1500 + 1500) % 1500 - 300;
      const y = 250 + i * 95 + camY * 0.2;
      F.rrect(ctx, x, y, w, 16 + h01('ch', i) * 16, 12); ctx.fill();
    }
    ctx.restore();
    // a few early stars at the very top
    ctx.save(); ctx.globalAlpha = 0.8;
    F.stars(ctx, { n: 26, seed: 606, h: 300, y: -40 + camY * 0.2 });
    ctx.restore();
  }

  function mountains(ctx, t, camY) {
    const off = -travel(t) * 0.04;
    F.ararat(ctx, -80 + off, 1180 + camY * 0.3, 1250, 620, { color: '#a8709a', shade: '#8a5a86', snow: '#ffe0dc' });
  }

  function airport(ctx, t, camY) {
    const off = -travel(t) * 0.18;
    const y0 = 1255 + camY * 0.5;
    // foothills
    ctx.fillStyle = '#7b4a7a';
    ctx.beginPath(); ctx.moveTo(-100, y0);
    for (let i = 0; i <= 14; i++) ctx.lineTo(-100 + i * 100, y0 - 60 - 40 * Math.sin(i * 1.3 + 0.5));
    ctx.lineTo(1300, y0 + 700); ctx.lineTo(-100, y0 + 700); ctx.closePath(); ctx.fill();
    // repeating airport skyline
    const span = 1500;
    for (let k = -1; k <= 2; k++) {
      const bx = ((off % span) + span) % span + k * span - 300;
      ctx.save();
      ctx.translate(bx, y0);
      ctx.fillStyle = '#5e3a6a';
      ctx.strokeStyle = 'rgba(27,20,36,0.6)'; ctx.lineWidth = 3;
      // Zvartnots round terminal with its central tower
      ctx.beginPath(); ctx.ellipse(300, -30, 230, 26, 0, Math.PI, TAU); ctx.lineTo(530, 0); ctx.lineTo(70, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillRect(110, -70, 380, 44); ctx.strokeRect(110, -70, 380, 44);
      ctx.fillRect(285, -190, 30, 130); ctx.strokeRect(285, -190, 30, 130);
      ctx.beginPath(); ctx.ellipse(300, -196, 46, 18, 0, 0, TAU); ctx.fill(); ctx.stroke();
      // lit windows on the terminal ring
      ctx.fillStyle = '#ffd98a';
      for (let i = 0; i < 12; i++) ctx.fillRect(126 + i * 30, -58, 16, 10);
      // control tower
      ctx.fillStyle = '#5e3a6a';
      ctx.fillRect(820, -230, 36, 230); ctx.strokeRect(820, -230, 36, 230);
      ctx.beginPath(); ctx.moveTo(790, -230); ctx.lineTo(886, -230); ctx.lineTo(874, -280); ctx.lineTo(802, -280); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#9fe4ff'; ctx.fillRect(806, -272, 64, 22);
      // blinking beacon
      if (Math.floor(t * 3) % 2 === 0) { ctx.fillStyle = '#ff4d5e'; ctx.beginPath(); ctx.arc(838, -292, 8, 0, TAU); ctx.fill(); }
      // hangars
      ctx.fillStyle = '#6b4576';
      ctx.beginPath(); ctx.moveTo(1000, 0); ctx.quadraticCurveTo(1110, -150, 1220, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(1230, 0); ctx.quadraticCurveTo(1330, -120, 1430, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  function runway(ctx, t, camY) {
    const off = -travel(t);
    const top = RUNWAY_Y - 110 + camY * 0.9;
    // grass verge
    ctx.fillStyle = '#6a7a4a';
    ctx.fillRect(-50, top - 30, 1180, 40);
    // tarmac
    const g = ctx.createLinearGradient(0, top, 0, top + 420);
    g.addColorStop(0, '#5a4a66'); g.addColorStop(1, '#3e3148');
    ctx.fillStyle = g;
    ctx.fillRect(-50, top, 1180, 420);
    // sunset sheen on tarmac
    ctx.fillStyle = 'rgba(255,170,130,0.18)';
    ctx.fillRect(-50, top, 1180, 60);
    // edge stripes
    ctx.fillStyle = '#f4efe6';
    ctx.fillRect(-50, top + 10, 1180, 8);
    ctx.fillRect(-50, top + 400, 1180, 10);
    // centre dashes scrolling
    const dash = 220;
    const d0 = ((off % dash) + dash) % dash;
    ctx.fillStyle = '#fff6d8';
    for (let x = d0 - dash; x < 1200; x += dash) ctx.fillRect(x, top + 230, 120, 12);
    // edge lights (near row runs fast)
    const lg = 160;
    const l0 = ((off * 1.0 % lg) + lg) % lg;
    for (let x = l0 - lg; x < 1200; x += lg) {
      ctx.fillStyle = 'rgba(255,220,120,0.45)';
      ctx.beginPath(); ctx.arc(x, top + 14, 16, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff2b0';
      ctx.beginPath(); ctx.arc(x, top + 14, 6, 0, TAU); ctx.fill();
    }
    // foreground grass + lights below the runway (fastest parallax)
    ctx.fillStyle = '#4e5e3a';
    ctx.fillRect(-50, top + 410, 1180, 700);
    const fl = 340;
    const f0 = ((off * 1.5 % fl) + fl) % fl;
    for (let x = f0 - fl; x < 1300; x += fl) {
      ctx.fillStyle = '#3a4a2c';
      ctx.fillRect(x - 6, top + 470, 12, 60);
      ctx.fillStyle = 'rgba(120,200,255,0.5)';
      ctx.beginPath(); ctx.arc(x, top + 466, 22, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c8f0ff';
      ctx.beginPath(); ctx.arc(x, top + 466, 9, 0, TAU); ctx.fill();
    }
    // grass tufts
    ctx.strokeStyle = '#6f8a4c'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    const tg = 90;
    const tg0 = ((off * 1.5 % tg) + tg) % tg;
    for (let x = tg0 - tg; x < 1200; x += tg) { ctx.moveTo(x, top + 560); ctx.lineTo(x - 10, top + 530); ctx.moveTo(x + 12, top + 560); ctx.lineTo(x + 16, top + 526); }
    ctx.stroke();
  }

  // landing gear under the plane in its local frame (s applied by caller)
  function gear(ctx, t, retract) {
    const k = 1 - retract;
    if (k <= 0.02) return;
    const spin = t * 40;
    [[-40, 1], [190, 0.85]].forEach(([gx, sc]) => {
      ctx.save();
      ctx.translate(gx, 30);
      ctx.scale(1, k);
      ctx.strokeStyle = P.line; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 44 * sc); ctx.stroke();
      ctx.strokeStyle = '#c9ccd6'; ctx.lineWidth = 4; ctx.stroke();
      F.ellipse(ctx, 0, 52 * sc, 18 * sc, 18 * sc); F.fo(ctx, '#2a2a33', 4);
      ctx.strokeStyle = '#8a8d99'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(Math.cos(spin) * 12 * sc, 52 * sc + Math.sin(spin) * 12 * sc); ctx.lineTo(-Math.cos(spin) * 12 * sc, 52 * sc - Math.sin(spin) * 12 * sc); ctx.stroke();
      ctx.restore();
    });
  }

  // tiny Hayk (skin dot + black shades) in a plane window, drawn in plane-local coords
  const tinyFace = (ctx) => {
    ctx.fillStyle = P.skin; ctx.beginPath(); ctx.arc(0, 1, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = P.haykHair; ctx.fillRect(-7, -7, 14, 4);
    ctx.fillStyle = '#111'; ctx.fillRect(-7, -1, 14, 4);
  };

  function planeState(t) {
    // screen position of the plane centre and its pitch, in the runway view
    const x = lerp(430, 600, clamp(t / B_LIFT)) + (t > B_LIFT ? (t - B_LIFT) * 260 + (t - B_LIFT) * (t - B_LIFT) * 90 : 0);
    const air = Math.max(0, t - B_LIFT);
    const climb = air * air * 260 + air * 120;
    const rot = -0.24 * clamp(air / 0.45);
    const bump = t < B_LIFT ? Math.sin(t * 60) * 1.5 : 0;
    const s = 1.35 - 0.3 * clamp(air / 1.5);
    return { x, y: RUNWAY_Y - 80 * s + bump - climb, rot, s, air };
  }

  function porthole(ctx, t, cx, cy, r, k) {
    if (k <= 0) return;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(k, k);
    // connector tail from the inset to the plane (manga)
    // fuselage-coloured frame around a rounded airplane window
    F.rrect(ctx, -r - 40, -r * 1.2 - 40, (r + 40) * 2, (r * 1.2 + 40) * 2, r * 0.9); F.fo(ctx, '#f4f6fb', 7);
    F.rrect(ctx, -r - 14, -r * 1.2 - 14, (r + 14) * 2, (r * 1.2 + 14) * 2, r * 0.8); F.fo(ctx, '#c9d1e2', 5);
    ctx.save();
    F.rrect(ctx, -r, -r * 1.2, r * 2, r * 2.4, r * 0.75);
    ctx.clip();
    // inside cabin: warm sunset light
    F.sky(ctx, '#ffb07a', '#ff7a86', { x: -r, y: -r * 1.2, w: r * 2, h: r * 2.4 });
    ctx.fillStyle = '#6a4d8a'; ctx.fillRect(-r, -r * 1.2, r * 2, 70);
    ctx.fillStyle = '#3b2d5c'; F.rrect(ctx, -r + 20, r * 0.2, r * 2 - 40, r, 30); ctx.fill();
    // Hayk: find his head, then place it at the window centre
    const s = 2.2;
    const probe = { x: 0, y: 0, s, pose: 'thumbsUp', face: 'happy', shades: true, t };
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 0, 0); ctx.clip();
    const pa = FILM.cast.hayk(ctx, probe);
    ctx.restore();
    const bob = Math.sin(t * 10) * 4;
    const hx = -pa.head[0] - 20, hy = -pa.head[1] + 10 + bob;
    const a = FILM.cast.hayk(ctx, Object.assign({}, probe, { x: hx, y: hy }));
    F.sparkle(ctx, a.eyeR[0] + 20, a.eyeR[1] - 20, 34 + 12 * Math.sin(t * 12), { rot: t * 3 });
    F.sparkle(ctx, a.eyeL[0] - 30, a.eyeL[1] - 10, 20 + 8 * Math.sin(t * 9 + 1), { rot: -t * 2 });
    // glass reflection
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.moveTo(-r, -r * 0.6); ctx.lineTo(-r * 0.3, -r * 1.2); ctx.lineTo(-r * 0.05, -r * 1.2); ctx.lineTo(-r, -r * 0.2); ctx.closePath(); ctx.fill();
    ctx.restore();
    F.rrect(ctx, -r, -r * 1.2, r * 2, r * 2.4, r * 0.75); F.fo(ctx, null, 6);
    ctx.restore();
  }

  function drawRunway(ctx, t) {
    const ps = planeState(t);
    // camera tilts up to follow the climb after takeoff
    const camY = Math.min(520, Math.max(0, (RUNWAY_Y - 80 - ps.y) * 0.55));
    sunsetSky(ctx, t, camY);
    mountains(ctx, t, camY);
    airport(ctx, t, camY);
    runway(ctx, t, camY);

    const speed = clamp(0.35 + t / 1.6);
    // speed lines behind (horizontal, moving left)
    F.speedLines(ctx, { angle: Math.PI, count: 26, color: '#ffe8d0', alpha: 0.35 * speed, t, speed: 2600, len: 520, width: 7, seed: 61, y: 300, h: 1300 });

    // plane (screen y with camera follow)
    const py = ps.y + camY;
    // shadow on the runway, shrinking as it climbs
    const shA = clamp(1 - ps.air / 1.0);
    if (shA > 0) {
      ctx.save(); ctx.globalAlpha = 0.35 * shA; ctx.fillStyle = '#1b1424';
      F.ellipse(ctx, ps.x - 20, RUNWAY_Y + camY * 0.9 + 12, 330 * ps.s * (0.7 + 0.3 * shA), 20); ctx.fill();
      ctx.restore();
    }
    // exhaust shimmer / motion smear behind the plane
    F.motionSmear(ctx, ps.x - 700 * ps.s * 0.6 - 380, py - 60 * ps.s, 520, 110 * ps.s, { color: 'rgba(255,255,255,0.7)', angle: Math.PI, seed: 62, alpha: 0.6 * speed });
    ctx.save();
    ctx.translate(ps.x, py);
    ctx.rotate(ps.rot);
    ctx.scale(ps.s, ps.s);
    gear(ctx, t, clamp((t - B_LIFT - 0.3) / 0.4));
    ctx.restore();
    F.plane(ctx, ps.x, py, ps.s, { rot: ps.rot, face: tinyFace, tail: '#e8413c', stripe: '#27335c' });
    // lift-off: dust from the wheels, flash, shock ring
    F.dust(ctx, ps.x - 60, RUNWAY_Y + camY * 0.9, t - B_LIFT + 0.05, { n: 8, size: 70, spread: 320, seed: 63, color: '#e8d6e0', life: 1.0 });
    F.shockRing(ctx, ps.x + 60, py + 20, t - B_LIFT, { r: 520, color: '#fff6e0', life: 0.45, width: 26, squash: 0.45 });
    // near speed lines over everything (foreground)
    F.speedLines(ctx, { angle: Math.PI, count: 14, color: '#ffffff', alpha: 0.55 * speed, t, speed: 4200, len: 700, width: 10, seed: 64, y: 1300, h: 600 });

    // SFX on the takeoff beat
    F.sfx(ctx, 'WHOOSH!', 560, 1000, t, B_LIFT, { size: 150, rot: -0.14, fill: P.sfxYellow, shadowColor: '#c23b6a', life: 0.95 });

    // porthole inset: present from frame 0, pops away after the takeoff
    const pk = t < 1.35 ? 1 : 1 - LIB.ease.inBack(clamp((t - 1.35) / 0.25));
    if (pk > 0) {
      // connector from the inset to the plane window
      const wx = ps.x + (87 * Math.cos(ps.rot) - (-22) * Math.sin(ps.rot)) * ps.s;
      const wy = py + (87 * Math.sin(ps.rot) + (-22) * Math.cos(ps.rot)) * ps.s;
      ctx.save();
      ctx.globalAlpha = pk;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.strokeStyle = P.line; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(360, 800); ctx.lineTo(wx, wy); ctx.lineTo(470, 790); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      porthole(ctx, t, 400, 560, 190, pk);
    }
    // flash on lift
    if (t >= B_LIFT && t < B_LIFT + 0.2) F.flash(ctx, 0.55 * (1 - (t - B_LIFT) / 0.2), '#fff4dc');
  }

  const BRITAIN = pts([[-5.5, 50.0], [1.5, 51.2], [1.7, 52.7], [0.2, 53.5], [-0.5, 54.5], [-1.8, 55.6], [-2.0, 57.0], [-3.5, 58.6], [-5.0, 58.6], [-6.2, 57.5], [-5.5, 55.5], [-3.0, 54.2], [-4.7, 52.8], [-5.3, 51.7], [-3.5, 51.4], [-5.7, 50.0]]);

  const arcPt = (u) => {

  };
  const arcTan = (u) => [2 * (1 - u) * (CTRL[0] - YVN[0]) + 2 * u * (MAD[0] - CTRL[0]), 2 * (1 - u) * (CTRL[1] - YVN[1]) + 2 * u * (MAD[1] - CTRL[1])];

  const PANEL = { x: 36, y: 390, w: 1008, h: 1010 };

  function mapStatic(g) {
    // sea
    F.sky(g, '#6cc4ef', '#3f9ad6', { x: PANEL.x, y: PANEL.y, w: PANEL.w, h: PANEL.h });
    // wave ticks
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath();
    for (let i = 0; i < 40; i++) {
      const x = PANEL.x + h01('wx', i) * PANEL.w, y = PANEL.y + h01('wy', i) * PANEL.h;
      g.moveTo(x, y); g.quadraticCurveTo(x + 10, y - 8, x + 20, y); g.quadraticCurveTo(x + 30, y + 8, x + 40, y);
    }
    g.stroke();
    // land
    const land = (poly, fill) => { F.poly(g, poly); F.fo(g, fill, 4); };
    [EUROPE, BRITAIN, IRELAND, SCANDI, SICILY, SARDINIA, CORSICA, AFRICA].forEach((poly) => land(poly, '#f6e3b4'));
    // inland seas on top of the land mass
    [BLACK_SEA, CASPIAN].forEach((poly) => { F.poly(g, poly); F.fo(g, '#5fb6e8', 4); });
    // grid
    g.strokeStyle = 'rgba(40,70,120,0.18)'; g.lineWidth = 2;
    g.beginPath();
    for (let lo = -10; lo <= 50; lo += 10) { g.moveTo(MX(lo), PANEL.y); g.lineTo(MX(lo), PANEL.y + PANEL.h); }
    for (let la = 30; la <= 60; la += 5) { g.moveTo(PANEL.x, MY(la)); g.lineTo(PANEL.x + PANEL.w, MY(la)); }
    g.stroke();
    // soft hills/forest dots on land
    g.fillStyle = 'rgba(140,180,90,0.35)';
    [[5, 47], [12, 50], [20, 49], [26, 47], [32, 52], [40, 55], [15, 46], [24, 43], [2, 45], [36, 39], [42, 50]].forEach(([lo, la]) => { g.beginPath(); g.arc(MX(lo), MY(la), 26, 0, TAU); g.fill(); });
    // highlighted countries
    F.poly(g, SPAIN); F.fo(g, '#ffb13a', 5);
    F.poly(g, ARMENIA); F.fo(g, '#ff6a4a', 5);
    // tiny Ararat next to Armenia
    F.ararat(g, MX(43.2), MY(39.1), 70, 34, {});

  function drawMap(ctx, t) {
    // dark evening sky behind the map panel
    F.sky(ctx, '#20164a', '#5a2d6e');
    F.stars(ctx, { n: 60, seed: 607, h: 1920 });
    F.focusLines(ctx, 540, 900, { inner: 620, count: 70, color: 'rgba(255,255,255,0.08)', seed: 65, width: 18 });
    // panel with a subtle pop as the whip pan lands
    const land = clamp((t - B_WHIP - WHIP_DUR) / 0.2);
    ctx.save();
    F.rrect(ctx, PANEL.x - 10, PANEL.y - 10, PANEL.w + 20, PANEL.h + 20, 30); F.fo(ctx, '#fff6e3', 8);
    ctx.save();
    F.rrect(ctx, PANEL.x, PANEL.y, PANEL.w, PANEL.h, 22); ctx.clip();
    mapStatic(ctx);
    ctx.restore();
    ctx.restore();
    void land;

    // burger icon glowing over Spain (foreshadowing!)
    const pulse = 1 + 0.08 * Math.sin(t * 8);
    F.burger(ctx, MAD[0] + 100, MAD[1] - 20, 0.34 * pulse, { glow: true });
    F.sparkle(ctx, MAD[0] + 150, MAD[1] - 60, 18 + 8 * Math.sin(t * 10), { rot: t });

    // dotted arc: faint full path + solid travelled part
    const fu = LIB.ease.inOutSine(clamp((t - B_FLY0) / (B_FLY1 - B_FLY0)));
    ctx.save();
    ctx.lineCap = 'round';
    ctx.setLineDash([2, 26]);
    ctx.lineDashOffset = -t * 60;
    ctx.beginPath(); ctx.moveTo(YVN[0], YVN[1]); ctx.quadraticCurveTo(CTRL[0], CTRL[1], MAD[0], MAD[1]);
    ctx.strokeStyle = 'rgba(27,20,36,0.35)'; ctx.lineWidth = 12; ctx.stroke();
    if (fu > 0) {
      ctx.beginPath();
      for (let k = 0; k <= 40; k++) { const p = arcPt((k / 40) * fu); if (k === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); }
      ctx.strokeStyle = '#e8413c'; ctx.lineWidth = 14; ctx.stroke();
    }
    ctx.restore();

    // arrival pop over Spain (burst behind the plane, only a few frames)
    const arrivedNow = t >= B_FLY1;
    if (arrivedNow && t < B_FLY1 + 0.3) {
      const k = F.popIn(t, B_FLY1);
      ctx.save(); ctx.globalAlpha = 1 - clamp((t - B_FLY1 - 0.15) / 0.15);
      F.burst(ctx, MAD[0], MAD[1], 110 * k, 60 * k, 12, '#fff05a', { lw: 5, seed: 67 });
      ctx.restore();
    }
    // plane icon along the arc (faces left, towards Spain)
    const pu = t < B_FLY0 ? 0 : fu;
    const pp = arcPt(pu), tg = arcTan(Math.min(0.999, Math.max(0.001, pu)));
    const ang = Math.atan2(tg[1], tg[0]);
    // contrail puffs behind the plane
    for (let i = 1; i <= 6; i++) {
      const u2 = pu - i * 0.03;
      if (u2 <= 0) break;
      const q = arcPt(u2);
      ctx.save(); ctx.globalAlpha = 0.7 * (1 - i / 7);
      F.ellipse(ctx, q[0], q[1], 16 - i, 16 - i); F.fo(ctx, '#ffffff', 0);
      ctx.restore();
    }
    const bob = Math.sin(t * 9) * 3;
    F.plane(ctx, pp[0], pp[1] + bob, 0.44, { rot: ang + Math.PI, flip: true, tail: '#e8413c' });
    if (t >= B_FLY0 && t < B_FLY1) F.speedLines(ctx, { x: pp[0] - 60, y: pp[1] - 50, w: 260, h: 100, angle: ang + Math.PI, count: 8, color: '#ffffff', alpha: 0.7, t, speed: 1200, len: 90, width: 5, seed: 66 });
    // markers: Armenia flag (right) and Spain flag + pin (left)
    F.flag(ctx, YVN[0] + 6, YVN[1] + 4, 0.55, 'AM', { t });
    F.ellipse(ctx, YVN[0], YVN[1], 12, 12); F.fo(ctx, '#ffffff', 4);
    const arrived = t >= B_FLY1;
    const spop = arrived ? F.popIn(t, B_FLY1) : 1;
    F.flag(ctx, MAD[0] - 4, MAD[1] + 4, 0.55 * (arrived ? spop : 0.85), 'ES', { t });
    F.ellipse(ctx, MAD[0], MAD[1], 12, 12); F.fo(ctx, arrived ? '#ffe14a' : '#ffffff', 4);
    F.tag(ctx, 'YEREVAN', YVN[0] - 40, YVN[1] + 58, { size: 26, bg: '#1b1424' });
    F.tag(ctx, 'SPAIN', MAD[0] + 30, MAD[1] + 58, { size: 26, bg: '#1b1424' });

    if (arrivedNow) {
      F.shockRing(ctx, MAD[0], MAD[1], t - B_FLY1, { r: 220, color: '#ffffff', life: 0.45, width: 16 });
      F.sparkles(ctx, { x: MAD[0] - 140, y: MAD[1] - 140, w: 280, h: 280, n: 6, seed: 68, t, size: 30 });
    }
    // captions (screen fixed, inside the safe area)
    F.caption(ctx, 'YEREVAN -> SPAIN', 540, 290, { size: 74, align: 'center', t, t0: B_CAP1, from: 'left', bg: '#1b1424', accent: '#e8413c' });
    F.caption(ctx, '1 MONTH. MISSION: INVESTORS.', 540, 1470, { size: 50, align: 'center', t, t0: B_CAP2, from: 'right', bg: '#e8413c', accent: '#ffcc33' });
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const W = 1080, H = 1920;
      const [kx, ky] = F.shakeMany(t, [[B_LIFT, 0.4, 16], [B_FLY1, 0.25, 8]], 6);

      if (t < B_WHIP) {
        ctx.save();
        ctx.translate(kx, ky);
        drawRunway(ctx, t);
        ctx.restore();
        return;
      }
      // whip-pan up: the runway drops away, the map arrives from above, vertical speed-line wipe
      const u = clamp((t - B_WHIP) / WHIP_DUR);
      const e = LIB.ease.inOutCubic(u);
      if (u < 1) {
        ctx.save();
        ctx.translate(0, e * H);
        drawRunway(ctx, B_WHIP - 0.01);
        ctx.restore();
      }
      ctx.save();
      ctx.translate(kx, ky + (e - 1) * H);
      drawMap(ctx, t);
      ctx.restore();
      if (u < 1) {
        const k = Math.sin(u * Math.PI);
        F.flash(ctx, 0.35 * k, '#ffe6f0');
        F.speedLines(ctx, { angle: Math.PI / 2, count: 60, color: '#ffffff', alpha: 0.9 * k, t, speed: 6000, len: 1400, width: 16, seed: 69 });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/07-hola-espana.js
// Shot 07 'hola-espana' : "Hola, Espana"  (global T 26.0 - 30.0, 4 s)
//
// Bright Spanish street. Hayk (shades, smile) walks in pulling his suitcase, strikes a peace pose at
// 1.5 s with a sparkle burst. "DAY 1" caption at 0.5 s, bubble "HOLA, ESPANA!" at 1.0 s, to-do note
// "TODO: 1. FIND INVESTORS" with a checkbox pops in at 2.5 s.
//
// Layers (back to front):
//   1 sky gradient + big sun with turning rays
//   2 clouds, pigeons
//   3 far: skyline + Sagrada-Familia-like spiky church (parallax 0.2)
//   4 mid: sandstone buildings with balconies, flower pots, awnings (parallax 0.6)
//   5 street: sidewalk tiles, lamp post, curb, road (parallax 1)
//   6 pose rays (after 1.5 s), suitcase, Hayk, sparkle burst
//   7 foreground palm (parallax 1.25)
//   8 screen-fixed text: DAY 1 caption, bubble, to-do card
(function () {
  'use strict';
  const ID = 'hola-espana';
  const L = FILM.lib;
  const F = FILM.fx;
  const P = F.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const h01 = (...k) => F.h01(ID, ...k);
  const { ellipse, fo, rrect, curve, poly } = F;

  const GROUND = 1690; // Hayk's feet
  const WALL_BASE = 1450; // where the facades meet the sidewalk
  const BLINE = '#6a4636'; // soft outline for architecture
  const T_POSE = 1.5; // T 27.5
  const T_DAY = 0.5; // T 26.5
  const T_HOLA = 1.0; // T 27.0
  const T_TODO = 2.5; // T 28.5

  // ---------------------------------------------------------------------------
  // Far layer: skyline and spiky church
  // ---------------------------------------------------------------------------
  function church(ctx, cx, base, s) {
    ctx.save();
    ctx.translate(cx, base);
    ctx.scale(s, s);
    const body = '#a9b9e6', shade = '#8fa1d6', light = '#c3cff0';
    // nave block
    ctx.fillStyle = shade;
    ctx.fillRect(-230, -210, 460, 210);
    ctx.fillStyle = body;
    ctx.fillRect(-230, -210, 250, 210);
    // spires: [x, height, width]
    const sp = [[-190, 380, 54], [-120, 470, 62], [-50, 560, 70], [30, 600, 74], [110, 520, 64], [180, 420, 56], [-5, 700, 80], [240, 330, 46]];
    sp.sort((a, b) => a[1] - b[1]);
    sp.forEach(([x, h, w], i) => {
      ctx.beginPath();
      ctx.moveTo(x - w / 2, 0);
      ctx.bezierCurveTo(x - w / 2, -h * 0.55, x - w * 0.18, -h * 0.85, x, -h);
      ctx.bezierCurveTo(x + w * 0.18, -h * 0.85, x + w / 2, -h * 0.55, x + w / 2, 0);
      ctx.closePath();
      ctx.fillStyle = i % 2 ? body : light;
      ctx.fill();
      // shaded right half
      ctx.save();
      ctx.clip();
      ctx.fillStyle = shade;
      ctx.fillRect(x + w * 0.08, -h, w, h);
      // bands and window slits
      ctx.fillStyle = 'rgba(80,95,160,0.35)';
      for (let k = 1; k < 7; k++) ctx.fillRect(x - w / 2, -h * k * 0.12, w, 5);
      for (let k = 1; k < 6; k++) { rrect(ctx, x - 5, -h * (0.1 + k * 0.12), 10, 22, 5); ctx.fill(); }
      ctx.restore();
      // bulb finial
      ctx.fillStyle = i % 3 === 0 ? '#e8b8a0' : light;
      ctx.beginPath(); ctx.arc(x, -h - 10, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = shade;
      ctx.fillRect(x - 2, -h - 36, 4, 20);
    });
    // rose window + portal
    ctx.fillStyle = light;
    ctx.beginPath(); ctx.arc(-40, -130, 40, 0, TAU); ctx.fill();
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.arc(-40, -130, 22, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-80, 0); ctx.lineTo(-80, -60); ctx.quadraticCurveTo(-40, -110, 0, -60); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function farLayer(ctx) {
    // hazy skyline blocks
    ctx.fillStyle = '#c4dcf5';
    for (let i = 0; i < 16; i++) {
      const x = -100 + i * 90, h = 120 + h01('sky', i) * 170, w = 70 + h01('skw', i) * 60;
      ctx.fillRect(x, 1180 - h, w, h + 40);
    }
    ctx.fillStyle = '#b3cdec';
    for (let i = 0; i < 12; i++) {
      const x = -60 + i * 120, h = 60 + h01('sk2', i) * 110;
      ctx.fillRect(x, 1200 - h, 100, h + 40);
    }
    church(ctx, 400, 1170, 1.05);
    // hills of Montjuic-ish green far away
    ctx.fillStyle = '#9fcf9a';
    ctx.beginPath();
    ctx.moveTo(-100, 1210);
    ctx.quadraticCurveTo(150, 1110, 400, 1190);
    ctx.lineTo(400, 1260); ctx.lineTo(-100, 1260); ctx.closePath();
    ctx.fill();
  }

  // ---------------------------------------------------------------------------
  // Mid layer: facades
  // ---------------------------------------------------------------------------
  function flowerPot(ctx, x, y, seed) {
    rrect(ctx, x - 20, y - 26, 40, 26, 5); fo(ctx, '#d9653b', 3, BLINE);
    ctx.fillStyle = '#4f9a4a';
    ctx.beginPath(); ctx.ellipse(x, y - 34, 30, 16, 0, 0, TAU); ctx.fill();
    const cols = ['#ff4f6e', '#ff7ab0', '#ffffff', '#ff5a3c'];
    for (let k = 0; k < 5; k++) {
      const fx = x - 22 + k * 11, fy = y - 38 - h01('fp', seed, k) * 14;
      ctx.fillStyle = cols[(seed + k) % cols.length];
      ctx.beginPath(); ctx.arc(fx, fy, 7, 0, TAU); ctx.fill();
    }
    // trailing leaves
    ctx.strokeStyle = '#3f8a3e'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 16, y - 6); ctx.quadraticCurveTo(x - 24, y + 20, x - 14, y + 40); ctx.stroke();
  }

  function windowUnit(ctx, x, y, w, h, o) {
    // arched window with shutters, balcony and pot
    const sh = o.shutter;
    // shutters
    rrect(ctx, x - w * 0.5 - w * 0.34, y, w * 0.34, h, 3); fo(ctx, sh, 3, BLINE);
    rrect(ctx, x + w * 0.5, y, w * 0.34, h, 3); fo(ctx, sh, 3, BLINE);
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let k = 1; k < 7; k++) {
      ctx.moveTo(x - w * 0.82, y + (h * k) / 7); ctx.lineTo(x - w * 0.52, y + (h * k) / 7);
      ctx.moveTo(x + w * 0.52, y + (h * k) / 7); ctx.lineTo(x + w * 0.82, y + (h * k) / 7);
    }
    ctx.stroke();
    // glass with arch
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y + h);
    ctx.lineTo(x - w / 2, y + w / 2);
    ctx.arc(x, y + w / 2, w / 2, Math.PI, 0);
    ctx.lineTo(x + w / 2, y + h);
    ctx.closePath();
    fo(ctx, '#5f8fc4', 4, BLINE);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.moveTo(x - w * 0.35, y + h * 0.9); ctx.lineTo(x - w * 0.1, y + w * 0.3); ctx.lineTo(x + w * 0.05, y + w * 0.3); ctx.lineTo(x - w * 0.2, y + h * 0.9); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = BLINE; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.stroke();
    if (o.balcony) {
      const by = y + h;
      rrect(ctx, x - w * 0.9, by - 6, w * 1.8, 14, 3); fo(ctx, '#e9d2b0', 3, BLINE);
      // iron railing
      ctx.strokeStyle = '#2d2530'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x - w * 0.85, by - 60); ctx.lineTo(x + w * 0.85, by - 60);
      for (let k = 0; k <= 10; k++) { const rx = x - w * 0.85 + (k * w * 1.7) / 10; ctx.moveTo(rx, by - 60); ctx.lineTo(rx, by - 6); }
      ctx.stroke();
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let k = 0; k < 5; k++) { const rx = x - w * 0.68 + (k * w * 1.36) / 4; ctx.moveTo(rx + 12, by - 30); ctx.arc(rx, by - 30, 12, 0, TAU); }
      ctx.stroke();
      if (o.pot) { flowerPot(ctx, x - w * 0.55, by - 8, o.seed); flowerPot(ctx, x + w * 0.55, by - 8, o.seed + 1); }
    } else if (o.pot) {
      rrect(ctx, x - w * 0.6, y + h - 4, w * 1.2, 12, 3); fo(ctx, '#e9d2b0', 3, BLINE);
      flowerPot(ctx, x, y + h - 2, o.seed);
    }
  }

  function awning(ctx, x, y, w, c1, c2) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w + 20, y + 80); ctx.lineTo(x - 20, y + 80); ctx.closePath();
    ctx.fillStyle = c1; ctx.fill();
    ctx.clip();
    ctx.fillStyle = c2;
    for (let k = 0; k < 14; k++) {
      const sx = x - 20 + k * ((w + 40) / 14) * 2;
      ctx.beginPath(); ctx.moveTo(sx + (x - sx) * 0.1, y); ctx.lineTo(sx + ((w + 40) / 14), y); ctx.lineTo(sx + ((w + 40) / 14), y + 90); ctx.lineTo(sx, y + 90); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w + 20, y + 80); ctx.lineTo(x - 20, y + 80); ctx.closePath();
    fo(ctx, null, 4, BLINE);
    // scalloped valance
    ctx.beginPath();
    const n = Math.round((w + 40) / 40);
    ctx.moveTo(x - 20, y + 80);
    for (let k = 0; k < n; k++) { const sx = x - 20 + (k * (w + 40)) / n; ctx.quadraticCurveTo(sx + (w + 40) / n / 2, y + 112, sx + (w + 40) / n, y + 80); }
    ctx.closePath();
    fo(ctx, c1, 4, BLINE);
  }

  function building(ctx, b) {
    const { x, w, top, wall, shade, roof, shutter, seed } = b;
    const bot = WALL_BASE;
    // roof: terracotta tiles, slight overhang
    ctx.beginPath();
    ctx.moveTo(x - 24, top + 20); ctx.lineTo(x + 30, top - 50); ctx.lineTo(x + w - 30, top - 50); ctx.lineTo(x + w + 24, top + 20); ctx.closePath();
    fo(ctx, roof, 4, BLINE);
    ctx.strokeStyle = 'rgba(120,40,20,0.45)'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let k = 0; k < 3; k++) { const yy = top - 34 + k * 18; ctx.moveTo(x + 10 - k * 12, yy); ctx.lineTo(x + w - 10 + k * 12, yy); }
    for (let k = 0; k < w / 28; k++) { const xx = x + 10 + k * 28; ctx.moveTo(xx, top - 48); ctx.lineTo(xx - 4, top + 16); }
    ctx.stroke();
    // wall
    ctx.beginPath(); ctx.rect(x, top + 16, w, bot - top - 16);
    fo(ctx, wall, 4, BLINE);
    ctx.fillStyle = shade;
    ctx.fillRect(x + w - 40, top + 18, 38, bot - top - 20);
    // cornice
    rrect(ctx, x - 12, top + 10, w + 24, 26, 4); fo(ctx, '#fff4e0', 4, BLINE);
    // floor bands
    ctx.fillStyle = 'rgba(160,110,60,0.25)';
    const floors = b.floors;
    const fh = (bot - 200 - (top + 40)) / floors;
    for (let f = 1; f <= floors; f++) ctx.fillRect(x, top + 40 + f * fh - 6, w, 8);
    // windows
    const cols = b.cols;
    for (let f = 0; f < floors; f++) {
      for (let c = 0; c < cols; c++) {
        const wx = x + (w / cols) * (c + 0.5);
        const wy = top + 40 + f * fh + fh * 0.18;
        windowUnit(ctx, wx, wy, Math.min(56, (w / cols) * 0.42), fh * 0.62, {
          shutter, balcony: (f + c + seed) % 2 === 0, pot: (f * 3 + c + seed) % 3 !== 1, seed: seed + f * 5 + c,
        });
      }
    }
    // ground floor shop
    const gy = bot - 200;
    ctx.fillStyle = 'rgba(120,70,40,0.18)';
    ctx.fillRect(x, gy, w, 200);
    if (b.shop) {
