        F.impact(ctx, { cx: HX, cy: 1000, seed: 19 });
      }

      // 3. Hayk
      let sx = 1, sy = 1;
      if (hitFrames(T_CHOMP, 2) || hitFrames(T_BITE2, 2) || hitFrames(T_GULP, 2)) { sx = 1.06; sy = 0.92; }
      const lean = t < T_CHOMP ? -0.06 * L.ease.outCubic(windUp) : 0;
      const bob = second ? F.bounce(tw, 2, 12) : Math.sin(tw * Math.PI * 4) * 5;
      let face, pose, mouth;
      if (t < T_WIND) { face = 'ecstatic'; pose = 'eatBig'; }
      else if (t < T_CHOMP) { face = 'determined'; mouth = 'shout'; pose = 'eatBig'; }
      else if (!second) { face = 'chewing'; pose = 'eatBig'; }
      else { face = t < T_LINE ? 'smug' : 'confident'; pose = 'fist'; }
      ctx.save();
      ctx.translate(HX, HY);
      ctx.scale(sx, sy);
      ctx.translate(-HX, -HY);
      const a = FILM.cast.hayk(ctx, {
        x: HX, y: HY + bob, s: HS, t, pose, face, mouth, belly: 0.2, crown: true, tilt: lean,
        silhouette: impactNow ? '#0a0a10' : null,
      });
      ctx.restore();

      // 4. mega burger in both hands (top edge gripped by the hands)
      const gripY = (a.handL[1] + a.handR[1]) / 2;
      const bx = (a.handL[0] + a.handR[0]) / 2;
      let lift = 0;
      if (t < T_WIND) lift = Math.sin(tw * Math.PI * 2) * 6;
      else if (t < T_CHOMP) lift = -60 * L.ease.outCubic(windUp);
      else if (t < T_CHOMP + 0.25) lift = -60 * (1 - L.ease.outCubic((t - T_CHOMP) / 0.25));
      else lift = Math.sin(tw * Math.PI * 4) * 4;
      const by = gripY - MB_TOP - 50 + lift;
      if (!second) {
        if (impactNow) {
          const op = L.ease.outCubic(clamp((t - T_CHOMP + FR) / (3 * FR)));
          const jx = a.mouth[0], jy = a.mouth[1] + 40;
          jawCavity(ctx, jx, jy, 1.6, op);
          jawTeeth(ctx, jx, jy, 1.6, op, true);
          megaBurger(ctx, bx, by + 150, 0, info, 0, '#0a0a10');
          jawTeeth(ctx, jx, jy, 1.6, op, false);
          silEyes(ctx, a);
        } else {
          megaBurger(ctx, bx, by, level, info, t < T_CHOMP ? 0.6 + 0.4 * Math.sin(t * 8) : 0);
          fingers(ctx, a.handL[0] - 10, gripY + 10 + lift, 1.1, 1);
          fingers(ctx, a.handR[0] + 10, gripY + 10 + lift, 1.1, -1);
        }
      } else {
        // the second burger, raised like a trophy
        const hr = a.handR;
        const pop = F.popIn(t, T_GULP);
        F.burger(ctx, hr[0] + 30, hr[1] - 95, 1.25 * pop, { glow: true, rot: 0.08 * Math.sin(tw * 6) });
      }

      if (!impactNow) {
        if (t < T_CHOMP) {
          F.sparkle(ctx, a.eyeL[0] - 20, a.eyeL[1] - 30, 26 + 8 * Math.sin(t * 10));
          F.sparkle(ctx, a.eyeR[0] + 20, a.eyeR[1] - 20, 20 + 6 * Math.sin(t * 9 + 1));
        }
        // 5. table + tray (foreground)
        drawTable(ctx, t, second);
      } else {
        ctx.fillStyle = '#0a0a10';
        ctx.fillRect(-60, TABLE_Y, W + 120, H - TABLE_Y + 60);
      }
      ctx.restore(); // camera

      // 6. effects (follow the shake)
      ctx.save();
      ctx.translate(sh[0] * 0.6, sh[1] * 0.6);
      const mx = a.mouth[0], my = a.mouth[1];
      F.crumbs(ctx, mx, my + 60, t - T_CHOMP, { n: 24, spread: 680, seed: 3 });
      F.crumbs(ctx, mx + 30, my + 90, t - T_BITE2, { n: 16, spread: 520, seed: 4 });
      F.shockRing(ctx, mx, my + 40, t - T_CHOMP, { r: 560, life: 0.45, color: impactNow ? '#0a0a10' : '#ffffff' });
      if (t >= T_WIND && t < T_CHOMP) {
        F.menace(ctx, 900, 1080, t, { size: 84, n: 3, seed: 9 });
      }
      F.sfx(ctx, 'CHOMP!', 540, 560, t, T_CHOMP, { size: 220, rot: -0.14, life: 1.3, fill: impactNow ? '#ffffff' : P.sfxYellow, shadowColor: impactNow ? '#0a0a10' : '#b3122b' });
      if (t >= T_CHOMP + 0.5 && t < T_BITE2) {
        const k = Math.floor((t - T_CHOMP - 0.5) / 0.25) % 2;
        F.text(ctx, 'MUNCH', k ? 850 : 230, k ? 900 : 940, { size: 72, fill: '#ffffff', stroke: P.line, lw: 12, rot: k ? 0.15 : -0.15 });
      }
      F.sfx(ctx, 'CHOMP!', 800, 760, t, T_BITE2, { size: 130, rot: 0.12, life: 0.5 });
      if (t >= T_GULP && t < T_GULP + 0.5) {
        F.dust(ctx, bx, by - 160, t - T_GULP, { n: 7, size: 80, spread: 260, color: '#fff4e0', life: 0.5 });
      }
      F.sfx(ctx, 'GULP!', 270, 1180, t, T_GULP, { size: 140, rot: -0.1, life: 0.5, fill: '#ffffff' });
      if (second) {
        F.sparkles(ctx, { x: 560, y: 380, w: 420, h: 380, n: 9, seed: 71, t, size: 40, color: '#fff3a0' });
      }
      ctx.restore();

      // 7. screen-fixed text
      F.caption(ctx, 'STOP 2: BURGER KONG', 70, 290, { size: 54, bg: P.kongBlue, accent: P.gold });
      if (t >= T_LINE) {
        F.bubble(ctx, 'ONE MORE. FOR RESEARCH.', 240, 1260, { size: 48, maxW: 300, t, t0: T_LINE, tail: [a.mouth[0] - 50, a.mouth[1] + 20] });
      }
    },
  });

  function drawTable(ctx, t, second) {
    // table top (wood) and front
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-40, TABLE_Y); ctx.lineTo(W + 40, TABLE_Y); ctx.lineTo(W + 40, H + 40); ctx.lineTo(-40, H + 40); ctx.closePath();
    F.fo(ctx, '#c9773f', 5);
    ctx.fillStyle = '#e39a5c';
    ctx.fillRect(-40, TABLE_Y + 4, W + 80, 26);
    ctx.fillStyle = 'rgba(120,60,20,0.25)';
    for (let i = 0; i < 6; i++) ctx.fillRect(-40, TABLE_Y + 60 + i * 70, W + 80, 6);
    // tray
    ctx.beginPath();
    ctx.moveTo(120, TABLE_Y + 50); ctx.lineTo(960, TABLE_Y + 50); ctx.lineTo(1010, TABLE_Y + 260); ctx.lineTo(70, TABLE_Y + 260); ctx.closePath();
    F.fo(ctx, P.kongOrange, 5);
    ctx.beginPath();
    ctx.moveTo(150, TABLE_Y + 70); ctx.lineTo(930, TABLE_Y + 70); ctx.lineTo(970, TABLE_Y + 240); ctx.lineTo(110, TABLE_Y + 240); ctx.closePath();
    ctx.fillStyle = '#fff4e0'; ctx.fill();
    // wrapper paper pattern
    ctx.fillStyle = 'rgba(31,95,191,0.25)';
    for (let i = 0; i < 9; i++) { F.ellipse(ctx, 180 + i * 90, TABLE_Y + 150 + (i % 2) * 40, 20, 12); ctx.fill(); }
    ctx.restore();
    // fries + drink on the tray
    F.fries(ctx, 230, TABLE_Y + 210, 0.95, { color: P.kongBlue, label: false });
    F.drink(ctx, 880, TABLE_Y + 215, 0.95, { color: P.kongBlue });
    // wrappers of eaten burgers pile (grows after gulp)
    const n = second ? 3 : 2;
    for (let i = 0; i < n; i++) {
      ctx.save();
      ctx.translate(520 + i * 70 - n * 30, TABLE_Y + 180 - i * 14);
      ctx.rotate(-0.3 + i * 0.35);
      F.curve(ctx, [[-60, -20], [-20, -46], [30, -38], [64, -6], [40, 30], [-10, 36], [-58, 20]]);
      F.fo(ctx, i % 2 ? '#ffe6c0' : '#fff8ea', 4);
      ctx.strokeStyle = 'rgba(27,20,36,0.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-30, -20); ctx.lineTo(10, 10); ctx.moveTo(20, -24); ctx.lineTo(-6, 20); ctx.stroke();
      ctx.restore();
    }
  }
})();

</script>
<script>
// ---- src/scenes/11-mcdonuts.js
// Shot 11 'mcdonuts' : "McDonut's"  (global T 44.0 - 49.0, local t 0..5)
//
// Beats (local):
//   0.0-2.0  slow-motion golden shower of fries in front of the McDONUT'S restaurant. Hayk (pose
//            cheer, face ecstatic, belly 0.25) catches fries with his mouth: NOM on 0.5, 1.0, 1.5
//   2.0      snap: he holds a tray with burger, fries and drink (pose hug), sparkle burst
//   3.0      he sings: bubble "BA DA BA BA BAAA!" with music notes, sways on the beat
//   caption "STOP 3: McDONUT'S" top-left the whole shot
//
// Layers back to front:
//   1 sky, clouds, far town (cached)
//   2 McDONUT'S building with the golden bitten-donut logo (cached)
//   3 golden light column, far fries (behind Hayk), sparkles
//   4 Hayk
//   5 tray / hero fries flying into the mouth, near fries (in front)
//   6 SFX, notes, sparkles
//   7 screen-fixed caption and bubble
(function () {
  'use strict';
  const ID = 'mcdonuts';
  const FILM = window.FILM;
  const F = FILM.fx;
  const P = F.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const W = 1080, H = 1920;
  const FR = 1 / 24;
  // offscreen canvases match the main canvas backing (CPU when the frame is read back, as in the
  // tools), otherwise every drawImage of a cached layer costs a GPU readback
  let WRF = false;
  // full-frame cached layers are drawn with nearest-neighbour sampling: under a camera push a
  // bilinear resample of 2 M pixels costs ~50 ms on a CPU-backed canvas; flat cel art hides the difference
  function drawLayer(ctx, img, x, y, w, h) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, x, y, w, h);
    ctx.restore();
  }
  const wrfOf = (ctx) => !!(ctx.getContextAttributes && ctx.getContextAttributes().willReadFrequently);
  const h = (...k) => F.h01(ID, ...k);

  const T_NOM = [0.5, 1.0, 1.5]; // T 44.5, 45.0, 45.5
  const T_TRAY = 2.0; // T 46.0
  const T_SING = 3.0; // T 47.0

  const HX = 610, HY = 1830, HS = 1.65;
  const GROUND = 1500;

  // ---------------------------------------------------------------------------
  // Static background
  // ---------------------------------------------------------------------------
  function townBlock(g, x, y, w, hh, wall, roof, seed) {
    g.fillStyle = wall;
    g.fillRect(x, y, w, hh);
    g.fillStyle = roof;
    g.beginPath(); g.moveTo(x - 12, y); g.lineTo(x + w / 2, y - 40); g.lineTo(x + w + 12, y); g.closePath(); g.fill();
    g.fillStyle = 'rgba(80,60,90,0.28)';
    const cols = Math.max(1, Math.floor(w / 60));
    for (let r = 0; r < Math.floor(hh / 90); r++) {
      for (let c = 0; c < cols; c++) {
        const wx = x + 18 + c * (w - 36) / cols, wy = y + 30 + r * 90;
        g.fillRect(wx, wy, 26, 40);
        if (h('bal', seed, r, c) > 0.6) { g.fillRect(wx - 6, wy + 40, 38, 6); }
      }
    }
  }
  function palm(g, x, y, s, lean) {
    g.save();
    g.translate(x, y);
    g.scale(s, s);
    g.strokeStyle = '#8a6a44'; g.lineWidth = 22; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(lean * 60, -200, lean * 90, -420); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 4;
    for (let i = 1; i < 10; i++) { const u = i / 10; const px = lean * 90 * u * u + lean * 20 * u, py = -420 * u; g.beginPath(); g.moveTo(px - 11, py); g.lineTo(px + 11, py - 6); g.stroke(); }
    const tx = lean * 90, ty = -420;
    g.fillStyle = '#4f9a4a';
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI / 2 + (i - 3) * 0.5;
      g.save();
      g.translate(tx, ty);
      g.rotate(a);
      g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(90, -40, 190, 30); g.quadraticCurveTo(90, 0, 0, 0); g.fill();
      g.restore();
    }
    g.restore();
  }
  function donutLogo(g, x, y, r) {
    // golden donut with a bite taken out (the McDONUT'S logo)
    g.save();
    // glow
    const gl = g.createRadialGradient(x, y, r * 0.5, x, y, r * 1.8);
    gl.addColorStop(0, 'rgba(255,230,120,0.55)');
    gl.addColorStop(1, 'rgba(255,230,120,0)');
    g.fillStyle = gl; g.fillRect(x - r * 2, y - r * 2, r * 4, r * 4);
    // pole
    g.fillStyle = '#7b7f8c'; g.fillRect(x - 14, y + r * 0.8, 28, 120);
    g.strokeStyle = P.line; g.lineWidth = 4; g.strokeRect(x - 14, y + r * 0.8, 28, 120);
    // donut ring with a bite: draw ring then cut the bite
    const bite = (gg) => {
      gg.moveTo(x + r * 0.95 + 0, y - r * 0.55);
      gg.arc(x + r * 0.78, y - r * 0.62, r * 0.36, 0, TAU);
      gg.moveTo(x + r * 1.02, y - r * 0.2);
      gg.arc(x + r * 0.98, y - r * 0.18, r * 0.24, 0, TAU);
    };
    const c = FILM.makeCanvas(Math.ceil(r * 3 * (FILM.S || 1)), Math.ceil(r * 3 * (FILM.S || 1)));
    const d = c.getContext('2d', { willReadFrequently: WRF });
    const S = FILM.S || 1;
    d.setTransform(S, 0, 0, S, (r * 1.5 - x) * S, (r * 1.5 - y) * S);
    d.beginPath(); d.arc(x, y, r, 0, TAU); d.arc(x, y, r * 0.38, 0, TAU, true);
    F.fo(d, P.mcGold, 9);
    // icing
    d.beginPath();
    for (let i = 0; i <= 40; i++) { const a = (i / 40) * TAU; const rr = r * (0.9 + 0.05 * Math.sin(a * 7)); d.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    for (let i = 40; i >= 0; i--) { const a = (i / 40) * TAU; d.lineTo(x + Math.cos(a) * r * 0.48, y + Math.sin(a) * r * 0.48); }
    d.closePath();
    F.fo(d, '#ffb347', 5);
    d.fillStyle = 'rgba(255,255,255,0.55)';
    F.ellipse(d, x - r * 0.45, y - r * 0.5, r * 0.22, r * 0.08, -0.7); d.fill();
    // sprinkles
    const cols = ['#ff4f86', '#35b4ff', '#ffffff', '#6ccf4a', '#e8413c'];
    for (let i = 0; i < 22; i++) {
      const a = h('spr', i) * TAU, rr = r * (0.55 + h('sprr', i) * 0.32);
      d.save(); d.translate(x + Math.cos(a) * rr, y + Math.sin(a) * rr); d.rotate(h('spra', i) * 3);
      d.fillStyle = cols[i % cols.length]; F.rrect(d, -9, -3, 18, 6, 3); d.fill();
      d.restore();
    }
    // bite
    d.globalCompositeOperation = 'destination-out';
    d.beginPath(); bite(d); d.fill();
    d.globalCompositeOperation = 'source-atop';
    d.strokeStyle = P.line; d.lineWidth = 9;
    d.beginPath(); bite(d); d.stroke();
    d.globalCompositeOperation = 'source-over';
    g.drawImage(c, x - r * 1.5, y - r * 1.5, r * 3, r * 3);
    g.restore();
  }
  function buildSky() {
    const S = FILM.S || 1;
    const c = FILM.makeCanvas(Math.round(W * S), Math.round(H * S));
    const g = c.getContext('2d', { willReadFrequently: WRF });
    g.setTransform(S, 0, 0, S, 0, 0);
    F.sky(g, P.spainSky, '#d4efff', { h: 1300, mid: '#8fd0ff', midAt: 0.5 });
    g.fillStyle = '#d4efff'; g.fillRect(0, 1300, W, 620);
    // sun
    g.fillStyle = 'rgba(255,248,200,0.5)'; g.beginPath(); g.arc(150, 520, 130, 0, TAU); g.fill();
    g.fillStyle = '#fff6c8'; g.beginPath(); g.arc(150, 520, 80, 0, TAU); g.fill();
    return c;
  }
  function buildBg() {
    const S = FILM.S || 1;
    const c = FILM.makeCanvas(Math.round(W * S), Math.round(H * S));
    const g = c.getContext('2d', { willReadFrequently: WRF });
    g.setTransform(S, 0, 0, S, 0, 0);
    // far town, soft (no outlines)
    townBlock(g, -20, 900, 170, 560, '#f3dcb4', '#e89a78', 1);
    townBlock(g, 960, 860, 150, 600, '#f0d3a2', '#e3895f', 2);
    townBlock(g, 100, 1010, 120, 450, '#f7e6c8', '#d9653b', 3);
    townBlock(g, 900, 980, 120, 480, '#f7e6c8', '#d9653b', 4);
    palm(g, 70, 1460, 1.05, 0.5);
    palm(g, 1010, 1460, 1.1, -0.45);
    // golden donut logo standing on the roof (pole hidden behind the parapet)
    donutLogo(g, 800, 405, 108);
    // --- the McDONUT'S building
    const x0 = 150, x1 = 930, top = 580;
    // roof parapet
    F.rrect(g, x0 - 20, top - 40, x1 - x0 + 40, 60, 10); F.fo(g, '#b51f16', 5);
    // facade
    g.beginPath(); g.rect(x0, top, x1 - x0, GROUND - top); F.fo(g, P.mcRed, 5);
    g.fillStyle = 'rgba(0,0,0,0.08)';
    for (let i = 0; i < 8; i++) g.fillRect(x0 + 20 + i * 100, top + 10, 8, GROUND - top - 20);
    // sign band with the name
    F.rrect(g, x0 + 30, top + 30, x1 - x0 - 60, 170, 20); F.fo(g, '#9e1a12', 5);
    F.rrect(g, x0 + 42, top + 42, x1 - x0 - 84, 146, 14);
    g.strokeStyle = P.mcGold; g.lineWidth = 6; g.stroke();
    F.text(g, "McDONUT'S", (x0 + x1) / 2, top + 116, { size: 116, fill: P.mcGold, stroke: P.line, lw: 14, shadow: 7, shadowColor: '#5a0d08', skew: -0.08 });
    // awning stripes
    const ay = top + 230;
    for (let i = 0; i < 13; i++) {
      g.beginPath();
      const ax = x0 + i * 60;
      g.moveTo(ax, ay); g.lineTo(ax + 60, ay); g.lineTo(ax + 64, ay + 80); g.quadraticCurveTo(ax + 32, ay + 104, ax - 4 + 4, ay + 80); g.closePath();
      g.fillStyle = i % 2 ? '#ffffff' : P.mcGold; g.fill();
    }
    g.strokeStyle = P.line; g.lineWidth = 4;
    g.beginPath(); g.moveTo(x0, ay); g.lineTo(x1, ay); g.stroke();
    // windows with a warm interior
    [[x0 + 40, 280], [x1 - 320, 280]].forEach(([wx, ww], k) => {
      const wy = ay + 130, wh = 330;
      g.beginPath(); g.rect(wx, wy, ww, wh); F.fo(g, '#ffe6a8', 6);
      g.fillStyle = '#ffd27a'; g.fillRect(wx, wy + wh * 0.62, ww, wh * 0.38);
      // menu board and people silhouettes inside
      g.fillStyle = '#5a2d1f'; g.fillRect(wx + 30, wy + 30, ww - 60, 60);
      g.fillStyle = P.mcGold;
      for (let i = 0; i < 3; i++) g.fillRect(wx + 44 + i * (ww - 90) / 3, wy + 44, (ww - 120) / 3, 30);
      g.fillStyle = 'rgba(120,50,40,0.45)';
      for (let i = 0; i < 2; i++) { const px = wx + 70 + i * 130 + k * 20; g.beginPath(); g.arc(px, wy + 170, 28, 0, TAU); g.fill(); F.rrect(g, px - 36, wy + 196, 72, 110, 30); g.fill(); }
      g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 10;
      g.beginPath(); g.moveTo(wx + 30, wy + wh - 30); g.lineTo(wx + 110, wy + 40); g.moveTo(wx + 70, wy + wh - 20); g.lineTo(wx + 130, wy + 120); g.stroke();
      g.strokeStyle = P.line; g.lineWidth = 6; g.strokeRect(wx, wy, ww, wh);
      g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.stroke();
    });
    // door (mostly behind Hayk)
    g.beginPath(); g.rect(480, ay + 150, 180, GROUND - ay - 150); F.fo(g, '#ffe6a8', 6);
    g.strokeStyle = P.line; g.lineWidth = 5; g.beginPath(); g.moveTo(570, ay + 150); g.lineTo(570, GROUND); g.stroke();
    // golden donut logo on the roof
    // sidewalk
    g.fillStyle = P.sand; g.fillRect(0, GROUND, W, H - GROUND);
    g.fillStyle = P.sandShade; g.fillRect(0, GROUND, W, 16);
    g.strokeStyle = 'rgba(160,120,70,0.35)'; g.lineWidth = 3;
    for (let i = -6; i < 14; i++) { g.beginPath(); g.moveTo(540 + i * 110 * 0.6, GROUND + 16); g.lineTo(540 + i * 170, H); g.stroke(); }
    for (let j = 0; j < 6; j++) { const yy = GROUND + 16 + Math.pow(j / 6, 1.5) * 480; g.beginPath(); g.moveTo(0, yy); g.lineTo(W, yy); g.stroke(); }
    // planters
    [[190, GROUND + 40], [900, GROUND + 40]].forEach(([px, py]) => {
      F.rrect(g, px - 60, py - 70, 120, 80, 12); F.fo(g, '#d9653b', 5);
      g.fillStyle = P.tree; g.beginPath(); g.arc(px - 25, py - 90, 34, 0, TAU); g.arc(px + 20, py - 100, 40, 0, TAU); g.arc(px, py - 130, 32, 0, TAU); g.fill();
      g.fillStyle = '#ff6f91'; [[-30, -110], [18, -130], [30, -88]].forEach(([fx, fy]) => { g.beginPath(); g.arc(px + fx, py + fy, 9, 0, TAU); g.fill(); });
    });
    return c;
  }

  // ---------------------------------------------------------------------------
  // Fries rain
  // ---------------------------------------------------------------------------
  const RAIN_N = 34;
  function fry(ctx, x, y, s, rot, trail) {
    if (trail > 0) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = '#fff1a0';
      ctx.lineWidth = 14 * s;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y - 40 * s); ctx.lineTo(x, y - (40 + trail) * s); ctx.stroke();
      ctx.restore();
    }
    F.fries(ctx, x, y, s, { box: false, rot });
  }
  function rain(ctx, t, layer, speedK) {
    // layer 0: far (small, behind Hayk); layer 1: near (big, in front, few)
    const n = layer ? 6 : RAIN_N;
    const span = 2200;
    for (let i = 0; i < n; i++) {
      const s = layer ? 1.25 + h('rs1', i) * 0.4 : 0.55 + h('rs0', i) * 0.55;
      const v = (layer ? 190 : 120) * (0.7 + h('rv', layer, i) * 0.6) * speedK;
      const y = ((h('ry', layer, i) * span + t * v) % span) - 200;
      let x = h('rx', layer, i) * (W + 100) - 50;
      if (layer) x = h('rx1', i) < 0.5 ? 40 + h('rxa', i) * 220 : 840 + h('rxb', i) * 220;
      x += Math.sin(t * 1.3 + i) * 20;
      const rot = h('rr', layer, i) * TAU + t * (h('rw', layer, i) - 0.5) * 1.6;
      fry(ctx, x, y, s, rot, 60 + 60 * h('rt', i));
    }
  }

  function tray(ctx, x, y, t) {
    // tray held in front of the belly, with burger, fries and drink
    ctx.save();
    ctx.translate(x, y);
    F.drink(ctx, 130, 0, 0.72, { color: P.mcRed });
    F.fries(ctx, -130, 4, 0.78, { color: P.mcRed });
    F.burger(ctx, 0, -40, 0.85, { rot: 0.03 * Math.sin(t * 8) });
    ctx.beginPath();
    ctx.moveTo(-250, 0); ctx.lineTo(250, 0); ctx.lineTo(230, 44); ctx.lineTo(-230, 44); ctx.closePath();
    F.fo(ctx, '#e8413c', 5);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-236, 6, 472, 8);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib;
      const t = clamp(tIn, 0, info.dur);
      WRF = wrfOf(ctx);
      const tw = L.onTwos(t);
      const hitFrames = (a, n) => t >= a - 1e-6 && t < a + n * FR - 1e-6;
      const trayMode = t >= T_TRAY;

      const push = 1 + 0.04 * L.ease.inOutSine(clamp(t / info.dur)) + (hitFrames(T_TRAY, 3) ? 0.04 : 0);
      const sh = F.shakeMany(t, [[T_TRAY, 0.3, 14]], 3);
      ctx.save();
      ctx.translate(W / 2 + sh[0], 1100 + sh[1]);
      ctx.scale(push, push);
      ctx.translate(-W / 2, -1100);

      // 1-2. background
      drawLayer(ctx, L.cached(ID + '-sky-' + (FILM.S || 1) + (WRF ? 'r' : 'g'), buildSky), 0, 0, W, H);
      F.clouds(ctx, { n: 4, seed: 44, t, y: 380, h: 300, speed: 14, scale: 0.8 });
      drawLayer(ctx, L.cached(ID + '-bg-' + (FILM.S || 1) + (WRF ? 'r' : 'g'), buildBg), 0, 0, W, H);

      // 3. golden light column + god rays onto Hayk
      ctx.save();
      const beamA = trayMode ? 0.22 : 0.32;
      const gr = ctx.createLinearGradient(0, 0, 0, HY);
      gr.addColorStop(0, `rgba(255,236,140,${beamA})`);
      gr.addColorStop(1, `rgba(255,214,90,${beamA * 0.6})`);
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.moveTo(HX - 170, -20); ctx.lineTo(HX + 170, -20); ctx.lineTo(HX + 360, HY); ctx.lineTo(HX - 360, HY); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#fff6d0';
      for (let i = 0; i < 5; i++) {
        const u = (i + 0.5) / 5, wv = 18 + 10 * Math.sin(t * 2 + i);
        const xt = HX - 150 + u * 300, xb = HX - 330 + u * 660;
        ctx.beginPath(); ctx.moveTo(xt - wv, -20); ctx.lineTo(xt + wv, -20); ctx.lineTo(xb + wv * 2, HY); ctx.lineTo(xb - wv * 2, HY); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      rain(ctx, t, 0, trayMode ? 0.8 : 1);
      F.sparkles(ctx, { x: 60, y: 300, w: 960, h: 1200, n: 16, seed: 12, t, size: 30, color: '#fff3a0' });

      // 4. Hayk
      let sx = 1, sy = 1;
      const hitNow = T_NOM.some((a) => hitFrames(a, 2)) || hitFrames(T_TRAY, 2);
      if (hitNow) { sx = 1.06; sy = 0.92; }
      const sway = t >= T_SING ? Math.sin((tw - T_SING) * Math.PI * 2) * 0.06 : 0;
      const hop = trayMode ? F.bounce(tw, 2, 14) : F.bounce(tw, 2, 8);
      ctx.save();
      ctx.translate(HX, HY); ctx.scale(sx, sy); ctx.translate(-HX, -HY);
      const a = FILM.cast.hayk(ctx, {
        x: HX, y: HY + hop, s: HS, t, belly: 0.25, crown: true, tilt: sway,
        pose: trayMode ? 'hug' : 'cheer',
        face: !trayMode ? 'ecstatic' : t >= T_SING ? 'neutral' : 'happy',
        mouth: t >= T_SING ? (Math.floor((t - T_SING) * 4 + 1e-6) % 2 ? 'open' : 'shout') : undefined,
        look: [0.2, -0.25],
        headTilt: trayMode ? sway * 1.5 : -0.12 + 0.05 * Math.sin(tw * 3),
      });
      ctx.restore();

      // 5. tray / hero fries
      if (trayMode) {
        const tp = F.popIn(t, T_TRAY);
        const tx = (a.handL[0] + a.handR[0]) / 2, ty = (a.handL[1] + a.handR[1]) / 2 + 30;
        ctx.save();
        ctx.translate(tx, ty); ctx.scale(tp, tp); ctx.translate(-tx, -ty);
        tray(ctx, tx, ty, t);
        ctx.restore();
        // thumbs over the tray rim
        [a.handL, a.handR].forEach((q) => { F.ellipse(ctx, q[0], ty + 4, 22, 16); F.fo(ctx, P.skin, 5); });
      } else {
        // three hero fries arc into the open mouth on the beats
        T_NOM.forEach((tn, i) => {
          const u = (t - (tn - 0.9)) / 0.9;
          if (u < 0 || u >= 1) return;
          const sxp = [360, 820, 480][i], syp = -80;
          const e = L.ease.inQuad(u);
          const x = lerp(sxp, a.mouth[0], e) + Math.sin(u * Math.PI) * (i % 2 ? -40 : 40);
          const y = lerp(syp, a.mouth[1] - 30, e);
          fry(ctx, x, y, 1.3, (1 - u) * (i % 2 ? 2 : -2) + Math.PI, 90);
        });
      }
      rain(ctx, t, 1, trayMode ? 0.8 : 1);
      ctx.restore(); // camera

      // 6. effects
      const mx = a.mouth[0], my = a.mouth[1];
      if (!trayMode) {
        T_NOM.forEach((tn, i) => {
          F.sfx(ctx, 'NOM!', i % 2 ? mx + 250 : mx - 250, my - 120 - i * 30, t, tn, { size: 100, rot: i % 2 ? 0.15 : -0.15, life: 0.45, fill: '#ffffff', shadowColor: P.mcRed });
          F.crumbs(ctx, mx, my, t - tn, { n: 8, spread: 260, seed: 20 + i, colors: [P.fries, P.friesShade, '#fff3a0'] });
        });
        F.sparkle(ctx, a.eyeL[0] - 50, a.eyeL[1] - 50, 30 + 10 * Math.sin(t * 9));
        F.sparkle(ctx, a.eyeR[0] + 50, a.eyeR[1] - 40, 24 + 8 * Math.sin(t * 11));
      } else {
        const age = t - T_TRAY;
        if (age < 0.5) {
          F.shockRing(ctx, (a.handL[0] + a.handR[0]) / 2, (a.handL[1] + a.handR[1]) / 2 - 60, age, { r: 520, life: 0.45, color: '#fff6c0' });
          for (let i = 0; i < 8; i++) {
            const an = (i / 8) * TAU + 0.3, rr = 160 + age * 700;
            F.sparkle(ctx, (a.handL[0] + a.handR[0]) / 2 + Math.cos(an) * rr, (a.handL[1] + a.handR[1]) / 2 - 80 + Math.sin(an) * rr, 44 * (1 - age * 1.6));
          }
        }
        F.sparkles(ctx, { x: HX - 320, y: a.handL[1] - 260, w: 640, h: 360, n: 6, seed: 61, t, size: 34 });
        if (t >= T_SING) {
          F.notes(ctx, mx + 170, my - 10, t - T_SING, { n: 4, seed: 8, color: P.mcGold, size: 70, rise: 300 });
          F.notes(ctx, 200, 1180, t - T_SING + 0.4, { n: 3, seed: 9, color: '#ffffff', size: 60, rise: 260 });
        }
      }

      // 7. screen-fixed text
      F.caption(ctx, "STOP 3: McDONUT'S", 70, 290, { size: 54, bg: P.mcRed, accent: P.mcGold });
      if (t >= T_SING) {
        const b = Math.floor((t - T_SING) * 4) % 2;
        F.bubble(ctx, 'BA DA BA BA BAAA!', 265, 1000 + (b ? -6 : 0), { size: 54, maxW: 330, t, t0: T_SING, tail: [mx - 70, my - 10] });
        F.text(ctx, '♪', 110 + (b ? 6 : 0), 840, { size: 80, fill: P.mcGold, stroke: P.line, lw: 7, font: 'sym', rot: -0.2 });
        F.text(ctx, '♫', 420 - (b ? 6 : 0), 830, { size: 74, fill: '#ffffff', stroke: P.line, lw: 7, font: 'sym', rot: 0.2 });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/12-food-nirvana.js
// Shot 12 'food-nirvana' : "Burger nirvana"  (global T 49.0 - 54.0, local t 0..5)
//
// Cooking-anime food-reaction climax. Hayk (pose float, face ecstatic, belly 0.35, crown) floats in
// a purple-and-gold cosmos; burgers, fries and drumsticks orbit him on a tilted ellipse (back half
// behind him, front half in front). Golden beams rotate behind him, radial focus lines pulse on
// every beat, his body glows.
//
// Beats (local):
//   0.0   (core flash transition in) cosmos already complete
//   1.0   "SO... GOOD...!!" slams in (gold, outlined), small shake
//   2.5   a halo of melting cheese pops in above his head and starts dripping
//   4.0   white flash out: a light burst from his chest fills the frame
//
// Layers back to front:
//   1 cosmos (cached): gradient, nebula clouds, far stars
//   2 animated: spiral nebula arms, twinkling stars, golden beams, pulsing focus lines
//   3 back half of the food orbit
//   4 glow + gold aura, Hayk, wind streaks
//   5 cheese halo
//   6 front half of the food orbit, sparkles
//   7 screen-fixed title text, white flash
(function () {
  'use strict';
  const ID = 'food-nirvana';
  const FILM = window.FILM;
  const F = FILM.fx;
  const P = F.pal;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const W = 1080, H = 1920;
  const FR = 1 / 24;
  // offscreen canvases match the main canvas backing (CPU when the frame is read back, as in the
  // tools), otherwise every drawImage of a cached layer costs a GPU readback
  let WRF = false;
  // full-frame cached layers are drawn with nearest-neighbour sampling: under a camera push a
  // bilinear resample of 2 M pixels costs ~50 ms on a CPU-backed canvas; flat cel art hides the difference
  function drawLayer(ctx, img, x, y, w, h) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, x, y, w, h);
    ctx.restore();
  }
  const wrfOf = (ctx) => !!(ctx.getContextAttributes && ctx.getContextAttributes().willReadFrequently);
  const h = (...k) => F.h01(ID, ...k);

  const T_TEXT = 1.0; // T 50.0
  const T_HALO = 2.5; // T 51.5
  const T_FLASH = 4.0; // T 53.0

  const HX = 540, HY = 1720, HS = 1.7;
  const OC = [540, 1230]; // orbit centre
  const ORX = 450, ORY = 150, OTILT = -0.14;
  const PURPLE_D = '#1a0b3a', PURPLE = '#3b1d6e', VIOLET = '#7a3cff';

  // ---------------------------------------------------------------------------
  function buildCosmos() {
    const S = FILM.S || 1;
    const c = FILM.makeCanvas(Math.round((W + 120) * S), Math.round((H + 120) * S));
    const g = c.getContext('2d', { willReadFrequently: WRF });
    g.setTransform(S, 0, 0, S, 60 * S, 60 * S);
    F.sky(g, PURPLE_D, '#2a0f4a', { x: -60, y: -60, w: W + 120, h: H + 120, mid: PURPLE, midAt: 0.5 });
    // nebula clouds: overlapping soft radial blobs
    const blob = (x, y, r, col, a) => {
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, col.replace('A', a));
      gr.addColorStop(1, col.replace('A', 0));
      g.fillStyle = gr;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    };
    blob(540, 1000, 900, 'rgba(122,60,255,A)', 0.55);
    blob(200, 500, 520, 'rgba(255,79,180,A)', 0.35);
    blob(880, 700, 560, 'rgba(90,120,255,A)', 0.35);
    blob(300, 1500, 600, 'rgba(255,120,200,A)', 0.25);
    blob(860, 1450, 520, 'rgba(255,204,51,A)', 0.22);
    blob(540, 1050, 520, 'rgba(255,214,90,A)', 0.55);
    // far stars (static)
    g.fillStyle = '#ffffff';
    for (let i = 0; i < 260; i++) {
      const x = h('fs', i) * W, y = h('fsy', i) * H, r = 0.8 + h('fsr', i) * 1.8;
      g.globalAlpha = 0.3 + h('fsa', i) * 0.6;
      g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
    // a few distant cross stars
    for (let i = 0; i < 12; i++) F.sparkle(g, h('cs', i) * W, h('csy', i) * H, 10 + h('csr', i) * 16, { color: i % 3 ? '#ffffff' : '#ffe9a0' });
    return c;
  }

  function nebulaArms(ctx, t) {
    // slow rotating spiral arms around the orbit centre
    ctx.save();
    ctx.translate(OC[0], OC[1] - 150);
    ctx.rotate(t * 0.12);
    ctx.lineCap = 'round';
    for (let arm = 0; arm < 3; arm++) {
      ctx.save();
      ctx.rotate((arm / 3) * TAU);
      for (let k = 0; k < 2; k++) {
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const u = i / 40;
          const a = u * 3.2 + k * 0.25;
          const r = 120 + u * 900;
          const x = Math.cos(a) * r, y = Math.sin(a) * r * 0.62;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = k ? 'rgba(255,214,90,0.12)' : 'rgba(200,140,255,0.16)';
        ctx.lineWidth = k ? 40 : 90;
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function beams(ctx, x, y, t, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const n = 16, rot = t * 0.35;
    const gr = ctx.createRadialGradient(x, y, 40, x, y, 1500);
    gr.addColorStop(0, 'rgba(255,240,170,0.9)');
    gr.addColorStop(0.5, 'rgba(255,204,51,0.35)');
    gr.addColorStop(1, 'rgba(255,204,51,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a0 = rot + (i / n) * TAU, a1 = a0 + (TAU / n) * (0.28 + 0.12 * Math.sin(i * 1.7));
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a0) * 1600, y + Math.sin(a0) * 1600);
      ctx.lineTo(x + Math.cos(a1) * 1600, y + Math.sin(a1) * 1600);
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
  }

  // --- the orbiting food
  const ITEMS = ['burger', 'fries', 'drumstick', 'burger', 'drink', 'drumstick', 'fries', 'burger'];
  function orbitPos(i, t) {
    const a = (i / ITEMS.length) * TAU + t * 0.9;
    const ex = Math.cos(a) * ORX, ey = Math.sin(a) * ORY;
    const x = OC[0] + ex * Math.cos(OTILT) - ey * Math.sin(OTILT);
    const y = OC[1] + ex * Math.sin(OTILT) + ey * Math.cos(OTILT);
    return { x, y, depth: Math.sin(a), a };
  }
  function drawItem(ctx, kind, x, y, s, rot, t, i) {
    // soft glow behind each item
    const gr = ctx.createRadialGradient(x, y, 10, x, y, 150 * s);
    gr.addColorStop(0, 'rgba(255,230,140,0.55)');
    gr.addColorStop(1, 'rgba(255,230,140,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(x - 150 * s, y - 150 * s, 300 * s, 300 * s);
    switch (kind) {
      case 'burger': F.burger(ctx, x, y, 0.62 * s, { rot }); break;
      case 'fries': F.fries(ctx, x, y + 60 * s, 0.62 * s, { color: P.mcRed }); break;
      case 'drumstick': F.drumstick(ctx, x - 60 * s, y + 10 * s, 0.7 * s, { rot: rot - 0.4 }); break;
      case 'drink': F.drink(ctx, x, y + 70 * s, 0.55 * s, {}); break;
      default: break;
    }
    // trailing sparkle
    F.sparkle(ctx, x + 70 * s, y - 60 * s, (14 + 8 * Math.sin(t * 7 + i)) * s);
  }
  function orbit(ctx, t, front) {
    const list = ITEMS.map((k, i) => Object.assign({ k, i }, orbitPos(i, t))).filter((o) => (front ? o.depth >= 0 : o.depth < 0));
    list.sort((p, q) => p.depth - q.depth);
    list.forEach((o) => {
      const s = lerp(0.7, 1.25, (o.depth + 1) / 2);
      drawItem(ctx, o.k, o.x, o.y, s, Math.sin(t * 2 + o.i) * 0.3, t, o.i);
    });
  }

  // --- the melting cheese halo
  function cheeseHalo(ctx, x, y, t) {
    const age = t - T_HALO;
    if (age < -1e-6) return;
    const sc = F.popIn(t, T_HALO);
    const rx = 190, ry = 50;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    // glow
    const gr = ctx.createRadialGradient(0, 0, 40, 0, 0, 300);
    gr.addColorStop(0, 'rgba(255,230,120,0.6)');
    gr.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(-300, -300, 600, 600);
    // ring (thick ellipse band)
    ctx.beginPath();
    ctx.ellipse(0, 0, rx + 26, ry + 16, 0, 0, TAU);
    ctx.ellipse(0, 0, rx - 26, ry - 14, 0, 0, TAU, true);
    F.fo(ctx, P.cheese, 6);
    // drips hanging off the front edge, growing with age
    const grow = clamp(age / 1.2);
    for (let i = 0; i < 7; i++) {
      const u = (i + 0.5) / 7;
      const a = Math.PI * (0.12 + u * 0.76);
      const px = Math.cos(a) * (rx + 10), py = Math.sin(a) * (ry + 12);
      const len = (30 + 70 * h('drip', i)) * grow + 10 + 8 * Math.sin(t * 5 + i);
      const w = 13 + 5 * h('dw', i);
      ctx.beginPath();
      ctx.moveTo(px - w, py - 6);
      ctx.lineTo(px - w * 0.8, py + len);
      ctx.arc(px, py + len, w * 0.8, Math.PI, 0, true);
      ctx.lineTo(px + w, py - 6);
      ctx.closePath();
      F.fo(ctx, P.cheese, 5);
      ctx.fillStyle = P.cheese;
      ctx.fillRect(px - w + 3, py - 14, w * 2 - 6, 14);
      // falling droplet loop
      const du = ((t * 0.9 + h('dd', i)) % 1 + 1) % 1;
      if (grow > 0.5 && i % 2 === 0) {
        F.ellipse(ctx, px, py + len + 20 + du * 220, 9, 12);
        ctx.globalAlpha = 1 - du;
        F.fo(ctx, P.cheese, 4);
        ctx.globalAlpha = 1;
      }
    }
    // highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(0, -4, rx, ry, 0, Math.PI * 1.15, Math.PI * 1.45); ctx.stroke();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib;
      const t = clamp(tIn, 0, info.dur);
      WRF = wrfOf(ctx);
      const tw = L.onTwos(t);
      const hitFrames = (a, n) => t >= a - 1e-6 && t < a + n * FR - 1e-6;
      const bp = F.beatPulse(t, 0.5, 0.16);

      const push = 1 + 0.07 * L.ease.inOutSine(clamp(t / info.dur)) + (hitFrames(T_TEXT, 2) ? 0.03 : 0);
      const roll = Math.sin(t * 1.3) * 0.015;
      const sh = F.shakeMany(t, [[T_TEXT, 0.35, 16], [T_HALO, 0.25, 8], [T_FLASH, 0.3, 20]], 5);
      ctx.save();
      ctx.translate(W / 2 + sh[0], 1100 + sh[1]);
      ctx.rotate(roll);
      ctx.scale(push, push);
      ctx.translate(-W / 2, -1100);

      // 1. cosmos
      drawLayer(ctx, L.cached(ID + '-cosmos-' + (FILM.S || 1) + (WRF ? 'r' : 'g'), buildCosmos), -60, -60, W + 120, H + 120);
      // 2. animated sky
      nebulaArms(ctx, t);
      F.stars(ctx, { n: 90, seed: 49, x: 0, y: 0, w: W, h: H });
      const bob = Math.sin(t * Math.PI) * 18;
      const cx = HX, cy = HY - 560 + bob; // chest-ish centre of the glow
      beams(ctx, cx, cy - 120, t, 0.8);
      F.focusLines(ctx, cx, cy - 100, { inner: 470, count: 90, color: '#fff2c0', alpha: 0.12 + 0.45 * bp, seed: 12, width: 14, rx: 470, ry: 620 });

      // 3. back of the orbit
      orbit(ctx, t, false);

      // 4. Hayk with glow and aura
      const glow = ctx.createRadialGradient(cx, cy - 80, 60, cx, cy - 80, 620);
      glow.addColorStop(0, 'rgba(255,250,210,0.95)');
      glow.addColorStop(0.45, 'rgba(255,214,90,0.45)');
      glow.addColorStop(1, 'rgba(255,214,90,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(cx - 620, cy - 700, 1240, 1240);
      F.aura(ctx, HX, HY + bob - 40, 620, 1120, t, { color: '#ffcc33', core: '#fff3b0', alpha: 0.55, seed: 4 });
      const a = FILM.cast.hayk(ctx, {
        x: HX, y: HY + bob, s: HS, t, pose: 'float', face: 'ecstatic', belly: 0.35, crown: true,
        tilt: Math.sin(tw * 1.6) * 0.04, headTilt: -0.05,
      });
      // hoodie flutter: wind streaks rising past his body
      F.speedLines(ctx, { x: HX - 360, y: HY - 1000, w: 720, h: 1050, angle: -Math.PI / 2, count: 18, color: '#fff6d8', alpha: 0.5, t, speed: 900, len: 240, width: 5, seed: 7 });

      // 5. cheese halo above the crown
      cheeseHalo(ctx, a.top[0], a.top[1] - 115, t);

      // 6. front of the orbit + sparkles
      orbit(ctx, t, true);
      F.sparkles(ctx, { x: 80, y: 500, w: 920, h: 1100, n: 18, seed: 23, t, size: 34, color: '#fff3a0' });
      F.sparkle(ctx, a.eyeL[0] - 40, a.eyeL[1] - 40, 34 + 10 * bp);
      F.sparkle(ctx, a.eyeR[0] + 40, a.eyeR[1] - 30, 28 + 8 * bp);
      ctx.restore(); // camera

      // 7. screen-fixed: the title line
      if (t >= T_TEXT - 1e-6) {
        const sc = F.popIn(t, T_TEXT);
        const j = F.wiggle(t, 3, 3);
        F.text(ctx, 'SO...\nGOOD...!!', 540 + j, 395, {
          size: 138, fill: P.gold, stroke: P.line, lw: 20, scale: sc, rot: -0.06, skew: -0.1,
          shadow: 10, shadowColor: '#7a2a00', lineHeight: 1.05,
        });
        F.sparkle(ctx, 860, 330, 40 * sc * (0.7 + 0.3 * bp));
        F.sparkle(ctx, 190, 520, 30 * sc * (0.7 + 0.3 * Math.sin(t * 8)));
      }

      // white flash out: a hard white frame on the beat, then the light swallows the picture
      if (t >= T_FLASH - 1e-6) {
        const u = clamp((t - T_FLASH - 2 * FR) / (info.dur - T_FLASH - 3 * FR));
        const gx = a.chest[0], gy = a.chest[1] - 60;
        // white rays bursting out of his chest
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        const n = 20, rot = t * 0.6;
        for (let i = 0; i < n; i++) {
          const a0 = rot + (i / n) * TAU, a1 = a0 + (TAU / n) * (0.25 + 0.3 * u);
          ctx.moveTo(gx, gy);
          ctx.lineTo(gx + Math.cos(a0) * 2400, gy + Math.sin(a0) * 2400);
          ctx.lineTo(gx + Math.cos(a1) * 2400, gy + Math.sin(a1) * 2400);
          ctx.closePath();
        }
        ctx.fill();
        ctx.restore();
        const r = 220 + L.ease.inQuad(u) * 1000;
        const gr = ctx.createRadialGradient(gx, gy, r * 0.35, gx, gy, r);
        gr.addColorStop(0, 'rgba(255,255,255,1)');
        gr.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, W, H);
        F.flash(ctx, hitFrames(T_FLASH, 2) ? 1 : 0.3 + 0.5 * L.ease.inQuad(u), '#fffdf4');
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/13-day-counter.js
/*
 * Shot 13 'day-counter' : "Days pass" (T 54.0 - 59.0, 5 s).
 * A tear-off calendar montage in Hayk's Spanish hotel room. Pages fly off on each bar
 * (local 0.0, 2.0, 4.0) revealing DAY 3 / DAY 12 / DAY 24; the chalk tally board rolls
 * BURGERS EATEN 17 -> 58 -> 121 while INVESTORS MET stays 0. Hayk (stand, happy chewing,
 * burger in hand) swells belly 0.4 -> 0.6 -> 0.8. A red "0" stamp slams on the INVESTORS line
 * at local 4.5 with a THUD.
 *
 * Layers, back to front:
 *   1. wall (cached): striped wallpaper, wainscot, terracotta floor
 *   2. arched window: sky cycling day/night fast (sun + moon arcs), rooftops, bell tower, palm
 *   3. calendar: backing board, rings, current page, next page peeking, flying torn page
 *   4. chalk tally board with rolling counters and tally marks
 *   5. growing pile of burger boxes, wrappers, cups on the floor
 *   6. Hayk
 *   7. effects: whoosh speed lines, FWIP sfx, POMF sfx, stamp, THUD, shock ring, sparkles
 */
(function () {
  'use strict';

  const ID = 'day-counter';
  const FR = 1 / 24;
  const TAU = Math.PI * 2;

  // beats (local seconds; global T in comments)
  const FLIPS = [0, 2, 4]; // T 54.0, 56.0, 58.0: page whoosh
  const T_STAMP = 4.5; // T 58.5: stamp THUD

  const DAYS_OLD = [1, 3, 12]; // the page that flies away at each flip
  const DAYS = [3, 12, 24];
  const BURGERS = [17, 58, 121];
  const BURGERS_FROM = [5, 17, 58];
  const BELLY = [0.4, 0.6, 0.8];
  const BELLY_FROM = [0.36, 0.4, 0.6];
  const PILE_N = [7, 15, 26];

  // calendar geometry
  const CAL = { x: 86, y: 262, w: 470, h: 690 };
  // tally board geometry
  const BRD = { x: 60, y: 996, w: 600, h: 372 };
  // window geometry
  const WIN = { x: 648, y: 236, w: 360, h: 520 };

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;

  function pageIndex(t) {
    return t < FLIPS[1] - 1e-6 ? 0 : t < FLIPS[2] - 1e-6 ? 1 : 2;
  }

  // ---------------------------------------------------------------------------
  // 1. static room (cached)
  // ---------------------------------------------------------------------------
  function room(F) {
    return FILM.lib.cached(ID + '-room', () => {
      const c = FILM.makeCanvas(1080, 1920);
      const g = c.getContext('2d', { willReadFrequently: true });
      const P = F.pal;
      // wallpaper
      g.fillStyle = '#fbe5c4';
      g.fillRect(0, 0, 1080, 1520);
      g.fillStyle = '#f4d6ae';
      for (let x = 0; x < 1080; x += 72) g.fillRect(x, 0, 30, 1520);
      // tiny damask dots between stripes
      g.fillStyle = 'rgba(214,150,92,0.35)';
      for (let y = 30; y < 1360; y += 64) {
        for (let x = 51; x < 1080; x += 72) {
          g.beginPath(); g.moveTo(x, y - 9); g.lineTo(x + 6, y); g.lineTo(x, y + 9); g.lineTo(x - 6, y); g.closePath(); g.fill();
        }
      }
      // ceiling shadow
      const sh = g.createLinearGradient(0, 0, 0, 260);
      sh.addColorStop(0, 'rgba(120,60,30,0.28)');
      sh.addColorStop(1, 'rgba(120,60,30,0)');
      g.fillStyle = sh; g.fillRect(0, 0, 1080, 260);
      // wainscot
      g.fillStyle = '#c9814a';
      g.fillRect(0, 1380, 1080, 140);
      g.fillStyle = '#b06b38';
      g.fillRect(0, 1380, 1080, 14);
      g.fillStyle = '#9a5a2e';
      g.fillRect(0, 1500, 1080, 20);
      g.strokeStyle = 'rgba(90,45,20,0.55)'; g.lineWidth = 4;
      for (let x = 30; x < 1080; x += 180) { g.strokeRect(x, 1408, 150, 80); }
      // floor: terracotta tiles in simple perspective
      const fy = 1520;
      const fg = g.createLinearGradient(0, fy, 0, 1920);
      fg.addColorStop(0, '#c96b42'); fg.addColorStop(1, '#e08756');
      g.fillStyle = fg; g.fillRect(0, fy, 1080, 400);
      g.strokeStyle = 'rgba(110,45,20,0.45)'; g.lineWidth = 4;
      const rows = [1520, 1560, 1612, 1680, 1766, 1872, 2000];
      rows.forEach((y) => { g.beginPath(); g.moveTo(0, y); g.lineTo(1080, y); g.stroke(); });
      for (let i = -8; i <= 8; i++) {
        const x0 = 540 + i * 110, x1 = 540 + i * 260;
        g.beginPath(); g.moveTo(x0, fy); g.lineTo(x1, 1920); g.stroke();
      }
      // floor sheen
      g.fillStyle = 'rgba(255,220,180,0.18)';
      g.beginPath(); g.ellipse(700, 1720, 420, 90, 0, 0, TAU); g.fill();
      // window recess (deep sandstone reveal) and sill
      const w = WIN;
      g.fillStyle = '#e2b98c';
      archPath(g, w.x - 26, w.y - 26, w.w + 52, w.h + 40);
      g.fill();
      g.strokeStyle = P.line; g.lineWidth = 5;
      archPath(g, w.x - 26, w.y - 26, w.w + 52, w.h + 40);
      g.stroke();
      // sill
      g.fillStyle = '#f3e3cc';
      g.fillRect(w.x - 44, w.y + w.h + 10, w.w + 88, 30);
      g.strokeRect(w.x - 44, w.y + w.h + 10, w.w + 88, 30);
      g.fillStyle = 'rgba(120,70,40,0.3)';
      g.fillRect(w.x - 40, w.y + w.h + 40, w.w + 80, 14);
      // wall lamp between calendar and window
      g.fillStyle = '#b8862f';
      g.fillRect(596, 560, 10, 70);
      g.beginPath(); g.moveTo(572, 560); g.lineTo(630, 560); g.lineTo(614, 520); g.lineTo(588, 520); g.closePath();
      g.fillStyle = '#ffe9b0'; g.fill(); g.strokeStyle = P.line; g.lineWidth = 4; g.stroke();
      // picture frame: a framed burger "photo" (a joke) under the lamp
      g.fillStyle = '#7a4a26';
      g.fillRect(566, 660, 70, 86);
      g.fillStyle = '#fff4e0'; g.fillRect(574, 668, 54, 70);
      g.strokeStyle = P.line; g.lineWidth = 3; g.strokeRect(566, 660, 70, 86);
      g.save(); g.translate(601, 708); g.scale(0.2, 0.2); g.translate(-601, -708);
      F.burger(g, 601, 708, 1);
      g.restore();
      return c;
    });
  }

  function archPath(g, x, y, w, h) {
    const r = w / 2;
    g.beginPath();
    g.moveTo(x, y + h);
    g.lineTo(x, y + r);
    g.arc(x + r, y + r, r, Math.PI, 0);
    g.lineTo(x + w, y + h);
    g.closePath();
  }

  // ---------------------------------------------------------------------------
  // 2. window with the fast day/night cycle
  // ---------------------------------------------------------------------------
  const SKY_KEYS = [
    // [phase, top, bottom]
    [0.0, '#2a2458', '#ff9a6a'],
    [0.18, '#4fb3ff', '#ffe0a8'],
    [0.5, '#3aa6ff', '#bfe6ff'],
    [0.72, '#ff7a5c', '#ffcf7a'],
    [0.84, '#1b1a4a', '#5a3a7a'],
    [1.0, '#2a2458', '#ff9a6a'],
  ];
  function hexMix(a, b, u) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = Math.round(lerp((pa >> 16) & 255, (pb >> 16) & 255, u));
    const gg = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, u));
    const bl = Math.round(lerp(pa & 255, pb & 255, u));
    return `rgb(${r},${gg},${bl})`;
  }
  function skyAt(ph) {
    for (let i = 0; i < SKY_KEYS.length - 1; i++) {
      const a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
      if (ph >= a[0] && ph <= b[0]) {
        const u = (ph - a[0]) / (b[0] - a[0]);
        return [hexMix(a[1], b[1], u), hexMix(a[2], b[2], u)];
      }
    }
    return [SKY_KEYS[0][1], SKY_KEYS[0][2]];
  }

  function drawWindow(ctx, F, t) {
    const w = WIN, P = F.pal;
    const tw = FILM.lib.onTwos(t);
    const ph = ((tw * 0.9 + 0.1) % 1 + 1) % 1; // a day every ~1.1 s
    const [top, bot] = skyAt(ph);
    ctx.save();
    archPath(ctx, w.x, w.y, w.w, w.h);
    ctx.clip();
    F.sky(ctx, top, bot, { x: w.x, y: w.y, w: w.w, h: w.h });
    const night = ph > 0.8 || ph < 0.06 ? 1 : 0;
    if (night) F.stars(ctx, { n: 26, seed: 413, x: w.x, y: w.y, w: w.w, h: w.h * 0.6 });
    // sun arc during the day, moon arc during the night
    const cx = w.x + w.w / 2, cy = w.y + w.h * 0.78;
    if (ph > 0.04 && ph < 0.8) {
      const u = (ph - 0.04) / 0.76;
      const a = Math.PI + u * Math.PI;
      const sx = cx + Math.cos(a) * w.w * 0.46, sy = cy + Math.sin(a) * w.h * 0.62;
      const gl = ctx.createRadialGradient(sx, sy, 10, sx, sy, 90);
      gl.addColorStop(0, 'rgba(255,240,170,0.9)'); gl.addColorStop(1, 'rgba(255,240,170,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(sx, sy, 90, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(sx, sy, 34, 0, TAU); ctx.fill();
    } else {
      const u = ph > 0.8 ? (ph - 0.8) / 0.24 : (ph + 0.2) / 0.24;
      const a = Math.PI + u * Math.PI;
      const mx = cx + Math.cos(a) * w.w * 0.4, my = cy + Math.sin(a) * w.h * 0.55;
      ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(mx, my, 28, 0, TAU); ctx.fill();
      ctx.fillStyle = top; ctx.beginPath(); ctx.arc(mx + 12, my - 6, 24, 0, TAU); ctx.fill();
    }
    // clouds zipping by (time-lapse)
    ctx.fillStyle = night ? 'rgba(120,110,170,0.6)' : 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 3; i++) {
      const span = w.w + 260;
      const x = w.x - 130 + (((tw * (380 + i * 90) + i * 211) % span) + span) % span;
      const y = w.y + 120 + i * 70;
      ctx.beginPath();
      ctx.ellipse(x, y, 60, 20, 0, 0, TAU); ctx.ellipse(x + 34, y - 12, 36, 20, 0, 0, TAU); ctx.ellipse(x - 30, y - 6, 30, 16, 0, 0, TAU);
      ctx.fill();
    }
    // far rooftops and a bell tower
    const dark = night ? 0.55 : 0;
    const roofY = w.y + w.h - 150;
    ctx.fillStyle = '#e9c9a0';
    ctx.fillRect(w.x + 190, roofY - 150, 56, 170);
    ctx.beginPath(); ctx.moveTo(w.x + 180, roofY - 150); ctx.lineTo(w.x + 218, roofY - 210); ctx.lineTo(w.x + 256, roofY - 150); ctx.closePath();
    ctx.fillStyle = '#d9653b'; ctx.fill();
    ctx.fillStyle = '#6b4a3a'; ctx.beginPath(); ctx.arc(w.x + 218, roofY - 110, 12, Math.PI, 0); ctx.fillRect(w.x + 206, roofY - 110, 24, 18); ctx.fill();
    const blocks = [[0, 90, 110], [96, 70, 80], [150, 130, 60], [260, 60, 96], [300, 120, 70]];
    blocks.forEach(([bx, bw, bh], i) => {
      const x = w.x + bx, y = w.y + w.h - bh - 40;
      ctx.fillStyle = i % 2 ? '#fff0da' : '#f6dcb6';
      ctx.fillRect(x, y, bw, bh + 40);
      ctx.fillStyle = '#d9653b';
      ctx.beginPath(); ctx.moveTo(x - 8, y + 4); ctx.lineTo(x + bw / 2, y - 22); ctx.lineTo(x + bw + 8, y + 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = night ? '#ffd86a' : '#7aa7c7';
      for (let k = 0; k < Math.floor(bw / 30); k++) ctx.fillRect(x + 10 + k * 30, y + 24, 14, 20);
    });
    // palm
    ctx.strokeStyle = '#7a5236'; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(w.x + w.w - 60, w.y + w.h); ctx.quadraticCurveTo(w.x + w.w - 40, w.y + w.h - 150, w.x + w.w - 80, w.y + w.h - 260); ctx.stroke();
    ctx.fillStyle = '#4f9a4a';
    const px = w.x + w.w - 80, py = w.y + w.h - 262;
    const sway = Math.sin(tw * 6) * 0.08;
    for (let k = 0; k < 6; k++) {
      const a = -Math.PI / 2 + (k - 2.5) * 0.55 + sway;
      ctx.save(); ctx.translate(px, py); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(62, 0, 66, 15, 0.25, 0, TAU); ctx.fill();
      ctx.restore();
    }
    if (dark) { ctx.fillStyle = `rgba(20,16,60,${dark * 0.5})`; ctx.fillRect(w.x, w.y, w.w, w.h); }
    // glass glare
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.beginPath(); ctx.moveTo(w.x + 30, w.y + w.h); ctx.lineTo(w.x + 120, w.y + 60); ctx.lineTo(w.x + 170, w.y + 60); ctx.lineTo(w.x + 80, w.y + w.h); ctx.closePath(); ctx.fill();
    ctx.restore();
    // mullions
    ctx.save();
    ctx.strokeStyle = '#fff4e0'; ctx.lineWidth = 14;
    ctx.beginPath(); ctx.moveTo(w.x + w.w / 2, w.y); ctx.lineTo(w.x + w.w / 2, w.y + w.h); ctx.moveTo(w.x, w.y + w.h * 0.55); ctx.lineTo(w.x + w.w, w.y + w.h * 0.55); ctx.stroke();
    ctx.strokeStyle = P.line; ctx.lineWidth = 5;
    archPath(ctx, w.x, w.y, w.w, w.h); ctx.stroke();
    // curtains
    const cw = Math.sin(tw * 3) * 6;
    [[w.x - 40, 1], [w.x + w.w + 40, -1]].forEach(([x0, dir]) => {
      ctx.beginPath();
      ctx.moveTo(x0 - dir * 20, w.y - 60);
      ctx.lineTo(x0 + dir * 90, w.y - 60);
      ctx.quadraticCurveTo(x0 + dir * (40 + cw), w.y + 260, x0 + dir * 70, w.y + w.h + 40);
      ctx.lineTo(x0 - dir * 24, w.y + w.h + 40);
      ctx.closePath();
      F.fo(ctx, '#d94a3a', 4);
      ctx.strokeStyle = 'rgba(120,20,20,0.45)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x0 + dir * 20, w.y - 40); ctx.quadraticCurveTo(x0 + dir * (14 + cw), w.y + 260, x0 + dir * 22, w.y + w.h + 30); ctx.stroke();
    });
    // curtain rod
    ctx.fillStyle = '#b8862f';
    F.rrect(ctx, w.x - 90, w.y - 74, w.w + 180, 16, 8); F.fo(ctx, '#c9973a', 4);
    ctx.restore();
    // cactus on the sill
    ctx.save();
    const sx = w.x + 60, sy = w.y + w.h + 10;
    F.rrect(ctx, sx - 26, sy - 40, 52, 42, 6); F.fo(ctx, '#d9653b', 4);
    F.rrect(ctx, sx - 14, sy - 110, 28, 76, 14); F.fo(ctx, '#4f9a4a', 4);
    F.rrect(ctx, sx + 6, sy - 90, 26, 16, 8); F.fo(ctx, '#4f9a4a', 4);
    ctx.fillStyle = '#ff7ab0'; ctx.beginPath(); ctx.arc(sx, sy - 112, 9, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // 3. calendar
  // ---------------------------------------------------------------------------
  function pageFace(ctx, F, x, y, w, h, day) {
    // paper
    ctx.fillStyle = '#fffaf0';
    ctx.fillRect(x, y, w, h);
    // red header band
    ctx.fillStyle = '#e8413c';
    ctx.fillRect(x, y, w, 118);
    F.text(ctx, 'MY MONTH IN SPAIN', x + w / 2, y + 62, { size: 34, fill: '#ffffff', lw: 0 });
    // body text
    F.text(ctx, 'DAY', x + w / 2, y + 210, { size: 92, fill: '#1b1424', lw: 0 });
    F.text(ctx, String(day), x + w / 2, y + 430, { size: 290, fill: '#e8413c', lw: 12, stroke: '#1b1424', letter: -8 });
    // little week strip at the bottom
    ctx.fillStyle = '#f1dcc0';
    ctx.fillRect(x + 30, y + h - 96, w - 60, 56);
    for (let i = 0; i < 7; i++) {
      const cx = x + 30 + (i + 0.5) * ((w - 60) / 7);
      ctx.fillStyle = i === (day % 7) ? '#e8413c' : '#c9a57a';
      ctx.beginPath(); ctx.arc(cx, y + h - 68, 12, 0, TAU); ctx.fill();
    }
    // outline
    ctx.strokeStyle = '#1b1424'; ctx.lineWidth = 5;
    ctx.strokeRect(x, y, w, h);
  }

  function drawCalendar(ctx, F, t) {
    const c = CAL, P = F.pal;
    const k = pageIndex(t);
    ctx.save();
    // shadow + backing board
    ctx.fillStyle = 'rgba(90,40,20,0.25)';
    ctx.fillRect(c.x + 18, c.y + 22, c.w, c.h + 12);
    F.rrect(ctx, c.x - 16, c.y - 40, c.w + 32, c.h + 56, 14); F.fo(ctx, '#7a3a26', 5);
    // stacked page edges below (thickness shrinks as days pass)
    const stack = [6, 4, 2][k];
    for (let i = stack; i > 0; i--) {
      ctx.fillStyle = i % 2 ? '#efe2cc' : '#fffaf0';
      ctx.fillRect(c.x + 3, c.y + c.h - 4 + i * 3, c.w - 6, 4);
    }
    // current page
    pageFace(ctx, F, c.x, c.y, c.w, c.h, DAYS[k]);
    // torn stubs under the rings
    ctx.fillStyle = '#fffaf0';
    for (let i = 0; i < 9; i++) {
      const x = c.x + 12 + i * ((c.w - 24) / 9);
      ctx.beginPath(); ctx.moveTo(x, c.y - 4); ctx.lineTo(x + 40, c.y - 4); ctx.lineTo(x + 30, c.y + 6); ctx.lineTo(x + 16, c.y + 2); ctx.lineTo(x + 6, c.y + 8); ctx.closePath(); ctx.fill();
    }
    // binder rings
    for (let i = 0; i < 7; i++) {
      const rx = c.x + 50 + i * ((c.w - 100) / 6);
      ctx.strokeStyle = '#1b1424'; ctx.lineWidth = 13;
      ctx.beginPath(); ctx.arc(rx, c.y - 6, 17, Math.PI * 0.9, Math.PI * 2.1); ctx.stroke();
      ctx.strokeStyle = '#c9ccd8'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(rx, c.y - 6, 17, Math.PI * 0.9, Math.PI * 2.1); ctx.stroke();
    }
    // nail + string
    ctx.strokeStyle = '#6b4228'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(c.x + 30, c.y - 40); ctx.lineTo(c.x + c.w / 2, c.y - 92); ctx.lineTo(c.x + c.w - 30, c.y - 40); ctx.stroke();
    ctx.fillStyle = '#8a8fa8'; ctx.beginPath(); ctx.arc(c.x + c.w / 2, c.y - 92, 9, 0, TAU); ctx.fill();
    ctx.restore();
  }

  /** the torn page flying away after flip i (age in s) */
  function drawFlyingPage(ctx, F, i, age) {
    const dur = 0.75;
    if (age < 0 || age > dur) return;
    const c = CAL;
    const u = age / dur;
    const e = u * u * 0.6 + u * 0.4;
    const px = c.x, py = c.y; // pivot top-left
    const dx = -e * 900 - u * 60, dy = -e * 520 + Math.sin(u * Math.PI) * -80;
    const rot = -0.12 - e * 2.3;
    // motion trail ghosts
    ctx.save();
    for (let g = 2; g >= 1; g--) {
      const ug = Math.max(0, u - g * 0.06), eg = ug * ug * 0.6 + ug * 0.4;
      ctx.save();
      ctx.globalAlpha = 0.18 / g;
      ctx.translate(px - eg * 900 - ug * 60, py - eg * 520 + Math.sin(ug * Math.PI) * -80);
      ctx.rotate(-0.12 - eg * 2.3);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.w, c.h);
      ctx.restore();
    }
    ctx.translate(px + dx, py + dy);
    ctx.rotate(rot);
    // page curls: squash in x as it turns
    ctx.scale(1 - 0.35 * Math.sin(u * Math.PI), 1);
    ctx.fillStyle = 'rgba(60,20,10,0.25)';
    ctx.fillRect(14, 18, c.w, c.h);
    pageFace(ctx, F, 0, 0, c.w, c.h, DAYS_OLD[i]);
    // ragged torn top edge
    ctx.fillStyle = '#fffaf0';
    ctx.beginPath();
    for (let k = 0; k <= 12; k++) ctx.lineTo(k * (c.w / 12), (k % 2 ? -12 : -2));
    ctx.lineTo(c.w, 4); ctx.lineTo(0, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // 4. tally board
  // ---------------------------------------------------------------------------
  function rollNumber(ctx, F, v, x, y, size, color, boxW, boxH) {
    const n = Math.floor(v + 1e-6), fr = v - n;
    ctx.save();
    ctx.beginPath(); ctx.rect(x - boxW, y - boxH / 2, boxW, boxH); ctx.clip();
    const lh = boxH * 0.95;
    F.text(ctx, String(n), x - 10, y - fr * lh, { size, fill: color, lw: 0, align: 'right' });
    if (fr > 0.02) F.text(ctx, String(n + 1), x - 10, y + (1 - fr) * lh, { size, fill: color, lw: 0, align: 'right' });
    ctx.restore();
  }

  function drawBoard(ctx, F, t) {
    const b = BRD;
    const k = pageIndex(t);
    ctx.save();
    // frame + chalkboard
    ctx.fillStyle = 'rgba(90,40,20,0.25)';
    ctx.fillRect(b.x + 16, b.y + 18, b.w, b.h);
    F.rrect(ctx, b.x, b.y, b.w, b.h, 16); F.fo(ctx, '#9a6436', 5);
    F.rrect(ctx, b.x + 20, b.y + 20, b.w - 40, b.h - 40, 8); F.fo(ctx, '#23493b', 4);
    // chalk smudges
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.beginPath(); ctx.ellipse(b.x + 200, b.y + 120, 150, 40, -0.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(b.x + 420, b.y + 270, 130, 36, 0.15, 0, TAU); ctx.fill();
    // chalk ledge
    ctx.fillStyle = '#7a4a26'; ctx.fillRect(b.x + 30, b.y + b.h - 18, b.w - 60, 16);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(b.x + 90, b.y + b.h - 26, 40, 10);
    ctx.fillStyle = '#ffd3e0'; ctx.fillRect(b.x + 150, b.y + b.h - 26, 30, 10);
    // row 1: investors
    F.text(ctx, 'INVESTORS MET:', b.x + 50, b.y + 78, { size: 42, fill: '#f4f4ec', lw: 0, align: 'left' });
    F.text(ctx, '0', b.x + b.w - 70, b.y + 78, { size: 62, fill: '#ff8a8a', lw: 0, align: 'center' });
    // divider chalk line
    ctx.strokeStyle = 'rgba(244,244,236,0.55)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(b.x + 46, b.y + 128); ctx.lineTo(b.x + b.w - 46, b.y + 124); ctx.stroke();
    // row 2: burgers
    F.text(ctx, 'BURGERS EATEN:', b.x + 50, b.y + 176, { size: 42, fill: '#f4f4ec', lw: 0, align: 'left' });
    const tf = FLIPS[k];
    const u = L_outCubic(clamp((t - tf + FR) / 0.8));
    const v = lerp(BURGERS_FROM[k], BURGERS[k], u);
    rollNumber(ctx, F, v, b.x + b.w - 34, b.y + 272, 118, '#ffe14a', 290, 128);
    // tally marks on the left (one group of five per ~8 burgers shown)
    const groups = Math.min(7, Math.floor(v / 10) + 1);
    ctx.strokeStyle = 'rgba(244,244,236,0.85)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let gI = 0; gI < groups; gI++) {
      const gx = b.x + 48 + (gI % 4) * 62, gy = b.y + 228 + Math.floor(gI / 4) * 70;
      ctx.beginPath();
      for (let m = 0; m < 4; m++) { ctx.moveTo(gx + m * 11, gy); ctx.lineTo(gx + m * 11 + 2, gy + 48); }
      ctx.moveTo(gx - 6, gy + 34); ctx.lineTo(gx + 44, gy + 12);
      ctx.stroke();
    }
    ctx.restore();
  }
  const L_outCubic = (p) => 1 - Math.pow(1 - p, 3);

  // ---------------------------------------------------------------------------
  // 5. pile of fast-food trash on the floor
  // ---------------------------------------------------------------------------
  function drawPile(ctx, F, t) {
    const k = pageIndex(t);
    if (t - FLIPS[k] > 0.45) {
      const c = FILM.lib.cached(ID + '-pile-' + k, () => {
        const cv = FILM.makeCanvas(1080, 1920);
        drawPileLive(cv.getContext('2d', { willReadFrequently: true }), F, FLIPS[k] + 1);
        return cv;
      });
      ctx.save(); ctx.imageSmoothingQuality = 'low'; ctx.drawImage(c, 0, 0); ctx.restore();
      return;
    }
    drawPileLive(ctx, F, t);
  }
  function drawPileLive(ctx, F, t) {
    const k = pageIndex(t);
    const P = F.pal;
    const h01 = F.h01;
    const n = PILE_N[k];
    const items = [];
    for (let i = 0; i < n; i++) {
      const batch = i < PILE_N[0] ? 0 : i < PILE_N[1] ? 1 : 2;
      const x = 90 + h01(ID, 'px', i) * 540;
      const y = 1640 + h01(ID, 'py', i) * 200 - batch * 26;
      items.push({ i, x, y, kind: Math.floor(h01(ID, 'pk', i) * 4), rot: (h01(ID, 'pr', i) - 0.5) * 1.2, batch });
    }
    items.sort((a, b) => a.y - b.y);
    items.forEach((it) => {
      const born = FLIPS[it.batch];
      const sc = it.batch === k ? F.popIn(t + FR, born + 0.08 + (it.i % 5) * 0.04) : 1;
      if (sc <= 0) return;
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rot * 0.5);
      ctx.scale(sc, sc);
      if (it.kind === 0) {
        // crumpled wrapper ball
        ctx.beginPath(); ctx.arc(0, -22, 26, 0, TAU);
        F.fo(ctx, it.i % 2 ? '#fff3d6' : '#ffd9a0', 4);
        ctx.strokeStyle = 'rgba(120,80,40,0.6)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-14, -30); ctx.lineTo(0, -20); ctx.lineTo(12, -34); ctx.moveTo(-6, -10); ctx.lineTo(8, -16); ctx.stroke();
      } else if (it.kind === 1) {
        F.fries(ctx, 0, 0, 0.42, {});
      } else if (it.kind === 2) {
        ctx.rotate(-it.rot * 0.5 + (it.rot > 0 ? 1.4 : -1.4));
        F.drink(ctx, 0, 0, 0.36, {});
      } else {
        // open clamshell burger box
        F.rrect(ctx, -58, -30, 116, 30, 8); F.fo(ctx, '#f4f0e6', 4);
        ctx.beginPath(); ctx.moveTo(-58, -30); ctx.lineTo(-48, -78); ctx.lineTo(52, -78); ctx.lineTo(58, -30); ctx.closePath();
        F.fo(ctx, '#ffffff', 4);
        ctx.fillStyle = P.kongOrange; ctx.fillRect(-30, -60, 60, 12);
      }
      ctx.restore();
    });
  }

  // ---------------------------------------------------------------------------
  // draw
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const F = FILM.fx, C = FILM.cast, P = F.pal, L = info.lib;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const k = pageIndex(t);
      const tf = FLIPS[k];
      const since = t - tf;

      // camera: small punch on each flip, big shake on the stamp
      const sh = F.shakeMany(t, [[FLIPS[0], 0.25, 8], [FLIPS[1], 0.25, 8], [FLIPS[2], 0.25, 8], [T_STAMP, 0.4, 26]], 1301);
      const punch = 1 + 0.025 * Math.exp(-Math.max(0, since) / 0.18) + (t >= T_STAMP ? 0.03 * Math.exp(-(t - T_STAMP) / 0.2) : 0);
      ctx.save();
      ctx.translate(540 + sh[0], 960 + sh[1]);
      ctx.scale(punch, punch);
      ctx.translate(-540, -960);

      // 1-2. room + window
      // core sets imageSmoothingQuality 'high', which makes a scaled full-frame drawImage cost ~45 ms
      ctx.save(); ctx.imageSmoothingQuality = 'low'; ctx.drawImage(room(F), 0, 0); ctx.restore();
      drawWindow(ctx, F, t);
      // warm lamp glow
      const lg = ctx.createRadialGradient(601, 540, 10, 601, 540, 220);
      lg.addColorStop(0, 'rgba(255,230,160,0.45)'); lg.addColorStop(1, 'rgba(255,230,160,0)');
      ctx.fillStyle = lg; ctx.fillRect(380, 320, 440, 440);

      // 3. calendar + 4. board
      drawCalendar(ctx, F, t);
      drawBoard(ctx, F, t);

      // 5. trash pile
      drawPile(ctx, F, t);

      // 6. Hayk: hops on beats, swells on each page with a squash
      const bu = clamp((since + FR) / 0.3);
      const belly = lerp(BELLY_FROM[k], BELLY[k], L.ease.outBack(bu));
      const hop = F.bounce(tw, 2, 16);
      const squash = since < 3 * FR ? 1 : 0;
      const hx = 834, hy = 1760 + hop;
      ctx.save();
      ctx.translate(hx, 1760);
      ctx.scale(squash ? 1.07 : 1, squash ? 0.92 : 1);
      ctx.translate(-hx, -1760);
      // soft floor shadow separate from the hop
      ctx.fillStyle = 'rgba(80,30,10,0.22)';
      F.ellipse(ctx, hx, 1766, 150 + belly * 50, 26); ctx.fill();
      const biteU = clamp((t - tf) / 1.9);
      const a = C.hayk(ctx, {
        x: hx, y: hy, s: 1.56, t, pose: 'stand', face: 'happy', chewing: true, belly,
        hold: 'burger', bite: 0.15 + Math.floor(biteU * 4) * 0.14,
        holdL: k === 0 ? null : k === 1 ? 'drink' : 'fries',
      });
      ctx.restore();
      // crumbs from chewing every beat
      for (let b = 0; b < 10; b++) {
        const bt = b * 0.5 + 0.25;
        F.crumbs(ctx, a.mouth[0] + 30, a.mouth[1] + 10, t - bt, { n: 6, seed: 1300 + b, spread: 240, life: 0.45 });
      }
      // happy sparkles around him
      F.sparkles(ctx, { x: 680, y: 900, w: 360, h: 420, n: 7, seed: 1307, t, size: 30 });
      // belly POMF on each growth
      if (since < 0.9) {
        F.sfx(ctx, 'POMF!', 950, 1210, t, tf, { size: 72, fill: '#ffffff', shadowColor: P.kongOrange, rot: 0.15, life: 0.9 });
        F.shockRing(ctx, a.hip[0], a.hip[1] - 70, since + FR, { r: 340, color: '#ffffff', life: 0.25, width: 10, squash: 0.7 });
      }

      // 7. flying pages + whoosh
      for (let i = 0; i < FLIPS.length; i++) {
        const age = t - FLIPS[i] + FR * 3;
        if (age >= 0 && age < 0.55) {
          F.speedLines(ctx, { angle: Math.PI + 0.5, count: 18, color: '#ffffff', alpha: 0.8 * (1 - age / 0.55), seed: 1310 + i, t, speed: 3200, len: 520, width: 10, x: 0, y: 120, w: 640, h: 900 });
        }
        drawFlyingPage(ctx, F, i, age);
      }
      // FWIP sfx at each flip
      FLIPS.forEach((f, i) => F.sfx(ctx, 'FWIP!', 250, 880 + i * 6, t, f, { size: 84, fill: '#ffffff', shadowColor: '#3a8dde', rot: -0.2, life: 0.6 }));

      // stamp + THUD on the INVESTORS line
      if (t >= T_STAMP - 1e-6) {
        const age = t - T_STAMP;
        F.shockRing(ctx, BRD.x + BRD.w - 70, BRD.y + 78, age + FR, { r: 260, color: '#ff4d5e', life: 0.4, width: 18 });
        F.dust(ctx, BRD.x + BRD.w - 150, BRD.y + 130, age + FR, { n: 6, seed: 1320, size: 26, color: 'rgba(255,255,255,0.7)', spread: 120 });
        F.stamp(ctx, '0', BRD.x + BRD.w - 72, BRD.y + 80, t + FR, T_STAMP, { size: 118, color: '#ff2f45', rot: -0.22 });
      }
      ctx.restore(); // camera

      // screen-fixed: THUD over the shake
      if (t >= T_STAMP - 1e-6) {
        F.sfx(ctx, 'THUD!', 400, 1446, t, T_STAMP, { size: 124, fill: '#ff3b3b', shadowColor: '#5a0a14', rot: -0.08 });
      }
      // stamp impact flash (one frame)
      if (t >= T_STAMP - 1e-6 && t < T_STAMP + FR * 1.5) F.flash(ctx, 0.35, '#ffffff');
    },
  });
})();

</script>
<script>
// ---- src/scenes/14-burger-chart.js
/*
 * Shot 14 'burger-chart' : "Bullish on burgers" (T 59.0 - 64.0, 5 s).
 * Trading-terminal parody. A dark terminal with a grid; a candlestick chart whose candles are
 * tiny burger stacks rockets up. Header "BURGER/USD". Hayk (point, smug, belly 0.8, shades)
 * stands in front like a teacher with a telescopic pointer. Bubble at 1.5: "BULLISH ON BURGERS."
 * At 2.0 the last candle rockets through the top: "ALL-TIME HIGH" flashes, green arrow up with
 * sparkles. At 3.5 a tiny red candle labelled "INVESTORS" sits on a flat line at the bottom.
 *
 * Layers, back to front:
 *   1. terminal background (cached): grid, panels, axis ticks, scanlines
 *   2. ticker tape, header (BURGER/USD, price), beat-pulsing grid glow
 *   3. volume bars, big green arrow, price line, burger candles, rocket flame, ATH line + label
 *   4. INVESTORS flat line + tiny red candle
 *   5. Hayk + pointer, bubble
 *   6. flashes, sparkles
 */
(function () {
  'use strict';

  const ID = 'burger-chart';
  const FR = 1 / 24;
  const TAU = Math.PI * 2;

  const T_BUBBLE = 1.5; // T 60.5
  const T_ATH = 2.0; // T 61.0
  const T_INV = 3.5; // T 62.5

  // chart box
  const CH = { x: 60, y: 420, w: 960, h: 850 };
  const Y0 = 1225, Y1 = 540; // value 0 and value 1 in px
  const N = 10;
  const CX0 = 424, CDX = 58, CW = 50;

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const vy = (v) => lerp(Y0, Y1, v);

  // candle data: [open, close, hi, lo]
  const CANDLES = (() => {
    const out = [];
    let prev = 0.02;
    for (let i = 0; i < N; i++) {
      let close = 0.03 + 0.8 * Math.pow(i / (N - 2), 2.5);
      if (i === 3 || i === 7) close = prev - 0.035; // two dips
      if (i === N - 1) close = 1.08; // the rocket candle
      const open = prev;
      const hi = Math.max(open, close) + 0.025 + (i % 3) * 0.008;
      const lo = Math.min(open, close) - 0.02 - (i % 2) * 0.01;
      out.push([open, close, hi, lo]);
      prev = close;
    }
    return out;
  })();
  // time each candle appears (the last one on T_ATH)
  const tCandle = (i) => (i <= 3 ? -1 : T_ATH - (N - 1 - i) * 0.3);

  function burgerSprite(F, red) {
    return FILM.lib.cached(ID + '-burger-' + (red ? 'r' : 'g'), () => {
      // drawn at its on-screen size (CW wide) so the per-frame draw barely resamples
      const k = CW / 240;
      const c = FILM.makeCanvas(Math.ceil(240 * k), Math.ceil(200 * k));
      const g = c.getContext('2d', { willReadFrequently: true });
      g.scale(k, k);
      F.burger(g, 120, 112, 1);
      if (red) {
        g.globalCompositeOperation = 'source-atop';
        g.fillStyle = 'rgba(255,40,70,0.55)';
        g.fillRect(0, 0, 240, 200);
      }
      return c;
    });
  }

  function background(F) {
    return FILM.lib.cached(ID + '-bg', () => {
      const c = FILM.makeCanvas(1080, 1920);
      const g = c.getContext('2d', { willReadFrequently: true });
      const P = F.pal;
      g.fillStyle = P.termBg;
      g.fillRect(0, 0, 1080, 1920);
      // soft blue glow in the middle
      const rg = g.createRadialGradient(540, 820, 60, 540, 820, 900);
      rg.addColorStop(0, 'rgba(40,80,160,0.35)'); rg.addColorStop(1, 'rgba(40,80,160,0)');
      g.fillStyle = rg; g.fillRect(0, 0, 1080, 1920);
      // fine grid everywhere
      g.strokeStyle = P.termGrid; g.lineWidth = 2;
      g.beginPath();
      for (let x = 0; x <= 1080; x += 60) { g.moveTo(x, 0); g.lineTo(x, 1920); }
      for (let y = 0; y <= 1920; y += 60) { g.moveTo(0, y); g.lineTo(1080, y); }
      g.stroke();
      // ticker strip
      g.fillStyle = '#060912'; g.fillRect(0, 118, 1080, 64);
      g.fillStyle = '#1f2c55'; g.fillRect(0, 118, 1080, 3); g.fillRect(0, 179, 1080, 3);
      // header panel
      F.rrect(g, 40, 212, 1000, 172, 18); F.fo(g, '#111a33', 4, '#2b3b6e');
      // chart panel
      F.rrect(g, CH.x, CH.y, CH.w, CH.h, 18); F.fo(g, 'rgba(8,13,28,0.85)', 4, '#2b3b6e');
      // chart horizontal levels + right axis ticks
      g.strokeStyle = 'rgba(80,110,190,0.28)'; g.lineWidth = 2; g.setLineDash([10, 10]);
      g.beginPath();
      for (let k = 0; k <= 6; k++) { const y = lerp(Y0, Y1, k / 6); g.moveTo(CH.x + 20, y); g.lineTo(CH.x + CH.w - 90, y); }
      g.stroke();
      g.setLineDash([]);
      for (let k = 0; k <= 6; k++) {
        const y = lerp(Y0, Y1, k / 6);
        F.text(g, (k * 250).toString(), CH.x + CH.w - 50, y, { size: 24, fill: '#6f86c6', lw: 0 });
      }
      // volume panel
      F.rrect(g, 60, 1296, 960, 250, 18); F.fo(g, 'rgba(8,13,28,0.85)', 4, '#2b3b6e');
      // corner brackets (terminal HUD)
      g.strokeStyle = '#35e08a'; g.lineWidth = 5;
      [[CH.x + 8, CH.y + 8, 1, 1], [CH.x + CH.w - 8, CH.y + 8, -1, 1], [CH.x + 8, CH.y + CH.h - 8, 1, -1], [CH.x + CH.w - 8, CH.y + CH.h - 8, -1, -1]].forEach(([x, y, sx, sy]) => {
        g.beginPath(); g.moveTo(x, y + sy * 36); g.lineTo(x, y); g.lineTo(x + sx * 36, y); g.stroke();
      });
      // scanlines
      g.fillStyle = 'rgba(0,0,0,0.16)';
      for (let y = 0; y < 1920; y += 6) g.fillRect(0, y, 1080, 2);
      return c;
    });
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const F = FILM.fx, C = FILM.cast, P = F.pal, L = info.lib;
      const t = clamp(tIn, 0, info.dur);
      const tw = L.onTwos(t);
      const ath = t >= T_ATH - 1e-6;
      const athAge = t - T_ATH;

      // camera: slow push, shake on ATH and on INVESTORS
      const push = 1 + 0.035 * L.ease.inOutCubic(t / info.dur);
      const sh = F.shakeMany(t, [[T_ATH, 0.45, 26], [T_INV, 0.25, 8]], 1401);
      ctx.save();
      ctx.translate(540 + sh[0], 900 + sh[1]);
      ctx.scale(push, push);
      ctx.translate(-540, -900);

      // 1. background
      // core sets imageSmoothingQuality 'high', which makes a scaled full-frame drawImage cost ~45 ms
      ctx.save(); ctx.imageSmoothingQuality = 'low'; ctx.drawImage(background(F), 0, 0); ctx.restore();
      // beat pulse on the grid
      const bp = F.beatPulse(t, 0.5, 0.14);
      if (bp > 0.02) {
        ctx.save();
        ctx.globalAlpha = bp * 0.18;
        ctx.fillStyle = P.up;
        ctx.fillRect(CH.x, CH.y, CH.w, CH.h);
        ctx.restore();
      }

      // chart watermark
      F.text(ctx, 'BRGR', 540, 850, { size: 250, fill: '#ffffff', lw: 0, alpha: 0.05 });
      F.text(ctx, 'BURGER / USD  1D', 540, 990, { size: 50, fill: '#ffffff', lw: 0, alpha: 0.05 });

      // 2. ticker tape (decor, scrolls)
      const tape = 'BRGR/USD +4200%   FRIES/USD +69%   NUGGETS +12%   SALAD/USD -99%   KALE -80%   DONUT/USD +7%   ';
      const tapeW = 2400;
      const off = -((tw * 260) % tapeW);
      for (let k = 0; k < 2; k++) {
        F.text(ctx, tape, off + k * tapeW, 151, { size: 30, fill: '#35e08a', lw: 0, align: 'left' });
      }
      // header
      F.burger(ctx, 118, 300, 0.36, { rot: Math.sin(tw * 4) * 0.08 });
      F.text(ctx, 'BURGER/USD', 184, 282, { size: 74, fill: '#ffffff', lw: 0, align: 'left' });
      F.text(ctx, 'BURGER KONG EXCHANGE  |  1D  |  LIVE', 188, 346, { size: 24, fill: '#6f86c6', lw: 0, align: 'left' });
      // live dot
      ctx.fillStyle = Math.floor(t * 4) % 2 ? '#ff4d5e' : '#ff9aa4';
      ctx.beginPath(); ctx.arc(700, 346, 8, 0, TAU); ctx.fill();
      // price rolls up
      const pv = 12 + 1488 * Math.pow(clamp((t + 0.2) / (T_ATH + 0.2)), 2.4) + (ath ? Math.sin(t * 9) * 6 : 0);
      const price = '$' + Math.floor(pv).toLocaleString('en-US') + '.' + String(Math.floor((pv * 100) % 100)).padStart(2, '0');
      F.text(ctx, price, 1010, 270, { size: 50, fill: P.up, lw: 0, align: 'right' });
      const pct = '+' + Math.floor(pv * 2.8) + '%';
      ctx.save();
      const pw = F.measure(ctx, pct, 30) + 60;
      F.rrect(ctx, 1010 - pw, 312, pw, 50, 12); F.fo(ctx, 'rgba(47,224,138,0.18)', 3, P.up);
      ctx.fillStyle = P.up;
      ctx.beginPath(); ctx.moveTo(1010 - pw + 16, 348); ctx.lineTo(1010 - pw + 30, 326); ctx.lineTo(1010 - pw + 44, 348); ctx.closePath(); ctx.fill();
      F.text(ctx, pct, 1010 - pw / 2 + 22, 338, { size: 30, fill: P.up, lw: 0 });
      ctx.restore();

      // 3a. volume bars
      ctx.save();
      for (let i = 0; i < 24; i++) {
        const x = 90 + i * 38;
        const shown = i < 8 || t > (i - 8) * 0.13;
        if (!shown) continue;
        const h = 20 + Math.pow(i / 23, 2) * 170 + F.h01(ID, 'vol', i) * 30;
        ctx.fillStyle = i % 7 === 4 ? 'rgba(255,77,94,0.75)' : 'rgba(47,224,138,0.7)';
        ctx.fillRect(x, 1520 - h, 26, h);
      }
      ctx.restore();

      // 3b. big green arrow (grows with the chart)
      const arrU = L.ease.outCubic(clamp((t + 0.3) / (T_ATH + 0.3)));
      drawArrow(ctx, F, 440, 1180, lerp(440, 900, arrU), lerp(1180, 600, arrU), 1);

      // 3c. candles
      const vis = [];
      for (let i = 0; i < N; i++) {
        const ti = tCandle(i);
        if (t < ti - 1e-6) break;
        const age = t - ti;
        const grow = i === N - 1 ? L.ease.outBack(clamp((age + FR) / 0.28)) : clamp((age + FR) / 0.12);
        vis.push({ i, grow, age });
      }
      // price line through closes
      ctx.save();
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      [[18, 'rgba(47,224,138,0.18)'], [6, P.up]].forEach(([lw, col]) => {
        ctx.strokeStyle = col; ctx.lineWidth = lw;
        ctx.beginPath();
        vis.forEach((c, k) => {
          const [o, cl] = CANDLES[c.i];
          const x = CX0 + c.i * CDX, y = vy(lerp(o, cl, c.grow));
          if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      });
      ctx.restore();
      vis.forEach((c) => drawCandle(ctx, F, c.i, c.grow, t));
      // rocket flame under the last candle
      const last = vis[vis.length - 1];
      let tip = [CX0 + last.i * CDX, vy(lerp(CANDLES[last.i][0], CANDLES[last.i][1], last.grow))];
      if (ath) {
        const x = CX0 + (N - 1) * CDX;
        const yb = vy(CANDLES[N - 1][0]) + 16;
        drawFlame(ctx, x, yb, t);
        F.speedLines(ctx, { angle: -Math.PI / 2, count: 10, color: '#aaffd0', alpha: 0.5, seed: 1402, t, speed: 2200, len: 220, width: 6, x: x - 60, y: 440, w: 120, h: 700 });
      }

      // ATH dashed line + flashing label
      if (ath) {
        const yA = vy(1.08) - 26;
        ctx.save();
        ctx.strokeStyle = P.gold; ctx.lineWidth = 4; ctx.setLineDash([16, 10]);
        ctx.beginPath(); ctx.moveTo(CH.x + 20, yA); ctx.lineTo(CH.x + CH.w - 20, yA); ctx.stroke();
        ctx.restore();
        const on = Math.floor(athAge * 8) % 2 === 0;
        const sc = F.popIn(t, T_ATH);
        ctx.save();
        ctx.translate(420, 560);
        ctx.rotate(-0.06);
        ctx.scale(sc, sc);
        F.burst(ctx, 0, 0, 330, 250, 18, on ? P.gold : '#ff4d5e', { seed: 1403, lw: 6, squash: 0.42 });
        F.text(ctx, 'ALL-TIME HIGH', 0, 4, { size: 70, fill: on ? '#ff3b3b' : '#ffffff', stroke: P.line, lw: 12, shadow: 6 });
        ctx.restore();
        // sparkles at the arrow tip + around the rocket
        F.sparkles(ctx, { x: 760, y: 420, w: 280, h: 260, n: 8, seed: 1404, t, size: 44, color: '#eaffef' });
        const sa = Math.sin(t * 10);
        F.sparkle(ctx, 905, 590, 46 + sa * 12, { color: '#ffffff', rot: t * 2 });
      } else {
        F.sparkle(ctx, lerp(440, 900, arrU) + 6, lerp(1180, 600, arrU) - 6, 26 + Math.sin(t * 12) * 8, { color: '#ffffff' });
      }

      // 4. INVESTORS: flat line + tiny red candle at the bottom
      if (t >= T_INV - 1e-6) {
        const age = t - T_INV;
        const u = clamp((age + FR) / 0.3);
        const yI = 1236;
        ctx.save();
        ctx.strokeStyle = P.down; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(470, yI); ctx.lineTo(lerp(470, 938, u), yI); ctx.stroke();
        ctx.restore();
        if (u >= 1) {
          // tiny red candle
          ctx.save();
          ctx.strokeStyle = P.down; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(950, yI - 16); ctx.lineTo(950, yI + 12); ctx.stroke();
          ctx.fillStyle = P.down; ctx.fillRect(943, yI - 6, 14, 12);
          ctx.restore();
          const blink = Math.floor(age * 6) % 2 === 0;
          ctx.save();
          ctx.globalAlpha = blink ? 0.9 : 0.4;
          ctx.fillStyle = P.down;
          ctx.beginPath(); ctx.arc(950, yI, 14, 0, TAU); ctx.fill();
          ctx.restore();
        }
      }

      // 5. Hayk + telescopic pointer
      const bob = Math.sin(tw * Math.PI * 2) * 5;
      const hx = 262, hy = 2140 + bob;
      // blue rim glow behind him
      const rg = ctx.createRadialGradient(hx, 1420, 60, hx, 1420, 520);
      rg.addColorStop(0, 'rgba(47,224,138,0.28)'); rg.addColorStop(1, 'rgba(47,224,138,0)');
      ctx.fillStyle = rg; ctx.fillRect(hx - 520, 900, 1040, 1020);
      const a = C.hayk(ctx, { x: hx, y: hy, s: 1.64, t, pose: 'point', face: 'smug', belly: 0.8, shades: true, headTilt: -0.06 });
      // pointer: from the fingertip to the newest candle top
      const hand = a.handR;
      const ptU = L.ease.outCubic(clamp(t / 0.3));
      const target = [tip[0] - 20, tip[1] + 30];
      const tp = [lerp(hand[0] + 200, target[0], ptU), lerp(hand[1] - 60, target[1], ptU)];
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = P.line; ctx.lineWidth = 16;
      ctx.beginPath(); ctx.moveTo(hand[0] + 30, hand[1]); ctx.lineTo(tp[0], tp[1]); ctx.stroke();
      ctx.strokeStyle = '#c9ccd8'; ctx.lineWidth = 8;
