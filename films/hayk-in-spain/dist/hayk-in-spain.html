  // ---------------------------------------------------------------------------
  // Human body (shared by Hayk and Grant), style decides colours and hair
  // ---------------------------------------------------------------------------
  function human(ctx, o, style) {
    const t = o.t || 0;
    const pose = o.pose || 'stand';
    const P = humanPose(pose, t * (style.cycle || 1));
    const s = (o.s == null ? 1 : o.s) * style.scale;
    const belly = clamp(o.belly || 0);
    SIL = o.silhouette || null;
    const anchors = {};
    const sgn = o.flip ? -1 : 1;
    let tilt = o.tilt || 0;
    if (pose === 'pulled') tilt += -1.35 * sgn;
    if (pose === 'collapse') tilt += 1.5708 * sgn;
    const ct = Math.cos(tilt), st = Math.sin(tilt);
    const W = (lx, ly) => {
      const xx = lx * sgn * s, yy = ly * s;
      return [o.x + xx * ct - yy * st, o.y + xx * st + yy * ct];
    };
    ctx.save();
    if (o.alpha != null) ctx.globalAlpha *= clamp(o.alpha);
    ctx.translate(o.x, o.y);
    ctx.rotate(tilt);
    ctx.scale(sgn * s, s);
    if (pose === 'collapse') ctx.translate(0, -60);

    const hipY = -206 + P.hipY;
    const hipW = 34 + belly * 14;
    const shoulderY = -378 + P.hipY;
    const shW = style.shoulder + belly * 10;
    const armW = style.armW + belly * 5, legW = style.legW + belly * 8;
    const UA = 94, FA = 88, TH = 100, SH = 98;

    // ground shadow
    if (!SIL && pose !== 'pulled' && pose !== 'float' && pose !== 'collapse') {
      ctx.save();
      ctx.fillStyle = 'rgba(20,10,40,0.18)';
      ellipse(ctx, 0, 4, 90 + belly * 30, 16); ctx.fill();
      ctx.restore();
    }

    // --- legs
    const legs = [];
    [[-1, P.lL], [1, P.lR]].forEach(([side, ang]) => {
      const hip = [side * hipW, hipY];
      let knee, ankle;
      if (P.sit) {
        knee = [side * (hipW + 18), hipY + 26];
        ankle = [side * (hipW + 22), hipY + 26 + SH];
      } else if (P.kneel) {
        if (side < 0) { knee = [side * (hipW + 14), -16]; ankle = [side * (hipW + 30), -8]; }
        else { knee = [side * (hipW + 34), hipY + 40]; ankle = [side * (hipW + 40), 0]; }
      } else {
        knee = dirPt(hip, -ang[0], TH);
        ankle = dirPt(knee, -ang[0] + ang[1] * -side, SH);
      }
      legs.push({ side, hip, knee, ankle });
    });
    legs.forEach((lg) => {
      tube(ctx, [lg.hip, lg.knee, lg.ankle], legW, style.pants);
      // shoe
      ctx.save();
      ctx.translate(lg.ankle[0], lg.ankle[1]);
      const fx = lg.side * 10;
      ctx.beginPath();
      ctx.ellipse(fx, 6, 32, 17, 0, 0, TAU);
      fill(ctx, style.shoe, LW * 0.9);
      if (!SIL && style.shoeAccent) { ctx.fillStyle = style.shoeAccent; ctx.fillRect(fx - 26, 8, 52, 6); }
      ctx.restore();
    });

    // --- torso (lean around hips)
    ctx.save();
    ctx.translate(0, hipY);
    ctx.rotate(P.lean);
    ctx.translate(0, -hipY);
    const sy = shoulderY;
    const bw = hipW + 22 + belly * 26; // belly bulge half-width
    const torso = [
      [-shW, sy + 6], [-shW - 4, sy + 60], [-bw, hipY - 50 + belly * 10], [-bw + 6, hipY + 4], [0, hipY + 16 + belly * 18],
      [bw - 6, hipY + 4], [bw, hipY - 50 + belly * 10], [shW + 4, sy + 60], [shW, sy + 6], [0, sy - 8],
    ];
    curve(ctx, torso);
    fill(ctx, style.top);
    if (!SIL) {
      // shade on the screen-right side
      ctx.save();
      curve(ctx, torso); ctx.clip();
      ctx.fillStyle = style.topShade;
      ctx.beginPath(); ctx.ellipse(bw + 30, hipY - 60, 70, 180, 0, 0, TAU); ctx.fill();
      if (belly > 0.05) {
        ctx.fillStyle = style.topHi;
        ctx.globalAlpha = 0.5;
        ctx.beginPath(); ctx.ellipse(-bw * 0.35, hipY - 70, 24 + belly * 20, 30 + belly * 24, 0, 0, TAU); ctx.fill();
      }
      ctx.restore();
      style.torsoDetail(ctx, { sy, hipY, shW, bw, belly });
    }
    anchors.chest = W(0, sy + 70);
    anchors.hip = W(0, hipY);

    // --- head
    const headY = sy - 84;
    const hx = 0;
    const HS = style.headScale || 1.15;
    ctx.save();
    ctx.translate(hx, headY);
    ctx.rotate(P.head + (o.headTilt || 0));
    ctx.scale(HS, HS);
    style.hairBack(ctx, t);
    // neck
    ctx.beginPath(); ctx.rect(-16, 40, 32, 40); fill(ctx, style.skin, LW);
    // ears
    ellipse(ctx, -64, 6, 13, 18); fill(ctx, style.skin, LW * 0.8);
    ellipse(ctx, 64, 6, 13, 18); fill(ctx, style.skin, LW * 0.8);
    // head shape: rounded with a soft chin
    const cheek = belly * 10;
    const headPts = [[-62 - cheek, -30], [-60, -70], [0, -86], [60, -70], [62 + cheek, -30], [60 + cheek, 22], [34, 64], [0, 76], [-34, 64], [-60 - cheek, 22]];
    curve(ctx, headPts);
    fill(ctx, style.skin);
    if (!SIL) {
      ctx.save();
      curve(ctx, headPts); ctx.clip();
      ctx.fillStyle = C.skinShade;
      ctx.beginPath(); ctx.ellipse(76, 10, 24, 90, 0, 0, TAU); ctx.fill();
      if (style.stubble) {
        ctx.fillStyle = 'rgba(60,60,110,0.12)';
        ctx.beginPath(); ctx.moveTo(-56, 30); ctx.quadraticCurveTo(-40, 58, 0, 62); ctx.quadraticCurveTo(40, 58, 56, 30); ctx.lineTo(40, 80); ctx.lineTo(-40, 80); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      if (style.beard) style.beard(ctx);
    }
    const faceName = o.face || 'neutral';
    face(ctx, faceName, style.faceSpec, o, t);
    style.hairFront(ctx, t, o);
    if (style.accessory) style.accessory(ctx, o, faceName);
    if (o.shades) {
      ctx.save();
      ctx.fillStyle = col('#15121c');
      ctx.strokeStyle = SIL || C.line; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-60, -14); ctx.lineTo(60, -14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-54, -16); ctx.lineTo(-6, -16); ctx.lineTo(-10, 12); ctx.quadraticCurveTo(-30, 22, -50, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(54, -16); ctx.lineTo(6, -16); ctx.lineTo(10, 12); ctx.quadraticCurveTo(30, 22, 50, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      if (!SIL) { ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-44, -8); ctx.lineTo(-34, 4); ctx.moveTo(16, -8); ctx.lineTo(26, 4); ctx.stroke(); }
      ctx.restore();
    }
    if (o.crown) F.crown(ctx, 0, -70, 0.62, { rot: -0.08, color: SIL || undefined, flat: !!SIL });
    ctx.restore();
    const hr = P.head + (o.headTilt || 0);
    const hp = (lx, ly) => { lx *= HS; ly *= HS; return W(hx + lx * Math.cos(hr) - ly * Math.sin(hr), headY + lx * Math.sin(hr) + ly * Math.cos(hr)); };
    anchors.head = hp(0, 0);
    anchors.top = hp(0, -96);
    anchors.mouth = hp(0, style.faceSpec.mouthY);
    anchors.eyeL = hp(-style.faceSpec.eyeDX * sgn, style.faceSpec.eyeY);
    anchors.eyeR = hp(style.faceSpec.eyeDX * sgn, style.faceSpec.eyeY);
    if (o.flip) { const e = anchors.eyeL; anchors.eyeL = anchors.eyeR; anchors.eyeR = e; }

    // --- arms (drawn over the torso)
    const arms = [[-1, P.aL, P.hands[0], o.holdL], [1, P.aR, P.hands[1], o.hold]];
    arms.forEach(([side, ang, hk, item]) => {
      const sh = [side * (shW + 2), sy + 22];
      const a0 = -ang[0], a1 = -ang[1];
      const el = dirPt(sh, a0, UA);
      const wr = dirPt(el, a0 + a1, FA);
      tube(ctx, [sh, el, wr], armW, style.sleeve || style.top);
      // cuff
      if (!SIL && style.cuff) { ctx.save(); ctx.strokeStyle = style.cuff; ctx.lineWidth = armW * 0.9; ctx.lineCap = 'butt'; const d = [wr[0] - el[0], wr[1] - el[1]]; const dl = Math.hypot(d[0], d[1]) || 1; ctx.beginPath(); ctx.moveTo(wr[0] - d[0] / dl * 14, wr[1] - d[1] / dl * 14); ctx.lineTo(wr[0] - d[0] / dl * 4, wr[1] - d[1] / dl * 4); ctx.stroke(); ctx.restore(); }
      const ha = a0 + a1;
      const hpnt = dirPt(wr, ha, 14);
      hand(ctx, hpnt, ha, hk, style.skin);
      const wp = W(hpnt[0], hpnt[1]);
      if (side < 0) anchors.handL = wp; else anchors.handR = wp;
      if (item) {
        ctx.save();
        ctx.translate(hpnt[0], hpnt[1]);
        if (o.flip) ctx.scale(-1, 1);
        drawHeld(ctx, item, o, side);
        ctx.restore();
      }
    });
    if (o.flip) { const h = anchors.handL; anchors.handL = anchors.handR; anchors.handR = h; }
    ctx.restore(); // torso lean
    ctx.restore();
    SIL = null;
    return anchors;
  }

  function drawHeld(ctx, item, o, side) {
    if (SIL) {
      ctx.save();
      ctx.fillStyle = SIL;
      ctx.beginPath(); ctx.arc(0, -10, 50, 0, TAU); ctx.fill();
      ctx.restore();
      return;
    }
    switch (item) {
      case 'burger': F.burger(ctx, side * -30, -30, 0.55, { bite: o.bite || 0 }); break;
      case 'bigBurger': F.burger(ctx, side * -70, -40, 1.0, { bite: o.bite || 0 }); break;
      case 'drumstick': F.drumstick(ctx, 0, 0, 0.6, { rot: -Math.PI / 2 - side * 0.5, bite: o.bite || 0 }); break;
      case 'fries': F.fries(ctx, 0, 30, 0.45, {}); break;
      case 'phone': F.phone(ctx, 0, -40, 0.3, { screen: o.phoneScreen }); break;
      case 'drink': F.drink(ctx, 0, 60, 0.5, {}); break;
      default: break;
    }
  }

  // ---------------------------------------------------------------------------
  // Hayk
  // ---------------------------------------------------------------------------

      ctx.strokeStyle = C.headphones; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(0, g.sy + 4, 42, 0.15, Math.PI - 0.15); ctx.stroke();
      [[-44, g.sy + 22], [44, g.sy + 22]].forEach(([px, py]) => { rrect(ctx, px - 13, py - 16, 26, 34, 10); fo(ctx, C.headphones, 5); });

    hairBack(ctx) {

        [62, -122], [60, -88], [92, -84], [72, -52], [86, -20], [66, -18], [60, -40],
        // fringe

      ];

        ctx.save();

        ctx.beginPath(); ctx.moveTo(10, -104); ctx.lineTo(40, -98); ctx.lineTo(34, -88); ctx.lineTo(12, -94); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    },
  };

  function hayk(ctx, o = {}) {

  }

  // ---------------------------------------------------------------------------
  // Goofy (side view body, 3/4 head facing the viewer). Local frame faces RIGHT.
  // ---------------------------------------------------------------------------
  function goofy(ctx, o = {}) {
    const t = o.t || 0;
    const pose = o.pose || 'sit';
    const faceName = o.face || 'neutral';
    const s = o.s == null ? 1 : o.s;
    const sgn = o.flip ? -1 : 1;
    const tilt = o.tilt || 0;
    SIL = o.silhouette || null;
    const ct = Math.cos(tilt), st = Math.sin(tilt);
    const Wd = (lx, ly) => {
      const xx = lx * sgn * s, yy = ly * s;
      return [o.x + xx * ct - yy * st, o.y + xx * st + yy * ct];
    };
    const anchors = {};
    const ph = t * Math.PI * 2;
    const angry = faceName === 'angry';

    // pose parameters (local, facing right)
    let body = { x: 0, y: -110, rx: 105, ry: 58, rot: 0 };
    let head = { x: 92, y: -175, rot: 0 };
    let legs; // [hipX, hipY, footX, footY] x4: back-far, front-far, back-near, front-near
    let tailA = -0.9, mouthOpen = 0, tongue = false;
    const wag = Math.sin(ph * 4) * 0.35;
    switch (pose) {
      case 'sit':
        body = { x: -10, y: -100, rx: 78, ry: 70, rot: -0.75 };
        head = { x: 40, y: -190, rot: 0 };
        legs = [[-60, -60, -40, 0], [30, -110, 40, 0], [-50, -50, -10, 0], [40, -100, 58, 0]];
        tailA = 0.4 + wag * 0.4;
        break;
      case 'walk': {
        const a = Math.sin(ph * 2), b = Math.sin(ph * 2 + Math.PI);
        body.y = -118 + Math.abs(Math.cos(ph * 2)) * -5;
        head = { x: 100, y: -180 + Math.abs(Math.cos(ph * 2)) * -5, rot: 0 };
        legs = [[-70, -100, -70 + a * 30, 0], [60, -100, 60 + b * 30, 0], [-60, -95, -60 + b * 30, 0], [70, -95, 70 + a * 30, 0]];
        tailA = -1.0 + wag;
        break;
      }
      case 'run': {
        const a = Math.sin(ph * 3);
        body = { x: 0, y: -125 + a * 10, rx: 110, ry: 52, rot: a * 0.08 };
        head = { x: 110, y: -180 + a * 10, rot: 0.1 };
        const ext = a * 60;
        legs = [[-70, -110, -120 + ext, -20 + Math.max(0, a) * -30], [60, -110, 110 - ext, -10], [-60, -105, -110 + ext, 0], [70, -105, 130 - ext, -30 + Math.max(0, -a) * -20]];
        tailA = -1.5;
        tongue = true;
        break;
      }
      case 'bark': {
        const lunge = Math.max(0, Math.sin(ph * 2)) * 16;
        body = { x: lunge * 0.5, y: -112, rx: 104, ry: 58, rot: -0.12 };
        head = { x: 118 + lunge, y: -186 - lunge * 0.3, rot: -0.12 };
        legs = [[-70, -100, -110, 0], [60, -100, 110, 0], [-60, -95, -100, 0], [70, -95, 130, 0]];
        tailA = -1.6 + wag * 0.3;
        mouthOpen = 0.6 + Math.max(0, Math.sin(ph * 2)) * 0.4;
        break;
      }
      case 'howl':
        body = { x: -10, y: -100, rx: 78, ry: 70, rot: -0.9 };
        head = { x: 34, y: -200, rot: -0.6 };
        legs = [[-60, -60, -40, 0], [30, -110, 40, 0], [-50, -50, -10, 0], [40, -100, 58, 0]];
        tailA = 0.6;
        mouthOpen = 1;
        break;
      case 'jump':
        body = { x: 0, y: -160, rx: 110, ry: 52, rot: -0.35 };
        head = { x: 106, y: -240, rot: -0.2 };
        legs = [[-70, -150, -150, -90], [60, -170, 150, -230], [-60, -145, -140, -60], [70, -165, 170, -200]];
        tailA = -2.2;
        tongue = true;
        break;
      case 'lie':
        body = { x: 0, y: -52, rx: 115, ry: 46, rot: 0 };
        head = { x: 120, y: -80, rot: 0.05 };
        legs = [[-70, -30, -120, 0], [60, -30, 150, 0], [-60, -26, -100, 0], [70, -26, 170, 0]];
        tailA = -1.4;
        break;
      default: // stand
        legs = [[-70, -100, -72, 0], [60, -100, 62, 0], [-60, -95, -58, 0], [70, -95, 74, 0]];
        tailA = -1.0 + wag;
        break;
    }
    if (faceName === 'happy' && pose !== 'howl') tongue = true;
    if (angry && pose !== 'bark') mouthOpen = Math.max(mouthOpen, 0.35);

    ctx.save();
    if (o.alpha != null) ctx.globalAlpha *= clamp(o.alpha);
    ctx.translate(o.x, o.y);
    ctx.rotate(tilt);
    ctx.scale(sgn * s, s);

    // shadow
    if (!SIL && pose !== 'jump') {
      ctx.fillStyle = 'rgba(20,10,40,0.18)';
      ellipse(ctx, 0, 4, 120, 14); ctx.fill();
    }
    // angry bristle outline behind everything
    if (angry && !SIL) {
      ctx.save();
      ctx.fillStyle = '#2a0a18';
      const b = L.boil(L.T);
      ctx.beginPath();
      for (let i = 0; i < 40; i++) {
        const a = (i / 40) * TAU;
        const r = i % 2 ? 1.0 : 1.28 + F.h01('gb', i, b) * 0.1;
        const px = body.x + Math.cos(a) * body.rx * r, py = body.y + Math.sin(a) * body.ry * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    const leg = (L0, color, w) => {
      const [hx, hy, fx, fy] = L0;
      const kx = (hx + fx) / 2 + (hx < 0 ? -8 : 8), ky = (hy + fy) / 2;
      tube(ctx, [[hx, hy], [kx, ky], [fx, fy - 6]], w, color);
      ellipse(ctx, fx + 8, fy - 6, 20, 13);
      fill(ctx, C.dogCream, LW * 0.8);
    };
    // far legs (shaded)
    leg(legs[0], C.dogShade, 30);
    leg(legs[1], C.dogShade, 30);
    // tail
    ctx.save();
    ctx.translate(body.x - body.rx * 0.85 * Math.cos(body.rot), body.y - body.rx * 0.85 * Math.sin(body.rot) - 10);
    ctx.rotate(tailA);
    ctx.beginPath();
    ctx.moveTo(-10, 0);
    ctx.quadraticCurveTo(-40, -30, -30, -80);
    ctx.quadraticCurveTo(-10, -100, 6, -80);
    ctx.quadraticCurveTo(-10, -50, 14, 4);
    ctx.closePath();
    fill(ctx, C.dog);
    ctx.beginPath(); ctx.ellipse(-12, -86, 16, 14, 0, 0, TAU); fill(ctx, C.dogCream, LW * 0.8);
    ctx.restore();
    anchors.tail = Wd(body.x - body.rx, body.y - 20);
    // body
    ctx.save();
    ctx.translate(body.x, body.y);
    ctx.rotate(body.rot);
    ellipse(ctx, 0, 0, body.rx, body.ry);
    fill(ctx, C.dog);
    if (!SIL) {
      ctx.save();
      ellipse(ctx, 0, 0, body.rx, body.ry); ctx.clip();
      ctx.fillStyle = C.dogCream;
      ctx.beginPath(); ctx.ellipse(10, body.ry * 0.85, body.rx * 0.8, body.ry * 0.55, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = C.dogShade;
      ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.ellipse(-body.rx * 0.2, -body.ry * 0.95, body.rx * 0.7, body.ry * 0.35, 0, 0, TAU); ctx.fill();
      ctx.restore();
      ellipse(ctx, 0, 0, body.rx, body.ry); fo(ctx, null, LW);
    }
    ctx.restore();
    // near legs
    leg(legs[2], C.dog, 32);
    leg(legs[3], C.dog, 32);

    // head
    ctx.save();
    ctx.translate(head.x, head.y);
    ctx.rotate(head.rot);
    const earSwing = Math.sin(ph * 2) * 0.08 + (faceName === 'sad' || faceName === 'cry' ? -0.25 : 0) + (angry ? 0.9 : 0);
    const ear = (side) => {
      ctx.save();
      ctx.translate(side * 46, -46);
      ctx.rotate(side * earSwing);
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.quadraticCurveTo(side * 40, -10, side * 42, 40);
      ctx.quadraticCurveTo(side * 40, 76, side * 20, 72);
      ctx.quadraticCurveTo(side * 4, 50, -side * 6, 12);
      ctx.closePath();
      fill(ctx, C.dogShade);
      ctx.restore();
    };
    ear(-1);
    ear(1);
    // head shape
    const hp = [[-66, -10], [-58, -56], [0, -72], [58, -56], [68, -10], [60, 36], [0, 58], [-60, 36]];
    curve(ctx, hp);
    fill(ctx, C.dog);
    // muzzle (towards facing direction, i.e. local +x)
    ctx.beginPath();
    ctx.ellipse(34, 22, 44, 32, 0, 0, TAU);
    fill(ctx, C.dogCream, LW * 0.9);
    // cream blaze
    if (!SIL) {
      ctx.fillStyle = C.dogCream;
      ctx.beginPath(); ctx.moveTo(4, -60); ctx.quadraticCurveTo(18, -20, 20, 0); ctx.lineTo(-6, 0); ctx.quadraticCurveTo(-6, -30, 4, -60); ctx.fill();
    }
    // eyes
    const eyes = [[-22, -12], [26, -14]];
    const blink = o.blink || (blinking(t, 5) && faceName !== 'angry' && faceName !== 'shocked');
    if (faceName === 'happy' || blink) {
      eyes.forEach(([ex, ey]) => eyeClosed(ctx, ex, ey, blink && faceName !== 'happy' ? 'line' : 'happy', 16));
    } else if (faceName === 'cry') {
      eyeClosed(ctx, eyes[0][0], eyes[0][1], 'tight', 16);
      eyeClosed(ctx, eyes[1][0], eyes[1][1], 'tightR', 16);
    } else {
      const glow = angry ? C.demonRed : null;
      eyes.forEach(([ex, ey], i) => {
        eyeOpen(ctx, ex, ey, {
          iris: C.irisDog, skin: C.dog, w: 17, h: 22, look: o.look,
          watery: faceName === 'sad', small: faceName === 'shocked', glow,
          lid: angry ? 0.3 : 0, lidTilt: angry ? (i ? -10 : 10) : 0,
        });
      });
      if (angry && !SIL) {
        ctx.save();
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = C.demonGlow;
        eyes.forEach(([ex, ey]) => { const g = ctx.createRadialGradient(ex, ey, 2, ex, ey, 44); g.addColorStop(0, 'rgba(255,60,40,0.9)'); g.addColorStop(1, 'rgba(255,60,40,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, 44, 0, TAU); ctx.fill(); });
        ctx.restore();
      }
    }
    // brows
    if (faceName === 'sad' || faceName === 'cry') { brow(ctx, -22, -42, -0.4, 22, 6); brow(ctx, 26, -44, 0.4, 22, 6); }
    if (angry) { brow(ctx, -22, -36, 0.5, 26, 8); brow(ctx, 26, -38, -0.5, 26, 8); }
    // nose
    ellipse(ctx, 62, 8, 14, 10); fill(ctx, C.dogNose, LW * 0.6);
    if (!SIL) { ctx.fillStyle = '#fff'; ellipse(ctx, 58, 4, 4, 3); ctx.fill(); }
    // mouth
    const mo = mouthOpen;
    ctx.save();
    ctx.strokeStyle = SIL || C.line; ctx.lineWidth = 5; ctx.lineCap = 'round';
    if (mo > 0.05) {
      ctx.beginPath();
      ctx.moveTo(18, 30);
      ctx.quadraticCurveTo(44, 30 + mo * 70, 72, 26);
      ctx.quadraticCurveTo(50, 34, 18, 30);
      ctx.closePath();
      fill(ctx, '#6a1422', 5);
      if (!SIL) {
        ctx.fillStyle = '#ff7a8a';
        ctx.beginPath(); ctx.ellipse(44, 34 + mo * 44, 16, 9 * mo, 0, 0, TAU); ctx.fill();
        // fangs
        ctx.fillStyle = '#fff';
        [[28, 31], [62, 28]].forEach(([fx, fy]) => { ctx.beginPath(); ctx.moveTo(fx - 5, fy); ctx.lineTo(fx + 5, fy); ctx.lineTo(fx, fy + 12 + (angry ? 6 : 0)); ctx.closePath(); ctx.fill(); ctx.stroke(); });
      }
    } else if (faceName === 'sad') {
      ctx.beginPath(); ctx.moveTo(20, 40); ctx.quadraticCurveTo(34, 30, 48, 40); ctx.stroke();
      if (!SIL) { ctx.beginPath(); ctx.moveTo(30, 42); ctx.lineTo(36, 46); ctx.stroke(); }
    } else {
      ctx.beginPath(); ctx.moveTo(62, 18); ctx.lineTo(60, 30); ctx.quadraticCurveTo(50, 40, 38, 32); ctx.moveTo(60, 30); ctx.quadraticCurveTo(68, 40, 78, 32); ctx.stroke();
    }
    if (tongue && !SIL) {
      ctx.beginPath();
      ctx.moveTo(50, 34);
      ctx.quadraticCurveTo(46, 70 + Math.sin(ph * 6) * 4, 60, 72);
      ctx.quadraticCurveTo(74, 70, 68, 34);
      ctx.closePath();
      fill(ctx, '#ff6f86', 4);
    }
    ctx.restore();
    if (faceName === 'happy' && !SIL) {
      ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = C.blush;
      ctx.beginPath(); ctx.ellipse(-36, 16, 14, 7, 0, 0, TAU); ctx.ellipse(8, 14, 12, 6, 0, 0, TAU); ctx.fill(); ctx.restore();
    }
    ctx.restore(); // head

    // collar
    ctx.save();
    const cr = head.rot;
    const cxp = head.x + (-22 * Math.cos(cr) - 58 * Math.sin(cr)), cyp = head.y + (-22 * Math.sin(cr) + 58 * Math.cos(cr));
    ctx.translate(cxp, cyp);
    ctx.rotate(cr * 0.7 - 0.2);
    rrect(ctx, -44, -9, 84, 18, 9); fill(ctx, C.collar, LW * 0.8);
    ellipse(ctx, 2, 18, 11, 11); fill(ctx, C.gold, LW * 0.7);
    ctx.restore();
    ctx.restore(); // figure

    const hr = head.rot;
    const hpW = (lx, ly) => Wd(head.x + lx * Math.cos(hr) - ly * Math.sin(hr), head.y + lx * Math.sin(hr) + ly * Math.cos(hr));
    anchors.head = hpW(0, 0);
    anchors.top = hpW(0, -80);
    anchors.nose = hpW(64, 8);
    anchors.mouth = hpW(46, 36);
    anchors.eyeL = hpW(-22, -12);
    anchors.eyeR = hpW(26, -14);
    anchors.collar = Wd(cxp + 2, cyp + 18);
    anchors.chest = Wd(body.x + 40, body.y);

    // tears drawn in world space so they pour naturally
    if (faceName === 'cry' && !SIL) {
      const e1 = anchors.eyeL, e2 = anchors.eyeR;
      F.tearStream(ctx, e1[0], e1[1] + 6 * s, t, { dir: -1, len: 240 * s, width: 20 * s, seed: 31 });
      F.tearStream(ctx, e2[0], e2[1] + 6 * s, t, { dir: 1, len: 240 * s, width: 20 * s, seed: 37 });
    }
    SIL = null;
    return anchors;
  }

  // Human tears helper: scenes call FILM.cast.tears(ctx, anchors, t, s) after drawing a 'cry' face.
  function tears(ctx, a, t, s = 1) {
    F.tearStream(ctx, a.eyeL[0], a.eyeL[1] + 8 * s, t, { dir: -1, len: 260 * s, width: 22 * s, seed: 51 });
    F.tearStream(ctx, a.eyeR[0], a.eyeR[1] + 8 * s, t, { dir: 1, len: 260 * s, width: 22 * s, seed: 57 });
  }

  FILM.cast = Object.freeze({ hayk, grant, goofy, tears });
})();

</script>
<script>
// ---- src/timeline.js
// FILM.TIMELINE: the shot list and audio cue list for "Hayk: The Burger Quest".
// Owner: storyboard. Visual rules: docs/art-bible.md. Characters: src/cast.js. Effects and props: src/props.js.
// 120 bpm: a beat is 0.5 s (12 frames at 24 fps), a bar is 2 s. Every shot boundary sits on the beat grid.
// All on-screen text is English. Anime look: cel-shaded characters, speed lines, impact frames.
(function () {
  'use strict';
  const FILM = window.FILM;

  const S = (id, file, start, end, title, brief, extra) =>
    Object.assign({ id, file, start, end, mode: 'illustrated', post: false, title, transitionIn: { kind: 'cut', dur: 0 }, brief }, extra || {});

  FILM.TIMELINE = {
    title: 'Hayk: The Burger Quest',
    bpm: 120,
    duration: 120,
    fps: 24,
    width: 1080,
    height: 1920,
    shots: [
      // ACT 1: YEREVAN (0-26)
      S('cold-open', '01-cold-open.js', 0, 4, 'Title: HAYK: THE BURGER QUEST',
        'Anime opening title card. Deep indigo night sky over Yerevan with Mount Ararat (two peaks, snow caps, FILM.fx.ararat) on the horizon, a few city lights. Radial focus lines explode from centre on beat 0.5 s with an impact flash. The title slams in on the beat 1.0 s in three drawings with overshoot: "HAYK" huge (size ~190, gold fill, thick black outline, dark red drop shadow) and under it "THE BURGER QUEST" (size ~70, white). A spinning burger (FILM.fx.burger) with sparkles pops in above the title at 2.0 s. Small caption at 3.0 s: "EPISODE 1" in a black tag. Katakana accent "バーガー" faint behind the title. Frame 0 shows the sky, mountain and first focus lines already drawn.'),
      S('trader-den', '02-trader-den.js', 4, 9, 'Hayk, trader, founder of LiquidityScan',
        'Night, Hayk\'s room in Yerevan. Hayk (FILM.cast.hayk, pose "sit", face "focused") sits in a gaming chair at a desk with three glowing monitors showing green and red candlestick charts (FILM.fx.candles) and the LiquidityScan logo (FILM.fx.lsLogo) with the word "LIQUIDITYSCAN" on the middle monitor. Monitor glow (cyan/green) rims his face. Camera slowly pushes in. At 1.0 s a character intro card slides in from the left in classic anime style: black slanted bar with "HAYK" (size 110) and under it "TRADER / FOUNDER OF LIQUIDITYSCAN" (size 40). At 3.0 s a green candle spikes up, his eyes glint (sparkle on the eye anchor) and a small SFX "PING!" pops. Window behind shows Yerevan night and Ararat silhouette. Coffee mug steaming on the desk.'),
      S('big-decision', '03-big-decision.js', 9, 13, 'I am going to Spain',
        'Same room, dramatic. On 9.0 (t=0) Hayk stands up so fast the chair spins away (motion smear). Low-angle hero shot: Hayk pose "fist", face "determined", wind blowing his hoodie, red-orange focus lines and a burning aura (FILM.fx.aura) behind him, background turns to a flat dramatic gradient. Shout bubble (spiky, FILM.fx.bubble shout:true) at 0.5 s: "I\'M GOING TO SPAIN!" then a second smaller bubble at 2.0 s: "...TO FIND INVESTORS!". Screen shake on 9.5 and 11.0 (FILM.fx.shake). A tiny world map in the corner with a dotted line Armenia -> Spain. Sparkle glints on his eyes.'),
      S('goofy-knows', '04-goofy-knows.js', 13, 17, 'Goofy sees the suitcase',
        'Apartment hallway, daytime. A packed suitcase (FILM.fx.suitcase) with an airplane tag stands by the door. Goofy (FILM.cast.goofy, pose "sit") looks at it; at 1.0 s his face switches to "sad" with huge wobbling anime tear-filled eyes, ears droop. Camera push-in on Goofy with soft pink sparkle background and light blue vertical gloom lines (anime depression lines) above his head at 2.0 s. Small thought bubble at 2.0 s: "...you\'re leaving me?". Hayk\'s legs only (cropped, FILM.cast.hayk at large scale, feet visible) step into frame at the right edge at 3.0 s with a sweat drop on screen.'),
      S('leash-handoff', '05-leash-handoff.js', 17, 21, 'Grant takes the leash',
        'Outside the apartment building doorway, bright day. Hayk (left, pose "give", face "smile") hands the red leash to Grant (FILM.cast.grant, right, pose "thumbsUp" after 1.5 s, face "confident"). Goofy sits between them looking up at Hayk, face "sad". Bubbles: Hayk at 0.5 s "GRANT, TAKE CARE OF GOOFY. ONE MONTH." Grant at 2.0 s "EASY. WHAT COULD GO WRONG?" with a sparkle on his teeth/glasses at 2.5 s. At 3.0 s Goofy turns to camera with a dark shadow over his eyes and a small "..." (foreshadowing). Leash drawn as a curve from Goofy\'s collar anchor to the hand anchor of whoever holds it.'),
      S('takeoff', '06-takeoff.js', 21, 26, 'Takeoff to Spain',
        'Zvartnots airport runway with Ararat behind at sunset (orange/pink sky). A white passenger plane (FILM.fx.plane) accelerates left to right with parallel speed lines and takes off on 22.0, then the camera whip-pans up (speed line wipe) at 23.5 to a stylised map of Europe: Armenia marked with a small flag at right, Spain at left; the plane icon flies along a dotted arc from Armenia to Spain between 24.0 and 25.5, with a caption bar "YEREVAN -> SPAIN" and "1 MONTH. MISSION: INVESTORS." Hayk\'s face visible in a plane window near the start, wearing sunglasses, grinning.'),

      // ACT 2: SPAIN (26-68)
      S('hola-espana', '07-hola-espana.js', 26, 30, 'Hola, Espana',
        'Bright Spanish street: warm sandstone buildings with balconies and flower pots, palm trees, a Sagrada-Familia-like spiky church silhouette in the distance, blue sky and a big sun with rays. Hayk walks in (pose "walk", sunglasses on, face "smile") pulling his suitcase, then strikes a pose ("peace") at 1.5 s with a sparkle burst. Big caption at 0.5 s: "DAY 1" and at 1.0 s a speech bubble "HOLA, ESPANA!" (write ESPANA as plain ASCII). At 2.5 s a to-do note card pops in the upper corner: "TODO: 1. FIND INVESTORS" with a checkbox.'),
      S('burger-scent', '08-burger-scent.js', 30, 34, 'The scent',
        'Same street, Hayk mid-walk. At 0.5 s a golden aroma ribbon (FILM.fx.aroma) curls in from off-screen right and reaches his nose. He freezes (face "shocked", sunglasses slide down his nose), dramatic black-and-white impact frame at 1.5 s (FILM.fx.impact) with his eyes wide. Extreme close-up on his eyes at 2.0 s with the reflection of a burger sign in his pupils and focus lines. Text at 2.5 s: "WAIT..." then at 3.0 s "IS THAT... A BURGER?!" in a shaky shout bubble. Katakana menace "ゴゴゴ" floating beside him.'),
      S('kfg', '09-kfg.js', 34, 39, 'KFG: bucket of chicken',
        'Parody fried-chicken restaurant "KFG" (red and white vertical stripes, a smiling old-colonel-like chicken logo that is clearly a cartoon CHICKEN with a bow tie, sign text "KFG" and small "KENTUCKY FRIED GOODNESS"). Hayk at a table, pose "eat", holding a drumstick (FILM.fx.drumstick), a big red-white bucket (FILM.fx.bucket label "KFG") in front of him. Each beat he takes a bite: big "CRUNCH!" SFX text on 35.0, 36.0, 37.0 with crumbs flying. Face "ecstatic" (anime food bliss: eyes closed happy arcs, glowing cheeks, sparkles). At 3.0 s golden light rays burst behind him. Caption top-left: "STOP 1: KFG".'),
      S('burger-kong', '10-burger-kong.js', 39, 44, 'Burger Kong',
        'Parody burger restaurant "BURGER KONG" (sign: burger bun shape with blue swoosh and a cartoon gorilla wearing a crown). Hayk wears a gold paper crown (FILM.fx.crown), holds a HUGE layered burger (FILM.fx.burger, s large) with both hands, pose "eatBig". At 1.0 s he unhinges his jaw anime-style and chomps: impact flash, "CHOMP!" SFX. At 2.0 s the burger is 1/3 gone (bite mask), at 3.0 s gone, and he raises a second burger. Bubble at 3.5 s: "ONE MORE. FOR RESEARCH." Caption top-left: "STOP 2: BURGER KONG".'),
      S('mcdonuts', '11-mcdonuts.js', 44, 49, 'McDonut\'s',

<script>
// ---- src/scenes/01-cold-open.js
// Shot 01 'cold-open' : Title card "HAYK: THE BURGER QUEST". Global T 0.0 - 4.0 (4 s).
// Layers, back to front:
//   1. indigo night sky gradient, stars, crescent moon, drifting night clouds
//   2. Mount Ararat (two peaks, snow) on the horizon with a moonlit glow behind it
//   3. Yerevan skyline: far flat blocks, the TV tower with a blinking light, near buildings with warm windows
//   4. radial focus lines (faint from frame 0, explode on 0.5 with an impact flash) + gold sunburst after 1.0
//   5. katakana accent "バーガー" faint behind the title
//   6. title "HAYK" / "THE BURGER QUEST" slamming in on 1.0 (three drawings, overshoot)
//   7. spinning burger with sparkles popping in at 2.0
//   8. "EPISODE 1" black tag at 3.0, flashes, gold bokeh embers
(function () {
  'use strict';
  const ID = 'cold-open';
  const FX = FILM.fx;
  const LIB = FILM.lib;
  const P = FX.pal;
  const TAU = Math.PI * 2;
  const FR = 1 / 24;
  const clamp = FX.clamp, lerp = FX.lerp, h01 = FX.h01;

  // beats (local = global here, shot starts at 0)
  const B_FOCUS = 0.5; // T 0.5 focus lines explode + impact flash
  const B_TITLE = 1.0; // T 1.0 title slams in
  const B_BURGER = 2.0; // T 2.0 burger pops in
  const B_EP = 3.0; // T 3.0 EPISODE 1 tag

  const W = 1080, H = 1920;
  const TITLE_Y = 820;

  // ---------------------------------------------------------------------------
  // Static skyline (cached: hundreds of windows)
  // ---------------------------------------------------------------------------
  function skyline() {
    return LIB.cached('cold-open-bg-v4', () => {
      const c = FILM.makeCanvas(W, H);
      const g = c.getContext('2d');
      // sky, moon, Ararat with a moonlit halo, TV tower (all static)
      FX.sky(g, P.nightTop, P.nightBottom, { x: 0, y: 0, w: W, h: H, mid: '#241f52', midAt: 0.45 });
      moon(g, 860, 250, 58);
      const halo = g.createRadialGradient(470, 1150, 40, 470, 1150, 700);
      halo.addColorStop(0, 'rgba(160,150,255,0.4)');
      halo.addColorStop(1, 'rgba(160,150,255,0)');
      g.fillStyle = halo;
      g.fillRect(0, 400, W, 1100);
      FX.ararat(g, -170, 1480, 1420, 720, { color: '#4d5294', shade: '#3a3f7a', snow: '#e4e8ff' });
      tvTower(g, 880, 1500);
      // far blocks: flat, cool, no outline
      g.fillStyle = '#2b2657';
      for (let i = 0; i < 26; i++) {
        const bw = 50 + h01(ID, 'fw', i) * 70;
        const bx = i * 44 - 30 + h01(ID, 'fx', i) * 20;
        const bh = 60 + h01(ID, 'fh', i) * 120;
        g.fillRect(bx, 1470 - bh, bw, bh + 40);
      }
      g.fillStyle = 'rgba(255,214,120,0.55)';
      for (let i = 0; i < 90; i++) {
        const x = h01(ID, 'fwx', i) * W, y = 1380 + h01(ID, 'fwy', i) * 90;
        g.fillRect(x, y, 5, 6);
      }
      // mid layer: tuff-stone blocks with rows of windows
      const mids = [];
      let x = -40;
      let i = 0;
      while (x < W + 40) {
        const bw = 110 + h01(ID, 'mw', i) * 120;
        const bh = 90 + h01(ID, 'mh', i) * 170;
        mids.push([x, bw, bh, i]);
        x += bw + 6;
        i++;
      }
      mids.forEach(([bx, bw, bh, k]) => {
        const top = 1600 - bh;
        g.fillStyle = k % 2 ? '#3a2d5e' : '#43336a';
        g.fillRect(bx, top, bw, H - top);
        g.fillStyle = '#2e2450';
        g.fillRect(bx + bw - 18, top, 18, H - top);
        // roof detail
        g.fillStyle = '#2a2148';
        g.fillRect(bx - 4, top - 10, bw + 8, 12);
        if (h01(ID, 'ant', k) > 0.6) { g.fillRect(bx + bw * 0.3, top - 50, 4, 42); g.fillRect(bx + bw * 0.3 - 12, top - 40, 28, 3); }
        // windows
        for (let r = 0; top + 26 + r * 44 < H; r++) {
          for (let cI = 0; 16 + cI * 34 < bw - 26; cI++) {
            const lit = h01(ID, 'win', k, r, cI) > 0.55;
            g.fillStyle = lit ? (h01(ID, 'wc', k, r, cI) > 0.3 ? '#ffd27a' : '#ffb35c') : '#271f45';
            g.fillRect(bx + 16 + cI * 34, top + 26 + r * 44, 18, 24);
          }
        }
      });
      // near layer: a dark row of rooftops at the very bottom with balconies
      for (let k = 0; k < 7; k++) {
        const bx = -60 + k * 180;
        const top = 1720 + h01(ID, 'nh', k) * 70;
        g.fillStyle = '#1d1636';
        g.fillRect(bx, top, 176, H - top);
        g.fillStyle = '#15102a';
        g.beginPath(); g.moveTo(bx - 10, top); g.lineTo(bx + 88, top - 46); g.lineTo(bx + 186, top); g.closePath(); g.fill();
        for (let r = 0; r < 4; r++) {
          for (let cI = 0; cI < 3; cI++) {
            const lit = h01(ID, 'nwin', k, r, cI) > 0.5;
            g.fillStyle = lit ? '#ffcf6e' : '#241c40';
            g.fillRect(bx + 24 + cI * 50, top + 30 + r * 64, 26, 34);
            g.fillStyle = '#15102a';
            g.fillRect(bx + 18 + cI * 50, top + 64 + r * 64, 38, 6);
          }
        }
      }
      const haze = g.createLinearGradient(0, 1300, 0, 1700);
      haze.addColorStop(0, 'rgba(255,170,90,0)');
      haze.addColorStop(1, 'rgba(255,170,90,0.16)');
      g.fillStyle = haze;
      g.fillRect(0, 1300, W, 620);
      FX.vignette(g, 0.45, '8,4,30');
      return c;
    });
  }

  // Yerevan TV tower (lattice mast) silhouette with a blinking red light
  function tvLight(ctx, x, y, t) {
    const on = Math.floor(t * 2) % 2 === 0;
    if (on) {
      const gr = ctx.createRadialGradient(x, y, 0, x, y, 30);
      gr.addColorStop(0, 'rgba(255,60,60,0.9)');
      gr.addColorStop(1, 'rgba(255,60,60,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(x, y, 30, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = on ? '#ff5050' : '#7a2a3a';
    ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.fill();
  }
  function tvTower(ctx, x, base) {
    ctx.save();
    ctx.fillStyle = '#231c44';
    ctx.beginPath();
    ctx.moveTo(x - 46, base); ctx.lineTo(x - 8, base - 330); ctx.lineTo(x + 8, base - 330); ctx.lineTo(x + 46, base); ctx.closePath();
    ctx.fill();
    ctx.fillRect(x - 5, base - 470, 10, 150);
    ctx.fillRect(x - 22, base - 250, 44, 18);
    ctx.fillRect(x - 16, base - 330, 32, 14);
    ctx.strokeStyle = '#3a2f6b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const y0 = base - k * 55, y1 = base - (k + 1) * 55;
      const w0 = 46 - k * 6.3, w1 = 46 - (k + 1) * 6.3;
      ctx.moveTo(x - w0, y0); ctx.lineTo(x + w1, y1);
      ctx.moveTo(x + w0, y0); ctx.lineTo(x - w1, y1);
    }
    ctx.stroke();
    ctx.restore();
  }

  function moon(ctx, x, y, r) {
    ctx.save();
    const gr = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 3.2);
    gr.addColorStop(0, 'rgba(255,244,200,0.35)');
    gr.addColorStop(1, 'rgba(255,244,200,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff4cc';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#e8d9a8';
    ctx.beginPath(); ctx.arc(x - r * 0.3, y + r * 0.2, r * 0.18, 0, TAU); ctx.arc(x + r * 0.35, y - r * 0.25, r * 0.12, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Title
  // ---------------------------------------------------------------------------
  function title(ctx, t) {
    if (t < B_TITLE - 1e-6) return;
    const d = Math.floor((t - B_TITLE) * 12 + 1e-6); // drawings on twos since the slam
    // three drawings: huge smear -> overshoot -> settle
    const sc = [1.55, 0.9, 1.08, 1][Math.min(3, d)];
    const settle = t - B_TITLE;
    const float = d >= 3 ? Math.sin(settle * 2.4) * 6 : 0;
    ctx.save();
    ctx.translate(540, TITLE_Y + float);
    ctx.rotate(-0.06);
    ctx.scale(sc, sc);
    // backing burst: jagged dark red plate behind HAYK
    FX.burst(ctx, 0, 0, 390, 300, 18, '#b3122b', { seed: 5, lw: 8, squash: 0.45, jitter: 0.18 });
    FX.burst(ctx, 0, 0, 340, 270, 18, '#e8413c', { seed: 6, lw: 0, squash: 0.4, jitter: 0.1 });
    // HAYK: gold fill, thick black outline, dark red drop shadow
    FX.text(ctx, 'HAYK', 0, 0, {
      size: 190, fill: P.gold, stroke: P.line, lw: 30, shadow: 16, shadowColor: '#6e0a1a', skew: -0.1, letter: 6,
    });
    // subtitle bar
    ctx.save();
    ctx.translate(0, 150);
    ctx.fillStyle = P.line;
    ctx.beginPath();
    ctx.moveTo(-400, -48); ctx.lineTo(410, -58); ctx.lineTo(395, 48); ctx.lineTo(-410, 56); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = P.gold;
    ctx.beginPath(); ctx.moveTo(-410, 56); ctx.lineTo(395, 48); ctx.lineTo(393, 60); ctx.lineTo(-412, 68); ctx.closePath(); ctx.fill();
    FX.text(ctx, 'THE BURGER QUEST', 0, 0, { size: 70, fill: '#ffffff', stroke: P.line, lw: 0, skew: -0.1 });
    ctx.restore();
    ctx.restore();
    // shine sweep over HAYK (after it settles)
    if (d >= 3) {
      const u = ((settle - 0.35) % 1.6) / 0.5;
      if (u >= 0 && u <= 1) {
        const sx = lerp(260, 820, u);
        FX.sparkle(ctx, sx, TITLE_Y - 70 + (sx - 540) * -0.06, 46, { rot: u });
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Spinning burger (fake Y-axis spin: horizontal squash with a cos)
  // ---------------------------------------------------------------------------
  function spinningBurger(ctx, t) {
    if (t < B_BURGER - 1e-6) return;
    const pop = FX.popIn(t, B_BURGER);
    const age = t - B_BURGER;
    const tw = LIB.onTwos(t);
    const spin = Math.cos((tw - B_BURGER) * TAU * 0.9);
    const sx = (0.45 + 0.55 * Math.abs(spin)) * pop;
    const bob = Math.sin(age * 3.2) * 10;
    const x = 540, y = 470 + bob;
    ctx.save();
    // glow + rays behind
    const gr = ctx.createRadialGradient(x, y, 20, x, y, 260);
    gr.addColorStop(0, 'rgba(255,230,120,0.85)');
    gr.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(x, y, 260 * pop, 0, TAU); ctx.fill();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(age * 0.6);
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff3a0';
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const a0 = (i / 12) * TAU, a1 = a0 + TAU / 36;
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a0) * 300 * pop, Math.sin(a0) * 300 * pop);
      ctx.lineTo(Math.cos(a1) * 300 * pop, Math.sin(a1) * 300 * pop);
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();
    ctx.translate(x, y);
    ctx.scale(sx, pop);
    FX.burger(ctx, 0, 0, 1.45, {});
    ctx.restore();
    // sparkles orbiting
    for (let i = 0; i < 6; i++) {
      const a = age * 2.2 + (i / 6) * TAU;
      const r = 36 * (0.6 + 0.4 * Math.abs(Math.sin(age * 5 + i * 1.3))) * pop;
      FX.sparkle(ctx, x + Math.cos(a) * 230, y + Math.sin(a) * 110, r, { color: i % 2 ? '#fff3a0' : '#ffffff', rot: a });
    }
    FX.sparkles(ctx, { x: x - 260, y: y - 170, w: 520, h: 300, n: 8, seed: 71, t, size: 30 });
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = Math.min(Math.max(tIn, 0), info.dur);
      const tw = LIB.onTwos(t);

      // camera: slow push, shake on the explosion and the slam
      const [shx, shy] = FX.shakeMany(t, [[B_FOCUS, 0.3, 14], [B_TITLE, 0.4, 26], [B_BURGER, 0.2, 8]], 3);
      const zoom = 1 + 0.035 * (t / info.dur) + (t >= B_TITLE && t < B_TITLE + 0.1 ? 0.03 : 0);
      ctx.save();
      ctx.translate(540 + shx, 960 + shy);
      ctx.scale(zoom, zoom);
      ctx.translate(-540, -960);

      // 1-3. cached sky / moon / Ararat / skyline, then live stars, clouds, lights
      ctx.fillStyle = P.nightTop;
      ctx.fillRect(-60, -60, W + 120, 120);
      ctx.drawImage(skyline(), 0, 0, W, H);
      FX.stars(ctx, { n: 90, seed: 31, x: 0, y: 0, w: W, h: 700 });
      FX.clouds(ctx, { n: 3, seed: 19, t, y: 120, h: 380, color: 'rgba(80,72,150,0.45)', shade: 'rgba(40,34,90,0.35)', speed: 22, scale: 0.8 });
      tvLight(ctx, 880, 1028, t);
      for (let i = 0; i < 10; i++) {
        const on = h01(ID, 'flk', i, Math.floor(tw * 3)) > 0.4;
        ctx.fillStyle = on ? '#fff0a8' : '#271f45';
        const x = 30 + h01(ID, 'flx', i) * 1000, y = 1560 + h01(ID, 'fly', i) * 300;
        ctx.fillRect(x, y, 18, 24);
      }

      // 4. focus lines / sunburst
      const exploded = t >= B_FOCUS - 1e-6;
      if (t >= B_TITLE - 1e-6) {
        ctx.save();
        ctx.globalAlpha = 0.4 + 0.2 * FX.beatPulse(t, 0.5, 0.15);
        ctx.translate(540, TITLE_Y);
        ctx.rotate((t - B_TITLE) * 0.25);
        const rg = ctx.createRadialGradient(0, 0, 100, 0, 0, 900);
        rg.addColorStop(0, 'rgba(255,211,90,0.9)');
        rg.addColorStop(1, 'rgba(255,211,90,0)');
        ctx.fillStyle = rg;
        ctx.beginPath();
        for (let i = 0; i < 20; i++) {
          const a0 = (i / 20) * TAU, a1 = a0 + TAU / 40;
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a0) * 1500, Math.sin(a0) * 1500);
          ctx.lineTo(Math.cos(a1) * 1500, Math.sin(a1) * 1500);
          ctx.closePath();
        }
        ctx.fill();
        ctx.restore();
      }
      if (!exploded) {
        // faint lines already converging, a spark gathering at the centre
        const u = t / B_FOCUS;
        FX.focusLines(ctx, 540, TITLE_Y, { inner: lerp(430, 300, u), count: 90, color: '#dfe3ff', alpha: 0.55 + 0.3 * u, seed: 12, width: 14 });
        FX.sparkle(ctx, 540, TITLE_Y, 40 + 90 * u, { rot: u * 1.5 });
      } else {
        const age = t - B_FOCUS;
        const inner = age < 0.5 ? lerp(120, 380, FX.clamp(age / 0.3)) : 380 + 20 * FX.beatPulse(t, 0.5, 0.15);
        FX.focusLines(ctx, 540, TITLE_Y, { inner, rx: inner * 1.15, ry: inner, count: 120, color: '#ffffff', alpha: age < 0.4 ? 0.95 : lerp(0.95, 0.4, clamp((age - 0.4) / 0.4)), seed: 13, width: 20 });
        if (age < 0.6) FX.shockRing(ctx, 540, TITLE_Y, age, { r: 700, color: '#ffffff', life: 0.6, width: 22 });
      }

      // 5. katakana accent behind the title
      if (t >= B_FOCUS) {
        const a = clamp((t - B_FOCUS) / 0.5) * 0.4;
        FX.text(ctx, 'バーガー', 540 + Math.sin(t * 1.3) * 10, 1235, { size: 210, fill: '#ffcc33', stroke: '#ffffff', lw: 8, alpha: a, font: 'jp', rot: -0.06, letter: 10 });
      }

      // gold embers drifting up
      FX.bokeh(ctx, { n: 16, seed: 44, t, x: 0, y: 300, w: W, h: 1200, rMin: 4, rMax: 14, colors: ['#ffcc33', '#ffe066', '#ff9a4a'], alpha: t >= B_TITLE ? 0.7 : 0.3 });

      // 6. title, 7. burger
      spinningBurger(ctx, t);
      title(ctx, t);
      if (t >= B_TITLE) FX.sparkles(ctx, { x: 150, y: TITLE_Y - 180, w: 780, h: 380, n: 7, seed: 83, t, size: 34 });

      // 8. EPISODE 1 tag
      if (t >= B_EP - 1e-6) {
        const s = FX.popIn(t, B_EP);
        ctx.save();
        ctx.translate(540, 1080);
        ctx.rotate(-0.04);
        ctx.scale(s, s);
        FX.tag(ctx, 'EPISODE 1', 0, 0, { size: 46, bg: P.line, color: '#ffffff', lw: 5, line: P.gold });
        ctx.restore();
        FX.sparkle(ctx, 540 + 170, 1050, 26 * s * (0.6 + 0.4 * Math.sin(t * 9)), {});
      }
      ctx.restore();

      // screen-fixed: impact flashes
      if (exploded && t < B_FOCUS + 3 * FR) FX.flash(ctx, 0.85 - (t - B_FOCUS) * 8, '#ffffff');
      if (t >= B_TITLE && t < B_TITLE + 2 * FR) FX.flash(ctx, 0.55, '#fff4c0');
    },
  });
})();

</script>
<script>
// ---- src/scenes/02-trader-den.js
// Shot 02 'trader-den' : Hayk, trader, founder of LiquidityScan. Global T 4.0 - 9.0 (5 s).
// Night, Hayk's room in Yerevan. Hayk has swivelled his gaming chair to face us; behind him the desk with
// three glowing monitors (charts left/right, LIQUIDITYSCAN logo in the middle) rims him in cyan/green.
// Layers, back to front (inside the slow push-in camera):
//   1. wall, LED strip, window with Yerevan night + Ararat silhouette, curtains, posters, shelf
//   2. monitor glow, three monitors with live candles / logo, desk, keyboard, steaming mug, lamp
//   3. gaming chair (back, arms, seat, base)
//   4. rim-light silhouettes + Hayk (sit, focused), eye glints at 3.0
//   5. floating dust motes, green spike flash, "PING!" SFX
// Screen-fixed: intro card (slides in at 1.0), vignette.
(function () {
  'use strict';
  const ID = 'trader-den';
  const FX = FILM.fx;
  const LIB = FILM.lib;
  const P = FX.pal;
  const TAU = Math.PI * 2;
  const FR = 1 / 24;
  const clamp = FX.clamp, lerp = FX.lerp, h01 = FX.h01;
  const W = 1080, H = 1920;

  const B_CARD = 1.0; // T 5.0 intro card slides in
  const B_SPIKE = 3.0; // T 7.0 green candle spikes, eye glint, PING!

  // Hayk placement (world)
  const HX = 540, HY = 1690, HS = 1.75;

  // ---------------------------------------------------------------------------
  // Static room (cached)
  // ---------------------------------------------------------------------------
  function room() {
    return LIB.cached('trader-den-room-v2', () => {
      const c = FILM.makeCanvas(W, H);
      const g = c.getContext('2d');
      // wall
      FX.sky(g, '#17152f', '#2a2350', { x: 0, y: 0, w: W, h: 1000 });
      // subtle wall panels
      g.strokeStyle = 'rgba(255,255,255,0.04)';
      g.lineWidth = 3;
      for (let i = 0; i < 7; i++) { g.beginPath(); g.moveTo(i * 180 + 20, 90); g.lineTo(i * 180 + 20, 1000); g.stroke(); }
      // ceiling strip
      g.fillStyle = '#100e22';
      g.fillRect(0, 0, W, 96);
      // window
      const wx = 170, wy = 118, ww = 740, wh = 300;
      FX.sky(g, '#0d1030', '#3a2f6b', { x: wx, y: wy, w: ww, h: wh });
      // moon + stars in window
      g.fillStyle = '#fff1c4';
      g.beginPath(); g.arc(wx + 610, wy + 90, 34, 0, TAU); g.fill();
      g.fillStyle = '#ffffff';
      for (let i = 0; i < 40; i++) { const r = 1 + h01(ID, 'wsr', i) * 2; g.globalAlpha = 0.4 + h01(ID, 'wsa', i) * 0.6; g.beginPath(); g.arc(wx + h01(ID, 'wsx', i) * ww, wy + h01(ID, 'wsy', i) * wh * 0.5, r, 0, TAU); g.fill(); }
      g.globalAlpha = 1;
      // Ararat silhouette
      g.save();
      g.beginPath(); g.rect(wx, wy, ww, wh); g.clip();
      FX.ararat(g, wx - 30, wy + wh - 30, 640, 220, { color: '#3d4380', shade: '#30356a', snow: '#aab3e8' });
      // city blocks with lights
      for (let i = 0; i < 20; i++) {
        const bw = 40 + h01(ID, 'cbw', i) * 50, bh = 24 + h01(ID, 'cbh', i) * 60;
        const bx = wx + i * 40 - 10;
        g.fillStyle = i % 2 ? '#241d44' : '#2c2350';
        g.fillRect(bx, wy + wh - bh, bw, bh);
        for (let k = 0; k < 5; k++) {
          if (h01(ID, 'cwl', i, k) > 0.45) {
            g.fillStyle = '#ffcf6e';
            g.fillRect(bx + 6 + (k % 2) * 16, wy + wh - bh + 10 + Math.floor(k / 2) * 18, 7, 9);
          }
        }
      }
      g.restore();
      // window frame + mullions
      g.strokeStyle = P.line; g.lineWidth = 10;
      g.strokeRect(wx, wy, ww, wh);
      g.strokeStyle = '#4a4380'; g.lineWidth = 6;
      g.strokeRect(wx + 6, wy + 6, ww - 12, wh - 12);
      g.fillStyle = '#2f2a58';
      g.fillRect(wx + ww / 3 - 6, wy, 12, wh);
      g.fillRect(wx + (2 * ww) / 3 - 6, wy, 12, wh);
      g.fillStyle = '#3a3466';
      g.fillRect(wx - 20, wy + wh, ww + 40, 22); // sill
      // curtains
      [[wx - 90, 1], [wx + ww - 10, -1]].forEach(([cx0, dir]) => {
        g.fillStyle = '#1f4a5e';
        g.beginPath();
        g.moveTo(cx0, 110); g.lineTo(cx0 + 100, 110);
        g.quadraticCurveTo(cx0 + 70 + dir * 10, 300, cx0 + 110, 470);
        g.lineTo(cx0 - 10, 470); g.closePath(); g.fill();
        g.strokeStyle = '#163847'; g.lineWidth = 5;
        for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(cx0 + k * 25, 120); g.quadraticCurveTo(cx0 + k * 25 + dir * 8, 300, cx0 + k * 28, 460); g.stroke(); }
      });
      g.fillStyle = '#6a6aa0';
      g.fillRect(wx - 110, 100, ww + 220, 12); // rod
      // posters on the side walls
      g.save();
      g.translate(24, 820); g.rotate(-0.03);
      FX.rrect(g, 0, 0, 150, 200, 6); FX.fo(g, '#241f47', 4);
      g.strokeStyle = P.up; g.lineWidth = 6; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(20, 160); g.lineTo(55, 120); g.lineTo(80, 140); g.lineTo(125, 50); g.stroke();
      g.fillStyle = P.up; g.beginPath(); g.moveTo(125, 38); g.lineTo(136, 64); g.lineTo(112, 58); g.closePath(); g.fill();
      FX.text(g, 'HODL', 75, 182, { size: 26, fill: '#ffffff', lw: 0 });
      g.restore();
      g.save();
      g.translate(912, 830); g.rotate(0.04);
      FX.rrect(g, 0, 0, 140, 180, 6); FX.fo(g, '#3b1d6e', 4);
      FX.text(g, 'TO THE\nMOON', 70, 60, { size: 26, fill: P.gold, lw: 0 });
      g.fillStyle = '#e8e8f8'; g.beginPath(); g.arc(70, 130, 26, 0, TAU); g.fill();
      g.restore();
      // floor
      FX.sky(g, '#231c3d', '#120f22', { x: 0, y: 1000, w: W, h: 920 });
      FX.vignette(g, 0.5, '6,4,20');
      // rug
      g.fillStyle = '#35285e';
      g.beginPath(); g.ellipse(540, 1820, 620, 120, 0, 0, TAU); g.fill();
      g.strokeStyle = '#4a3a80'; g.lineWidth = 6;
      g.beginPath(); g.ellipse(540, 1820, 560, 100, 0, 0, TAU); g.stroke();
      // desk (behind Hayk)
      g.fillStyle = '#2d2548';
      g.fillRect(0, 780, W, 330);
      g.fillStyle = '#231d3a';
      g.fillRect(0, 800, W, 30);
      FX.rrect(g, 20, 850, 200, 170, 8); FX.fo(g, '#28213f', 4);
      FX.rrect(g, 860, 850, 200, 170, 8); FX.fo(g, '#28213f', 4);
      g.fillStyle = '#6a6aa0'; g.fillRect(100, 930, 40, 8); g.fillRect(940, 930, 40, 8);
      g.fillStyle = '#1a152c'; g.fillRect(0, 1100, W, 14);
      // desk top
      g.beginPath(); g.moveTo(-20, 740); g.lineTo(W + 20, 740); g.lineTo(W + 20, 785); g.lineTo(-20, 785); g.closePath();
      FX.fo(g, '#43386b', 5);
      g.fillStyle = '#574a88'; g.fillRect(0, 743, W, 8);
      return c;
    });
  }

  // monitor screen painters (local coords, w x h)
  function screenLeft(ctx, w, h, t, spike) {
    ctx.strokeStyle = P.termGrid; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 1; i < 6; i++) { ctx.moveTo(0, (i * h) / 6); ctx.lineTo(w, (i * h) / 6); }
    for (let i = 1; i < 8; i++) { ctx.moveTo((i * w) / 8, 0); ctx.lineTo((i * w) / 8, h); }
    ctx.stroke();
    const n = 16;
    const shift = Math.floor(t * 2); // a new candle each beat
    FX.candles(ctx, 8, 30, w - 16, h - 60, { n, seed: 300 + shift, trend: 0.8 });
    FX.text(ctx, 'BTC/USDT', 12, 16, { size: 18, fill: '#8fa3d8', lw: 0, align: 'left' });
    FX.text(ctx, spike ? '+8.2%' : '+0.4%', w - 12, 16, { size: 18, fill: P.up, lw: 0, align: 'right' });
  }
  function screenRight(ctx, w, h, t, spikeU) {
    ctx.strokeStyle = P.termGrid; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 1; i < 6; i++) { ctx.moveTo(0, (i * h) / 6); ctx.lineTo(w, (i * h) / 6); }
    ctx.stroke();
    const vals = FX.candles(ctx, 8, 40, w - 70, h - 70, { n: 14, seed: 911, trend: -0.6 });
    // live last candle: grows into a spike after 3.0
    const last = vals[vals.length - 1];
    const cw = (w - 70) / 14;
    const cx = 8 + (w - 70) + cw * 0.5;
    const base = 40 + (h - 70) - last[1] * (h - 70);
    const hgt = 18 + Math.sin(t * 7) * 6 + spikeU * (base - 30);
    ctx.fillStyle = P.up;
    ctx.fillRect(cx - cw * 0.4, base - hgt, cw * 0.8, hgt);
    ctx.strokeStyle = P.up; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, base - hgt - 10); ctx.lineTo(cx, base + 12); ctx.stroke();
    // order book bars
    for (let i = 0; i < 8; i++) {
      const bw = 10 + h01(ID, 'ob', i, Math.floor(t * 4)) * 40;
      ctx.fillStyle = i < 4 ? 'rgba(255,77,94,0.6)' : 'rgba(47,224,138,0.6)';
      ctx.fillRect(w - bw, 14 + i * 16, bw, 11);
    }
    FX.text(ctx, 'ETH/USDT', 12, 18, { size: 18, fill: '#8fa3d8', lw: 0, align: 'left' });
  }
  function screenMid(ctx, w, h, t, spikeU) {
    // logo header
    const gr = ctx.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#0f1a38');
    gr.addColorStop(1, '#0b1020');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);
    FX.lsLogo(ctx, w / 2, 62, 0.62 + 0.02 * Math.sin(t * 4), { lw: 3 });
    FX.text(ctx, 'LIQUIDITYSCAN', w / 2, 132, { size: 36, fill: '#ffffff', lw: 0, letter: 2 });
    // mini chart under the logo
    ctx.strokeStyle = P.termGrid; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(14, h - 20); ctx.lineTo(w - 14, h - 20); ctx.stroke();
    FX.candles(ctx, 14, 150, w - 28, h - 170, { n: 22, seed: 55, trend: 0.9 });
    // spike candle on the far right
    if (spikeU > 0) {
      const x = w - 30, top = lerp(h - 60, 150, spikeU);
      ctx.save();
      const gg = ctx.createLinearGradient(0, top, 0, h - 30);
      gg.addColorStop(0, 'rgba(47,224,138,1)');
      gg.addColorStop(1, 'rgba(47,224,138,0.5)');
      ctx.fillStyle = gg;
      ctx.fillRect(x - 11, top, 22, h - 30 - top);
      ctx.restore();
    }
  }

  // gaming chair parts (drawn around Hayk)
  function chairBack(ctx, x, y, s, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    ctx.scale(s, s);
    // backrest (y is the seat height); racing-style wings
    ctx.beginPath();
    ctx.moveTo(-150, 0); ctx.lineTo(-170, -260); ctx.quadraticCurveTo(-175, -420, -110, -470);
    ctx.lineTo(-80, -540); ctx.quadraticCurveTo(0, -575, 80, -540); ctx.lineTo(110, -470);
    ctx.quadraticCurveTo(175, -420, 170, -260); ctx.lineTo(150, 0); ctx.closePath();
    FX.fo(ctx, '#1d1a26', 6);
    // red side panels
    ctx.fillStyle = '#d7282f';
    ctx.beginPath(); ctx.moveTo(-150, -10); ctx.lineTo(-166, -260); ctx.quadraticCurveTo(-170, -400, -112, -460); ctx.lineTo(-96, -440); ctx.quadraticCurveTo(-140, -380, -132, -260); ctx.lineTo(-118, -10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(150, -10); ctx.lineTo(166, -260); ctx.quadraticCurveTo(170, -400, 112, -460); ctx.lineTo(96, -440); ctx.quadraticCurveTo(140, -380, 132, -260); ctx.lineTo(118, -10); ctx.closePath(); ctx.fill();
    // headrest pillow + head holes
    FX.rrect(ctx, -60, -520, 120, 50, 20); FX.fo(ctx, '#d7282f', 4);
    ctx.fillStyle = '#0c0a12';
    FX.rrect(ctx, -80, -455, 40, 70, 16); ctx.fill();
    FX.rrect(ctx, 40, -455, 40, 70, 16); ctx.fill();
    // stitching
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-60, -360); ctx.lineTo(-60, -20); ctx.moveTo(60, -360); ctx.lineTo(60, -20); ctx.stroke();
    ctx.restore();
  }
  function chairSeat(ctx, x, y, s, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    ctx.scale(s, s);
    // gas lift + star base with wheels
    ctx.fillStyle = '#3a3a48';
    ctx.fillRect(-14, 20, 28, 120);
    ctx.strokeStyle = P.line; ctx.lineWidth = 4; ctx.strokeRect(-14, 20, 28, 120);
    FX.poly(ctx, [[-170, 150], [-16, 128], [16, 128], [170, 150], [150, 164], [0, 146], [-150, 164]]);
    FX.fo(ctx, '#2a2a36', 5);
    [[-160, 172], [160, 172], [-70, 180], [70, 180]].forEach(([wx, wy]) => { FX.ellipse(ctx, wx, wy, 18, 14); FX.fo(ctx, '#15151f', 4); });
    // seat cushion
    FX.ellipse(ctx, 0, 0, 175, 42); FX.fo(ctx, '#1d1a26', 6);
    ctx.fillStyle = '#d7282f';
    FX.ellipse(ctx, 0, -4, 150, 26); ctx.fill();
    ctx.restore();
  }
  function chairArms(ctx, x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    [-1, 1].forEach((d) => {
      ctx.fillStyle = '#2a2a36';
      ctx.fillRect(d * 150 - 10, -90, 20, 90);
      FX.rrect(ctx, d * 150 - 34, -112, 68, 32, 12); FX.fo(ctx, '#1d1a26', 5);
    });
    ctx.restore();
  }

  // local intro card (the shared one's bar is too short for the long subtitle)
  function introCard(ctx, t, t0) {
    if (t < t0 - 1e-6) return;
    const u = LIB.ease.outExpo(clamp((t - t0 + FR) / 0.35));
    const y = 1395;
    ctx.save();
    ctx.translate(-(1 - u) * 1200, 0);
    // speed streak behind the bar
    ctx.fillStyle = 'rgba(255,204,51,0.35)';
    ctx.beginPath(); ctx.moveTo(-20, y - 160); ctx.lineTo(1100, y - 196); ctx.lineTo(1100, y - 172); ctx.lineTo(-20, y - 138); ctx.closePath(); ctx.fill();
    // bar
    ctx.fillStyle = P.line;
    ctx.beginPath();
    ctx.moveTo(-20, y - 120); ctx.lineTo(1100, y - 150); ctx.lineTo(1100, y + 88); ctx.lineTo(-20, y + 112); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = P.gold;
    ctx.beginPath(); ctx.moveTo(-20, y + 112); ctx.lineTo(1100, y + 88); ctx.lineTo(1100, y + 104); ctx.lineTo(-20, y + 130); ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.lsBlue;
    ctx.beginPath(); ctx.moveTo(40, y - 118); ctx.lineTo(62, y - 118); ctx.lineTo(40, y + 110); ctx.lineTo(18, y + 110); ctx.closePath(); ctx.fill();
    const nameSlide = (1 - LIB.ease.outCubic(clamp((t - t0) / 0.5))) * 160;
    FX.text(ctx, 'HAYK', 96 + nameSlide, y - 38, { size: 110, fill: P.gold, stroke: '#6e0a1a', lw: 0, shadow: 7, shadowColor: '#b3122b', align: 'left', skew: -0.15, rot: -0.025 });
    FX.text(ctx, 'TRADER / FOUNDER OF LIQUIDITYSCAN', 100 + nameSlide * 0.5, y + 52, { size: 40, fill: '#ffffff', lw: 0, align: 'left', rot: -0.025 });
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = Math.min(Math.max(tIn, 0), info.dur);
      const tw = LIB.onTwos(t);
      const spikeU = t < B_SPIKE ? 0 : LIB.ease.outBack(clamp((t - B_SPIKE + FR) / 0.25));
      const spiked = t >= B_SPIKE - 1e-6;

      // camera: slow push-in toward his face, tiny kick on the spike
      const z = 1 + 0.1 * LIB.ease.inOutSine(t / info.dur) + (spiked && t < B_SPIKE + 0.1 ? 0.02 : 0);
      const [sx, sy] = FX.shake(t, B_SPIKE, 0.25, 7, 5);
      ctx.save();
      ctx.translate(540 + sx, 1000 + sy);
      ctx.scale(z, z);
      ctx.translate(-540, -1000);

      // 1. room
      ctx.fillStyle = '#17152f';
      ctx.fillRect(-40, -40, W + 80, H + 80);
      ctx.drawImage(room(), 0, 0, W, H);
      // window lights twinkle + slow cloud
      for (let i = 0; i < 12; i++) {
        const on = h01(ID, 'wt', i, Math.floor(tw * 2)) > 0.5;
        if (!on) continue;
        ctx.fillStyle = '#fff3b0';
        ctx.fillRect(180 + h01(ID, 'wtx', i) * 720, 470 + h01(ID, 'wty', i) * 60, 6, 8);
      }
      ctx.save();
      ctx.beginPath(); ctx.rect(176, 156, 728, 388); ctx.clip();
      FX.cloud(ctx, 200 + t * 18, 250, 220, 'rgba(90,84,160,0.55)', 'rgba(50,44,110,0.4)');
      ctx.restore();
      // LED strip: hue cycles
      const hue = (t * 40) % 360;
      ctx.save();
      const led = ctx.createLinearGradient(0, 96, 0, 200);
      led.addColorStop(0, `hsla(${hue},90%,60%,0.55)`);
      led.addColorStop(1, `hsla(${hue},90%,60%,0)`);
      ctx.fillStyle = led; ctx.fillRect(0, 96, W, 110);
      ctx.fillStyle = `hsl(${hue},95%,70%)`; ctx.fillRect(0, 90, W, 8);
      ctx.restore();

      // 2. monitor glow + monitors
      ctx.save();
      const glow = ctx.createRadialGradient(540, 600, 60, 540, 640, 620);
      glow.addColorStop(0, spiked ? 'rgba(80,255,170,0.45)' : 'rgba(60,200,255,0.4)');
      glow.addColorStop(1, 'rgba(60,200,255,0)');
      ctx.fillStyle = glow; ctx.fillRect(0, 140, W, 1100);
      ctx.restore();
      FX.monitor(ctx, 20, 470, 330, 240, { screen: (g, w, h) => screenLeft(g, w, h, t, spiked) });
      FX.monitor(ctx, 730, 470, 330, 240, { screen: (g, w, h) => screenRight(g, w, h, t, spikeU) });
      FX.monitor(ctx, 320, 430, 440, 300, { screen: (g, w, h) => screenMid(g, w, h, t, spikeU) });
      // scanline sheen on screens
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = '#ffffff';
      const sl = 440 + ((t * 120) % 280);
      ctx.fillRect(332, sl, 416, 6);
      ctx.restore();
      // desk items: keyboard with RGB, mouse, mug, cactus, snow globe
      ctx.save();
      FX.rrect(ctx, 370, 708, 340, 34, 8); FX.fo(ctx, '#15151f', 4);
      for (let i = 0; i < 14; i++) {
        ctx.fillStyle = `hsl(${(hue + i * 24) % 360},90%,62%)`;
        ctx.fillRect(382 + i * 23, 716, 17, 7);
        ctx.fillRect(382 + i * 23, 728, 17, 7);
      }
      FX.ellipse(ctx, 760, 728, 22, 13); FX.fo(ctx, '#15151f', 4);
      ctx.restore();
      FX.mug(ctx, 950, 745, 0.9, { t });
      // cactus in a pot (left)
      FX.rrect(ctx, 52, 690, 26, 44, 13); FX.fo(ctx, P.tree, 4);
      FX.rrect(ctx, 34, 700, 16, 26, 8); FX.fo(ctx, P.tree, 4);
      FX.poly(ctx, [[36, 725], [96, 725], [88, 752], [44, 752]]); FX.fo(ctx, '#d9653b', 4);
      // snow globe with a tiny Ararat
      FX.ellipse(ctx, 840, 712, 26, 26); FX.fo(ctx, 'rgba(200,230,255,0.5)', 4);
      FX.rrect(ctx, 816, 728, 48, 14, 4); FX.fo(ctx, '#7a5236', 4);

      // 3. chair: back + seat behind Hayk
      const breathe = Math.sin(t * 2.2) * 3;
      const seatY = HY - 101 * HS;
      chairBack(ctx, HX, seatY + 20, 1.0, Math.sin(t * 0.9) * 0.01);
      chairSeat(ctx, HX, seatY + 30, 1.0, 0);
      chairArms(ctx, HX, seatY + 10, 1.0);

      // 4. rim light silhouettes then Hayk
      const ho = { x: HX, y: HY + breathe * 0.3, s: HS, t, pose: 'sit', face: 'focused', belly: 0, look: [0, -0.1] };
      const rimA = spiked ? '#6dffb0' : '#6ff2ff';
      FILM.cast.hayk(ctx, Object.assign({}, ho, { x: HX - 8, y: ho.y - 6, silhouette: rimA }));
      FILM.cast.hayk(ctx, Object.assign({}, ho, { x: HX + 8, y: ho.y - 6, silhouette: '#5dffa8' }));
      const a = FILM.cast.hayk(ctx, ho);
      // monitor light wash over his head (additive)
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const rim = ctx.createRadialGradient(a.head[0], a.head[1] - 120, 40, a.head[0], a.head[1] - 60, 260);
      rim.addColorStop(0, spiked ? 'rgba(60,255,140,0.22)' : 'rgba(40,190,255,0.18)');
      rim.addColorStop(1, 'rgba(40,190,255,0)');
      ctx.fillStyle = rim;
      ctx.fillRect(a.head[0] - 300, a.head[1] - 400, 600, 600);
      ctx.restore();

      // 5. dust motes in the monitor light
      FX.bokeh(ctx, { n: 14, seed: 202, t, x: 60, y: 420, w: 960, h: 700, rMin: 3, rMax: 9, colors: ['#9ff0ff', '#b8ffd8', '#ffffff'], alpha: 0.5 });

      // spike: eye glints, PING!, green burst of light
      if (spiked) {
        const age = t - B_SPIKE;
        const gl = age < 0.35 ? FX.popIn(t, B_SPIKE) : 0.75 + 0.25 * Math.sin(age * 12);
        FX.sparkle(ctx, a.eyeL[0] - 6, a.eyeL[1] - 10, 42 * gl, { rot: age * 2, color: '#eafff4' });
        FX.sparkle(ctx, a.eyeR[0] - 6, a.eyeR[1] - 10, 58 * gl, { rot: -age * 2, color: '#ffffff' });
        if (age < 0.5) FX.shockRing(ctx, 540, 560, age, { r: 360, color: P.up, life: 0.5, width: 14 });
        FX.speedLines(ctx, { x: 180, y: 200, w: 720, h: 600, angle: -Math.PI / 2, count: 18, color: P.up, alpha: 0.5 * clamp(1 - age / 1.2), t, speed: 1400, len: 200, width: 8, seed: 71 });
        // green arrow up over the monitors
        const ay = 420 - LIB.ease.outCubic(clamp(age / 0.4)) * 60;
        ctx.save();
        ctx.translate(900, ay);
        ctx.scale(FX.popIn(t, B_SPIKE), FX.popIn(t, B_SPIKE));
        FX.poly(ctx, [[0, -70], [50, -10], [20, -10], [20, 60], [-20, 60], [-20, -10], [-50, -10]]);
        FX.fo(ctx, P.up, 5);
        ctx.restore();
      }
      ctx.restore(); // camera

      // screen-fixed overlays
      if (spiked && t < B_SPIKE + 3 * FR) FX.flash(ctx, 0.3, '#b8ffd8');
      if (spiked) {
        FX.burst(ctx, 850, 800, 150 * FX.popIn(t, B_SPIKE), 95 * FX.popIn(t, B_SPIKE), 12, '#ffffff', { seed: 4, lw: 5, jitter: 0.2 });
        FX.sfx(ctx, 'PING!', 850, 800, t, B_SPIKE, { size: 96, fill: P.up, shadowColor: '#0b6b3a', rot: -0.15 });
      }
      introCard(ctx, t, B_CARD);
    },
  });
})();

</script>
<script>
// ---- src/scenes/03-big-decision.js
// Shot 03 'big-decision' : "I'M GOING TO SPAIN!". Global T 9.0 - 13.0 (4 s).
// 0.0-0.5  same room as trader-den: Hayk shoots up out of his gaming chair (stretch, speed lines), the chair
//          spins away to the right with a motion smear, landing squash.
// 0.5      impact frame (2 frames) -> low-angle hero shot on a flat dramatic gradient: red-orange focus lines,
//          burning aura, wind streaks, embers. Hayk pose "fist", face "determined". Shake on 0.5 and 2.0.
// 0.5      spiky shout bubble "I'M GOING TO SPAIN!"; 2.0 smaller bubble "...TO FIND INVESTORS!".
//          Tiny world map (Armenia -> Spain dotted route) in the lower-left corner. Eye glints.
// Layers, back to front: background (room | gradient), focus lines, aura, chair, Hayk, effects;
// screen-fixed: bubbles, map, flashes.
(function () {
  'use strict';
  const ID = 'big-decision';
  const FX = FILM.fx;
  const LIB = FILM.lib;
  const P = FX.pal;
  const TAU = Math.PI * 2;
  const FR = 1 / 24;
  const clamp = FX.clamp, lerp = FX.lerp, h01 = FX.h01;
  const W = 1080, H = 1920;

  const B_HERO = 0.5; // T 9.5 cut to hero shot, shout, shake
  const B_SECOND = 2.0; // T 11.0 second bubble, shake

  // room-phase Hayk placement (matches trader-den)
  const HX = 540, HY = 1690, HS = 1.75;
  // hero-phase placement
  const GX = 680, GY = 1885, GS = 1.85;

  // Static room, same layout as trader-den (cached under this shot's own key)
  function room() {
    return LIB.cached('big-decision-room-v1', () => {
      const c = FILM.makeCanvas(W, H);
      const g = c.getContext('2d');
      // wall
      FX.sky(g, '#17152f', '#2a2350', { x: 0, y: 0, w: W, h: 1000 });
      // subtle wall panels
      g.strokeStyle = 'rgba(255,255,255,0.04)';
      g.lineWidth = 3;
      for (let i = 0; i < 7; i++) { g.beginPath(); g.moveTo(i * 180 + 20, 90); g.lineTo(i * 180 + 20, 1000); g.stroke(); }
      // ceiling strip
      g.fillStyle = '#100e22';
      g.fillRect(0, 0, W, 96);
      // window
      const wx = 170, wy = 118, ww = 740, wh = 300;
      FX.sky(g, '#0d1030', '#3a2f6b', { x: wx, y: wy, w: ww, h: wh });
      // moon + stars in window
      g.fillStyle = '#fff1c4';
      g.beginPath(); g.arc(wx + 610, wy + 90, 34, 0, TAU); g.fill();
      g.fillStyle = '#ffffff';
      for (let i = 0; i < 40; i++) { const r = 1 + h01(ID, 'wsr', i) * 2; g.globalAlpha = 0.4 + h01(ID, 'wsa', i) * 0.6; g.beginPath(); g.arc(wx + h01(ID, 'wsx', i) * ww, wy + h01(ID, 'wsy', i) * wh * 0.5, r, 0, TAU); g.fill(); }
      g.globalAlpha = 1;
      // Ararat silhouette
      g.save();
      g.beginPath(); g.rect(wx, wy, ww, wh); g.clip();
      FX.ararat(g, wx - 30, wy + wh - 30, 640, 220, { color: '#3d4380', shade: '#30356a', snow: '#aab3e8' });
      // city blocks with lights
      for (let i = 0; i < 20; i++) {
        const bw = 40 + h01(ID, 'cbw', i) * 50, bh = 24 + h01(ID, 'cbh', i) * 60;
        const bx = wx + i * 40 - 10;
        g.fillStyle = i % 2 ? '#241d44' : '#2c2350';
        g.fillRect(bx, wy + wh - bh, bw, bh);
        for (let k = 0; k < 5; k++) {
          if (h01(ID, 'cwl', i, k) > 0.45) {
            g.fillStyle = '#ffcf6e';
            g.fillRect(bx + 6 + (k % 2) * 16, wy + wh - bh + 10 + Math.floor(k / 2) * 18, 7, 9);
          }
        }
      }
      g.restore();
      // window frame + mullions
      g.strokeStyle = P.line; g.lineWidth = 10;
      g.strokeRect(wx, wy, ww, wh);
      g.strokeStyle = '#4a4380'; g.lineWidth = 6;
      g.strokeRect(wx + 6, wy + 6, ww - 12, wh - 12);
      g.fillStyle = '#2f2a58';
      g.fillRect(wx + ww / 3 - 6, wy, 12, wh);
      g.fillRect(wx + (2 * ww) / 3 - 6, wy, 12, wh);
      g.fillStyle = '#3a3466';
      g.fillRect(wx - 20, wy + wh, ww + 40, 22); // sill
      // curtains
      [[wx - 90, 1], [wx + ww - 10, -1]].forEach(([cx0, dir]) => {
        g.fillStyle = '#1f4a5e';
        g.beginPath();
        g.moveTo(cx0, 110); g.lineTo(cx0 + 100, 110);
        g.quadraticCurveTo(cx0 + 70 + dir * 10, 300, cx0 + 110, 470);
        g.lineTo(cx0 - 10, 470); g.closePath(); g.fill();
        g.strokeStyle = '#163847'; g.lineWidth = 5;
        for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(cx0 + k * 25, 120); g.quadraticCurveTo(cx0 + k * 25 + dir * 8, 300, cx0 + k * 28, 460); g.stroke(); }
      });
      g.fillStyle = '#6a6aa0';
      g.fillRect(wx - 110, 100, ww + 220, 12); // rod
      // posters on the side walls
      g.save();
      g.translate(24, 820); g.rotate(-0.03);
      FX.rrect(g, 0, 0, 150, 200, 6); FX.fo(g, '#241f47', 4);
      g.strokeStyle = P.up; g.lineWidth = 6; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(20, 160); g.lineTo(55, 120); g.lineTo(80, 140); g.lineTo(125, 50); g.stroke();
      g.fillStyle = P.up; g.beginPath(); g.moveTo(125, 38); g.lineTo(136, 64); g.lineTo(112, 58); g.closePath(); g.fill();
      FX.text(g, 'HODL', 75, 182, { size: 26, fill: '#ffffff', lw: 0 });
      g.restore();
      g.save();
      g.translate(912, 830); g.rotate(0.04);
      FX.rrect(g, 0, 0, 140, 180, 6); FX.fo(g, '#3b1d6e', 4);
      FX.text(g, 'TO THE\nMOON', 70, 60, { size: 26, fill: P.gold, lw: 0 });
      g.fillStyle = '#e8e8f8'; g.beginPath(); g.arc(70, 130, 26, 0, TAU); g.fill();
      g.restore();
      // floor
      FX.sky(g, '#231c3d', '#120f22', { x: 0, y: 1000, w: W, h: 920 });
      FX.vignette(g, 0.5, '6,4,20');
      // rug
      g.fillStyle = '#35285e';
      g.beginPath(); g.ellipse(540, 1820, 620, 120, 0, 0, TAU); g.fill();
      g.strokeStyle = '#4a3a80'; g.lineWidth = 6;
      g.beginPath(); g.ellipse(540, 1820, 560, 100, 0, 0, TAU); g.stroke();
      // desk (behind Hayk)
      g.fillStyle = '#2d2548';
      g.fillRect(0, 780, W, 330);
      g.fillStyle = '#231d3a';
      g.fillRect(0, 800, W, 30);
      FX.rrect(g, 20, 850, 200, 170, 8); FX.fo(g, '#28213f', 4);
      FX.rrect(g, 860, 850, 200, 170, 8); FX.fo(g, '#28213f', 4);
      g.fillStyle = '#6a6aa0'; g.fillRect(100, 930, 40, 8); g.fillRect(940, 930, 40, 8);
      g.fillStyle = '#1a152c'; g.fillRect(0, 1100, W, 14);
      // desk top
      g.beginPath(); g.moveTo(-20, 740); g.lineTo(W + 20, 740); g.lineTo(W + 20, 785); g.lineTo(-20, 785); g.closePath();
      FX.fo(g, '#43386b', 5);
      g.fillStyle = '#574a88'; g.fillRect(0, 743, W, 8);
      return c;
    });
  }


  // gaming chair parts (drawn around Hayk)
  function chairBack(ctx, x, y, s, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    ctx.scale(s, s);
    // backrest (y is the seat height); racing-style wings
    ctx.beginPath();
    ctx.moveTo(-150, 0); ctx.lineTo(-170, -260); ctx.quadraticCurveTo(-175, -420, -110, -470);
    ctx.lineTo(-80, -540); ctx.quadraticCurveTo(0, -575, 80, -540); ctx.lineTo(110, -470);
    ctx.quadraticCurveTo(175, -420, 170, -260); ctx.lineTo(150, 0); ctx.closePath();
    FX.fo(ctx, '#1d1a26', 6);
    // red side panels
    ctx.fillStyle = '#d7282f';
    ctx.beginPath(); ctx.moveTo(-150, -10); ctx.lineTo(-166, -260); ctx.quadraticCurveTo(-170, -400, -112, -460); ctx.lineTo(-96, -440); ctx.quadraticCurveTo(-140, -380, -132, -260); ctx.lineTo(-118, -10); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(150, -10); ctx.lineTo(166, -260); ctx.quadraticCurveTo(170, -400, 112, -460); ctx.lineTo(96, -440); ctx.quadraticCurveTo(140, -380, 132, -260); ctx.lineTo(118, -10); ctx.closePath(); ctx.fill();
    // headrest pillow + head holes
    FX.rrect(ctx, -60, -520, 120, 50, 20); FX.fo(ctx, '#d7282f', 4);
    ctx.fillStyle = '#0c0a12';
    FX.rrect(ctx, -80, -455, 40, 70, 16); ctx.fill();
    FX.rrect(ctx, 40, -455, 40, 70, 16); ctx.fill();
    // stitching
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-60, -360); ctx.lineTo(-60, -20); ctx.moveTo(60, -360); ctx.lineTo(60, -20); ctx.stroke();
    ctx.restore();
  }
  function chairSeat(ctx, x, y, s, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    ctx.scale(s, s);
    // gas lift + star base with wheels
    ctx.fillStyle = '#3a3a48';
    ctx.fillRect(-14, 20, 28, 120);
    ctx.strokeStyle = P.line; ctx.lineWidth = 4; ctx.strokeRect(-14, 20, 28, 120);
    FX.poly(ctx, [[-170, 150], [-16, 128], [16, 128], [170, 150], [150, 164], [0, 146], [-150, 164]]);
    FX.fo(ctx, '#2a2a36', 5);
    [[-160, 172], [160, 172], [-70, 180], [70, 180]].forEach(([wx, wy]) => { FX.ellipse(ctx, wx, wy, 18, 14); FX.fo(ctx, '#15151f', 4); });
    // seat cushion
    FX.ellipse(ctx, 0, 0, 175, 42); FX.fo(ctx, '#1d1a26', 6);
    ctx.fillStyle = '#d7282f';
    FX.ellipse(ctx, 0, -4, 150, 26); ctx.fill();
    ctx.restore();
  }
  function chairArms(ctx, x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    [-1, 1].forEach((d) => {
      ctx.fillStyle = '#2a2a36';
      ctx.fillRect(d * 150 - 10, -90, 20, 90);
      FX.rrect(ctx, d * 150 - 34, -112, 68, 32, 12); FX.fo(ctx, '#1d1a26', 5);
    });
    ctx.restore();
  }


  // ---------------------------------------------------------------------------
  // Hero background: flat dramatic gradient, perspective floor
  // ---------------------------------------------------------------------------
  function heroBg() {
    return LIB.cached('big-decision-hero-v3', () => {
      const c = FILM.makeCanvas(W, H);
      const g = c.getContext('2d');
      FX.sky(g, '#1c0410', '#e8501c', { x: 0, y: 0, w: W, h: H, mid: '#9e1028', midAt: 0.5 });
      // floor
      g.fillStyle = '#240812';
      g.fillRect(0, 1820, W, 100);
      g.strokeStyle = 'rgba(255,120,60,0.35)';
      g.lineWidth = 4;
      g.beginPath();
      for (let i = -8; i <= 8; i++) { g.moveTo(540 + i * 40, 1820); g.lineTo(540 + i * 260, 1920); }
      g.moveTo(0, 1850); g.lineTo(W, 1850);
      g.stroke();
      g.fillStyle = '#ffb35c';
      g.fillRect(0, 1816, W, 6);
      FX.vignette(g, 0.45, '30,0,10');
      return c;
    });
  }

  // tiny world map card: Armenia -> Spain
  function worldMap(ctx, t) {
    const x = 70, y = 1318, w = 330, h = 210;
    const s = FX.popIn(t, B_HERO + 0.25);
    if (s <= 0) return;
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.rotate(-0.05);
    ctx.scale(s, s);
    ctx.translate(-w / 2, -h / 2);
    FX.rrect(ctx, 0, 0, w, h, 16); FX.fo(ctx, '#15324f', 6, P.line);
    ctx.save();
    FX.rrect(ctx, 0, 0, w, h, 16); ctx.clip();
    // sea grid
    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 1; i < 6; i++) { ctx.moveTo((i * w) / 6, 0); ctx.lineTo((i * w) / 6, h); }
    for (let i = 1; i < 4; i++) { ctx.moveTo(0, (i * h) / 4); ctx.lineTo(w, (i * h) / 4); }
    ctx.stroke();
    // land: Europe blob, Iberia, Italy, Balkans/Turkey, Caucasus
    ctx.fillStyle = '#5a9e40';
    const land = [
      [[0, 30], [120, 10], [230, 0], [330, 0], [330, 120], [300, 105], [250, 112], [215, 100], [190, 108], [170, 95], [150, 110], [128, 90], [110, 70], [80, 78], [55, 70], [30, 80], [0, 75]],
      [[18, 88], [70, 82], [86, 96], [80, 140], [52, 150], [20, 138], [12, 110]], // Iberia
      [[128, 92], [140, 98], [165, 140], [178, 150], [170, 156], [150, 140], [132, 112]], // Italy
      [[200, 112], [300, 110], [330, 125], [330, 165], [260, 165], [215, 150], [205, 128]], // Turkey + Caucasus
    ];
    land.forEach((pts) => { FX.poly(ctx, pts); ctx.fill(); ctx.strokeStyle = '#2e6b24'; ctx.lineWidth = 3; ctx.stroke(); });
    // Black Sea hole
    ctx.fillStyle = '#15324f';
    FX.ellipse(ctx, 250, 100, 34, 14); ctx.fill();
    ctx.restore();
    // route: dotted arc from Armenia (right) to Spain (left), drawn progressively
    const A = [300, 138], S = [50, 116], C = [175, 20];
    const prog = clamp((t - (B_HERO + 0.35)) / 1.6);
    const pt = (u) => [(1 - u) * (1 - u) * A[0] + 2 * (1 - u) * u * C[0] + u * u * S[0], (1 - u) * (1 - u) * A[1] + 2 * (1 - u) * u * C[1] + u * u * S[1]];
    ctx.fillStyle = '#ffffff';
    const nd = 22;
    for (let i = 0; i <= nd; i++) {
      const u = i / nd;
      if (u > prog) break;
      const p = pt(u);
      ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, TAU); ctx.fill();
    }
    // markers
    [[A, '#d90012'], [S, '#ffc400']].forEach(([p, c], i) => {
      const pulse = 1 + 0.25 * FX.beatPulse(t, 0.5, 0.15);
      FX.ellipse(ctx, p[0], p[1], 11 * pulse, 11 * pulse); FX.fo(ctx, c, 4);
      if (i === 1 && prog >= 1) FX.sparkle(ctx, p[0], p[1] - 4, 26 * (0.7 + 0.3 * Math.sin(t * 10)), {});
    });
    // plane at the head of the route
    const hp = pt(Math.min(prog, 1)), hp2 = pt(Math.max(0, Math.min(prog, 1) - 0.05));
    ctx.save();
    ctx.translate(hp[0], hp[1] - 2);
    const ang = Math.atan2(hp[1] - hp2[1], hp[0] - hp2[0]);
    ctx.rotate(ang);
    FX.poly(ctx, [[18, 0], [-14, -6], [-18, -18], [-22, -18], [-18, -4], [-24, -2], [-24, 2], [-18, 4], [-22, 18], [-18, 18], [-14, 6]]);
    FX.fo(ctx, '#ffffff', 3);
    ctx.restore();
    FX.text(ctx, 'ARMENIA', 272, 185, { size: 24, fill: '#ffffff', lw: 5 });
    FX.text(ctx, 'SPAIN', 58, 180, { size: 24, fill: P.gold, lw: 5 });
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = Math.min(Math.max(tIn, 0), info.dur);
      const tw = LIB.onTwos(t);
      const hero = t >= B_HERO - 1e-6;
      const impactFrame = hero && t < B_HERO + 2 * FR - 1e-6;

      if (!hero) {
        // ------------------------------------------------------------------ room phase
        const u = clamp(t / B_HERO); // 0..1
        const [sx, sy] = FX.shake(t, 0, 0.35, 12, 9);
        const z = 1.1;
        ctx.save();
        ctx.translate(540 + sx, 1000 + sy);
        ctx.scale(z, z);
        ctx.translate(-540, -1000);
        ctx.fillStyle = '#17152f';
        ctx.fillRect(-40, -40, W + 80, H + 80);
        ctx.drawImage(room(), 0, 0, W, H);
        // monitor glow flicker
        ctx.save();
        const glow = ctx.createRadialGradient(540, 600, 60, 540, 640, 620);
        glow.addColorStop(0, 'rgba(80,255,170,0.4)');
        glow.addColorStop(1, 'rgba(60,200,255,0)');
        ctx.fillStyle = glow; ctx.fillRect(0, 140, W, 1100);
        ctx.restore();
        // chair spins away to the right
        const cu = LIB.ease.outQuad(clamp((tw + FR) / 0.45));
        const seatY = HY - 101 * HS;
        const cx = lerp(HX, 1350, cu);
        const rot = cu * 5.5;
        FX.motionSmear(ctx, cx - 520, seatY - 420, 520, 560, { color: 'rgba(255,255,255,0.7)', angle: 0, n: 16, seed: 31 });
        ctx.save();
        ctx.translate(cx, seatY);
        ctx.rotate(rot);
        ctx.translate(-cx, -seatY);
        chairBack(ctx, cx, seatY + 20, 1.0, 0);
        chairSeat(ctx, cx, seatY + 30, 1.0, 0);
