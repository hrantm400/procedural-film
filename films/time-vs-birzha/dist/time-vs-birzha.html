<script>
// ---- src/scenes/01-vs-intro.js
/*
 * 01 'vs-intro' : the fighting-game VS screen. Global T 0.000 - 1.667 (one bar, 100 frames).
 *
 * Beats (local t): 0 hop-in starts | 0.4167 both land + VS slam + flash + shake |
 *   0.8333 caption "FIGHT FOR THE TOP SPOT" | 1.25 "FIGHT!" + confetti + shake |
 *   1.4667 exit anticipation squash | 1.55 - 1.65 both leap UP out of the top of frame.
 *
 * Layers (back to front):
 *   1 split background: blue (Time) / orange (биржа) halves on a diagonal seam, scrolling stripes, floaties
 *   2 VS burst behind the centre, seam lightning
 *   3 health bars (top) + round timer
 *   4 wordmarks "Time" / "биржа"
 *   5 fighters (motion trails, gloves in guard)
 *   6 VS text, FIGHT! text, caption, confetti
 *   7 white flash
 */
(function () {
  'use strict';
  const ID = 'vs-intro';
  const FILM = window.FILM;

  const BT = 0.41667;
  const T_LAND = BT; // beat 1: land + VS
  const T_CAP = BT * 2; // beat 2: caption
  const T_FIGHT = BT * 3; // beat 3: FIGHT!
  const T_CROUCH = 1.4667; // exit anticipation
  const T_LEAP = 1.55; // leap up
  const LEAP_DUR = 0.1; // fully out of frame by t = 1.65 (last frame)

  const TIME_HOME = [300, 860];
  const BZ_HOME = [780, 1060];
  const S = 1.3;
  const R = 120 * S;

  // seam: x on the diagonal for a given y (steep diagonal through the centre)
  const seamX = (y) => 540 + (960 - y) * 0.32;

  /** fighter pose at time t: { x, y, sx, sy, rot } (y is the centre) */
  function pose(F, t, home, dir, seed) {
    const E = F.E;
    let x = home[0], y = home[1], sx = 1, sy = 1, rot = 0;
    if (t < T_LAND) {
      // hop in from the side: fast travel with an arc, stretched along the motion
      const u = t / T_LAND;
      const k = 1 - Math.pow(1 - u, 1.7);
      x = home[0] - dir * 300 * (1 - k);
      y = home[1] - Math.sin(Math.PI * u) * 150;
      const st = 0.16 * (1 - u * 0.7);
      sx = 1 + st; sy = 1 - st * 0.8;
      rot = dir * 0.18 * (1 - u) - dir * 0.08 * Math.sin(Math.PI * u);
    } else {
      // landing: squash anchored at the feet, slide-settle overshoot
      const age = t - T_LAND;
      const sq = F.squash(t, T_LAND, 0.32, 0.5);
      sx = sq[0]; sy = sq[1];
      x = home[0] + dir * 34 * Math.exp(-age * 9) * Math.sin(age * 22);
      rot = dir * 0.1 * Math.exp(-age * 8) * Math.sin(age * 20);
      // idle bob on the beat (boxer bounce)
      const bob = Math.abs(Math.sin(((t - T_LAND) / BT) * Math.PI)) * 10 * F.clamp(age * 4);
      y = home[1] - bob;
      // small squash on the FIGHT! hit
      const sq2 = F.squash(t, T_FIGHT, 0.14, 0.35);
      sx *= sq2[0]; sy *= sq2[1];
      if (t >= T_CROUCH && t < T_LEAP) {
        const c = F.E.outCubic((t - T_CROUCH) / (T_LEAP - T_CROUCH));
        sx = F.lerp(sx, 1.24, c); sy = F.lerp(sy, 0.72, c);
        rot *= 1 - c;
        y = home[1];
      } else if (t >= T_LEAP) {
        const u = F.clamp((t - T_LEAP) / LEAP_DUR);
        y = home[1] - (home[1] + R * 1.8 + 80) * Math.pow(u, 1.15);
        sx = F.lerp(0.78, 0.7, u); sy = F.lerp(1.35, 1.45, u);
        rot = 0;
      }
      // anchor the squash at the feet
      y += R * (1 - sy);
    }
    return { x, y, sx, sy, rot };
  }

  function drawFighter(F, ctx, who, t, p, o) {
    const dir = who === 'time' ? 1 : -1; // facing direction
    const bounce = Math.sin(t * 15 + (who === 'time' ? 0 : 1.7)) * 6;
    const g1 = [p.x + dir * R * 0.78, p.y + R * 0.38 + bounce];
    const g2 = [p.x + dir * R * 1.18, p.y - R * 0.08 - bounce];
    const gl = dir > 0 ? { l: g1, r: g2 } : { l: g2, r: g1 };
    const common = { x: p.x, y: p.y, s: S, sx: p.sx, sy: p.sy, rot: p.rot, t, gloves: o.noGloves ? null : gl, look: [dir * 0.6, 0.1] };
    if (o.silhouette) common.silhouette = o.silhouette;
    if (o.shadowY != null) common.shadow = o.shadowY;
    if (who === 'time') FILM.cast.time(ctx, Object.assign(common, { face: 'determined', ring: 1 }));
    else FILM.cast.birzha(ctx, Object.assign(common, { face: 'smug' }));
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const F = FILM.fx, P = F.pal, E = F.E, TAU = F.TAU;
      const t = Math.min(Math.max(tIn, 0), info.dur);
      const W = FILM.W, H = FILM.H;

      // camera shake
      const sh = F.shakeMany(t, [[T_LAND, 0.35, 26], [T_FIGHT, 0.4, 30]], 7);
      ctx.save();
      ctx.translate(sh[0], sh[1]);

      // 1 background halves -------------------------------------------------
      const seamTop = seamX(-200), seamBot = seamX(H + 200);
      ctx.save();
      F.poly(ctx, [[-300, -300], [seamTop, -200], [seamBot, H + 200], [-300, H + 300]]);
      ctx.clip();
      F.stripes(ctx, { colorA: '#3b6cff', colorB: '#4a7aff', width: 70, angle: -0.6, offset: -t * 260 });
      ctx.fillStyle = F.radGrad(ctx, 300, 860, 60, 900, [[0, 'rgba(120,220,255,0.55)'], [1, 'rgba(36,72,201,0)']]);
      ctx.fillRect(-200, -200, W + 400, H + 400);
      F.floaties(ctx, { n: 12, seed: 11, t: t + 2, colors: ['#9fd8ff', '#ffffff', '#36c6ff'], alpha: 0.5, speed: 120 });
      ctx.restore();
      ctx.save();
      F.poly(ctx, [[seamTop, -200], [W + 300, -300], [W + 300, H + 300], [seamBot, H + 200]]);
      ctx.clip();
      F.stripes(ctx, { colorA: '#ff6b2c', colorB: '#ff7a3d', width: 70, angle: -0.6, offset: t * 260 });
      ctx.fillStyle = F.radGrad(ctx, 780, 1060, 60, 900, [[0, 'rgba(255,214,90,0.6)'], [1, 'rgba(255,107,44,0)']]);
      ctx.fillRect(-200, -200, W + 400, H + 400);
      F.floaties(ctx, { n: 12, seed: 23, t: t + 5, colors: ['#ffd23f', '#ffffff', '#ff3b5c'], alpha: 0.5, speed: -120 });
      ctx.restore();

      // seam: a bright zigzag band
      const seamGlow = 0.6 + 0.4 * F.beatPulse(t, 0, 0.15);
      ctx.save();
      ctx.fillStyle = `rgba(255,255,255,${0.85 * seamGlow})`;
      const zig = [];
      for (let i = 0; i <= 24; i++) {
        const y = -200 + (i / 24) * (H + 400);
        const off = (i % 2 ? 1 : -1) * 16 * (t >= T_LAND ? 1 : 0.4);
        zig.push([seamX(y) + off, y]);
      }
      ctx.beginPath();
      zig.forEach((p, i) => (i ? ctx.lineTo(p[0] - 14, p[1]) : ctx.moveTo(p[0] - 14, p[1])));
      for (let i = zig.length - 1; i >= 0; i--) ctx.lineTo(zig[i][0] + 14, zig[i][1]);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 2 VS burst behind centre (after the slam) -----------------------------
      const vsK = F.pop(t, T_LAND, 0.22);
      const fightAge = t - T_FIGHT;
      if (vsK > 0) {
        ctx.save();
        ctx.translate(540, 960);
        ctx.rotate(t * 0.6);
        const bs = vsK * (1 + 0.04 * F.beatPulse(t, 0, 0.12));
        ctx.scale(bs, bs);
        F.burst(ctx, 0, 0, 215, 140, 14, P.yellow, { seed: 4 });
        F.burst(ctx, 0, 0, 165, 115, 14, '#ffffff', { seed: 5 });
        ctx.restore();
      }
      F.shockRing(ctx, 540, 960, t - T_LAND, { r: 520, color: '#ffffff', life: 0.45, width: 26 });
      F.shockRing(ctx, 540, 590, t - T_FIGHT, { r: 640, color: P.yellow, life: 0.5, width: 30 });

      // 3 health bars + round timer ------------------------------------------
      const hbDrop = E.outBack(F.clamp((t + 0.05) / 0.3));
      const hbY = 280 - (1 - hbDrop) * 260;
      const fl = F.beatPulse(t, T_LAND, 0.1) * (t >= T_LAND ? 1 : 0);
      F.healthBar(ctx, 96, hbY, 370, 44, 1, { color: P.timeBlue, color2: '#bfe9ff', label: 'TIME', labelColor: '#ffffff' });
      F.healthBar(ctx, 614, hbY, 370, 44, 1, { color: P.bzOrange, color2: '#ffe08a', flip: true, label: 'CHARTS', labelColor: '#ffffff' });
      // round timer badge
      ctx.save();
      ctx.translate(540, hbY + 22);
      const tb = 1 + fl * 0.12;
      ctx.scale(tb, tb);
      F.dropShadow(ctx, (c) => { F.ellipse(c, 0, 0, 58, 58); c.fillStyle = P.ink; c.fill(); }, { dy: 8, blur: 14 });
      F.ellipse(ctx, 0, 0, 48, 48); ctx.fillStyle = P.yellow; ctx.fill();
      F.text(ctx, '99', 0, 3, { size: 46, fill: P.ink, font: 'mono' });
      ctx.restore();

      // 4 wordmarks (slide in with the fighters, stay as name plates) ----------
      const wmK = E.outBack(F.clamp((t - 0.12) / 0.32));
      if (wmK > 0) {
        ctx.save();
        F.text(ctx, 'Time', 300 - (1 - wmK) * 500, 1098 + 6, { size: 92, fill: 'rgba(20,30,90,0.35)', letter: -2 });
        FILM.cast.wordmark(ctx, 'time', 300 - (1 - wmK) * 500, 1098, 92, { color: '#ffffff' });
        F.text(ctx, 'Charts', 770 + (1 - wmK) * 500, 1300 + 6, { size: 92, fill: 'rgba(120,30,10,0.35)', letter: -2 });
        FILM.cast.wordmark(ctx, 'birzha', 770 + (1 - wmK) * 500, 1300, 92, { color: '#ffffff' });
        ctx.restore();
      }

      // 5 fighters ----------------------------------------------------------
      const pt = pose(F, t, TIME_HOME, 1, 1);
      const pb = pose(F, t, BZ_HOME, -1, 2);
      const trailing = t < T_LAND || t >= T_LEAP;
      if (trailing) {
        [['time', TIME_HOME, 1, '#bfe2ff'], ['birzha', BZ_HOME, -1, '#ffe0a0']].forEach(([who, home, dir, c]) => {
          const pos = [];
          for (let k = 4; k >= 1; k--) {
            const tt = t - k * 0.022;
            if (tt < 0 || (t >= T_LEAP && tt < T_LEAP)) continue;
            pos.push(pose(F, tt, home, dir, 0));
          }
          pos.forEach((q, i) => {
            ctx.save();
            ctx.globalAlpha *= ((i + 1) / (pos.length + 1)) * 0.55;
            drawFighter(F, ctx, who, t, q, { silhouette: c, noGloves: true });
            ctx.restore();
          });
        });
      }
      const shadowOn = t < T_LEAP;
      drawFighter(F, ctx, 'birzha', t, pb, { shadowY: shadowOn ? BZ_HOME[1] + R * 1.02 : null });
      drawFighter(F, ctx, 'time', t, pt, { shadowY: shadowOn ? TIME_HOME[1] + R * 1.02 : null });
      // landing puffs
      F.puffs(ctx, TIME_HOME[0], TIME_HOME[1] + R, t - T_LAND, { n: 6, seed: 3, size: 46, spread: 170, color: '#dff1ff' });
      F.puffs(ctx, BZ_HOME[0], BZ_HOME[1] + R, t - T_LAND, { n: 6, seed: 4, size: 46, spread: 170, color: '#fff0d0' });
      // crouch / leap puffs
      F.puffs(ctx, TIME_HOME[0], TIME_HOME[1] + R, t - T_LEAP, { n: 7, seed: 8, size: 54, spread: 200, color: '#ffffff' });
      F.puffs(ctx, BZ_HOME[0], BZ_HOME[1] + R, t - T_LEAP, { n: 7, seed: 9, size: 54, spread: 200, color: '#ffffff' });
      if (t >= T_LEAP) {
        F.speedLines(ctx, { angle: -Math.PI / 2, count: 18, color: '#ffffff', alpha: 0.75, seed: 31, x: 120, y: -100, w: 360, h: 1200, len: 420, width: 8, t, speed: 5000 });
        F.speedLines(ctx, { angle: -Math.PI / 2, count: 18, color: '#ffffff', alpha: 0.75, seed: 32, x: 600, y: -100, w: 360, h: 1400, len: 420, width: 8, t, speed: 5000 });
      }

      // 6 VS / FIGHT! / caption ------------------------------------------------
      if (t >= T_LAND - 1e-6) {
        // VS slams in from huge, then gets punched away by FIGHT!
        const age = t - T_LAND;
        let sc = age < 0.1 ? F.lerp(3.2, 0.86, E.inQuad(age / 0.1)) : 0.86 + 0.14 * F.spring(age - 0.1, 2.4, 6);
        let a = 1, rot = -0.08;
        if (fightAge >= 0) {
          // FIGHT! hits: VS gets a punchy re-slam
          const sq = F.squash(t, T_FIGHT, 0.22, 0.4);
          sc *= sq[0];
        }
        if (a > 0.01) {
          sc *= 1 + 0.05 * F.beatPulse(t, 0, 0.1);
          F.text(ctx, 'VS', 540 + 8, 960 + 14, { size: 220, fill: 'rgba(27,21,48,0.35)', scale: sc, rot, alpha: a, letter: -10 });
          F.text(ctx, 'VS', 540, 960, { size: 220, fill: P.yellow, stroke: P.bzRed, lw: 14, scale: sc, rot, alpha: a, letter: -10 });
        }
      }
      if (fightAge >= -1e-6) {
        F.confettiBurst(ctx, 540, 600, fightAge, { n: 60, seed: 77, power: 1500, spread: Math.PI * 0.95, size: 22, life: 1.2 });
        const k = F.popIn(t, T_FIGHT, 0.4);
        const wob = Math.sin(fightAge * 18) * 0.03 * Math.exp(-fightAge * 4);
        const sc = (0.3 + 0.7 * k) * (1 + 0.04 * F.beatPulse(t, 0, 0.1));
        if (k > 0.001) {
          F.text(ctx, 'FIGHT!', 540 + 10, 590 + 16, { size: 170, fill: 'rgba(27,21,48,0.4)', scale: sc, rot: -0.06 + wob, letter: -4 });
          F.text(ctx, 'FIGHT!', 540, 590, { size: 170, fill: '#ffffff', stroke: P.bzRed, lw: 12, scale: sc, rot: -0.06 + wob, letter: -4 });
        }
      }
      if (t >= T_CAP - 1e-6) {
        // caption on a dark ribbon
        const rk = E.outBack(F.clamp((t - T_CAP + 1 / 60) / 0.2));
        const cap = 'FIGHT FOR THE TOP SPOT';
        let size = 64;
        const mw = F.measure(ctx, cap, size) + cap.length * 1;
        if (mw > 820) size = Math.floor(size * 820 / mw);
        ctx.save();
        ctx.translate(540, 1420);
        ctx.rotate(-0.03);
        ctx.scale(rk, 1);
        F.dropShadow(ctx, (c) => { F.rrect(c, -450, -62, 900, 124, 62); c.fillStyle = P.ink; c.fill(); }, { dy: 12, blur: 20 });
        ctx.restore();
        ctx.save();
        ctx.translate(540, 1420);
        ctx.rotate(-0.03);
        F.popLetters(ctx, cap, 0, 2, t, T_CAP + 0.03, { size, stagger: 0.012, dur: 0.35, colors: ['#ffffff', '#ffffff', P.yellow], letter: 1 });
        ctx.restore();
      }

      ctx.restore(); // shake

      // 7 white flash on the VS slam (and a lighter one on FIGHT!)
      const fA = t >= T_LAND ? Math.max(0, 1 - (t - T_LAND) / 0.14) * 0.9 : 0;
      const fB = fightAge >= 0 ? Math.max(0, 1 - fightAge / 0.1) * 0.5 : 0;
      const fa = Math.max(fA, fB);
      if (fa > 0.003) {
        ctx.save();
        ctx.globalAlpha = fa;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-200, -200, W + 400, H + 400);
        ctx.restore();
      }
      // first frame flash (downbeat whoosh)
      if (t < 0.08) {
        ctx.save();
        ctx.globalAlpha = (1 - t / 0.08) * 0.3;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-200, -200, W + 400, H + 400);
        ctx.restore();
      }
      void TAU;
    },
  });
})();

</script>
<script>
// ---- src/scenes/02-home-screen.js
/*
 * 02 'home-screen' : Round 1, the fight for the top-left home-screen slot. Global T 1.667 - 3.333.
 *
 * Beats (local t):
 *   0      Time and биржа drop in from the top (continuing their leap out of shot 01)
 *   0.4167 both land next to the empty glowing slot, squash + puffs
 *   0.66   биржа crouches (anticipation)  0.75 dashes
 *   0.8333 биржа body-checks Time aside (Time knocked down, dizzy), hops into the slot by 0.92, "99+"
 *   1.05   Time winds up  1.25 glove punch: биржа knocked up-left spinning, Time hops into the slot
 *   1.40   биржа dives back  1.4583 kicks Time out: Time flies to the RIGHT spinning (trail, puffs),
 *          out of frame at y ~900 by the end; биржа lands back in the slot laughing.
 *
 * Layers (back to front):
 *   1 lilac background, dot grid, floaties
 *   2 phone: wallpaper, status bar, "#1" pill, glowing empty slot, 4x5 jiggling app icons, dock
 *   3 "ROUND 1" corner sticker
 *   4 fighters (+ trails, puffs, impact bursts, badges)
 */
(function () {
  'use strict';
  const ID = 'home-screen';
  const FILM = window.FILM;

  const BT = 0.41667;
  const T_LAND = BT;
  const T_CROUCH = 0.66;
  const T_DASH = 0.75;
  const T_CHECK = BT * 2; // 0.8333
  const T_INSLOT = 0.92;
  const T_WIND = 1.04;
  const T_JAB = 1.19;
  const T_PUNCH = BT * 3; // 1.25
  const T_TIMESLOT = 1.36;
  const T_APEX = 1.39;
  const T_KICK = BT * 3.5; // 1.4583 (8th note)
  const T_BZBACK = 1.56;

  // phone + grid geometry (world coords)
  const PH = { cx: 540, cy: 1000, w: 900, h: 1500 };
  const BEZ = PH.w * 0.04;
  const SX = PH.cx - PH.w / 2 + BEZ, SY = PH.cy - PH.h / 2 + BEZ; // screen top-left (126, 286)
  const SW = PH.w - BEZ * 2;
  const COLW = SW / 4;
  const ROW0 = 262, ROWH = 208, ICON = 148;
  const cellLocal = (c, r) => [COLW * (c + 0.5), ROW0 + r * ROWH];
  const SLOT = [SX + COLW * 0.5, SY + ROW0]; // (229.5, 548)

  const S0 = 0.62;
  const R0 = 120 * S0;
  const TIME_LAND = [442, SLOT[1]];
  const BZ_LAND = [652, SLOT[1]];
  const TIME_KO = [404, 786];
  const BZ_APEX = [150, 318];
  const BZ_KICK = [118, 432];
  const EXIT = [1250, 975]; // with the camera zoom Time crosses the right frame edge at screen y ~900
  const CAM = [300, 640];

  // generic app icons (no real brands): colour pair, glyph id, label
  const APPS = [
    null,
    ['#5ac8fa', '#2f80ed', 'mail', 'Mail'],
    ['#ffd23f', '#ff9f1c', 'sun', 'Weather'],
    ['#7b5cff', '#5136d6', 'note', 'Music'],
    ['#22c977', '#119c5a', 'chat', 'Chat'],
    ['#ff6fb5', '#e0408f', 'heart', 'Health'],
    ['#8e9aaf', '#5d6880', 'gear', 'Settings'],
    ['#ff8a3d', '#ef5d1a', 'cam', 'Camera'],
    ['#36c6ff', '#1f9fe0', 'pin', 'Maps'],
    ['#ff4d5e', '#d62839', 'play', 'Video'],
    ['#ffffff', '#e8e8f0', 'cal', 'Calendar'],
    ['#4cd3a5', '#1fa77a', 'phone', 'Phone'],
    ['#ffc53d', '#f39a1c', 'star', 'Stars'],
    ['#b48cff', '#7b5cff', 'cloud', 'Cloud'],
    ['#2a3366', '#141a33', 'bell', 'Alerts'],
    ['#ff9f43', '#ff6b2c', 'cart', 'Shop'],
    ['#4a7aff', '#2448c9', 'folder', 'Files'],
    ['#fff3c4', '#ffd23f', 'pencil', 'Notes'],
    ['#5cea7a', '#22c977', 'game', 'Games'],
    ['#ff6fb5', '#7b5cff', 'photo', 'Photos'],
  ];
  const DOCK = [['#22c977', '#119c5a', 'phone'], ['#5ac8fa', '#2f80ed', 'chat'], ['#ff8a3d', '#ef5d1a', 'cam'], ['#7b5cff', '#5136d6', 'note']];

  function glyph(F, ctx, kind, s) {
    const P = F.pal;
    const k = s / 148;
    ctx.save();
    ctx.scale(k, k);
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#ffffff';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 9;
    switch (kind) {
      case 'mail': F.rrect(ctx, -40, -28, 80, 56, 10); ctx.fill(); ctx.strokeStyle = '#2f80ed'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-34, -20); ctx.lineTo(0, 6); ctx.lineTo(34, -20); ctx.stroke(); break;
      case 'sun': ctx.beginPath(); ctx.arc(0, 0, 22, 0, F.TAU); ctx.fill(); for (let i = 0; i < 8; i++) { const a = (i / 8) * F.TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 32, Math.sin(a) * 32); ctx.lineTo(Math.cos(a) * 44, Math.sin(a) * 44); ctx.stroke(); } break;
      case 'note': ctx.beginPath(); ctx.arc(-16, 24, 14, 0, F.TAU); ctx.fill(); ctx.beginPath(); ctx.arc(24, 14, 14, 0, F.TAU); ctx.fill(); ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-4, 24); ctx.lineTo(-4, -32); ctx.lineTo(36, -42); ctx.lineTo(36, 14); ctx.stroke(); break;
      case 'chat': F.ellipse(ctx, 0, -4, 42, 32); ctx.fill(); F.poly(ctx, [[-22, 18], [-30, 40], [-2, 24]]); ctx.fill(); break;
      case 'heart': ctx.beginPath(); ctx.moveTo(0, 36); ctx.bezierCurveTo(-60, -4, -26, -50, 0, -18); ctx.bezierCurveTo(26, -50, 60, -4, 0, 36); ctx.fill(); break;
      case 'gear': ctx.beginPath(); for (let i = 0; i < 16; i++) { const a = (i / 16) * F.TAU; const r = i % 2 ? 30 : 42; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); ctx.fillStyle = '#5d6880'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, F.TAU); ctx.fill(); break;
      case 'cam': F.rrect(ctx, -42, -24, 84, 56, 12); ctx.fill(); F.rrect(ctx, -16, -36, 32, 16, 5); ctx.fill(); ctx.fillStyle = '#ef5d1a'; ctx.beginPath(); ctx.arc(0, 4, 17, 0, F.TAU); ctx.fill(); break;
      case 'pin': ctx.beginPath(); ctx.arc(0, -10, 28, Math.PI * 0.85, Math.PI * 2.15); ctx.lineTo(0, 40); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#1f9fe0'; ctx.beginPath(); ctx.arc(0, -10, 11, 0, F.TAU); ctx.fill(); break;
      case 'play': F.poly(ctx, [[-18, -30], [32, 0], [-18, 30]]); ctx.fill(); break;
      case 'cal': ctx.fillStyle = '#ff4d5e'; F.rrect(ctx, -40, -40, 80, 26, 8); ctx.fill(); ctx.fillStyle = '#1b1530'; F.text(ctx, '17', 0, 14, { size: 46, fill: '#1b1530' }); break;
      case 'phone': ctx.rotate(-0.6); F.rrect(ctx, -12, -36, 24, 72, 12); ctx.fill(); F.rrect(ctx, -22, -40, 34, 20, 8); ctx.fill(); F.rrect(ctx, -22, 20, 34, 20, 8); ctx.fill(); break;
      case 'star': F.star(ctx, 0, 2, 42, 18, 5); ctx.fill(); break;
      case 'cloud': ctx.beginPath(); ctx.arc(-18, 6, 20, 0, F.TAU); ctx.arc(8, -6, 26, 0, F.TAU); ctx.arc(28, 10, 16, 0, F.TAU); ctx.fill(); F.rrect(ctx, -38, 6, 82, 22, 11); ctx.fill(); break;
      case 'bell': ctx.fillStyle = P.yellow; ctx.beginPath(); ctx.moveTo(-32, 22); ctx.quadraticCurveTo(-24, 14, -24, -6); ctx.arc(0, -6, 24, Math.PI, 0); ctx.quadraticCurveTo(24, 14, 32, 22); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(0, 30, 9, 0, F.TAU); ctx.fill(); break;
      case 'cart': ctx.beginPath(); ctx.moveTo(-42, -28); ctx.lineTo(-28, -28); ctx.lineTo(-18, 14); ctx.lineTo(30, 14); ctx.lineTo(38, -16); ctx.lineTo(-24, -16); ctx.stroke(); ctx.beginPath(); ctx.arc(-12, 30, 8, 0, F.TAU); ctx.arc(24, 30, 8, 0, F.TAU); ctx.fill(); break;
      case 'folder': F.rrect(ctx, -42, -30, 36, 20, 6); ctx.fill(); F.rrect(ctx, -42, -20, 84, 54, 10); ctx.fill(); break;
      case 'pencil': ctx.rotate(0.7); ctx.fillStyle = '#ff8a3d'; F.rrect(ctx, -10, -40, 20, 60, 4); ctx.fill(); ctx.fillStyle = '#1b1530'; F.poly(ctx, [[-10, 20], [10, 20], [0, 40]]); ctx.fill(); break;
      case 'game': F.rrect(ctx, -44, -20, 88, 44, 22); ctx.fill(); ctx.fillStyle = '#22c977'; ctx.fillRect(-30, -2, 22, 7); ctx.fillRect(-22.5, -10, 7, 22); ctx.beginPath(); ctx.arc(20, -4, 6, 0, F.TAU); ctx.arc(30, 8, 6, 0, F.TAU); ctx.fill(); break;
      case 'photo': for (let i = 0; i < 6; i++) { ctx.save(); ctx.rotate((i / 6) * F.TAU); ctx.globalAlpha = 0.85; ctx.fillStyle = ['#ffd23f', '#ff8a3d', '#ff4d5e', '#7b5cff', '#36c6ff', '#22c977'][i]; F.ellipse(ctx, 0, -20, 14, 24); ctx.fill(); ctx.restore(); } break;
      default: break;
    }
    ctx.restore();
  }

  // flat app icon with a cheap flat contact shadow (no canvas blur: 23 icons per frame)
  function drawIcon(F, c, app, size, minus) {
    F.squircle(c, 0, 7, size / 2, 0.46);
    c.fillStyle = 'rgba(60,30,120,0.18)';
    c.fill();
    F.appIcon(c, 0, 0, size, { bg: app[0], bg2: app[1], glyph: (cc, s) => glyph(F, cc, app[2], s) });
    if (minus) {
      c.fillStyle = 'rgba(80,80,100,0.85)';
      c.beginPath(); c.arc(-size / 2 + 6, -size / 2 + 6, 17, 0, F.TAU); c.fill();
      c.fillStyle = '#ffffff'; c.fillRect(-size / 2 - 3, -size / 2 + 4, 18, 4);
    }
  }

  // ------------------------------------------------------------------ poses
  function timePose(F, t) {
    const E = F.E;
    let x = TIME_LAND[0], y = TIME_LAND[1], sx = 1, sy = 1, rot = 0, s = S0, face = 'determined', look = [-0.6, 0];
    let glove = null; // override for the right-hand punch
    let spin = 0;
    if (t < T_LAND) {
      const u = t / T_LAND;
      y = F.lerp(-40, TIME_LAND[1], E.inQuad(u));
      sx = 1 - 0.16 * u; sy = 1 + 0.24 * u;
      face = 'shocked'; look = [0, 1];
      rot = 0.1 * Math.sin(u * 6);
    } else if (t < T_CHECK) {
      const sq = F.squash(t, T_LAND, 0.34, 0.45);
      sx = sq[0]; sy = sq[1];
      y = TIME_LAND[1] + R0 * (1 - sy);
      look = t > 0.7 ? [0.8, 0] : [-0.8, -0.3];
      face = t > 0.72 ? 'shocked' : 'determined';
    } else if (t < T_WIND) {
      // knocked down and aside
      const u = F.clamp((t - T_CHECK) / 0.14);
      const k = E.outCubic(u);
      x = F.lerp(TIME_LAND[0], TIME_KO[0], k);
      y = F.lerp(TIME_LAND[1], TIME_KO[1], k) - Math.sin(Math.PI * u) * 40;
      rot = -1.2 * (1 - u) * u * 4 * 0.5 + (u >= 1 ? -0.25 * Math.exp(-(t - T_CHECK - 0.14) * 10) * Math.cos((t - T_CHECK) * 30) : 0);
      const sq = F.squash(t, T_CHECK + 0.14, 0.3, 0.4);
      sx = u < 1 ? 0.8 : sq[0]; sy = u < 1 ? 1.2 : sq[1];
      if (u >= 1) y += R0 * (1 - sy);
      face = 'hurt'; look = [-0.5, -0.5];
    } else if (t < T_PUNCH) {
      // wind up then jab
      face = 'angry'; look = [-0.8, -0.6];
      if (t < T_JAB) {
        const u = E.outCubic((t - T_WIND) / (T_JAB - T_WIND));
        x = TIME_KO[0] + 22 * u; y = TIME_KO[1] + 6 * u;
        rot = 0.22 * u; sx = 1 + 0.12 * u; sy = 1 - 0.1 * u;
        y += R0 * (1 - sy);
        glove = [x + R0 * 1.0, y + R0 * 0.2];
      } else {
        const u = E.inQuad((t - T_JAB) / (T_PUNCH - T_JAB));
        x = F.lerp(TIME_KO[0] + 22, TIME_KO[0] - 30, u); y = F.lerp(TIME_KO[1] + 6, TIME_KO[1] - 30, u);
        rot = F.lerp(0.22, -0.3, u); sx = F.lerp(1.12, 0.86, u); sy = F.lerp(0.9, 1.14, u);
        glove = [F.lerp(x + R0, SLOT[0] + R0 * 0.7, u), F.lerp(y + R0 * 0.2, SLOT[1] + R0 * 0.75, u)];
      }
    } else if (t < T_TIMESLOT) {
      // glove connects, then Time hops into the slot
      const u = (t - T_PUNCH) / (T_TIMESLOT - T_PUNCH);
      const k = E.inOutCubic(u);
      const x0 = TIME_KO[0] - 30, y0 = TIME_KO[1] - 30;
      x = F.lerp(x0, SLOT[0], k); y = F.lerp(y0, SLOT[1], k) - Math.sin(Math.PI * u) * 110;
      rot = F.lerp(-0.3, 0, k); sx = 0.88; sy = 1.14;
      face = 'angry'; look = [-0.6, -0.6];
      glove = u < 0.35 ? [SLOT[0] + R0 * 0.7, SLOT[1] + R0 * 0.75] : null;
    } else if (t < T_KICK) {
      const sq = F.squash(t, T_TIMESLOT, 0.3, 0.3);
      x = SLOT[0]; sx = sq[0]; sy = sq[1];
      y = SLOT[1] + R0 * (1 - sy);
      face = 'happy'; look = [0.4, 0];
      if (t > T_KICK - 0.05) { face = 'shocked'; look = [-0.9, -0.9]; }
    } else {
      // kicked out to the right edge, spinning
      const u = (t - T_KICK) / (EXIT[0] - SLOT[0]) * 1000 / 1.0;
      const v = F.clamp((t - T_KICK) / 0.205);
      const k = 1 - Math.pow(1 - v, 1.6);
      x = F.lerp(SLOT[0], EXIT[0], k);
      y = F.lerp(SLOT[1], EXIT[1], k) - Math.sin(Math.PI * k) * 30;
      rot = (t - T_KICK) * 26;
      s = F.lerp(S0, 0.9, k);
      const st = 0.22 * (1 - v * 0.5);
      sx = 1 + st; sy = 1 - st;
      face = 'shocked'; spin = (t - T_KICK) * 30;
      void u;
    }
    return { x, y, sx, sy, rot, s, face, look, glove, spin };
  }

  function bzPose(F, t) {
    const E = F.E;
    let x = BZ_LAND[0], y = BZ_LAND[1], sx = 1, sy = 1, rot = 0, face = 'smug', look = [-0.6, 0], greedy = false, jaw = 0;
    let kick = null;
    if (t < T_LAND) {
      const u = t / T_LAND;
      y = F.lerp(-70, BZ_LAND[1], E.inQuad(u));
      sx = 1 - 0.18 * u; sy = 1 + 0.26 * u;
      face = 'laugh'; jaw = 0.3; rot = -0.1 * Math.sin(u * 5);
    } else if (t < T_CROUCH) {
      const sq = F.squash(t, T_LAND, 0.36, 0.45);
      sx = sq[0]; sy = sq[1];
      y = BZ_LAND[1] + R0 * (1 - sy);
      look = [-1, 0];
    } else if (t < T_DASH) {
      const u = E.outCubic((t - T_CROUCH) / (T_DASH - T_CROUCH));
      sx = 1 + 0.22 * u; sy = 1 - 0.2 * u;
      x = BZ_LAND[0] + 26 * u; rot = 0.16 * u;
      y = BZ_LAND[1] + R0 * (1 - sy);
      face = 'angry'; look = [-1, 0];
    } else if (t < T_CHECK) {
      const u = E.inQuad((t - T_DASH) / (T_CHECK - T_DASH));
      x = F.lerp(BZ_LAND[0] + 26, TIME_LAND[0] + R0 * 1.55, u);
      sx = 1.3; sy = 0.82; rot = F.lerp(0.16, -0.18, u);
      y = BZ_LAND[1] + R0 * (1 - sy);
      face = 'angry'; look = [-1, 0];
    } else if (t < T_INSLOT) {
      // continue through, hop into the slot
      const u = (t - T_CHECK) / (T_INSLOT - T_CHECK);
      const k = E.outQuad(u);
      x = F.lerp(TIME_LAND[0] + R0 * 1.55, SLOT[0], k);
      y = SLOT[1] - Math.sin(Math.PI * u) * 70;
      sx = F.lerp(1.2, 0.9, u); sy = F.lerp(0.86, 1.12, u); rot = F.lerp(-0.18, 0, u);
      face = 'laugh'; jaw = 0.5;
    } else if (t < T_PUNCH) {
      const sq = F.squash(t, T_INSLOT, 0.32, 0.35);
      x = SLOT[0]; sx = sq[0]; sy = sq[1];
      y = SLOT[1] + R0 * (1 - sy);
      face = 'laugh'; greedy = true; jaw = 0.35 + 0.25 * Math.abs(Math.sin((t - T_INSLOT) * 14));
      look = [0.6, 0.6];
      if (t > T_JAB) { face = 'shocked'; greedy = false; jaw = 0.6; }
    } else if (t < T_APEX) {
      // punched up-left, spinning
      const u = (t - T_PUNCH) / (T_APEX - T_PUNCH);
      const k = E.outQuad(u);
      x = F.lerp(SLOT[0], BZ_APEX[0], k); y = F.lerp(SLOT[1], BZ_APEX[1], k);
      rot = -k * Math.PI * 2.2;
      sx = 1.1; sy = 0.9;
      face = 'dizzy';
    } else if (t < T_KICK) {
      // dive at Time, glove out like a kick
      const u = E.inQuad((t - T_APEX) / (T_KICK - T_APEX));
      x = F.lerp(BZ_APEX[0], BZ_KICK[0], u); y = F.lerp(BZ_APEX[1], BZ_KICK[1], u);
      rot = F.lerp(-Math.PI * 2.2, -Math.PI * 2 + 0.35, u);
      sx = 0.86; sy = 1.16;
      face = 'angry'; look = [1, 1];
      kick = [F.lerp(x + R0 * 0.9, SLOT[0] - R0 * 0.55, u), F.lerp(y + R0 * 0.9, SLOT[1] - R0 * 0.35, u)];
    } else if (t < T_BZBACK) {
      const u = (t - T_KICK) / (T_BZBACK - T_KICK);
      const k = E.inOutQuad(u);
      x = F.lerp(BZ_KICK[0], SLOT[0], k); y = F.lerp(BZ_KICK[1], SLOT[1], k) - Math.sin(Math.PI * u) * 40;
      rot = 0.35 * (1 - k);
      face = 'laugh'; jaw = 0.5; look = [1, 0.4];
      kick = u < 0.4 ? [x + R0 * 1.3, y + R0 * 0.6] : null;
    } else {
      const sq = F.squash(t, T_BZBACK, 0.34, 0.35);
      x = SLOT[0]; sx = sq[0]; sy = sq[1];
      y = SLOT[1] + R0 * (1 - sy);
      face = 'laugh'; greedy = true; jaw = 0.35 + 0.3 * Math.abs(Math.sin((t - T_BZBACK) * 16)); look = [1, 0.3];
    }
    return { x, y, sx, sy, rot, face, look, greedy, jaw, kick };
  }

  function guard(p, dir, R, t, seed) {
    const b = Math.sin(t * 14 + seed) * 4;
    const a = [p.x + dir * R * 0.8, p.y + R * 0.42 + b];
    const c = [p.x + dir * R * 1.18, p.y - R * 0.05 - b];
    return dir > 0 ? { l: a, r: c } : { l: c, r: a };
  }

  function drawTime(F, ctx, p, t, o = {}) {
    const R = 120 * p.s;
    let gloves = guard(p, -1, R, t, 0);
    if (p.glove) gloves = { l: p.glove, r: [p.x + R * 0.9, p.y + R * 0.2] };
    if (p.spin) gloves = { l: [p.x - R * 1.1, p.y + R * 0.5], r: [p.x + R * 1.1, p.y - R * 0.4] };
    FILM.cast.time(ctx, {
      x: p.x, y: p.y, s: p.s, sx: p.sx, sy: p.sy, rot: p.rot, t, face: p.face, look: p.look, ring: 1,
      gloves: o.silhouette ? null : gloves, spin: p.spin, silhouette: o.silhouette, shadow: o.shadow,
    });
  }
  function drawBz(F, ctx, p, t, o = {}) {
    let gloves = guard(p, 1, R0, t, 2);
    if (p.kick) gloves = { r: p.kick, l: [p.x - R0 * 0.9, p.y - R0 * 0.2] };
    if (p.face === 'dizzy') gloves = { l: [p.x - R0 * 1.2, p.y - R0 * 0.5], r: [p.x + R0 * 1.2, p.y + R0 * 0.4] };
    if (p.greedy) gloves = { l: [p.x - R0 * 1.05, p.y - R0 * 0.7], r: [p.x + R0 * 1.05, p.y - R0 * 0.7] }; // victory arms
    return FILM.cast.birzha(ctx, {
      x: p.x, y: p.y, s: S0, sx: p.sx, sy: p.sy, rot: p.rot, t, face: p.face, look: p.look, greedy: p.greedy, jaw: p.jaw,
      gloves: o.silhouette ? null : gloves, silhouette: o.silhouette, shadow: o.shadow,
    });
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const F = FILM.fx, P = F.pal, E = F.E, TAU = F.TAU;
      const t = Math.min(Math.max(tIn, 0), info.dur);
      const W = FILM.W, H = FILM.H;

      const sh = F.shakeMany(t, [[T_LAND, 0.2, 10], [T_CHECK, 0.25, 18], [T_PUNCH, 0.28, 22], [T_KICK, 0.3, 24]], 21);

      // 1 background ---------------------------------------------------------
      F.bgFill(ctx, ['#efe9ff', '#e2d9ff']);
      F.dotGrid(ctx, { step: 58, r: 4, color: 'rgba(123,92,255,0.12)', oy: t * 30 });
      F.floaties(ctx, { n: 16, seed: 202, t: t + 3, colors: [P.purple, P.pink, P.yellow, P.timeCyan, P.bzOrange], size: 30, speed: 50, alpha: 0.7 });

      ctx.save();
      ctx.translate(sh[0], sh[1]);
      // camera: slow push-in on the fight corner plus zoom kicks on the hits
      const kick = (t0, a) => (t >= t0 ? a * Math.exp(-(t - t0) * 10) : 0);
      const z = 1 + 0.1 * E.inOutSine(t / info.dur) + kick(T_CHECK, 0.025) + kick(T_PUNCH, 0.03) + kick(T_KICK, 0.035);
      ctx.translate(CAM[0], CAM[1]);
      ctx.scale(z, z);
      ctx.translate(-CAM[0], -CAM[1]);

      // 2 phone ------------------------------------------------------------
      // the phone itself bumps a little on the hits
      const bump = (F.squash(t, T_CHECK, 0.012, 0.35)[1] - 1) + (F.squash(t, T_PUNCH, 0.014, 0.35)[1] - 1) + (F.squash(t, T_KICK, 0.016, 0.4)[1] - 1);
      const tilt = F.wobble(t, 0.5, 0.008, 3) + bump * 0.6;
      // soft phone shadow, faked with stacked translucent shapes (a blurred full-size shadow is too slow)
      ctx.save();
      ctx.translate(PH.cx, PH.cy); ctx.rotate(tilt); ctx.translate(-PH.cx, -PH.cy);
      ctx.fillStyle = 'rgba(70,40,150,0.06)';
      for (let k = 0; k < 4; k++) {
        const g = 10 + k * 12;
        F.rrect(ctx, PH.cx - PH.w / 2 - g + 6, PH.cy - PH.h / 2 - g + 34, PH.w + g * 2 - 12, PH.h + g * 2, PH.w * 0.15 + g);
        ctx.fill();
      }
      ctx.restore();
      F.phone(ctx, PH.cx, PH.cy, PH.w, PH.h, {
        rot: tilt, shadow: false,
        screenBg: '#b9a6ff',
        screen: (c, sw, sh2) => {
          // wallpaper
          c.fillStyle = F.linGrad(c, 0, 0, sw, sh2, ['#9f8bff', '#c7a6ff', '#ffb4cf']);
          c.fillRect(0, 0, sw, sh2);
          c.fillStyle = 'rgba(255,255,255,0.16)';
          F.ellipse(c, sw * 0.85, sh2 * 0.2 + Math.sin(t * 1.3) * 10, 260, 260); c.fill();
          F.ellipse(c, sw * 0.1, sh2 * 0.78, 300, 300); c.fill();
          c.fillStyle = 'rgba(255,214,90,0.25)';
          F.ellipse(c, sw * 0.6, sh2 * 0.62 + Math.cos(t * 1.1) * 12, 180, 180); c.fill();
          F.statusBar(c, sw, { time: '9:41', color: '#ffffff' });

          // slot glow + "#1" pill
          const [lx, ly] = cellLocal(0, 0);
          const pulse = 0.5 + 0.5 * Math.sin(t * 9);
          c.fillStyle = F.radGrad(c, lx, ly, 20, 150, [[0, `rgba(255,236,140,${0.75 + 0.2 * pulse})`], [1, 'rgba(255,236,140,0)']]);
          c.fillRect(lx - 160, ly - 160, 320, 320);
          const occupied = (t >= T_INSLOT - 0.03 && t < T_PUNCH + 0.04) || (t >= T_TIMESLOT - 0.03 && t < T_KICK + 0.04) || t >= T_BZBACK - 0.03;
          if (!occupied) {
            c.save();
            F.squircle(c, lx, ly, ICON / 2 + 2 * pulse, 0.46);
            c.fillStyle = 'rgba(255,255,255,0.22)'; c.fill();
            c.setLineDash([16, 12]); c.lineDashOffset = -t * 60;
            c.lineWidth = 6; c.strokeStyle = '#ffffff'; c.stroke();
            c.restore();
            F.text(c, '+', lx, ly + 2, { size: 70, fill: 'rgba(255,255,255,0.9)' });
          }
          const pk = F.pop(t, 0.05, 0.3) * (1 + 0.08 * F.beatPulse(t, 0, 0.12));
          c.save();
          c.translate(lx, ly - ICON / 2 - 44);
          c.scale(pk, pk);
          c.rotate(-0.06 + Math.sin(t * 5) * 0.04);
          F.dropShadow(c, (cc) => { F.label(cc, '#1', 0, 0, { size: 36, bg: P.yellow, color: P.ink }); }, { dy: 6, blur: 10 });
          c.restore();

          // icons (jiggle / edit mode)
          for (let r = 0; r < 5; r++) {
            for (let col = 0; col < 4; col++) {
              const i = r * 4 + col;
              const app = APPS[i];
              if (!app) continue;
              const [ix, iy] = cellLocal(col, r);
              // a shove ripple: icons near the hits hop
              let hop = 0;
              [[T_LAND, 442, 548], [T_CHECK + 0.14, TIME_KO[0], TIME_KO[1]], [T_PUNCH, SLOT[0], SLOT[1]], [T_KICK, SLOT[0], SLOT[1]]].forEach(([th, hx, hy]) => {
                const d = Math.hypot(SX + ix - hx, SY + iy - hy);
                const age = t - th - d / 2600;
                if (age > 0 && age < 0.3) hop += Math.sin((age / 0.3) * Math.PI) * 26 * Math.max(0, 1 - d / 700);
              });
              const jig = Math.sin(t * TAU * 4.2 + F.h01('jg', i) * TAU) * 0.045;
              c.save();
              c.translate(ix, iy - hop);
              c.rotate(jig);
              drawIcon(F, c, app, ICON, true);
              c.restore();
            }
          }
          // dock
          const dy = cellLocal(0, 4)[1] + 200;
          c.fillStyle = 'rgba(255,255,255,0.3)';
          F.rrect(c, 24, dy - 92, sw - 48, 184, 56); c.fill();
          DOCK.forEach((d, k) => {
            const [ix] = cellLocal(k, 0);
            const jig = Math.sin(t * TAU * 4.2 + F.h01('jd', k) * TAU) * 0.045;
            c.save(); c.translate(ix, dy); c.rotate(jig);
            drawIcon(F, c, d, ICON * 0.92, false);
            c.restore();
          });
        },
      });

      // 4 fighters -----------------------------------------------------------
      const tp = timePose(F, t);
      const bp = bzPose(F, t);

      // drop trails (entry) and kick trail (exit)
      const ghost = (fn, poseFn, from, color, dt) => {
        for (let k = 4; k >= 1; k--) {
          const tt = t - k * dt;
          if (tt < from) continue;
          ctx.save();
          ctx.globalAlpha *= (1 - k / 5) * 0.55;
          fn(F, ctx, poseFn(F, tt), t, { silhouette: color });
          ctx.restore();
        }
      };
      if (t < T_LAND) {
        ghost(drawTime, timePose, 0, '#ffffff', 0.025);
        ghost(drawBz, bzPose, 0, '#ffffff', 0.025);
      }
      if (t > T_DASH && t < T_INSLOT) ghost(drawBz, bzPose, T_DASH, '#ffd27a', 0.02);
      if (t > T_APEX && t < T_BZBACK) ghost(drawBz, bzPose, T_APEX, '#ffd27a', 0.018);

      // landing shadows
      const shadowY = (p, R) => (Math.abs(p.y - SLOT[1]) < 30 ? SLOT[1] + R * 1.0 : null);

      // shove / kick effects behind characters
      F.puffs(ctx, TIME_LAND[0], TIME_LAND[1] + R0, t - T_LAND, { n: 6, seed: 3, size: 34, spread: 120 });
      F.puffs(ctx, BZ_LAND[0], BZ_LAND[1] + R0, t - T_LAND, { n: 6, seed: 4, size: 34, spread: 120 });
      F.puffs(ctx, TIME_KO[0], TIME_KO[1] + R0, t - T_CHECK - 0.14, { n: 6, seed: 5, size: 30, spread: 110 });
      F.puffs(ctx, SLOT[0], SLOT[1] + R0, t - T_INSLOT, { n: 5, seed: 6, size: 28, spread: 100 });
      F.puffs(ctx, SLOT[0], SLOT[1] + R0, t - T_TIMESLOT, { n: 5, seed: 7, size: 28, spread: 100 });
      F.puffs(ctx, SLOT[0], SLOT[1] + R0, t - T_BZBACK, { n: 5, seed: 8, size: 28, spread: 100 });

      // Time's flight trail
      if (t > T_KICK) {
        for (let k = 6; k >= 1; k--) {
          const tt = t - k * 0.016;
          if (tt < T_KICK) continue;
          ctx.save();
          ctx.globalAlpha *= (1 - k / 7) * 0.5;
          drawTime(F, ctx, timePose(F, tt), t, { silhouette: '#bfe2ff' });
          ctx.restore();
        }
        // puff trail along the path
        for (let k = 0; k < 5; k++) {
          const tt = T_KICK + 0.02 + k * 0.035;
          if (t < tt) continue;
          const q = timePose(F, tt);
          F.puffs(ctx, q.x, q.y, t - tt, { n: 4, seed: 40 + k, size: 26, spread: 60, life: 0.35 });
        }
      }

      // impact stars behind the fighters so faces stay readable
      F.impactStar(ctx, TIME_LAND[0] + R0 * 0.6, TIME_LAND[1] - R0 * 0.7, t, T_CHECK, { size: 95, life: 0.24, seed: 5, rot: 0.2 });
      F.impactStar(ctx, SLOT[0] + R0 * 0.1, SLOT[1] - R0 * 0.3, t, T_KICK, { size: 115, life: 0.2, seed: 11, color: P.bzYellow });
      const bzFront = t >= T_CHECK && t < T_INSLOT; // body check passes in front of Time
      const drawB = () => {
        const a = drawBz(F, ctx, bp, t, { shadow: shadowY(bp, R0) });
        // 99+ badge while it owns the slot
        const bk1 = t >= T_INSLOT && t < T_PUNCH ? F.pop(t, T_INSLOT + 0.02, 0.22) : 0;
        const bk2 = t >= T_BZBACK ? F.pop(t, T_BZBACK + 0.02, 0.22) : 0;
        const bk = Math.max(bk1, bk2);
        if (bk > 0) {
          ctx.save();
          ctx.translate(bp.x + R0 * 0.82 * bp.sx, bp.y - R0 * 0.85 * bp.sy);
          ctx.scale(bk, bk);
          ctx.rotate(0.12 + Math.sin(t * 12) * 0.05);
          F.badge(ctx, 0, 0, '99+', { size: 34, bg: '#ff2d3d' });
          ctx.restore();
        }
        return a;
      };
      const drawT = () => drawTime(F, ctx, tp, t, { shadow: shadowY(tp, 120 * tp.s) });
      if (bzFront) { drawT(); drawB(); } else { drawB(); drawT(); }

      // dizzy stars over knocked Time
      if (t > T_CHECK + 0.1 && t < T_WIND + 0.02) F.dizzyStars(ctx, tp.x, tp.y - R0 * 1.05, t, { r: 60, n: 3 });
      if (t > T_WIND && t < T_PUNCH) F.anger(ctx, tp.x + R0 * 0.75, tp.y - R0 * 0.85, 0.8, {});
      // sweat on the dash
      if (t > T_LAND + 0.1 && t < T_CHECK) F.sweat(ctx, tp.x + R0 * 0.8, tp.y - R0 * 0.7, 0.7 * F.clamp((t - 0.7) * 8), {});
      if (bp.face === 'dizzy') F.dizzyStars(ctx, bp.x, bp.y - R0 * 1.0, t, { r: 55, n: 3, color: '#ffffff' });

      // impacts
      F.shockRing(ctx, TIME_LAND[0] + R0 * 0.8, TIME_LAND[1], t - T_CHECK, { r: 170, life: 0.3, width: 14 });
      F.impactStar(ctx, SLOT[0] + R0 * 0.75, SLOT[1] + R0 * 0.75, t, T_PUNCH, { size: 95, life: 0.25, seed: 8 });
      F.shockRing(ctx, SLOT[0] + R0 * 0.75, SLOT[1] + R0 * 0.75, t - T_PUNCH, { r: 190, life: 0.3, width: 14, color: P.yellow });
      F.shockRing(ctx, SLOT[0] - R0 * 0.4, SLOT[1] - R0 * 0.3, t - T_KICK, { r: 220, life: 0.32, width: 16 });
      if (t > T_KICK) {
        F.speedLines(ctx, { angle: Math.atan2(EXIT[1] - SLOT[1], EXIT[0] - SLOT[0]), count: 14, color: '#ffffff', alpha: 0.8 * F.clamp((t - T_KICK) * 12), seed: 61, x: 200, y: 420, w: 900, h: 560, len: 300, width: 7, t, speed: 4200 });
      }

      ctx.restore(); // shake

      // 3 ROUND 1 sticker (screen-fixed, over everything)
      const rk = F.popIn(t, 0.02, 0.4);
      if (rk > 0.001) {
        ctx.save();
        ctx.translate(92, 250);
        ctx.rotate(-0.08);
        ctx.scale(rk, rk);
        F.dropShadow(ctx, (c) => { F.label(c, 'ROUND 1', 0, 0, { size: 40, bg: P.ink, color: '#ffffff', align: 'left' }); }, { dy: 8, blur: 14 });
        ctx.restore();
      }
      void E; void W; void H;
    },
  });
})();

<script>
// ---- src/scenes/03-time-eater.js
// Shot 03 'time-eater' : Round 2, the chart eats your time. Global T 3.333 .. 5.000 (1 bar, 100 frames).
// Layers, back to front:
//   1. navy backdrop + faint dot grid + dim floaties
//   2. chart panel (night2 card, chartGrid, red dumping candles growing, live price line)
//   3. the green candle биржа rides up on (clipped to the panel)
//   4. Time (flight trail on entry, crash, dizzy stars, recoils on every chomp)
//   5. биржа (rises, anticipates, lunges and CHOMPS on beats 1..3)
//   6. crumbs of blue rim, CHOMP! impact stars, shock rings
//   7. HUD: "ROUND 2" pill, "TIME WASTED" counter card (screen-fixed apart from the exit pan)
//   8. exit whip-pan to the left: camera slide, self-smear, horizontal speed lines
(function () {
  'use strict';
  const ID = 'time-eater';
  const FILM = window.FILM;
  const F = FILM.fx;
  const CAST = FILM.cast;
  const P = F.pal;
  const E = FILM.lib.ease;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const h01 = (...k) => F.h01(ID, ...k);

  const BEAT = 0.4167;
  const CH = [BEAT, 2 * BEAT, 3 * BEAT]; // chomps, T 3.750 / 4.167 / 4.583
  const LAND = 0.2; // Time crashes onto the chart
  const PAN0 = 1.43; // exit whip-pan start
  const DUR = 5 / 3;
  const RINGS = [1, 0.75, 0.5, 0.3];
  const MINUTES = [12, 160, 277, 365]; // 0h12 -> 2h40 -> 4h37 -> 6h05

  // panel geometry
  const PX = 50, PY = 540, PW = 980, PH = 960;
  // characters
  const TIME_HOME = [330, 1150], TIME_S = 1.1;
  const BZ_HOME = [770, 1080], BZ_S = 1.2;

  const chompIndex = (t) => (t >= CH[2] ? 3 : t >= CH[1] ? 2 : t >= CH[0] ? 1 : 0);

  // birzha lunge toward Time (negative x) around each chomp
  function lunge(t) {
    let v = 0;
    CH.forEach((tb) => {
      const a = F.seg(t, tb - 0.1, tb, E.inCubic);
      const r = F.seg(t, tb + 0.06, tb + 0.3, E.outCubic);
      v += a * (1 - r);
    });
    return v;
  }
  // anticipation lean back before each chomp
  function windup(t) {
    let v = 0;
    CH.forEach((tb) => {
      const a = F.seg(t, tb - 0.26, tb - 0.1, E.outCubic);
      const r = F.seg(t, tb - 0.1, tb - 0.02, E.inCubic);
      v += a * (1 - r);
    });
    return v;
  }
  function jaw(t) {
    let v = 0;
    CH.forEach((tb) => {
      const o = F.seg(t, tb - 0.26, tb - 0.07, E.outBack);
      const c = F.seg(t, tb - 0.05, tb - 1 / 120, E.inCubic);
      const chew = t > tb && t < tb + 0.22 ? 0.18 * Math.sin(((t - tb) / 0.22) * Math.PI * 2) ** 2 : 0;
      v += o * (1 - c) + chew;
    });
    return clamp(v, 0, 1.05);
  }
  // Time knocked back after each chomp
  function recoil(t) {
    let v = 0;
    CH.forEach((tb, i) => {
      if (t < tb) return;
      const u = t - tb;
      v += (36 + i * 10) * Math.exp(-u * 7) * Math.sin(Math.min(u * 18, Math.PI / 2) + Math.max(0, u - 0.09) * 14);
    });
    return v;
  }

  function drawBackdrop(ctx, t, ox) {
    F.bgFill(ctx, ['#10152c', P.night, '#1a2150']);
    F.dotGrid(ctx, { step: 60, r: 2.6, color: 'rgba(255,255,255,0.05)', oy: -t * 20, ox });
    ctx.save();
    ctx.globalAlpha = 0.28;
    F.floaties(ctx, { n: 12, seed: 33, t: t + 3.3, size: 20, speed: 40, colors: [P.timeCyan, P.bzOrange, P.down, P.purple] });
    ctx.restore();
  }

  function drawPanel(ctx, t) {
    F.dropShadow(ctx, (c) => {
      F.rrect(c, PX, PY, PW, PH, 44);
      c.fillStyle = F.linGrad(c, 0, PY, 0, PY + PH, [P.night2, '#18204a']);
      c.fill();
    }, { dy: 18, blur: 40, color: 'rgba(0,0,0,0.45)' });
    F.chartGrid(ctx, PX + 30, PY + 90, PW - 60, PH - 120, { cols: 6, rows: 8, color: 'rgba(255,255,255,0.06)' });
    // panel header: pair + red change chip
    F.text(ctx, 'BTC/USDT', PX + 50, PY + 50, { size: 34, fill: 'rgba(255,255,255,0.75)', align: 'left', font: 'mono', rounded: false });
    const chg = (-2.1 - t * 3.4).toFixed(1) + '%';
    F.label(ctx, chg, PX + PW - 40, PY + 50, { size: 28, bg: 'rgba(255,77,94,0.18)', color: P.down, align: 'right', font: 'mono', rounded: false });
    // candles: a dump, growing in live
    ctx.save();
    F.rrect(ctx, PX, PY, PW, PH, 44);
    ctx.clip();
    ctx.globalAlpha = 0.7;
    const vals = F.candles(ctx, PX + 40, PY + 120, PW - 80, PH - 200, { n: 18, seed: 314, trend: -0.75, grow: lerp(0.45, 1.02, E.outQuad ? E.outQuad(t / DUR) : t / DUR), t, width: 0.58 });
    ctx.globalAlpha = 1;
    // live price line at the last shown candle close
    const shown = Math.min(vals.length - 1, Math.floor(lerp(0.45, 1.02, t / DUR) * vals.length));
    const ly = PY + 120 + (PH - 200) - vals[Math.max(0, shown)][1] * (PH - 200) + Math.sin(t * 9) * 4;
    ctx.setLineDash([14, 12]);
    ctx.lineDashOffset = -t * 60;
    ctx.strokeStyle = 'rgba(255,77,94,0.75)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(PX + 30, ly); ctx.lineTo(PX + PW - 30, ly); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // the green candle under биржа (rises from the bottom of the panel)
  function drawRiser(ctx, bx, by, R, rise) {
    ctx.save();
    F.rrect(ctx, PX, PY, PW, PH, 44);
    ctx.clip();
    const top = by + R * 0.9;
    const bottom = PY + PH + 40;
    if (top < bottom) {
      const w = R * 1.0;
      ctx.strokeStyle = P.up; ctx.lineWidth = 10; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bx, top - 10); ctx.lineTo(bx, bottom); ctx.stroke();
      F.rrect(ctx, bx - w / 2, top + 20, w, bottom - top, 18);
      ctx.fillStyle = F.linGrad(ctx, 0, top, 0, bottom, ['#4cf29a', P.up, '#159a5a']);
      ctx.fill();
      // shine
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      F.rrect(ctx, bx - w / 2 + 12, top + 34, 14, Math.max(0, bottom - top - 60), 7); ctx.fill();
      // rising glow
      if (rise < 1) {
        ctx.globalAlpha = 1 - rise;
        ctx.fillStyle = 'rgba(76,242,154,0.25)';
        F.rrect(ctx, bx - w, top, w * 2, bottom - top, 40); ctx.fill();
      }
    }
    ctx.restore();
  }

  function timePose(t) {
    // entry flight from the left edge at y ~900, spinning, crash at LAND
    let x, y, rot, sx = 1, sy = 1;
    if (t < LAND) {
      const u = t / LAND;
      x = lerp(-110, TIME_HOME[0], E.outQuad ? E.outQuad(u) : u);
      y = lerp(900, TIME_HOME[1], u * u) - Math.sin(u * Math.PI) * 60;
      rot = -(LAND - t) * 30;
      sx = 1.12; sy = 0.9; // stretched along the flight
    } else {
      x = TIME_HOME[0] - recoil(t);
      y = TIME_HOME[1] + Math.sin(t * 7) * 3;
      rot = Math.exp(-(t - LAND) * 6) * Math.sin((t - LAND) * 20) * 0.35 - recoil(t) * 0.004;
      const sq1 = F.squash(t, LAND, 0.42, 0.5);
      let ax = sq1[0], ay = sq1[1];
      CH.forEach((tb) => { const q = F.squash(t, tb, 0.3, 0.45); ax *= q[1]; ay *= q[0]; }); // pinched sideways by the bite
      sx = ax; sy = ay;
    }
    return { x, y, rot, sx, sy };
  }

  function drawTime(ctx, t) {
    const p = timePose(t);
    const ci = chompIndex(t);
    const ring = RINGS[ci];
    const face = t < CH[0] - 0.12 ? 'dizzy' : 'shocked';
    // flight trail
    if (t < LAND + 0.05) {
      const pos = [];
      for (let k = 6; k >= 1; k--) {
        const tt = t - k * 0.022;
        if (tt < -0.15) continue;
        const q = tt < LAND ? timePose(Math.max(tt, -0.12)) : null;
        if (!q) continue;
        const u = tt / LAND;
        pos.push([lerp(-110, TIME_HOME[0], u), q.y, q.rot]);
      }
      F.motionTrail(ctx, (c, x, y) => {
        c.fillStyle = P.timeCyan;
        c.beginPath(); c.arc(x, y, 120 * TIME_S, 0, TAU); c.fill();
      }, pos, { alpha: 0.35 });
    }
    // contact shadow on the panel floor
    CAST.time(ctx, {
      x: p.x, y: p.y, s: TIME_S, rot: p.rot, sx: p.sx, sy: p.sy, t, face, ring,
      look: ci > 0 ? [0.8, -0.3] : [0, 0], spin: t < LAND ? t * 30 : 0,
      shadow: t >= LAND ? TIME_HOME[1] + 140 : undefined,
      gloves: t >= LAND ? (ci > 0 ? { l: [p.x - 175, p.y - 30 + Math.sin(t * 30) * 6], r: [p.x + 40, p.y - 175 + Math.sin(t * 34) * 6] } : { l: [p.x - 165, p.y + 70], r: [p.x + 120, p.y + 150] }) : null,
    });
    if (t >= LAND && t < CH[0] + 0.05) {
      ctx.save();
      ctx.globalAlpha = clamp((CH[0] + 0.05 - t) / 0.08);
      F.dizzyStars(ctx, p.x, p.y - 160, t, { r: 95, n: 4 });
      ctx.restore();
    }
    if (ci > 0) {
      const sw = (t * 2.4) % 1;
      F.sweat(ctx, p.x - 120 - sw * 30, p.y - 110 + sw * 40, 1.1, { flip: true });
    }
    return p;
  }

  function drawBirzha(ctx, t) {
    // rise on the green candle from below the panel: 0.04 .. 0.36, springy
    const riseU = clamp((t - 0.04) / 0.5);
    const rise = riseU <= 0 ? 0 : F.spring(riseU * 0.9, 1.4, 5.5);
    const R = 120 * BZ_S;
    const L = lunge(t), W = windup(t);
    const x = BZ_HOME[0] - L * 175 + W * 40;
    const y = lerp(PY + PH + R + 60, BZ_HOME[1], rise) + Math.sin(t * 9) * 4 - W * 20 + L * 10;
    drawRiser(ctx, x, y, R, clamp(riseU * 1.4));
    let sx = 1, sy = 1;
    const st = F.squash(t, 0.36, -0.22, 0.45); // stretch at the top of the rise
    sx *= st[0]; sy *= st[1];
    CH.forEach((tb) => { const q = F.squash(t, tb, 0.24, 0.4); sx *= q[0]; sy *= q[1]; });
    sx *= 1 - W * 0.06; sy *= 1 + W * 0.08;
    const j = jaw(t);
    CAST.birzha(ctx, {
      x, y: y - j * R * 0.25, s: BZ_S, t, face: 'laugh', greedy: true, jaw: j,
      rot: -L * 0.12 + W * 0.1, sx, sy,
      gloves: { l: [x - 150 - L * 40, y + 60 + Math.sin(t * 16) * 10], r: [x + 190, y - 40 + Math.sin(t * 13) * 12] },
    });
    return { x, y, R };
  }

  // blue rim crumbs flying from the bite point
  function drawCrumbs(ctx, t) {
    CH.forEach((tb, i) => {
      const age = t - tb;
      if (age < 0 || age > 0.75) return;
      const bx = TIME_HOME[0] + 110 - i * 10, by = TIME_HOME[1] - 80 + i * 40;
      const fade = clamp((0.75 - age) / 0.25);
      for (let k = 0; k < 14; k++) {
        const a = -Math.PI * 0.5 + (h01('ca', i, k) - 0.5) * Math.PI * 1.4;
        const v = 500 + h01('cv', i, k) * 650;
        const px = bx + Math.cos(a) * v * age;
        const py = by + Math.sin(a) * v * age + 1900 * age * age;
        const s = 10 + h01('cs', i, k) * 16;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(age * (h01('cr', i, k) - 0.5) * 20);
        ctx.globalAlpha = fade;
        ctx.fillStyle = k % 3 === 0 ? P.timeCyan : k % 3 === 1 ? P.timeBlue : '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, s, 0, Math.PI * 1.15);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    });
  }

  function drawFx(ctx, t) {
    // crash puffs and ring on landing
    const spots = [[570, 890, -0.14, 160], [470, 860, 0.12, 175], [585, 840, -0.08, 195]];
    CH.forEach((tb, i) => {
      F.shockRing(ctx, TIME_HOME[0] + 120, TIME_HOME[1] - 60, t - tb, { r: 200, color: P.bzYellow, width: 16, life: 0.35 });
      const s = spots[i];
      F.impactStar(ctx, s[0], s[1], t, tb, { size: s[3], rot: s[2], color: P.bzYellow, color2: P.bzRed, life: 0.38, seed: 40 + i });
      if (t >= tb - 1e-6 && t <= tb + 0.38) {
        const age = t - tb;
        const sc = F.pop(t, tb, 0.18) * (1 + age * 0.15);
        F.text(ctx, 'CHOMP!', s[0], s[1] + 4, { size: s[3] * 0.3, scale: sc, rot: s[2], fill: P.ink, alpha: clamp((0.38 - age) / 0.15) });
      }
    });
  }

  function fmt(min) {
    const m = Math.round(min);
    const h = Math.floor(m / 60), mm = m % 60;
    return `${h}h ${mm < 10 ? '0' : ''}${mm}m`;
  }

  function drawHud(ctx, t) {
    F.label(ctx, 'ROUND 2', 80, 250, { size: 34, bg: P.yellow, color: P.ink, align: 'left' });
    // counter value: rolls up fast right after each beat
    let minutes = MINUTES[0];
    CH.forEach((tb, i) => { minutes += (MINUTES[i + 1] - MINUTES[i]) * F.seg(t, tb - 1 / 60, tb + 0.16, E.outCubic); });
    const pulse = CH.reduce((a, tb) => a + (t >= tb ? Math.exp(-(t - tb) * 9) : 0), 0);
    const intro = 0.75 + 0.25 * F.spring(t * 1.6 + 0.05, 2, 6);
    const cx = 540, cy = 395, w = 760, h = 180;
    ctx.save();
    ctx.translate(cx, cy);
    const sc = intro * (1 + pulse * 0.07);
    ctx.scale(sc, sc);
    ctx.rotate(Math.sin(t * 40) * pulse * 0.02);
    F.card(ctx, -w / 2, -h / 2, w, h, { r: 40, fill: '#ffffff', shadowDy: 14, blur: 30, shadowColor: 'rgba(0,0,0,0.4)' });
    // red flash band on hits
    if (pulse > 0.02) {
      ctx.save();
      ctx.globalAlpha = clamp(pulse) * 0.18;
      F.rrect(ctx, -w / 2, -h / 2, w, h, 40); ctx.fillStyle = P.down; ctx.fill();
      ctx.restore();
    }
    // hourglass-ish clock icon
    ctx.save();
    ctx.translate(-w / 2 + 92, 0);
    ctx.fillStyle = P.down;
    ctx.beginPath(); ctx.arc(0, 0, 50, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 0, 38, 0, TAU); ctx.fill();
    ctx.strokeStyle = P.ink; ctx.lineWidth = 7; ctx.lineCap = 'round';
    const ha = t * 14, ma = t * 50;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(ha) * 18, -Math.cos(ha) * 18); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(ma) * 28, -Math.cos(ma) * 28); ctx.stroke();
    ctx.restore();
    F.text(ctx, 'TIME WASTED', -w / 2 + 170, -40, { size: 34, fill: P.lsSlate, align: 'left', font: 'mono', letter: 6, rounded: false });
    const blur = pulse > 0.3 && t < CH[2] + 0.2 ? 1 : 0;
    F.text(ctx, fmt(minutes), -w / 2 + 166, 32, { size: 96, fill: P.down, align: 'left', font: 'mono', sy: 1 + blur * 0.06 });
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      // exit whip-pan to the left
      const pu = F.seg(t, PAN0, info.dur, E.inCubic);
      const panX = -pu * 1250;
      const [shx, shy] = F.shakeMany(t, [[LAND, 0.3, 12], [CH[0], 0.3, 20], [CH[1], 0.3, 22], [CH[2], 0.35, 28]], 7);

      // 1. backdrop (pans slower: parallax)
      drawBackdrop(ctx, t, panX * 0.6);

      ctx.save();
      ctx.translate(panX + shx, shy);
      if (pu > 0) { ctx.translate(540, 0); ctx.scale(1 + pu * 0.35, 1); ctx.translate(-540, 0); }
      // 2-3. panel
      drawPanel(ctx, t);
      // 4. Time behind биржа (crash dust behind him)
      F.shockRing(ctx, TIME_HOME[0], TIME_HOME[1] + 130, t - LAND, { r: 230, squash: 0.3, color: P.timeCyan, width: 14 });
      F.puffs(ctx, TIME_HOME[0], TIME_HOME[1] + 120, t - LAND, { n: 7, seed: 31, size: 46, spread: 210, color: 'rgba(200,215,255,0.55)' });
      drawTime(ctx, t);
      // 5. биржа
      drawBirzha(ctx, t);
      // 6. effects
      drawCrumbs(ctx, t);
      drawFx(ctx, t);
      ctx.restore();

      // 7. HUD rides the pan too (everything whips out)
      ctx.save();
      ctx.translate(panX + shx * 0.4, shy * 0.4);
      drawHud(ctx, t);
      ctx.restore();

      // 8. whip smear + speed lines
      if (pu > 0) {
        if (ctx.canvas && pu > 0.05) {
          ctx.save();
          ctx.globalAlpha = 0.45;
          ctx.drawImage(ctx.canvas, 0, 0, ctx.canvas.width, ctx.canvas.height, 90 * pu, 0, FILM.W, FILM.H);
          ctx.restore();
        }
        F.speedLines(ctx, { angle: Math.PI, count: 34, color: '#ffffff', alpha: 0.25 + 0.55 * pu, seed: 303, t, speed: 5200, len: 520, width: 6 });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/04-tab-war.js
// Shot 04 'tab-war' : Round 3, tab overload. Global T 5.000 .. 6.667 (1 bar, 100 frames).
// Layers, back to front (everything below the HUD rides one camera: entry whip-pan, exit zoom):
//   1. lilac backdrop, dot grid, floaties
//   2. browser window card (chrome strip, traffic dots, toolbar, loading skeleton page)
//   3. tab row: tabs reflow and squeeze to slivers; Time wedged in the middle, squashed, sweating
//   4. search bar typing "searching for an entry..." with a spinner
//   5. биржа standing on the window top, laughing, throwing tabs like cards (one per 8th note)
//   6. tabs in flight, "+27" badge, hit effects
//   7. HUD: "ROUND 3" pill (screen-fixed apart from the pan / zoom)
//   8. entry whip-pan smear + speed lines; exit zoom focus lines
// EXIT contract: the last frame shows Time centred at (540, 960) with s = 2.5, face dizzy, hands spinning.
(function () {
  'use strict';
  const ID = 'tab-war';
  const FILM = window.FILM;
  const F = FILM.fx;
  const CAST = FILM.cast;
  const P = F.pal;
  const E = FILM.lib.ease;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, u) => a + (b - a) * u;
  const h01 = (...k) => F.h01(ID, ...k);

  const BEAT = 0.4167, EIGHTH = BEAT / 2;
  const PAN_IN = 0.22; // entry whip-pan resolves
  const Z0 = 1.42, Z1 = 1.65; // exit zoom window (last 0.25 s); the last frame is t = 1.65
  const HIT = 3 * BEAT; // "+27": beat 3

  // window geometry
  const WX = 30, WY = 640, WW = 1020, WH = 1400;
  const ROW_Y = 700, TH = 130, ROW_W = 960;
  const SB_Y = 900, SB_H = 110;
  const TIME_S = 0.9, TR = 120 * TIME_S;
  const BZ = [850, WY], BZ_S = 0.8;

  // tabs: side L/R of Time (new tabs are inserted next to Time, pushing the older ones outward)
  const ICON = { BTC: '#f7931a', ETH: '#7b5cff', SOL: '#22c977', TF: P.timeBlue, NEWS: P.bzRed, MORE: P.bzOrange };
  const TABS = [
    { label: 'BTC/USDT', at: -1, side: -1, icon: ICON.BTC },
    { label: 'ETH/USDT', at: -1, side: 1, icon: ICON.ETH },
    { label: 'SOL/USDT', at: 1 * EIGHTH, side: -1, icon: ICON.SOL },
    { label: '1H', at: 2 * EIGHTH, side: 1, icon: ICON.TF },
    { label: '4H', at: 3 * EIGHTH, side: -1, icon: ICON.TF },
    { label: '15m', at: 4 * EIGHTH, side: 1, icon: ICON.TF },
    { label: 'news', at: 5 * EIGHTH, side: -1, icon: ICON.NEWS },
    { label: '+27', at: 6 * EIGHTH, side: 1, icon: ICON.MORE, big: true },
  ];
  const SLIVER_COLS = [P.bzOrange, P.bzYellow, P.bzRed, '#ff9a5c', '#ffd27a', '#ff7a8c'];
  for (let k = 0; k < 27; k++) TABS.push({ label: '', at: HIT + 0.03 + k * 0.0045, side: k % 2 ? 1 : -1, sliver: true, color: SLIVER_COLS[k % SLIVER_COLS.length] });
  const FLIGHT = 0.2; // seconds a thrown tab is in the air (lands on its 8th note)
  const THROWN = TABS.filter((tb) => tb.at > 0 && !tb.sliver);

  const grow = (tb, t) => (tb.at < 0 ? 1 : t < tb.at ? 0 : tb.sliver ? E.outCubic(clamp((t - tb.at) / 0.1)) : E.outBack(clamp((t - tb.at) / 0.16)));

  // the tab row at time t: positions of every tab and of Time's slot
  function layout(t) {
    let n = 0;
    TABS.forEach((tb) => { n += grow(tb, t); });
    const regular = TABS.filter((tb) => !tb.sliver).reduce((a, tb) => a + grow(tb, t), 0);
    const sq = clamp((regular - 2) / 6), sq2 = clamp((n - regular) / 27);
    const wT = lerp(lerp(200, 150, E.outQuad(sq)), 104, sq2);
    const unit = Math.min(380, (ROW_W - wT) / Math.max(n, 1e-3));
    const left = [], right = [];
    // outer -> inner on the left = oldest first; inner -> outer on the right = newest first
    TABS.forEach((tb, i) => { if (tb.side < 0) left.push(i); });
    TABS.forEach((tb, i) => { if (tb.side > 0) right.unshift(i); });
    const ws = TABS.map((tb) => grow(tb, t) * unit);
    const total = ws.reduce((a, b) => a + b, 0) + wT;
    let x = 540 - total / 2;
    const pos = new Array(TABS.length);
    left.forEach((i) => { pos[i] = [x, ws[i]]; x += ws[i]; });
    const timeX = x + wT / 2;
    x += wT;
    right.forEach((i) => { pos[i] = [x, ws[i]]; x += ws[i]; });
    return { pos, wT, timeX, unit, n };
  }

  function timePose(t, lay) {
    const z = F.seg(t, Z0, Z1, E.inOutCubic);
    const sxSq = clamp(lay.wT / (2 * TR), 0.45, 1.15);
    const hitSq = F.squash(t, HIT + 0.03, 0.25, 0.4);
    let sx = sxSq * hitSq[0] * (1 + Math.sin(t * 31) * 0.025);
    let sy = Math.min(1.35, 1 + (1 - sxSq) * 0.7) * hitSq[1];
    // pops free of the squeeze during the zoom (overshoots, lands exactly on 1)
    const free = z <= 0 ? 0 : z >= 1 ? 1 : E.outBack(z);
    sx = lerp(sx, 1, free); sy = lerp(sy, 1, free);
    if (z >= 1) { sx = 1; sy = 1; }
    const bob = Math.sin(t * 17) * 3 * (1 - z);
    return { x: lay.timeX, y: ROW_Y + TH / 2 + bob, sx, sy, rot: Math.sin(t * 23) * 0.04 * (1 - z), z };
  }

  // ---------------------------------------------------------------------------
  function drawBackdrop(ctx, t) {
    F.dotGrid(ctx, { step: 56, r: 3, color: 'rgba(123,92,255,0.12)', oy: -t * 24 });
    F.floaties(ctx, { n: 14, seed: 404, t: t + 5, size: 24, speed: 36 });
  }

  function drawWindow(ctx, t, z) {
    F.card(ctx, WX, WY, WW, WH, { r: 48, fill: '#ffffff', shadow: z < 0.2, shadowDy: 22, blur: 44, shadowColor: 'rgba(60,40,140,0.25)' });
    // chrome strip (tab area)
    ctx.save();
    F.rrect(ctx, WX, WY, WW, WH, 48);
    ctx.clip();
    ctx.fillStyle = '#e7e9f6';
    ctx.fillRect(WX, WY, WW, ROW_Y + TH - WY);
    ctx.restore();
    // traffic dots
    [P.red, P.yellow, P.green].forEach((c, i) => {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(WX + 50 + i * 36, WY + 30, 11, 0, TAU); ctx.fill();
    });
    // page: loading skeleton
    const shim = ((t * 1.3) % 1.4) - 0.2;
    const sk = (x, y, w, h, r) => {
      F.rrect(ctx, x, y, w, h, r);
      ctx.fillStyle = '#eef0f8';
      ctx.fill();
    };
    sk(70, 1050, 940, 330, 34);
    // skeleton chart squiggle
    ctx.save();
    ctx.strokeStyle = '#dde1f0'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i <= 12; i++) {
      const x = 120 + i * 70, y = 1240 + Math.sin(i * 1.3) * 60 - i * 6;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
    sk(70, 1420, 560, 44, 22);
    sk(70, 1490, 820, 44, 22);
    sk(70, 1560, 680, 44, 22);
    sk(70, 1630, 760, 44, 22);
    // shimmer sweep across the skeleton
    ctx.save();
    ctx.beginPath();
    F.rrect(ctx, 70, 1050, 940, 330, 34);
    ctx.rect(70, 1420, 820, 260);
    ctx.clip();
    const sx = lerp(-200, 1200, shim);
    ctx.fillStyle = F.linGrad(ctx, sx - 160, 0, sx + 160, 0, ['rgba(255,255,255,0)', 'rgba(255,255,255,0.85)', 'rgba(255,255,255,0)']);
    ctx.fillRect(sx - 160, 1030, 320, 700);
    ctx.restore();
  }

  function drawTab(ctx, tb, x, w, t, active) {
    if (w < 1) return;
    if (tb.sliver || w < 64) {
      F.rrect(ctx, x + 2, ROW_Y + 6, Math.max(2, w - 4), TH - 6, Math.min(12, w / 2));
      ctx.fillStyle = tb.sliver ? tb.color : '#d5d9ec';
      ctx.fill();
      if (!tb.sliver && tb.icon) {
        ctx.fillStyle = tb.icon;
        ctx.beginPath(); ctx.arc(x + w / 2, ROW_Y + TH * 0.5, Math.min(12, w * 0.25), 0, TAU); ctx.fill();
      }
      return;
    }
    F.tab(ctx, x + 4, ROW_Y, w - 8, TH, { active, close: false, bg: '#d5d9ec', activeBg: '#ffffff' });
    // own tab content (the kit's tab clips labels away too early for this squeeze gag)
    ctx.save();
    ctx.beginPath(); ctx.rect(x + 8, ROW_Y, w - 22, TH); ctx.clip();
    ctx.fillStyle = tb.icon;
    ctx.beginPath(); ctx.arc(x + 36, ROW_Y + TH / 2, 14, 0, TAU); ctx.fill();
    F.text(ctx, tb.label, x + 60, ROW_Y + TH / 2 + 1, { size: 40, fill: tb.big ? P.bzRed : P.ink, align: 'left', rounded: false, font: 'sans' });
    ctx.restore();
    if (w > 250) {
      ctx.save();
      ctx.strokeStyle = 'rgba(27,21,48,0.4)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      const cx = x + w - 36, cy = ROW_Y + TH / 2, k = 10;
      ctx.beginPath(); ctx.moveTo(cx - k, cy - k); ctx.lineTo(cx + k, cy + k); ctx.moveTo(cx + k, cy - k); ctx.lineTo(cx - k, cy + k); ctx.stroke();
      ctx.restore();
    }
  }

  function drawRow(ctx, t, lay) {
    // newest landed regular tab is the active one
    let active = -1;
    TABS.forEach((tb, i) => { if (!tb.sliver && (tb.at < 0 || t >= tb.at)) active = i; });
    TABS.forEach((tb, i) => {
      if (i === active) return;
      drawTab(ctx, tb, lay.pos[i][0], lay.pos[i][1], t, false);
    });
    if (active >= 0) drawTab(ctx, TABS[active], lay.pos[active][0], lay.pos[active][1], t, true);
    // dust puffs where a tab slams in
    THROWN.forEach((tb, k) => {
      const i = TABS.indexOf(tb);
      const p = lay.pos[i];
      F.puffs(ctx, p[0] + p[1] / 2, ROW_Y + TH, t - tb.at, { n: 5, seed: 40 + k, size: 22, spread: 70, color: 'rgba(160,150,220,0.6)', life: 0.35 });
    });
  }

  function drawSearch(ctx, t, z) {
    // the text leaves before the zoom carries it out of the safe area
    const vis = z < 0.18;
    const str = vis ? F.typeOn('searching for an entry...', t, 0.16, 34) : '';
    F.searchBar(ctx, 70, SB_Y, 940, SB_H, { text: str, caret: vis, t, spinner: true, size: 42, placeholder: vis && !str ? 'Search' : '' });
  }

  function drawCounter(ctx, t, lay) {
    const n = Math.round(lay.n);
    let pulse = 0;
    TABS.forEach((tb) => { if (tb.at > 0 && t >= tb.at && !tb.sliver) pulse = Math.max(pulse, Math.exp(-(t - tb.at) * 10)); });
    if (t >= HIT) pulse = Math.max(pulse, Math.exp(-(t - HIT) * 6) * 1.6);
    ctx.save();
    ctx.translate(290, 400);
    ctx.scale(1 + pulse * 0.06, 1 + pulse * 0.06);
    ctx.rotate(-0.03 + Math.sin(t * 40) * pulse * 0.015);
    F.card(ctx, -210, -82, 420, 164, { r: 36, fill: '#ffffff', shadowDy: 12, blur: 26, shadowColor: 'rgba(60,40,140,0.22)' });
    F.text(ctx, 'TABS OPEN', -170, -38, { size: 30, fill: P.lsSlate, align: 'left', font: 'mono', letter: 5, rounded: false });
    F.text(ctx, String(n), -172, 30, { size: 92, fill: n > 9 ? P.bzRed : P.bzOrange, align: 'left', font: 'mono' });
    // mini tab glyphs
    for (let i = 0; i < 3; i++) {
      F.rrect(ctx, 70 + i * 34, 0 - i * 14, 70, 50, 12);
      ctx.fillStyle = [P.bzYellow, P.bzOrange, P.bzRed][i];
      ctx.fill();
    }
    ctx.restore();
  }

  function drawTime(ctx, t, lay) {
    const p = timePose(t, lay);
    const face = t >= Z0 + 0.04 ? 'dizzy' : 'shocked';
    const gx = (lay.wT / 2) * p.sx / Math.max(p.sx, 1e-3);
    const pushing = 1 - p.z;
    const gloves = pushing > 0.02 ? {
      l: [p.x - Math.max(gx, 60) - 14 + Math.sin(t * 40) * 4, p.y + 30],
      r: [p.x + Math.max(gx, 60) + 14 - Math.sin(t * 40) * 4, p.y + 30],
    } : null;
    CAST.time(ctx, { x: p.x, y: p.y, s: TIME_S, sx: p.sx, sy: p.sy, rot: p.rot, t, face, ring: 0.3, spin: t * 25, gloves: gloves && pushing > 0.5 ? gloves : null });
    // sweat flying off
    if (pushing > 0.3) {
      for (let k = 0; k < 3; k++) {
        const u = (t * 2.2 + k / 3) % 1;
        const sd = k % 2 ? 1 : -1;
        ctx.save();
        ctx.globalAlpha = (1 - u) * pushing;
        F.sweat(ctx, p.x + sd * (TR * p.sx + 10 + u * 70), p.y - TR * p.sy * 0.7 - u * 60 + u * u * 120, 0.9, { flip: sd < 0 });
        ctx.restore();
      }
    }
    return p;
  }

  // биржа's throwing arm: wind up before each release, fling forward after
  function throwArm(t) {
    let back = 0, fwd = 0, idx = -1;
    THROWN.forEach((tb, k) => {
      const r = tb.at - FLIGHT;
      back += F.seg(t, r - 0.12, r - 0.01, E.outCubic) * (1 - F.seg(t, r - 0.01, r + 0.03, E.inCubic));
      fwd += F.seg(t, r - 0.01, r + 0.03, E.outCubic) * (1 - F.seg(t, r + 0.05, r + 0.16, E.inOutCubic));
      if (t >= r - 0.12) idx = k;
    });
    return { back: clamp(back), fwd: clamp(fwd), idx };
  }

  function drawBirzha(ctx, t) {
    const R = 120 * BZ_S;
    const arm = throwArm(t);
    const laughBounce = Math.abs(Math.sin(t * TAU * 2.4)) * 0.06;
    const big = F.seg(t, HIT, HIT + 0.12, E.outBack);
    let sx = 1 + laughBounce * 0.6 - arm.back * 0.06 + arm.fwd * 0.08, sy = 1 - laughBounce - arm.fwd * 0.06 + arm.back * 0.06;
    const hs = F.squash(t, HIT, -0.25, 0.45);
    sx *= hs[0]; sy *= hs[1];
    const x = BZ[0] + arm.back * 18 - arm.fwd * 22;
    const yFeet = WY + 2;
    const y = yFeet - R * sy - big * 30 * (1 - F.seg(t, HIT + 0.15, HIT + 0.4, E.inOutCubic));
    const gR = [x + 150 - arm.fwd * 260 + arm.back * 20, y - 40 - arm.back * 90 + arm.fwd * 70];
    const gL = big > 0 ? [lerp(x - 130, x - 150, big), lerp(y + 40, y - 140, big * (1 - F.seg(t, HIT + 0.2, HIT + 0.45)))] : [x - 130, y + 40 + Math.sin(t * 15) * 8];
    if (big > 0) gR[1] = lerp(gR[1], y - 150, big * (1 - F.seg(t, HIT + 0.2, HIT + 0.45)));
    CAST.birzha(ctx, {
      x, y, s: BZ_S, t, face: 'laugh', greedy: t > HIT, jaw: 0.25 + 0.2 * Math.abs(Math.sin(t * TAU * 2.4)) + big * 0.3,
      sx, sy, rot: -arm.fwd * 0.12 + arm.back * 0.08, gloves: { l: gL, r: gR }, shadow: yFeet,
    });
    // ha ha
    const hu = (t * 2.4) % 1;
    F.text(ctx, 'HA', x + 120 + hu * 40, y - 120 - hu * 50, { size: 34, fill: P.bzRed, alpha: Math.sin(hu * Math.PI), rot: 0.2 });
    return { x, y, R, gR };
  }

  function drawFlying(ctx, t, lay, bz) {
    THROWN.forEach((tb, k) => {
      const r = tb.at - FLIGHT;
      if (t < r || t >= tb.at) return;
      const u = (t - r) / FLIGHT;
      const i = TABS.indexOf(tb);
      // land next to Time on its side
      const tx = lay.timeX + tb.side * (lay.wT / 2 + 50);
      const ty = ROW_Y + TH / 2;
      const sx0 = bz.gR[0], sy0 = bz.gR[1];
      const x = lerp(sx0, tx, E.inQuad(u));
      const y = lerp(sy0, ty, u) - Math.sin(u * Math.PI) * 170;
      const w = lerp(260, 170, u), h = lerp(100, TH, u);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((1 - u) * (tb.side < 0 ? -1 : 1) * 3.4 + (h01('fr', k) - 0.5) * 0.3);
      ctx.scale(1, Math.max(0.15, Math.abs(Math.cos(u * Math.PI * 1.5))));
      F.dropShadow(ctx, (c) => { F.rrect(c, -w / 2, -h / 2, w, h, 22); c.fillStyle = '#ffffff'; c.fill(); }, { dy: 10, blur: 16 });
      ctx.fillStyle = tb.icon;
      ctx.beginPath(); ctx.arc(-w / 2 + 28, 0, 12, 0, TAU); ctx.fill();
      F.text(ctx, tb.label, -w / 2 + 50, 2, { size: 40, fill: tb.big ? P.bzRed : P.ink, align: 'left', rounded: false, font: 'sans' });
      ctx.restore();
      // whoosh streak
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      const u0 = Math.max(0, u - 0.25);
      ctx.beginPath();
      for (let j = 0; j <= 6; j++) {
        const uu = lerp(u0, u, j / 6);
        const px = lerp(sx0, tx, E.inQuad(uu)), py = lerp(sy0, ty, uu) - Math.sin(uu * Math.PI) * 170;
        if (j) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
      void i;
    });
  }

  function drawHitFx(ctx, t, lay) {
    // "+27" badge pops on the tab row, sliver burst
    const k = F.pop(t, HIT, 0.25);
    if (k > 0) {
      ctx.save();
      ctx.translate(lay.timeX + 230, ROW_Y - 8);
      ctx.rotate(0.12);
      ctx.scale(k, k);
      F.label(ctx, '+27 TABS', 0, 0, { size: 40, bg: P.bzRed, color: '#ffffff' });
      ctx.restore();
    }
    F.shockRing(ctx, lay.timeX, ROW_Y + TH / 2, t - HIT, { r: 260, color: P.bzOrange, width: 16, life: 0.4 });
    F.confettiBurst(ctx, lay.timeX + 150, ROW_Y + 20, t - HIT, { n: 22, seed: 427, colors: SLIVER_COLS, power: 900, life: 0.9, size: 18 });
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const lay = layout(t);
      const tp = timePose(t, lay);
      const z = tp.z;
      // entry whip-pan from the right
      const pin = 1 - F.seg(t, 0, PAN_IN, E.outCubic);
      const panX = pin * 760;
      // exit zoom onto Time's face: Time -> (540, 960), scale 1 -> 2.5 / 0.9
      const zoom = lerp(1, 2.5 / TIME_S, z);
      const cx = lerp(tp.x, 540, z), cy = lerp(tp.y, 960, z);
      const [shx0, shy0] = F.shakeMany(t, [[HIT, 0.32, 22]].concat(THROWN.slice(0, -1).map((tb) => [tb.at, 0.14, 6])), 11);
      const shx = shx0 * (1 - z), shy = shy0 * (1 - z);

      F.bgFill(ctx, [P.lilac, '#e2dcff']);
      ctx.save();
      ctx.translate(panX + shx, shy);
      if (pin > 0) { ctx.translate(540, 0); ctx.scale(1 + pin * 0.3, 1); ctx.translate(-540, 0); }
      // camera zoom about Time
      ctx.translate(cx, cy);
      ctx.scale(zoom, zoom);
      ctx.translate(-tp.x, -tp.y);

      drawBackdrop(ctx, t);
      drawWindow(ctx, t, z);
      drawSearch(ctx, t, z);
      drawRow(ctx, t, lay);
      const bz = drawBirzha(ctx, t);
      drawTime(ctx, t, lay);
      drawFlying(ctx, t, lay, bz);
      drawHitFx(ctx, t, lay);
      // HUD rides the camera (it zooms away with the world)
      drawCounter(ctx, t, lay);
      F.label(ctx, 'ROUND 3', 80, 250, { size: 34, bg: P.yellow, color: P.ink, align: 'left' });
      ctx.restore();

      // entry: whip smear + horizontal speed lines resolving
      if (pin > 0.02) {
        if (ctx.canvas && pin > 0.1) {
          ctx.save();
          ctx.globalAlpha = 0.4 * pin;
          ctx.drawImage(ctx.canvas, 0, 0, ctx.canvas.width, ctx.canvas.height, 80 * pin, 0, FILM.W, FILM.H);
          ctx.restore();
        }
        F.speedLines(ctx, { angle: Math.PI, count: 34, color: '#ffffff', alpha: 0.85 * pin, seed: 303, t: t + 1.6667, speed: 5200, len: 520, width: 6 });
      }
      // exit: focus lines framing the face
      if (z > 0.05) {
        F.focusLines(ctx, 540, 960, { inner: lerp(700, 360, z), count: 54, color: '#ffffff', alpha: 0.6 * z, seed: 44, width: 14, t });
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/05-notif-storm.js
// 05 notif-storm: "Round 4: notification storm" (global T 6.667 - 8.333, 1 bar, 100 frames)
// ENTRY: match cut on Time centred (540, 960) s 2.5, dizzy; camera zooms out (outCubic, 0.35 s) to a
// phone lock screen (03:47, purple-night wallpaper). биржа (sitting on the phone's top edge) spams
// notifications on every 8th note, they stack down from the top and shove Time's own notifications
// off the bottom. Beat 3 (t = 1.25): Time uppercuts the stack, BAM!, everything flies apart.
// EXIT: the frame brightens toward white (the next shot opens on a flash).
// Layers, back to front:
//   1 background stripes + floaties (world, rides the camera)
//   2 биржа peeking behind the phone top
//   3 phone + lock screen (wallpaper, stars, clock, stacked notifications, bottom buttons)
//   4 Time (on the screen's bottom), gloves, effects
//   5 flying notifications after the uppercut, BAM!, shock ring
//   6 screen-fixed: ROUND 4 label, exit brightening
(function () {
  'use strict';
  const ID = 'notif-storm';
  const FILM = window.FILM;
  const F = FILM.fx;
  const CAST = FILM.cast;
  const C = F.pal;
  const E = F.E;
  const TAU = Math.PI * 2;
  const clamp = F.clamp, lerp = F.lerp, seg = F.seg;
  const BEAT = F.BEAT, EIGHTH = BEAT / 2;

  // ---- layout (world coords = final framing) ----
  const PH = { cx: 540, cy: 1000, w: 820, h: 1640 };
  const TIME = { x: 540, y: 1460, s: 0.8 }; // R = 96
  const ZOOM0 = 2.5 / TIME.s; // the match cut: s 2.5 on screen at (540, 960)
  const ZOOM_DUR = 0.35;
  const N_X = 190, N_W = 700, N_H = 160, N_STEP = 172, N_TOP = 500;
  const HIT = 3 * BEAT; // 1.25 uppercut
  const L0 = HIT - 0.05; // Time launches 3 frames early so the glove connects on the beat

  const BZ = [
    { title: 'BTC -5% in 10 min', time: 'now' },
    { title: 'Liquidation alert!', time: 'now' },
    { title: 'New listing: PEPE2', time: 'now' },
    { title: 'Funding rate spiked', time: 'now' },
    { title: 'Whale moved 900 BTC', time: 'now' },
  ];
  const ARR = BZ.map((_, k) => (k + 1) * EIGHTH); // 0.208 .. 1.042
  const MINE = [
    { title: 'Gym at 7', app: 'Calendar' },
    { title: 'Dinner with family', app: 'Calendar' },
    { title: 'Sleep', app: 'Reminders' },
  ];

  // eased arrival progress (with overshoot) of notification k
  const arrive = (t, k) => (t < ARR[k] - 1e-6 ? 0 : E.outBack(clamp((t - ARR[k] + 1 / 60) / 0.2)));
  const pushCount = (t, from) => { let s = 0; for (let j = from; j < ARR.length; j++) s += arrive(t, j); return s; };

  // ---- icons ----
  const bzIcon = (t) => (ctx, size) => { CAST.birzha(ctx, { x: 0, y: 0, s: size / 240, t, face: 'laugh', greedy: true }); };
  const timeIcon = (t) => (ctx, size) => { CAST.time(ctx, { x: 0, y: 0, s: size / 240, t, face: 'calm', ring: 1 }); };

  /** the same card drawn flat (no canvas blur) for the spinning pieces after the uppercut */
  function flatNotification(ctx, x, y, o) {
    ctx.fillStyle = 'rgba(27,21,48,0.18)';
    F.rrect(ctx, x + 6, y + 14, N_W, N_H, N_H * 0.28); ctx.fill();
    F.card(ctx, x, y, N_W, N_H, { r: N_H * 0.28, fill: '#ffffff', shadow: false });
    const isz = N_H * 0.5;
    ctx.save(); ctx.translate(x + N_H * 0.18 + isz / 2, y + N_H / 2); o.icon(ctx, isz); ctx.restore();
    const tx = x + N_H * 0.18 + isz + N_H * 0.16;
    F.text(ctx, o.app.toUpperCase(), tx, y + N_H * 0.25, { size: N_H * 0.14, fill: 'rgba(27,21,48,0.62)', align: 'left', rounded: false, font: 'sans' });
    F.text(ctx, o.title, tx, y + N_H * 0.62, { size: 38, fill: o.color || C.ink, align: 'left', rounded: false });
  }

  /** a notification card via FILM.fx.notif with a bigger, bolder title on top */
  function notification(ctx, x, y, o) {
    F.notif(ctx, x, y, N_W, { h: N_H, icon: o.icon, app: o.app, time: o.time, alpha: o.alpha });
    ctx.save();
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    F.text(ctx, o.title, x + N_H * 0.18 + N_H * 0.5 + N_H * 0.16, y + N_H * 0.62, { size: 38, fill: o.color || C.ink, align: 'left', rounded: false });
    ctx.restore();
  }

  // ---- flying notification after the uppercut ----
  function flyState(k, i0x, i0y, age) {
    const cx = i0x + N_W / 2, cy = i0y + N_H / 2;
    const dx = cx - 540 + (F.h01(ID, 'fx', k) - 0.5) * 500;
    const dir = Math.sign(dx || (k % 2 ? 1 : -1));
    const vx = dir * (900 + F.h01(ID, 'vx', k) * 900);
    const vy = -(900 + F.h01(ID, 'vy', k) * 900) - (5 - k) * 120;
    const spin = dir * (5 + F.h01(ID, 'sp', k) * 6);
    return { x: cx + vx * age, y: cy + vy * age + 0.5 * 2600 * age * age, rot: spin * age };
  }

  function draw(ctx, tIn, info) {
    const t = Math.min(Math.max(tIn, 0), info.dur);
    const W = FILM.W, H = FILM.H;

    // camera: zoom out from Time's face
    const ez = E.outCubic(clamp(t / ZOOM_DUR));
    const z = lerp(ZOOM0, 1, ez);
    const ax = lerp(540, TIME.x, ez), ay = lerp(960, TIME.y, ez);
    const sk = F.shakeMany(t, [[HIT, 0.4, 26], ...ARR.map((a) => [a, 0.12, 4])], 51);

    ctx.save();
    ctx.translate(sk[0], sk[1]);
    ctx.translate(ax, ay);
    ctx.scale(z, z);
    ctx.translate(-TIME.x, -TIME.y);

    // 1 background
    F.stripes(ctx, { colorA: '#ffd6e4', colorB: '#ffc6da', width: 70, angle: -0.6, offset: t * 60 });
    F.floaties(ctx, { n: 14, seed: 505, t, alpha: 0.75, size: 30 });

    // 2 биржа on the phone's top edge, slamming a glove down on every 8th
    const bzX = 790, bzBase = 190;
    const tapIdx = Math.floor((t + 0.0001) / EIGHTH);
    const tapAge = t - tapIdx * EIGHTH;
    const hop = t < HIT ? -Math.sin(clamp(tapAge / EIGHTH) * Math.PI) * 26 : 0;
    const knock = t >= HIT ? seg(t, HIT, HIT + 0.35, 'outCubic') : 0;
    const bzY = bzBase - 60 + hop - knock * 70;
    const [bsx, bsy] = t < HIT ? F.squash(t, tapIdx * EIGHTH, 0.18, 0.2) : F.squash(t, HIT, -0.3, 0.4);
    const gAng = tapAge / EIGHTH;
    CAST.birzha(ctx, {
      x: bzX, y: bzY, s: 0.62, t, sx: bsx, sy: bsy, rot: knock * 0.5,
      face: t < HIT ? 'laugh' : 'shocked', greedy: t < HIT, jaw: t < HIT ? 0.35 + 0.35 * Math.sin(t * 22) * 0.5 + 0.15 : 0.6,
      gloves: t < HIT ? { l: [bzX - 110, bzBase + 20 - Math.abs(Math.sin(gAng * Math.PI)) * 50], r: [bzX + 95, bzBase - 30] } : { l: [bzX - 120, bzY - 90], r: [bzX + 110, bzY - 100] },
    });

    // 3 phone + lock screen
