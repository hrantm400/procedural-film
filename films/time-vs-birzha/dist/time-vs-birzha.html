    const vib = t < HIT ? F.beatPulse(t, EIGHTH, 0.05) * 0.008 * Math.sin(t * 120) : 0;
    const phoneRot = vib + (t >= HIT ? F.squash(t, HIT, 0.05, 0.5)[0] - 1 : 0) * 0.3;
    // cheap soft shadow instead of a 60 px canvas blur on the whole phone
    ctx.save();
    ctx.translate(PH.cx, PH.cy); ctx.rotate(phoneRot); ctx.translate(-PH.cx, -PH.cy);
    ctx.fillStyle = 'rgba(120,30,80,0.10)';
    F.rrect(ctx, PH.cx - PH.w / 2 - 14, PH.cy - PH.h / 2 + 10, PH.w + 28, PH.h + 40, PH.w * 0.17); ctx.fill();
    F.rrect(ctx, PH.cx - PH.w / 2 - 4, PH.cy - PH.h / 2 + 18, PH.w + 8, PH.h + 18, PH.w * 0.16); ctx.fill();
    ctx.restore();
    F.phone(ctx, PH.cx, PH.cy, PH.w, PH.h, {
      rot: phoneRot, shadow: false,
      screenBg: '#2a1f5c',
      screen: (c, sw, sh) => lockScreen(c, sw, sh, t),
    });
    // re-draw биржа's front glove over the phone edge so it reads as tapping on it
    if (t < HIT) CAST.glove(ctx, bzX - 110, bzBase + 20 - Math.abs(Math.sin(gAng * Math.PI)) * 50, 0.62 * 0.95, Math.PI * 0.62, C.bzGlove, C.bzGlove2);

    // tap pings
    ARR.forEach((a, k) => { F.shockRing(ctx, bzX - 110, bzBase + 30, t - a, { r: 90, width: 8, color: '#ffffff', life: 0.3 }); });

    // 4 Time
    drawTime(ctx, t);

    // 5 flying notifications + BAM
    if (t >= HIT) {
      const age = t - HIT;
      for (let k = BZ.length - 1; k >= 0; k--) {
        const slot = pushCount(HIT, k + 1);
        const y0 = N_TOP + slot * N_STEP + PH.cy - 1000;
        const s = flyState(k, N_X, y0, age + 0.035);
        if (s.y > 1300) continue; // never let text land in the bottom strip
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);
        const sc = 1 - age * 0.35;
        ctx.scale(sc, sc);
        flatNotification(ctx, -N_W / 2, -N_H / 2, { icon: bzIcon(t), app: 'Charts', title: BZ[k].title, color: C.bzDeep });
        ctx.restore();
      }
      F.focusLines(ctx, 540, 1180, { inner: 260, count: 48, color: '#ffffff', alpha: 0.7 * (1 - seg(t, HIT, HIT + 0.3)), t });
      F.shockRing(ctx, 560, 1180, age, { r: 420, width: 26, color: '#ffffff', life: 0.45 });
      F.impactStar(ctx, 560, 1150, t, HIT, { word: 'BAM!', size: 200, life: 0.42, color: C.yellow, rot: -0.15 });
      F.confettiBurst(ctx, 560, 1150, age, { n: 34, seed: 55, power: 1500, life: 1.0 });
    }
    ctx.restore();

    // 6 screen-fixed overlay
    const lp = F.popIn(t, 0.3, 0.5);
    if (lp > 0.001) {
      ctx.save();
      ctx.translate(108, 262);
      ctx.rotate(-0.06);
      ctx.scale(lp, lp);
      F.dropShadow(ctx, (c) => F.label(c, 'ROUND 4', 0, 0, { size: 44, bg: C.ink, color: C.yellow, align: 'left' }), { dy: 8, blur: 14 });
      ctx.restore();
    }
    // exit: brighten toward the flash of the next shot
    const wh = seg(t, info.dur - 0.12, info.dur, 'inQuad');
    if (wh > 0) { ctx.save(); ctx.globalAlpha = wh * 0.7; ctx.fillStyle = '#ffffff'; ctx.fillRect(-200, -200, W + 400, H + 400); ctx.restore(); }
  }

  // ---- lock screen (screen-local coords, origin = screen top-left) ----
  function lockScreen(ctx, sw, sh, t) {
    const ox = PH.cx - PH.w / 2 + PH.w * 0.04, oy = PH.cy - PH.h / 2 + PH.w * 0.04; // screen origin in world
    ctx.fillStyle = F.linGrad(ctx, 0, 0, 0, sh, [[0, '#1d1650'], [0.45, '#4a2f9a'], [0.8, '#8a4fc4'], [1, '#e07ab8']]);
    ctx.fillRect(0, 0, sw, sh);
    // moon glow + stars
    ctx.fillStyle = F.radGrad(ctx, sw * 0.78, sh * 0.2, 10, 360, [[0, 'rgba(255,240,200,0.35)'], [1, 'rgba(255,240,200,0)']]);
    ctx.fillRect(0, 0, sw, sh);
    ctx.fillStyle = '#fff6d8';
    ctx.beginPath(); ctx.arc(sw * 0.78, sh * 0.2, 54, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a3a9a';
    ctx.beginPath(); ctx.arc(sw * 0.78 + 26, sh * 0.2 - 14, 50, 0, TAU); ctx.fill();
    for (let i = 0; i < 26; i++) {
      const x = F.h01(ID, 'stx', i) * sw, y = F.h01(ID, 'sty', i) * sh * 0.75;
      const tw = 0.5 + 0.5 * Math.sin(t * 6 + i * 2.1);
      F.sparkle(ctx, x, y, (4 + F.h01(ID, 'str', i) * 8) * (0.5 + tw * 0.6), { color: 'rgba(255,255,255,0.8)' });
    }
    // rolling hills at the bottom of the wallpaper
    ctx.fillStyle = '#3a2470';
    ctx.beginPath(); ctx.moveTo(0, sh); ctx.lineTo(0, sh * 0.86);
    ctx.quadraticCurveTo(sw * 0.3, sh * 0.8, sw * 0.6, sh * 0.87); ctx.quadraticCurveTo(sw * 0.85, sh * 0.92, sw, sh * 0.85); ctx.lineTo(sw, sh); ctx.fill();

    F.statusBar(ctx, sw, { time: '', color: '#ffffff', battery: 0.12 });
    // lock + date + clock (world y: 270, 320, 400)
    const wy = (y) => y - oy, wx = (x) => x - ox;
    ctx.save();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(wx(540), wy(268), 13, Math.PI, 0); ctx.stroke();
    F.rrect(ctx, wx(540) - 19, wy(268), 38, 28, 6); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.restore();
    F.text(ctx, 'Wednesday, 3 AM', wx(540), wy(340), { size: 34, fill: 'rgba(255,255,255,0.85)', rounded: false, font: 'sans' });
    const cp = F.beatPulse(t, 0, 0.1) * 0.03;
    F.text(ctx, '03:47', wx(540), wy(430), { size: 150, fill: '#ffffff', font: 'sans', weight: 700, rounded: false, scale: 1 + cp });

    // stacked notifications (newest on top). Time's own get shoved off the bottom.
    const push = pushCount(t, 0);
    MINE.forEach((m, i) => {
      const slot = i + push;
      let y = N_TOP + slot * N_STEP, x = N_X, rot = 0, a = 1;
      const fallAt = 4.4; // once shoved past this slot it tumbles away
      if (slot > fallAt) {
        // time since it crossed fallAt (find from arrivals: approximate with slot overshoot)
        const u = clamp((slot - fallAt) / 0.6);
        const dir = i % 2 ? 1 : -1;
        x += dir * u * 380;
        y += u * u * 160;
        rot = dir * u * 0.7;
        a = 1 - u;
      }
      if (a <= 0.01 || y > 1260) return;
      ctx.save();
      ctx.translate(wx(x + N_W / 2), wy(y + N_H / 2));
      ctx.rotate(rot);
      notification(ctx, -N_W / 2, -N_H / 2, { icon: timeIcon(t), app: m.app, time: '1h', title: m.title, alpha: a, color: C.timeDeep });
      ctx.restore();
    });
    if (t < HIT) {
      for (let k = BZ.length - 1; k >= 0; k--) {
        const ap = arrive(t, k);
        if (ap <= 0) continue;
        const slot = pushCount(t, k + 1);
        const y = N_TOP + slot * N_STEP - (1 - ap) * 200;
        ctx.save();
        ctx.translate(wx(N_X + N_W / 2), wy(y + N_H / 2));
        const sc = 0.85 + 0.15 * ap;
        ctx.scale(sc, sc);
        notification(ctx, -N_W / 2, -N_H / 2, { icon: bzIcon(t), app: 'Charts', time: 'now', title: BZ[k].title, alpha: clamp(ap * 2.5), color: C.bzDeep });
        ctx.restore();
        // red count badge on the newest one
      }
      const nArr = ARR.filter((a) => t >= a - 1e-6).length;
      if (nArr > 0) {
        const bp = F.pop(t, ARR[nArr - 1], 0.25);
        ctx.save();
        ctx.translate(wx(N_X + N_W - 6), wy(N_TOP + 6));
        ctx.scale(bp, bp);
        F.badge(ctx, 0, 0, String(nArr * 19 + 4), { size: 30 });
        ctx.restore();
      }
    }
    // bottom: flashlight + camera buttons + home indicator
    [[wx(250), wy(1690)], [wx(830), wy(1690)]].forEach(([x, y]) => {
      ctx.fillStyle = 'rgba(20,14,48,0.45)';
      ctx.beginPath(); ctx.arc(x, y, 46, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      F.rrect(ctx, x - 12, y - 18, 24, 36, 6); ctx.fill();
    });
    F.rrect(ctx, wx(540) - 130, wy(1758), 260, 10, 5); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
  }

  // ---- Time ----
  function drawTime(ctx, t) {
    const R = 120 * TIME.s;
    let x = TIME.x, y = TIME.y, sx = 1, sy = 1, rot = 0, face = 'dizzy', look = [0, 0], spin = 0;
    // dizzy spin decays out of the match cut
    spin = t * 25 * (1 - seg(t, 0.0, 0.55, 'outQuad')) + 0;
    if (t > 0.42) { face = 'shocked'; look = [0, -1]; }
    // startle hops on each ping
    ARR.forEach((a) => { if (t < HIT - 0.22) { const [a1, b1] = F.squash(t, a, 0.12, 0.2); sx *= a1; sy *= b1; } });
    const crouch = seg(t, HIT - 0.24, HIT - 0.02, 'outCubic');
    if (t >= HIT - 0.24) { face = 'angry'; look = [0, -1]; }
    // anticipation: crouch down and wide
    sx *= 1 + crouch * 0.16; sy *= 1 - crouch * 0.2;
    y += crouch * R * 0.2;
    let gl, gr;
    const gIn = seg(t, 0.38, 0.6, 'outBack');
    if (t < L0) {
      // guard -> pulled down low for the uppercut
      gl = [x - R * 1.15, y - R * 0.25 + crouch * R * 0.4];
      gr = [x + R * 1.2 + crouch * R * 0.2, y - R * 0.1 + crouch * R * 0.9];
      // fade gloves in from the shoulders after the zoom
      const sh = [x - R * 0.9, y], shr = [x + R * 0.9, y];
      gl = [lerp(sh[0], gl[0], gIn), lerp(sh[1], gl[1], gIn)];
      gr = [lerp(shr[0], gr[0], gIn), lerp(shr[1], gr[1], gIn)];
    }
    let jumpY = 0;
    if (t >= L0) {
      const age = t - L0;
      const up = E.outCubic(clamp(age / 0.12));
      const fall = Math.max(0, age - 0.2);
      jumpY = -up * 230 + fall * fall * 900;
      const [a1, b1] = F.squash(t, L0, -0.28, 0.45);
      sx = a1; sy = b1;
      rot = -0.12 * (1 - seg(t, HIT + 0.1, HIT + 0.4));
      face = 'angry';
      look = [0.2, -1];
    }
    y += jumpY;
    if (t >= L0) {
      gl = [x - R * 1.15, y + R * 0.1];
      const reach = E.outBack(clamp((t - L0 + 1 / 60) / 0.08));
      gr = [x + R * 0.55, y - R * lerp(0.4, 2.0, reach)];
      // motion trail behind the launch
      const age = t - L0;
      if (age < 0.3) {
        const pts = [0.12, 0.08, 0.04].map((d) => {
          const a = Math.max(0, age - d), u2 = E.outCubic(clamp(a / 0.12));
          return [x, TIME.y - u2 * 230];
        });
        F.motionTrail(ctx, (c, px, py) => CAST.time(c, { x: px, y: py, s: TIME.s, silhouette: 'rgba(120,210,255,0.8)', ring: 0.3 }), pts, { alpha: 0.6 * (1 - age / 0.3) });
      }
    }
    // contact shadow
    ctx.fillStyle = 'rgba(10,6,30,0.35)';
    F.ellipse(ctx, TIME.x, TIME.y + R + 6, R * 0.8 * (1 - clamp(-jumpY / 400)), R * 0.14); ctx.fill();
    CAST.time(ctx, {
      x, y, s: TIME.s, sx, sy, rot, t, face, look, spin, ring: 0.3,
      gloves: gIn > 0.001 || t >= L0 ? { l: gl, r: gr } : undefined,
    });
    if (gIn > 0 && gIn < 1) F.puffs(ctx, x, y, t - 0.38, { n: 6, size: 26, spread: 150, life: 0.35, seed: 7 });
    if (t < 0.5) F.dizzyStars(ctx, x, y - R * 1.1, t, { r: R * 0.9, n: 3, color: C.yellow });
    if (t >= HIT - 0.24) F.anger(ctx, x + R * 0.75, y - R * 0.85, 1.1 + 0.15 * Math.sin(t * 30));
    else if (t > 0.45) F.sweat(ctx, x - R * 0.85, y - R * 0.7 + ((t * 120) % 30), 0.9);
  }

  FILM.scene({ id: ID, draw });
})();

</script>
<script>
// ---- src/scenes/06-top-brawl.js
// 06 top-brawl: "Final round: the #1 spot" (global T 8.333 - 11.667, 2 bars, 200 frames)
// Opens on a white flash (transitionIn). Yellow sunburst, podium, a crown over the #1 step.
// Bar 1: Time and биржа tug-of-war on the crown; it flips to a new holder on every beat (0, 1, 2),
//   the holder's health bar flashes. Beat 3 (t = 1.25): they collide into a cartoon dust cloud brawl
//   (gloves, clock hands, candles, % signs, stars popping out), POW! / BAM! / WHAM! on each beat,
//   both health bars drop, Time's rim (0.15) blinks red.
// Bar 2 last beat (t = 2.917 .. 3.333): a green LiquidityScan scan beam sweeps DOWN; above it the frame
//   freezes and desaturates. The shot ends with the beam at the bottom.
// Layers, back to front (inside scene()):
//   1 sunburst + floaties   2 podium + floor   3 crown   4 fighters / dust cloud   5 impact FX
//   6 HUD: health bars, FINAL ROUND label      then the scan-beam freeze composite on top.
(function () {
  'use strict';
  const ID = 'top-brawl';
  const FILM = window.FILM;
  const F = FILM.fx;
  const CAST = FILM.cast;
  const C = F.pal;
  const E = F.E;
  const TAU = Math.PI * 2;
  const clamp = F.clamp, lerp = F.lerp, seg = F.seg;
  const BEAT = F.BEAT;
  const b = (n) => n * BEAT;

  const GROUND = 1520, POD_W = 280;
  const STEP1 = GROUND - 320; // top of #1
  const S = 0.9, R = 120 * S;
  const CS = 0.8; // crown scale during the tug
  const COLLIDE = b(3); // 1.25
  const BEAM0 = b(7); // 2.917
  const CLOUD = { x: 540, y: 1040, r: 280 };
  const WORDS = [['POW!', 300, 850, -0.2], ['BAM!', 790, 900, 0.16], ['WHAM!', 320, 1250, 0.12], ['POW!', 770, 1240, -0.14], ['BAM!', 540, 780, 0.05]];
  const HITS = [b(3), b(4), b(5), b(6), b(7)];

  // crown holder per beat in bar 1: -1 Time (left), +1 биржа (right)
  const HOLD = [-1, 1, -1];

  function holderSide(t) {
    // eased crown side: snaps toward the new holder on each beat with overshoot
    let side = HOLD[0];
    for (let i = 1; i < HOLD.length; i++) {
      const k = t < b(i) - 1e-6 ? 0 : E.outBack(clamp((t - b(i) + 1 / 60) / 0.16));
      side = lerp(side, HOLD[i], k);
    }
    return side;
  }
  const holderIdx = (t) => HOLD[Math.min(HOLD.length - 1, Math.max(0, Math.floor((t + 1e-6) / BEAT)))];

  // health: Time is already low, both drop on every brawl beat
  function health(t, who) {
    const start = who === 'time' ? 0.42 : 0.82;
    const per = who === 'time' ? 0.075 : 0.1;
    let v = start, g = start;
    HITS.forEach((h, i) => {
      if (i > 3) return;
      v -= per * E.outCubic(clamp((t - h) / 0.08));
      g -= per * E.inOutCubic(clamp((t - h - 0.18) / 0.3));
    });
    return { v, g };
  }

  // ---- things popping out of the brawl cloud (drawn pointing up = outward) ----
  const POPS = [
    (c) => CAST.glove(c, 0, -40, 0.75, -Math.PI / 2, C.timeGlove, C.timeGlove2),
    (c) => { F.candle(c, 0, -20, -110, -135, 5, 34, { up: true }); },
    (c) => F.text(c, '%', 0, -50, { size: 90, fill: C.bzRed }),
    (c) => CAST.glove(c, 0, -40, 0.75, -Math.PI / 2, C.bzGlove, C.bzGlove2),
    (c) => { c.strokeStyle = C.timeNavy; c.lineCap = 'round'; c.lineWidth = 14; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -110); c.stroke(); c.fillStyle = C.timeBlue; c.beginPath(); c.arc(0, 0, 12, 0, TAU); c.fill(); },
    (c) => { c.fillStyle = C.yellow; F.star(c, 0, -50, 40, 17, 5); c.fill(); },
    (c) => { F.candle(c, 0, -110, -20, -135, 5, 34, { up: false }); },
    (c) => F.text(c, '%', 0, -50, { size: 80, fill: C.timeBlue }),
  ];

  /** the red alarm blink on the empty part of Time's rim */
  function rimAlarm(ctx, x, y, s, ring, t, rot) {
    const on = Math.sin(t * TAU * 4) > 0;
    if (!on) return;
    const r = 120 * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    ctx.strokeStyle = 'rgba(255,59,92,0.9)';
    ctx.lineWidth = r * 0.17;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.9, -Math.PI / 2 + 0.05, -Math.PI / 2 + (1 - ring) * TAU - 0.05);
    ctx.stroke();
    ctx.restore();
  }

  function healthHUD(ctx, t) {
    const ht = health(t, 'time'), hb = health(t, 'bz');
    const fl = t < COLLIDE ? F.beatPulse(t, 0, 0.14) : 0;
    const who = t < COLLIDE ? holderIdx(t) : 0;
    const y = 250, h = 38, w = 380;
    // glow behind the holder's bar
    if (fl > 0.02 && who) {
      ctx.save();
      ctx.globalAlpha = fl;
      ctx.fillStyle = who < 0 ? C.timeCyan : C.bzYellow;
      F.rrect(ctx, (who < 0 ? 90 : 610) - 22, y - 22, w + 44, h + 44, 26); ctx.fill();
      ctx.restore();
    }
    const sl = who < 0 ? 1 + fl * 0.06 : 1, sr = who > 0 ? 1 + fl * 0.06 : 1;
    ctx.save(); ctx.translate(280, y + h / 2); ctx.scale(sl, sl); ctx.translate(-280, -(y + h / 2));
    F.healthBar(ctx, 90, y, w, h, ht.v, { color: C.timeBlue, color2: who < 0 && fl > 0.5 ? '#ffffff' : C.timeCyan, ghost: ht.g, label: 'TIME', labelColor: C.timeDeep });
    ctx.restore();
    ctx.save(); ctx.translate(800, y + h / 2); ctx.scale(sr, sr); ctx.translate(-800, -(y + h / 2));
    F.healthBar(ctx, 610, y, w, h, hb.v, { color: C.bzOrange, color2: who > 0 && fl > 0.5 ? '#ffffff' : C.bzYellow, ghost: hb.g, flip: true, label: 'CHARTS', labelColor: C.bzDeep });
    ctx.restore();
    // FINAL ROUND pill
    const lp = F.popIn(t, 0, 0.5);
    ctx.save();
    ctx.translate(540, 420);
    ctx.rotate(-0.03 + Math.sin(t * 3) * 0.015);
    ctx.scale(lp, lp);
    F.dropShadow(ctx, (c) => F.label(c, 'FINAL ROUND', 0, 0, { size: 50, bg: C.ink, color: C.yellow }), { dy: 8, blur: 14 });
    ctx.restore();
  }

  function fighters(ctx, t) {
    const side = holderSide(t);
    const beatI = Math.min(2, Math.floor((t + 1e-6) / BEAT));
    const yankAge = t - b(beatI);
    // anticipation before the collision: crown slips away, they wind back, then dash
    const wind = seg(t, b(2) + 0.18, COLLIDE - 0.08, 'outCubic');
    const dash = seg(t, COLLIDE - 0.08, COLLIDE, 'inCubic');
    const crownX = 540 + side * 55;
    const crownY = STEP1 - 2 * R - 40 + Math.sin(t * 8) * 4;
    const spread = wind * 70 - dash * 200;
    const bob = (k) => Math.sin(t * 9 + k) * 3;
    // Time (left)
    const tLean = (side < 0 ? -0.16 : 0.12) * (1 - wind) - wind * 0.15 + dash * 0.35;
    const tx = 395 - spread + side * 25 * (1 - wind), ty = STEP1 - R + bob(0) + wind * 10;
    // биржа (right)
    const bLean = (side > 0 ? 0.16 : -0.12) * (1 - wind) + wind * 0.15 - dash * 0.35;
    const bx = 685 + spread + side * 25 * (1 - wind), by = STEP1 - R + bob(2) + wind * 10;
    const [tsx, tsy] = beatI >= 0 && HOLD[beatI] < 0 ? F.squash(t, b(beatI), 0.18, 0.35) : F.squash(t, b(beatI), -0.12, 0.35);
    const [bsx, bsy] = HOLD[beatI] > 0 ? F.squash(t, b(beatI), 0.18, 0.35) : F.squash(t, b(beatI), -0.12, 0.35);
    const ws = 1 + wind * 0.12, wy = 1 - wind * 0.12;
    const ds = 1 + dash * 0.3, dy = 1 - dash * 0.2;
    // gloves: on the crown during the tug, pulled back while winding
    const ex = 100 * CS + 18;
    const cg = [crownX - ex, crownY - 40 * CS], cgr = [crownX + ex, crownY - 40 * CS];
    const tG = { l: [lerp(cg[0] - 10, tx - R * 1.3, wind), lerp(cg[1] + 40, ty - R * 0.2, wind)], r: [lerp(cg[0], tx + R * 1.1, wind), lerp(cg[1] - 20, ty - R * 0.4, wind)] };
    const bG = { l: [lerp(cgr[0], bx - R * 1.1, wind), lerp(cgr[1] - 20, by - R * 0.4, wind)], r: [lerp(cgr[0] + 10, bx + R * 1.3, wind), lerp(cgr[1] + 40, by - R * 0.2, wind)] };
    // trails while dashing
    if (dash > 0) {
      F.speedLines(ctx, { angle: 0, count: 14, color: '#ffffff', alpha: 0.8 * dash, t, y: STEP1 - 260, h: 220, len: 260, width: 10 });
    }
    CAST.time(ctx, { x: tx, y: ty, s: S, t, sx: tsx * ws * ds, sy: tsy * wy * dy, rot: tLean, ring: 0.15, face: t > b(2) + 0.18 ? 'angry' : side < 0 ? 'determined' : 'angry', look: [1, -0.4], gloves: tG, shadow: STEP1 + 4 });
    rimAlarm(ctx, tx, ty, S * Math.min(tsx * ws, tsy * wy), 0.15, t, tLean);
    CAST.birzha(ctx, { x: bx, y: by, s: S, t, sx: bsx * ws * ds, sy: bsy * wy * dy, rot: bLean, face: side > 0 && wind === 0 ? 'smug' : 'angry', greedy: side > 0 && wind === 0, look: [-1, -0.4], gloves: bG, shadow: STEP1 + 4 });
    // the crown, gripped (tilts toward the holder) until it slips up and floats
    if (t <= b(2) + 0.18) {
      const tilt = side * 0.12 + Math.sin(yankAge * 30) * Math.exp(-yankAge * 8) * 0.18;
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = F.radGrad(ctx, crownX, crownY - 40, 10, 170, [[0, 'rgba(255,255,255,0.95)'], [1, 'rgba(255,255,255,0)']]);
      ctx.fillRect(crownX - 180, crownY - 220, 360, 360);
      ctx.restore();
      F.crown(ctx, crownX, crownY, CS, { rot: tilt });
    }
    // yank effects
    for (let i = 1; i < 3; i++) {
      const sx = 540 + HOLD[i] * 120;
      F.puffs(ctx, sx, STEP1, t - b(i), { n: 5, size: 30, spread: 120, life: 0.4, seed: 20 + i });
      F.shockRing(ctx, crownX, crownY - 10, t - b(i), { r: 140, width: 10, life: 0.3 });
    }
    return { crownX, crownY, wind };
  }

  function floatingCrown(ctx, t, from) {
    // after the slip the crown pops up and floats over the brawl, sparkling
    const a = seg(t, b(2) + 0.18, b(2) + 0.6, 'outBack');
    const x = lerp(from[0], 540, a);
    const y = lerp(from[1], 690, a) + Math.sin(t * 4) * 10 * a;
    const rot = lerp(0, TAU, seg(t, b(2) + 0.18, b(2) + 0.6, 'outCubic')) + Math.sin(t * 3) * 0.08;
    ctx.save();
    ctx.globalAlpha = 0.6 * a;
    ctx.fillStyle = F.radGrad(ctx, x, y - 50, 10, 200, [[0, 'rgba(255,255,255,0.9)'], [1, 'rgba(255,255,255,0)']]);
    ctx.fillRect(x - 220, y - 270, 440, 440);
    ctx.restore();
    F.crown(ctx, x, y, CS + 0.1 * a, { rot });
    F.sparkles(ctx, { x: x - 160, y: y - 180, w: 320, h: 200, n: 6, t, seed: 61, size: 20 });
  }

  function brawl(ctx, t) {
    const age = t - COLLIDE;
    const g = 0.55 + 0.45 * F.popIn(t, COLLIDE, 0.3);
    // impact frame: a white starburst for the first few frames
    if (age < 0.1) F.burst(ctx, CLOUD.x, CLOUD.y, 520 * (1 - age * 3), 300 * (1 - age * 3), 14, '#ffffff', { seed: 77, rot: age * 3 });
    // the cloud throbs on every beat
    const thump = HITS.reduce((m, h) => Math.max(m, t >= h ? Math.exp(-(t - h) * 9) : 0), 0);
    const r = CLOUD.r * g * (1 + thump * 0.1);
    const cx = CLOUD.x + Math.sin(t * 7) * 16 + Math.sin(t * 17) * 6, cy = CLOUD.y - Math.abs(Math.sin(t * 9)) * 16;
    // action lines around the cloud
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const per = 0.3, u = ((t / per + F.h01(ID, 'al', i)) % 1 + 1) % 1, cyc = Math.floor(t / per + F.h01(ID, 'al', i));
      const ang = F.h01(ID, 'aa', i, cyc) * TAU;
      const d0 = r * (1.05 + u * 0.4), d1 = d0 + 60 + 50 * F.h01(ID, 'ad', i);
      ctx.globalAlpha = Math.sin(u * Math.PI) * g;
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * d0, cy + Math.sin(ang) * d0 * 0.8);
      ctx.lineTo(cx + Math.cos(ang) * d1, cy + Math.sin(ang) * d1 * 0.8);
      ctx.stroke();
    }
    ctx.restore();
    // a darker rim layer so the cloud reads on the light background
    F.dustCloud(ctx, cx, cy + 8, r * 1.08, t + 0.4, { seed: 67, shade: '#e3c995', color: '#f0dcb4' });
    F.dustCloud(ctx, cx, cy, r, t, { seed: 66, pops: POPS, shade: '#f6e9cc', color: '#fffdf6' });
    // limbs punching out of the cloud on 8ths: alternating Time / биржа gloves and Time's clock hands
    for (let i = 0; i < 8; i++) {
      const t0 = COLLIDE + i * BEAT / 2 + 0.05;
      const u = (t - t0) / 0.22;
      if (u <= 0 || u >= 1) continue;
      const ang = -Math.PI * 0.95 + F.h01(ID, 'pa', i) * Math.PI * 1.6 + (i % 2 ? 0.4 : 0);
      const reach = Math.sin(u * Math.PI);
      const d0 = r * 0.6, d = r * (0.75 + reach * 0.45);
      const px = cx + Math.cos(ang) * d, py = cy + Math.sin(ang) * d * 0.85;
      const bx0 = cx + Math.cos(ang) * d0, by0 = cy + Math.sin(ang) * d0 * 0.85;
      ctx.save();
      ctx.strokeStyle = C.ink; ctx.lineCap = 'round'; ctx.lineWidth = 11;
      ctx.beginPath(); ctx.moveTo(bx0, by0); ctx.lineTo(px, py); ctx.stroke();
      ctx.restore();
      const time = i % 2 === 0;
      CAST.glove(ctx, px, py, 0.85, Math.atan2(py - by0, px - bx0), time ? C.timeGlove : C.bzGlove, time ? C.timeGlove2 : C.bzGlove2);
    }
    // heads poking out of the rim on alternating beats
    const peeks = [[b(3) + 0.12, 'time', -2.5], [b(4) + 0.12, 'bz', -0.55], [b(5) + 0.12, 'time', -2.9], [b(6) + 0.12, 'bz', -0.3]];
    peeks.forEach(([t0, who, ang]) => {
      const u = (t - t0) / 0.3;
      if (u <= 0 || u >= 1) return;
      const k = E.outBack(clamp(u * 2.4)) * (u > 0.75 ? 1 - (u - 0.75) / 0.25 : 1);
      const d = r * (0.62 + 0.38 * k);
      const x = cx + Math.cos(ang) * d, y = cy + Math.sin(ang) * d * 0.85;
      const rot = (ang + Math.PI / 2) * 0.5;
      ctx.save();
      ctx.translate(x, y); ctx.scale(Math.max(0.01, k), Math.max(0.01, k)); ctx.translate(-x, -y);
      if (who === 'time') {
        CAST.time(ctx, { x, y, s: 0.75, t, rot, ring: 0.15, face: 'hurt', spin: t * 30 });
        rimAlarm(ctx, x, y, 0.75, 0.15, t, rot);
        F.dizzyStars(ctx, x, y - 100, t, { r: 70 });
      } else CAST.birzha(ctx, { x, y, s: 0.75, t, rot, face: 'angry', jaw: 0.6 });
      ctx.restore();
    });
    // eyes blinking inside the cloud
    const eyeOn = Math.sin(t * 11) > -0.3;
    if (eyeOn && g > 0.9) {
      [[cx - 90, cy - 20, C.timeBlue], [cx + 90, cy + 30, C.bzOrange]].forEach(([ex, ey, col]) => {
        ctx.fillStyle = '#ffffff';
        F.ellipse(ctx, ex - 18, ey, 14, 19); ctx.fill();
        F.ellipse(ctx, ex + 18, ey, 14, 19); ctx.fill();
        ctx.fillStyle = col;
        F.ellipse(ctx, ex - 16, ey + 3, 8, 12); ctx.fill();
        F.ellipse(ctx, ex + 20, ey + 3, 8, 12); ctx.fill();
      });
    }
    F.puffs(ctx, CLOUD.x, STEP1, age, { n: 8, size: 60, spread: 360, life: 0.6, seed: 9, color: '#fff7e0' });
    F.shockRing(ctx, CLOUD.x, CLOUD.y, age, { r: 520, width: 30, life: 0.5 });
    F.confettiBurst(ctx, CLOUD.x, CLOUD.y - 100, age, { n: 30, power: 1400, life: 1.2, seed: 33 });
  }

  // one complete frame of the scene at local time tt
  function scene(ctx, tt, live) {
    const W = FILM.W, H = FILM.H;
    const sk = live ? F.shakeMany(tt, HITS.slice(0, 4).map((h, i) => [h, 0.32, i === 0 ? 30 : 20]).concat([[0, 0.25, 18], [b(1), 0.15, 8], [b(2), 0.15, 8]]), 61) : [0, 0];
    ctx.save();
    ctx.translate(sk[0], sk[1]);
    // 1 background
    F.sunburst(ctx, 540, 700, { rays: 22, colorA: C.lemon, colorB: '#ffe58a', rot: tt * 0.25 });
    ctx.save();
    ctx.fillStyle = F.radGrad(ctx, 540, 760, 50, 900, [[0, 'rgba(255,255,255,0.55)'], [1, 'rgba(255,255,255,0)']]);
    ctx.fillRect(-200, -200, W + 400, H + 400);
    ctx.restore();
    F.floaties(ctx, { n: 16, seed: 606, t: tt, alpha: 0.7, size: 30 });
    // spotlight cone onto the #1 step
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.08 * Math.sin(tt * 5);
    ctx.fillStyle = F.linGrad(ctx, 0, 480, 0, STEP1, [[0, 'rgba(255,255,255,0)'], [1, 'rgba(255,255,255,0.85)']]);
    ctx.beginPath(); ctx.moveTo(470, 480); ctx.lineTo(610, 480); ctx.lineTo(820, STEP1 + 30); ctx.lineTo(260, STEP1 + 30); ctx.closePath(); ctx.fill();
    ctx.restore();
    // 2 floor + podium
    ctx.fillStyle = '#ffb36b';
    ctx.fillRect(-200, GROUND - 6, W + 400, H - GROUND + 260);
    ctx.fillStyle = '#ff9f55';
    ctx.fillRect(-200, GROUND - 6, W + 400, 18);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    for (let i = 0; i < 4; i++) ctx.fillRect(-200, GROUND + 70 + i * i * 40 + i * 50, W + 400, 6 + i * 3);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    F.ellipse(ctx, 540, GROUND + 40, 420, 34); ctx.fill();
    const bump = (k) => (tt >= COLLIDE ? F.squash(tt, HITS[k] || 99, 0.04, 0.3)[1] : 1);
    ctx.save();
    ctx.translate(540, GROUND); ctx.scale(1, bump(0) * bump(1) * bump(2) * bump(3)); ctx.translate(-540, -GROUND);
    F.podium(ctx, 540, GROUND, { w: POD_W, colors: [C.purple, C.timeBlue, C.pink] });
    ctx.restore();
    // 3/4 fighters, crown, brawl
    let from = [540, STEP1 - 200];
    if (tt < COLLIDE) {
      const f = fighters(ctx, tt);
      from = [f.crownX, f.crownY];
    } else {
      brawl(ctx, tt);
    }
    if (tt > b(2) + 0.18) floatingCrown(ctx, tt, [540 - 55, STEP1 - 2 * R - 40]);
    // 5 impact words
    HITS.forEach((h, i) => {
      const [w, x, y, rot] = WORDS[i];
      F.impactStar(ctx, x, y, tt, h, { word: w, size: 150, life: 0.4, rot, color: i % 2 ? C.timeCyan : C.yellow, seed: 3 + i });
    });
    // tug-of-war "yank" stars
    for (let i = 1; i < 3; i++) F.impactStar(ctx, 540 + HOLD[i] * 200, STEP1 - 330, tt, b(i), { size: 70, life: 0.25, color: '#ffffff', seed: 40 + i });
    // 6 HUD
    healthHUD(ctx, tt);
    ctx.restore();
  }

  function draw(ctx, tIn, info) {
    const t = Math.min(Math.max(tIn, 0), info.dur);
    const W = FILM.W, H = FILM.H;
    if (t < BEAM0) { scene(ctx, t, true); return; }
    const u = E.inOutSine(clamp((t - BEAM0) / (info.dur - BEAM0 - 1 / 60)));
    const by = lerp(-20, H + 10, u);
    // live part below the beam
    ctx.save();
    ctx.beginPath(); ctx.rect(-200, by, W + 400, H + 400); ctx.clip();
    scene(ctx, t, true);
    ctx.restore();
    // frozen, desaturated part above the beam
    if (by > 0) {
      ctx.save();
      ctx.beginPath(); ctx.rect(-200, -200, W + 400, by + 200); ctx.clip();
      scene(ctx, BEAM0, false);
      ctx.globalCompositeOperation = 'saturation';
      ctx.fillStyle = '#808080';
      ctx.fillRect(-200, -200, W + 400, by + 200);
      ctx.globalCompositeOperation = 'source-over';
      // teal tint + scan grid
      ctx.fillStyle = 'rgba(19,48,62,0.18)';
      ctx.fillRect(-200, -200, W + 400, by + 200);
      ctx.fillStyle = 'rgba(31,227,60,0.10)';
      for (let y = by - 8; y > -10; y -= 16) ctx.fillRect(0, y, W, 3);
      ctx.strokeStyle = 'rgba(31,227,60,0.14)'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 60; x < W; x += 120) { ctx.moveTo(x, 0); ctx.lineTo(x, by); }
      ctx.stroke();
      ctx.restore();
    }
    // the beam
    ctx.save();
    ctx.fillStyle = F.linGrad(ctx, 0, by - 260, 0, by, [[0, 'rgba(31,227,60,0)'], [1, 'rgba(31,227,60,0.45)']]);
    ctx.fillRect(-200, by - 260, W + 400, 260);
    ctx.fillStyle = F.linGrad(ctx, 0, by, 0, by + 90, [[0, 'rgba(31,227,60,0.55)'], [1, 'rgba(31,227,60,0)']]);
    ctx.fillRect(-200, by, W + 400, 90);
    ctx.fillStyle = C.lsGreen;
    ctx.fillRect(-200, by - 12, W + 400, 24);
    ctx.fillStyle = '#eaffee';
    ctx.fillRect(-200, by - 4, W + 400, 8);
    for (let i = 0; i < 14; i++) {
      const x = ((F.h01(ID, 'bx', i) * W + t * (300 + i * 40)) % W);
      F.sparkle(ctx, x, by + (F.h01(ID, 'by', i) - 0.5) * 30, 14 + 10 * Math.sin(t * 20 + i), { color: i % 2 ? '#ffffff' : C.lsGreen2 });
    }
    // end caps / edge brackets
    ctx.fillStyle = C.lsGreen;
    [[24, 1], [W - 24, -1]].forEach(([x, d]) => { F.rrect(ctx, x - 10, by - 40, 20, 80, 10); ctx.fill(); });
    ctx.restore();
  }

  FILM.scene({ id: ID, draw });
})();

</script>
<script>
// ---- src/scenes/07-ls-scan.js
// 07 'ls-scan': LiquidityScan finds the entry. Global T 11.667 .. 13.333 (1 bar, 100 frames).
// Real-app look (docs/brand): #eef3f7 background, white rounded cards, dark teal hero card with a
// radar, spaced uppercase mono labels, neon green active pills, white pill bottom nav.
// Layers (back to front):
//   1 light app background + faint grid + calm floaties
//   2 header row: Liqui|||Scan app wordmark + "LIVE" pill
//   3 teal hero card "LIVE ENGINE NETWORK" with the radar (sweep arm, blips) and the lsMark
//   4 white signal card: BTCUSDT chart, reticle locks on the entry candle (beat 1), ENTRY FOUND / 0.3s / LONG
//   5 Time + биржа, calm, Time's rim refills (beat 2), "+6h back"
//   6 "#1" pill, the mark hops onto it, crown lands, confetti (beat 3)
//   7 decorative bottom nav (icons only, below the text safe area)
//   8 continuity flash from 06's green scan beam (frame 0), light circle wipe into 08 (last 10 frames)
(function () {
  'use strict';
  const ID = 'ls-scan';
  const FILM = window.FILM;
  const F = FILM.fx;
  const C = F.pal;
  const E = F.E;
  const TAU = Math.PI * 2;
  const clamp = F.clamp, lerp = F.lerp, seg = F.seg;
  const BT = F.BEAT; // 0.41667
  const B1 = BT, B2 = BT * 2, B3 = BT * 3; // T 12.083, 12.5, 12.917
  const W = 1080, H = 1920;

  // layout
  const CARD = { x: 60, y: 330, w: 960, h: 470 }; // teal hero
  const SIG = { x: 60, y: 830, w: 960, h: 360 }; // signal card
  const RADAR = { x: 790, y: 565, r: 150 };
  const MS = 1.05, MR = 120 * MS; // mark scale and half-size
  const MARK0 = [270, 590]; // resting centre of the mark
  const PILL1 = { x: 270, y: 776, w: 180, h: 64 }; // "#1" pill (centre)
  const MARK1 = [270, PILL1.y - PILL1.h / 2 - MR]; // centre when standing on the pill
  const END = [540, 640], END_S = 1.4; // hand-off to 08 (mark centre and scale on the last frame)
  const TIMEP = [300, 1420], BZP = [790, 1420];

  const h01 = (...k) => F.h01(ID, ...k);
  const mono = (ctx, str, x, y, size, color, o = {}) =>
    F.text(ctx, str, x, y, Object.assign({ size, fill: color, font: 'mono', weight: 700, rounded: false, letter: size * 0.18 }, o));

  function pill(ctx, str, x, y, o = {}) {
    // app chip: mono spaced uppercase, centred at (x, y)
    const size = o.size || 30;
    const letter = o.letter == null ? size * 0.16 : o.letter;
    ctx.save();
    ctx.font = F.font(size, 'mono', 700);
    if ('letterSpacing' in ctx) ctx.letterSpacing = letter + 'px';
    const tw = ctx.measureText(str).width;
    ctx.restore();
    const pad = o.pad || size * 0.75;
    const dot = o.dot ? size * 0.75 : 0;
    const w = tw + pad * 2 + dot, h = size * 1.75;
    ctx.save();
    ctx.translate(x, y);
    const sc = o.scale == null ? 1 : o.scale;
    ctx.scale(sc * (o.sx || 1), sc * (o.sy || 1));
    if (o.alpha != null) ctx.globalAlpha *= clamp(o.alpha);
    const draw = (c) => { F.rrect(c, -w / 2, -h / 2, w, h, h / 2); c.fillStyle = o.bg || C.lsMint; c.fill(); };
    if (o.shadow) F.dropShadow(ctx, draw, { dy: 6, blur: 14, color: 'rgba(19,40,58,0.18)' }); else draw(ctx);
    if (o.border) { F.rrect(ctx, -w / 2, -h / 2, w, h, h / 2); ctx.strokeStyle = o.border; ctx.lineWidth = 3; ctx.stroke(); }
    if (o.dot) { ctx.fillStyle = o.dotColor || C.lsGreen; ctx.beginPath(); ctx.arc(-w / 2 + pad + size * 0.18, 0, size * 0.2, 0, TAU); ctx.fill(); }
    mono(ctx, str, dot / 2 + letter / 2, 1, size, o.color || C.lsGreenDark, { letter });
    ctx.restore();
    return { w, h };
  }

  // cheap flat soft shadow for the big cards (canvas shadowBlur on 960 px cards is the frame's main cost)
  function softShadow(ctx, x, y, w, h, r, a) {
    ctx.save();
    ctx.fillStyle = `rgba(19,40,58,${a * 0.6})`;
    F.rrect(ctx, x - 4, y + 10, w + 8, h + 12, r + 4); ctx.fill();
    ctx.fillStyle = `rgba(19,40,58,${a})`;
    F.rrect(ctx, x + 6, y + 12, w - 12, h + 4, r); ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  function background(ctx, t, T) {
    F.bgFill(ctx, C.lsBg);
    ctx.save();
    ctx.strokeStyle = 'rgba(19,40,58,0.05)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const off = (T * 12) % 90;
    for (let x = -off; x < W + 90; x += 90) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = -off; y < H + 90; y += 90) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    // soft green glow behind the hero
    ctx.fillStyle = F.radGrad(ctx, 540, 640, 50, 760, [[0, 'rgba(31,227,60,0.16)'], [1, 'rgba(31,227,60,0)']]);
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    F.floaties(ctx, { t: T, n: 10, seed: 707, colors: ['rgba(31,227,60,0.25)', 'rgba(33,83,95,0.14)', 'rgba(92,234,122,0.22)'] });
  }

  function header(ctx, t) {
    const k = E.outCubic(seg(t, -0.1, 0.3));
    ctx.save();
    ctx.globalAlpha *= k;
    ctx.translate(0, (1 - k) * -30);
    FILM.cast.lsWordmark(ctx, 92, 262, 56, { style: 'candles', align: 'left' });
    pill(ctx, 'LIVE', 900, 262, { size: 28, dot: true, bg: '#ffffff', border: 'rgba(31,122,58,0.25)', dotColor: F.beatPulse(t, 0, 0.2) > 0.4 ? C.lsGreen : C.lsGreenDark });
    ctx.restore();
  }

  function radar(ctx, t, ping) {
    const { x, y, r } = RADAR;
    ctx.save();
    // rings
    ctx.strokeStyle = 'rgba(31,227,60,0.28)';
    ctx.lineWidth = 3;
    [1, 0.72, 0.44].forEach((k) => { ctx.beginPath(); ctx.arc(x, y, r * k, 0, TAU); ctx.stroke(); });
    ctx.strokeStyle = 'rgba(31,227,60,0.12)';
    ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); ctx.stroke();
    // sweep wedge (fading slices) + arm
    const a = -Math.PI / 2 + t * TAU * 1.2;
    for (let i = 0; i < 14; i++) {
      ctx.fillStyle = `rgba(31,227,60,${0.16 * (1 - i / 14)})`;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, a - (i + 1) * 0.07, a - i * 0.07); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = C.lsGreen; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); ctx.stroke();
    // arc tail like the app icon
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(x, y, r * 0.72, a - 1.2, a); ctx.stroke();
    // blips
    for (let i = 0; i < 5; i++) {
      const ba = h01('ba', i) * TAU, br = r * (0.3 + h01('br', i) * 0.6);
      let d = ((a - ba) % TAU + TAU) % TAU; // time since the arm passed
      const k = Math.exp(-d * 1.6);
      ctx.fillStyle = `rgba(92,234,122,${0.25 + 0.75 * k})`;
      ctx.beginPath(); ctx.arc(x + Math.cos(ba) * br, y + Math.sin(ba) * br, 7 + 5 * k, 0, TAU); ctx.fill();
    }
    // centre dot
    ctx.fillStyle = C.lsGreen; ctx.beginPath(); ctx.arc(x, y, 12, 0, TAU); ctx.fill();
    // ping on lock (beat 1)
    if (ping >= 0 && ping < 0.6) F.shockRing(ctx, x, y, ping, { r: r * 1.3, color: C.lsGreen, life: 0.6, width: 8 });
    ctx.restore();
  }

  function heroCard(ctx, t) {
    const k = E.outBack(seg(t, -0.08, 0.3));
    const { x, y, w, h } = CARD;
    ctx.save();
    ctx.translate(540, y + h / 2);
    ctx.scale(lerp(0.9, 1, k), lerp(0.9, 1, k));
    ctx.translate(-540, -(y + h / 2));
        softShadow(ctx, x, y, w, h, 60, 0.12);
    F.rrect(ctx, x, y, w, h, 60); ctx.fillStyle = F.linGrad(ctx, x, y, x + w, y + h, [C.lsTealA, C.lsTealB]); ctx.fill();
    // faint concentric arcs like the app card
    ctx.save();
    F.rrect(ctx, x, y, w, h, 60); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 3;
    for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.arc(x + w + 40, y - 40, i * 150, 0, TAU); ctx.stroke(); }
    ctx.restore();
    // label
    ctx.fillStyle = C.lsGreen; ctx.beginPath(); ctx.arc(x + 58, y + 62, 10, 0, TAU); ctx.fill();
    mono(ctx, 'LIVE ENGINE NETWORK', x + 84, y + 63, 30, '#e8eef2', { align: 'left', letter: 5 });
    radar(ctx, t, t - B1);
    // stat under the radar
    const n = Math.round(lerp(546, 600, E.outCubic(seg(t, 0.05, 0.9))));
    mono(ctx, `${n} markets`, RADAR.x, y + h - 36, 28, 'rgba(232,238,242,0.75)', { letter: 2 });
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  const CN = 16, ENTRY_I = 9;
  // dip into the entry, then the rally (revealed after the lock)
  const CLOSES = [0.66, 0.7, 0.62, 0.66, 0.55, 0.5, 0.53, 0.4, 0.33, 0.2, 0.34, 0.42, 0.55, 0.62, 0.76, 0.86];
  function signalCard(ctx, t) {
    const { x, w, h } = SIG;
    const k = E.outBack(seg(t, -0.05, 0.36));
    const y = SIG.y + (1 - k) * 300;
    const a = clamp(seg(t, -0.05, 0.1));
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha *= a;
    softShadow(ctx, x, y, w, h, 48, 0.08);
    F.card(ctx, x, y, w, h, { r: 48, shadow: false });
    // header row
    mono(ctx, 'BTCUSDT', x + 44, y + 58, 40, C.lsInk, { align: 'left', letter: 1 });
    pill(ctx, '1H', x + 300, y + 58, { size: 24, bg: C.lsBg, color: C.lsSlate });
    const lock = t >= B1 - 1e-6;
    mono(ctx, lock ? '64,210.5' : '64,1' + String(80 + Math.floor(h01('px', Math.floor(t * 20)) * 19)) + '.0', x + w - 44, y + 58, 38, C.lsInk, { align: 'right', letter: 0 });
    // chart area
    const cx0 = x + 44, cy0 = y + 110, cw = 560, ch = 210;
    ctx.strokeStyle = 'rgba(19,40,58,0.06)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 3; i++) { ctx.moveTo(cx0, cy0 + (ch * i) / 3); ctx.lineTo(cx0 + cw, cy0 + (ch * i) / 3); }
    ctx.stroke();
    const lockT = t >= B1 - 1e-6;
    const shown = lerp(0, ENTRY_I + 1, seg(t, 0.06, 0.4, 'outCubic')) + (lockT ? (CN - ENTRY_I - 1) * seg(t, B1 + 0.05, B1 + 0.6, 'outCubic') : 0);
    const Y = (q) => cy0 + ch - q * ch;
    const cwid = cw / CN;
    for (let i = 0; i < CN; i++) {
      const kk = clamp(shown - i);
      if (kk <= 0) break;
      const op = i ? CLOSES[i - 1] : 0.6, cl = CLOSES[i] + (i === CN - 1 ? Math.sin(t * 9) * 0.01 : 0);
      const hi = Math.max(op, cl) + 0.03 + h01('hi', i) * 0.04, lo = Math.min(op, cl) - 0.03 - h01('lo', i) * 0.04 - (i === ENTRY_I ? 0.06 : 0);
      const mid = (op + cl) / 2, sc = E.outBack(kk);
      F.candle(ctx, cx0 + (i + 0.5) * cwid, Y(lerp(mid, op, sc)), Y(lerp(mid, cl, sc)), Y(lerp(mid, hi, sc)), Y(lerp(mid, lo, sc)), cwid * 0.56);
    }
    const ex = cx0 + (ENTRY_I + 0.5) * cwid;
    const ey = Y((CLOSES[ENTRY_I - 1] + CLOSES[ENTRY_I]) / 2);
    // entry line + label after lock
    if (lock) {
      const lk = E.outCubic(seg(t, B1, B1 + 0.25));
      ctx.save();
      ctx.setLineDash([10, 9]);
      ctx.strokeStyle = C.lsGreenDark; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx0, ey); ctx.lineTo(cx0 + cw * lk, ey); ctx.stroke();
      ctx.restore();
    }
    // reticle: flies in 0.2 .. B1 and locks
    if (t > 0.18) {
      const u = seg(t, 0.18, B1, 'inOutCubic');
      const rx = lerp(cx0 + cw * 0.15, ex, u) + (1 - u) * Math.sin(t * 17) * 30;
      const ry = lerp(cy0 + 20, ey, u) + (1 - u) * Math.cos(t * 13) * 24;
      const lockK = lock ? F.spring((t - B1) * 1.4, 2.2, 5) : 0;
      const size = lerp(80, 40, lock ? clamp(lockK) : 0) * (lock ? 1 : 1 + (1 - u) * 0.3);
      const col = lock ? C.lsGreenDark : C.lsSlate;
      ctx.save();
      ctx.translate(rx, ry);
      ctx.rotate(lock ? (1 - clamp(lockK)) * 0.6 : t * 3);
      ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round';
      [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(([sx, sy]) => {
        ctx.beginPath();
        ctx.moveTo(sx * size, sy * size * 0.45); ctx.lineTo(sx * size, sy * size); ctx.lineTo(sx * size * 0.45, sy * size);
        ctx.stroke();
      });
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.stroke();
      ctx.restore();
      if (lock) {
        F.shockRing(ctx, ex, ey, t - B1, { r: 90, color: C.lsGreen, life: 0.4, width: 6 });
        F.sparkle(ctx, ex + 34, ey - 40, 18 * F.pop(t, B1, 0.25) * (1 - seg(t, B1 + 0.3, B1 + 0.6)), { color: C.lsGreen });
      }
    }
    // right column: ENTRY FOUND / 0.3s / LONG (beat 1)
    const colX = x + 780;
    const p1 = F.pop(t, B1, 0.32);
    if (p1 > 0) pill(ctx, 'ENTRY FOUND', colX, y + 150, { size: 30, bg: C.lsGreen, color: C.lsInk, scale: p1, shadow: true, letter: 3 });
    const p2 = F.pop(t, B1 + 0.06, 0.3);
    if (p2 > 0) {
      ctx.save(); ctx.translate(colX, y + 228); ctx.scale(p2, p2);
      const shown = (0.3 * clamp(seg(t, B1, B1 + 0.12))).toFixed(1);
      mono(ctx, shown + 's', 0, 0, 64, C.lsGreenDark, { letter: 0 });
      ctx.restore();
    }
    const p3 = F.pop(t, B1 + 0.12, 0.3);
    if (p3 > 0) pill(ctx, '▲ LONG', colX, y + 302, { size: 28, bg: C.lsMint, color: C.lsGreenDark, scale: p3, border: 'rgba(27,122,58,0.35)' });
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  function fighters(ctx, t, T) {
    // they hop up from below and land on beat 2
    const land = B2;
    const rise = seg(t, 0.32, land, 'outCubic');
    if (rise <= 0) return;
    const yOff = (1 - rise) * 560;
    const [sx, sy] = t < land ? [0.92, 1.1] : F.squash(t, land, 0.22, 0.45);
    const bob = t > land + 0.3 ? Math.sin((t - land) * 9) * 3 : 0;
    const groundY = TIMEP[1] + 96 + 6;
    // refill: 0.15 -> 1 from beat 2
    const fill = t < land ? 0.15 : lerp(0.15, 1, E.outCubic(seg(t, land, land + 0.32)));
    const blinkRed = t < land && Math.floor(t * 8) % 2 === 0;
    const tx = TIMEP[0], ty = TIMEP[1] + yOff - bob;
    // glow ring behind Time when refilling
    if (t >= land) {
      const g = 1 - seg(t, land + 0.2, land + 0.8);
      ctx.save();
      ctx.fillStyle = F.radGrad(ctx, tx, ty, 40, 210, [[0, `rgba(54,198,255,${0.45 * g})`], [1, 'rgba(54,198,255,0)']]);
      ctx.beginPath(); ctx.arc(tx, ty, 210, 0, TAU); ctx.fill();
      ctx.restore();
    }
    FILM.cast.time(ctx, {
      x: tx, y: ty, s: 0.8, sx, sy, t: T, ring: fill, crumbs: fill < 0.99,
      face: t < land ? 'shocked' : 'happy', shadow: rise > 0.9 ? groundY : undefined,
      gloves: t >= land ? { l: [tx - 140, ty - 20 - 40 * E.outBack(seg(t, land, land + 0.25))], r: [tx + 145, ty - 30 - 50 * E.outBack(seg(t, land, land + 0.25))] } : undefined,
    });
    if (blinkRed) { ctx.save(); ctx.strokeStyle = 'rgba(255,77,94,0.8)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(tx, ty, 104, 0, TAU); ctx.stroke(); ctx.restore(); }
    // sparkle burst on refill
    if (t >= land && t < land + 0.7) {
      const age = t - land;
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * TAU + 0.3;
        const d = 110 + E.outCubic(clamp(age / 0.5)) * 110;
        const r = 20 * (1 - clamp(age / 0.7)) * (0.6 + h01('sp', i) * 0.6);
        F.sparkle(ctx, tx + Math.cos(a) * d, ty + Math.sin(a) * d, r, { color: i % 2 ? C.lsGreen : C.timeCyan, rot: age * 3 });
      }
      F.shockRing(ctx, tx, ty, age, { r: 200, color: C.timeCyan, life: 0.45, width: 8 });
    }
    // биржа, calm, tidy candles
    const bx = BZP[0], by = BZP[1] + yOff * 1.08 + Math.sin(t * 7 + 1) * (t > land + 0.3 ? 3 : 0);
    const [bsx, bsy] = t < land ? [0.92, 1.1] : F.squash(t, land + 0.04, 0.2, 0.45);
    FILM.cast.birzha(ctx, { x: bx, y: by, s: 0.8, sx: bsx, sy: bsy, t: T, face: 'calm', candles: [0.55, 0.7, 0.85], shadow: rise > 0.9 ? groundY : undefined });
    // "+6h back"
    const pp = F.pop(t, land, 0.35);
    if (pp > 0) {
      const ly = TIMEP[1] - 168 - E.outCubic(seg(t, land, land + 0.6)) * 10;
      pill(ctx, '+6h back', tx, ly, { size: 38, bg: C.lsGreen, color: C.lsInk, scale: pp, shadow: true, letter: 1, pad: 26 });
    }
  }

  // ---------------------------------------------------------------------------
  function markState(t) {
    // drop in from the top, land at 0.15, bob, hop onto the #1 pill on beat 3, then zoom to the 08 hand-off.
    const LAND0 = 0.15;
    let x = MARK0[0], y = MARK0[1], s = MS, sx = 1, sy = 1, rot = 0;
    if (t < LAND0) {
      const u = t / LAND0;
      y = lerp(120, MARK0[1], u * u);
      sx = 0.86; sy = 1.18;
    } else if (t < 1.02) {
      [sx, sy] = F.squash(t, LAND0, 0.3, 0.5);
      y = MARK0[1] - Math.max(0, Math.sin((t - LAND0) * 5)) * 4 * clamp((t - 0.6) * 4);
    }
    // hop: anticipation 1.02-1.10, airborne 1.10-B3, land B3
    if (t >= 1.02 && t < 1.1) {
      const u = seg(t, 1.02, 1.1, 'outQuad');
      sx = 1 + 0.16 * u; sy = 1 - 0.18 * u; y = MARK0[1] + MR * 0.18 * u;
    } else if (t >= 1.1 && t < B3) {
      const u = (t - 1.1) / (B3 - 1.1);
      y = lerp(MARK0[1], MARK1[1], u) - Math.sin(u * Math.PI) * 150;
      sx = 0.88; sy = 1.14; rot = Math.sin(u * Math.PI) * -0.12;
    } else if (t >= B3) {
      y = MARK1[1];
      [sx, sy] = F.squash(t, B3, 0.28, 0.5);
    }
    // exit 1.5 -> end: glide to the hand-off pose
    const ex = seg(t, 1.5, 5 / 3 - 1 / 60, 'inOutCubic');
    if (ex > 0) {
      x = lerp(x, END[0], ex); y = lerp(y, END[1], ex); s = lerp(s, END_S, ex);
      sx = lerp(sx, 1, ex); sy = lerp(sy, 1, ex);
    }
    return { x, y, s, sx, sy, rot };
  }

  function drawMark(ctx, t, m) {
    const pump = F.beatPulse(t, 0, 0.14);
    const cs = [0.75 + 0.2 * pump, 1 - 0.15 * pump + 0.1 * Math.sin(t * 12), 0.6 + 0.3 * pump];
    const glow = 0.6 + 0.4 * F.beatPulse(t, 0, 0.2);
    // fall trail
    if (t < 0.15) {
      const pos = [0.5, 0.35, 0.2].map((d) => [m.x, m.y - d * 260]);
      F.motionTrail(ctx, (c, px, py) => FILM.cast.lsMark(c, { x: px, y: py, s: m.s, sx: m.sx, sy: m.sy }), pos, { alpha: 0.35 });
    }
    // feet-anchored squash: scale around the bottom edge
    const R = 120 * m.s;
    ctx.save();
    ctx.translate(m.x, m.y + R);
    ctx.rotate(m.rot);
    FILM.cast.lsMark(ctx, { x: 0, y: -R * m.sy, s: m.s, sx: m.sx, sy: m.sy, glow, candles: cs });
    ctx.restore();
  }

  function crownAndPill(ctx, t, m) {
    // "#1" pill pops on the off-beat before beat 3
    const pin = 1.0;
    const pp = F.popIn(t, pin, 0.4);
    const out = seg(t, 1.5, 5 / 3, 'inCubic');
    if (pp > 0 && out < 1) {
      const [psx, psy] = F.squash(t, B3, 0.18, 0.4);
      ctx.save();
      ctx.globalAlpha *= 1 - out;
      ctx.translate(PILL1.x, PILL1.y);
      ctx.scale(pp * psx, pp * psy);
      F.dropShadow(ctx, (c) => { F.rrect(c, -PILL1.w / 2, -PILL1.h / 2, PILL1.w, PILL1.h, PILL1.h / 2); c.fillStyle = F.linGrad(c, 0, -32, 0, 32, [C.lsGreen, C.lsGreen2]); c.fill(); }, { dy: 8, blur: 18, color: 'rgba(31,227,60,0.45)' });
      F.text(ctx, '#1', 0, 3, { size: 46, fill: C.lsInk, font: 'sans', rounded: false });
      ctx.restore();
    }
    // crown: falls from the top, lands on the mark's head on beat 3
    if (t > 0.95) {
      const R = 120 * m.s;
      const headY = m.y + R - 2 * R * m.sy; // top edge of the squashed mark
      let cy, rot = 0;
      if (t < B3) {
        const u = seg(t, 0.95, B3);
        cy = lerp(-120, headY, u * u);
        rot = (1 - u) * 1.4;
      } else {
        cy = headY + 6;
        rot = Math.sin((t - B3) * 18) * 0.12 * Math.exp(-(t - B3) * 6) - 0.1;
      }
      const cs = 0.5 * (m.s / MS);
      FILM.cast && F.crown(ctx, m.x + 10, cy, cs, { rot });
    }
  }

  function bottomNav(ctx, t) {
    // decorative app nav (icons only, below the safe area), Scan tab active
    const k = E.outBack(seg(t, 0.75, 1.15));
    if (k <= 0) return;
    const y = 1600 + (1 - k) * 360;
    ctx.save();
    softShadow(ctx, 100, y, 880, 150, 75, 0.08);
    F.card(ctx, 100, y, 880, 150, { r: 75, shadow: false });
    const xs = [210, 430, 650, 870];
    const act = F.popIn(t, 1.0, 0.4);
    if (act > 0) {
      ctx.save(); ctx.translate(xs[1], y + 75); ctx.scale(act, act);
      F.rrect(ctx, -100, -58, 200, 116, 58); ctx.fillStyle = F.linGrad(ctx, 0, -58, 0, 58, [C.lsGreen, C.lsGreen2]); ctx.fill();
      ctx.restore();
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 6;
    const cy = y + 75;
    // Today: pulse line
    ctx.strokeStyle = C.lsSlate;
    ctx.beginPath(); ctx.moveTo(xs[0] - 30, cy); ctx.lineTo(xs[0] - 12, cy); ctx.lineTo(xs[0] - 4, cy - 22); ctx.lineTo(xs[0] + 8, cy + 20); ctx.lineTo(xs[0] + 16, cy); ctx.lineTo(xs[0] + 30, cy); ctx.stroke();
    // Scan: radar icon
    ctx.strokeStyle = act > 0.5 ? C.lsInk : C.lsGreenDark;
    ctx.beginPath(); ctx.arc(xs[1], cy, 28, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(xs[1], cy, 13, 0, TAU); ctx.stroke();
    const a = t * 6;
    ctx.beginPath(); ctx.moveTo(xs[1], cy); ctx.lineTo(xs[1] + Math.cos(a) * 28, cy + Math.sin(a) * 28); ctx.stroke();
    // X-Ray: brackets
    ctx.strokeStyle = C.lsSlate;
    [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(([sx, sy]) => {
      ctx.beginPath(); ctx.moveTo(xs[2] + sx * 26, cy + sy * 10); ctx.lineTo(xs[2] + sx * 26, cy + sy * 24); ctx.lineTo(xs[2] + sx * 12, cy + sy * 24); ctx.stroke();
    });
    // You: person
    ctx.beginPath(); ctx.arc(xs[3], cy - 12, 12, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(xs[3], cy + 28, 24, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const T = info.T;
      background(ctx, t, T);
      const [shx, shy] = F.shakeMany(t, [[0.15, 0.25, 10], [B3, 0.3, 14]], 7);
      ctx.save();
      ctx.translate(shx, shy);
      header(ctx, t);
      heroCard(ctx, t);
      signalCard(ctx, t);
      fighters(ctx, t, T);
      bottomNav(ctx, t);
      const m = markState(t);
      // landing puffs
      F.puffs(ctx, MARK0[0], MARK0[1] + MR, t - 0.15, { n: 7, seed: 71, size: 30, color: 'rgba(255,255,255,0.5)' });
      if (t >= B3) F.confettiBurst(ctx, PILL1.x + 40, PILL1.y - 160, t - B3, { n: 36, seed: 77, power: 1300, colors: [C.lsGreen, C.lsGreen2, C.yellow, C.lsTealB, '#ffffff', C.timeCyan] });
      // light circle wipe into the end card, centred on the mark
      const wp = seg(t, 1.5, 5 / 3 - 1 / 60, 'inCubic');
      if (wp > 0) F.circleWipe(ctx, m.x, m.y, wp, C.lsBg, { rings: [C.lsGreen2] });
      drawMark(ctx, t, m);
      crownAndPill(ctx, t, m);
      ctx.restore();
      // continuity: the green scan beam from 06 flashes out at the bottom
      if (t < 0.25) {
        const k = 1 - seg(t, 0, 0.25, 'outCubic');
        ctx.save();
        ctx.fillStyle = `rgba(31,227,60,${0.22 * k})`;
        ctx.fillRect(0, 0, W, H);
        const by = lerp(H - 20, H + 120, 1 - k);
        ctx.fillStyle = F.linGrad(ctx, 0, by - 160, 0, by + 20, [[0, 'rgba(31,227,60,0)'], [0.85, `rgba(31,227,60,${0.8 * k})`], [1, `rgba(255,255,255,${k})`]]);
        ctx.fillRect(0, by - 160, W, 180);
        ctx.restore();
      }
    },
  });
})();

<script>
// ---- src/scenes/08-end-card.js
// 08 'end-card': liquidityscan.io. Global T 13.333 .. 15.0 (1 bar, 100 frames).
// Website-hero style (docs/brand): light grid background, soft green glow, app mark, wordmark,
// "Stop babysitting the charts.", dark START FREE button, the URL in green.
// Hand-off from 07: frame 0 shows the mark at (540, 640) s 1.4 wearing the crown, on a plain lsBg.
// Layers (back to front):
//   1 lsBg + faint grid + green glow + calm floaties
//   2 mark (settles to (540, 590) s 1.6), crown hops off and pops into sparkles
//   3 wordmark wipe (beat 1), tagline (8th after beat 1), button + URL (beat 2)
//   4 Time and биржа peek from the bottom corners, fist-pump landing on beat 3
//   Everything is frozen from HOLD (final 0.4 s is a still poster).
(function () {
  'use strict';
  const ID = 'end-card';
  const FILM = window.FILM;
  const F = FILM.fx;
  const C = F.pal;
  const E = F.E;
  const TAU = Math.PI * 2;
  const clamp = F.clamp, lerp = F.lerp, seg = F.seg;
  const BT = F.BEAT;
  const B1 = BT, B2 = BT * 2, B3 = BT * 3; // T 13.75, 14.167, 14.583
  const W = 1080, H = 1920;
  const DUR = 5 / 3;
  const HOLD = DUR - 0.4; // T 14.6: still from here

  const START = [540, 640], START_S = 1.4; // 07's last frame
  const MARK = [540, 585], MARK_S = 1.55;
  const WM_Y = 880, TAG_Y = [1032, 1112], BTN = { x: 290, y: 1188, w: 500, h: 100 }, URL_Y = 1400;
  const h01 = (...k) => F.h01(ID, ...k);

  function background(ctx, tt, T) {
    F.bgFill(ctx, C.lsBg);
    ctx.save();
    ctx.strokeStyle = 'rgba(19,40,58,0.05)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const off = (T * 12) % 90;
    for (let x = -off; x < W + 90; x += 90) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = -off; y < H + 90; y += 90) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    const g = 0.16 + 0.08 * E.outCubic(seg(tt, 0, 0.5));
    ctx.fillStyle = F.radGrad(ctx, 540, 640, 40, 820, [[0, `rgba(31,227,60,${g})`], [0.6, 'rgba(31,227,60,0.04)'], [1, 'rgba(31,227,60,0)']]);
    ctx.fillRect(0, 0, W, H);
    // a faint lilac wash at the bottom like the site hero
    ctx.fillStyle = F.linGrad(ctx, 0, 1100, 0, H, ['rgba(123,92,255,0)', 'rgba(123,92,255,0.06)']);
    ctx.fillRect(0, 1100, W, H - 1100);
    ctx.restore();
    F.floaties(ctx, { t: T, n: 9, seed: 808, colors: ['rgba(31,227,60,0.22)', 'rgba(33,83,95,0.12)', 'rgba(92,234,122,0.2)'] });
  }

  function mark(ctx, tt) {
    const u = clamp(tt / 0.42);
    const sp = F.spring(u * 0.9, 1.4, 5.5);
    const x = lerp(START[0], MARK[0], sp), y = lerp(START[1], MARK[1], sp);
    const s = lerp(START_S, MARK_S, sp);
    const [sx, sy] = F.squash(tt, 0.08, 0.14, 0.5);
    const pump = tt < HOLD ? F.beatPulse(tt, 0, 0.14) * (1 - seg(tt, 1.1, HOLD)) : 0;
    const cs = [0.75 + 0.2 * pump, 1 - 0.12 * pump, 0.6 + 0.3 * pump];
    const glow = 0.55 + 0.35 * pump;
    FILM.cast.lsMark(ctx, { x, y, s, sx, sy, glow, candles: cs });
    return { x, y, s, sy };
  }

  function crown(ctx, tt, m) {
    // sits on the head at frame 0 (07 hand-off), hops off at 0.1 and bursts into sparkles at 0.42
    const R = 120 * m.s;
    const head = m.y - R * m.sy + 6;
    const cs0 = 0.5 * (START_S / 1.05);
    if (tt < 0.42) {
      const u = seg(tt, 0.1, 0.42);
      const cx = m.x + 10 + u * 160;
      const cy = head - Math.sin(u * Math.PI * 0.9) * 200 - (u > 0 ? 0 : 0);
      const sc = cs0 * (1 - E.inBack(u) * 0.9);
      F.crown(ctx, cx, cy, Math.max(0.01, sc), { rot: -0.1 + u * 2.4 });
    }
    const age = tt - 0.42;
    if (age >= 0 && age < 0.5) {
      const bx = m.x + 170, by = head - 170;
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * TAU;
        const d = 30 + E.outCubic(clamp(age / 0.4)) * 90;
        F.sparkle(ctx, bx + Math.cos(a) * d, by + Math.sin(a) * d, 18 * (1 - age / 0.5), { color: i % 2 ? C.yellow : C.lsGreen, rot: age * 4 });
      }
    }
  }

  function wordmark(ctx, tt) {
    const p = seg(tt, B1 - 1 / 60, B1 + 0.28, 'outCubic');
    if (p <= 0) return;
    const ww = 820;
    const x0 = 540 - ww / 2 - 20;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, WM_Y - 90, (ww + 40) * p, 180);
    ctx.clip();
    const rise = (1 - p) * 18;
    FILM.cast.lsWordmark(ctx, 540, WM_Y + rise, 108);
    ctx.restore();
    // the green wipe edge
    if (p < 1) {
      const ex = x0 + (ww + 40) * p;
      F.rrect(ctx, ex - 6, WM_Y - 70, 12, 140, 6);
      ctx.fillStyle = C.lsGreen; ctx.fill();
    }
  }

  // kinetic letters (like FX.popLetters but with crisp, less fattened glyphs for the heavy site headline)
  function letters(ctx, str, x, y, tt, t0, size) {
    const chars = Array.from(str);
    ctx.save();
    ctx.font = F.font(size, 'sans', 700);
    const ws = chars.map((c) => ctx.measureText(c).width);
    ctx.restore();
    const total = ws.reduce((a, b) => a + b, 0);
    let cx = x - total / 2;
    chars.forEach((c, i) => {
      const k = F.popIn(tt, t0 + i * 0.014, 0.38);
      if (k > 0.001 && c !== ' ') {
        F.text(ctx, c, cx + ws[i] / 2, y + (1 - Math.min(1, k)) * size * 0.3, {
          size, fill: C.lsInk, font: 'sans', weight: 700, fat: 0.012, scale: k, rot: (1 - Math.min(1, k)) * (i % 2 ? 0.3 : -0.3),
        });
      }
      cx += ws[i];
    });
  }

  function tagline(ctx, tt) {
    const t0 = B1 + BT / 2; // the 8th after beat 1
    if (tt < t0 - 1e-6) return;
    letters(ctx, 'Stop babysitting', 540, TAG_Y[0], tt, t0, 74);
    letters(ctx, 'the charts.', 540, TAG_Y[1], tt, t0 + 0.12, 74);
  }

  function button(ctx, tt) {
    const k = F.popIn(tt, B2, 0.42);
    if (k <= 0) return;
    const { x, y, w, h } = BTN;
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.scale(k, k);
    F.dropShadow(ctx, (c) => { F.rrect(c, -w / 2, -h / 2, w, h, h / 2); c.fillStyle = C.lsInk; c.fill(); }, { dy: 12, blur: 22, color: 'rgba(19,40,58,0.3)' });
    F.text(ctx, 'START FREE', -26, 2, { size: 40, fill: '#ffffff', font: 'sans', weight: 700, rounded: false, letter: 9 });
    // arrow
    const ax = w / 2 - 92;
    const nudge = tt < HOLD ? Math.max(0, Math.sin((tt - B2) * TAU * 2.4)) * 6 * (1 - seg(tt, 1.1, HOLD)) : 0;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(ax + nudge, 2); ctx.lineTo(ax + 40 + nudge, 2); ctx.moveTo(ax + 24 + nudge, -14); ctx.lineTo(ax + 40 + nudge, 2); ctx.lineTo(ax + 24 + nudge, 18); ctx.stroke();
    ctx.restore();
  }

  function siteUrl(ctx, tt) {
    const k = F.popIn(tt, B2 + 0.08, 0.45);
    if (k <= 0) return;
    // a little anticipation dip into beat 3, landing (and freezing) on it
    const dip = Math.sin(seg(tt, B3 - 0.2, B3) * Math.PI) * 0.06;
    const sx = 1 + dip, sy = 1 - dip;
    F.text(ctx, 'liquidityscan.io', 540, URL_Y, { size: 82, fill: C.lsGreenDark, font: 'sans', weight: 700, scale: k, sx, sy, fat: 0.02 });
    // underline sweep
    const p = seg(tt, B2 + 0.25, B2 + 0.6, 'outCubic');
    if (p > 0) {
      F.rrect(ctx, 540 - 300, URL_Y + 58, 600 * p, 8, 4);
      ctx.fillStyle = C.lsGreen; ctx.fill();
    }
  }

  function peekers(ctx, tt, T) {
    // Time (left) and биржа (right) peek from the bottom corners, fist-pump landing on beat 3
    const raw = seg(tt, B2 + 0.1, B2 + 0.42);
    if (raw <= 0) return;
    const up = E.outBack(raw);
    const pump = seg(tt, B3 - 0.16, B3, 'outBack');
    const sx = 1, sy = 1;
    const tx = 175, ty = lerp(2010, 1660, up);
    FILM.cast.time(ctx, {
      x: tx, y: ty, s: 0.6, rot: 0.12, sx, sy, t: T, face: 'happy',
      gloves: { r: [tx + 88 + pump * 6, ty - 20 - pump * 62] },
    });
    const bx = 905, by = lerp(2010, 1660, up);
    FILM.cast.birzha(ctx, {
      x: bx, y: by, s: 0.6, rot: -0.12, sx, sy, t: T, face: 'happy', candles: [0.6, 0.75, 0.9],
      gloves: { l: [bx - 88 - pump * 6, by - 20 - pump * 62] },
    });
    if (tt >= B3) {
      const age = tt - B3;
      F.sparkle(ctx, tx + 118, ty - 120, 22 * Math.min(1, age * 30), { color: C.lsGreen });
      F.sparkle(ctx, bx - 118, by - 120, 22 * Math.min(1, age * 30), { color: C.yellow });
    }
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const tt = Math.min(t, HOLD); // freeze: the final 0.4 s is a still poster
      const T = info.shot.start + tt;
      background(ctx, tt, T);
      F.shockRing(ctx, 540, 600, tt - 0.06, { r: 420, color: C.lsGreen2, life: 0.5, width: 10 });
      const m = mark(ctx, tt);
      crown(ctx, tt, m);
      wordmark(ctx, tt);
      tagline(ctx, tt);
      button(ctx, tt);
      siteUrl(ctx, tt);
      peekers(ctx, tt, T);
    },
  });
})();

</script>
<script>
// ---- src/music.js
// music.js : the score and sound design of the film.
// Owner: music. Contract: docs/CONTRACT.md, section Audio.
//
// FILM.audio.render(ctx, { start = 0, dest = ctx.destination }) schedules the whole piece,
// music and effects, from global time `start` into any BaseAudioContext.
// Every sound is synthesised here: oscillators, periodic waves, seeded noise, filters, envelopes,
// a ping-pong delay, convolver reverbs on generated impulse responses, a glue compressor and a
// soft limiter. Randomness comes only from FILM.lib.rng, seeded per event, so any start time
// schedules the same notes at the same global times.
//
// The engine, instruments, effects and master chain below are film-agnostic. Per film the music
// agent replaces three things: the CH chord table, the MIX.ride section automation, and the whole
// score() function — composing against FILM.TIMELINE.bpm and FILM.TIMELINE.cues so hits land on
// the cuts. What ships here is a demo score that gives the stub pass a pulse; see the skill's
// reference/music.md before composing.
(function () {
  'use strict';
  const FILM = window.FILM;
  const lib = FILM.lib;
  const TAU = Math.PI * 2;
  const FLOOR = 1e-5;

  // DynamicsCompressorNode delays its output by a fixed 6 ms look-ahead (measured: 288 samples at
  // 48 kHz). Every event before the compressor is scheduled that much early, so it leaves the master
  // exactly on its cue. Only an event inside the first 6 ms of a render window can land late.
  const LAT = 0.006;

  // Mix constants, tuned by measurement (tools/audio): loudness, peaks, per-bar profile.
  const MIX = {
    trim: 0.68,
    ceiling: 0.66, // soft limiter output ceiling (about -3.6 dBFS)
    knee: 0.5,
    bus: { drums: 0.6, perc: 0.8, bass: 0.3, pad: 0.26, keys: 0.6, bells: 0.45, lead: 0.5, sfx: 0.62, amb: 0.5 },
    // Master tilt EQ in dB: a low shelf under the subs, presence and air for phone speakers.
    eq: { low: -4, presence: 5, air: 3 },
    comp: { threshold: -18, knee: 10, ratio: 2, attack: 0.006, release: 0.2 },
    // Section fader rides in dB at global times, pre-compressor: full level throughout (an ad), and
    // the end-card chord's tail faded out so it rings out cleanly by 15.0 s.
    ride: [[0, 0], [14.76, 0], [14.99, -36]],
  };

  // ---------------------------------------------------------------- pitch
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(n);
    const midi = 12 * (Number(m[3]) + 1) + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  // ---------------------------------------------------------------- envelopes
  // pts: [[dt, value, shape]] with dt from the note start; shape is the ramp INTO that point:
  // 'lin' (default), 'exp' or 'set'. The first point must sit at dt 0.
  // When the voice started before the render window (skip > 0) the value at `skip` is computed
  // and automation resumes from there, so a seek hears the same envelope.
  function setEnv(param, pts, c0, skip) {
    let i;
    let prev;
    if (skip > 0) {
      let v = pts[0][1];
      for (i = 1; i < pts.length; i++) {
        const a = pts[i - 1];
        const b = pts[i];
        if (skip < b[0]) {
          const f = (skip - a[0]) / Math.max(1e-9, b[0] - a[0]);
          const sh = b[2] || 'lin';
          if (sh === 'set') v = a[1];
          else if (sh === 'exp' && a[1] > 0) v = a[1] * Math.pow(Math.max(b[1], FLOOR) / a[1], f);
          else v = a[1] + (b[1] - a[1]) * f;
          break;
        }
        v = b[1];
      }
      param.setValueAtTime(v, c0 + skip);
      prev = v;
    } else {
      param.setValueAtTime(pts[0][1], c0);
      prev = pts[0][1];
      i = 1;
    }
    for (; i < pts.length; i++) {
      const v = pts[i][1];
      const sh = pts[i][2] || 'lin';
      const w = c0 + pts[i][0];
      if (sh === 'set') {
        param.setValueAtTime(v, w);
        prev = v;
      } else if (sh === 'exp' && prev > 0) {
        param.exponentialRampToValueAtTime(Math.max(v, FLOOR), w);
        prev = Math.max(v, FLOOR);
      } else {
        param.linearRampToValueAtTime(v, w);
        prev = v;
      }
    }
  }

  // Percussive amplitude envelope: attack then exponential decay to silence.
  const perc = (vel, att, dec) => [[0, 0], [att, vel], [att + dec, FLOOR, 'exp']];

  // ---------------------------------------------------------------- generated buffers
  function noiseBuffer(ctx, secs, channels, seed) {
    const n = Math.floor(secs * ctx.sampleRate);
    const buf = ctx.createBuffer(channels, n, ctx.sampleRate);
    for (let ch = 0; ch < channels; ch++) {
      const r = lib.rng(lib.hash('film-noise', seed, ch));
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = r() * 2 - 1;
    }
    return buf;
  }

  // Impulse response: seeded stereo noise, exponential decay to -60 dB at `secs`, a two-pole
  // lowpass that darkens over the tail, a pre-delay and a few early reflections.
  function impulse(ctx, secs, seed, o) {
    const sr = ctx.sampleRate;
    const n = Math.floor(secs * sr);
    const buf = ctx.createBuffer(2, n, sr);
    const pre = Math.floor(o.pre * sr);
    const tail = secs - o.pre;
    for (let ch = 0; ch < 2; ch++) {
      const r = lib.rng(lib.hash('film-ir', seed, ch));
      const d = buf.getChannelData(ch);
      let l1 = 0;
      let l2 = 0;
      for (let i = pre; i < n; i++) {
        const t = (i - pre) / sr;
        const u = t / tail;
        const env = Math.exp(-6.9 * u) * (t < 0.005 ? t / 0.005 : 1);
        const a = o.bright + (o.dark - o.bright) * Math.sqrt(u);
        l1 += a * (r() * 2 - 1 - l1);
        l2 += a * (l1 - l2);
        d[i] = l2 * env;
      }
      for (let k = 0; k < o.early; k++) {
        const i = pre + Math.floor((0.003 + r() * o.spread) * sr);
        if (i < n) d[i] += (r() * 2 - 1) * 0.35 * (1 - k / o.early);
      }
    }
    return buf;
  }

  // Grains rendered straight into a stereo buffer: band-passed noise flaps and clicks, or short sines.
  // g: { t, dur, amp, pan (-1..1), f, q, att, dec, sine }
  function grainBuffer(ctx, key, secs, grains) {
    const sr = ctx.sampleRate;
    const n = Math.max(1, Math.ceil(secs * sr));
    const buf = ctx.createBuffer(2, n, sr);
    const L = buf.getChannelData(0);
    const R = buf.getChannelData(1);
    const r = lib.rng(lib.hash('film-grain', key));
    for (const g of grains) {
      const i0 = Math.floor(g.t * sr);
      const m = Math.floor(g.dur * sr);
      const gl = Math.cos(((g.pan + 1) * Math.PI) / 4);
      const gr = Math.sin(((g.pan + 1) * Math.PI) / 4);
      const att = g.att || 0.002;
      const dec = g.dec || g.dur * 0.3;
      const w = (TAU * g.f) / sr;
      const al = Math.sin(w) / (2 * (g.q || 1));
      const cw = Math.cos(w);
      const a0 = 1 + al;
      let x1 = 0;
      let x2 = 0;
      let y1 = 0;
      let y2 = 0;
      const ph = r() * TAU;
      for (let k = 0; k < m; k++) {
        const j = i0 + k;
        if (j >= n) break;
        const tt = k / sr;
        let s;
        if (g.sine) s = Math.sin(ph + w * k);
        else {
          const x = r() * 2 - 1;
          s = (al * x - al * x2 + 2 * cw * y1 - (1 - al) * y2) / a0;
          x2 = x1;
          x1 = x;
          y2 = y1;
          y1 = s;
        }
        const env = tt < att ? tt / att : Math.exp(-(tt - att) / dec);
        const tailFade = k > m - 64 ? (m - k) / 64 : 1;
        const v = s * env * tailFade * g.amp;
        if (j >= 0) {
          L[j] += v * gl;
          R[j] += v * gr;
        }
      }
    }
    return buf;
  }

  // Stick-slip creak: irregular pulses, each ringing three damped wooden resonances.
  function creakBuffer(ctx, key, secs, rate0, rate1, formants) {
    const sr = ctx.sampleRate;
    const n = Math.ceil(secs * sr);
    const buf = ctx.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    const r = lib.rng(lib.hash('film-creak', key));
    let t = 0.004;
    while (t < secs - 0.01) {
      const u = t / secs;
      const swell = Math.sin(Math.PI * Math.min(1, u * 1.15)) * (0.55 + 0.45 * r());
      const i0 = Math.floor(t * sr);
      for (const [f, tau, a] of formants) {
        const m = Math.min(n - i0, Math.floor(tau * 5 * sr));
        const fj = f * (0.94 + 0.12 * r());
        for (let k = 0; k < m; k++) d[i0 + k] += swell * a * Math.exp(-k / sr / tau) * Math.sin((TAU * fj * k) / sr);
      }
      const rate = rate0 + (rate1 - rate0) * u;
      t += (1 / rate) * (0.7 + 0.6 * r());
    }
    for (let k = 0; k < 96 && k < n; k++) d[n - 1 - k] *= k / 96;
    return buf;
  }

  // Soft limiter transfer curve. The shaper is fed at half level, so the curve covers inputs up to
  // +6 dBFS: linear to the knee, then a tanh shoulder that never passes the ceiling.
  function limiterCurve(ceiling, knee) {
    const n = 16385;
    const c = new Float32Array(n);
    const room = ceiling - knee;
    for (let i = 0; i < n; i++) {
      const x = ((i / (n - 1)) * 2 - 1) * 2;
      const a = Math.abs(x);
      const y = a <= knee ? a : knee + room * Math.tanh((a - knee) / room);
      c[i] = x < 0 ? -y : y;
    }
    return c;
  }

  function periodic(ctx, n, amp) {
    const real = new Float32Array(n + 1);
    const imag = new Float32Array(n + 1);
    for (let k = 1; k <= n; k++) imag[k] = amp(k);
    return ctx.createPeriodicWave(real, imag);
  }

  // ---------------------------------------------------------------- engine
  function makeEngine(ctx, start, dest, DUR, MIX) {
    const base = ctx.currentTime;
    const E = { ctx, sr: ctx.sampleRate, start, base, DUR, duckTargets: [] };

    // A voice is a note or effect that starts at global time t0 and lasts len seconds (release included).
    // A sustained voice whose compensated start falls before the window resumes mid-envelope on time.
    // A short voice that starts inside the first 6 ms plays whole, up to 6 ms late; one that began
    // earlier is skipped.
    E.w0 = -Infinity;
    E.w1 = Infinity;
    E.voice = function (t0, len, sustain) {
      if (t0 < E.w0 || t0 >= E.w1) return null; // belongs to another scheduling window
      if (t0 >= DUR || t0 + len <= start) return null;
      const c = base + (t0 - start) - LAT;
      let c0 = c;
      let skip = 0;
      if (c < base) {
        if (sustain) skip = base - c;
        else if (t0 >= start) c0 = base;
        else return null;
      }
      return {
        c0,
        skip,
        len,
        env: (param, pts) => setEnv(param, pts, c0, skip),
        osc(node, stopDt) {
          node.start(c0 + skip);
          node.stop(c0 + Math.max(stopDt === undefined ? len : stopDt, skip + 0.002));
          return node;
        },
        buf(node, offset, stopDt) {
          const d = node.buffer.duration;
          let off = (offset || 0) + skip;
          if (node.loop) off %= d;
          else if (off >= d) return node;
          node.start(c0 + skip, off);
          node.stop(c0 + Math.max(stopDt === undefined ? len : stopDt, skip + 0.002));
          return node;
        },
      };
    };

    E.gain = (v) => {
      const g = ctx.createGain();
      g.gain.value = v === undefined ? 1 : v;
      return g;
    };
    E.osc = (type, f) => {
      const o = ctx.createOscillator();
      if (typeof type === 'string') o.type = type;
      else o.setPeriodicWave(type);
      o.frequency.value = f;
      return o;
    };
    E.filt = (type, f, q) => {
      const b = ctx.createBiquadFilter();
      b.type = type;
      b.frequency.value = f;
      b.Q.value = q === undefined ? 0.707 : q;
      return b;
    };
    E.panner = (p) => {
      const s = ctx.createStereoPanner();
      s.pan.value = p;
      return s;
    };
    E.rng = (...k) => lib.rng(lib.hash('film-score', ...k));

    // ---- master: highpass, glue compressor, trim, soft limiter, output fades
    const master = E.gain(1);
    const hp = E.filt('highpass', 26, 0.6);
    const lowShelf = E.filt('lowshelf', 140, 0.7);
    lowShelf.gain.value = MIX.eq.low;
    const presence = E.filt('peaking', 3000, 0.7);
    presence.gain.value = MIX.eq.presence;
    const air = E.filt('highshelf', 8000, 0.7);
    air.gain.value = MIX.eq.air;
    const comp = ctx.createDynamicsCompressor();
    for (const k in MIX.comp) comp[k].value = MIX.comp[k];
    const trim = E.gain(MIX.trim * 0.5);
    const lim = ctx.createWaveShaper();
    lim.curve = limiterCurve(MIX.ceiling, MIX.knee);
    lim.oversample = 'none';
    const out = E.gain(1);
    master.connect(hp);
    hp.connect(lowShelf);
    lowShelf.connect(presence);
    presence.connect(air);
    air.connect(comp);
    comp.connect(trim);
    trim.connect(lim);
    lim.connect(out);
    out.connect(dest);
    E.master = master;
    // Output fades sit after the compressor, so they use uncompensated times. The compressor's
    // first 6 ms are silent; the output then opens over 3 ms, and the last 10 ms taper to zero, so the
    // loop seam and every seek start without a click.
    out.gain.setValueAtTime(0, base);
    out.gain.setValueAtTime(0, base + LAT);
    out.gain.linearRampToValueAtTime(1, base + LAT + 0.003);
    const cEnd = base + (DUR - start);
    if (DUR - start > 0.05) {
      out.gain.setValueAtTime(1, cEnd - 0.01);
      out.gain.linearRampToValueAtTime(0, cEnd);
    }
    // Section rides on the master input, compensated like every other pre-compressor event.
    setEnv(master.gain, MIX.ride.map(([t, d], i) => [t, Math.pow(10, d / 20), i ? 'lin' : undefined]), base - start - LAT, start + LAT);

    // ---- shared buffers
    E.white = noiseBuffer(ctx, 2.5, 1, 'white');
    E.wide = noiseBuffer(ctx, 5, 2, 'wide');
    E.warmSaw = periodic(ctx, 48, (k) => Math.pow(k, -1.35) * (k > 24 ? Math.exp(-(k - 24) / 10) : 1));
    E.softSquare = periodic(ctx, 31, (k) => (k % 2 ? Math.pow(k, -1.5) : 0.04 / k));
    E.brassSaw = periodic(ctx, 40, (k) => Math.pow(k, -1.05));

    // ---- effects returns
    E.fx = {};
    const verb = (name, secs, o, ret) => {
      const c = ctx.createConvolver();
      c.buffer = impulse(ctx, secs, name, o);
      const g = E.gain(ret);
      c.connect(g);
      g.connect(master);
      E.fx[name] = c;
    };
    verb('room', 0.9, { pre: 0.006, bright: 0.55, dark: 0.18, early: 10, spread: 0.035 }, 0.9);
    verb('hall', 2.8, { pre: 0.018, bright: 0.45, dark: 0.09, early: 14, spread: 0.07 }, 0.9);
    verb('cave', 6.0, { pre: 0.03, bright: 0.35, dark: 0.05, early: 18, spread: 0.12 }, 0.85);

    // Ping-pong delay, a dotted 8th (0.375 s) each side.
    const dIn = E.gain(1);
    dIn.channelCount = 1;
    dIn.channelCountMode = 'explicit';
    const dL = ctx.createDelay(1);
    const dR = ctx.createDelay(1);
    dL.delayTime.value = 0.375;
    dR.delayTime.value = 0.375;
    const fL = E.filt('lowpass', 4200, 0.5);
    const fR = E.filt('lowpass', 3400, 0.5);
    const gL = E.gain(0.4);
    const gR = E.gain(0.4);
    dIn.connect(dL);
    dL.connect(fL);
    fL.connect(gL);
    gL.connect(dR);
    dR.connect(fR);
    fR.connect(gR);
    gR.connect(dL);
    const mrg = ctx.createChannelMerger(2);
    fL.connect(mrg, 0, 0);
    fR.connect(mrg, 0, 1);
    const dRet = E.gain(0.75);
    mrg.connect(dRet);
    dRet.connect(master);
    const dVerb = E.gain(0.25);
    dRet.connect(dVerb);
    dVerb.connect(E.fx.hall);
    E.fx.delay = dIn;

    // ---- buses
    E.bus = {};
    // Per-voice sends pass through a tap scaled by the bus gain, so a bus fader moves its reverb too.
    E.tap = {};
    const taps = (name) => {
      E.tap[name] = {};
      for (const k of ['room', 'hall', 'cave', 'delay']) {
        const g = E.gain(MIX.bus[name]);
        g.connect(E.fx[k]);
        E.tap[name][k] = g;
      }
    };
    const bus = (name, sends, duck, hpf) => {
      taps(name);
      const b = E.gain(MIX.bus[name]);
      let tail = b;
      if (hpf) {
        const h = E.filt('highpass', hpf, 0.6);
        tail.connect(h);
        tail = h;
      }
      if (duck) {
        const d = E.gain(1);
        b.connect(d);
        tail = d;
        E.duckTargets.push(d.gain);
      }
      tail.connect(master);
      for (const k in sends) {
        const s = E.gain(sends[k]);
        tail.connect(s);
        s.connect(E.fx[k]);
      }
      E.bus[name] = b;
    };
    // Drum bus: a gentle saturator adds harmonics so the kick reads on phone speakers.
    {
      const b = E.gain(MIX.bus.drums);
      const drive = E.gain(1.6);
      const sat = ctx.createWaveShaper();
      const curve = new Float32Array(2049);
      for (let i = 0; i < curve.length; i++) {
        const x = (i / (curve.length - 1)) * 2 - 1;
        curve[i] = Math.tanh(x * 1.4) / Math.tanh(1.4);
      }
      sat.curve = curve;
      const back = E.gain(0.72);
      b.connect(drive);
      drive.connect(sat);
      sat.connect(back);
      back.connect(master);
      const rs = E.gain(0.1);
      back.connect(rs);
      rs.connect(E.fx.room);
      E.bus.drums = b;
      taps('drums');
    }
    bus('perc', { room: 0.1 });
    bus('bass', {}, true);
    bus('pad', { hall: 0.22 }, true, 180);
    bus('keys', { room: 0.12, hall: 0.14, delay: 0.06 });
    bus('bells', { hall: 0.3, cave: 0.06, delay: 0.14 });
    bus('lead', { hall: 0.22, delay: 0.18 });
    bus('sfx', { room: 0.14 });
    bus('amb', { hall: 0.12 });

    // Route a voice's last node to a bus, with an optional pan and extra sends.
    E.out = (node, busName, o) => {
      o = o || {};
      let n = node;
      if (o.pan) {
        const p = E.panner(o.pan);
        n.connect(p);
        n = p;
      }
      n.connect(E.bus[busName]);
      for (const k of ['room', 'hall', 'cave', 'delay']) {
        if (o[k]) {
          const s = E.gain(o[k]);
          n.connect(s);
          s.connect(E.tap[busName][k]);
        }
      }
      return n;
    };

    // Looping noise source with a per-event deterministic read offset.
    E.noise = (V, key, stereo) => {
      const s = ctx.createBufferSource();
      s.buffer = stereo ? E.wide : E.white;
      s.loop = true;
      const off = ((lib.hash('film-nz', key) % 100003) / 100003) * s.buffer.duration;
      return V.buf(s, off);
    };

    // Sidechain-style pump: a decaying negative curve added to the pad and bass bus gains on a kick.
    const duckLen = 0.32;
    E.duckBuf = ctx.createBuffer(1, Math.floor(duckLen * E.sr), E.sr);
    {
      const d = E.duckBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        const t = i / E.sr;
        d[i] = -(t < 0.006 ? t / 0.006 : Math.exp(-(t - 0.006) / 0.085)) * (i > d.length - 48 ? (d.length - i) / 48 : 1);
      }
    }
    E.duck = (t, depth) => {
      const V = E.voice(t, duckLen, false);
      if (!V) return;
      const s = ctx.createBufferSource();
      s.buffer = E.duckBuf;
      for (const p of E.duckTargets) {
        const g = E.gain(depth);
        s.connect(g);
        g.connect(p);
      }
      V.buf(s, 0);
    };
    return E;
  }

  // ---------------------------------------------------------------- instruments
  function instruments(E) {
    const ctx = E.ctx;
    const I = {};

    // Felt, full, heartbeat or thud kick: a pitch-dropping sine with a short filtered click.
