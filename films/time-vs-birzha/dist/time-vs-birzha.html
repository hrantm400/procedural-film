    const [cx, cy] = o.center;
    for (let i = 0; i < o.diagonals; i++) {
      const a = r.range(0, Math.PI);
      const ox = cx + r.range(-0.35, 0.35) * w, oy = cy + r.range(-0.3, 0.3) * h;
      const L = Math.hypot(w, h);
      g.beginPath();
      g.moveTo(ox - Math.cos(a) * L, oy - Math.sin(a) * L);
      g.lineTo(ox + Math.cos(a) * L, oy + Math.sin(a) * L);
      g.lineWidth = r.range(0.8, 1.3);
      g.strokeStyle = lib.rgba(line, r.range(0.07, 0.14));

      g.stroke();

    g.setLineDash([]);
    // guide circles
    const minDim = Math.min(w, h);
    for (let i = 0; i < o.circles; i++) {
      const rad = minDim * (0.2 + i * 0.17) * r.range(0.95, 1.05);
      g.beginPath();
      g.arc(cx, cy, rad, 0, TAU);
      g.lineWidth = i === o.circles - 1 ? 1.4 : 1;

      g.stroke();

    g.setLineDash([]);
    if (o.circles > 0) {

      const sr = minDim * r.range(0.07, 0.12);
      g.beginPath();
      g.arc(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, sr, 0, TAU);
      g.lineWidth = 1;
      g.strokeStyle = lib.rgba(line, 0.14);
      g.stroke();
      // centre crosshair
      g.beginPath();
      g.moveTo(cx - 18, cy);
      g.lineTo(cx + 18, cy);
      g.moveTo(cx, cy - 18);
      g.lineTo(cx, cy + 18);
      g.strokeStyle = lib.rgba(line, 0.22);
      g.stroke();

      g.lineWidth = 1.2;
      const m = 34, s = 22;
      for (const [mx, my, sx, sy] of [[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]]) {
        g.beginPath();
        g.moveTo(mx, my + sy * s);
        g.lineTo(mx, my);
        g.lineTo(mx + sx * s, my);
        g.stroke();
      }

    // faint scattered star specks
    const sp = new Path2D();
    for (let i = 0; i < (w * h) / 5000 * o.noise; i++) {
      const x = r() * w, y = r() * h, rad = r.range(0.4, 1.1);
      sp.moveTo(x + rad, y);

  /**
   * stripes(ctx, opts) : the wide diagonal stripe background with softly irregular edges.
   *   colors   [pal.stripeCream, pal.stripeYellow]
   *   width    140     band width (px); both colours use it
   *   angle    -0.52   stripe direction (radians): 30 degrees rising left to right
   *   offset   0       scroll along the normal (animate this)
   *   wobble   1.4     edge irregularity (px)
   *   bounds   frame
   *   seed     21
   */
  function stripes(ctx, o = {}) {
    const B = normBounds(o.bounds);
    const cols = o.colors || [pal.stripeCream, pal.stripeYellow];
    const sw = o.width || 140;
    const angle = o.angle != null ? o.angle : -0.52;
    const offset = o.offset || 0;
    const wobble = o.wobble != null ? o.wobble : 1.4;
    const seed = seedInt(o.seed === undefined ? 21 : o.seed);
    const dx = Math.cos(angle), dy = Math.sin(angle);
    const nx = -dy, ny = dx;
    const cx = B.x + B.w / 2, cy = B.y + B.h / 2;
    const half = Math.hypot(B.w, B.h) / 2 + sw * 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(B.x, B.y, B.w, B.h);
    ctx.clip();
    ctx.fillStyle = cols[0];
    ctx.fillRect(B.x, B.y, B.w, B.h);
    const period = sw * cols.length;
    const shift = ((offset % period) + period) % period;
    const edge = (v, k, forward) => {
      const pts = [];
      const n = Math.ceil((half * 2) / 40);
      for (let i = 0; i <= n; i++) {
        const u = -half + (i / n) * half * 2;
        const vv = v + wobble * noise1(u * 0.012 + k * 3.7, seed) + wobble * 0.3 * noise1(u * 0.05, seed + k);
        pts.push([cx + dx * u + nx * vv, cy + dy * u + ny * vv]);
      }
      if (!forward) pts.reverse();
      return pts;
    };
    for (let ci = 1; ci < cols.length; ci++) {
      const p = new Path2D();
      const first = Math.floor((-half - shift) / period) - 1;
      const last = Math.ceil((half - shift) / period) + 1;
      for (let k = first; k <= last; k++) {
        const v0 = k * period + shift + sw * ci - half * 0;
        const a = edge(v0, k * 2 + ci, true);
        const b = edge(v0 + sw, k * 2 + ci + 1, false);
        a.forEach((pt, i) => (i === 0 ? p.moveTo(pt[0], pt[1]) : p.lineTo(pt[0], pt[1])));
        b.forEach((pt) => p.lineTo(pt[0], pt[1]));
        p.closePath();
      }
      ctx.fillStyle = cols[ci];
      ctx.fill(p);
    }
    ctx.restore();
  }

  // ===========================================================================
  // Schematic helpers
  // ===========================================================================

  /**
   * hexLattice(ctx, clip, opts) : hexagonal cell lattice with shared, slightly irregular vertices.
   *   r         16       cell circumradius (px)
   *   pointy    true     pointy-top cells (false = flat-top)
   *   width     1
   *   color     pal.lavender
   *   alpha     0.35
   *   jitter    1.0      vertex irregularity (px), shared by neighbouring cells
   *   inset     0        >0 draws each cell as its own hexagon shrunk by this many px
   *   cellFn    null     fn(cx, cy, i, j) => false (skip) | true | { fill, alpha, stroke }
   *   dots      0        radius of a dot at each cell centre (0 = none)
   *   boilAmp   0.35
   *   clip      true     hard-clip to the shape
   *   bounds    frame    when clip is a function, Path2D or null
   *   seed      17
   */
  function hexLattice(ctx, clip, o = {}) {
    const shape = shapeOf(clip, Object.assign({ pad: (o.r || 16) * 2 }, o));
    const R = o.r || 16;
    const pointy = o.pointy !== false;
    const seed = seedInt(o.seed === undefined ? 17 : o.seed);
    const jitter = o.jitter != null ? o.jitter : 1.0;
    const boilAmp = o.boil === false ? 0 : o.boilAmp != null ? o.boilAmp : 0.35;
    const bi = boilIndex(o);
    const inset = o.inset || 0;
    const B = shape.bounds;
    const sq3 = Math.sqrt(3);
    const colW = pointy ? sq3 * R : 1.5 * R;
    const rowH = pointy ? 1.5 * R : sq3 * R;
    const vtx = (x, y) => {
      const kx = Math.round(x * 4), ky = Math.round(y * 4);
      const jx = (h3(kx, ky, seed) - 0.5) * 2 * jitter + (boilAmp ? (h3(kx, ky, seed + bi * 13 + 1) - 0.5) * 2 * boilAmp : 0);
      const jy = (h3(ky, kx, seed + 2) - 0.5) * 2 * jitter + (boilAmp ? (h3(ky, kx, seed + bi * 17 + 3) - 0.5) * 2 * boilAmp : 0);
      return [x + jx, y + jy];
    };
    const edges = new Path2D();
    const dots = new Path2D();
    const fills = [];
    const i0 = Math.floor(B.y / rowH) - 1, i1 = Math.ceil((B.y + B.h) / rowH) + 1;
    const j0 = Math.floor(B.x / colW) - 1, j1 = Math.ceil((B.x + B.w) / colW) + 1;
    for (let i = i0; i <= i1; i++) {
      for (let j = j0; j <= j1; j++) {
        let cx, cy;
        if (pointy) {
          cx = j * colW + (i & 1 ? colW / 2 : 0);
          cy = i * rowH;
        } else {
          cx = j * colW;
          cy = i * rowH + (j & 1 ? rowH / 2 : 0);
        }
        if (shape.polys && !polysContain(shape.polys, cx, cy)) {
          // keep cells that straddle the edge so the hard clip cuts them cleanly
          let near = false;
          for (let k = 0; k < 6 && !near; k++) {
            const a = (k / 6) * TAU + (pointy ? Math.PI / 6 : 0);
            near = polysContain(shape.polys, cx + Math.cos(a) * R, cy + Math.sin(a) * R);
          }
          if (!near) continue;
        }
        let cell = true;
        if (o.cellFn) {
          cell = o.cellFn(cx, cy, i, j);
          if (!cell) continue;
        }
        const V = [];
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * TAU + (pointy ? Math.PI / 6 : 0);
          V.push(vtx(cx + Math.cos(a) * R, cy + Math.sin(a) * R));
        }
        if (typeof cell === 'object' && cell.fill) fills.push([V, cell]);
        if (inset > 0) {
          for (let k = 0; k < 6; k++) {
            const v = V[k];
            const f = Math.max(0, 1 - inset / R);
            const x = cx + (v[0] - cx) * f, y = cy + (v[1] - cy) * f;
            if (k === 0) edges.moveTo(x, y);
            else edges.lineTo(x, y);
          }
          edges.closePath();
        } else {
          // three edges per cell so shared edges are drawn once
          const ks = pointy ? [5, 0, 1] : [0, 1, 2];
          for (const k of ks) {
            edges.moveTo(V[k][0], V[k][1]);
            edges.lineTo(V[(k + 1) % 6][0], V[(k + 1) % 6][1]);
          }
          // cells on the left/top border of the drawn set need their other edges
          if (o.cellFn || shape.polys) {
            for (const k of pointy ? [2, 3, 4] : [3, 4, 5]) {
              edges.moveTo(V[k][0], V[k][1]);
              edges.lineTo(V[(k + 1) % 6][0], V[(k + 1) % 6][1]);
            }
          }
        }
        if (o.dots) {
          dots.moveTo(cx + o.dots, cy);
          dots.arc(cx, cy, o.dots, 0, TAU);
        }
      }
    }
    ctx.save();
    if (shape.apply && o.clip !== false) shape.apply(ctx);
    const color = o.color || pal.lavender;
    const alpha = o.alpha != null ? o.alpha : 0.35;
    for (const [V, cell] of fills) {
      ctx.beginPath();
      lib.tracePath(ctx, V, true);
      ctx.globalAlpha = cell.alpha != null ? cell.alpha : 0.35;
      ctx.fillStyle = cell.fill;
      ctx.fill();
    }
    ctx.globalAlpha = alpha;
    ctx.lineWidth = o.width != null ? o.width : 1;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.stroke(edges);
    if (o.dots) {
      ctx.fillStyle = color;
      ctx.fill(dots);
    }
    ctx.restore();
  }
  lib.hexLattice = hexLattice;

  function needle(p, x0, y0, x1, y1, w0, w1) {
    const dx = x1 - x0, dy = y1 - y0;
    const L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    p.moveTo(x0 + nx * w0, y0 + ny * w0);
    p.lineTo(x1 + nx * w1, y1 + ny * w1);
    p.lineTo(x1 - nx * w1, y1 - ny * w1);
    p.lineTo(x0 - nx * w0, y0 - ny * w0);
    p.closePath();
  }

  /**
   * glowDot(ctx, x, y, r, opts) : soft glow, hot core and star rays (a nucleus, a spark, a star).
   *   color     pal.glow    glow colour
   *   core      '#ffffff'
   *   rays      8           ray count (0 = none); long and short alternate
   *   rayLen    3.4         ray length as a multiple of r
   *   rayWidth  0.22        ray base width as a multiple of r
   *   rot       0
   *   glow      4.5         glow radius as a multiple of r
   *   intensity 1
   *   twinkle   0.18        per boil drawing flicker
   *   additive  true        'lighter' blending (use false on paper)

    g.addColorStop(0, lib.rgba(color, 0.55 * k));
    g.addColorStop(0.18, lib.rgba(color, 0.22 * k));
    g.addColorStop(0.5, lib.rgba(color, 0.06 * k));
    g.addColorStop(1, lib.rgba(color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x - glowR, y - glowR, glowR * 2, glowR * 2);
    const rays = o.rays != null ? o.rays : 8;
    if (rays > 0) {
      const p = new Path2D();
      const rot = o.rot || 0;
      const rl = r * (o.rayLen != null ? o.rayLen : 3.4);
      const rw = r * (o.rayWidth != null ? o.rayWidth : 0.22);
      for (let i = 0; i < rays; i++) {
        const a = rot + (i / rays) * TAU;
        const L = (i % 2 ? 0.52 : 1) * rl * (0.9 + 0.2 * h3(i, bi, seed));
        needle(p, x, y, x + Math.cos(a) * L, y + Math.sin(a) * L, rw, 0.05);
      }
      ctx.globalAlpha = base * Math.min(1, 0.85 * k);
      ctx.fillStyle = o.core || '#ffffff';
      ctx.fill(p);
    }
    ctx.globalAlpha = base * Math.min(1, k);
    const cg = ctx.createRadialGradient(x, y, 0, x, y, r);
    cg.addColorStop(0, o.core || '#ffffff');
    cg.addColorStop(0.55, lib.rgba(o.core || '#ffffff', 0.9));
    cg.addColorStop(1, lib.rgba(color, 0));
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  lib.glowDot = glowDot;

  function ticksImpl(ctx, x, y, o) {
    const p = new Path2D();
    const pm = new Path2D();
    const n = o.n || 24;
    const len = o.len != null ? o.len : 12;
    const major = o.major || 0;
    const majorLen = o.majorLen != null ? o.majorLen : len * 1.8;
    const prog = o.p != null ? clamp(o.p) : 1;
    const count = Math.round(n * prog);
    if (o.kind === 'linear' || (o.r == null && o.length != null)) {
      const L = o.length || 300;
      const a = o.angle || 0;
      const dx = Math.cos(a), dy = Math.sin(a);
      const side = o.side || 1;
      const nx = -dy * side, ny = dx * side;
      for (let i = 0; i <= Math.round(n * prog); i++) {
        const u = (i / n) * L;
        const isMajor = major && i % major === 0;
        const l = isMajor ? majorLen : len;
        const tgt = isMajor ? pm : p;
        tgt.moveTo(x + dx * u, y + dy * u);
        tgt.lineTo(x + dx * u + nx * l, y + dy * u + ny * l);
      }
      if (o.baseline !== false) {
        pm.moveTo(x, y);
        pm.lineTo(x + dx * L * prog, y + dy * L * prog);
      }
    } else {
      const r = o.r != null ? o.r : 40;
      const a0 = (o.start || 0) + (o.rot || 0);
      const span = o.span != null ? o.span : TAU;
      const full = Math.abs(span - TAU) < 1e-6;
      const dir = o.inward ? -1 : 1;
      for (let i = 0; i < count; i++) {
        const a = a0 + (i / (full ? n : Math.max(1, n - 1))) * span;
        const isMajor = major && i % major === 0;
        const l = (isMajor ? majorLen : len) * dir;
        const tgt = isMajor ? pm : p;
        const c = Math.cos(a), s = Math.sin(a);
        tgt.moveTo(x + c * r, y + s * r);
        tgt.lineTo(x + c * (r + l), y + s * (r + l));
      }
    }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = o.color || pal.lineWhite;
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 0.6;
    ctx.lineWidth = o.width != null ? o.width : 1.5;
    ctx.stroke(p);
    ctx.lineWidth = (o.width != null ? o.width : 1.5) * 1.35;
    ctx.stroke(pm);
    ctx.restore();
  }

  /**
   * ticks(ctx, x, y, opts) : radial ticks around a circle, or a linear ruler.

      baseline: 'middle',

      tracking: 1,

  /**
   * bracket(ctx, x1, y1, x2, y2, opts) : a measurement bracket between two points.
   *   style    'dim'    'dim' = dimension line with end bars and arrow ticks, 'square' = [ shape
   *   offset   0        perpendicular offset of the bracket from the measured points (px)
   *   cap      16       end bar length
   *   color    pal.lavender
   *   alpha    0.6
   *   width    1.5
   *   label    null     text at the middle
   *   p        1        draw-on progress
   */
  lib.bracket = (ctx, x1, y1, x2, y2, o = {}) => {
    const dx = x2 - x1, dy = y2 - y1;
    const L = Math.hypot(dx, dy) || 1;
    const ux = dx / L, uy = dy / L;
    const nx = -uy, ny = ux;
    const off = o.offset || 0;
    const cap = o.cap != null ? o.cap : 16;
    const prog = o.p != null ? clamp(o.p) : 1;
    const ax = x1 + nx * off, ay = y1 + ny * off;
    const bx = x2 + nx * off, by = y2 + ny * off;
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    const h = (L / 2) * prog;
    const p = new Path2D();
    const style = o.style || 'dim';
    const labelGap = o.label ? Math.min(h * 0.9, (String(o.label).length * (o.labelSize || 22)) * 0.34 + 10) : 0;
    const sx = mx - ux * h, sy = my - uy * h, ex = mx + ux * h, ey = my + uy * h;
    if (style === 'square') {
      const sgn = off >= 0 ? -1 : 1;
      p.moveTo(sx + nx * cap * sgn, sy + ny * cap * sgn);
      p.lineTo(sx, sy);
      p.lineTo(mx - ux * labelGap, my - uy * labelGap);
      p.moveTo(mx + ux * labelGap, my + uy * labelGap);
      p.lineTo(ex, ey);
      p.lineTo(ex + nx * cap * sgn, ey + ny * cap * sgn);
    } else {
      p.moveTo(sx, sy);
      p.lineTo(mx - ux * labelGap, my - uy * labelGap);
      p.moveTo(mx + ux * labelGap, my + uy * labelGap);
      p.lineTo(ex, ey);
      p.moveTo(sx - nx * cap * 0.5, sy - ny * cap * 0.5);
      p.lineTo(sx + nx * cap * 0.5, sy + ny * cap * 0.5);
      p.moveTo(ex - nx * cap * 0.5, ey - ny * cap * 0.5);
      p.lineTo(ex + nx * cap * 0.5, ey + ny * cap * 0.5);
      const ah = Math.min(9, h * 0.3);
      p.moveTo(sx + ux * ah + nx * ah * 0.5, sy + uy * ah + ny * ah * 0.5);
      p.lineTo(sx, sy);
      p.lineTo(sx + ux * ah - nx * ah * 0.5, sy + uy * ah - ny * ah * 0.5);
      p.moveTo(ex - ux * ah + nx * ah * 0.5, ey - uy * ah + ny * ah * 0.5);
      p.lineTo(ex, ey);
      p.lineTo(ex - ux * ah - nx * ah * 0.5, ey - uy * ah - ny * ah * 0.5);
      if (off) {
        // extension lines back to the measured points
        p.moveTo(x1 + nx * Math.sign(off) * 4, y1 + ny * Math.sign(off) * 4);
        p.lineTo(ax + nx * Math.sign(off) * cap * 0.6, ay + ny * Math.sign(off) * cap * 0.6);
        p.moveTo(x2 + nx * Math.sign(off) * 4, y2 + ny * Math.sign(off) * 4);
        p.lineTo(bx + nx * Math.sign(off) * cap * 0.6, by + ny * Math.sign(off) * cap * 0.6);
      }
    }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = o.color || pal.lavender;
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 0.6;
    ctx.lineWidth = o.width != null ? o.width : 1.5;
    ctx.stroke(p);
    ctx.restore();
    if (o.label && prog > 0.6) {
      ctx.save();
      ctx.translate(mx, my);
      let a = Math.atan2(uy, ux);
      if (a > Math.PI / 2 || a < -Math.PI / 2) a += Math.PI;
      ctx.rotate(a);
      ctx.globalAlpha *= clamp((prog - 0.6) / 0.4);
      labelAt(ctx, o.label, 0, 0, Object.assign({ color: o.color || pal.lavender }, o));
      ctx.restore();
    }
  };

  /**
   * guideCircle(ctx, cx, cy, r, opts) : a faint construction circle.
   *   color pal.lavender, alpha 0.15, width 1.5, dash null ([on, off]),
   *   p 1 (draw-on progress), start -PI/2, cross 0 (centre crosshair half-size),
   *   quadrants 0 (tick length at the four quadrant points), ink false (hand-drawn via inkPath), seed
   */
  lib.guideCircle = (ctx, cx, cy, r, o = {}) => {
    const prog = o.p != null ? clamp(o.p) : 1;
    if (prog <= 0) return;
    const start = o.start != null ? o.start : -Math.PI / 2;
    const color = o.color || pal.lavender;
    const alpha = o.alpha != null ? o.alpha : 0.15;
    const width = o.width != null ? o.width : 1.5;
    ctx.save();
    if (o.ink) {
      const n = Math.max(12, Math.ceil(r * TAU * prog / 10));
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const a = start + (i / n) * TAU * prog;
        pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
      }
      inkPath(ctx, pts, { closed: prog >= 1, width: width * 1.4, color, alpha, seed: o.seed, taper: [6, 12], wobble: 1.2 });
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, r, start, start + TAU * prog);
      ctx.strokeStyle = color;
      ctx.globalAlpha *= alpha;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      if (o.dash) ctx.setLineDash(o.dash);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (o.cross || o.quadrants) {
      const p = new Path2D();
      if (o.cross) {
        p.moveTo(cx - o.cross, cy);
        p.lineTo(cx + o.cross, cy);
        p.moveTo(cx, cy - o.cross);
        p.lineTo(cx, cy + o.cross);
      }
      if (o.quadrants) {
        for (let k = 0; k < 4; k++) {
          const a = (k * Math.PI) / 2;
          const c = Math.cos(a), s = Math.sin(a);
          p.moveTo(cx + c * (r - o.quadrants), cy + s * (r - o.quadrants));
          p.lineTo(cx + c * (r + o.quadrants), cy + s * (r + o.quadrants));
        }
      }
      if (o.ink) {
        ctx.strokeStyle = color;
        ctx.globalAlpha *= alpha;
      }
      ctx.lineWidth = width;
      ctx.stroke(p);
    }
    ctx.restore();
  };

  /**
   * arcAnnotation(ctx, cx, cy, r, a0, a1, opts) : a thin coloured arc over an illustration
   * (flight paths, sound, attention), with an arrowhead and an origin dot.
   *   color pal.annMagenta, width 2, alpha 1, p 1 (draw-on progress), endTicks 8 (0 = none),
   *   arrow 0 (arrowhead size), dot 0 (origin dot radius), dash null, label null, labelOffset 26
   */
  lib.arcAnnotation = (ctx, cx, cy, r, a0, a1, o = {}) => {
    const prog = o.p != null ? clamp(o.p) : 1;
    if (prog <= 0) return;
    const color = o.color || pal.annMagenta;
    const width = o.width != null ? o.width : 2;
    const ae = a0 + (a1 - a0) * prog;
    const ccw = a1 < a0;
    ctx.save();
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 1;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.beginPath();
    ctx.arc(cx, cy, r, a0, ae, ccw);
    ctx.stroke();
    ctx.setLineDash([]);
    const et = o.endTicks != null ? o.endTicks : 8;
    if (et) {
      ctx.beginPath();
      for (const a of prog >= 1 ? [a0, ae] : [a0]) {
        ctx.moveTo(cx + Math.cos(a) * (r - et / 2), cy + Math.sin(a) * (r - et / 2));
        ctx.lineTo(cx + Math.cos(a) * (r + et / 2), cy + Math.sin(a) * (r + et / 2));
      }
      ctx.stroke();
    }
    const dot = o.dot != null ? o.dot : 0;
    if (dot) {
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a0) * r, cy + Math.sin(a0) * r, dot, 0, TAU);
      ctx.fill();
    }
    const ah = o.arrow != null ? o.arrow : 0;
    if (ah) {
      const ex = cx + Math.cos(ae) * r, ey = cy + Math.sin(ae) * r;
      const tdir = ae + (ccw ? -Math.PI / 2 : Math.PI / 2);
      const tx = Math.cos(tdir), ty = Math.sin(tdir);
      const nx = -ty, ny = tx;
      ctx.beginPath();
      ctx.moveTo(ex + tx * ah * 0.35, ey + ty * ah * 0.35);
      ctx.lineTo(ex - tx * ah * 0.75 + nx * ah * 0.45, ey - ty * ah * 0.75 + ny * ah * 0.45);
      ctx.lineTo(ex - tx * ah * 0.45, ey - ty * ah * 0.45);
      ctx.lineTo(ex - tx * ah * 0.75 - nx * ah * 0.45, ey - ty * ah * 0.75 - ny * ah * 0.45);
      ctx.closePath();
      ctx.fill();
    }
    if (o.label) {
      const am = (a0 + ae) / 2;
      const lo = o.labelOffset != null ? o.labelOffset : 26;
      lib.text(ctx, o.label, cx + Math.cos(am) * (r + lo), cy + Math.sin(am) * (r + lo), {
        size: o.labelSize || 24,
        color,
        align: 'center',
        baseline: 'middle',
        weight: 500,
      });
    }
    ctx.restore();
  };

  // ===========================================================================
  // Camera and text
  // ===========================================================================

  /**
   * camera(ctx, { x, y, zoom, rot }, fn) : draws fn(ctx) with world point (x, y) at the frame centre,
   * scaled by zoom and rotated by rot. Defaults: the frame centre, zoom 1, rot 0.
   */
  lib.camera = (ctx, cam, fn) => {
    const c = cam || {};
    const x = c.x != null ? c.x : W() / 2;
    const y = c.y != null ? c.y : H() / 2;
    ctx.save();
    ctx.translate(W() / 2, H() / 2);
    if (c.rot) ctx.rotate(c.rot);
    if (c.zoom != null && c.zoom !== 1) ctx.scale(c.zoom, c.zoom);
    ctx.translate(-x, -y);
    let out;
    try {
      out = fn(ctx);
    } finally {
      ctx.restore();
    }
    return out;
  };

  const FONT_STACK = '"SF Pro Rounded", ui-rounded, "Helvetica Neue", system-ui, -apple-system, "Segoe UI", Arial, sans-serif';

  /**
   * text(ctx, str, x, y, opts) : a thin single-line wordmark in the system sans-serif (no font files).
   *   size 42, weight 300, color pal.ink, alpha 1, align 'left', baseline 'alphabetic',
   *   tracking 0 (px number, or a css length such as '0.12em'; letterSpacing is an alias),
   *   family (system stack), p 1 (typewriter reveal fraction), italic false
   */
  const HAND_STACK = '"Chalkboard SE", "Marker Felt", "Comic Sans MS", cursive';
  lib.text = (ctx, str, x, y, o = {}) => {
    let s = String(str);
    if (o.p != null) s = s.slice(0, Math.round(s.length * clamp(o.p)));
    if (!s) return;
    ctx.save();
    ctx.font = `${o.italic ? 'italic ' : ''}${o.weight || 300} ${o.size || 42}px ${o.family || FONT_STACK}`;
    ctx.fillStyle = o.color || pal.ink;
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 1;
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.baseline || 'alphabetic';
    if ('letterSpacing' in ctx) {
      const tr = o.letterSpacing != null ? o.letterSpacing : o.tracking;
      ctx.letterSpacing = typeof tr === 'string' ? tr : `${tr || 0}px`;
    }
    ctx.fillText(s, x, y);
    ctx.restore();
  };

  // ===========================================================================
  // Read-only
  // ===========================================================================

  // A scene that changed lib, lib.pal or lib.ease would leak into every shot drawn after it, in
  // whatever order frames happen to be drawn (and differently in each render worker). So all of
  // it is frozen:
  //   - lib itself is a plain frozen object: a write throws in strict code and is ignored in
  //     non-strict code, so nothing leaks, and reading lib.fn in a hot loop stays at full speed.
  //   - pal and ease are also wrapped so a write throws even from non-strict scene code (core
  //     records it as a draw error, tools/check.cjs reports it). The wrapper makes each read about
  //     20 ns slower, so hoist colours out of per-point loops (const ink = P.ink). Code inside lib
  //     uses the raw objects and pays nothing.
  function readOnly(target, name) {
    const fail = (verb, prop) => {
      throw new TypeError(
        `${name} is read-only: a scene cannot ${verb} '${String(prop)}' (it would leak into other shots). ` +
          `Make a local copy instead, for example const P = Object.assign({}, FILM.lib.pal, { ink: '#000' }).`
      );
    };
    return new Proxy(Object.freeze(target), {
      set: (t, prop) => fail('set', prop),
      defineProperty: (t, prop) => fail('define', prop),
      deleteProperty: (t, prop) => fail('delete', prop),
      setPrototypeOf: () => fail('change the prototype of', name),
    });
  }
  for (const key of Object.keys(ease)) Object.freeze(ease[key]);
  lib.pal = readOnly(pal, 'FILM.lib.pal');
  lib.ease = readOnly(ease, 'FILM.lib.ease');
  for (const key of Object.keys(lib)) {
    const v = Object.getOwnPropertyDescriptor(lib, key).value;
    if (typeof v === 'function') Object.freeze(v);
  }
  Object.defineProperty(FILM, 'lib', { value: Object.freeze(lib), writable: false, enumerable: true, configurable: false });
})();

<script>
// ---- src/props.js
/*
 * props.js : FILM.fx, the motion-graphics kit for "Time vs биржа" (15 s, 1080x1920, 60 fps, 144 bpm).
 * Loaded after lib.js and before cast.js, the timeline and the scenes.
 *
 * Style: playful flat motion graphics. Flat fills, NO black outlines on UI, chunky rounded shapes,
 * soft drop shadows, bright brand colours, springy easing, squash and stretch.
 *
 * Everything is a pure function of its arguments. Randomness only through FILM.fx.h01(...keys)
 * (a stable hash in 0..1). Everything animates smoothly from t (this film runs on ones at 60 fps).
 *
 *   palette   FILM.fx.pal
 *   numbers   clamp, lerp, seg(t, a, b, ease), ease (= lib.ease), h01, spring, pop, popIn, squash,
 *             shake, wobble, beatPulse, beat(n) (seconds of n beats), BEAT, BAR
 *   paths     rrect, ellipse, poly, curve, star, squircle
 *   drawing   fill(ctx, color, shadow?), dropShadow(ctx, drawFn, o), linGrad, radGrad
 *   bg        bgFill, dotGrid, floaties (drifting confetti shapes), stripes, sunburst, circleWipe
 *   effects   speedLines, focusLines, burst, sparkle, sparkles, confettiBurst, puffs, dustCloud,
 *             shockRing, impactStar, dizzyStars, sweat, anger, motionTrail
 *   text      font, text, measure, popLetters, typeOn, label
 *   UI        card, phone, statusBar, appIcon, badge, notif, tab, searchBar, cursor, spinner,
 *             progress, toggle, healthBar, chartGrid, candle, candles, crown, podium, button
 *
 * Safe area for must-read text: x 80..1000, y 220..1540 (the bottom 380 px belong to the Shorts/Reels
 * UI; keep text out of the right-hand strip x > 920 below y 1100 as well).
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  const L = FILM.lib;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const h01 = (...k) => (L.hash(...k) >>> 0) / 4294967296;
  const E = L.ease;

  // ---------------------------------------------------------------------------
  // Palette
  // ---------------------------------------------------------------------------
  const pal = {
    ink: '#1b1530', ink2: '#3a3358', white: '#ffffff', paper: '#fffaf2', cream: '#fff3e2',
    lilac: '#ece6ff', mint: '#dcf7ec', sky: '#e2f0ff', peach: '#ffe5d9', lemon: '#fff3c4', blush: '#ffd6e4',
    night: '#141a33', night2: '#1e2547', night3: '#2a3366', grid: '#2b3466', gridLight: '#e4e7f5',
    // Time (the trader's time): blues
    timeBlue: '#3b6cff', timeCyan: '#36c6ff', timeDeep: '#2448c9', timeNavy: '#1d2b6b', timeTrack: '#d7e0ff',
    timeFace: '#ffffff', timeTick: '#b9c8ff', timeGlove: '#36c6ff', timeGlove2: '#1f9fe0',
    // биржа (the exchange): oranges
    bzOrange: '#ff6b2c', bzRed: '#ff3b5c', bzDeep: '#c7361d', bzYellow: '#ffc53d', bzGlove: '#ffc53d', bzGlove2: '#f39a1c',
    bzMouth: '#3a0f1f',
    // market
    up: '#22c977', down: '#ff4d5e',
    // LiquidityScan brand (from the app and liquidityscan.io)
    lsGreen: '#1fe33c', lsGreen2: '#5cea7a', lsGreenDark: '#1b7a3a', lsTealA: '#13303e', lsTealB: '#21535f',
    lsInk: '#13283a', lsSlate: '#4a5a68', lsBg: '#eef3f7', lsCard: '#ffffff', lsMint: '#dfeee5',
    // accents
    yellow: '#ffd23f', pink: '#ff6fb5', purple: '#7b5cff', green: '#22c977', red: '#ff4d5e', orange: '#ff8a3d',
    shadow: 'rgba(27,21,48,0.20)', shadowSoft: 'rgba(27,21,48,0.10)',

  Object.freeze(pal);

  // ---------------------------------------------------------------------------
  // Numbers and motion
  // ---------------------------------------------------------------------------
  const BPM = 144;
  const BEAT = 60 / BPM; // 0.41667 s = 25 frames at 60 fps
  const BAR = BEAT * 4; // 1.6667 s = 100 frames
  const beat = (n) => n * BEAT;
  const seg = (t, a, b, e) => {
    const u = clamp((t - a) / (b - a || 1e-9));

  };

  /** pop(t, t0, dur=0.3): 0 before t0, then outBack 0 -> 1. Visible on the t0 frame. */
  function pop(t, t0, dur = 0.3) {
    if (t < t0 - 1e-6) return 0;
    return E.outBack(clamp((t - t0 + 1 / 60) / dur));
  }
  /** popIn(t, t0, dur=0.45): elastic scale 0 -> 1 (springier than pop). */

  /**
   * squash(t, t0, amount=0.25, dur=0.5): [sx, sy] impact squash that springs back.

  function squash(t, t0, amount = 0.25, dur = 0.5) {

    return [1 + amount * k, 1 - amount * k];

  /** shake(t, t0, dur, amp=16, seed=1): smooth decaying camera shake [dx, dy]. */
  function shake(t, t0, dur, amp = 16, seed = 1) {
    if (t < t0 || t > t0 + dur) return [0, 0];
    const k = Math.pow(1 - (t - t0) / dur, 2);
    const p1 = h01('sk', seed, 1) * TAU, p2 = h01('sk', seed, 2) * TAU;
    const x = Math.sin(t * 61 + p1) * 0.6 + Math.sin(t * 97 + p2) * 0.4;
    const y = Math.cos(t * 53 + p2) * 0.6 + Math.sin(t * 83 + p1) * 0.4;
    return [x * amp * k, y * amp * k];
  }
  /** shakeMany(t, [[t0, dur, amp], ...], seed) */
  function shakeMany(t, list, seed = 1) {
    let x = 0, y = 0;
    list.forEach((s, i) => { const d = shake(t, s[0], s[1], s[2], seed + i * 13); x += d[0]; y += d[1]; });
    return [x, y];
  }
  /** wobble(t, freq, amp, seed): smooth sine wobble. */
  const wobble = (t, freq = 1, amp = 1, seed = 0) => Math.sin(t * freq * TAU + h01('wb', seed) * TAU) * amp;
  /** beatPulse(t, offset=0, decay=0.12): 1 on every beat (relative to offset) decaying to 0. */
  function beatPulse(t, offset = 0, decay = 0.12) {
    const u = (((t - offset) % BEAT) + BEAT) % BEAT;
    return Math.exp(-u / decay);
  }

  // ---------------------------------------------------------------------------
  // Paths and fills
  // ---------------------------------------------------------------------------
  function rrect(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function ellipse(ctx, x, y, rx, ry, rot = 0) {
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU);
  }
  function poly(ctx, pts, closed = true) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (closed) ctx.closePath();
  }
  /** smooth curve through points (quadratic midpoints) */
  function curve(ctx, pts, closed = true) {
    const n = pts.length;
    ctx.beginPath();
    if (n < 3) { poly(ctx, pts, closed); return; }
    if (closed) {
      ctx.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[(i + 1) % n];
        ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
      }
      ctx.closePath();
    } else {
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < n - 1; i++) {
        const p = pts[i], q = pts[i + 1];
        ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
      }
      ctx.lineTo(pts[n - 1][0], pts[n - 1][1]);
    }
  }
  function star(ctx, cx, cy, rOut, rIn, n, rot = -Math.PI / 2) {
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 ? rIn : rOut;
      const a = rot + (i / (n * 2)) * TAU;
      if (i === 0) ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      else ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    ctx.closePath();
  }
  /** squircle (superellipse-ish rounded square) centred at (cx, cy), half-size r, roundness k (0.5..0.9) */
  function squircle(ctx, cx, cy, r, k = 0.62) {
    rrect(ctx, cx - r, cy - r, r * 2, r * 2, r * k);
  }
  /** fill the current path; o.shadow draws an offset soft copy first ({ dx, dy, color, blur }) */
  function fill(ctx, color) {
    ctx.fillStyle = color;
    ctx.fill();
  }
  /**
   * dropShadow(ctx, draw, o{ dx=0, dy=14, blur=24, color }): runs draw(ctx) once with a canvas shadow.
   * Cheap enough for cards and characters; avoid on full-frame shapes.
   */
  function dropShadow(ctx, draw, o = {}) {
    ctx.save();
    ctx.shadowColor = o.color || pal.shadow;
    ctx.shadowBlur = (o.blur == null ? 24 : o.blur) * (FILM.S || 1);
    ctx.shadowOffsetX = (o.dx || 0) * (FILM.S || 1);
    ctx.shadowOffsetY = (o.dy == null ? 14 : o.dy) * (FILM.S || 1);
    draw(ctx);
    ctx.restore();
  }
  function linGrad(ctx, x0, y0, x1, y1, stops) {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    stops.forEach((c, i) => g.addColorStop(Array.isArray(c) ? c[0] : i / (stops.length - 1), Array.isArray(c) ? c[1] : c));
    return g;
  }
  function radGrad(ctx, x, y, r0, r1, stops) {
    const g = ctx.createRadialGradient(x, y, r0, x, y, r1);
    stops.forEach((c, i) => g.addColorStop(Array.isArray(c) ? c[0] : i / (stops.length - 1), Array.isArray(c) ? c[1] : c));
    return g;
  }

  // ---------------------------------------------------------------------------
  // Backgrounds
  // ---------------------------------------------------------------------------
  /** bgFill(ctx, color | [top, bottom]): fills the whole frame (with margin for camera shake). */
  function bgFill(ctx, c) {
    ctx.save();
    ctx.fillStyle = Array.isArray(c) ? linGrad(ctx, 0, 0, 0, FILM.H, c) : c;
    ctx.fillRect(-200, -200, FILM.W + 400, FILM.H + 400);
    ctx.restore();
  }
  /** dotGrid(ctx, o{ step, r, color, ox, oy }): subtle dot pattern over the frame. */
  function dotGrid(ctx, o = {}) {
    const st = o.step || 54, r = o.r || 3.2;

    if (jaw > 0.01) {
      F.rrect(ctx, -R * 0.97, splitY - R * 0.1, R * 1.94, drop + R * 0.4, R * 0.1);
      ctx.fillStyle = col(C.bzMouth);
      ctx.fill();
    }
    // upper part
    ctx.save();
    ctx.beginPath(); ctx.rect(-R * 1.2, -R * 1.2, R * 2.4, R * 1.2 + splitY); ctx.clip();
    F.rrect(ctx, -R, -R, R * 2, R * 2, R * k);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
    // lower jaw
    ctx.save();
    ctx.translate(0, drop);
    ctx.beginPath(); ctx.rect(-R * 1.2, splitY, R * 2.4, R * 1.3); ctx.clip();
    F.rrect(ctx, -R, -R, R * 2, R * 2, R * k);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
    if (!SIL) {
      // the candle chart: closed = the logo's chart; open = teeth standing on the lower jaw
      const hs = o.candles || [0.55 + 0.12 * Math.sin(t * 5), 0.35 + 0.1 * Math.sin(t * 6 + 1), 0.75 + 0.12 * Math.sin(t * 4.3 + 2)];
      const cols = ['#33e08a', '#ff5a6e', '#33e08a'];
      const baseY = R * 0.74 + drop;
      const cw = R * 0.22;
      F.rrect(ctx, -R * 0.74, R * 0.1 + drop, R * 1.48, R * 0.72, R * 0.18);
      ctx.fillStyle = C.bzMouth;
      ctx.fill();
      [-1, 0, 1].forEach((i, n) => {
        const cx = i * R * 0.42;
        const h = R * (0.14 + hs[n] * 0.36);
        const top = baseY - h;
        ctx.strokeStyle = cols[n];
        ctx.lineWidth = R * 0.045;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(cx, top - R * 0.07); ctx.lineTo(cx, baseY + R * 0.04); ctx.stroke();
        F.rrect(ctx, cx - cw / 2, top, cw, h, R * 0.045);
        ctx.fillStyle = cols[n];
        ctx.fill();
      });
      eyes(ctx, R, o, bzSpec);
      if (o.face === 'happy' || o.face === 'laugh' || o.face === 'smug') {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        F.ellipse(ctx, -R * 0.62, -R * 0.02, R * 0.12, R * 0.07); ctx.fill();
        F.ellipse(ctx, R * 0.62, -R * 0.02, R * 0.12, R * 0.07); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.ellipse(-R * 0.6, -R * 0.8, R * 0.2, R * 0.07, -0.35, 0, TAU); ctx.fill();
    }
    ctx.restore();
    anchors.eyeL = W(-bzSpec.ex * R, bzSpec.ey * R);
    anchors.eyeR = W(bzSpec.ex * R, bzSpec.ey * R);
    anchors.mouth = W(0, splitY + drop * 0.5);
    drawGloves(ctx, o, R, W, anchors, [C.bzGlove, C.bzGlove2]);
    ctx.restore();
    SIL = null;
    return anchors;
  }

  // ---------------------------------------------------------------------------
  // LiquidityScan
  // ---------------------------------------------------------------------------
  /**
   * lsMark(ctx, o{ x, y, s, rot, alpha, glow (0..1), candles: [h1,h2,h3] 0..1, dark (dark tile) }):
   * the app mark: rounded light tile, green "L", three green candlesticks, slate "S". 240 px at s=1.
   */
  function lsMark(ctx, o = {}) {
    const R = 120 * (o.s == null ? 1 : o.s);
    ctx.save();
    if (o.alpha != null) ctx.globalAlpha *= clamp(o.alpha);
    ctx.translate(o.x, o.y);
    if (o.rot) ctx.rotate(o.rot);
    ctx.scale(o.sx || 1, o.sy || 1);
    if (o.glow) {
      ctx.fillStyle = F.radGrad(ctx, 0, 0, R * 0.6, R * 2.2, [[0, `rgba(31,227,60,${0.45 * o.glow})`], [1, 'rgba(31,227,60,0)']]);
      ctx.beginPath(); ctx.arc(0, 0, R * 2.2, 0, TAU); ctx.fill();
    }
    F.dropShadow(ctx, (c) => {
      F.rrect(c, -R, -R, R * 2, R * 2, R * 0.42);
      c.fillStyle = o.dark ? F.linGrad(c, 0, -R, 0, R, [C.lsTealB, C.lsTealA]) : F.linGrad(c, -R, -R, R, R, ['#ffffff', '#e3eaee']);
      c.fill();
    }, { dy: R * 0.08, blur: R * 0.25, color: 'rgba(19,40,58,0.25)' });
    if (!o.dark) { F.rrect(ctx, -R, -R, R * 2, R * 2, R * 0.42); ctx.strokeStyle = 'rgba(19,40,58,0.08)'; ctx.lineWidth = R * 0.02; ctx.stroke(); }
    const sz = R * 0.95;
    // L
    F.text(ctx, 'L', -R * 0.5, R * 0.04, { size: sz, fill: C.lsGreenDark, font: 'sans', weight: 700, rounded: false });
    // S
    F.text(ctx, 'S', R * 0.52, R * 0.04, { size: sz, fill: o.dark ? '#e8eef2' : C.lsSlate, font: 'sans', weight: 700, rounded: false });
    // three candles between
    const hs = o.candles || [0.75, 1, 0.6];
    [-1, 0, 1].forEach((i, n) => {
      const cx = i * R * 0.13;
      const h = R * 0.62 * hs[n];
      const cy = R * 0.04;
      ctx.strokeStyle = C.lsGreenDark;
      ctx.lineWidth = R * 0.03;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx, cy - h * 0.7); ctx.lineTo(cx, cy + h * 0.7); ctx.stroke();
      F.rrect(ctx, cx - R * 0.045, cy - h * 0.45, R * 0.09, h * 0.9, R * 0.03);
      ctx.fillStyle = n === 1 ? C.lsGreen : '#2fbf4f';
      ctx.fill();
    });
    ctx.restore();
    return { R, c: [o.x, o.y] };
  }

  /**
   * lsWordmark(ctx, x, y, size, o{ align, style: 'two-tone' | 'candles', dark, alpha, scale }):
   * "LiquidityScan" (Liquidity in ink, Scan in slate) or the app header "Liqui|||Scan" with the
   * green candle glyph. Centred by default. Returns the width.
   */
  function lsWordmark(ctx, x, y, size, o = {}) {
    ctx.save();
    if (o.alpha != null) ctx.globalAlpha *= clamp(o.alpha);
    const dark = !!o.dark;
    if (o.style === 'candles') {
      const a = 'Liqui', b = 'Scan';
      const wa = F.measure(ctx, a, size, 'sans'), wb = F.measure(ctx, b, size, 'sans');
      const gw = size * 0.55;
      const total = wa + gw + wb;
      let cx = o.align === 'left' ? x : x - total / 2;
      F.text(ctx, a, cx + wa / 2, y, { size, fill: C.lsGreenDark, font: 'sans', rounded: false });
      cx += wa;
      [0.7, 1, 0.55].forEach((h, n) => {
        const px = cx + gw * (0.2 + n * 0.3);
        ctx.strokeStyle = C.lsGreenDark; ctx.lineWidth = size * 0.05; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(px, y - size * 0.5 * h); ctx.lineTo(px, y + size * 0.42 * h); ctx.stroke();
        F.rrect(ctx, px - size * 0.07, y - size * 0.32 * h, size * 0.14, size * 0.6 * h, size * 0.04);
        ctx.fillStyle = n === 1 ? C.lsGreen : '#2fbf4f'; ctx.fill();
      });
      cx += gw;
      F.text(ctx, b, cx + wb / 2, y, { size, fill: dark ? '#ffffff' : C.lsInk, font: 'sans', rounded: false });
      ctx.restore();
      return total;
    }
    const a = 'Liquidity', b = 'Scan';
    const wa = F.measure(ctx, a, size, 'sans') - size * 0.07, wb = F.measure(ctx, b, size, 'sans') - size * 0.07;
    const total = wa + wb;
    const x0 = o.align === 'left' ? x : x - total / 2;
    F.text(ctx, a, x0, y, { size, fill: dark ? '#ffffff' : C.lsInk, font: 'sans', rounded: false, align: 'left' });
    F.text(ctx, b, x0 + wa, y, { size, fill: dark ? C.lsGreen : C.lsSlate, font: 'sans', rounded: false, align: 'left' });
    ctx.restore();
    return total;
  }

  /** wordmark(ctx, who 'time'|'birzha', x, y, size, o{ align, alpha, scale, color }): the two name logos. */
  function wordmark(ctx, who, x, y, size, o = {}) {
    if (who === 'time') {
      return F.text(ctx, 'Time', x, y, { size, fill: o.color || C.timeBlue, align: o.align, alpha: o.alpha, scale: o.scale, letter: -size * 0.02 });
    }
    return F.text(ctx, 'Charts', x, y, { size, fill: o.color || C.bzOrange, align: o.align, alpha: o.alpha, scale: o.scale, letter: -size * 0.02 });
  }

  FILM.cast = Object.freeze({ time, birzha, lsMark, lsWordmark, wordmark, glove });
})();
